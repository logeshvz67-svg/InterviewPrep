companies: [INFOSYS_SP, INFOSYS_DSE, PRODUCT, ALL]
infosysRelevance: "Excellent SP and DSE practice: the parking lot is the classic OOP design exercise, testing classes, enums, relationships and clean Java."
otherCompanies: "The most common beginner LLD / machine-coding practice question at product companies; also a popular OOP discussion in service-company interviews."
why: |
  **"Design a parking lot"** is the most famous low-level design question. It's popular because everyone understands parking, so the interview can focus on **how you model it in code**:
  - Which **classes** do you need, and what does each one own?
  - Which things are **enums** (vehicle types, spot sizes)?
  - How do the classes **relate** (a lot has many spots; a ticket refers to a vehicle and a spot)?
  - Where will requirements **change** (pricing rules!) and how do you keep that change in one place (**Strategy pattern**)?

  In this lesson you'll go through the full LLD template from Lesson 10 and finish with a **runnable Java skeleton** that parks vehicles, handles a full lot and calculates fees. Once you can do this one, Library Management, Movie Ticket Booking and Elevator design follow the same steps.
analogy: |
  Picture the parking at a **big mall in Bengaluru on a Saturday**.

  - At the **entry gate**, the guard sees your vehicle type, finds a suitable free spot (bikes in the bike area, cars in car bays), and gives you a **paper ticket** with the time stamped.
  - The building has **levels**; each level has **spots** of different sizes.
  - At the **exit gate**, the cashier reads the ticket, works out the **fee** from the time spent and the vehicle type, and frees your spot.
  - On weekends the mall changes the price to a **flat rate**. The guard and cashier don't change their routine; only the **rate card** on the wall is swapped. That rate card is your **PricingStrategy**.
