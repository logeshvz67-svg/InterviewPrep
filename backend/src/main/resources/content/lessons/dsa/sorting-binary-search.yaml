  modelAnswer: |
    Binary search is how we find a word in a dictionary. I open the middle; if my word comes later, I throw away the first half, otherwise the second half. Each check halves what is left, so even a million items need only about 20 checks: O(log n). It only works when the data is sorted, because otherwise the middle gives no clue. In code I keep lo and hi, compute mid as lo plus (hi minus lo) by 2 to avoid overflow, and move lo or hi past mid. Variations include lower bound for the first occurrence, searching a rotated array, and binary search on the answer, like finding the minimum speed that works.
flashcards:
  - front: "Stable sorts"
    back: "Merge, insertion, bubble, TimSort. Not stable: quick, selection, heap."
  - front: "Quick sort worst case and when"
    back: "O(n^2) when pivots are always smallest/largest (e.g. sorted input, last-element pivot)."
  - front: "What does Arrays.sort use?"
    back: "Primitives: Dual-Pivot Quicksort. Objects: TimSort (stable)."
  - front: "Lower bound template"
    back: "lo=0, hi=n; while (lo<hi) { mid; if (a[mid] < t) lo=mid+1; else hi=mid; } return lo;"
  - front: "Safe mid"
    back: "mid = lo + (hi - lo) / 2"
  - front: "Binary search on the answer: when?"
    back: "When 'if x works, every bigger (or smaller) x works': search the answer range with a canDo(mid) check."
keyTakeaways:
  - "Simple sorts are O(n^2); merge sort is always O(n log n) and stable; quick sort is fast on average but O(n^2) worst case."
  - "Java: primitives use Dual-Pivot Quicksort, objects use stable TimSort."
  - "Binary search needs sorted data and runs in O(log n); use mid = lo + (hi - lo) / 2."
  - "Pick one template and keep it consistent: inclusive hi with lo <= hi, or exclusive hi with lo < hi and hi = mid."
  - "Lower bound gives first occurrence and insert position; rotated arrays always have one sorted half."
  - "Binary search on the answer works whenever the yes/no answer flips only once."
