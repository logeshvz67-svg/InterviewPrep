infosysRelevance: "Infosys-style practice: whichever company you face first, every interview (real or mock) teaches you something. A diary turns those lessons into better answers for your SP and DSE attempts."
otherCompanies: "Useful for every company. Many candidates attend several interviews (TCS, Wipro, Cognizant, Accenture, Capgemini...). A diary makes each one better than the last."
why: |
  After an interview, most people say "it went okay" and forget the details within two days. Then in the next interview, they get a similar question and **give the same weak answer again**.

  An **interview diary** stops this. It is a simple record of:
  - the questions you faced,
  - what you actually said,
  - a better answer you wrote calmly afterwards.

  Then you **review weak answers again and again with gaps** (spaced review), until the better answer comes out naturally.

  Real interviews are expensive: you may get only a few chances. The diary makes sure **no interview is wasted**, even one that did not go well. A "failed" interview with a good diary entry is valuable practice.
analogy: |
  Think of a **cricket team's video analysis room**.

  - After a match, the analyst replays every ball where a batter got out.
  - They note: "Out to a short ball outside off stump. Twice this series."
  - In the next nets session, the batter practises exactly that ball, again and again.
  - In the next match, the bowler tries the same trick, and the batter is ready.

  Your diary is the replay room. The "short ball" is the question you answered weakly. Spaced review is the nets practice.
