keyTakeaways:
  - "break exits the innermost loop or switch; continue skips to its next round."
  - "In a for loop, continue still runs the update; in a while loop it jumps straight to the condition."
  - "Labeled break/continue control an outer loop in nested loops."
  - "return exits the whole method, which is often the cleanest way out of nested searches."
  - "Code directly after break or continue in the same block is unreachable and does not compile."
