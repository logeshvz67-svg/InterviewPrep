infosysRelevance: "Important for SP-level DSA: trees, backtracking, divide-and-conquer sorting and many dynamic programming solutions start as recursion."
otherCompanies: "Recursion output questions (factorial, Fibonacci, printing before or after the call) are common in TCS and product-company rounds; product companies build on it for trees and backtracking."
why: |
  **Recursion** means a method that **calls itself** to solve a smaller version of the same problem.

  It feels strange at first, but it is one of the most important ideas in DSA:
  - Tree and graph traversals (DFS), merge sort, quick sort, backtracking (subsets, permutations) and many dynamic programming solutions are all recursive.
  - Output questions love recursion: *"What does `fun(4)` print?"* You can only answer by tracing the **call stack**.
  - Interviewers ask *"What is a base case?"* and *"What is StackOverflowError?"* to check if you really understand it.

  The good news: every recursive method follows the same two-part recipe. Learn the recipe and the call stack picture, and recursion stops being magic.
analogy: |
  Think of **standing in a long queue at a ration shop** and wanting to know your position.

  - You cannot see the front, so you **ask the person ahead of you**: "What is your position?"
  - They do not know either, so they ask the person ahead of them, and so on. Each person is waiting for an answer (that is the **call stack** growing).
  - Finally the **first person** says "I am number 1". They do not need to ask anyone: this is the **base case**.
  - The answer travels back: "I am 2", "I am 3"... each person adds 1 to the answer they received. This is the **unwinding** of the stack.
  - If the first person also kept asking someone ahead (no base case), the asking would never stop. In Java, that is a **StackOverflowError**.
visual:
