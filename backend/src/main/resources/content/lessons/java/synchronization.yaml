predict:
  code: |
    public class Mailbox {
        private String message;
        private boolean ready = false;

        public synchronized void put(String m) {
            message = m;
            ready = true;
            notifyAll();
        }

        public synchronized String take() throws InterruptedException {
            while (!ready) {
                wait();
            }
            return message;
        }

        public static void main(String[] args) throws InterruptedException {
            Mailbox box = new Mailbox();
            Thread reader = new Thread(() -> {
                try {
                    System.out.println("Got: " + box.take());
                } catch (InterruptedException e) { }
            });
            reader.start();
            System.out.println("Main: sending");
            box.put("hello");
            reader.join();
            System.out.println("Done");
        }
    }
  expectedOutput: |
    Main: sending
    Got: hello
    Done
  explanation: |
    This order is guaranteed even with two threads. The reader can only print after `take()` returns, and `take()` keeps waiting in the while loop until `ready` is true. `ready` becomes true only in `put()`, which main calls **after** printing "Main: sending". Then `notifyAll()` wakes the reader, it re-checks `ready` (true now) and prints "Got: hello". Finally `join()` makes main wait for the reader before printing "Done". If the reader happens to call `take()` after `put()`, the loop condition is already false, it doesn't wait at all, and the output is the same.
commonMistakes:
  - "Believing count++ is one atomic step. It is read, add, write."
  - "Using volatile to fix a counter. volatile gives visibility, not atomicity; use synchronized or AtomicInteger."
  - "Calling wait() or notify() outside a synchronized block on the same object: IllegalMonitorStateException."
  - "Waiting with if (!ready) wait(); instead of while. Spurious wakeups and other consumers make the condition false again."
  - "Synchronizing two threads on different lock objects, which protects nothing."
  - "Thinking sleep() releases the lock. It does not; wait() does."
interviewBox:
  why: "Why interviewers ask this: thread-safety bugs are expensive in real systems, and these questions quickly show whether you understand shared memory or only memorised keywords."
  questions:
    - q: "What is a race condition? Give an example."
      a: "A race condition is when the result depends on the timing of threads. For example, two threads doing count++ on a shared variable. count++ is read, add, write, so both can read the same value and one update is lost. We fix it with synchronized or an AtomicInteger."
    - q: "What is the difference between synchronized and volatile?"
      a: "synchronized gives mutual exclusion and visibility: only one thread runs the block at a time, and changes are visible afterwards. volatile only gives visibility: every thread reads the latest value from main memory. volatile is good for simple flags, but it does not make count++ atomic."
    - q: "Why should wait() be called inside a while loop?"
      a: "Because a thread can wake up even when the condition is still false, either due to a spurious wakeup or because another thread consumed the item first. A while loop checks the condition again after every wakeup, so the thread only continues when it is really true."
    - q: "Difference between sleep() and wait()?"
      a: "sleep is a static method of Thread; it pauses for some time and keeps any lock it holds. wait is a method of Object; it must be called inside synchronized, it releases the lock and waits until notify or notifyAll."
    - q: "What lock does a synchronized static method use?"
      a: "It locks on the Class object, for example Counter.class, not on any instance. So a static synchronized method and an instance synchronized method do not block each other."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "count is a plain static int starting at 0, with no synchronization. Two threads each run the loop, then main joins both and prints count. What is printed?"
    code: |
      Runnable task = () -> {
          for (int i = 0; i < 100000; i++) {
              count++;
          }
      };
      // start t1 and t2 with task, then join both
      System.out.println(count);
    options:
      - "Always 200000"
      - "Always 100000"
      - "Any value up to 200000; often less, and it can change each run"
      - "Compile error: count++ is not allowed in a lambda"
    answer: 2
    explanation: "count++ is read-add-write, so increments can be lost when threads interleave. The result is unpredictable and usually below 200000. join() only waits for the threads to finish; it does not fix the lost updates. A static field can be changed inside a lambda (the 'effectively final' rule applies to local variables only)."
  - id: q2
    type: TRUE_FALSE
    prompt: "Marking count as volatile makes count++ thread-safe."
    options: ["True", "False"]
    answer: 1
    explanation: "False. volatile guarantees every thread sees the latest value, but count++ is still three steps, so two threads can still read the same value and overwrite each other. Use synchronized or AtomicInteger."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "Several consumer threads call take(). Producers call notifyAll() after adding an item. What is the bug?"
    code: |
      synchronized Item take() throws InterruptedException {
          if (queue.isEmpty()) {
              wait();
          }
          return queue.remove();
      }
    options:
      - "wait() must be called outside synchronized"
      - "It should use if/else instead of only if"
      - "It should be while (queue.isEmpty()) so the condition is re-checked after waking up"
      - "remove() cannot be used inside a synchronized method"
    answer: 2
    explanation: "After notifyAll() several consumers wake up. The first takes the item; the next one, using 'if', does not re-check and calls remove() on an empty queue. Spurious wakeups cause the same problem. A while loop re-checks. wait() must be INSIDE synchronized, so option A is backwards."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "What does this print? (Single thread, so the output is fixed.)"
    code: |
      Object lock = new Object();
      try {
          lock.wait();
      } catch (IllegalMonitorStateException e) {
          System.out.println("IllegalMonitorStateException");
      } catch (InterruptedException e) {
          System.out.println("Interrupted");
      }
    options: ["Nothing; it waits forever", "IllegalMonitorStateException", "Interrupted", "Compile error"]
    answer: 1
    explanation: "wait() may only be called by a thread that holds the object's lock (inside synchronized (lock)). Here it doesn't, so Java throws IllegalMonitorStateException right away. 'Waits forever' is tempting, but the call never gets to wait."
  - id: q5
    type: MCQ
    prompt: "Which lock does a synchronized STATIC method use?"
    code: null
    options: ["this", "The Class object, e.g. Counter.class", "No lock; static methods can't be synchronized", "A new lock for each call"]
    answer: 1
    explanation: "Static methods have no 'this', so they lock on the Class object. That's why a static synchronized method and an instance synchronized method can run at the same time: they use different locks."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Fill in the keyword so the worker thread always sees the latest value of the flag."
    code: |
      private ____ boolean running = true;

      void work() {
          while (running) { /* do work */ }
      }
    acceptedAnswers: ["volatile"]
    explanation: "volatile makes reads and writes go to main memory, so when another thread sets running = false, the worker sees it and stops. For a simple flag that is only set (not read-modify-written), volatile is enough."
  - id: q7
    type: MATCH
    prompt: "Match each tool to what it does"
    pairs:
      - left: "synchronized"
        right: "Only one thread at a time, plus visibility"
      - left: "volatile"
        right: "Latest value visible to all threads, no locking"
      - left: "wait()"
        right: "Release the lock and sleep until notified"
      - left: "notifyAll()"
        right: "Wake up every thread waiting on this object"
      - left: "Thread.sleep()"
        right: "Pause for a time while keeping any lock held"
    explanation: "synchronized locks; volatile only shares the latest value; wait releases the lock, sleep doesn't; notifyAll wakes all waiters, which then compete for the lock."
  - id: q8
    type: MCQ
    prompt: "Thread A runs a synchronized block on lockA; Thread B runs a synchronized block on lockB. Both blocks change the same counter. What happens?"
    code: null
    options:
      - "They take turns, so the counter is safe"
      - "They don't block each other, so the race condition remains"
      - "Compile error"
      - "Deadlock always happens"
    answer: 1
    explanation: "Threads only exclude each other if they use the SAME lock object. Different locks mean both can be inside at once, so updates can still be lost. No deadlock: each thread only holds one lock."
