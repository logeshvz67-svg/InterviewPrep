infosysRelevance: "Interview practice: finding bugs by reading code, and testing edge cases, is a core skill for coding rounds and debugging-style questions."
otherCompanies: "Debugging and \"what is wrong with this code\" questions are common in technical interviews at service and product companies."
why: |
  In coding rounds your code is checked against **hidden test cases**. A tiny bug (one `<=` instead of `<`, a forgotten `break`) can fail half of them. In interviews, "What is wrong with this code?" is a common practice question.

  Finding bugs is a skill you can train. Most bugs belong to a small number of **families**: off-by-one, null, `==` on objects, integer overflow, missing `equals`/`hashCode`... Once you know the families, you know **where to look**.

  This lesson gives you a debugging method, the bug families, and 8 verified bug challenges in the quiz.
analogy: |
  Think of a **doctor** checking a patient.

  A good doctor doesn't guess randomly. They follow a routine: read the **report** (the error message), check the **usual suspects** for those symptoms (fever + cough: check the chest first), and run **small tests** (blood test) to confirm.

  Debugging is the same:
  - The **error message and line number** are the report.
  - The **bug families** are the usual suspects.
  - **Dry runs with tiny inputs and edge cases** (empty, one item, negative, very big) are the tests.
