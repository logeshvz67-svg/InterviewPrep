infosysRelevance: "Very common in coding rounds; these five problems are the base patterns (two pointers, counting array, HashMap) behind many harder SP-level string questions."
otherCompanies: "Very common practice problems for TCS, Wipro, Cognizant, Accenture, Capgemini coding rounds and as warm-ups at product companies."
why: |
  Five string problems appear again and again in coding practice and interviews:
  1. **Reverse** a string
  2. Check a **palindrome**
  3. Check if two strings are **anagrams**
  4. Count **character frequency**
  5. Find the **first non-repeating character**

  They look small, but they teach the three tools you will use in hundreds of harder problems: **two pointers**, a **counting array**, and a **HashMap**. Interviewers also ask "what is the time and space complexity?" and "can you do better?", so this lesson gives you a simple solution, the better solution, and the complexity for each.
analogy: |
  Think of a **class attendance register**.

  - **Reversing** is reading the register from the last name to the first.
  - **Palindrome** check is two monitors, one starting at roll number 1 and one at the last roll number, walking towards each other and checking if they see the same name.
  - **Frequency counting** is a tally sheet: a box for each letter a-z, and you put one tick in the right box for every letter you see.
  - **Anagram** check is comparing two tally sheets. If every box has the same number of ticks, the words use the same letters.
  - **First non-repeating** is: fill the tally sheet first, then walk the register again in order, and the first name whose box has exactly one tick is the answer.
