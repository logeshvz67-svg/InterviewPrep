explanation: |
  ### Without central handling
  If an exception escapes a controller, Spring Boot sends a generic 500 error. Writing `try/catch` in every method is messy and inconsistent, and a common beginner bug is catching the exception and returning **200** with an error string. The client then thinks everything worked.

  ### @ExceptionHandler
  A method marked `@ExceptionHandler(SomeException.class)` is called when that exception (or a subclass) is thrown. Its return value becomes the response.
  - Inside **one controller**: handles errors from that controller only.
  - Inside a **@RestControllerAdvice** class: handles errors from **all** controllers. This is what you want.

  `@RestControllerAdvice` = `@ControllerAdvice` + `@ResponseBody`, so return values are written as JSON.

  ### Which handler wins?
  Spring picks the handler whose exception type is **closest** to the thrown one in the class hierarchy. The order of the methods in the file does not matter. So `@ExceptionHandler(Exception.class)` only runs when nothing more specific matches. Two handlers for exactly the same exception type in one advice is an error at startup ("Ambiguous @ExceptionHandler method").

  ### ProblemDetail: a standard error shape
  **ProblemDetail** (Spring 6+) follows the RFC 7807 standard (updated as RFC 9457) for HTTP error bodies. Its fields:

  | Field | Meaning |
  |---|---|
  | `type` | A URI naming the error type (`about:blank` by default) |
  | `title` | Short text for the status, e.g. "Not Found" |
  | `status` | The HTTP status code |
  | `detail` | Human-friendly explanation for this case |
  | `instance` | The request path where it happened |

  You can add your own fields with `pd.setProperty("errors", map)`. The response content type is `application/problem+json`.

  ### Your app's handler, line by line
  Open `backend/src/main/java/com/codequest/exception/GlobalExceptionHandler.java` and `ApiException.java`:
  - **`ApiException`** is your own `RuntimeException` that carries an `HttpStatus`. Static helpers make throwing readable: `throw ApiException.notFound("Profile")`, `ApiException.conflict("...")`. Services throw it; the handler turns it into a ProblemDetail with that status. (`XpService.award` uses `orElseThrow(() -> ApiException.notFound("Profile"))`.)
  - **`MethodArgumentNotValidException` -> 400** with an `errors` map: field name to message. That is how the frontend shows "Password must be 8-72 characters" under the right box.
  - **`ConstraintViolationException`**, **`HttpMessageNotReadableException`**, **`MethodArgumentTypeMismatchException` -> 400**: broken JSON or `/topics/abc`.
  - **`BadCredentialsException` -> 401**, **`AccessDeniedException` -> 403**.
  - **`HttpRequestMethodNotSupportedException` -> 405** and **`NoResourceFoundException` -> 404**.
  - **`Exception` -> 500**: logs the full stack trace with `log.error`, but sends only "Something went wrong on our side".

  ### Why so many specific handlers? The catch-all trap
  A catch-all `@ExceptionHandler(Exception.class)` catches **everything**, including Spring's own exceptions that normally become 400, 404 or 405. Without the specific handlers, `/api/topics/abc` would turn into **500** instead of 400, and DELETE on a GET-only URL would also become 500. Rule: if you add a catch-all, also add handlers for the framework exceptions you care about (or extend `ResponseEntityExceptionHandler`, which already maps Spring MVC exceptions to the right ProblemDetail).

  ### Status code guide
  | Situation | Status |
  |---|---|
  | Invalid input, failed validation, unreadable JSON | 400 |
  | Not logged in / wrong password | 401 |
  | Logged in, not allowed | 403 |
  | Resource or URL does not exist | 404 |
  | Wrong HTTP method | 405 |
  | Duplicate / state conflict (email taken) | 409 |
  | Unexpected bug | 500 |

  ### Errors that happen before controllers
  Spring Security filters run **before** the DispatcherServlet, so a missing token never reaches `@RestControllerAdvice`. That is why `SecurityConfig` writes its own 401/403 ProblemDetail in `authenticationEntryPoint` and `accessDeniedHandler`. The `AccessDeniedException` handler in `GlobalExceptionHandler` covers method-level checks like `@PreAuthorize` that run inside the controller call.

  ### Other options you may hear about
  - `@ResponseStatus(HttpStatus.NOT_FOUND)` on a custom exception class: simple, but you can't control the body well.
  - `throw new ResponseStatusException(HttpStatus.NOT_FOUND, "Topic not found")`: quick, no custom class.
  - `spring.mvc.problemdetails.enabled=true`: Spring returns ProblemDetail for its own MVC exceptions automatically.
tinyCode:
  code: |
    package demo.advice;

    import jakarta.validation.Valid;
    import jakarta.validation.constraints.NotBlank;
    import org.springframework.http.HttpStatus;
    import org.springframework.http.MediaType;
    import org.springframework.http.ProblemDetail;
    import org.springframework.test.web.servlet.MockMvc;
    import org.springframework.test.web.servlet.request.MockHttpServletRequestBuilder;
    import org.springframework.test.web.servlet.setup.MockMvcBuilders;
    import org.springframework.web.HttpRequestMethodNotSupportedException;
    import org.springframework.web.bind.MethodArgumentNotValidException;
    import org.springframework.web.bind.annotation.*;

    import java.util.LinkedHashMap;
    import java.util.Map;

    import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.*;

    class ApiException extends RuntimeException {
        private final HttpStatus status;
        ApiException(HttpStatus status, String message) { super(message); this.status = status; }
        HttpStatus getStatus() { return status; }
        static ApiException notFound(String what) { return new ApiException(HttpStatus.NOT_FOUND, what + " not found"); }
        static ApiException conflict(String msg) { return new ApiException(HttpStatus.CONFLICT, msg); }
    }

    record TopicRequest(@NotBlank String name) {}

    @RestController
    @RequestMapping("/api/topics")
    class TopicController {
        @GetMapping("/{id}")
        String get(@PathVariable Long id) {
            if (id == 99) throw ApiException.notFound("Topic");
            if (id == 13) throw new IllegalStateException("db password is hunter2");
            return "Topic " + id;
        }

        @PostMapping
        String create(@Valid @RequestBody TopicRequest req) {
            if (req.name().equals("Java")) throw ApiException.conflict("Topic already exists");
            return "created";
        }
    }

    @RestControllerAdvice
    class GlobalExceptionHandler {
        @ExceptionHandler(ApiException.class)
        ProblemDetail handleApi(ApiException ex) {
            return ProblemDetail.forStatusAndDetail(ex.getStatus(), ex.getMessage());
        }

        @ExceptionHandler(MethodArgumentNotValidException.class)
        ProblemDetail handleValidation(MethodArgumentNotValidException ex) {
            Map<String, String> errors = new LinkedHashMap<>();
            ex.getBindingResult().getFieldErrors().forEach(fe -> errors.putIfAbsent(fe.getField(), fe.getDefaultMessage()));
            ProblemDetail pd = ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, "Some fields need fixing");
            pd.setProperty("errors", errors);
            return pd;
        }

        @ExceptionHandler(HttpRequestMethodNotSupportedException.class)
        ProblemDetail handleMethod(HttpRequestMethodNotSupportedException ex) {
            return ProblemDetail.forStatusAndDetail(HttpStatus.METHOD_NOT_ALLOWED, ex.getMessage());
        }

        @ExceptionHandler(Exception.class)
        ProblemDetail handleUnknown(Exception ex) {
            return ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, "Something went wrong on our side.");
        }
    }

    public class AdviceDemo {
        static MockMvc mvc = MockMvcBuilders.standaloneSetup(new TopicController())
                .setControllerAdvice(new GlobalExceptionHandler()).build();

        static void show(String label, MockHttpServletRequestBuilder req) throws Exception {
            var res = mvc.perform(req).andReturn().getResponse();
            System.out.println(label + " -> " + res.getContentAsString());
        }

        public static void main(String[] args) throws Exception {
            show("ok", get("/api/topics/1"));
            show("404", get("/api/topics/99"));
            show("500", get("/api/topics/13"));
            show("400", post("/api/topics").contentType(MediaType.APPLICATION_JSON).content("{\"name\":\"\"}"));
            show("409", post("/api/topics").contentType(MediaType.APPLICATION_JSON).content("{\"name\":\"Java\"}"));
            show("405", delete("/api/topics/1"));
        }
    }
    // Output:
    // ok -> Topic 1
    // 404 -> {"type":"about:blank","title":"Not Found","status":404,"detail":"Topic not found","instance":"/api/topics/99"}
    // 500 -> {"type":"about:blank","title":"Internal Server Error","status":500,"detail":"Something went wrong on our side.","instance":"/api/topics/13"}
    // 400 -> {"type":"about:blank","title":"Bad Request","status":400,"detail":"Some fields need fixing","instance":"/api/topics","errors":{"name":"must not be blank"}}
    // 409 -> {"type":"about:blank","title":"Conflict","status":409,"detail":"Topic already exists","instance":"/api/topics"}
    // 405 -> {"type":"about:blank","title":"Method Not Allowed","status":405,"detail":"Request method 'DELETE' is not supported","instance":"/api/topics/1"}
  walkthrough: |
    - `ApiException` is a `RuntimeException` that carries the HTTP status. The static helpers `notFound` and `conflict` keep service code readable, just like your project's `ApiException`.
    - The controller has **no try/catch**. It just throws.
    - `@RestControllerAdvice class GlobalExceptionHandler`: one class that handles errors from all controllers.
    - `handleApi`: turns any `ApiException` into a `ProblemDetail` with the exception's own status (404 or 409 here).
    - `handleValidation`: `@Valid` failed. We collect each field's first message into an `errors` map and return 400. `putIfAbsent` keeps only the first message per field.
    - `handleMethod`: DELETE is not mapped, so Spring throws `HttpRequestMethodNotSupportedException`; we answer 405.
    - `handleUnknown`: the last resort for real bugs. Notice the 500 response does **not** contain "hunter2". The secret stays in the server log (your real handler calls `log.error`).
    - Spring fills `instance` with the request path automatically. The content type of every error is `application/problem+json`.
