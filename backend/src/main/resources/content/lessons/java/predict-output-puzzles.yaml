title: "Predict-the-output puzzles"
version: 1
estimatedMinutes: 30
rebuild: false
patternCode: null
companies: [ALL]
infosysRelevance: "Interview practice: output-prediction snippets are a common style in written MCQ rounds and technical interviews; this builds the habit of tracing code exactly."
otherCompanies: "Predict-the-output questions are common in aptitude-style technical MCQs across service companies and in product-company phone screens."
why: |
  "What does this code print?" questions look easy, but they hide **traps**: a `char` that is secretly a number, an `Integer` that is cached, a `switch` that falls through.

  They test whether you can run code **in your head** exactly like the JVM: a **mental compiler**. That skill also makes you much faster at debugging real code.

  The good news: there are only about **ten classic traps**. Once you know them, most puzzles become simple. This lesson teaches the traps and a tracing method, and the quiz gives you 8 tricky puzzles, all verified by actually running them.
analogy: |
  Think of a **cricket umpire** watching a close run-out.

  A fan watches the whole play and *feels* what happened. The umpire uses the **replay, frame by frame**, and decides by the rules, not by feelings.

  Predict-the-output puzzles are designed to fool the fan's feeling. Your job is to be the umpire: go **line by line**, write down each variable's value (frame by frame), and apply the exact Java rule at every step.
