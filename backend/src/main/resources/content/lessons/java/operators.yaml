infosysRelevance: "Frequent in predict-the-output practice; % and integer division are used in almost every number-based SP coding problem (digits, cycles, modulo answers)."
otherCompanies: "i++ vs ++i, precedence and short-circuit questions are common MCQs at TCS, Wipro, Cognizant, Accenture and Capgemini. Bitwise tricks appear in product-company rounds."
why: |
  **Operators** are the symbols that do work on values: `+`, `-`, `%`, `==`, `&&`, `++` and more.

  They look simple, but they hide most of the "tricky output" questions:
  - `i++` vs `++i` inside a bigger expression,
  - `7 / 2` giving `3` instead of `3.5`,
  - `-7 % 3` giving `-1` (not `2`),
  - `&&` skipping the right side completely,
  - `byte b += 1` compiling while `b = b + 1` does not.

  In coding problems, `%` and `/` are your main tools: extract digits (`n % 10`, `n / 10`), check even/odd, wrap around in a circle, and print answers "modulo 10^9+7". Master this lesson and a whole category of questions becomes free marks.
analogy: |
  Think of **paying at a canteen counter with a token system**.

  - `i++` (post-increment) is like the cashier **calling your current token number first, then** moving the counter to the next number. You get the old value.
  - `++i` (pre-increment) is like the cashier **moving the counter first, then** calling the number. You get the new value.
  - `&&` is like a security guard checking **"Do you have an ID?"** first. If no, he does not even bother checking your bag. The second check is skipped (short-circuit).
  - `%` is like **sharing 17 samosas among 5 friends**: each gets 3 (that is `17 / 5`) and 2 are left over (that is `17 % 5`).
