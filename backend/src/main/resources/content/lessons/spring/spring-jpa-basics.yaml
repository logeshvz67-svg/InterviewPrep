commonMistakes:
  - "Saying JPA and Hibernate are the same. JPA is the specification; Hibernate is one implementation; Spring Data JPA builds repositories on top."
  - "Putting mappedBy on the wrong side, or using the column name (customer_id) instead of the Java field name (customer)."
  - "Adding children to a parent's list without cascade. The new children are silently not saved."
  - "Setting only one side of a bidirectional relationship. Only the owning side (with @JoinColumn) is written to the database."
  - "Using CascadeType.REMOVE (or ALL) on a @ManyToOne. Deleting one order would delete the customer and all their other orders."
  - "Using table and column names in a JPQL @Query. JPQL uses entity class and field names; use nativeQuery = true for raw SQL."
interviewBox:
  why: "Why interviewers ask this: almost every Spring project uses JPA. They check whether you understand what is generated for you and how relationships really map to tables."
  questions:
    - q: "What is the difference between JPA, Hibernate and Spring Data JPA?"
      a: "JPA is the Jakarta standard: interfaces and annotations for mapping objects to tables. Hibernate is an implementation of JPA that actually generates and runs the SQL. Spring Data JPA sits on top and creates repository implementations from interfaces, so I just extend JpaRepository and declare methods like findByEmail."
    - q: "How do derived query methods work?"
      a: "Spring Data parses the method name at startup. findByCityOrderByEmailAsc becomes a query with where city = ? order by email asc. It supports keywords like And, Or, Between, LessThan, Containing and OrderBy. If a property name is wrong, the app fails at startup, which catches typos early. For complex queries I use @Query with JPQL."
    - q: "Explain mappedBy and the owning side."
      a: "In one-to-many, the database has a single foreign key column on the many side, like orders.customer_id. The entity with that @ManyToOne and @JoinColumn is the owning side, and only its changes are saved. The other side, the list in Customer, uses @OneToMany(mappedBy = \"customer\") to say: this is the same relationship, mapped by the customer field over there. Without mappedBy, Hibernate would expect a separate join table."
    - q: "What do cascade and orphanRemoval do?"
      a: "Cascade passes operations like persist and remove from a parent to its children, so saving a customer also saves its new orders. orphanRemoval deletes a child row when it is removed from the parent's collection. I use them only from a real owner to its own children, never from a child up to a parent."
    - q: "CrudRepository vs JpaRepository?"
      a: "CrudRepository has the basic create, read, update, delete methods. JpaRepository extends it with paging and sorting, returns Lists instead of Iterables, and adds JPA-specific methods like flush and saveAndFlush. In Spring Boot projects I normally use JpaRepository."
quiz:
  - id: q1
    type: MCQ
    prompt: "Which statement about JPA and Hibernate is correct?"
    code: null
    options:
      - "Hibernate is the specification and JPA implements it"
      - "JPA is a specification; Hibernate is an implementation of it"
      - "They are two names for the same library"
      - "JPA is a database like PostgreSQL"
    answer: 1
    explanation: "JPA (jakarta.persistence) defines the annotations and interfaces; Hibernate is the engine that implements them and is Spring Boot's default. Option A is the common mix-up the interviewer is testing."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "The app fails at startup with an AnnotationException. Why?"
    code: |
      @Entity
      class Customer {
          @Id @GeneratedValue(strategy = GenerationType.IDENTITY) Long id;

          @OneToMany(mappedBy = "customerId", cascade = CascadeType.ALL)
          List<PurchaseOrder> orders = new ArrayList<>();
      }

      @Entity
      class PurchaseOrder {
          @Id @GeneratedValue(strategy = GenerationType.IDENTITY) Long id;

          @ManyToOne
          @JoinColumn(name = "customer_id")
          Customer customer;
      }
    options:
      - "@JoinColumn must be on the Customer side"
      - "mappedBy must name the Java field in PurchaseOrder (\"customer\"), not a column; there is no property called customerId"
      - "cascade cannot be used with mappedBy"
      - "List must be replaced with Set"
    answer: 1
    explanation: "Hibernate reports: 'mappedBy a property named customerId which does not exist in the target entity'. mappedBy refers to the field name, here customer. The @JoinColumn is correctly on the owning (many) side, and cascade with mappedBy is normal."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "After this runs, orders.count() prints 0, even though asha has two orders in her list. Why?"
    code: |
      @OneToMany(mappedBy = "customer")
      private List<PurchaseOrder> orders = new ArrayList<>();

      // in the runner:
      Customer asha = new Customer("asha@mail.com", "Pune");
      asha.addOrder(new PurchaseOrder(300));   // sets both sides
      asha.addOrder(new PurchaseOrder(900));
      customers.save(asha);
      System.out.println(orders.count());
    options:
      - "addOrder must call orders.save itself"
      - "There is no cascade, so saving the customer does not save the new orders"
      - "mappedBy makes the list read-only, so orders can never be added"
      - "count() only counts orders older than one second"
    answer: 1
    explanation: "Without cascade = CascadeType.PERSIST (or ALL), save(customer) inserts only the customer; the new PurchaseOrder objects stay unsaved. Add cascade, or save each order with orderRepository. mappedBy does not make the list read-only; it just marks the inverse side."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "The customers table has asha (Pune), ravi (Pune) and meena (Chennai). What is printed?"
    code: |
      interface CustomerRepository extends JpaRepository<Customer, Long> {
          Optional<Customer> findByEmail(String email);
          long countByCity(String city);
      }

      System.out.println(customers.countByCity("Pune"));
      System.out.println(customers.findByEmail("x@mail.com").isPresent());
    options: ["2 and false", "2 and an exception", "3 and false", "2 and null"]
    answer: 0
    explanation: "countByCity counts matching rows: 2. findByEmail with Optional returns Optional.empty() when nothing matches, so isPresent() is false. It neither throws nor returns null; that is the point of Optional."
  - id: q5
    type: TRUE_FALSE
    prompt: "A derived query method with a typo, such as findByEmial(String email), compiles fine but makes the application fail at startup."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Java only sees a normal method declaration, so it compiles. Spring Data parses method names while creating the repository and fails with 'No property emial found for type Customer'. Failing early is helpful."
  - id: q6
    type: MATCH
    prompt: "Match each annotation to its job"
    pairs:
      - left: "@Id"
        right: "Marks the primary key field"
      - left: "@JoinColumn(name = \"customer_id\")"
        right: "Names the foreign key column on the owning side"
      - left: "@OneToMany(mappedBy = \"customer\")"
        right: "Inverse side of a relationship owned by another entity's field"
      - left: "@Enumerated(EnumType.STRING)"
        right: "Stores enum names instead of numbers"
      - left: "@Modifying"
        right: "Marks a @Query that updates or deletes rows"
    explanation: "These are the annotations you will see most in entity and repository code, including in your own project (User.role, RefreshTokenRepository)."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Complete the repository so Spring Data generates save, findById, findAll and paging for Book entities with Long ids."
    code: |
      public interface BookRepository extends ____<Book, Long> {
          List<Book> findByAuthor(String author);
      }
    acceptedAnswers: ["JpaRepository"]
    explanation: "JpaRepository<Entity, IdType> gives CRUD, paging, sorting and JPA extras. CrudRepository would also compile but has fewer features and returns Iterable."
  - id: q8
    type: MCQ
    prompt: "In JPQL, which query is correct for the Customer entity mapped to the table customers?"
    code: null
    options:
      - "select * from customers where city = :city"
      - "select c from Customer c where c.city = :city"
      - "select c from customers c where c.city_name = :city"
      - "find Customer where city = :city"
    answer: 1
    explanation: "JPQL uses entity names and field names (Customer, c.city). Option A is native SQL, which needs nativeQuery = true. Option C mixes table names into JPQL."
explainBack:
  prompt: "Explain to a friend how Spring Data JPA saves and reads objects, and how a one-to-many relationship is mapped."
  rubric:
    - "I explained JPA vs Hibernate vs Spring Data JPA"
    - "I explained entities (@Entity, @Id) and repositories (JpaRepository, derived queries)"
    - "I explained the owning side, @JoinColumn and mappedBy"
    - "I explained cascade (and orphanRemoval)"
    - "I mentioned @Query with JPQL for complex queries"
  modelAnswer: |
    JPA is the Java standard for mapping classes to tables, Hibernate is the engine that implements it, and Spring Data JPA writes the repository code for me. I mark a class with @Entity and its key with @Id, then create an interface that extends JpaRepository. I get save, findById and paging for free, and methods like findByEmail are built from the method name. For complex queries I use @Query with JPQL. For one customer with many orders, the orders table holds customer_id, so PurchaseOrder has @ManyToOne with @JoinColumn: that's the owning side. Customer has @OneToMany(mappedBy = "customer"). With cascade ALL, saving or deleting the customer also saves or deletes its orders.
flashcards:
  - front: "JPA vs Hibernate vs Spring Data JPA"
    back: "JPA = specification (jakarta.persistence). Hibernate = implementation. Spring Data JPA = auto-generated repositories on top."
  - front: "Owning side of one-to-many"
    back: "The @ManyToOne side with @JoinColumn (holds the FK). Only its changes are saved. The other side uses mappedBy = \"fieldName\"."
  - front: "cascade vs orphanRemoval"
    back: "cascade: pass persist/remove from parent to children. orphanRemoval: delete a child when removed from the parent's collection."
  - front: "Default fetch types"
    back: "@ManyToOne / @OneToOne: EAGER. @OneToMany / @ManyToMany: LAZY."
  - front: "JPQL vs native query"
    back: "JPQL uses entity/field names (select c from Customer c). Native SQL needs nativeQuery = true. Updates need @Modifying."
  - front: "Typo in a derived query name?"
    back: "Compiles, but the app fails at startup: No property 'x' found for type."
keyTakeaways:
  - "JPA is the standard, Hibernate implements it, Spring Data JPA generates repositories."
  - "Entities map classes to tables: @Entity, @Id, @GeneratedValue, @Column, @Enumerated(STRING)."
  - "Extend JpaRepository; use derived query names for simple queries and @Query (JPQL) for complex ones."
  - "The @ManyToOne side with @JoinColumn owns the relationship; the other side uses mappedBy with the field name."
  - "Cascade from parent to its own children only; without it, new children are not saved."
