why: |
  A **deadlock** freezes programs forever: nothing crashes, nothing moves. It is one of the scariest bugs in real systems, and a favourite OS interview topic.

  You will be expected to:
  - define deadlock and list the **four Coffman conditions** without hesitation,
  - explain **prevention vs avoidance vs detection and recovery**,
  - run the **Banker's algorithm** on a small table (a classic numerical).

  The same ideas come back in Java (`synchronized` locks) and databases (row locks), so this lesson pays off three times.
analogy: |
  Picture a **narrow lane in an old city with two cars facing each other**.

  - Car A wants to go forward, but Car B is in the way.
  - Car B wants to go forward, but Car A is in the way.
  - Neither will reverse (no preemption), each is holding its part of the lane (hold and wait), the lane fits only one car (mutual exclusion), and each is waiting for the other (circular wait).

  Nobody moves, forever. That is a deadlock. Remove **any one** of those four conditions (for example, one driver agrees to reverse) and traffic flows again.
