explanation: |
  ### ORM, JPA, Hibernate, Spring Data JPA
  - **ORM (Object-Relational Mapping)**: the idea of mapping classes to tables and objects to rows, so you work with objects instead of SQL rows.
  - **JPA (Jakarta Persistence API)**: the *standard*: a set of interfaces and annotations (`jakarta.persistence.*`). It is only a specification, not working code.
  - **Hibernate**: the most popular *implementation* of JPA. It generates and runs the SQL. Spring Boot uses it by default.
  - **Spring Data JPA**: a Spring layer **on top of** JPA that creates repository implementations for you from interfaces.

  So: you write JPA annotations, Hibernate does the work, and Spring Data saves you from writing DAO classes.

  ### Entities
  An **entity** is a class mapped to a table:
  ```java
  @Entity
  @Table(name = "customers")
  class Customer {
      @Id
      @GeneratedValue(strategy = GenerationType.IDENTITY)
      private Long id;

      @Column(nullable = false, unique = true)
      private String email;

      protected Customer() {}   // JPA needs a no-argument constructor
  }
  ```
  - `@Id` marks the primary key. `GenerationType.IDENTITY` lets the database generate it (PostgreSQL `BIGSERIAL`).
  - `@Column` sets the column name and rules. Without it, the field name is used (`createdAt` becomes `created_at` with Boot's default naming).
  - `@Enumerated(EnumType.STRING)` stores enum names like `"ADMIN"` instead of numbers 0/1. Your `User` entity does this for `role`, so reordering the enum never corrupts data.
  - Entities need a no-arg constructor (can be `protected`) and must not be `final`, because Hibernate creates proxy subclasses.

  In your app, `backend/src/main/java/com/codequest/entity/BaseEntity.java` is a `@MappedSuperclass`: shared `id`, `createdAt`, `updatedAt` for every table, with `@PrePersist` and `@PreUpdate` setting the times.

  ### Repositories
  ```java
  interface CustomerRepository extends JpaRepository<Customer, Long> { }
  ```
  That is all. Spring Data creates a class at startup with `save`, `saveAll`, `findById` (returns `Optional`), `findAll`, `findAll(Pageable)`, `count`, `existsById`, `deleteById`, `delete` and more.

  | Interface | Adds |
  |---|---|
  | `CrudRepository` | basic save/find/delete |
  | `PagingAndSortingRepository` | paging and sorting |
  | `JpaRepository` | all of the above + JPA extras (`flush`, `saveAndFlush`, batch deletes), returns `List` |

  ### Derived query methods
  Spring Data reads the **method name** and builds the query:
  - `Optional<Customer> findByEmail(String email)`
  - `List<Customer> findByCityOrderByEmailAsc(String city)`
  - `long countByCity(String city)`
  - `boolean existsByUserIdAndActionAndSourceKey(...)` (in your `XpEventRepository`)
  - Keywords: `And`, `Or`, `Between`, `LessThan`, `GreaterThanEqual`, `Like`, `Containing`, `In`, `IsNull`, `OrderBy...Desc`, `Top3`/`First`.

  The names are checked **at startup**. A typo like `findByEmial` stops the app with *No property 'emial' found for type 'Customer'*. That is good: you find the bug immediately.

  ### @Query for anything bigger
  ```java
  @Query("select c from Customer c join c.orders o group by c having sum(o.amount) > :min")
  List<Customer> bigSpenders(int min);
  ```
  This is **JPQL**: it uses **entity and field names** (`Customer`, `c.orders`), not table names. Add `nativeQuery = true` to write real SQL. For `update`/`delete` queries add `@Modifying` (see `RefreshTokenRepository.revokeAllForUser` in your app). Named parameters like `:min` match method parameter names.

  ### Relationships
  | Annotation | Example | Default fetch |
  |---|---|---|
  | `@ManyToOne` | many orders -> one customer | EAGER |
  | `@OneToMany` | one customer -> many orders | LAZY |
  | `@OneToOne` | user -> profile | EAGER |
  | `@ManyToMany` | problems <-> patterns (join table) | LAZY |

  (Fetch types are the topic of the next lesson. Your project sets `@ManyToOne(fetch = FetchType.LAZY)` on purpose; see the comment in `entity/JavaTopicProgress.java`.)

  ### Owning side and mappedBy
  In a database, a one-to-many link is **one foreign key column** on the "many" table (`orders.customer_id`). In Java you may have the link on **both** sides (bidirectional). JPA must know which side controls the column:
  - The **owning side** is the side with the foreign key: `@ManyToOne @JoinColumn(name = "customer_id") Customer customer` in `PurchaseOrder`. **Only changes to the owning side are saved.**
  - The **inverse side** says `@OneToMany(mappedBy = "customer")`. `"customer"` is the **name of the field** in `PurchaseOrder`, not a column name. A wrong name fails at startup.
  - Without `mappedBy`, Hibernate thinks there are two separate relationships and expects an extra join table.

  Keep both sides in sync with a helper method:
  ```java
  void addOrder(PurchaseOrder o) { orders.add(o); o.setCustomer(this); }
  ```

  Many-to-many uses a join table. See `ProblemSolved.patterns` in your project: `@ManyToMany` with `@JoinTable(name = "problem_patterns", ...)`.

  ### Cascade and orphanRemoval
  - **Cascade** passes an operation from parent to children. `cascade = CascadeType.ALL` on `Customer.orders` means saving or deleting a customer also saves or deletes its orders. Without it, new orders added to the list are simply **not saved**.
  - **orphanRemoval = true**: removing an order from the list deletes its row.
  - Use cascade only from a real parent to its own children. Never `CascadeType.REMOVE` on a `@ManyToOne` (deleting one order would delete the customer!).

  ### Who creates the tables?
  `spring.jpa.hibernate.ddl-auto=create`/`update` lets Hibernate create tables: fine for demos, risky in production. Your app uses `ddl-auto: validate`: **Flyway** migrations create the schema and Hibernate only checks that the entities match it (lesson 10).
tinyCode:
  code: |
    package demo.jpa;

    import jakarta.persistence.*;
    import org.springframework.boot.CommandLineRunner;
    import org.springframework.boot.SpringApplication;
    import org.springframework.boot.autoconfigure.SpringBootApplication;
    import org.springframework.data.jpa.repository.JpaRepository;
    import org.springframework.data.jpa.repository.Query;

    import java.util.ArrayList;
    import java.util.List;
    import java.util.Optional;

    @Entity
    @Table(name = "customers")
    class Customer {
        @Id
        @GeneratedValue(strategy = GenerationType.IDENTITY)
        private Long id;

        @Column(nullable = false, unique = true)
        private String email;

        private String city;

        @OneToMany(mappedBy = "customer", cascade = CascadeType.ALL, orphanRemoval = true)
        private List<PurchaseOrder> orders = new ArrayList<>();

        protected Customer() {}
        Customer(String email, String city) { this.email = email; this.city = city; }

        void addOrder(PurchaseOrder o) { orders.add(o); o.setCustomer(this); }

        Long getId() { return id; }
        String getEmail() { return email; }
        String getCity() { return city; }
        List<PurchaseOrder> getOrders() { return orders; }
    }

    @Entity
    @Table(name = "orders")
    class PurchaseOrder {
        @Id
        @GeneratedValue(strategy = GenerationType.IDENTITY)
        private Long id;

        private int amount;

        @ManyToOne(fetch = FetchType.LAZY, optional = false)
        @JoinColumn(name = "customer_id")
        private Customer customer;

        protected PurchaseOrder() {}
        PurchaseOrder(int amount) { this.amount = amount; }

        void setCustomer(Customer c) { this.customer = c; }
        int getAmount() { return amount; }
    }

    interface CustomerRepository extends JpaRepository<Customer, Long> {
        Optional<Customer> findByEmail(String email);
        List<Customer> findByCityOrderByEmailAsc(String city);
        long countByCity(String city);

        @Query("select c from Customer c join c.orders o group by c having sum(o.amount) > :min")
        List<Customer> bigSpenders(int min);
    }

    interface OrderRepository extends JpaRepository<PurchaseOrder, Long> {}

    @SpringBootApplication
    public class JpaDemo implements CommandLineRunner {
        private final CustomerRepository customers;
        private final OrderRepository orders;

        JpaDemo(CustomerRepository customers, OrderRepository orders) {
            this.customers = customers; this.orders = orders;
        }

        @Override
        public void run(String... args) {
            Customer asha = new Customer("asha@mail.com", "Pune");
            asha.addOrder(new PurchaseOrder(300));
            asha.addOrder(new PurchaseOrder(900));
            customers.save(asha);
            customers.save(new Customer("ravi@mail.com", "Pune"));
            customers.save(new Customer("meena@mail.com", "Chennai"));

            System.out.println("orders saved: " + orders.count());
            System.out.println("in Pune: " + customers.countByCity("Pune"));
            System.out.println("found: " + customers.findByEmail("ravi@mail.com").map(Customer::getCity).orElse("none"));
            System.out.println("missing: " + customers.findByEmail("x@mail.com").isPresent());
            System.out.println("big spenders: " + customers.bigSpenders(1000).stream().map(Customer::getEmail).toList());
            customers.delete(customers.findByEmail("asha@mail.com").orElseThrow());
            System.out.println("orders after delete: " + orders.count());
        }

        public static void main(String[] args) {
            SpringApplication.run(JpaDemo.class, args);
        }
    }
    // application.yml: a datasource URL + spring.jpa.hibernate.ddl-auto: create-drop
    // Output (plus log lines):
    // orders saved: 2
    // in Pune: 2
    // found: Pune
    // missing: false
    // big spenders: [asha@mail.com]
    // orders after delete: 0
  walkthrough: |
    - `@Entity @Table(name = "customers") class Customer`: one object = one row in `customers`. `@Id` + `IDENTITY`: the database generates the id.
    - `@OneToMany(mappedBy = "customer", cascade = CascadeType.ALL, orphanRemoval = true)`: the **inverse** side. `"customer"` is the field name in `PurchaseOrder`. Cascade ALL means saving/deleting a customer also saves/deletes its orders.
    - `PurchaseOrder.customer` with `@ManyToOne` + `@JoinColumn(name = "customer_id")` is the **owning** side: it controls the foreign key column.
    - `addOrder` sets **both** sides, so the Java objects and the database agree.
    - `CustomerRepository extends JpaRepository<Customer, Long>`: no class written by us. `findByEmail`, `findByCityOrderByEmailAsc` and `countByCity` are derived from their names. `bigSpenders` uses JPQL with a join, `group by` and `having`.
    - `customers.save(asha)` inserts asha **and**, through cascade, her two orders: `orders saved: 2`.
    - `countByCity("Pune")` is 2 (asha and ravi). `findByEmail` returns an `Optional`: present for ravi, empty for x@mail.com.
    - Only asha's orders sum to more than 1000 (300 + 900), so she is the only big spender.
    - Deleting asha cascades to her orders, so `orders after delete: 0`.
    - `ddl-auto: create-drop` lets Hibernate create the tables for this demo. Your real app uses Flyway + `validate` instead.
tryIt:
  instructions: "Type this entity and repository for your own project idea (a library). Then add a CommandLineRunner (like in Tiny code) that saves three books and prints findByAuthorOrderByTitleAsc(\"Kathy Sierra\")."
  code: |
    package com.example.library;

    import jakarta.persistence.*;
    import org.springframework.data.jpa.repository.JpaRepository;
    import org.springframework.data.jpa.repository.Query;

    import java.util.List;

    @Entity
    @Table(name = "books")
    public class Book {
        @Id
        @GeneratedValue(strategy = GenerationType.IDENTITY)
        private Long id;

        @Column(nullable = false)
        private String title;

        private String author;
        private int pages;

        protected Book() {}
        public Book(String title, String author, int pages) { this.title = title; this.author = author; this.pages = pages; }

        public String getTitle() { return title; }
        public int getPages() { return pages; }
    }

    interface BookRepository extends JpaRepository<Book, Long> {
        List<Book> findByAuthorOrderByTitleAsc(String author);
        List<Book> findByPagesGreaterThan(int pages);

        @Query("select avg(b.pages) from Book b")
        Double averagePages();
    }
