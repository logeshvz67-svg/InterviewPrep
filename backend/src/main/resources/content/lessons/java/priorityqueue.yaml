  modelAnswer: |
    A PriorityQueue is like an emergency room: whoever has the highest priority is served next, not whoever came first. In Java the default is a min-heap, so the smallest comes out first. Inside, it's a binary heap stored in an array, where every parent is smaller than its children, so the smallest sits at index zero. Adding or removing moves one element up or down the tree, which is O(log n), and peek is O(1). To find the k-th largest, I keep a min-heap of size k, removing the smallest whenever it grows beyond k, and at the end peek gives the answer. Printing it doesn't show sorted order.
flashcards:
