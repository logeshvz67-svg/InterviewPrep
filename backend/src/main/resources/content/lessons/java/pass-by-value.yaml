explanation: |
  ### Two words first
  - **Pass-by-value**: the method receives a **copy** of the caller's variable value. Changing the parameter variable can't change the caller's variable.
  - **Pass-by-reference**: the method receives the **caller's variable itself** (an alias). Reassigning the parameter would change the caller's variable. (C++ has this with `&`. **Java does not.**)

  ### Where things live: stack and heap
  - The **stack** holds each method call's **local variables and parameters**. Each call gets its own box called a **stack frame**, which disappears when the method returns.
  - The **heap** holds **objects** (everything made with `new`, arrays too).
  - A variable of a class type (like `House h`) doesn't hold the object. It holds a **reference**: think of it as the object's address, like `#100`.

  ### Case 1: primitives
  ```java
  static void change(int x) { x = 99; }

  int n = 5;
  change(n);
  System.out.println(n);   // 5
  ```
  `change` gets its own copy of 5 in its own stack frame. Setting it to 99 changes only the copy.

  ### Case 2: objects: changing the object (visible!)
  ```java
  static void paint(House h) { h.color = "blue"; }

  House my = new House();   // color = "white"
  paint(my);
  System.out.println(my.color);   // blue
  ```
  `my` holds the reference `#100`. Java **copies `#100`** into `h`. Now two variables point to the **same object** on the heap, so changing the object through `h` is seen through `my`.

  This is why people *think* objects are passed by reference. But only the **reference value** was copied.

  ### Case 3: objects: reassigning the parameter (not visible)
  ```java
  static void replace(House h) {
      h = new House();       // h now points to #200
      h.color = "green";
  }

  House my = new House();
  replace(my);
  System.out.println(my.color);   // white
  ```
  `h = new House()` only changes the **copy** in `replace`'s frame. `my` in `main` still holds `#100`. If Java were pass-by-reference, `my` would now point to the green house. It doesn't. **This is the proof that Java is pass-by-value.**

  ### The swap that doesn't work
  ```java
  static void swap(Integer a, Integer b) { Integer t = a; a = b; b = t; }
  ```
  `a` and `b` are copies; swapping the copies changes nothing for the caller. In Java you **cannot** write a method that swaps two caller variables. You can swap things **inside** an object or array:
  ```java
  static void swap(int[] arr, int i, int j) { int t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  ```
  This works because `arr` (a copied reference) points to the **same array** on the heap.

  ### Strings and wrappers
  `String` and `Integer` objects are **immutable** (they can't be changed). So inside a method, `s = s + "!"` or `count++` creates/gets a **new object** and points the local copy at it. The caller never sees it. It's Case 3 in disguise.

  ### Summary table
  | What the method does | Caller sees the change? | Why |
  |---|---|---|
  | Changes a primitive parameter | No | The method has its own copy of the value |
  | Changes a field / array element through the parameter | **Yes** | Both references point to the same heap object |
  | Reassigns the parameter (`p = new ...`) | No | Only the method's copy of the reference changes |
  | "Modifies" a String or Integer parameter | No | Immutable: a new object is made and only the copy points to it |

  **One-line interview answer:** "Java is strictly pass-by-value. For objects, the value passed is a copy of the reference, so a method can change the object's contents, but it can never make the caller's variable point to a different object."
tinyCode:
  code: |
    public class Main {
        public static void main(String[] args) {
            int n = 5;
            change(n);
            System.out.println("n = " + n);

            House my = new House();
            paint(my);
            System.out.println("after paint: " + my.color);

            replace(my);
            System.out.println("after replace: " + my.color);
        }

        static void change(int x) { x = 99; }

        static void paint(House h) { h.color = "blue"; }

        static void replace(House h) {
            h = new House();
            h.color = "green";
        }
    }

    class House {
        String color = "white";
    }
  walkthrough: |
    - `change(n)` copies 5 into `x`. Setting `x = 99` only changes the copy, so `n` stays 5.
    - `paint(my)` copies the **reference** into `h`. Both point to the same House, so setting `h.color` really paints the caller's house blue.
    - `replace(my)` again copies the reference. But `h = new House()` points the **copy** at a brand-new house. The green paint goes on that new house. `my` still points to the blue one.

    Output:
    ```
    n = 5
    after paint: blue
    after replace: blue
    ```
