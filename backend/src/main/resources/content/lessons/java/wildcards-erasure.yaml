  - front: "Signature of Collections.copy"
    back: "<T> void copy(List<? super T> dest, List<? extends T> src)"
keyTakeaways:
  - "Wildcards make generic methods flexible despite invariance."
  - "? extends T: read as T, can't add. ? super T: can add T, read as Object."
  - "PECS: Producer Extends, Consumer Super; use the exact type if you read and write."
  - "Type erasure removes type arguments at run time for backward compatibility."
  - "Erasure is why there's no new T(), no instanceof List<String>, and no overloads differing only by type argument."
