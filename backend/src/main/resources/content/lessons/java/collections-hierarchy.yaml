        right: "HashMap"
      - left: "Keep only unique values, sorted"
        right: "TreeSet"
      - left: "Ordered items with fast access by index"
        right: "ArrayList"
      - left: "Queue for BFS"
        right: "ArrayDeque"
      - left: "Always take the smallest item next"
        right: "PriorityQueue"
