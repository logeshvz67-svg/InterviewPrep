  - id: q5
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Stack<String> s = new Stack<>();
              s.push("a");
              s.push("b");
              s.push("c");
              s.add(0, "z");
              System.out.println(s.pop() + " " + s.peek() + " " + s);
          }
      }
    options: ["c b [z, a, b]", "z c [a, b, c]", "c b [a, b]", "Compile error: Stack has no add(int, E)"]
    answer: 0
    explanation: "Because Stack extends Vector, add(0, \"z\") is allowed and puts z at the bottom: [z, a, b, c]. pop() removes c, peek() shows b, leaving [z, a, b]. This is exactly why Stack is considered badly designed: it lets you break LIFO."
  - id: q6
    type: MCQ
    prompt: "You need a list where you mostly loop over elements and read them by index. Which is best?"
    code: null
    options: ["LinkedList", "ArrayList", "Vector", "Stack"]
    answer: 1
    explanation: "ArrayList gives O(1) index access and fast, cache-friendly loops. LinkedList's get(i) is O(n). Vector and Stack add unneeded synchronization."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Fill in the call that removes the VALUE 3 (not index 3) from a List<Integer>."
    code: |
      List<Integer> list = new ArrayList<>(List.of(1, 2, 3, 4, 5));
      list.remove(____);
      System.out.println(list);   // [1, 2, 4, 5]
    acceptedAnswers: ["Integer.valueOf(3)", "(Integer) 3", "(Object) 3"]
    explanation: "Passing an Integer object selects remove(Object), which removes the value. Plain remove(3) would remove index 3 (the value 4)."
