keyTakeaways:
  - "Two pointers = two indexes moving smartly; each element is visited about once."
  - "Opposite ends: pair sums (sorted!), reverse, palindrome."
  - "Same direction (slow/fast): remove duplicates, move zeros, filter in place."
  - "O(n) time, O(1) space instead of O(n^2)."
  - "Use while (left < right) and make sure every iteration moves a pointer."
