infosysRelevance: "Core OS theory for SP and DSE technical rounds; process vs thread is one of the most common CS fundamentals questions to prepare."
otherCompanies: "A standard basic question for TCS, Wipro, Cognizant, Accenture, Capgemini and product companies, and it connects directly to Java multithreading."
why: |
  **"What is the difference between a process and a thread?"** is probably the most common operating system (OS) question in fresher interviews.

  It is also the foundation for many other topics:
  - **CPU scheduling** decides which process or thread runs next.
  - **Synchronization** and **deadlock** happen *because* threads share memory.
  - **Java multithreading** (`Thread`, `ExecutorService`) is built on OS threads.

  If you can draw the memory picture of a process with two threads, you can answer most follow-up questions calmly.
analogy: |
  Think of a **restaurant kitchen**.

  - A **process** is a whole **kitchen**: it has its own room, its own fridge, its own gas connection and its own stock of rice and vegetables. One kitchen cannot open another kitchen's fridge.
  - A **thread** is a **cook** inside that kitchen. All cooks share the same fridge and stock (shared memory), but each cook has their **own cutting board and own recipe page** they are currently following (their own stack and program counter).
  - Hiring a new cook (new thread) is quick and cheap. Building a new kitchen (new process) is slow and expensive.
  - If one cook spills oil and the kitchen catches fire, **all cooks in that kitchen** are affected, but the kitchen next door is safe. That is why a crashing thread can kill its process, but one process crashing does not kill another.
