  prompt: "Explain the five patterns to a friend by walking through one food delivery order."
  rubric:
    - "I explained Singleton with the single shared config and mentioned thread safety or its testing downside"
    - "I explained Builder as step-by-step order creation with build() validating"
    - "I explained Factory as choosing the payment flow without knowing concrete classes"
    - "I explained Strategy as swappable delivery fee rules"
    - "I explained Observer as notifying all subscribers of status changes"
  modelAnswer: |
    Picture one food order. The app reads a single shared rule book, like free delivery above 199; that's a Singleton, and it should be read-only and thread-safe. The order is built step by step: add dosa, add coffee, set the address, then build, which checks the order isn't empty; that's the Builder. At checkout I pick UPI and a factory gives me the right payment processor without me knowing its class; that's Factory. The delivery fee rule can be free, distance-based or rain surge, each a separate class behind one interface; that's Strategy. When the status changes, the customer, restaurant and rider all get notified because they subscribed; that's Observer.
flashcards:
  - front: "Singleton: idea and safest Java forms"
    back: "Exactly one instance via private constructor + static access. Safe forms: eager static final, holder class, enum."
  - front: "Builder: when and key rule"
    back: "Many (optional) fields; setters return this for chaining; build() validates and creates an immutable object."
  - front: "Factory vs Strategy"
    back: "Factory decides WHICH OBJECT to create. Strategy decides WHICH BEHAVIOUR to run (swappable algorithm)."
  - front: "Observer: idea and risk"
    back: "Subject keeps a list of subscribers and notifies all on change. Risks: slow observers, memory leaks from forgotten subscriptions."
  - front: "4-line pattern answer"
    back: "Problem -> Idea -> Example in this design -> Trade-off (when not to use it)."
keyTakeaways:
  - "Explain each pattern as problem, idea, example and trade-off, not as a memorised definition."
  - "Singleton: one instance; prefer eager, holder or enum for thread safety; beware global state."
  - "Builder: readable creation of complex objects with validation in build()."
  - "Factory hides which class is created; Strategy swaps behaviour; they often work together."
  - "Observer notifies subscribers in-process; across services it becomes pub-sub over a queue."
  - "Use patterns when the problem appears, not by default."
