        right: "A birthday or a holiday"
      - left: "Instant"
        right: "created_at timestamp stored in the database"
      - left: "ZonedDateTime"
        right: "Showing a meeting time to a user in their zone"
      - left: "Duration"
        right: "An OTP valid for 5 minutes"
      - left: "Period"
        right: "A person's age in years and months"
    explanation: "Calendar-only values use LocalDate, exact moments use Instant, display in a zone uses ZonedDateTime, time amounts use Duration and date amounts use Period."
  - id: q6
