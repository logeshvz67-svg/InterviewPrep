  modelAnswer: |
    Two pointers means using two indexes that move smartly instead of checking every pair. For a pair with a target sum in a sorted array, I put one pointer at each end, like two people at the cheap and expensive ends of a sorted shoe rack. If the sum is too big, the right one moves left; if too small, the left one moves right. Because it's sorted, each move safely discards one item, so it's O(n) instead of O(n squared), with O(1) space. The other variant is slow and fast pointers going the same way: fast reads every element and slow writes only the ones to keep, like removing duplicates or moving zeros. I also use it for reversing and palindromes.
