otherCompanies: "Shows up as part of 'Java 8 features' at TCS, Wipro, Cognizant, Accenture, Capgemini; product companies expect you to read and write them easily."
why: |
  In the last lesson you wrote lambdas like `s -> s.toUpperCase()` and `x -> System.out.println(x)`. Notice something? These lambdas **do nothing except call one existing method**.

  Java 8 gives a shorter way to say exactly that: the **method reference**, written with a double colon `::`.
  ```java
  names.forEach(System.out::println);
  ```
  You will see `::` everywhere in real code, Spring projects and stream answers. Interviewers often ask you to **convert a lambda into a method reference** (or back), and to name the **four kinds**. Once you see the pattern, it's easy.
analogy: |
  Imagine you want someone to make tea. You can **describe the steps** ("boil water, add tea, add milk, add sugar"), or you can just say **"Do it the way Amma does"**.

  A lambda is describing the steps: `x -> Amma.makeTea(x)`.
  A method reference is just **pointing to the person who already knows how**: `Amma::makeTea`.

  Same result, fewer words. And just like you can only point to someone if they really can do the job, a method reference only works when an existing method **fits the shape** of what's needed.
