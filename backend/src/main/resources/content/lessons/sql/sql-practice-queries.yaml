explanation: |
  All results below were produced on our sample tables in PostgreSQL. Distinct salaries, highest first: 90000, 80000, 75000, 60000, 50000, 45000 (60000 appears twice).

  ### 1. Nth highest salary (N = 2)
  **Way 1: DENSE_RANK (best general answer)**
  ```sql
  SELECT DISTINCT salary
  FROM (SELECT salary,
               DENSE_RANK() OVER (ORDER BY salary DESC) AS dr
        FROM employees) t
  WHERE dr = 2;                                  -- 80000
  ```
  DENSE_RANK gives tied salaries the same rank with no gaps, so `dr = N` is always the Nth distinct salary. Change `salary` to `name, salary` (and drop DISTINCT) to also see **who** earns it.

  **Way 2: DISTINCT + LIMIT/OFFSET**
  ```sql
  SELECT DISTINCT salary
  FROM employees
  ORDER BY salary DESC
  LIMIT 1 OFFSET 1;                              -- skip N-1 rows; 80000
  ```
  The DISTINCT matters: without it, ties are counted twice. For N = 5, `LIMIT 1 OFFSET 4` without DISTINCT returns 60000 (the second copy of 60000), but the correct 5th highest distinct salary is 50000.

  **Way 3: correlated subquery (works everywhere, even without window functions)**
  ```sql
  SELECT DISTINCT e1.salary
  FROM employees e1
  WHERE 1 = (SELECT COUNT(DISTINCT e2.salary)   -- N-1 = 1
             FROM employees e2
             WHERE e2.salary > e1.salary);       -- 80000
  ```
  "The Nth highest salary is the one with exactly N-1 distinct salaries above it."

  **Second highest only (classic short form):**
  ```sql
  SELECT MAX(salary) AS second_highest
  FROM employees
  WHERE salary < (SELECT MAX(salary) FROM employees);   -- 80000
  ```
  If N is bigger than the number of distinct salaries, Ways 1-3 return **no row**. If the question says "return NULL", wrap it: `SELECT (SELECT DISTINCT salary ... LIMIT 1 OFFSET 9) AS tenth_highest;` gives NULL.

  ### 2. Find duplicate rows
  Imagine a `customer_signups` table where an import ran more than once:
  ```
   signup_id | name  |   city
  -----------+-------+-----------
           1 | Anil  | Bengaluru
           2 | Sneha | Mumbai
           3 | Anil  | Bengaluru
           4 | Rahul | Pune
           5 | Sneha | Mumbai
           6 | Anil  | Bengaluru
  ```
  ```sql
  SELECT name, city, COUNT(*) AS copies
  FROM customer_signups
  GROUP BY name, city
  HAVING COUNT(*) > 1;
  -- Anil Bengaluru 3 | Sneha Mumbai 2
  ```
  Group by **all the columns that define "the same"**, then keep groups with more than one row.

  ### 3. Delete duplicates, keep the first (lowest id)
  ```sql
  -- Way A: keep MIN(id) of each group
  DELETE FROM customer_signups
  WHERE signup_id NOT IN (SELECT MIN(signup_id)
                          FROM customer_signups
                          GROUP BY name, city);

  -- Way B: ROW_NUMBER, delete everything after the first
  DELETE FROM customer_signups
  WHERE signup_id IN (
    SELECT signup_id FROM (
      SELECT signup_id,
             ROW_NUMBER() OVER (PARTITION BY name, city ORDER BY signup_id) AS rn
      FROM customer_signups) t
    WHERE rn > 1);

  -- Way C (PostgreSQL): self join with USING
  DELETE FROM customer_signups a
  USING customer_signups b
  WHERE a.name = b.name AND a.city = b.city
    AND a.signup_id > b.signup_id;
  ```
  All three leave rows 1 (Anil), 2 (Sneha) and 4 (Rahul). Run them inside `BEGIN ... ROLLBACK` first to test safely.

  > MySQL difference: MySQL refuses a subquery that reads the same table you are deleting from (error 1093). Wrap the subquery in one more derived table (as Way B already does), or use MySQL's join syntax: `DELETE a FROM customer_signups a JOIN customer_signups b ON a.name = b.name AND a.city = b.city AND a.signup_id > b.signup_id;`

  ### 4. Employees earning more than their manager
  ```sql
  SELECT e.name AS employee, e.salary, m.name AS manager, m.salary AS manager_salary
  FROM employees e
  JOIN employees m ON e.manager_id = m.emp_id
  WHERE e.salary > m.salary;
  ```
  ```
   employee | salary | manager | manager_salary
  ----------+--------+---------+----------------
   Divya    |  80000 | Ravi    |          75000
  ```
  A **self join**: `e` is the employee copy, `m` the manager copy. INNER JOIN is fine here because Asha (no manager) can't earn more than nobody.

  ### 5. Department-wise highest salary, with names
  Max only: `SELECT dept_id, MAX(salary) FROM employees GROUP BY dept_id;`

  With the employee's name (keeps ties):
  ```sql
  SELECT d.dept_name, e.name, e.salary
  FROM employees e
  JOIN departments d ON d.dept_id = e.dept_id
  WHERE (e.dept_id, e.salary) IN (SELECT dept_id, MAX(salary)
                                  FROM employees
                                  GROUP BY dept_id)
  ORDER BY d.dept_name, e.name;
  ```
  ```
    dept_name  | name  | salary
  -------------+-------+--------
   Engineering | Asha  |  90000
   HR          | Meena |  50000
   Sales       | Kiran |  60000
   Sales       | Priya |  60000
  ```
  You can't just add `name` to the GROUP BY query: GROUP BY would then make one group per name. The `(col1, col2) IN (subquery)` form compares pairs. A window version (`DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) = 1`) works too.

  ### 6. Second highest salary in each department
  ```sql
  SELECT dept_id, name, salary
  FROM (SELECT dept_id, name, salary,
               DENSE_RANK() OVER (PARTITION BY dept_id
                                  ORDER BY salary DESC) AS dr
        FROM employees) t
  WHERE dr = 2;
  -- 10 | Divya | 80000
  ```
  Only Engineering has a second distinct salary. Sales has two people but both earn 60000 (both rank 1), so there is no second highest there. Explain this edge case out loud in an interview.

  ### 7. Customers with no orders
  ```sql
  SELECT c.name
  FROM customers c
  LEFT JOIN orders o ON o.customer_id = c.customer_id
  WHERE o.order_id IS NULL;                      -- Fatima

  SELECT c.name
  FROM customers c
  WHERE NOT EXISTS (SELECT 1 FROM orders o
                    WHERE o.customer_id = c.customer_id);   -- Fatima
  ```
  Avoid `NOT IN (SELECT customer_id FROM orders)` if customer_id in orders could ever be NULL (the NOT IN trap from the subqueries lesson).

  ### 8. Running total
  ```sql
  SELECT order_id, order_date, amount,
         SUM(amount) OVER (ORDER BY order_date, order_id) AS running_total
  FROM orders;
  -- 2500, 3700, 4500, 7500, 8700, 10200
  ```
  Without window functions (old MySQL), use a correlated subquery: `(SELECT SUM(o2.amount) FROM orders o2 WHERE o2.order_date <= o.order_date)`.

  ### How to talk through any query in an interview
  1. Repeat the question and name the tables and columns you need.
  2. Say the **pattern** ("this is a per-group ranking, so DENSE_RANK with PARTITION BY").
  3. Write it step by step, inner query first.
  4. Check **edge cases**: ties, NULLs, empty groups, N larger than the number of rows.
tinyCode:
  code: |
    -- 2nd highest salary, three ways (all return 80000)

    SELECT DISTINCT salary
    FROM (SELECT salary,
                 DENSE_RANK() OVER (ORDER BY salary DESC) AS dr
          FROM employees) t
    WHERE dr = 2;

    SELECT DISTINCT salary
    FROM employees
    ORDER BY salary DESC
    LIMIT 1 OFFSET 1;

    SELECT DISTINCT e1.salary
    FROM employees e1
    WHERE 1 = (SELECT COUNT(DISTINCT e2.salary)
               FROM employees e2
               WHERE e2.salary > e1.salary);
  walkthrough: |
    - **Way 1**: the inner query ranks salaries: 90000 gets 1, 80000 gets 2, 75000 gets 3, both 60000s get 4... The outer query keeps rank 2. DISTINCT avoids repeats if two people share that salary.
    - **Way 2**: `DISTINCT` removes repeated salaries, `ORDER BY salary DESC` puts the biggest first, `OFFSET 1` skips one value (90000), and `LIMIT 1` takes the next one. For the Nth highest, use `OFFSET N-1`.
    - **Way 3**: for each salary, the subquery counts how many **different** salaries are bigger. Only 80000 has exactly one bigger salary (90000), so it's the 2nd highest. For the Nth highest, compare with N-1.
    - All three agree: **80000** (Divya).
tryIt:
  instructions: "Type these three classic queries from memory as much as you can, then compare. Predict each result before running: who earns more than their manager? Who has no orders? Who is second in each department?"
  code: |
    -- 1. Employees earning more than their manager
    SELECT e.name, e.salary, m.name AS manager, m.salary AS mgr_salary
    FROM employees e
    JOIN employees m ON e.manager_id = m.emp_id
    WHERE e.salary > m.salary;

    -- 2. Customers with no orders
    SELECT c.name
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.customer_id
    WHERE o.order_id IS NULL;

    -- 3. Second highest salary in each department
    SELECT dept_id, name, salary
    FROM (SELECT dept_id, name, salary,
                 DENSE_RANK() OVER (PARTITION BY dept_id
                                    ORDER BY salary DESC) AS dr
          FROM employees) t
    WHERE dr = 2;
