why: |
  Many coding problems have the words **"k largest"**, **"k smallest"**, **"closest"**, **"most frequent"** or **"always pick the cheapest next"**. Sorting the whole array works, but costs O(n log n) and often more memory than needed.

  A **PriorityQueue** gives you the **smallest (or largest) item at any moment** in O(log n) per operation. It turns hard-looking problems into 10-line solutions.

  It also hides a classic interview trap: **printing a PriorityQueue does NOT show sorted order**. After this lesson you will know exactly why.
analogy: |
  Think of a **hospital emergency room**.

  Patients don't get treated in arrival order. The nurse always calls the **most serious patient next**. When a new patient arrives, the nurse quickly decides where they fit in the priority, without re-sorting the whole waiting room.

  But if you look at the waiting room chairs, people are not sitting in a perfect line from most serious to least serious. The nurse only guarantees one thing: **the person called next is the most serious one**. That is exactly a PriorityQueue: only the **head** is guaranteed.
