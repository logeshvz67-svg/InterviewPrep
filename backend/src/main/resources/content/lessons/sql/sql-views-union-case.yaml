infosysRelevance: "UNION vs UNION ALL, views and CASE WHEN are frequent SQL theory and query-writing practice for DSE and SP rounds."
otherCompanies: "'Difference between UNION and UNION ALL' and 'what is a view' are common practice questions at TCS, Wipro, Cognizant, Accenture and Capgemini."
why: |
  Three small tools that make SQL much more powerful:
  - A **view** saves a complicated query under a name, so others can use it like a simple table.
  - **UNION** stacks the results of two queries on top of each other.
  - **CASE WHEN** is SQL's if-else: it turns numbers into labels, and powers "count how many of each kind" reports.

  Plus **COALESCE**, the standard way to replace NULL with something readable.

  "UNION vs UNION ALL" is a classic interview question, and CASE shows up in almost every practical SQL task.
analogy: |
  - A **view** is like a **saved filter in your phone's gallery** ("Photos of Mom"). It doesn't copy the photos; each time you open it, it shows the current matching photos.
  - **UNION** is like merging **two class attendance lists** into one list for the assembly. **UNION** removes names that appear in both; **UNION ALL** keeps everyone, even repeats (and is faster, because nobody checks for duplicates).
  - **CASE WHEN** is like the **grading rule** on an exam: 90+ is A, 75+ is B, otherwise C. The teacher checks the rules **from top to bottom** and stops at the first one that fits.
