why: |
  **"What is the difference between checked and unchecked exceptions?"** is one of the most common Java interview questions. It looks like a definition question, but a good answer shows you understand *design*: why Java forces some handling and not other handling.

  It also matters while coding. If you call `Thread.sleep(100)` or open a file and forget to handle the exception, your program **won't even compile**. Knowing the rule tells you instantly how to fix the red error.

  In this lesson you will learn:
  - the exact rule to decide checked vs unchecked,
  - the two ways to satisfy the compiler ("handle or declare"),
  - when each kind is the right choice.
analogy: |
  Think of **travelling by flight**.

  - **Checked exception** = the airline's rule: "You **must** carry a valid ID." Security checks it **before** you board. If you don't have a plan for it, you are stopped at the gate. In Java, the **compiler** is security, and it stops your code before it runs.
  - **Unchecked exception** = **you trip on the stairs** because you were looking at your phone. Nobody checks for that at the gate. It is your own carelessness, and the fix is to be careful (fix the bug), not to fill a form.
