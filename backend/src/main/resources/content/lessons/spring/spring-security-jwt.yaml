patternCode: null
companies: [INFOSYS_SP, INFOSYS_DSE, PRODUCT, ALL]
infosysRelevance: "Strong SP practice topic and a common DSE project question: authentication vs authorization, BCrypt, how JWT login works, and 401 vs 403 come up whenever your project has a login."
otherCompanies: "Service companies (TCS, Wipro, Cognizant, Accenture, Capgemini) ask the basics (JWT structure, BCrypt, roles). Product companies go deeper: filter chain order, refresh token rotation, stateless sessions, CORS and CSRF."
why: |
  Almost every project you will talk about has a **login**. The moment you say "JWT", the interviewer will ask: *How does the token travel? Where is it checked? Why BCrypt? What is a refresh token? Why did you disable CSRF?*

  Security is also where small mistakes are expensive: plain-text passwords, tokens that never expire, an admin URL open to everyone.

  Your `backend` has a complete, well-commented JWT setup: `SecurityConfig`, `JwtAuthFilter`, `JwtService` and `AuthService`. This lesson walks through it so you can explain **your own code** step by step.
analogy: |
  Think of an **IT company office building**.

  - At the **gate**, security checks your ID card: "Who are you?" That is **authentication**.
  - On each floor, your card opens only some doors: the server room needs an "ADMIN" card. "What are you allowed to do?" That is **authorization**.
  - The gate is a **line of checkpoints** (metal detector, ID scan, register): the **security filter chain**. Every visitor passes through all checkpoints before reaching any desk (controller).
  - Your **access card** (JWT) has your name and floor access printed on it, plus a **hologram seal** (signature). Guards don't phone HR each time; they just check the seal. If someone edits the printed text, the seal no longer matches.
  - The card expires every evening (short-lived **access token**). Each morning you show your **long-term employee letter** (refresh token) at reception to get a new card. If the letter is reported stolen, HR cancels it (revocation).
