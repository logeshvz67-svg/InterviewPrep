infosysRelevance: "The bridge to Spring Boot: understanding how @Component, @Autowired and @GetMapping work at runtime is useful for SP and DSE interviews that go into frameworks."
otherCompanies: "Product companies often ask how frameworks work under the hood; reflection and custom annotations are the answer."
why: |
  When you write `@RestController` or `@Autowired` in Spring Boot, *who reads those `@` words* and acts on them? The answer is **reflection**.

  - **Annotations** are labels you stick on classes, methods and fields.
  - **Reflection** is Java's ability to look at a class **while the program is running**: list its methods, read its labels, create objects and call methods by name.

  Put them together and you understand how Spring, JUnit and Hibernate work. Interviewers ask "how does @Autowired work?" or "what is @Retention?" to see if you understand frameworks, not just use them.
analogy: |
  Think of **luggage at an airport**.

  - You stick **tags** on bags: "FRAGILE", "PRIORITY", "BLR". The tags don't move the bag; they are just information. Those are **annotations**.
  - The **scanner and sorting staff** look at every bag, read the tags, and act: priority bags go first, fragile bags are handled gently. That is **reflection** (the framework reading your classes at runtime).
  - Some tags are **removed at check-in** (only the counter staff see them). Others **stay on the bag all the way** to the destination. That is **retention**: `SOURCE` tags vanish after compiling, `RUNTIME` tags are still there while the program runs, so the framework can read them.
