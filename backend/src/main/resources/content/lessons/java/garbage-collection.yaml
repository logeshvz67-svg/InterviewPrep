infosysRelevance: "Common theory question for SP and DSE rounds: when an object becomes eligible for GC, GC roots, generations and why System.gc() is only a request."
otherCompanies: "A standard JVM question at TCS, Wipro, Cognizant, Accenture, Capgemini, and a starting point for deeper GC tuning talks in product companies."
why: |
  In C, programmers must free memory by hand, and forgetting causes crashes. In Java you just write `new` and never `delete`. Who cleans up? The **garbage collector (GC)**.

  Interviewers ask:
  - **"What is garbage collection?"**
  - **"When is an object eligible for garbage collection?"** (often as "how many objects are eligible after this line?")
  - **"What are GC roots?"**, **"What are the young and old generations?"**
  - **"Does `System.gc()` force garbage collection?"** (No!)

  Knowing these also helps you understand memory leaks (next lesson) and why some apps "pause" for a moment.
analogy: |
  Think of a **housing society's cleaning staff** on a big festival day.

  - The staff don't ask "is this plate dirty?". They ask **"can anyone still reach this from a resident's flat?"** If a plate is still connected to someone (it's on their table), it stays. If nobody is connected to it, it goes in the bin.
  - The **residents' flats** are the **GC roots**: the starting points. Anything linked to them, directly or through a chain, is kept.
  - Most plates are **used once and thrown quickly** (paper plates). So the staff clean the **party hall (young generation)** very often and very fast. Steel utensils that have survived many cleanings are moved to the **store room (old generation)**, which is cleaned rarely because it's slow and things there usually stay.
  - Calling `System.gc()` is like **requesting** the staff to clean now. They *may* come, but they decide.
