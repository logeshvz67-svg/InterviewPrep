otherCompanies: "A favourite 'how does it work inside?' question at TCS, Wipro, Cognizant, Accenture, Capgemini and almost every product company."
why: |
  You use `HashMap` in nearly every coding problem: counting frequencies, two-sum, caching, grouping. Interviewers know this, so they love to ask: **"How does HashMap work internally?"**

  A good answer shows that you understand:
  - **hashing**: turning a key into a number,
  - **buckets** and **collisions**: what happens when two keys land in the same place,
  - **resize**: why the map suddenly grows,
  - **why `equals()` and `hashCode()` must agree**.

  This one question can last 10 minutes and lead to follow-ups on `ConcurrentHashMap`, red-black trees and Big-O. Once you see the picture inside, all of these become easy to talk about.
analogy: |
  Think of a **post office with numbered pigeonholes** (small boxes on the wall).

  - Every letter (a **key-value pair**) has an address (the **key**).
  - The clerk does a quick calculation on the address, for example "take the PIN code and look at the last digit". That gives a box number. This calculation is **hashing**, and the box is a **bucket**.
  - Two different addresses can give the same box number. That is a **collision**. The clerk simply stacks both letters in the same box, and when you ask for your letter, he looks through that small stack and reads the full address (that is **`equals()`**).
  - If a box gets crazy full (more than 8 letters) in a big post office, the clerk sorts that stack into a neat **binary tree** so finding a letter is faster.
  - When the whole wall is 75% full, the post office builds a **wall twice as big** and moves every letter to its new box. That is **resize**.
