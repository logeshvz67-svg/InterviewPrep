infosysRelevance: "Critical section, race condition and mutex vs semaphore are core OS questions for SP and DSE, and they connect directly to Java multithreading questions."
otherCompanies: "Mutex vs semaphore and producer-consumer are common in TCS, Wipro, Cognizant, Accenture and Capgemini interviews; product companies often ask you to code producer-consumer in Java."
why: |
  The moment two threads share data, bugs can appear that happen **once in a thousand runs**. These are race conditions, and **synchronization** is how we stop them.

  This lesson is high value because:
  - **"Mutex vs semaphore"** is one of the most asked OS questions,
  - **producer-consumer** is a classic you may be asked to explain or code,
  - it is the theory behind Java's `synchronized`, `Semaphore`, `BlockingQueue` and `AtomicInteger`.
analogy: |
  Think of a **single-seat public washroom at a railway station**.

  - The washroom is the **critical section**: only one person should be inside.
  - The **lock on the door** is a **mutex**: whoever locks it must be the one who unlocks it.
  - Now think of a **parking lot with 5 spaces and a counter board** showing free spaces. That board is a **counting semaphore**: up to 5 cars can be inside; car number 6 waits until someone leaves and the count goes up.
  - Two people pushing the washroom door at the same moment and both getting in is a **race condition**.
visual:
  diagram: |
    Race condition: count++ is really 3 steps

    Thread A               Thread B              count (memory)
    read count  (0)                                   0
                           read count  (0)            0
    add 1 -> 1                                        0
                           add 1 -> 1                 0
    write 1                                           1
                           write 1                    1   <- lost update!

    With a lock:
    A: [lock] read 0, add, write 1 [unlock]           1
    B:        waits ...   [lock] read 1, write 2      2   correct
  caption: "count++ is read, add, write. If two threads interleave those steps, one update is lost. A lock makes the three steps happen as one unit."
