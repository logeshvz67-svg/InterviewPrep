              System.out.println(n + 4);
          }
      }
    acceptedAnswers: ["parseInt"]
    explanation: "Integer.parseInt returns a primitive int, so n + 4 is 260. Integer.valueOf would also compile (it returns an Integer which is unboxed), but parseInt is the direct way to get an int."
explainBack:
  prompt: "Explain wrapper classes, autoboxing, the Integer cache trap and the unboxing NullPointerException to a friend."
  rubric:
    - "I said wrappers wrap primitives as objects, needed for collections and null"
    - "I explained autoboxing (valueOf) and unboxing (intValue) are automatic"
    - "I explained the -128 to 127 cache and why == fails for 128"
    - "I said to use equals() for comparing wrapper values"
    - "I explained that unboxing null throws NullPointerException and how to avoid it"
  modelAnswer: |
    Each primitive has a wrapper class, like int and Integer, so numbers can live in collections and can be null. Java converts automatically: boxing uses Integer.valueOf and unboxing uses intValue. The trap is that valueOf keeps ready-made objects for -128 to 127. So two Integers of 127 are the same object and == says true, but two Integers of 128 are different objects and == says false. That's because == compares references, so I always use equals for wrapper values. The second trap: if an Integer is null, like a missing key from map.get, assigning it to an int calls intValue on null and throws a NullPointerException. I use getOrDefault or a null check.
