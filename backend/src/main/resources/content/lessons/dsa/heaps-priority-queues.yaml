infosysRelevance: "Important for SP preparation: top-k, kth largest and merge-k-sorted problems are classic medium-level questions where a heap turns a full sort into O(n log k)."
otherCompanies: "Product-company interviews use heaps heavily (top k frequent, k closest points, median of a stream, task scheduling, Dijkstra). Less common in basic service-company rounds, but PriorityQueue usage is a useful Java skill everywhere."
why: |
  Many problems ask for **"the smallest / largest so far"** again and again while items keep arriving:
  - the **k largest** scores out of a million,
  - the **next task** with the highest priority,
  - merging **k sorted lists** by always taking the smallest head.

  Sorting everything costs **O(n log n)** and you would have to re-sort after every new item. A **heap** gives you the minimum (or maximum) in **O(1)** and lets you add or remove an item in **O(log n)**. In Java, the heap is ready-made: `PriorityQueue`.

  The key interview idea is the **"heap of size k"** trick: to find the k largest items, keep only k items in a **min-heap** and throw away the smallest whenever it grows beyond k. That is **O(n log k)**, much better than sorting when k is small.
analogy: |
  Think of a **hospital emergency ward**. Patients don't get treated in arrival order (that would be a queue). The most serious case is always treated next, even if they arrived last. That is a **priority queue**.

  Now think of how the ward keeps track: a **sports tournament bracket** in reverse. Every "match" (parent) is won by the more urgent patient, so the most urgent one always sits at the top. When the top patient leaves, the remaining contenders replay only a few matches along one path to find the new winner, not the whole tournament. That's why removing is just **O(log n)**.
