predict:
  code: |
    public class StatusPredict {
        static String kind(int code) {
            return switch (code / 100) {
                case 2 -> "success";
                case 3 -> "redirect";
                case 4 -> "client error";
                case 5 -> "server error";
                default -> "info";
            };
        }

        public static void main(String[] args) {
            int[] codes = {201, 304, 403, 503};
            for (int c : codes) System.out.println(c + " " + kind(c));
        }
    }
  expectedOutput: |
    201 success
    304 redirect
    403 client error
    503 server error
  explanation: |
    Integer division by 100 gives the first digit, which is the status class. 201 Created is a 2xx success; 304 Not Modified is in the 3xx redirection class (it tells the browser to use its cached copy); 403 Forbidden is a 4xx client error; 503 Service Unavailable is a 5xx server error.
commonMistakes:
  - "Saying 401 and 403 are the same. 401 = not authenticated (who are you?); 403 = authenticated but not allowed."
  - "Saying POST is idempotent. Repeating a POST can create duplicates; PUT and DELETE are idempotent."
  - "Thinking GET is secure for passwords because the URL is hidden in HTTPS. URLs get stored in logs and history; send secrets in the body or headers."
  - "Saying HTTPS encrypts using only the public key. Public-key crypto is used to agree on a key; the data is encrypted with a fast symmetric session key."
  - "Thinking HTTP remembers the user. It is stateless; cookies, sessions or tokens add state."
  - "Returning 200 for everything in a REST API. Use 201 for created, 204 for no content, 4xx for client mistakes."
interviewBox:
  why: "Why interviewers ask this: any backend or full-stack role builds HTTP APIs, so they check that you know the vocabulary and can design endpoints properly."
  questions:
    - q: "What is the difference between GET and POST?"
      a: "GET is used to read data; parameters go in the URL, it is safe and idempotent, and responses can be cached and bookmarked. POST is used to create or submit data; the data goes in the request body, it is not idempotent, and it is not cached by default."
    - q: "What is the difference between HTTP and HTTPS?"
      a: "HTTPS is HTTP running over TLS. It encrypts the data, protects it from being changed, and proves the server's identity with a certificate signed by a trusted authority. HTTP uses port 80 and sends plain text; HTTPS uses port 443."
    - q: "Explain the TLS handshake simply."
      a: "The client says hello with the TLS versions and ciphers it supports. The server replies with its choice and its certificate. The client checks the certificate is valid for that domain and signed by a trusted CA. Then both sides use a key exchange like Diffie-Hellman to compute the same session key, and all further data is encrypted with that fast symmetric key."
    - q: "What does idempotent mean? Which methods are idempotent?"
      a: "Idempotent means calling it once or many times has the same effect on the server. GET, PUT, DELETE, HEAD and OPTIONS are idempotent. POST is not, because each call can create a new resource."
    - q: "Cookies vs JWT tokens for authentication?"
      a: "With session cookies, the server stores the session and the browser sends a session id cookie automatically. With JWT, the server issues a signed token holding the user info and expiry, and the client sends it in the Authorization header; the server just verifies the signature, so it's stateless and scales easily, but it's harder to revoke before expiry."
quiz:
  - id: q1
    type: MATCH
    prompt: "Match each status code to its meaning"
    pairs:
      - left: "201"
        right: "Resource created"
      - left: "301"
        right: "Moved permanently"
      - left: "401"
        right: "Not authenticated"
      - left: "403"
        right: "Authenticated but not allowed"
      - left: "500"
        right: "Server crashed or failed"
    explanation: "2xx success, 3xx redirection, 4xx client errors (401 vs 403 is a favourite trap), 5xx server errors."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      int[] codes = {204, 404, 502};
      for (int c : codes)
          System.out.print((c / 100 == 4 ? "client" : c / 100 == 5 ? "server" : "ok") + " ");
    options: ["ok client server ", "ok ok server ", "client client server ", "ok client client "]
    answer: 0
    explanation: "204 / 100 = 2, so 'ok'. 404 / 100 = 4, so 'client'. 502 / 100 = 5, so 'server'. Each word is followed by a space."
  - id: q3
    type: MCQ
    prompt: "Which HTTP method is NOT idempotent?"
    code: null
    options: ["GET", "PUT", "DELETE", "POST"]
    answer: 3
    explanation: "Sending the same POST twice can create two orders. PUT replaces with the same data each time, and DELETE leaves the resource deleted no matter how many times you call it."
  - id: q4
    type: TRUE_FALSE
    prompt: "In HTTPS, after the handshake, the actual page data is encrypted with a symmetric session key."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Asymmetric (public-key) cryptography is slow, so it's used only during the handshake to authenticate and agree on keys; the bulk data uses fast symmetric encryption."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Complete the header that sends a JWT token to a REST API."
    code: |
      Authorization: ____ eyJhbGciOiJIUzI1NiJ9...
    acceptedAnswers: ["Bearer", "bearer"]
    explanation: "The common scheme is 'Authorization: Bearer <token>'. 'Basic' would mean a base64 username:password instead."
  - id: q6
    type: MCQ
    prompt: "HTTP is called 'stateless'. What does that mean?"
    code: null
    options: ["It cannot send data", "Each request is independent; the server doesn't remember previous requests by itself", "It only works without TCP", "It cannot use cookies"]
    answer: 1
    explanation: "Stateless means no built-in memory between requests. Cookies, sessions and tokens are added ON TOP of HTTP to remember a logged-in user."
  - id: q7
    type: MCQ
    prompt: "A client sends PATCH /users/7 with body {\"city\":\"Pune\"}. What should happen?"
    code: null
    options: ["User 7 is replaced fully with only a city field", "Only user 7's city is updated", "A new user is created", "User 7 is deleted"]
    answer: 1
    explanation: "PATCH is a partial update: only the sent fields change. A PUT with that body would replace the whole resource, which could clear the other fields."
explainBack:
  prompt: "Explain to a friend what happens in an HTTP request and response, and what the S in HTTPS adds."
  rubric:
    - "I described request line, headers and body, and status line in the response"
    - "I explained GET vs POST and at least three status code ranges"
    - "I said HTTP is stateless and cookies or tokens add state"
    - "I explained HTTPS as HTTP over TLS with encryption, integrity and certificates"
    - "I used the restaurant order analogy or another example"
  modelAnswer: |
    HTTP is how a client and server talk. The client sends a request: a method like GET or POST, a path like /orders, headers with extra info like the content type or a token, and sometimes a JSON body. The server replies with a status code, like 200 OK, 201 Created, 404 Not Found or 500 server error, plus headers and a body. HTTP doesn't remember you between requests, so we use cookies or tokens to stay logged in. HTTPS is the same conversation inside a sealed envelope: TLS checks the server's certificate, both sides agree on a secret key, and then everything is encrypted so nobody on the Wi-Fi can read or change it.
flashcards:
  - front: "Parts of an HTTP request"
    back: "Request line (method, path, version), headers, blank line, optional body."
  - front: "Idempotent methods"
    back: "GET, PUT, DELETE, HEAD, OPTIONS. POST is not; PATCH not guaranteed."
  - front: "401 vs 403"
    back: "401 Unauthorized = not authenticated. 403 Forbidden = authenticated but no permission."
  - front: "What does HTTPS add?"
    back: "TLS: encryption, integrity and server authentication via a CA-signed certificate. Port 443."
  - front: "Session cookie vs JWT"
    back: "Cookie: server stores session, browser sends id automatically. JWT: signed token with user info, stateless, sent in Authorization: Bearer."
keyTakeaways:
  - "HTTP is a stateless, client-server, application-layer protocol over TCP (ports 80/443)."
  - "Methods: GET read, POST create, PUT replace, PATCH partial update, DELETE remove; know which are idempotent."
  - "Status classes: 2xx success, 3xx redirect, 4xx client error, 5xx server error."
  - "Cookies/sessions keep state on the server; JWT tokens keep it in a signed token."
  - "HTTPS = HTTP + TLS: certificate check, key exchange, then fast symmetric encryption."
