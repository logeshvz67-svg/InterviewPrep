  - front: "Signpost set"
    back: "'There are two main...' -> 'First...' -> 'Second...' -> 'For example...' -> 'So, in short...' -> stop."
  - front: "Clarifying phrase"
    back: "'Just to confirm, are you asking about...?'"
  - front: "Video call checklist"
    back: "Camera at eye level, light in front, look at camera when speaking, quiet room, test 30 min before."
keyTakeaways:
  - "Clear beats fancy: interviewers need to understand you, not hear perfect English."
  - "Slow down; aim for about 110-160 words per minute."
  - "Replace fillers with short pauses."
  - "Signposts give every answer a map: preview, First/Second, example, summary."
  - "Listen fully, clarify when unsure, and look at the camera on video calls."
