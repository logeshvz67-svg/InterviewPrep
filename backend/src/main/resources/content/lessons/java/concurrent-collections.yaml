title: "ConcurrentHashMap, fail-fast vs fail-safe"
version: 1
estimatedMinutes: 30
rebuild: false
patternCode: null
companies: [INFOSYS_SP, PRODUCT, TCS]
infosysRelevance: "A depth topic for SP technical rounds: it usually comes right after 'how does HashMap work?'."
otherCompanies: "Product companies and TCS advanced roles use it to check multithreading basics; 'fail-fast vs fail-safe' is a common basic question everywhere."
why: |
  Real backend apps (like a Spring Boot server) handle **many users at the same time**. Each request runs on its own **thread** (a separate line of work running in parallel). If two threads change the same `HashMap` together, data can silently get lost.

  Interviewers check two things here:
  1. **"HashMap vs Hashtable vs ConcurrentHashMap"**: how to share a map safely between threads.
  2. **"Fail-fast vs fail-safe iterators"**: what happens when a collection changes while you are looping over it.

  Both questions come up right after HashMap internals, so learning them together makes your answer flow naturally.
analogy: |
  Imagine a **big library** with many shelves.

  - **HashMap** is a library with **no rules**: two people can grab the same register and scribble over each other's entries. Entries get lost.
  - **Hashtable / synchronizedMap** puts **one guard at the main door** who lets in only one person at a time. Safe, but a long queue forms outside.
  - **ConcurrentHashMap** gives **each shelf its own small lock**. Many people work on different shelves at once; they only wait if they need the exact same shelf. Reading is allowed almost freely.

  For iterators: a **fail-fast** iterator is a strict teacher taking attendance who **stops immediately** ("Someone changed the list!") if a student walks in mid-roll-call. A **fail-safe** iterator takes a **photo of the class** first and reads names from the photo, so changes don't disturb it (but it doesn't see them either).
