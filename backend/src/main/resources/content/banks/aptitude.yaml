  question: In how many ways can a team of 3 be chosen from 7 people?
  options: ['21', '210', '42', '35']
  answer: 3
  explanation: Order does not matter in a team, so use combinations. 7C3 = 7! / (3! x 4!) = (7 x 6 x 5) / (3 x 2 x 1) = 210
