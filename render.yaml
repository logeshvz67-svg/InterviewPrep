# Render Blueprint: creates both services from this repo.
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the env vars marked sync:false.
services:
  # ---------- Backend: Spring Boot in Docker (free tier, sleeps after ~15 min idle) ----------
  - type: web
    name: code-quest-api
    runtime: docker
    plan: free
    region: frankfurt              # closest Render region to the Supabase DB (eu-west-3, Paris)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # jdbc:postgresql://<supabase-session-pooler-host>:5432/postgres?sslmode=require
        sync: false
      - key: DATABASE_USERNAME     # postgres.<project-ref>
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: JWT_SECRET
        generateValue: true        # Render creates a random secret for you
      - key: REGISTRATION_ENABLED
        value: "true"              # set to "false" after you create your account
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # e.g. https://code-quest-web.onrender.com
        sync: false
      - key: APP_DEFAULT_TIMEZONE
        value: Asia/Kolkata
      # AI (Phase 3). The app works fully with AI_ENABLED=false.
      - key: AI_ENABLED
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL      # exact current Nemotron ":free" id from openrouter.ai/models
        sync: false
      - key: OPENROUTER_FALLBACK_MODELS
        sync: false
      - key: AI_DAILY_LIMIT_PER_USER
        value: "30"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1500"
      - key: AI_TIMEOUT_SECONDS
        value: "60"

  # ---------- Frontend: static site (free, never sleeps) ----------
  - type: web
    name: code-quest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL          # e.g. https://code-quest-api.onrender.com  (no trailing slash)
        sync: false
    routes:
      - type: rewrite              # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
