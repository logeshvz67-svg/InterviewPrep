infosysRelevance: "Basic logic used in every problem; clean if/else ladders and correct edge-case checks decide whether hidden test cases pass in SP and DSE coding rounds."
otherCompanies: "switch fall-through and allowed switch types are popular MCQs at TCS, Wipro, Cognizant, Accenture and Capgemini. Modern arrow switch is a nice plus in product-company interviews."
why: |
  Programs need to **make decisions**: pass or fail, even or odd, which discount to give, which menu option the user picked. Java gives you two main tools: **`if`** and **`switch`**.

  Why this lesson matters:
  - Almost every coding problem has edge cases ("if the array is empty", "if n is 0"). Getting the order of conditions right is what makes hidden test cases pass.
  - MCQs love **switch fall-through** (forgetting `break`), **which types switch accepts**, and sneaky bugs like a stray semicolon after `if`.
  - Modern Java has a cleaner **arrow switch** (`case 1 -> ...`). Using it shows you write up-to-date code.
analogy: |
  Think of a **railway station enquiry counter**.

  - An **if/else-if ladder** is like the clerk asking questions in order: "Do you have a reservation? If not, is it tatkal? If not, general ticket." He stops at the **first** "yes".
  - A **switch** is like the **platform number board**: you look up one value (the train number) and jump straight to the matching platform.
  - **Fall-through** is like a passenger who gets off at platform 2 but, because nobody stopped him (no `break`), keeps walking through platforms 3 and 4 as well.
