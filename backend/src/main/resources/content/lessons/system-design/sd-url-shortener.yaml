title: "Design a URL shortener"
version: 1
estimatedMinutes: 50
rebuild: false
patternCode: null
companies: [INFOSYS_SP, PRODUCT]
infosysRelevance: "A great first full case study for SP-level design practice: it uses every step of the template and a small, codeable core (base62)."
otherCompanies: "One of the most popular beginner HLD practice questions at product companies, because it is small enough to finish in 45 minutes."
why: |
  "Design a URL shortener like bit.ly or tinyurl" is the **classic first system design question**. It's small enough to finish in one interview, yet it touches almost everything from Lessons 1-7:
  - requirements and **estimates** (it's extremely **read-heavy**),
  - an **API** and a **data model**,
  - a clever **ID-to-short-code** algorithm (**base62**), which you'll code in Java,
  - **caching**, **database scaling**, **rate limiting** and trade-offs.

  If you can walk through this one calmly, you have a template for every other case study. We will do it exactly the way you should in an interview: step by step, out loud.
analogy: |
  Think of **PNR numbers on Indian Railways**.

  Your full booking details are long: train number, date, coach, berth, names, ages. Nobody wants to type all that. So the railway gives a **short PNR** like `4521873960`. Anyone can enter the PNR and get the full details from the railway's database.

  A URL shortener does the same: it takes a long URL like `https://www.example.com/offers/diwali-sale?utm_source=whatsapp&ref=12345` and gives a short code like `https://sho.rt/aZ3x9Q`. When someone opens the short link, the service looks up the code and **redirects** them to the long URL. Just as each PNR must be **unique**, each short code must point to exactly one long URL.
visual:
  diagram: |
    WRITE: create a short link
     Client --POST /api/v1/urls {longUrl}--> App server
                                               | 1. id = next unique id
                                               | 2. code = base62(id)
                                               v
                                       +---------------+
                                       | DB: urls      |
                                       | code -> long  |
                                       +---------------+
    READ: open a short link (100x more often)
     Browser --GET /aZ3x9Q--> LB --> App --> Cache (Redis) --hit--+
                                       |  miss                    |
                                       +--> DB, then fill cache   |
     Browser <--- 302 Found, Location: https://long.url/... <-----+
  caption: "Creating a link generates a unique ID and turns it into a base62 code. Opening a link is a fast lookup (cache first, then database) followed by an HTTP redirect."
