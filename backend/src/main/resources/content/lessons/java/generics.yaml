infosysRelevance: "Core for SP and DSE: every collection you use in coding rounds (List<Integer>, Map<String, Integer>) is generic, and generic syntax questions are common in theory rounds."
otherCompanies: "A basic must-know for TCS, Wipro, Cognizant, Accenture, Capgemini and product companies; often asked as 'why generics?' or 'write a generic method'."
why: |
  Every time you write `List<Integer>` or `Map<String, Integer>` in a coding round, you are using **generics**. Without understanding them, error messages like `incompatible types` or `List<int>` failing will feel random.

  Generics answer a simple need: **"I want one class (like a list) that works for any type, but still safely."**

  Interviewers ask:
  - "Why were generics added? What problem do they solve?"
  - "Write a generic method / generic class."
  - "Why can't you write `List<int>`?"
  - "What does `<T extends Number>` mean?"

  This lesson teaches the core. The next lesson covers wildcards (`?`) and type erasure.
analogy: |
  Think of **steel tiffin boxes with labels**.

  - Without generics, every box is labelled just "**food**". You can put anything in it: rice, sambar, a phone charger. When you open it, you have to **guess** what's inside and hope (a **cast**). Guessing wrong = a mess at lunch time (`ClassCastException` at run time).
  - With generics, the box is labelled "**Box of Idli**" (`Box<Idli>`). The shopkeeper (the **compiler**) refuses to let you put a charger in it. When you open it, you **know** it's idli. No guessing.
  - `T` is just the **blank on the label**: `Box<T>` is a box design where you fill in the food type when you buy it.
