keyTakeaways:
  - "A heap is a complete binary tree in an array; the min (or max) is always at index 0."
  - "Insert sifts up, remove sifts down: O(log n). Peek is O(1)."
  - "Java's PriorityQueue is a min-heap; use Collections.reverseOrder() for a max-heap."
  - "Top k / kth largest: min-heap of size k gives O(n log k)."
  - "A heap is not sorted; poll repeatedly to get sorted order."
