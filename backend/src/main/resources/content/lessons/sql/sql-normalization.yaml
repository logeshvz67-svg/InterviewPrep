infosysRelevance: "Normal forms are classic DBMS theory for DSE and SP technical interviews; be ready to normalize a small table step by step."
otherCompanies: "A very common DBMS practice topic at TCS, Wipro, Cognizant, Accenture and Capgemini ('explain 1NF, 2NF, 3NF with an example')."
why: |
  When people first design a database, they often make one big spreadsheet-style table. It works... until someone changes a customer's city in one row but not the others, or deletes the only order that remembered a product's price.

  **Normalization** is a step-by-step method to split a messy table into clean tables, so each fact is stored **once**.

  Interviewers love it because it tests clear thinking: "Here is a table. What's wrong with it? Normalize it to 3NF." This lesson walks through **one running example** from a raw order sheet all the way to 3NF and BCNF, so you can repeat the same steps in any interview.
analogy: |
  Think of a **family WhatsApp group** where every message repeats everyone's full address.

  If Uncle moves house, someone must edit **every** old message with his address. Miss one, and now the group has two different addresses for him. That's an **update anomaly**.

  The sensible solution: keep **one contact card** per person with their address, and messages only mention the person's name. Change the address once, and it's correct everywhere. Normalization is exactly this: **one fact, one place**, and other tables just point to it.
