title: "ArrayList vs LinkedList vs Vector vs Stack"
version: 1
estimatedMinutes: 35
rebuild: false
patternCode: null
companies: [ALL]
infosysRelevance: "A top comparison question for SP and DSE; knowing the Big-O of each list operation also helps you justify choices in coding rounds."
otherCompanies: "'ArrayList vs LinkedList' is among the most common Java questions at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  **"ArrayList vs LinkedList?"** is one of the most asked Java questions anywhere. Most people answer "LinkedList is faster for insertion" and stop. That answer is only half true, and interviewers know it.

  To answer well you need to know **what is inside** each class, the **Big-O** (how the time grows as the list grows) of each operation, and **why ArrayList wins in most real programs**.

  Vector and Stack are old (legacy) classes, but they still appear in questions: "Vector vs ArrayList?" and "Why not use Stack?". After this lesson you can answer all four in one breath.
analogy: |
  Think of **two ways to seat 100 people**.

  - **ArrayList** is a **row of numbered cinema seats**. To find seat 57, walk straight to it: instant. Adding someone at the end is easy. But squeezing someone into seat 3 means **everyone from seat 3 onwards shifts one seat right**.
  - **LinkedList** is a **treasure hunt with chits**: each person only knows who is next and who is before. Adding someone in the middle is just changing two chits, **but first you must walk the chain from the start to find that spot**. Finding person 57 means asking 57 people one by one.
  - **Vector** is the cinema row with a **security guard** who lets only one person move at a time (synchronized): safe, but slow.
  - **Stack** is a **pile of plates** built on top of that guarded row: last plate in, first plate out.
