  explanation: |
    Because of **type erasure**, `ArrayList<String>` and `ArrayList<Integer>` are the **same class** at run time: plain `ArrayList`. So the comparison is `true` and the simple name is just `ArrayList` (no `<String>`). `instanceof List<?>` is allowed because it doesn't ask about the erased type argument.
commonMistakes:
  - "Trying to add to a List<? extends Number>. It's a producer: you can only read from it."
  - "Expecting to read an Integer from a List<? super Integer>. You only get Object."
  - "Mixing up the direction: extends = the type or anything below; super = the type or anything above."
  - "Thinking generic type information exists at run time. It's erased: List<String> and List<Integer> are the same class."
  - "Overloading methods that differ only in generic type, like m(List<String>) and m(List<Integer>). Name clash compile error."
  - "Using raw types, which can cause heap pollution and a ClassCastException far away from the real mistake."
interviewBox:
  why: "Why interviewers ask this: wildcards and erasure show whether you understand how generics really work, not just how to write List<String>."
  questions:
    - q: "What is the difference between ? extends T and ? super T?"
      a: "? extends T means T or any subclass, like List<? extends Number> accepting a List<Integer>. It's safe to read elements as T but not to add. ? super T means T or any superclass, like List<? super Integer> accepting a List<Number> or List<Object>. It's safe to add T values, but reading only gives Object."
    - q: "What is PECS?"
      a: "Producer Extends, Consumer Super. If a parameter gives me values to read, I use ? extends. If it receives values I write, I use ? super. Collections.copy is an example: the source is List<? extends T> and the destination is List<? super T>."
    - q: "What is type erasure?"
      a: "The compiler uses generic types to check the code and add casts, then removes the type arguments from the bytecode. List<String> becomes List, and T becomes Object or its bound. It was done for backward compatibility with pre-Java 5 code."
    - q: "What are some consequences of type erasure?"
      a: "List<String> and List<Integer> have the same runtime class. We can't do new T() or new T[], can't check instanceof List<String>, can't overload methods that differ only by type argument, and can't use primitives as type arguments."
quiz:
  - id: q1
    type: SPOT_THE_BUG
    prompt: "Which line fails to compile?"
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              List<? extends Number> nums = new ArrayList<Integer>();   // line A
              Number first = nums.isEmpty() ? null : nums.get(0);       // line B
              nums.add(5);                                              // line C
              System.out.println(nums.size());                          // line D
          }
      }
    options: ["Line A", "Line B", "Line C", "Line D"]
    answer: 2
    explanation: "A List<? extends Number> might really be a List<Double>, so the compiler refuses to add an Integer. Line A is fine (an ArrayList<Integer> fits ? extends Number) and line B is fine (reading gives a Number)."
  - id: q2
    type: MCQ
    prompt: "A method only ADDS Integer values into a list passed to it. Which parameter type is best?"
    code: null
    options: ["List<? extends Integer>", "List<? super Integer>", "List<?>", "List<Object>"]
    answer: 1
    explanation: "The list consumes values, so by PECS use ? super Integer. It then accepts List<Integer>, List<Number> and List<Object>. ? extends Integer wouldn't allow adding, List<?> allows only null, and List<Object> rejects a List<Integer> argument."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Map<String, Integer> a = new HashMap<>();
              Map<Integer, List<String>> b = new HashMap<>();
              System.out.println(a.getClass() == b.getClass());
              System.out.println(b.getClass().getName());
          }
      }
    options:
      - "false\njava.util.HashMap<Integer, List<String>>"
      - "true\njava.util.HashMap"
      - "false\njava.util.HashMap"
      - "Compile error: different types can't be compared"
    answer: 1
    explanation: "Type erasure removes the type arguments, so both are just java.util.HashMap at run time: same class, and the name has no <...>. The comparison compiles because both getClass() results have the type Class<? extends Map>."
  - id: q4
    type: TRUE_FALSE
    prompt: "These two methods can exist in the same class: void save(List<String> x) and void save(List<Integer> x)."
    options: ["True", "False"]
    answer: 1
    explanation: "False. After erasure both become save(List x), which is the same signature. The compiler reports 'name clash: ... have the same erasure'."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Complete the signature using PECS: src is only read, dest is only written."
    code: |
      static <T> void copy(List<? extends T> src, List<? ____ T> dest) {
          for (T x : src) dest.add(x);
      }
    acceptedAnswers: ["super"]
    explanation: "dest consumes values, so it uses ? super T. This is exactly how Collections.copy is declared. Using extends for dest would make dest.add(x) a compile error."
  - id: q6
    type: MATCH
    prompt: "Match each type with what it accepts"
    pairs:
      - left: "List<? extends Number>"
        right: "List<Integer>, List<Double>, List<Number>"
      - left: "List<? super Integer>"
        right: "List<Integer>, List<Number>, List<Object>"
      - left: "List<?>"
        right: "A list of any element type"
      - left: "List<Number>"
        right: "Only List<Number> exactly"
    explanation: "extends goes down the family tree, super goes up, ? alone accepts anything, and a plain type argument is invariant (exact match only)."
  - id: q7
    type: MCQ
    prompt: "Why did Java implement generics with type erasure?"
    code: null
    options:
      - "To make generic code run faster"
      - "For backward compatibility with code written before generics (Java 1.4 and earlier)"
      - "To allow primitives like int in collections"
      - "To let instanceof check type arguments"
    answer: 1
    explanation: "Erasure let old raw-type code and new generic code share the same classes and run on the same JVM. It doesn't make code faster, and it is actually the reason primitives and instanceof List<String> are NOT allowed."
explainBack:
  prompt: "Explain PECS and type erasure to a friend in simple words."
  rubric:
    - "I explained ? extends as read-only (producer) with an example"
    - "I explained ? super as write-friendly (consumer) with an example"
    - "I said the PECS phrase: Producer Extends, Consumer Super"
    - "I said type erasure removes type arguments after compile-time checks"
    - "I gave at least one side effect of erasure"
  modelAnswer: |
    Generics are strict: a List<Integer> isn't a List<Number>. Wildcards relax that. If a list only gives me values, like when I sum numbers, I use List<? extends Number>, so it accepts lists of Integers or Doubles, but I can't add to it because I don't know its exact type. If a list only receives values, like when I fill it with Integers, I use List<? super Integer>, so a List<Number> or List<Object> also works. That's PECS: Producer Extends, Consumer Super. Type erasure means the compiler checks the generic types, then removes them, so at run time List<String> and List<Integer> are the same class. That's why I can't write new T().
