slug: complexity-analysis
world: DSA
section: DSA
order: 1
title: "Time and space complexity (Big-O)"
version: 1
estimatedMinutes: 30
rebuild: false
patternCode: COMPLEXITY
companies: [INFOSYS_SP, INFOSYS_DSE, TCS, PRODUCT, ALL]
infosysRelevance: "Core for SP and DSE coding rounds: choosing an approach that fits the input size is what separates a solution that passes all test cases from one that times out."
otherCompanies: "\"What is the time complexity of your solution?\" is a common follow-up in every coding interview, from TCS to product companies."
why: |
  In a coding round, your solution can be **correct and still fail**: the hidden test cases use big inputs, and a slow solution gets **TLE (Time Limit Exceeded)**.

  **Complexity analysis** lets you know *before* you write code whether an idea is fast enough. It is the first tool of every DSA pattern that follows (two pointers, sliding window, hashing...), because each pattern exists to turn a slow solution into a fast one.

  And after every coding question, the interviewer asks: **"What is the time and space complexity?"** You must be able to answer in one line and explain why.
analogy: |
  Imagine finding your friend's name in a **college attendance register** of n students.

  - **O(1)**: you know the roll number, so you open that exact line. Same effort for 60 or 6000 students.
  - **O(log n)**: the names are sorted, so you open the middle, decide "left half or right half", and repeat. 6000 names take only about 13 steps.
  - **O(n)**: the register is not sorted; you read every name, one by one.
  - **O(n^2)**: for every student, you compare them with every other student (for example, to find two with the same birthday).

  Big-O is not about **seconds**. It is about **how the work grows** when the register gets bigger.
