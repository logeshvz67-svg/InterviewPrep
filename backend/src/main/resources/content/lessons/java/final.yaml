companies: [ALL]
infosysRelevance: "Common comparison question for SP and DSE rounds (final vs finally vs finalize); final references and final classes also show up in output and compile-error questions."
otherCompanies: "The final/finally/finalize comparison is a very common basic question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  `final` is one small word with **three different jobs**, depending on where you put it: on a variable, a method, or a class. Interviewers check that you know all three.

  It also comes with the most famous "sounds the same" question in Java:
  **"What is the difference between `final`, `finally` and `finalize`?"**
  They have almost nothing in common except the spelling, and a clear answer here is easy marks.

  And there's a classic trap: a `final` list **can** still have items added to it. If you understand why, you understand references properly.
analogy: |
  Think of **things that are "locked" in daily life**.

  - **final variable** = writing your **date of birth** on your Aadhaar. Once filled in, it can't be changed.
  - **final reference** = a **house address** printed on your ID. The address can't change, but you can still rearrange the furniture **inside** the house. (The variable can't point elsewhere, but the object can change.)
  - **final method** = a **family recipe** your grandmother says must be cooked *exactly* this way; children can use it, but not change it (no overriding).
  - **final class** = a **sealed exam paper packet**: nobody can open it up and make an extended version (no subclass).

  And the look-alikes:
  - **finally** = the **"switch off the lights before leaving"** rule: whatever happens during the day, it's always done at the end.
  - **finalize** = an old idea of a **last note left for the cleaner** before your stuff is thrown away. The cleaner may never read it, so Java has retired it.
