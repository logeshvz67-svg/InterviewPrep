explanation: |
  ### Unit tests: JUnit 5 + Mockito
  A **unit test** checks one class alone. Its dependencies are replaced with **mocks**: fake objects whose answers you program. No Spring context, no database, so it runs in milliseconds.
  - **JUnit 5**: the test framework. `@Test` marks a test method, `@BeforeEach` runs before each test.
  - **Mockito**: creates mocks. `@ExtendWith(MockitoExtension.class)` + `@Mock` creates them; `when(...).thenReturn(...)` programs an answer; `verify(...)` checks that a method was called (or `never()` called).
  - **AssertJ**: readable checks like `assertThat(total).isEqualTo(70)`.

  Open `backend/src/test/java/com/codequest/service/XpServiceTest.java`. It builds `new XpService(events, profiles, streaks, time, achievements)` with mocks; this is easy only because of **constructor injection**. It tests the rules: XP is awarded once, the daily cap stops farming, totals update, and `verify(events, never()).save(any())` proves nothing was saved when it should not be.

  Unprogrammed mock methods return **defaults**: `null` for objects, `0` / `false` for primitives, **empty** `Optional`, `List` and other collections. Mockito's strict stubs also **fail a test** if you program an answer that the test never uses (`UnnecessaryStubbingException`), which keeps tests honest.

  ### Integration tests: @SpringBootTest + MockMvc
  An **integration test** starts the real Spring application context and checks that layers work together: security filter, controller, validation, service, repository, database.
  - `@SpringBootTest` starts the whole app context.
  - `@AutoConfigureMockMvc` + `@Autowired MockMvc mvc` sends fake HTTP requests through the real filter chain, without opening a port.
  - `mvc.perform(get("/health")).andExpect(status().isOk())` and `jsonPath("$.errors.email").exists()` check the response.

  Your `IntegrationTestBase` starts a **real embedded PostgreSQL** (no Docker needed), runs the Flyway migrations on it and adds a movable test clock with `@TestConfiguration` + `@Primary`. `ApiFlowIntegrationTest` then tests real flows: login required (401), validation (400 with field errors), users cannot see each other's data (404), and streaks following Indian midnight.

  Lighter **test slices** also exist: `@WebMvcTest` (only the web layer) and `@DataJpaTest` (only JPA). To replace a bean with a mock inside a Spring test, Boot 3.4+ uses `@MockitoBean` (the older `@MockBean` is deprecated).

  ### Flyway: versioned database migrations
  **Flyway** manages the database schema with numbered SQL files in `src/main/resources/db/migration`. The name format is `V<version>__<description>.sql` (two underscores). Look at your `V1__core_auth_profile_xp.sql` up to `V8__interview_spring_reports.sql`.
  - At startup, Flyway reads its table `flyway_schema_history`, sees which versions were applied, and runs only the **new** ones, **in version order**, each **exactly once**.
  - It stores a **checksum** of each applied file. If someone edits an applied file, the next startup fails with *Migration checksum mismatch*. Rule: **never edit an applied migration; add a new one** (`V9__...`).
  - A new file with a **lower** version than the current one (like `V7_1__...` when the database is at V8) is refused by default (*Detected resolved migration not applied to database*) unless `outOfOrder` is enabled.
  - With `spring.jpa.hibernate.ddl-auto: validate` (your setting), Flyway owns the schema and Hibernate only checks that entities match it.

  Why not `ddl-auto=update`? It cannot rename or drop safely, keeps no history, and behaves differently on each machine. Migrations are reviewable code.

  ### Docker basics
  - **Image**: a read-only package with your app and everything it needs (OS files, JRE, the jar).
  - **Container**: a running instance of an image. Many containers can run from one image.
  - **Dockerfile**: the recipe that builds an image, step by step. Each instruction creates a cached **layer**.

  Read `backend/Dockerfile`:
  | Line | Why |
  |---|---|
  | `FROM maven:3.9-eclipse-temurin-21 AS build` | Stage 1 has Maven and a full JDK to compile |
  | `COPY pom.xml .` then `RUN mvn ... dependency:go-offline` | Dependencies download in their own layer, so code changes don't re-download them |
  | `COPY src ./src` then `RUN mvn ... package` | Build `app.jar` |
  | `FROM eclipse-temurin:21-jre-alpine` | Stage 2: a small JRE-only image to run (no Maven, no source code) |
  | `adduser ... USER app` | Don't run as root |
  | `ENV JAVA_OPTS="-Xmx256m ..."` | Fit the JVM into 512 MB of RAM on the free host |
  | `EXPOSE 8080` | Documents the port (does not publish it by itself) |
  | `ENTRYPOINT ["sh", "-c", "exec java $JAVA_OPTS -jar app.jar"]` | Start the app; `exec` lets Java receive stop signals for graceful shutdown |

  Commands: `docker build -t codequest-api .` then `docker run -p 8080:8080 -e DATABASE_URL=... codequest-api` (`-p` publishes the port, `-e` passes environment variables, which `application.yml` reads).

  ### Monolith vs microservices
  | | Monolith | Microservices |
  |---|---|---|
  | Shape | One deployable app | Many small apps, one per business capability |
  | Deploy | Everything together | Each service separately |
  | Scale | Whole app | Only the busy service |
  | Data | One database | Usually a database per service |
  | Calls between parts | Method calls (fast, transactional) | Network calls (slow, can fail) |
  | Complexity | Low | High: discovery, tracing, retries, eventual consistency |

  Microservice building blocks you should be able to name: **API gateway** (one entry point, e.g. Spring Cloud Gateway), **service discovery** (e.g. Eureka), **config server**, REST clients (OpenFeign / RestClient) or **messaging** (Kafka, RabbitMQ), **circuit breaker** (Resilience4j: stop calling a failing service), **distributed tracing**, and the **saga** pattern for multi-service transactions.

  Honest answer for interviews: Code Quest is a **well-layered monolith**, which is the right choice for a small team and one database. Start with a modular monolith; split into microservices only when teams, scale or deployment speed really need it.
tinyCode:
  code: |
    // RewardService.java (src/main/java) and RewardServiceTest.java (src/test/java)
    package demo.mock;

    import org.junit.jupiter.api.BeforeEach;
    import org.junit.jupiter.api.Test;
    import org.junit.jupiter.api.extension.ExtendWith;
    import org.mockito.Mock;
    import org.mockito.junit.jupiter.MockitoExtension;

    import java.util.List;
    import java.util.Optional;

    import static org.assertj.core.api.Assertions.assertThat;
    import static org.assertj.core.api.Assertions.assertThatThrownBy;
    import static org.mockito.ArgumentMatchers.any;
    import static org.mockito.Mockito.*;

    record Wallet(Long userId, int coins) {}

    interface WalletRepository {
        Optional<Wallet> findByUserId(Long userId);
        Wallet save(Wallet w);
        List<Wallet> findAll();
        int count();
    }

    class RewardService {
        private final WalletRepository wallets;
        RewardService(WalletRepository wallets) { this.wallets = wallets; }

        int reward(Long userId, int coins) {
            if (coins <= 0) throw new IllegalArgumentException("coins must be positive");
            Wallet w = wallets.findByUserId(userId).orElseThrow(() -> new IllegalStateException("no wallet"));
            Wallet updated = new Wallet(userId, w.coins() + coins);
            wallets.save(updated);
            return updated.coins();
        }
    }

    @ExtendWith(MockitoExtension.class)
    class RewardServiceTest {
        @Mock WalletRepository wallets;
        RewardService service;

        @BeforeEach
        void setUp() { service = new RewardService(wallets); }

        @Test
        void addsCoinsAndSaves() {
            when(wallets.findByUserId(1L)).thenReturn(Optional.of(new Wallet(1L, 50)));
            int total = service.reward(1L, 20);
            assertThat(total).isEqualTo(70);
            verify(wallets).save(new Wallet(1L, 70));
        }

        @Test
        void rejectsZeroCoinsWithoutTouchingTheDb() {
            assertThatThrownBy(() -> service.reward(1L, 0)).isInstanceOf(IllegalArgumentException.class);
            verifyNoInteractions(wallets);
        }

        @Test
        void failsWhenWalletMissing() {
            when(wallets.findByUserId(2L)).thenReturn(Optional.empty());
            assertThatThrownBy(() -> service.reward(2L, 5)).hasMessage("no wallet");
            verify(wallets, never()).save(any());
        }
    }
    // mvn test -> Tests run: 3, Failures: 0, Errors: 0
  walkthrough: |
    - `RewardService` gets its `WalletRepository` through the **constructor**, so the test can pass a mock with plain `new`. No Spring needed.
    - `@ExtendWith(MockitoExtension.class)` lets Mockito create the `@Mock WalletRepository wallets` before each test (and enables strict stubbing checks).
    - `@BeforeEach setUp()` builds a fresh service for every test, so tests don't affect each other.
    - **Test 1** (happy path): `when(...).thenReturn(...)` programs the mock to return a wallet with 50 coins. After `reward(1L, 20)`, we check the result is 70 and `verify(wallets).save(new Wallet(1L, 70))` proves the right object was saved. Records have `equals`, so comparing by value works.
    - **Test 2** (invalid input): the exception is thrown **before** any repository call, and `verifyNoInteractions(wallets)` proves the database was never touched.
    - **Test 3** (missing data): the mock returns an empty `Optional`, the service throws "no wallet", and `verify(wallets, never()).save(any())` confirms nothing was saved.
    - Pattern for every test: **Arrange** (set up mocks), **Act** (call the method), **Assert** (check result and interactions). Compare with `XpServiceTest` in your project: same style.
tryIt:
  instructions: "Type this integration test into backend/src/test/java/com/codequest/integration/ (it reuses your IntegrationTestBase with the embedded PostgreSQL). Run it with: mvn test -Dtest=MyFirstApiTest. All 3 tests should pass."
  code: |
    package com.codequest.integration;

    import org.junit.jupiter.api.Test;
    import org.springframework.beans.factory.annotation.Autowired;
    import org.springframework.boot.test.autoconfigure.web.servlet.AutoConfigureMockMvc;
    import org.springframework.http.MediaType;
    import org.springframework.test.web.servlet.MockMvc;

    import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.*;
    import static org.springframework.test.web.servlet.result.MockMvcResultMatchers.*;

    @AutoConfigureMockMvc
    class MyFirstApiTest extends IntegrationTestBase {
        @Autowired MockMvc mvc;

        @Test
        void healthIsPublic() throws Exception {
            mvc.perform(get("/health")).andExpect(status().isOk());
        }

        @Test
        void protectedUrlNeedsLogin() throws Exception {
            mvc.perform(get("/api/auth/me")).andExpect(status().isUnauthorized());
        }

        @Test
        void badLoginBodyIs400WithFieldErrors() throws Exception {
            mvc.perform(post("/api/auth/login").contentType(MediaType.APPLICATION_JSON)
                            .content("{\"email\":\"not-an-email\",\"password\":\"\"}"))
                    .andExpect(status().isBadRequest())
                    .andExpect(jsonPath("$.errors.email").exists());
        }
    }
