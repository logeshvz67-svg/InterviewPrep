        right: "dp[i] = LIS length ending exactly at index i"
    explanation: "A clear one-line state is the heart of every DP. Note LIS uses 'ending at i', which is why its answer is the max over all i."
  - id: q8
    type: MCQ
    prompt: "For 0/1 knapsack with n items and capacity W, what is the time complexity of the table solution?"
    code: null
    options: ["O(n + W)", "O(n x W)", "O(2^n)", "O(n log n)"]
    answer: 1
    explanation: "There are (n+1) x (W+1) states and each is filled in O(1). O(2^n) is brute force over all subsets; O(n log n) would be the greedy ratio sort, which is wrong for 0/1 knapsack."
