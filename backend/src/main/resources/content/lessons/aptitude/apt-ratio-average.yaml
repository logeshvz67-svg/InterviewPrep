  - front: "Alligation rule"
    back: "cheap qty : dear qty = (dear - mean) : (mean - cheap)."
  - front: "Replacement formula"
    back: "final = initial x (1 - removed/total)^n."
  - front: "Partnership profit ratio"
    back: "capital x time for each partner."
  - front: "New member joins, average changes"
    back: "new member = new average x new count - old average x old count."
keyTakeaways:
  - "Ratios: make the common term equal before combining."
  - "Average questions are easiest with sums: sum = average x count."
  - "The deviation method avoids adding big numbers."
  - "Alligation is a balance: (dear - mean) : (mean - cheap) gives cheap : dear."
  - "In mixture changes, find the part that stays the same first."
  - "Repeated replacement multiplies by (1 - r/T) each time."
