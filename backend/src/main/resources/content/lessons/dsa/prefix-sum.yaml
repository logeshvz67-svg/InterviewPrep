commonMistakes:
  - "Using prefix[r] - prefix[l] for an inclusive range with a size n+1 array; it misses arr[r]. The formula is prefix[r+1] - prefix[l]."
  - "Forgetting count.put(0, 1) in subarray-sum-k, so subarrays starting at index 0 are not counted."
  - "Adding the current sum to the map BEFORE checking sum - k (for k = 0 this counts empty subarrays)."
  - "Using int when sums can overflow; use long[] for big values."
  - "Trying sliding window for subarray sum = k with negative numbers; use prefix sum + HashMap."
interviewBox:
  why: "Why interviewers ask this: prefix sums turn repeated O(n) work into O(1) lookups, and the HashMap version tests whether you can combine two ideas."
  questions:
    - q: "What is a prefix sum and why is it useful?"
      a: "A prefix sum array stores running totals: prefix[i] is the sum of the first i elements. Building it takes O(n). After that, the sum of any range from l to r is prefix[r+1] minus prefix[l], which is O(1). It's useful when there are many range sum queries on the same array."
    - q: "How do you count subarrays with sum equal to k?"
      a: "I keep a running sum and a HashMap that counts how many times each prefix sum has appeared, starting with sum 0 seen once. At each element, a subarray ending here has sum k if an earlier prefix sum equals the current sum minus k, so I add the count of sum minus k from the map. Then I record the current sum. It's O(n) time and O(n) space and works with negative numbers."
    - q: "Why do we put 0 with count 1 in the map at the start?"
      a: "It represents the empty prefix before the array starts. Without it, a subarray that starts at index 0 and has sum k wouldn't be counted, because sum minus k would be 0 and 0 wouldn't be in the map."
    - q: "How does a 2D prefix sum work?"
      a: "Each cell stores the sum of the rectangle from the top-left corner to that cell. To get any sub-rectangle's sum, I take the big rectangle, subtract the strip above and the strip on the left, and add back the top-left corner that I subtracted twice. Each query is O(1) after O(rows times columns) preprocessing."
quiz:
  - id: q1
    type: MCQ
    prompt: "An array has n = 10^5 elements and you must answer 10^5 range-sum queries. Which approach fits the time limit?"
    code: null
    options: ["Loop over the range for each query: O(n * q)", "Build a prefix sum array once, answer each query in O(1): O(n + q)", "Sort the array first", "Recursion"]
    answer: 1
    explanation: "O(n + q) is about 2 * 10^5 steps. Looping per query can reach 10^10 steps, far too slow. Sorting would destroy the positions the ranges refer to."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "Subarray sum equals k. What does this print?"
    code: |
      int[] arr = {1, 1, 1};
      int k = 2;
      Map<Integer, Integer> count = new HashMap<>();
      count.put(0, 1);
      int sum = 0, result = 0;
      for (int x : arr) {
          sum += x;
          result += count.getOrDefault(sum - k, 0);
          count.put(sum, count.getOrDefault(sum, 0) + 1);
      }
      System.out.println(result);
    options: ["1", "2", "3", "0"]
    answer: 1
    explanation: "Running sums 1, 2, 3. At sum 2, sum - k = 0 is in the map (count 1): subarray [1, 1] at indexes 0-1. At sum 3, sum - k = 1 is in the map: subarray [1, 1] at indexes 1-2. Total 2. The answer is not 3: three 1s contain only two pairs of neighbours."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "For arr = {3, 4, 7} and k = 7 the answer should be 2 ([3,4] and [7]), but this prints 1. What is missing?"
    code: |
      int[] arr = {3, 4, 7};
      int k = 7;
      Map<Integer, Integer> count = new HashMap<>();
      int sum = 0, result = 0;
      for (int x : arr) {
          sum += x;
          result += count.getOrDefault(sum - k, 0);
          count.put(sum, count.getOrDefault(sum, 0) + 1);
      }
      System.out.println(result);
    options:
      - "The loop should start at index 1"
      - "count.put(0, 1) before the loop, so subarrays starting at index 0 (like [3, 4]) are counted"
      - "result should be a long"
      - "getOrDefault should be get"
    answer: 1
    explanation: "Running sums are 3, 7, 14. At sum 7, sum - k = 0, but 0 was never put in the map, so [3, 4] is missed. At 14, sum - k = 7 is found ([7]). Adding count.put(0, 1) fixes it to 2. Changing to get() would throw a NullPointerException when unboxing a missing key."
  - id: q4
    type: TRUE_FALSE
    prompt: "With a prefix array of size n + 1 where prefix[0] = 0, the sum of arr[l..r] (inclusive) is prefix[r] - prefix[l]."
    options: ["True", "False"]
    answer: 1
    explanation: "False. prefix[r] only covers arr[0..r-1], so it would miss arr[r]. The correct formula is prefix[r + 1] - prefix[l]."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Fill the blank so the method returns the sum of arr[l..r] inclusive."
    code: |
      int rangeSum(int[] prefix, int l, int r) {
          return prefix[r + 1] - prefix[____];
      }
    acceptedAnswers: ["l"]
    explanation: "prefix[l] is the sum of everything before index l. Subtracting it from prefix[r + 1] leaves exactly arr[l] + ... + arr[r]."
  - id: q6
    type: MATCH
    prompt: "Match each problem to the prefix-sum trick"
    pairs:
      - left: "Many range-sum queries on a fixed array"
        right: "Prefix array, prefix[r+1] - prefix[l]"
      - left: "Count subarrays with sum k (negatives allowed)"
        right: "Running sum + HashMap of prefix-sum counts"
      - left: "Sum of any sub-rectangle in a grid"
        right: "2D prefix sum with inclusion-exclusion"
      - left: "Index where left sum equals right sum"
        right: "Total sum and a running left sum"
    explanation: "All four reuse the same idea: store running totals once, then answer with subtraction."
  - id: q7
    type: MCQ
    prompt: "What are the time and space complexity of 'count subarrays with sum k' using prefix sum + HashMap?"
    code: null
    options: ["O(n^2) time, O(1) space", "O(n) time, O(n) space", "O(n log n) time, O(1) space", "O(n) time, O(1) space"]
    answer: 1
    explanation: "One pass with O(1) average HashMap operations gives O(n) time. The map can hold up to n different prefix sums: O(n) space. O(n^2) with O(1) space is the brute force that checks every start and end."
