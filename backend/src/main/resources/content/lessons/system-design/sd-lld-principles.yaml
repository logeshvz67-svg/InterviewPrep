title: "Low-level design: OOP design principles"
version: 1
estimatedMinutes: 40
rebuild: true
patternCode: null
companies: [INFOSYS_SP, INFOSYS_DSE, PRODUCT, ALL]
infosysRelevance: "Core for SP and DSE: strong OOP and class design are central to Infosys-style technical interviews, and LLD questions test exactly that."
otherCompanies: "LLD / machine-coding rounds are common at product companies; SOLID and composition vs inheritance are standard OOP questions everywhere."
why: |
  So far this tower was about **boxes and arrows** (HLD). Many interviews for juniors focus more on **LLD (Low-Level Design)**: "Design the classes for a parking lot", "Design a food ordering system", "Design Splitwise". Here you write **classes, interfaces, enums and relationships**, and sometimes runnable Java.

  The interviewer is checking whether your code is **easy to change**. Will adding UPI payments next month mean editing 10 files, or adding one new class? That is what **SOLID**, **composition over inheritance** and **programming to interfaces** are about.

  You may have met SOLID in the Java world (Section I). This lesson applies it to **design questions** and teaches the simple **ASCII class diagrams** you can draw on a whiteboard. The next two lessons use these skills for a full parking lot and real design patterns.
analogy: |
  Think of a **modular kitchen** vs a kitchen where everything is cemented into the wall.

  - In a modular kitchen, the **chimney, hob and oven fit standard slots** (interfaces). Want an induction hob instead of gas? Unscrew one, plug in another. Nothing else changes. That's the **Open/Closed principle** and **programming to interfaces**.
  - Each appliance does **one job**: the mixer mixes, the fridge cools. A "fridge-oven-washing-machine" combo would be a nightmare to repair. That's **Single Responsibility**.
  - The kitchen **has** a hob; it doesn't **inherit** from a hob. Building by plugging parts together is **composition**, and it's far more flexible than "a Kitchen IS-A Hob".
