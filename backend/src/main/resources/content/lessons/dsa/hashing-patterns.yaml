explanation: |
  ### Key words
  - **HashSet**: stores unique values. Answers "is X in the set?" in O(1) average.
  - **HashMap**: stores **key -> value** pairs. Answers "what is the value for key X?" in O(1) average.
  - **Average O(1)**: usually instant; in the rare worst case (many collisions) slower. Java 8+ turns crowded buckets into trees, so the worst case is O(log n) per operation.

  ### Pattern 1: frequency counting
  ```java
  Map<Character, Integer> freq = new HashMap<>();
  for (char c : s.toCharArray()) {
      freq.put(c, freq.getOrDefault(c, 0) + 1);   // or freq.merge(c, 1, Integer::sum)
  }
  ```
  Uses: anagram check, most frequent element, first non-repeating character, "can you build word A from letters of B?".

  **Shortcut**: for only lowercase letters, an `int[26]` array is faster and simpler: `count[c - 'a']++`.

  **First non-repeating character**: count everything in pass 1, then in pass 2 walk the string **in its original order** and return the first char with count 1. (Don't loop over the HashMap: its order is not the string's order.)

  ### Pattern 2: the seen-set
  "Have I seen this before?"
  ```java
  Set<Integer> seen = new HashSet<>();
  for (int x : arr) {
      if (!seen.add(x)) {          // add returns false if x was already there
          System.out.println("First duplicate: " + x);
          break;
      }
  }
  ```
  Uses: contains-duplicate, first repeating element, longest consecutive sequence, intersection of two arrays.

  ### Pattern 3: complement lookup (two-sum)
  Find two indexes whose values add up to `target` in an **unsorted** array.
  ```java
  Map<Integer, Integer> indexOf = new HashMap<>();   // value -> index
  for (int i = 0; i < nums.length; i++) {
      int need = target - nums[i];                   // the complement
      if (indexOf.containsKey(need)) {
          return new int[]{indexOf.get(need), i};
      }
      indexOf.put(nums[i], i);                       // store AFTER checking
  }
  ```
  - **Check first, then store**: otherwise for target 6 and value 3, the number would pair with itself.
  - O(n) time, O(n) space. Brute force is O(n^2); sort + two pointers is O(n log n) but loses the original indexes.

  ### Pattern 4: grouping by a key (group anagrams)
  **Anagrams** are words with the same letters in a different order ("eat", "tea", "ate"). Give every word a **signature** that is the same for all its anagrams, and group by it.
  ```java
  Map<String, List<String>> groups = new HashMap<>();
  for (String w : words) {
      char[] chars = w.toCharArray();
      Arrays.sort(chars);
      String key = new String(chars);            // "eat" -> "aet"
      groups.computeIfAbsent(key, x -> new ArrayList<>()).add(w);
  }
  ```
  `computeIfAbsent` creates the list the first time a key appears. Time O(n * L log L) for n words of length L. (A faster key: the 26 letter counts joined into a string.)

  ### When does hashing beat sorting?
  | | Hashing | Sorting |
  |---|---|---|
  | Time | O(n) average | O(n log n) |
  | Extra space | O(n) | O(1) to O(n) |
  | Keeps original indexes | Yes | No (unless you store them) |
  | Gives order (smallest, k-th, ranges) | No | Yes |
  | Worst case | Degrades with many collisions | Guaranteed |
  **Rule of thumb**: need "seen?", "how many?", or "where was it?" -> hash. Need order, sorted output, or O(1) extra memory -> sort.

  ### Choosing the map type
  - `HashMap`: fastest, **no order**.
  - `LinkedHashMap`: keeps **insertion order**.
  - `TreeMap`: keeps keys **sorted**, O(log n) operations.

  ### Custom keys
  If you use your own class as a key, override **both `equals()` and `hashCode()`**, using the same fields. Otherwise lookups fail. (Records do this for you.)
tinyCode:
  code: |
    import java.util.*;

    public class HashingPatterns {
        static int[] twoSum(int[] nums, int target) {
            Map<Integer, Integer> indexOf = new HashMap<>();
            for (int i = 0; i < nums.length; i++) {
                int need = target - nums[i];
                if (indexOf.containsKey(need)) {
                    return new int[]{indexOf.get(need), i};
                }
                indexOf.put(nums[i], i);
            }
            return new int[]{-1, -1};
        }

        static char firstUnique(String s) {
            int[] count = new int[26];
            for (char c : s.toCharArray()) count[c - 'a']++;
            for (char c : s.toCharArray()) {
                if (count[c - 'a'] == 1) return c;
            }
            return '_';
        }

        public static void main(String[] args) {
            Map<Character, Integer> freq = new TreeMap<>();
            for (char c : "banana".toCharArray()) {
                freq.put(c, freq.getOrDefault(c, 0) + 1);
            }
            System.out.println(freq);

            System.out.println(Arrays.toString(twoSum(new int[]{2, 7, 11, 15}, 9)));
            System.out.println(firstUnique("leetcode"));

            Set<Integer> seen = new HashSet<>();
            for (int x : new int[]{4, 1, 3, 1, 4}) {
                if (!seen.add(x)) { System.out.println("dup " + x); break; }
            }
        }
    }
  walkthrough: |
    - **Frequency**: `getOrDefault(c, 0) + 1` adds one to the count (0 if new). We used `TreeMap` here only so the printout is sorted; a `HashMap` works the same but prints in no fixed order.
    - **twoSum**: for 2, we need 7, not seen yet, store `{2:0}`. For 7, we need 2, seen at index 0: return `[0, 1]`.
    - **firstUnique**: an `int[26]` counts letters (`c - 'a'` turns 'a'..'z' into 0..25). The second pass goes in the string's order: 'l' has count 1, so it's the answer.
    - **Seen-set**: `seen.add(x)` returns `false` when `x` is already present. 4 and 1 are new, 3 is new, then 1 is a repeat.

    Output:
    ```
    {a=3, b=1, n=2}
    [0, 1]
    l
    dup 1
    ```
tryIt:
  instructions: "Type this group-anagrams program. It uses a TreeMap so the output order is predictable. Add the word \"tab\" to the array and run again."
  code: |
    import java.util.*;

    public class Anagrams {
        public static void main(String[] args) {
            String[] words = {"eat", "tea", "tan", "ate", "nat", "bat"};
            Map<String, List<String>> groups = new TreeMap<>();

            for (String w : words) {
                char[] chars = w.toCharArray();
                Arrays.sort(chars);
                String key = new String(chars);
                groups.computeIfAbsent(key, k -> new ArrayList<>()).add(w);
            }

            for (Map.Entry<String, List<String>> e : groups.entrySet()) {
                System.out.println(e.getKey() + " -> " + e.getValue());
            }
        }
    }
