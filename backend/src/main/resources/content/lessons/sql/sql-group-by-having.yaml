commonMistakes:
  - "Using an aggregate in WHERE (WHERE COUNT(*) > 1). Aggregates belong in HAVING."
  - "Selecting a column that is neither grouped nor aggregated (SELECT dept_id, name ... GROUP BY dept_id)."
  - "Using COUNT(*) after a LEFT JOIN to count children; empty parents get 1 instead of 0. Use COUNT(child_column)."
  - "Forgetting that AVG, SUM, MIN, MAX skip NULLs and that COUNT(col) does too."
  - "Using a SELECT alias in HAVING in PostgreSQL (it works in MySQL, but not in PostgreSQL)."
  - "Expecting SUM over zero rows to be 0; it is NULL. Wrap it in COALESCE."
interviewBox:
  why: "Why interviewers ask this: grouping is how real reports are built, and WHERE vs HAVING tests whether you understand the order in which SQL runs."
  questions:
    - q: "What is the difference between WHERE and HAVING?"
      a: "WHERE filters individual rows before grouping, so it can't use aggregate functions. HAVING filters groups after GROUP BY, so it can use aggregates like COUNT or SUM. For example, WHERE salary > 50000 removes rows, and HAVING COUNT(*) > 2 removes small departments."
    - q: "What is the difference between COUNT(*), COUNT(column) and COUNT(DISTINCT column)?"
      a: "COUNT(*) counts all rows. COUNT(column) counts only rows where that column is not NULL. COUNT(DISTINCT column) counts the different non-NULL values. In our table they give 7, 6 and 3 for dept_id."
    - q: "Can you use HAVING without GROUP BY?"
      a: "Yes. Then the whole table is treated as one group. For example, SELECT COUNT(*) FROM employees HAVING COUNT(*) > 5 returns one row only if the table has more than 5 rows."
    - q: "Write a query to find departments with more than 2 employees."
      a: "SELECT dept_id, COUNT(*) FROM employees GROUP BY dept_id HAVING COUNT(*) > 2. On our data only department 10 qualifies, with 3 employees."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this return on the sample employees table (Arjun has dept_id NULL, Asha has manager_id NULL)?"
    code: |
      SELECT COUNT(*), COUNT(dept_id), COUNT(manager_id)
      FROM employees;
    options: ["7, 7, 7", "7, 6, 6", "6, 6, 6", "7, 6, 7"]
    answer: 1
    explanation: "COUNT(*) counts all 7 rows. COUNT(dept_id) skips Arjun's NULL (6) and COUNT(manager_id) skips Asha's NULL (6). '7, 7, 7' assumes COUNT(col) counts NULLs, which it doesn't."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "Which dept_id values does this return?"
    code: |
      SELECT dept_id, COUNT(*) AS headcount
      FROM employees
      WHERE salary > 60000
      GROUP BY dept_id
      HAVING COUNT(*) >= 2;
    options: ["10 and 20", "10 only", "20 only", "No rows"]
    answer: 1
    explanation: "WHERE runs first and keeps only Asha, Ravi and Divya (all dept 10). Then the only group is dept 10 with 3 rows, which passes HAVING. Sales would qualify only without the WHERE, because Priya and Kiran earn exactly 60000, which is not > 60000."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "PostgreSQL rejects this. Why?"
    code: |
      SELECT dept_id, COUNT(*)
      FROM employees
      WHERE COUNT(*) > 1
      GROUP BY dept_id;
    options:
      - "COUNT(*) needs a column name"
      - "Aggregate functions are not allowed in WHERE; use HAVING COUNT(*) > 1 after GROUP BY"
      - "GROUP BY must come before WHERE"
      - "dept_id cannot be selected with COUNT"
    answer: 1
    explanation: "WHERE runs before groups exist, so COUNT has nothing to count yet. The real error is 'aggregate functions are not allowed in WHERE'. GROUP BY really does come after WHERE, so that option is wrong."
  - id: q4
    type: SPOT_THE_BUG
    prompt: "This query should show each department with its number of employees. Marketing shows 1, but it has nobody. What's wrong?"
    code: |
      SELECT d.dept_name, COUNT(*) AS headcount
      FROM departments d
      LEFT JOIN employees e ON e.dept_id = d.dept_id
      GROUP BY d.dept_name;
    options:
      - "LEFT JOIN should be INNER JOIN"
      - "COUNT(*) counts the NULL-filled row made by the LEFT JOIN; use COUNT(e.emp_id)"
      - "GROUP BY should use dept_id"
      - "Nothing is wrong, Marketing really has 1 employee"
    answer: 1
    explanation: "The LEFT JOIN keeps Marketing as one row with NULL employee columns; COUNT(*) counts that row. COUNT(e.emp_id) ignores NULLs and gives 0. Switching to INNER JOIN would remove Marketing completely instead of showing 0."
  - id: q5
    type: MCQ
    prompt: "Which statement about GROUP BY in PostgreSQL is TRUE?"
    code: null
    options:
      - "NULL values in the grouped column are thrown away"
      - "All NULLs in the grouped column form one group together"
      - "Each NULL forms its own separate group"
      - "GROUP BY cannot be used on a column with NULLs"
    answer: 1
    explanation: "For grouping (and DISTINCT), NULLs are treated as equal and form one group, like Arjun's NULL group in the example."
  - id: q6
    type: MATCH
    prompt: "Match each piece to when it runs or what it does"
    pairs:
      - left: "WHERE"
        right: "Filters rows before grouping"
      - left: "GROUP BY"
        right: "Makes one group per distinct value"
      - left: "HAVING"
        right: "Filters groups after grouping"
      - left: "COUNT(col)"
        right: "Counts non-NULL values"
    explanation: "Order: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. COUNT(col) skips NULLs; COUNT(*) does not."
  - id: q7
    type: TRUE_FALSE
    prompt: "SELECT SUM(salary) FROM employees WHERE dept_id = 99; returns 0 when no employee is in department 99."
    options: ["True", "False"]
    answer: 1
    explanation: "False. SUM over zero rows returns NULL. Only COUNT returns 0 on empty input. Use COALESCE(SUM(salary), 0) to get 0."
explainBack:
  prompt: "Explain GROUP BY, WHERE and HAVING to a friend using the 'exam papers in piles' idea."
  rubric:
    - "I said GROUP BY makes one pile (group) per value"
    - "I said aggregates give one number per group"
    - "I said WHERE filters rows before grouping and HAVING filters groups after"
    - "I explained why COUNT can't be used in WHERE"
    - "I mentioned COUNT(*) vs COUNT(column)"
  modelAnswer: |
    GROUP BY is like sorting exam papers into piles, one pile per class. Then aggregate functions like COUNT, SUM or AVG give one number for each pile. WHERE works before the piles are made, so it throws away single papers, like papers from last term. HAVING works after, so it throws away whole piles, like piles with fewer than two papers. That's why COUNT can't go in WHERE: the piles don't exist yet. Also, COUNT star counts every row, but COUNT of a column skips NULL values.
flashcards:
  - front: "WHERE vs HAVING"
    back: "WHERE filters rows before GROUP BY (no aggregates). HAVING filters groups after GROUP BY (aggregates allowed)."
  - front: "COUNT(*) vs COUNT(col)"
    back: "COUNT(*) counts all rows; COUNT(col) counts non-NULL values of col."
  - front: "GROUP BY golden rule"
    back: "Every SELECT column must be in GROUP BY or inside an aggregate."
  - front: "SUM/AVG/MAX on zero rows"
    back: "They return NULL; COUNT returns 0."
  - front: "Counting children after LEFT JOIN"
    back: "Use COUNT(child.id), not COUNT(*), so empty parents show 0."
keyTakeaways:
  - "Aggregates turn many rows into one value; GROUP BY makes them per group."
  - "WHERE filters rows before grouping; HAVING filters groups after."
  - "Non-aggregated SELECT columns must appear in GROUP BY."
  - "COUNT(*) counts rows, COUNT(col) skips NULLs, and aggregates ignore NULLs."
  - "NULLs form a single group in GROUP BY."
