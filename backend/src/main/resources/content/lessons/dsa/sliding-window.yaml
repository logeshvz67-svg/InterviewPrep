  modelAnswer: |
    Sliding window is for continuous subarrays or substrings. Imagine watching a train through a bus window showing three coaches: when you move forward, one coach enters and one leaves, so you just update your count instead of recounting. That's the fixed window: for max sum of k elements, I add arr[i] and subtract arr[i minus k], which is O(n). The variable window stretches: I move right to grow it, and when a rule breaks, like a repeated character, I move left to shrink it until it's valid again. It's still O(n) because each element enters once and leaves once. It doesn't work for subsequences, or for sum problems with negative numbers.
