explanation: |
  ### Recap: why we need wildcards
  Generics are **invariant**: `List<Integer>` is not a subtype of `List<Number>`. So this method only accepts exactly `List<Number>`:
  ```java
  static double sum(List<Number> list) { ... }
  sum(List.of(1, 2, 3));   // passing a List<Integer> -> compile error
  ```
  A **wildcard** `?` means "some type I don't know exactly". It makes methods flexible.

  ### 1. Unbounded wildcard: `List<?>`
  "A list of some unknown type." Use it when you only need methods that don't care about the type, like `size()` or printing.
  ```java
  static void printAll(List<?> list) {
      for (Object x : list) System.out.print(x + " ");
  }
  ```
  You can read elements as `Object`, but you can't add anything except `null`.

  ### 2. Upper-bounded wildcard: `? extends T`
  `List<? extends Number>` accepts `List<Number>`, `List<Integer>`, `List<Double>`... ("Number or anything **below** it").
  ```java
  static double sum(List<? extends Number> list) {
      double total = 0;
      for (Number n : list) total += n.doubleValue();   // reading is safe
      return total;
  }
  ```
  - **Reading** gives a `Number`: safe, because every element is some kind of Number.
  - **Adding** is a compile error: the compiler doesn't know if it's really a `List<Integer>` or a `List<Double>`, so adding `5` could break it.

  ### 3. Lower-bounded wildcard: `? super T`
  `List<? super Integer>` accepts `List<Integer>`, `List<Number>`, `List<Object>` ("Integer or anything **above** it").
  ```java
  static void fillNumbers(List<? super Integer> list) {
      for (int i = 1; i <= 3; i++) list.add(i);   // adding Integers is safe
  }
  ```
  - **Adding** an Integer is safe: every possible list type can hold an Integer.
  - **Reading** only gives `Object`, since it might be a `List<Object>`.

  ### PECS: the one rule to remember
  **P**roducer **E**xtends, **C**onsumer **S**uper (a phrase from the book *Effective Java*).
  - If the collection **produces** values for you (you **read** from it) → `? extends T`.
  - If the collection **consumes** values from you (you **write** into it) → `? super T`.
  - If you do **both** → no wildcard, use the exact type `List<T>`.

  The JDK uses it. `Collections.copy` has this signature:
  ```java
  public static <T> void copy(List<? super T> dest, List<? extends T> src)
  ```
  `src` produces (extends), `dest` consumes (super).

  | Wildcard | Accepts | Read as | Can add? | Role |
  |---|---|---|---|---|
  | `List<?>` | any list | `Object` | only `null` | just looking |
  | `List<? extends Number>` | Number and subclasses | `Number` | no (except `null`) | producer |
  | `List<? super Integer>` | Integer and superclasses | `Object` | yes, Integers | consumer |

  ### Type erasure: generics vanish at run time
  **Type erasure** means the compiler uses the type arguments to **check** your code and insert casts, and then **removes** them from the bytecode:
  - `List<String>` becomes plain `List`.
  - An unbounded `T` becomes `Object`; a bounded `<T extends Number>` becomes `Number`.
  - The compiler adds casts where you read values (`(String) list.get(0)`).

  Why? **Backward compatibility**: code written before Java 5 (with raw types) still runs on new JVMs, with one shared `ArrayList` class.

  ### Side effects of erasure (common follow-ups)
  1. **Same class at run time**: `new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass()` is `true`.
  2. **No `new T()` or `new T[n]`**: the JVM doesn't know what T is.
  3. **No `instanceof List<String>`** on an unknown object: compile error ("Object cannot be safely cast to List<String>"). `instanceof List<?>` is fine.
  4. **No overloading by type argument**: `void a(List<String> x)` and `void a(List<Integer> x)` together give "name clash: ... have the same erasure".
  5. **Primitives not allowed** (`List<int>`), because erased T becomes Object.
  6. **Heap pollution** with raw types: if you sneak an Integer into a `List<String>` through a raw `List`, the error appears later as a `ClassCastException` when reading. Avoid raw types.
tinyCode:
  code: |
    import java.util.*;

    public class Pecs {
        // PRODUCER: we only read from src -> extends
        static double sum(List<? extends Number> src) {
            double total = 0;
            for (Number n : src) total += n.doubleValue();
            return total;
        }
        // CONSUMER: we only write into dest -> super
        static void addOneToThree(List<? super Integer> dest) {
            for (int i = 1; i <= 3; i++) dest.add(i);
        }
        public static void main(String[] args) {
            List<Integer> ints = List.of(10, 20);
            List<Double> doubles = List.of(1.5, 2.5);
            System.out.println(sum(ints));
            System.out.println(sum(doubles));

            List<Number> nums = new ArrayList<>();
            List<Object> objs = new ArrayList<>();
            addOneToThree(nums);
            addOneToThree(objs);
            System.out.println(nums + " " + objs);
        }
    }
  walkthrough: |
    - `sum` takes `List<? extends Number>`, so both a `List<Integer>` and a `List<Double>` are accepted. We only **read** (producer), so `extends` is right.
    - `addOneToThree` takes `List<? super Integer>`, so a `List<Number>` and a `List<Object>` are both accepted. We only **write** Integers (consumer), so `super` is right.
    - Without wildcards, `sum(List<Number>)` would reject `ints` and `doubles`, because generics are invariant.

    Output:
    ```
    30.0
    4.0
    [1, 2, 3] [1, 2, 3]
    ```
tryIt:
  instructions: "Type this small copy method that follows PECS, just like Collections.copy. Run it. Then try changing '? extends T' to '? super T' and read the compile error."
  code: |
    import java.util.*;

    public class CopyDemo {
        static <T> void copyAll(List<? extends T> src, List<? super T> dest) {
            for (T item : src) {
                dest.add(item);
            }
        }

        public static void main(String[] args) {
            List<Integer> marks = List.of(88, 92, 75);
            List<Number> all = new ArrayList<>();
            all.add(3.5);
            copyAll(marks, all);
            System.out.println(all);

            List<String> a = new ArrayList<>();
            List<Integer> b = new ArrayList<>();
            System.out.println(a.getClass() == b.getClass());
        }
    }
