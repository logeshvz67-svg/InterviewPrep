  instructions: "Type this Code Quest version of the answer, then say it aloud with a timer. Aim for about 2 minutes. Change any part that is not true for you."
  code: |
    PROBLEM: I built Code Quest, a web app to prepare for Java
    interviews. I studied a lot but forgot things, so the app
    adds lessons, quizzes, spaced revision and mock interviews.

    ARCHITECTURE: The frontend is React with TypeScript. The
    backend is Spring Boot with controller, service and
    repository layers. Data is in PostgreSQL, with Flyway
    migrations. Login uses JWT and BCrypt.

    MY ROLE: I built the lesson and quiz APIs and the XP logic.

    CHALLENGE: XP was first calculated in the browser, so it
    could be faked. I moved it to the server. Now it is safe.

    IMPROVE: Next, I would add more automated tests.
