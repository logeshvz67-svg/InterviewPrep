    public class Trace {
        public static void main(String[] args) {
            try {
                System.out.println("1");
                Object o = "hello";
                Integer n = (Integer) o;
                System.out.println("2");
            } catch (ArithmeticException e) {
                System.out.println("3");
            } catch (RuntimeException e) {
                System.out.println("4");
            } finally {
                System.out.println("5");
            }
            System.out.println("6");
        }
    }
  expectedOutput: |
    1
    4
    5
    6
  explanation: |
    Casting a `String` to `Integer` throws `ClassCastException`. So "2" is skipped. Java checks the catches top to bottom: `ArithmeticException` does not match, `RuntimeException` does (ClassCastException is its child), so "4" prints. finally prints "5". The exception was handled, so "6" also prints.
commonMistakes:
  - "Putting catch (Exception e) before a more specific catch. That's a compile error: the specific one is unreachable."
  - "Thinking execution returns to the try after the catch. The skipped try lines never run."
  - "Expecting more than one catch block to run for one exception. Only the first match runs."
  - "Writing a multi-catch with parent and child types, like IOException | FileNotFoundException. Compile error."
  - "Thinking finally only runs when there is an exception. It runs in both cases."
  - "Writing a try block with neither catch nor finally. It doesn't compile."
interviewBox:
  why: "Why interviewers ask this: tracing try/catch/finally flow quickly shows whether you really understand how exceptions move through a program."
  questions:
    - q: "Explain the flow of try, catch and finally."
      a: "The try block runs until it finishes or an exception is thrown. If an exception is thrown, the remaining try lines are skipped and Java looks at the catch blocks from top to bottom; the first one that matches runs. The finally block runs after that in every case, with or without an exception, so we use it for cleanup."
    - q: "Can we have try without catch?"
      a: "Yes, if it has a finally block: try-finally. Or with try-with-resources, which can stand alone. But a plain try with neither catch nor finally doesn't compile."
    - q: "Why must a subclass exception be caught before its superclass?"
      a: "Because Java picks the first matching catch. A superclass catch would match the subclass too, so a later subclass catch could never run. The compiler reports that as an error."
    - q: "What is multi-catch?"
      a: "From Java 7 we can catch several unrelated exceptions in one block with a pipe, like catch (IOException | SQLException e), when the handling is the same. The types can't be parent and child, and the variable e is final."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              try {
                  System.out.print("A");
                  int x = 10 / 0;
                  System.out.print("B");
              } catch (ArithmeticException e) {
                  System.out.print("C");
              } finally {
                  System.out.print("D");
              }
              System.out.print("E");
          }
      }
    options: ["ABCDE", "ACDE", "ACD", "ABDE"]
    answer: 1
    explanation: "A prints, then 10 / 0 throws, so B is skipped. The catch prints C, finally prints D, and since the exception was handled, E prints. 'ABCDE' is wrong because the try never goes back to print B."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "Why won't this compile?"
    code: |
      public class Main {
          public static void main(String[] args) {
              try {
                  String s = null;
                  s.length();
              } catch (RuntimeException e) {
                  System.out.println("runtime");
              } catch (NullPointerException e) {
                  System.out.println("npe");
              }
          }
      }
    options:
      - "NullPointerException is checked"
      - "The NullPointerException catch is unreachable because RuntimeException (its parent) is caught first"
      - "You cannot catch RuntimeException"
      - "A finally block is required"
    answer: 1
    explanation: "RuntimeException already catches NullPointerException, so the second catch can never run, and the compiler reports 'exception NullPointerException has already been caught'. Fix: put the NullPointerException catch first. finally is optional."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              try {
                  try {
                      throw new IllegalArgumentException("x");
                  } catch (ArithmeticException e) {
                      System.out.println("inner catch");
                  } finally {
                      System.out.println("inner finally");
                  }
              } catch (IllegalArgumentException e) {
                  System.out.println("outer catch " + e.getMessage());
              } finally {
                  System.out.println("outer finally");
              }
          }
      }
    options:
      - "inner catch\ninner finally\nouter finally"
      - "inner finally\nouter catch x\nouter finally"
      - "outer catch x\ninner finally\nouter finally"
      - "inner finally\nouter finally"
    answer: 1
    explanation: "The inner catch only handles ArithmeticException, so it doesn't match. The inner finally still runs first, then the exception moves to the outer try, where the outer catch matches, then the outer finally runs. The inner finally always runs before the outer catch, because Java finishes the inner block first."
  - id: q4
    type: TRUE_FALSE
    prompt: "If an exception is thrown in try and no catch block matches it, the finally block is skipped."
    options: ["True", "False"]
    answer: 1
    explanation: "False. finally runs even when no catch matches. After finally, the exception continues up to the calling method."
  - id: q5
    type: MCQ
    prompt: "Which multi-catch is a compile error?"
    code: null
    options:
      - "catch (NumberFormatException | NullPointerException e)"
      - "catch (java.io.IOException | java.sql.SQLException e)"
      - "catch (java.io.IOException | java.io.FileNotFoundException e)"
      - "catch (ArithmeticException | ClassCastException e)"
    answer: 2
    explanation: "FileNotFoundException is a subclass of IOException, and multi-catch types must not be related by subclassing. The other pairs are unrelated siblings, so they're fine."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Fill in the keyword for the block that runs whether or not an exception happens."
    code: |
      try {
          openFile();
      } catch (Exception e) {
          System.out.println("error");
      } ____ {
          System.out.println("cleanup");
      }
    acceptedAnswers: ["finally"]
    explanation: "finally always runs after try/catch, which makes it the place for cleanup. Note the spelling: finally, not final (final is a different keyword) and not finalize (an old Object method)."
  - id: q7
    type: MATCH
    prompt: "Match the situation to what happens"
    pairs:
      - left: "No exception in try"
        right: "All catch blocks skipped, finally runs"
      - left: "Exception, a catch matches"
        right: "Rest of try skipped, first matching catch runs"
      - left: "Exception, no catch matches"
        right: "finally runs, then the exception goes to the caller"
      - left: "Parent catch written before child catch"
        right: "Compile error: child already caught"
    explanation: "These four rules cover almost every try/catch/finally output question. Trace them line by line."
explainBack:
  prompt: "Explain to a friend how try, catch and finally work, including what happens to the lines after an exception and why catch order matters."
  rubric:
    - "I said the rest of try is skipped after an exception"
    - "I said only the first matching catch runs, checked top to bottom"
    - "I said finally runs with or without an exception"
    - "I explained why specific catches must come before general ones"
    - "I used an analogy like 'turn off the gas'"
  modelAnswer: |
    I put risky code in try. If everything works, the catch blocks are skipped. If a line throws an exception, the remaining try lines are skipped forever, and Java checks the catch blocks from top to bottom; the first one that matches the exception type runs. Then finally runs, no matter what happened, so it's perfect for cleanup, like always turning off the gas after cooking. Because a parent type like Exception also matches its children, I must write specific catches first and general ones last, otherwise the compiler complains that the specific catch can never be reached.
flashcards:
  - front: "After an exception in try, do the remaining try lines run?"
    back: "No. They are skipped forever; control jumps to the first matching catch."
  - front: "How many catch blocks run for one exception?"
    back: "Only one: the first one (top to bottom) whose type matches."
  - front: "Catch order rule"
    back: "Subclass before superclass. Otherwise: compile error 'exception X has already been caught'."
  - front: "Multi-catch rules"
    back: "catch (A | B e): A and B must not be parent/child, and e is implicitly final."
  - front: "When does finally run?"
    back: "After try/catch in all normal cases: no exception, caught exception, uncaught exception, return. Not after System.exit."
keyTakeaways:
  - "Once a line throws, the rest of the try is skipped forever."
  - "Catches are checked top to bottom; only the first match runs."
  - "Specific exceptions first, general last, or the code won't compile."
  - "Multi-catch joins unrelated types with | and makes e final."
  - "finally runs whether or not an exception happens; use it for cleanup."
