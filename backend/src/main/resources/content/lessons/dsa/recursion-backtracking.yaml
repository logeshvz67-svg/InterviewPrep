keyTakeaways:
  - "Recursion = base case + smaller recursive call; each call sits on the call stack."
  - "Code before the recursive call runs going down; code after runs coming back up."
  - "Backtracking = choose, explore, un-choose."
  - "Subsets: take/skip, 2^n. Permutations: used[] array, n!."
  - "Always save a copy of the current list, and always undo your choice."
  - "Exponential: only for small n (about 20 for subsets, 10 for permutations)."
