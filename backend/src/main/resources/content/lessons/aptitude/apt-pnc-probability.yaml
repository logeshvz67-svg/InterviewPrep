why: |
  "In how many ways...?" and "What is the probability...?" questions scare many people, because it is easy to count something twice or miss a case.

  The secret is to ask **two questions** every time:
  1. **Does order matter?** (Arrangement = permutation; selection = combination.)
  2. **Is it AND or OR?** (AND -> multiply; OR -> add.)

  Probability is then just **counting twice**: count the good outcomes, count all outcomes, divide.

  These ideas are also the base of DSA topics like **backtracking** (generate all subsets/permutations) and **combinatorics** in coding problems. You will check every answer with a Java program, sometimes by brute force (trying every case), which is a great way to trust a formula.
analogy: |
  Think of **choosing a cricket team vs. setting the batting order**.

  - **Choosing 11 players from 15** is a **combination**: the team {Virat, Rohit, ...} is the same team in whatever order you write the names.
  - **Setting the batting order** for the first 3 positions is a **permutation**: Rohit-Virat-Gill is different from Virat-Rohit-Gill.

  Selection = combination (order does not matter). Arrangement = permutation (order matters).
