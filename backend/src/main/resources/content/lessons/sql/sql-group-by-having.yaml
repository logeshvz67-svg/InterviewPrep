explanation: |
  ### Aggregate functions
  An **aggregate function** takes many rows and returns **one** value.

  | Function | Returns | Ignores NULLs? |
  |---|---|---|
  | `COUNT(*)` | number of rows | counts every row |
  | `COUNT(col)` | number of non-NULL values in col | yes |
  | `COUNT(DISTINCT col)` | number of different non-NULL values | yes |
  | `SUM(col)` | total | yes |
  | `AVG(col)` | average | yes |
  | `MIN(col)`, `MAX(col)` | smallest, largest | yes |

  Without GROUP BY, the whole table is one group:
  ```sql
  SELECT COUNT(*) AS all_rows, COUNT(dept_id) AS with_dept,
         COUNT(DISTINCT dept_id) AS distinct_depts
  FROM employees;
  --  all_rows | with_dept | distinct_depts
  --         7 |         6 |              3
  ```
  `COUNT(*)` is 7 (all rows). `COUNT(dept_id)` is 6 because Arjun's dept_id is NULL. `COUNT(DISTINCT dept_id)` is 3 (10, 20, 30).

  ### GROUP BY: one result row per group
  `GROUP BY dept_id` puts rows with the same dept_id into one **group**, then each aggregate is calculated **per group**.
  ```sql
  SELECT dept_id, COUNT(*) AS headcount, SUM(salary) AS total_salary,
         ROUND(AVG(salary), 2) AS avg_salary, MAX(salary) AS max_salary
  FROM employees
  GROUP BY dept_id
  ORDER BY dept_id;
  ```
  ```
   dept_id | headcount | total_salary | avg_salary | max_salary
  ---------+-----------+--------------+------------+------------
        10 |         3 |       245000 |   81666.67 |      90000
        20 |         2 |       120000 |   60000.00 |      60000
        30 |         1 |        50000 |   50000.00 |      50000
      NULL |         1 |        45000 |   45000.00 |      45000
  ```
  Notice: all NULL dept_ids form **one group** of their own.

  `ROUND(x, 2)` keeps 2 decimal places. Without it PostgreSQL prints a long number like `81666.666666666667`.

  ### The golden rule of GROUP BY
  Every column in SELECT must either be **in the GROUP BY** or be **inside an aggregate**. Why? A group of 3 Engineering people has 3 different names; the database can't put 3 names in one cell.
  ```sql
  SELECT dept_id, name, COUNT(*) FROM employees GROUP BY dept_id;
  -- ERROR: column "employees.name" must appear in the GROUP BY clause
  --        or be used in an aggregate function
  ```
  > MySQL difference: older MySQL versions (and MySQL with the `ONLY_FULL_GROUP_BY` mode switched off) accept this and silently pick *some* name. MySQL 5.7+ has that mode on by default, so it errors like PostgreSQL. Never rely on the old behaviour.

  You can group by several columns: `GROUP BY dept_id, salary` makes one group for each different (dept_id, salary) pair.

  ### HAVING: filter groups
  `HAVING` is like WHERE, but it runs **after** grouping, so it can use aggregates:
  ```sql
  SELECT dept_id, COUNT(*) AS headcount
  FROM employees
  GROUP BY dept_id
  HAVING COUNT(*) >= 2;          -- dept 10 (3) and dept 20 (2)
  ```

  ### WHERE vs HAVING
  | WHERE | HAVING |
  |---|---|
  | Filters **rows** | Filters **groups** |
  | Runs **before** GROUP BY | Runs **after** GROUP BY |
  | Cannot use aggregates (`WHERE COUNT(*) > 1` is an error) | Usually uses aggregates |
  | Makes the query faster by throwing rows away early | Works on the already-grouped result |

  Use both together. "Departments with at least 2 people earning more than 60,000":
  ```sql
  SELECT dept_id, COUNT(*) AS headcount
  FROM employees
  WHERE salary > 60000          -- first remove rows: only Asha, Ravi, Divya stay
  GROUP BY dept_id
  HAVING COUNT(*) >= 2;         -- then keep groups with 2+ rows: dept 10 (3)
  ```
  Without the WHERE, Sales (2 people at 60,000) would also qualify. The order matters!

  > Alias in HAVING: PostgreSQL does not allow a SELECT alias in HAVING (`HAVING headcount >= 2` fails). Repeat the aggregate: `HAVING COUNT(*) >= 2`. MySQL does allow the alias. Both allow aliases in ORDER BY.

  ### COUNT(*) vs COUNT(column) with LEFT JOIN
  "Employees per department, including empty departments":
  ```sql
  SELECT d.dept_name, COUNT(*) AS cnt_star, COUNT(e.emp_id) AS cnt_emp
  FROM departments d
  LEFT JOIN employees e ON e.dept_id = d.dept_id
  GROUP BY d.dept_name
  ORDER BY d.dept_name;
  ```
  ```
    dept_name  | cnt_star | cnt_emp
  -------------+----------+---------
   Engineering |        3 |       3
   HR          |        1 |       1
   Marketing   |        1 |       0
   Sales       |        2 |       2
  ```
  Marketing has no employees, but the LEFT JOIN still makes **one row** for it (with NULL employee columns). `COUNT(*)` counts that row: 1 (wrong!). `COUNT(e.emp_id)` skips the NULL: 0 (right).

  ### Empty input
  On zero rows, `COUNT(*)` returns **0**, but `SUM`, `AVG`, `MIN`, `MAX` return **NULL**. Use `COALESCE(SUM(salary), 0)` if you need 0.
tinyCode:
  code: |
    SELECT dept_id,
           COUNT(*)    AS headcount,
           SUM(salary) AS total_salary,
           MAX(salary) AS max_salary
    FROM employees
    GROUP BY dept_id
    HAVING COUNT(*) >= 2
    ORDER BY dept_id;

    -- Result:
    --  dept_id | headcount | total_salary | max_salary
    -- ---------+-----------+--------------+------------
    --       10 |         3 |       245000 |      90000
    --       20 |         2 |       120000 |      60000
  walkthrough: |
    - `FROM employees`: start with all 7 rows.
    - `GROUP BY dept_id`: make piles: 10 (Asha, Ravi, Divya), 20 (Priya, Kiran), 30 (Meena), NULL (Arjun).
    - `COUNT(*)`, `SUM(salary)`, `MAX(salary)`: one value per pile.
    - `HAVING COUNT(*) >= 2`: drop piles with fewer than 2 rows. Department 30 and the NULL pile go.
    - `SELECT dept_id, ...`: dept_id is allowed because it is in GROUP BY; the rest are aggregates.
    - `ORDER BY dept_id`: sort the final summary rows.
tryIt:
  instructions: "Type and run each query. For number 3, first predict which customers qualify by adding their order amounts on paper (Anil 2500+800+1500, Sneha 1200+1200, Rahul 3000)."
  code: |
    -- 1. Rows vs non-NULL values
    SELECT COUNT(*), COUNT(dept_id), COUNT(DISTINCT dept_id)
    FROM employees;

    -- 2. Average salary per department, rounded
    SELECT dept_id, ROUND(AVG(salary)) AS avg_salary
    FROM employees
    GROUP BY dept_id
    ORDER BY dept_id;

    -- 3. Customers who spent more than 2500 in total
    SELECT customer_id, SUM(amount) AS total
    FROM orders
    GROUP BY customer_id
    HAVING SUM(amount) > 2500
    ORDER BY customer_id;

    -- 4. Headcount per department name, empty ones too
    SELECT d.dept_name, COUNT(e.emp_id) AS headcount
    FROM departments d
    LEFT JOIN employees e ON e.dept_id = d.dept_id
    GROUP BY d.dept_name;
