  question: 'The ages of Anu and Bala are in the ratio 4 : 5. The sum of their ages is 54. What will be the ratio of their
    ages after 6 years?'
  options: ['4 : 5', '7 : 8', '5 : 6', '6 : 7']
  answer: 2
  explanation: 'Total parts = 9. One part = 54 / 9 = 6. Anu = 4 x 6 = 24, Bala = 5 x 6 = 30. After 6 years: 30 and 36. 30
