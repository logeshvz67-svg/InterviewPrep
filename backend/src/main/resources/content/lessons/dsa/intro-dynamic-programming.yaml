infosysRelevance: "Important for SP preparation: the harder coding problems in SP-level practice sets are very often dynamic programming (stairs/paths counting, robber-style choices, knapsack, subsequences)."
otherCompanies: "Product-company interviews treat DP as a core topic (coin change, LIS, knapsack, edit distance, grid paths). Service-company rounds mostly stop at Fibonacci-style and simple counting DP."
why: |
  Some problems ask for the **best** (max/min) or the **number of ways** across a huge number of choices: "how many ways to climb n stairs", "maximum money without robbing two neighbouring houses", "fewest coins for an amount". Trying every combination with plain recursion is **exponential**: O(2^n) can mean years of computing for n = 60.

  **Dynamic programming (DP)** fixes this with one idea: **solve each small subproblem once, write the answer down, and reuse it**. That often turns O(2^n) into **O(n)** or O(n x W).

  DP has a scary reputation, but it follows a **fixed recipe**: define the state, write the recurrence (the choice at each step), set base cases, choose an order. This lesson gives you that recipe and five classic problems to practise it on. In the previous lesson you saw greedy fail for coin change; here you'll see DP get it right.
analogy: |
  Imagine your maths teacher asks: "What is 1+1+1+1+1+1+1+1?" You count: **8**. Then she writes "+1" at the end and asks again. You don't recount from the start, you say **9** immediately, because you **remembered** the previous answer.

  That is DP: **remember answers to smaller questions so bigger questions become one quick step**.

  - **Memoization** (top-down) is like a student who solves a question only when it's asked, and writes each answer in a notebook to look up later.
  - **Tabulation** (bottom-up) is like a student who fills the whole multiplication table from 1x1 upwards before the exam, so every lookup is ready.
