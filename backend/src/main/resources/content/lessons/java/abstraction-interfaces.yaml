otherCompanies: "Abstract class vs interface is a very common question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  "**What is the difference between an abstract class and an interface?**" is one of the most-asked Java questions. Older answers ("interfaces can't have method bodies") are **wrong** since Java 8, and interviewers like to check if you know that.

  You'll be asked:
  - What is abstraction?
  - Can an abstract class have a constructor?
  - What are default, static and private methods in interfaces?
  - How does Java solve the diamond problem with interfaces?
  - When would you pick one over the other?

  This is also how real projects are designed: Spring, JDBC and Collections are all built on interfaces.
analogy: |
  **Abstraction** is your car's dashboard. You press the accelerator and the car moves. You don't need to know about fuel injection or gear ratios. You see **what** it does, not **how**.

  - An **interface** is like the rule "every vehicle sold in India must have brakes, headlights and a horn". It's a **contract**: a list of abilities. Any company (Tata, Maruti, Honda) can sign it in its own way.
  - An **abstract class** is like a **half-built car** from a factory: the chassis and engine mounting are done (shared code and fields), but the body design is left for each model to finish. You can't drive a half-built car (you can't create an object of it), but every finished model starts from it.
