  expectedOutput: |
    3 4 [4, 2, 1]
  explanation: |
    After pushing 1, 2, 3 the top is 3, so `pop()` returns 3. Then 4 is pushed on top, and `peek()` returns 4 without removing it. Printing an `ArrayDeque` used as a stack lists elements from the top down: `[4, 2, 1]`. A common wrong guess is `[1, 2, 4]`, which is the order they were added, not the stack's order.
commonMistakes:
  - "Forgetting the final stack.isEmpty() check in valid parentheses, so \"((\" is reported as valid."
  - "Calling pop() or peek() on an empty stack without checking isEmpty(); ArrayDeque.pop() throws NoSuchElementException and peek() returns null."
  - "Storing values instead of indexes in a monotonic stack when the answer must be written at the original position."
  - "Thinking the monotonic stack is O(n^2) because of the nested while; each index is pushed and popped at most once, so it is O(n)."
  - "Using the old Stack class out of habit; prefer ArrayDeque for both stacks and queues."
  - "In queue-via-two-stacks, moving items from in to out when out is NOT empty, which breaks the order."
interviewBox:
  why: "Why interviewers ask this: stacks and queues show whether you can spot the hidden LIFO/FIFO structure in a problem and turn an O(n^2) scan into O(n)."
  questions:
    - q: "How do you check if a string of brackets is balanced?"
      a: "I use a stack. For each opening bracket I push it. For a closing bracket, if the stack is empty I return false, otherwise I pop and check that it's the matching opener. At the end the stack must be empty, otherwise some openers were never closed. It's O(n) time and O(n) space."
    - q: "How do you find the next greater element for every element in an array?"
      a: "I use a monotonic stack of indexes. I go left to right. While the current value is bigger than the value at the index on top of the stack, I pop that index and set its answer to the current value. Then I push the current index. Whatever is left in the stack has no greater element, so its answer is minus one. Every index is pushed and popped once, so it's O(n)."
    - q: "How would you implement a queue using two stacks?"
      a: "One stack for incoming items and one for outgoing. Enqueue pushes onto the in stack. For dequeue, if the out stack is empty I pop everything from in and push it to out, which reverses the order, then I pop from out. Each element moves once, so the amortized cost is O(1) per operation."
    - q: "What is the difference between a stack and a queue?"
      a: "A stack is last in, first out, like a pile of plates: you add and remove at the top. A queue is first in, first out, like a ticket line: you add at the back and remove from the front. In Java I use ArrayDeque for both."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "Next greater element with a monotonic stack. What is printed?"
    code: |
      int[] a = {2, 1, 3, 2, 4};
      int[] ans = new int[a.length];
      Arrays.fill(ans, -1);
      Deque<Integer> st = new ArrayDeque<>();
      for (int i = 0; i < a.length; i++) {
          while (!st.isEmpty() && a[i] > a[st.peek()]) ans[st.pop()] = a[i];
          st.push(i);
      }
      System.out.println(Arrays.toString(ans));
    options: ["[3, 3, 4, 4, -1]", "[3, 3, 4, 4, 4]", "[1, 3, 2, 4, -1]", "[4, 4, 4, 4, -1]"]
    answer: 0
    explanation: "3 arrives and pops index 1 (value 1) and index 0 (value 2): both get 3. Then 2 waits; 4 arrives and pops 2 and 3: both get 4. Nothing is bigger than 4, so it keeps -1. \"[4, 4, 4, 4, -1]\" is the greatest element to the right, not the NEXT greater."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "This checks if a string of only '(' and ')' is balanced. Which input gives the wrong answer and why?"
    code: |
      Deque<Character> stack = new ArrayDeque<>();
      for (char c : s.toCharArray()) {
          if (c == '(') stack.push(c);
          else {
              if (stack.isEmpty()) return false;
              stack.pop();
          }
      }
      return true;
    options:
      - "\"()\" returns false, because pop removes the wrong element"
      - "\"((\" returns true, because it never checks that the stack is empty at the end"
      - "\")(\" returns true, because the empty check is missing"
      - "It throws an exception on an empty string"
    answer: 1
    explanation: "Unclosed openers stay on the stack, but the method returns true anyway. Fix: return stack.isEmpty(). \")(\" is handled correctly: the first ')' sees an empty stack and returns false. An empty string correctly returns true."
  - id: q3
    type: MCQ
    prompt: "What is the total time complexity of the monotonic-stack next greater element for n elements?"
    code: null
    options: ["O(n^2), because there is a while loop inside a for loop", "O(n log n)", "O(n), because each index is pushed and popped at most once", "O(1)"]
    answer: 2
    explanation: "Count operations per element, not loops: each index enters the stack once and leaves at most once, so at most 2n stack operations. Nested loops do not automatically mean O(n^2); this is amortized analysis."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "A queue built from two stacks (in and out). 1, 2, 3 are enqueued, one dequeue happens, 4 is enqueued, then one more dequeue. What is printed?"
    code: |
      Deque<Integer> in = new ArrayDeque<>(), out = new ArrayDeque<>();
      in.push(1); in.push(2); in.push(3);
      if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop());
      int first = out.pop();
      in.push(4);
      if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop());
      int second = out.pop();
      System.out.println(first + " " + second + " " + out + " " + in);
    options: ["1 2 [3] [4]", "3 4 [2] [1]", "1 2 [3, 4] []", "1 4 [2, 3] []"]
    answer: 0
    explanation: "Pouring in (top 3, 2, 1) into out puts 1 on top, so the first dequeue gives 1. 4 goes into in. out is not empty, so nothing is poured; the second dequeue gives 2. out still holds [3] and in holds [4]. That is FIFO order 1, 2, 3, 4. \"3 4\" would be plain stack behaviour."
  - id: q5
    type: TRUE_FALSE
    prompt: "In Java, ArrayDeque can be used both as a stack (push/pop) and as a queue (offer/poll)."
    options: ["True", "False"]
    answer: 0
    explanation: "True. ArrayDeque is a double-ended queue: push/pop work at the front (stack), offer adds at the back and poll removes from the front (queue). It is the recommended replacement for the old Stack class."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Min stack: fill in what is pushed onto the mins stack when it is not empty."
    code: |
      void push(int x) {
          values.push(x);
          mins.push(mins.isEmpty() ? x : ____);
      }
    acceptedAnswers: ["Math.min(x, mins.peek())", "Math.min(mins.peek(), x)", "Math.min(x,mins.peek())", "Math.min(mins.peek(),x)"]
    explanation: "Each mins entry stores the minimum of everything at or below that height, so it is the smaller of the new value and the previous minimum. Pushing just x would lose the old minimum when x is bigger."
