explanation: |
  ### What is inheritance?
  **Inheritance** means one class gets the fields and methods of another class. We write it with the keyword **`extends`**.
  - The class that gives is the **parent** (also called **superclass** or **base class**).
  - The class that receives is the **child** (also called **subclass** or **derived class**).

  ```java
  class Animal {
      String name;
      void eat() { System.out.println(name + " is eating"); }
  }

  class Dog extends Animal {           // Dog IS-A Animal
      void bark() { System.out.println(name + " says Woof"); }
  }
  ```
  A `Dog` object can call `eat()` and use `name` even though `Dog` never wrote them. This is **code reuse**.

  ### The IS-A test
  Use inheritance only when "Child **is a** Parent" makes sense. A Dog *is an* Animal: good. A Car *is an* Engine: wrong! A car **has an** engine. "HAS-A" relationships use a field instead (called **composition**).

  ### What is NOT inherited?
  | Member | Inherited? |
  |---|---|
  | public / protected fields and methods | Yes |
  | default (no modifier) members | Yes, if the child is in the same package |
  | private fields and methods | No direct access (they exist inside the object, but the child can't touch them by name) |
  | constructors | **Never** inherited |
  | static members | Accessible through the child, but they still belong to the parent class |

  ### Types of inheritance
  | Type | Shape | Allowed with classes? |
  |---|---|---|
  | Single | A <- B | Yes |
  | Multilevel | A <- B <- C | Yes |
  | Hierarchical | A <- B, A <- C | Yes |
  | Multiple | A, B <- C | **No** (only with interfaces) |
  | Hybrid | a mix | Only through interfaces |

  **Why no multiple inheritance of classes?** If `C extends A, B` and both A and B have a method `show()` with different code, which one should C get? This confusion is called the **diamond problem**. Java avoids it by allowing only one parent class. (A class can implement many interfaces; you'll see how Java handles the diamond there in the abstraction lesson.)

  Every class you write already has a parent: if you don't write `extends`, Java adds `extends Object` for you. So `Object` is the root of every class.

  ### The `super` keyword: three uses
  `super` means "the parent part of this object".

  **1. `super.method()`: call the parent's version of a method**
  ```java
  class Dog extends Animal {
      void eat() {
          super.eat();                       // run Animal's eat() first
          System.out.println("...and wags tail");
      }
  }
  ```

  **2. `super.field`: reach a parent field hidden by a child field with the same name**
  ```java
  class Parent { int x = 10; }
  class Child extends Parent {
      int x = 20;
      void show() { System.out.println(x + " " + super.x); }   // 20 10
  }
  ```

  **3. `super(...)`: call a parent constructor**
  ```java
  class Animal {
      String name;
      Animal(String name) { this.name = name; }
  }
  class Dog extends Animal {
      Dog(String name) {
          super(name);       // MUST be the first statement
          System.out.println("Dog created");
      }
  }
  ```

  ### Constructor rules you must know
  1. Every constructor's **first line** is either `this(...)` or `super(...)`. If you write neither, Java silently inserts **`super();`** (call the parent's no-argument constructor).
  2. So the **parent constructor always runs before the child constructor**. Building goes top-down: `Object` -> `Animal` -> `Dog`.
  3. If the parent has **only** a constructor with parameters (no no-arg one), the hidden `super();` fails, and the child **must** call `super(something)` explicitly. Otherwise: compile error.
  4. You can't use both `this(...)` and `super(...)` in the same constructor, because both want to be first.
  5. `super` can't be used inside a `static` method, because there is no object there.

  ### `super` vs `this`
  | `this` | `super` |
  |---|---|
  | the current object | the parent part of the current object |
  | `this.x` = my field | `super.x` = parent's field |
  | `this()` = another constructor of my class | `super()` = a constructor of my parent |
tinyCode:
  code: |
    public class Main {
        public static void main(String[] args) {
            Dog d = new Dog("Tommy");
            d.eat();
            d.bark();
        }
    }

    class Animal {
        String name;
        Animal(String name) {
            this.name = name;
            System.out.println("Animal constructor");
        }
        void eat() {
            System.out.println(name + " is eating");
        }
    }

    class Dog extends Animal {
        Dog(String name) {
            super(name);
            System.out.println("Dog constructor");
        }
        void eat() {
            super.eat();
            System.out.println(name + " wags its tail");
        }
        void bark() {
            System.out.println(name + " says Woof");
        }
    }
  walkthrough: |
    - `new Dog("Tommy")` calls the Dog constructor. Its first line `super(name)` jumps to the Animal constructor.
    - Animal's constructor stores the name and prints **"Animal constructor"**. Only then does control come back to Dog, which prints **"Dog constructor"**.
    - `d.eat()` runs Dog's own `eat()`. Its first line `super.eat()` runs the parent's version (**"Tommy is eating"**), then Dog adds **"Tommy wags its tail"**.
    - `d.bark()` is Dog's own new method.
    - Notice `name` is used inside Dog even though Dog never declared it: it was inherited.

    Output:
    ```
    Animal constructor
    Dog constructor
    Tommy is eating
    Tommy wags its tail
    Tommy says Woof
    ```
