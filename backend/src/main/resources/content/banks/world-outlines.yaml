# Titled outlines for worlds that are not fully written yet.
# Each lesson has a title and a one-line summary. Full lessons come later.
worlds:
  - world: SQL
    lessons:
      - title: "SELECT basics and filtering"
        summary: "Pick columns, filter rows with WHERE, sort with ORDER BY and limit results."
      - title: "Joins: INNER, LEFT, RIGHT, SELF"
        summary: "Combine rows from two tables using a matching column, and see what happens to rows with no match."
      - title: "GROUP BY and HAVING"
        summary: "Group rows, use COUNT, SUM, AVG, MIN, MAX, and filter groups with HAVING instead of WHERE."
      - title: "Subqueries and correlated subqueries"
        summary: "Use a query inside another query, with IN, EXISTS and comparisons, and know when a join is simpler."
      - title: "Window functions"
        summary: "Use ROW_NUMBER, RANK, DENSE_RANK and SUM() OVER to rank or total rows without collapsing them."
      - title: "Indexes"
        summary: "How an index speeds up searches like a book index, when it helps, and why too many slow down writes."
      - title: "Keys and constraints"
        summary: "Primary key, foreign key, UNIQUE, NOT NULL, CHECK and DEFAULT, and how they protect your data."
      - title: "Normalization: 1NF, 2NF, 3NF"
        summary: "Split tables to remove repeated data, with a simple student-course example for each normal form."
      - title: "Transactions and ACID"
        summary: "COMMIT, ROLLBACK and the four ACID properties explained with a bank transfer example."
      - title: "DDL vs DML, DELETE vs TRUNCATE vs DROP"
        summary: "Know which commands change structure and which change data, and the differences people often mix up."
      - title: "Views, UNION and CASE"
        summary: "Save a query as a view, stack results with UNION or UNION ALL, and add if-else logic with CASE."
      - title: "Common practice queries"
        summary: "Second highest salary, duplicates, employees above department average, Nth highest and top N per group."
  - world: CS_CORE
    lessons:
      - title: "OS: process vs thread"
        summary: "A process is a running program with its own memory; threads are lighter workers that share that memory."
      - title: "OS: CPU scheduling"
        summary: "FCFS, SJF, Round Robin and Priority scheduling, with waiting time and turnaround time worked out by hand."
      - title: "OS: deadlock"
        summary: "The four conditions for deadlock, and how to prevent, avoid (Banker's idea) or recover from it."
      - title: "OS: memory, paging and virtual memory"
        summary: "How pages and frames work, what a page fault is, and why virtual memory lets programs use more than RAM."
      - title: "OS: synchronization"
        summary: "Race conditions, critical sections, mutex and semaphore, explained with a shared counter example."
      - title: "DBMS: keys and relationships"
        summary: "Super, candidate, primary, foreign and composite keys, plus one-to-one, one-to-many and many-to-many."
      - title: "DBMS: transactions and concurrency"
        summary: "ACID, isolation levels, and problems like dirty read and lost update in plain words."
      - title: "Networks: OSI and TCP/IP models"
        summary: "The layers in each model and one simple job for each layer."
      - title: "Networks: HTTP and HTTPS"
        summary: "Request and response, methods, status codes, headers, and what TLS adds in HTTPS."
      - title: "Networks: TCP vs UDP"
        summary: "Reliable ordered delivery with a handshake versus fast delivery without guarantees, and where each is used."
      - title: "Networks: DNS and what happens when you type a URL"
        summary: "The step-by-step journey from typing a URL to seeing the page, including DNS lookup."
      - title: "System design basics"
        summary: "Client-server, load balancer, cache, database, scaling up vs scaling out, for a fresher-level discussion."
  - world: SPRING
    lessons:
      - title: "IoC, DI and beans"
        summary: "Spring creates and connects your objects for you; learn beans, scopes and constructor injection."
      - title: "Configuration, properties and profiles"
        summary: "Use application.yml, @Value, @ConfigurationProperties and profiles like dev and prod."
      - title: "Spring Boot auto-configuration"
        summary: "How starters and auto-configuration set up common things so you write less setup code."
      - title: "Layered architecture and REST design"
        summary: "Controller, service, repository layers, and good REST URLs, methods and status codes."
      - title: "Controllers, validation and DTOs"
        summary: "Map requests, read path and query values, validate input with @Valid, and return DTOs."
      - title: "Global exception handling"
        summary: "Use @RestControllerAdvice and @ExceptionHandler to return clean, consistent error responses."
      - title: "JPA entities, repositories and relationships"
        summary: "Map classes to tables, use JpaRepository, and model one-to-many relationships."
      - title: "Transactions, lazy loading and N+1"
        summary: "How @Transactional works, lazy vs eager loading, and how to spot and fix the N+1 query problem."
      - title: "Spring Security and JWT"
        summary: "The filter chain, password hashing with BCrypt, roles, and stateless login with JWT tokens."
      - title: "Testing, Flyway, Docker and microservices"
        summary: "Unit tests with Mockito, integration tests, database migrations, Docker basics and a microservices overview."
  - world: INTERVIEW
    lessons:
      - title: "How mock interviews work"
        summary: "What happens in a practice mock, how you are scored, and how to learn from each one."
      - title: "The HR round"
        summary: "Common HR questions, honest answers about your career switch, and how to talk about salary and relocation."
      - title: "The technical round"
        summary: "How to think aloud, ask clarifying questions, write code step by step and handle questions you cannot answer."
      - title: "The project round"
        summary: "Explain your project clearly: problem, your role, tech stack, one challenge and what you learned."
      - title: "Communication skills"
        summary: "Speak in short sentences, use frameworks like STAR and PPF, and sound confident even with simple English."
      - title: "Your interview diary"
        summary: "Write down every practice question you struggled with and review it so the same mistake does not repeat."
  - world: APTITUDE
    lessons:
      - title: "Number system and simplification"
        summary: "Divisibility rules, HCF and LCM, remainders and fast mental math shortcuts."
      - title: "Percentages, profit and loss"
        summary: "Percentage change, successive discounts, cost price and selling price problems."
      - title: "Ratio, averages and mixtures"
        summary: "Ratio and proportion, average problems and simple mixture questions."
      - title: "Time and work, time-speed-distance"
        summary: "Work rate method, pipes and cisterns, relative speed, trains and boats."
      - title: "Permutations, combinations and probability"
        summary: "Counting arrangements and selections, and basic probability with coins, dice and cards."
      - title: "Logical reasoning: series, coding-decoding, blood relations"
        summary: "Find number and letter patterns, decode words, and draw family trees."
      - title: "Logical reasoning: arrangements, syllogisms and puzzles"
        summary: "Seating arrangements, statements and conclusions, and grid-style puzzles."
      - title: "Verbal ability"
        summary: "Reading comprehension, sentence correction, fill in the blanks and para jumbles."
  - world: DSA
    lessons:
      - title: "Linked list problems"
        summary: "Reverse a list, find the middle, detect a cycle and merge two sorted lists using pointers."
      - title: "Stack and queue patterns"
        summary: "Valid parentheses, next greater element with a monotonic stack, and queues with ArrayDeque."
      - title: "Sorting and binary search"
        summary: "How merge sort and quick sort work, and binary search on sorted arrays and on the answer."
      - title: "Trees and BST"
        summary: "Traversals (inorder, preorder, postorder, level order), height, and search and insert in a BST."
      - title: "Heaps and priority queues"
        summary: "Use PriorityQueue for top K elements, K-th largest and merging sorted lists."
      - title: "Graphs: BFS and DFS"
        summary: "Store a graph as an adjacency list, then use BFS and DFS for connected components and shortest paths."
      - title: "Greedy algorithms"
        summary: "Pick the best choice at each step: activity selection, coin change (when greedy works) and intervals."
      - title: "Introduction to dynamic programming"
        summary: "Break a problem into overlapping subproblems: Fibonacci, climbing stairs, then memoization vs tabulation."
      - title: "Bit manipulation"
        summary: "AND, OR, XOR and shifts, checking even or odd, counting set bits and finding the single number."
