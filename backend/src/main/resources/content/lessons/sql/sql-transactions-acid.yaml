infosysRelevance: "ACID properties and transactions are standard DBMS theory for DSE and SP rounds; isolation levels are a good SP-level depth question."
otherCompanies: "'Explain ACID properties' is one of the most common DBMS practice questions at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies go deeper into isolation levels."
why: |
  Imagine sending Rs 2,000 from Asha's account to Ravi's. That is **two** updates: subtract from Asha, add to Ravi. What if the server crashes **between** them? Asha loses money and Ravi never gets it.

  A **transaction** groups statements so they succeed **together** or fail **together**. The **ACID** properties describe the promises a database makes about transactions.

  In interviews:
  - "Explain ACID with an example" is a top DBMS question.
  - "What are isolation levels? What is a dirty read?" checks deeper understanding.
  - Knowing the default level in **PostgreSQL vs MySQL** shows real-world awareness.
analogy: |
  Think of a **UPI payment**.

  - You press Pay. Either the money leaves your account **and** reaches the shop, or nothing happens at all. You never see "money gone, shop didn't receive". That's **atomicity**.
  - Your balance can never go below zero if the bank's rule says so. That's **consistency**.
  - If you and your brother pay from the same joint account at the same moment, the bank handles them so the final balance is correct, as if one happened after the other. That's **isolation**.
  - Once you see "Payment successful", the money stays moved even if the bank's server restarts a second later. That's **durability**.
