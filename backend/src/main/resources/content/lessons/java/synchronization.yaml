why: |
  Threads share the heap. That is powerful, but dangerous: when two threads change the **same variable at the same time**, updates can get lost. This bug is called a **race condition**, and it is one of the hardest bugs to find because it appears only *sometimes*.

  In this lesson you'll learn the three classic tools Java gives you:
  - **`synchronized`**: only one thread at a time may run a piece of code.
  - **`volatile`**: every thread sees the latest value of a variable.
  - **`wait()` / `notify()`**: one thread sleeps until another thread says "ready!"

  Interview favourites: **"Why is `count++` not thread-safe?"**, **"synchronized vs volatile?"** and **"Why must `wait()` be called in a while loop?"**
analogy: |
  Think of a **single bathroom in a PG (paying guest) hostel** with one key.

  - **`synchronized`**: whoever holds the key goes in; everyone else waits outside (BLOCKED). When they come out, they hand over the key. Only one person inside at a time.
  - **Race condition**: no lock on the door. Two people walk in together. Chaos.
  - **`volatile`**: a **notice board** in the corridor. When the warden writes "Water is off", everybody reads the latest notice, not an old photo of it on their phone. But a notice board does not stop two people from walking in together.
  - **`wait()`/`notify()`**: you are in the bathroom (holding the key) and find there's no water. You **give back the key and wait on the sofa** (`wait()`). When the warden fixes the water, they shout "Water's back!" (`notifyAll()`). You wake up, take the key again, and **check the tap again** before bathing (the while loop), because someone may have used it all up already.
