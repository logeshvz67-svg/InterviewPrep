predict:
  code: |
    import java.util.ArrayList;
    import java.util.List;

    public class Predict {
        public static void main(String[] args) {
            final List<Integer> nums = new ArrayList<>();
            nums.add(1);
            nums.add(2);
            List<Integer> other = nums;
            other.add(3);
            System.out.println(nums);
            System.out.println(nums.size());
            try {
                System.out.println(10 / 0);
            } catch (ArithmeticException e) {
                System.out.println("error");
            } finally {
                System.out.println("done");
            }
        }
    }
  expectedOutput: |
    [1, 2, 3]
    3
    error
    done
  explanation: |
    - `final` only stops `nums` from pointing to a different list. Adding is allowed.
    - `other = nums` shares the same list, so `other.add(3)` also shows up in `nums`: `[1, 2, 3]`, size `3`.
    - `10 / 0` throws `ArithmeticException` before anything is printed in the try. The catch prints `error`, and then `finally` prints `done`.
commonMistakes:
  - "Thinking a final List or array can't be modified. final locks the reference; the object's contents can still change."
  - "Mixing up final, finally and finalize in an interview. Keyword vs block vs deprecated Object method."
  - "Forgetting to assign a blank final field in every constructor (compile error)."
  - "Saying a final method can't be inherited or overloaded. It can be both; it just can't be overridden."
  - "Relying on finalize() for clean-up. It may never run and is deprecated; use try-with-resources or finally."
  - "Writing final abstract. The two words contradict each other, so it doesn't compile."
interviewBox:
  why: "Why interviewers ask this: one keyword with three meanings plus two look-alike words is a quick way to test precise knowledge, and the final-reference trap tests your understanding of objects."
  questions:
    - q: "What is the difference between final, finally and finalize?"
      a: "final is a keyword: a final variable can be assigned once, a final method can't be overridden, and a final class can't be extended. finally is a block after try and catch that almost always runs, so we put clean-up code there. finalize is a method of the Object class that the garbage collector might call before removing an object, but it's unreliable and deprecated since Java 9."
    - q: "If a list is declared final, can we add elements to it?"
      a: "Yes. final only means the variable can't point to a different list. The list object itself can still be changed, so add and remove work. To stop changes, I'd use an unmodifiable list like List.of."
    - q: "Can a final method be overloaded? Can it be inherited?"
      a: "Yes to both. A child class inherits a final method and can call it, and we can overload it with different parameters. We just can't override it with the same signature."
    - q: "Give examples of final classes in Java and why they are final."
      a: "String, Integer and the other wrapper classes, and Math. String and the wrappers are final so nobody can create a subclass that breaks their immutability or security. Math is just a utility class not meant to be extended."
    - q: "When does a finally block not run?"
      a: "Almost never. It runs after normal completion, after an exception, and even after a return in try. It's skipped only if the JVM stops, for example with System.exit() or a crash."
quiz:
  - id: q1
    type: SPOT_THE_BUG
    prompt: "Which line causes the compile error?"
    code: |
      final int[] scores = {10, 20};   // line 1
      scores[1] = 25;                  // line 2
      scores = new int[]{5, 5};        // line 3
      System.out.println(scores[1]);   // line 4
    options: ["Line 1", "Line 2", "Line 3", "Line 4"]
    answer: 2
    explanation: "Line 3 tries to point the final variable at a new array: compile error. Line 2 is allowed because it changes the array's contents, not the reference; that's the tempting wrong answer."
  - id: q2
    type: MATCH
    prompt: "Match each word to what it is"
    pairs:
      - left: "final"
        right: "Keyword that locks a variable, method or class"
      - left: "finally"
        right: "Block after try/catch that almost always runs"
      - left: "finalize()"
        right: "Deprecated Object method the GC might call"
    explanation: "Similar spelling, unrelated jobs: a modifier, a block, and an old method."
  - id: q3
    type: MCQ
    prompt: "What does marking a METHOD final do?"
    options:
      - "It can't be called from outside the class"
      - "It can't be overridden by a subclass"
      - "It can't be overloaded"
      - "It runs only once"
    answer: 1
    explanation: "A final method can't be overridden. It can still be called (access is controlled by public/private, not final) and overloaded with different parameters."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      final StringBuilder sb = new StringBuilder("Hi");
      sb.append("!");
      sb.append("!");
      System.out.println(sb);
    options: ["Hi", "Hi!!", "Compile error: sb is final", "Hi!"]
    answer: 1
    explanation: "sb is a final reference, but the StringBuilder object is mutable, so appending works: Hi!!. The compile error would happen only if we wrote sb = new StringBuilder(...)."
  - id: q5
    type: TRUE_FALSE
    prompt: "A class can be declared both final and abstract."
    options: ["True", "False"]
    answer: 1
    explanation: "False. abstract means 'a subclass must complete me'; final means 'no subclass allowed'. Together they make no sense, so the compiler rejects it."
  - id: q6
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          static int test() {
              try {
                  return 1;
              } finally {
                  System.out.print("finally ");
              }
          }
          public static void main(String[] args) {
              System.out.println(test());
          }
      }
    options: ["1", "finally 1", "1 finally", "Compile error"]
    answer: 1
    explanation: "The try decides to return 1, but before the method actually returns, finally runs and prints \"finally \". Then main prints the returned 1. The finally block runs even when try has a return."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Fill the keyword so that no class can extend Rupee."
    code: |
      public ____ class Rupee {
          private final long paise;
          public Rupee(long paise) { this.paise = paise; }
      }
    acceptedAnswers: ["final"]
    explanation: "A final class can't be subclassed, just like String and Integer."
explainBack:
  prompt: "Explain to a friend the three uses of final, why a final list can still change, and how final, finally and finalize differ."
  rubric:
    - "I explained final variable, final method and final class"
    - "I said final locks the reference, not the object"
    - "I said finally is a block that almost always runs after try/catch"
    - "I said finalize is an old GC method that is deprecated and unreliable"
  modelAnswer: |
    final is a lock. On a variable, it means I can assign it only once. On a method, a child class can't override it. On a class, nobody can extend it, like String. One trap: if a list variable is final, I can still add items, because final locks the address, not the house; the variable just can't point to a different list. finally is completely different: it's the block after try and catch that runs whether or not an exception happened, so I put clean-up there. And finalize is an old method the garbage collector might call before deleting an object, but it might never run, so it's deprecated and we use try-with-resources instead.
