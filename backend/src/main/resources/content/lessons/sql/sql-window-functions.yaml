version: 1
estimatedMinutes: 40
rebuild: false
patternCode: null
companies: [INFOSYS_SP, INFOSYS_DSE, PRODUCT]
infosysRelevance: "RANK/DENSE_RANK and 'top N per group' are strong SP-level SQL practice; they also give elegant answers to Nth-highest-salary questions."
otherCompanies: "Product companies and data-heavy roles expect window functions; service companies increasingly ask RANK vs DENSE_RANK as a practice question."
why: |
  GROUP BY squashes many rows into one. But often you want to **keep every row** and still see a group calculation next to it:
  - each employee's **rank** inside their department,
  - a **running total** of sales day by day,
  - the **previous** order's amount next to the current one.

  **Window functions** do exactly this. They are the cleanest way to solve "Nth highest salary", "top 2 per department" and "running total" questions.

  The interview favourite is **ROW_NUMBER vs RANK vs DENSE_RANK**, which you will be able to explain with one small table after this lesson.
analogy: |
  Think of a **cricket points table**.

  - Every team stays in the list (rows are **not** squashed).
  - Next to each team you write its **position** (a rank) based on points.
  - If two teams have the same points, should they share 4th place? Should the next team be 5th or 6th? That's exactly RANK vs DENSE_RANK.
  - If you make separate tables for Group A and Group B, positions restart in each group. That is **PARTITION BY**.

  The "window" is the set of rows each team is compared against: the whole league, or just its group.
