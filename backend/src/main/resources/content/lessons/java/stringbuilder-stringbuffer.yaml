      ""  ->  "0"  ->  "01"  ->  "012"      4 objects, 3 are garbage

    StringBuilder sb = new StringBuilder();  sb.append(i) x3
      sb ---> [0][1][2][ ][ ][ ] ... (capacity 16)
              one object, the same buffer grows in place

    +---------------+-----------+---------------+---------------+
    |               | String    | StringBuilder | StringBuffer  |
    +---------------+-----------+---------------+---------------+
    | Mutable?      | No        | Yes           | Yes           |
    | Thread-safe?  | Yes       | No            | Yes (sync)    |
    | Speed         | Slow loop | Fastest       | Slower        |
    | Since         | Java 1.0  | Java 5        | Java 1.0      |
    +---------------+-----------+---------------+---------------+
  caption: "String creates a new object on every change. StringBuilder and StringBuffer change one buffer in place; StringBuffer adds locking for thread safety."
