explanation: |
  ### Part A: Time and work

  ### 1. Work rate
  If A finishes a job in a days, A's **rate** is 1/a of the job per day. **Rates add** when people work together:
  `1/a + 1/b = 1/T`, where T is the time together.

  ### 2. The LCM method (no fractions)
  Take the **total work = LCM of the days**, then each person's rate is a whole number.
  **Worked**: A takes 12 days, B takes 18 days. Total = 36 units. A does 3/day, B does 2/day. Together 5/day -> 36/5 = **7.2 days**.
  **Worked**: A and B together take 10 days; A alone takes 15. Total = 30 units. Together 3/day, A 2/day, so B 1/day -> B alone **30 days**.

  ### 3. Efficiency
  "A is twice as efficient as B" means A's rate is 2 when B's is 1.
  **Worked**: Together they finish in 14 days. Total work = (2 + 1) x 14 = 42 units. A alone = 42 / 2 = **21 days**.

  ### 4. Man-days formula
  More workers, fewer days. `M1 x D1 x H1 / W1 = M2 x D2 x H2 / W2` (Men, Days, Hours per day, Work).
  **Why**: the total "person-hours" needed for a fixed job stays the same.
  **Worked**: 12 men finish a job in 18 days. 8 men take 12 x 18 / 8 = **27 days**.

  ### 5. Pipes and cisterns
  Filling pipes have positive rates; emptying pipes (leaks) have negative rates.
  **Worked**: Pipe A fills a tank in 20 hours; pipe B empties it in 30 hours. LCM = 60 units. A +3/hour, B -2/hour, net +1/hour -> **60 hours**.

  ### Part B: Time, speed and distance

  ### 6. The basic formula and units
  `Distance = Speed x Time`. Units must match.
  `km/h to m/s: x 5/18` (because 1 km/h = 1000 m / 3600 s = 5/18 m/s). So 54 km/h = **15 m/s**, 72 km/h = **20 m/s**.

  ### 7. Average speed trap
  Going 40 km/h and returning 60 km/h over the **same distance**: average speed is **not** 50.
  Average speed = total distance / total time = `2xy/(x + y)` = 2 x 40 x 60 / 100 = **48 km/h**.
  **Why**: you spend **more time** at the slower speed, so it pulls the average down. Check with 120 km each way: 3 h + 2 h = 5 h for 240 km -> 48.

  ### 8. Trains
  - Crossing a pole or a person: distance = **train length**.
  - Crossing a platform or bridge: distance = **train length + platform length**.
  - Two trains: distance = **sum of lengths**; speed = **sum** (opposite directions) or **difference** (same direction). This is **relative speed**: how fast the gap between them changes.

  **Worked**: A 150 m train at 54 km/h (15 m/s) crosses a pole in 150/15 = **10 s**, and a 250 m platform in 400/15 = **26.67 s**.
  **Worked**: Trains of 120 m (72 km/h) and 180 m (36 km/h). Opposite directions: 108 km/h = 30 m/s, 300/30 = **10 s**. Same direction: 36 km/h = 10 m/s, 300/10 = **30 s**.

  ### 9. Boats and streams
  Downstream (with the current) speed = b + s; upstream = b - s. So `b = (down + up)/2`, `s = (down - up)/2`.
  **Worked**: Downstream 14 km/h, upstream 8 km/h -> boat **11 km/h**, stream **3 km/h**.

  ### 10. Late and early
  Walking at 4 km/h, a boy is 10 minutes late; at 5 km/h he is 5 minutes early. The time difference is 15 min = 1/4 h. So d/4 - d/5 = 1/4 -> d/20 = 1/4 -> d = **5 km**.
tinyCode:
  code: |
    public class TimeWorkSpeed {
        static int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); }
        static int lcm(int a, int b) { return a / gcd(a, b) * b; }

        public static void main(String[] args) {
            int total = lcm(12, 18);
            int rateA = total / 12, rateB = total / 18;
            System.out.println("Together: " + (double) total / (rateA + rateB) + " days");

            double speed = 54 * 5.0 / 18;
            System.out.println("Train speed: " + speed + " m/s");
            System.out.printf("Pole: %.2f s, platform: %.2f s%n",
                    150 / speed, (150 + 250) / speed);

            double x = 40, y = 60;
            System.out.println("Average speed: " + 2 * x * y / (x + y) + " km/h");
        }
    }
  walkthrough: |
    - `lcm(12, 18)` = 36 units of work. `lcm` divides first (`a / gcd * b`) to keep numbers small.
    - Rates: A = 3 units/day, B = 2 units/day. `(double) total / 5` = 7.2 (the cast avoids integer division, which would give 7).
    - `54 * 5.0 / 18` converts km/h to m/s = 15.0.
    - Pole: 150 / 15 = 10.00 s. Platform: 400 / 15 = 26.67 s.
    - Average speed for equal distances uses 2xy/(x+y) = 4800/100 = 48.0.
    - Output:
    ```
    Together: 7.2 days
    Train speed: 15.0 m/s
    Pole: 10.00 s, platform: 26.67 s
    Average speed: 48.0 km/h
    ```
