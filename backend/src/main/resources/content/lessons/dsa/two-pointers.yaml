      while (slow < a.length) a[slow++] = 0;
      System.out.println(Arrays.toString(a));
    options: ["[4, 3, 12, 0, 0]", "[12, 3, 4, 0, 0]", "[0, 0, 4, 3, 12]", "[4, 3, 12, 3, 12]"]
    answer: 0
    explanation: "fast copies every non-zero value (4, 3, 12) forward in order to positions 0, 1, 2. Then the while loop fills the rest with zeros. Order of non-zero elements is kept. \"[4, 3, 12, 3, 12]\" is what you'd get without the final fill loop."
