infosysRelevance: "Classic predict-the-output topic: == vs equals with literals, new String and intern() is core prep for SP and DSE MCQs and technical rounds."
otherCompanies: "A common basic question at TCS, Wipro, Cognizant, Accenture, Capgemini; product companies use it to check memory understanding."
why: |
  Two of the most common Java questions are:
  - **"What is the difference between `==` and `equals()`?"**
  - **"How many objects does `new String("hello")` create?"**

  Both are about the **String pool**. Output questions with `s1 == s2` are everywhere in practice tests, and they are easy marks *only* if you can draw the memory picture in your head.

  This lesson also fixes a real bug many beginners write: comparing user input with `==`, which "works sometimes" and then fails.
analogy: |
  Think of a **college library** with a **reference section**.

  - The reference section (the **String pool**) keeps **one copy** of each popular book. If 50 students want "Let Us C", they all read the *same* copy. Nobody can write in it (Strings are immutable), so sharing is safe.
  - A **literal** like `"hello"` is "give me the reference-section copy". Same title, same copy.
  - `new String("hello")` is "photocopy the book and give me my own copy". Same words, but a **different physical book** on your desk.
  - `==` asks: *"Are we holding the very same physical book?"*
  - `equals()` asks: *"Do our books have the same words?"*
  - `intern()` is "take my photocopy to the librarian and get the reference-section copy instead".
