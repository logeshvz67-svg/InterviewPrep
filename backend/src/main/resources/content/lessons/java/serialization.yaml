infosysRelevance: "Common theory question in technical rounds: Serializable, transient and serialVersionUID are classic one-line checks."
otherCompanies: "A common basic question across service companies and product companies; often combined with transient vs static."
why: |
  Objects live in memory (RAM). When the program stops, they disappear. **Serialization** turns an object into a sequence of **bytes** so you can save it to a file, send it over a network, or put it in a cache. **Deserialization** turns those bytes back into an object.

  Interviewers love it because it has short, tricky questions:
  - What is a **marker interface**?
  - What does **transient** do?
  - Why do we need **serialVersionUID**?
  - Are **static** fields saved?

  The same idea (object to bytes or text and back) is used every day in Spring Boot, where objects become **JSON** for REST APIs.
analogy: |
  Think of **shifting house** from Chennai to Bengaluru.

  - Your fully set-up **cot** is the object. You cannot send it as it is in the truck.
  - You **dismantle and pack** it into a flat box with a label: that is **serialization**.
  - In the new house you **unpack and assemble** it: that is **deserialization**.
  - Some things you deliberately **do not pack**, like the milk in the fridge, because it won't survive the trip: those are **transient** fields.
  - The **label on the box** ("cot model v1") is the `serialVersionUID`. If the new house expects "cot model v2", the movers say "this does not match" and refuse: `InvalidClassException`.
