commonMistakes:
  - "In two-sum, storing the current number BEFORE checking its complement, so an element pairs with itself (e.g. 3 + 3 = 6 using one 3)."
  - "Looping over a HashMap and expecting insertion or sorted order. Use LinkedHashMap (insertion) or TreeMap (sorted), or walk the original input."
  - "Using map.get(key) + 1 for a new key: get returns null and unboxing throws NullPointerException. Use getOrDefault or merge."
  - "Using your own class as a key without overriding equals() and hashCode()."
  - "Saying HashMap is always O(1). It is O(1) on average; heavy collisions make it slower."
interviewBox:
  why: "Why interviewers ask this: hashing is the most common way to cut O(n^2) to O(n), and the follow-ups (collisions, order, hashing vs sorting) test real understanding."
  questions:
    - q: "How would you solve two-sum in an unsorted array?"
      a: "I walk through the array once with a HashMap from value to index. For each number, I compute the complement, target minus the number, and check if it's already in the map. If yes, I return both indexes. If not, I store the current number and its index. Checking before storing avoids using the same element twice. It's O(n) time and O(n) space."
    - q: "How do you find the first non-repeating character in a string?"
      a: "Two passes. In the first, I count every character, using an int array of 26 for lowercase letters or a HashMap in general. In the second, I walk the string in its original order and return the first character whose count is 1. Both passes are O(n)."
    - q: "How do you group anagrams?"
      a: "Anagrams have the same letters, so I make a key that is the same for all of them, for example the word with its letters sorted, so eat, tea and ate all become aet. I use a HashMap from that key to a list of words, with computeIfAbsent to create each list. Each group in the map is one anagram group."
    - q: "When would you prefer sorting over hashing?"
      a: "Hashing gives O(n) average time for lookups and counts but uses O(n) extra memory and loses order. I'd prefer sorting when I need the elements in order, like the k-th smallest or ranges, when memory is tight, or when I need a guaranteed worst case, accepting O(n log n) time."
quiz:
  - id: q1
    type: MCQ
    prompt: "You need to check whether an unsorted array of 10^5 numbers has any duplicate. Which approach is fastest on average?"
    code: null
    options: ["Compare every pair: O(n^2)", "Add each number to a HashSet and check if it was already there: O(n)", "Binary search each number: O(n log n) without sorting", "Use a LinkedList and contains()"]
    answer: 1
    explanation: "A HashSet gives O(1) average add/contains, so one pass is O(n). Comparing every pair is O(n^2). Binary search only works on sorted data, and LinkedList.contains is O(n) per call."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "First non-repeating character. What does this print?"
    code: |
      String s = "swiss";
      Map<Character, Integer> freq = new HashMap<>();
      for (char c : s.toCharArray()) freq.merge(c, 1, Integer::sum);
      for (char c : s.toCharArray()) {
          if (freq.get(c) == 1) {
              System.out.println(c);
              break;
          }
      }
    options: ["s", "w", "i", "Nothing is printed"]
    answer: 1
    explanation: "Counts: s=3, w=1, i=1. Walking \"swiss\" in order: 's' has 3, 'w' has 1, so it prints w. 'i' also has count 1 but comes later. merge(c, 1, Integer::sum) adds 1 to the existing count (or starts at 1)."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "For nums = {3, 2, 4} and target 6, this prints [0, 0], which is wrong (the answer is [1, 2]). What is the bug?"
    code: |
      int[] nums = {3, 2, 4};
      int target = 6;
      Map<Integer, Integer> indexOf = new HashMap<>();
      int[] ans = {-1, -1};
      for (int i = 0; i < nums.length; i++) {
          indexOf.put(nums[i], i);
          int need = target - nums[i];
          if (indexOf.containsKey(need)) {
              ans = new int[]{indexOf.get(need), i};
              break;
          }
      }
      System.out.println(Arrays.toString(ans));
    options:
      - "HashMap cannot store int values"
      - "The current number is stored before checking, so 3 finds itself as its own complement; check first, then put"
      - "The loop should start from i = 1"
      - "need should be nums[i] - target"
    answer: 1
    explanation: "At i = 0, 3 is put into the map, then need = 3 is found immediately: the same element is used twice. Moving indexOf.put after the check fixes it and gives [1, 2]. Starting at 1 would skip a valid element, and the complement formula target - nums[i] is correct."
  - id: q4
    type: TRUE_FALSE
    prompt: "Iterating over a HashMap always returns keys in the order they were inserted."
    options: ["True", "False"]
    answer: 1
    explanation: "False. HashMap has no guaranteed order; it depends on hash buckets. Use LinkedHashMap for insertion order or TreeMap for sorted order."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Frequency counting: fill the default value so a new character starts counting correctly."
    code: |
      for (char c : s.toCharArray()) {
          freq.put(c, freq.getOrDefault(c, ____) + 1);
      }
    acceptedAnswers: ["0"]
    explanation: "A character seen for the first time has no entry, so we treat its count as 0 and add 1. Using get(c) + 1 would throw a NullPointerException for new keys."
  - id: q6
    type: MATCH
    prompt: "Match each problem to its hashing pattern"
    pairs:
      - left: "Most frequent element"
        right: "Frequency map: value -> count"
      - left: "Contains duplicate"
        right: "Seen-set: add() returns false on repeat"
      - left: "Two numbers adding to a target (unsorted)"
        right: "Complement lookup: target - x in a map"
      - left: "Group anagrams"
        right: "Map from a signature key (sorted letters) to a list"
    explanation: "Count, seen, complement and group-by-key are the four core hashing patterns."
  - id: q7
    type: MCQ
    prompt: "You need the 3 smallest distinct values of a big array, and memory is very limited. Which is the better fit?"
    code: null
    options: ["HashSet, because it is O(1)", "Sorting (in place), because hashing gives no order and needs O(n) extra memory", "HashMap from value to index", "Two HashSets"]
    answer: 1
    explanation: "Hashing answers 'seen?' and 'how many?' fast, but it keeps no order, so it can't directly give the smallest values, and it uses O(n) extra memory. Sorting in place puts values in order with little extra memory; then you walk from the start skipping duplicates."
