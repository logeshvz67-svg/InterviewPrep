explanation: |
  ### Key words
  - **Prefix**: the beginning part of an array. The prefix of length 3 of `[3, 1, 4, 1, 5]` is `[3, 1, 4]`.
  - **Prefix sum**: the sum of a prefix. We store all of them in an array.
  - **Range sum query**: "what is the sum from index l to index r (inclusive)?"

  ### Building the prefix array
  We use size **n + 1** with `prefix[0] = 0`. This extra zero removes special cases.
  ```java
  int[] prefix = new int[n + 1];
  for (int i = 0; i < n; i++) {
      prefix[i + 1] = prefix[i] + arr[i];
  }
  ```
  `prefix[i]` = sum of the first `i` elements = `arr[0] + ... + arr[i-1]`.

  ### Answering a range sum in O(1)
  ```java
  int rangeSum(int l, int r) {          // inclusive l..r
      return prefix[r + 1] - prefix[l];
  }
  ```
  `prefix[r + 1]` is everything up to `r`; subtracting `prefix[l]` removes everything **before** `l`.

  | Approach | Build | Each query | q queries |
  |---|---|---|---|
  | Loop every time | none | O(n) | O(n * q) |
  | Prefix sum | O(n) | O(1) | O(n + q) |
  Use `long[]` if sums can exceed about 2.1 billion.

  ### Pattern: subarray sum equals k (with a HashMap)
  **Goal**: count continuous subarrays whose sum is exactly `k`. Numbers may be negative.

  **Key idea**: a subarray `(j..i]` has sum `k` when
  `prefixSum(i) - prefixSum(j) = k`, that is, `prefixSum(j) = prefixSum(i) - k`.
  So while walking, for the current running sum, ask: **"how many earlier prefix sums equal `sum - k`?"** A HashMap from *prefix sum value* to *how many times it appeared* answers that in O(1).
  ```java
  Map<Integer, Integer> count = new HashMap<>();
  count.put(0, 1);           // the empty prefix: sum 0 seen once
  int sum = 0, result = 0;
  for (int x : arr) {
      sum += x;                                   // running prefix sum
      result += count.getOrDefault(sum - k, 0);   // subarrays ending here
      count.put(sum, count.getOrDefault(sum, 0) + 1);
  }
  ```
  - `count.put(0, 1)` is essential: it counts subarrays that **start at index 0**. Forgetting it is the most common bug.
  - Check `sum - k` **before** adding the current sum, so a subarray is never empty.
  - Time **O(n)**, space **O(n)**. Brute force is O(n^2).
  - Same idea solves: "longest subarray with sum k" (store the **first index** of each sum instead of a count), "subarrays with equal 0s and 1s" (treat 0 as -1, look for sum 0), "subarray sum divisible by k" (store `sum % k`).

  ### Why not sliding window here?
  Sliding window needs "shrinking makes the sum smaller", which is only true for **non-negative** numbers. Prefix sum + HashMap does not care about signs.

  ### Equilibrium / pivot index
  An index where the sum on the left equals the sum on the right. With the total sum known: `leftSum == total - leftSum - arr[i]`. One pass, O(n). (See the Try-it.)

  ### 2D prefix sum (for grids)
  For a matrix, `P[i][j]` = sum of the rectangle from `(0,0)` to `(i-1, j-1)`:
  ```java
  P[i][j] = grid[i-1][j-1] + P[i-1][j] + P[i][j-1] - P[i-1][j-1];
  ```
  The sum of a rectangle with corners `(r1,c1)` to `(r2,c2)`:
  ```java
  P[r2+1][c2+1] - P[r1][c2+1] - P[r2+1][c1] + P[r1][c1]
  ```
  We subtract the two strips above and to the left, and add back the corner that was subtracted twice (**inclusion-exclusion**). Build O(rows * cols), query O(1).
tinyCode:
  code: |
    import java.util.Arrays;
    import java.util.HashMap;
    import java.util.Map;

    public class PrefixSum {
        static int countSubarraysWithSum(int[] arr, int k) {
            Map<Integer, Integer> count = new HashMap<>();
            count.put(0, 1);
            int sum = 0, result = 0;
            for (int x : arr) {
                sum += x;
                result += count.getOrDefault(sum - k, 0);
                count.put(sum, count.getOrDefault(sum, 0) + 1);
            }
            return result;
        }

        public static void main(String[] args) {
            int[] arr = {3, 1, 4, 1, 5};
            int[] prefix = new int[arr.length + 1];
            for (int i = 0; i < arr.length; i++) {
                prefix[i + 1] = prefix[i] + arr[i];
            }
            System.out.println(Arrays.toString(prefix));
            System.out.println("sum[1..3] = " + (prefix[4] - prefix[1]));
            System.out.println("sum[0..4] = " + (prefix[5] - prefix[0]));

            int[] mixed = {1, 2, -1, 2, 1};
            System.out.println("subarrays with sum 3: " + countSubarraysWithSum(mixed, 3));
        }
    }
  walkthrough: |
    - The prefix array has size n + 1 and starts with 0: `[0, 3, 4, 8, 9, 14]`.
    - `sum[1..3]` = `prefix[4] - prefix[1]` = 9 - 3 = **6** (that is 1 + 4 + 1).
    - `sum[0..4]` = 14 - 0 = **14**, the whole array.
    - `countSubarraysWithSum([1, 2, -1, 2, 1], 3)`: running sums are 1, 3, 2, 4, 5. At each step we look up `sum - 3` in the map:
      - sum 3: `0` seen once -> `[1, 2]`
      - sum 4: `1` seen once -> `[2, -1, 2]`
      - sum 5: `2` seen once -> `[2, 1]`
      Total **3**, even with a negative number.

    Output:
    ```
    [0, 3, 4, 8, 9, 14]
    sum[1..3] = 6
    sum[0..4] = 14
    subarrays with sum 3: 3
    ```
tryIt:
  instructions: "Type this program that finds the equilibrium (pivot) index: where the sum on the left equals the sum on the right. Then try {1, 2, 3} which has none."
  code: |
    public class Pivot {
        static int pivotIndex(int[] arr) {
            int total = 0;
            for (int x : arr) total += x;

            int leftSum = 0;
            for (int i = 0; i < arr.length; i++) {
                int rightSum = total - leftSum - arr[i];
                if (leftSum == rightSum) return i;
                leftSum += arr[i];
            }
            return -1;
        }

        public static void main(String[] args) {
            System.out.println(pivotIndex(new int[]{1, 7, 3, 6, 5, 6}));
            System.out.println(pivotIndex(new int[]{2, 1, -1}));
        }
    }
