  prompt: "Explain what a greedy algorithm is to a friend, using the team captain example, and give one case where it works and one where it fails."
  rubric:
    - "I said greedy picks the best-looking option at each step and never goes back"
    - "I explained activity selection: sort by end time and why"
    - "I gave the coin {4, 3, 1} for 6 counterexample"
    - "I said to test small counterexamples and use DP when greedy fails"
    - "I mentioned greedy is usually O(n) or O(n log n)"
  modelAnswer: |
    A greedy algorithm is like a team captain who always picks the best available player right now and never changes a pick. It's fast, usually just sort plus one loop. It works for picking the maximum number of meetings in one room: sort by end time and always take the meeting that finishes first, because that leaves the most time for the rest. But it fails for coin change with coins 4, 3 and 1: for 6 rupees greedy takes 4, 1 and 1, three coins, while 3 plus 3 is just two. So before trusting greedy I try a few small examples by hand, and if it fails I switch to dynamic programming.
