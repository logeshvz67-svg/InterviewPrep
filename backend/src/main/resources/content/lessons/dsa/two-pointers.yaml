      int sum = arr[left] + arr[right];
      if (sum == target) return true;
      else if (sum < target) ____;
      else right--;
    acceptedAnswers: ["left++", "++left", "left+=1", "left=left+1"]
    explanation: "A small sum needs a bigger number, and only moving left to the right (left++) gives a bigger value in a sorted array. right-- would make the sum even smaller."
