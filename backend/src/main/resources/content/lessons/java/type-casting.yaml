    back: "byte -> short -> int -> long -> float -> double (char -> int). Automatic."
  - front: "(int) 9.99 and (int) -9.99"
    back: "9 and -9. Casting cuts toward zero; use Math.round to round."
  - front: "(byte) 130"
    back: "-126 (130 - 256). Only the lowest 8 bits are kept."
  - front: "Why does byte c = a + b; fail for bytes a, b?"
    back: "byte, short, char are promoted to int in expressions, so a + b is int. Cast or use +=."
  - front: "String to int?"
