  explanation: |
    A and B create books with ids 1 and 2 (201 each). C reads book 2 (200). D deletes id 5, which never existed, so the controller returns 404. E deletes book 2 (204, no body). F is the interesting one: `/api/books/1` **is** a known URL, but no method handles PUT on it, so Spring answers **405 Method Not Allowed**, not 404. (Spring also logs a warning line for F; ignore log lines.)
commonMistakes:
  - "Putting business rules (discounts, limits, permissions) in the controller. Controllers should be thin; logic belongs in services."
  - "Returning JPA entities from controllers. You may leak fields like passwordHash and hit LazyInitializationException while JSON is written."
  - "Verbs in URLs like /getBooks or /deleteBook?id=3. Use nouns and let the HTTP method say the action."
  - "Changing data in a GET request. GET must be safe: browsers, proxies and crawlers repeat GETs freely."
  - "Returning 200 for everything, even errors. Use 201, 204, 400, 404, 409 and so on so clients can react correctly."
  - "Thinking page numbers start at 1 in Spring Data. PageRequest.of(0, 20) is the FIRST page."
interviewBox:
  why: "Why interviewers ask this: it checks whether you can structure a real backend and design an API other developers can use without reading your code."
  questions:
    - q: "Explain the layered architecture of your Spring Boot project."
      a: "Requests come into controllers, which only map URLs, validate input and call one service method. Services hold the business rules and transactions; for example XpService decides how much XP to give and stops double rewards. Repositories, which are Spring Data interfaces, read and write the database. Data goes out as DTO records, not entities. This keeps each part simple and lets me unit test services with mock repositories."
    - q: "What is the difference between PUT and PATCH?"
      a: "PUT replaces the whole resource with what I send, and it is idempotent: sending it twice gives the same result. PATCH changes only some fields, like marking a mistake as resolved. POST creates a new resource and is not idempotent: sending it twice creates two."
    - q: "Why use DTOs instead of returning entities?"
      a: "Entities match database tables and can contain sensitive fields like a password hash, plus lazy relationships that can crash during JSON writing after the transaction ends. DTOs define exactly what the API exposes, so the database can change without breaking clients."
    - q: "Which status codes would you return for create, delete, validation error and duplicate email?"
      a: "201 Created for create, 204 No Content for delete, 400 Bad Request for validation errors, and 409 Conflict for a duplicate email. 404 if the resource doesn't exist, 401 if not logged in and 403 if logged in but not allowed."
    - q: "How do you implement pagination?"
      a: "The endpoint accepts page and size query parameters, with a maximum size. The service calls the repository with PageRequest.of(page, size), which starts from page 0, and gets a Page back. I return the items plus page, size, total items and total pages, like the PageResponse record in my project."
quiz:
  - id: q1
    type: MCQ
    prompt: "Where should the rule 'a user can earn XP for the same problem only once' live?"
    code: null
    options:
      - "In the controller, before calling the repository"
      - "In the service layer"
      - "In the DTO record"
      - "In the JavaScript frontend"
    answer: 1
    explanation: "Business rules belong in services, which is exactly where your XpService checks existsByUserIdAndActionAndSourceKey. A controller rule would be skipped by any other caller of the service, and a frontend rule can be bypassed by anyone with curl."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "BookController has @GetMapping(\"/{id}\") with a Long id. What status does GET /api/books/abc return?"
    code: |
      @GetMapping("/{id}")
      ResponseEntity<BookResponse> get(@PathVariable Long id) {
          return service.find(id).map(ResponseEntity::ok)
                  .orElse(ResponseEntity.notFound().build());
      }
    options: ["200", "400", "404", "500"]
    answer: 1
    explanation: "Spring cannot convert 'abc' to Long, so it throws MethodArgumentTypeMismatchException before the method runs, and the default handling answers 400 Bad Request. It is not 404, because the URL pattern matched; the input was just invalid."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "What is wrong with this REST design?"
    code: |
      @RestController
      @RequestMapping("/api")
      class BookController {
          @GetMapping("/deleteBook")
          String deleteBook(@RequestParam Long id) {
              service.delete(id);
              return "deleted";
          }
      }
    options:
      - "@RequestParam cannot be a Long"
      - "It deletes data with GET and puts a verb in the URL; it should be DELETE /api/books/{id} returning 204"
      - "The class needs @Service as well"
      - "Nothing; it works, so it is fine"
    answer: 1
    explanation: "GET must be safe: crawlers, browser prefetching or a retry could delete books by accident. REST URLs name resources (nouns) and the method says the action. It does 'work', which is why option D is tempting, but it breaks HTTP's rules."
  - id: q4
    type: MATCH
    prompt: "Match each situation to the best status code"
    pairs:
      - left: "POST created a new account"
        right: "201 Created"
      - left: "DELETE succeeded, nothing to return"
        right: "204 No Content"
      - left: "Email is already registered"
        right: "409 Conflict"
      - left: "Logged in, but not an admin"
        right: "403 Forbidden"
      - left: "POST sent to a GET-only URL"
        right: "405 Method Not Allowed"
    explanation: "201 and 204 are success codes with specific meanings; 409 means the request clashes with existing data; 403 is 'known user, not allowed' (401 would be 'not logged in'); 405 means the URL exists but not for that method."
  - id: q5
    type: TRUE_FALSE
    prompt: "PUT and DELETE are idempotent, but POST is not."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Repeating a PUT or DELETE leaves the server in the same state as doing it once. Repeating a POST to /api/orders creates another order each time."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Make this endpoint return 201 when a book is created."
    code: |
      @PostMapping
      @ResponseStatus(HttpStatus.____)
      BookResponse create(@RequestBody BookRequest req) {
          return service.create(req);
      }
    acceptedAnswers: ["CREATED"]
    explanation: "HttpStatus.CREATED is 201. Your AuthController.register uses exactly this. HttpStatus.OK (200) would also 'work', but 201 tells the client a new resource exists."
  - id: q7
    type: PREDICT_OUTPUT
    prompt: "There are 45 mistakes. The client calls GET /api/mistakes?page=2&size=20. How many items come back, and what is totalPages?"
    code: |
      Pageable pageable = PageRequest.of(2, 20);
      Page<Mistake> page = repo.findAll(pageable); // 45 rows in total
      System.out.println(page.getNumberOfElements() + " " + page.getTotalPages());
    options: ["20 3", "5 3", "0 2", "25 2"]
    answer: 1
    explanation: "Pages start at 0: page 0 = rows 1-20, page 1 = rows 21-40, page 2 = rows 41-45. So page 2 has 5 items, and 45 rows need 3 pages. Option C assumes pages start at 1."
  - id: q8
    type: MCQ
    prompt: "Why does the backend return UserView instead of the User entity from /api/auth/me?"
    code: null
    options:
      - "Records are faster to serialize than classes"
      - "The entity has a password hash and DB details that must not leave the server, and its shape is tied to the table"
      - "Entities cannot be converted to JSON at all"
      - "Spring Security forbids returning entities"
    answer: 1
    explanation: "DTOs control exactly what is exposed. Entities CAN be turned into JSON (that's the danger: you'd leak passwordHash), and Spring Security has no such rule. Speed is not the reason."
explainBack:
  prompt: "Explain to a friend how a Spring Boot backend is organised and how a good REST API looks."
  rubric:
    - "I named controller, service and repository and the job of each"
    - "I explained DTO vs entity and why entities are not returned"
    - "I gave REST URL rules: plural nouns, HTTP method as the action"
    - "I named at least five status codes correctly"
    - "I mentioned pagination with page starting at 0"
  modelAnswer: |
    A Spring Boot backend is like a restaurant. The controller is the waiter: it takes the HTTP request, validates it and calls one service method. The service is the chef with all the business rules and transactions. The repository is the storeroom that reads and writes the database. Data goes in and out as DTO records, never as entities, so secrets like password hashes stay inside. URLs are plural nouns like /api/books/12, and the method is the action: GET reads, POST creates, PUT replaces, PATCH updates part, DELETE removes. I return 201 for create, 204 for delete, 400 for bad input, 404 when not found, 409 for conflicts. Lists are paginated, starting from page 0.
flashcards:
  - front: "Controller / Service / Repository: one job each"
    back: "Controller: HTTP in/out, validation. Service: business rules + transactions. Repository: database access."
  - front: "Safe vs idempotent"
    back: "Safe: does not change data (GET). Idempotent: repeating gives the same server state (GET, PUT, DELETE). POST is neither."
  - front: "401 vs 403"
    back: "401: not logged in / invalid token. 403: logged in but not allowed."
  - front: "404 vs 405"
    back: "404: no such URL/resource. 405: the URL exists but not for this HTTP method."
  - front: "Why DTOs?"
    back: "Control what is exposed (no password hash), avoid lazy-loading crashes during JSON, keep API stable when the DB changes."
  - front: "PageRequest.of(2, 20) means"
    back: "Third page (pages start at 0), offset 40, up to 20 rows."
keyTakeaways:
  - "Controller (HTTP), Service (business logic, transactions), Repository (data): each layer has one job."
  - "Send DTO records over HTTP; keep entities inside the server."
  - "REST: plural noun URLs, method = action; GET is safe; PUT and DELETE are idempotent, POST is not."
  - "Use precise status codes: 200, 201, 204, 400, 401, 403, 404, 405, 409, 500."
  - "Paginate lists with page (from 0) and a capped size, and return total counts."
