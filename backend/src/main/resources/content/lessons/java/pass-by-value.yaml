title: "Java is pass-by-value"
version: 1
estimatedMinutes: 30
rebuild: true
patternCode: null
companies: [ALL]
infosysRelevance: "A classic trap in SP and DSE theory and output practice: 'Is Java pass-by-value or pass-by-reference?' plus swap() and modify-object code."
otherCompanies: "A very common Java interview trap at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  "**Is Java pass-by-value or pass-by-reference?**" Many people answer "primitives by value, objects by reference". **That answer is wrong**, and interviewers ask it precisely to see who really understands memory.

  The correct answer: **Java is always pass-by-value.** For objects, the *value* that gets copied is the **reference** (the address).

  Once you see the stack/heap picture, you'll be able to predict every output question about:
  - a `swap(a, b)` method that "doesn't work",
  - a method that **changes** an object's field (works!),
  - a method that **reassigns** its parameter to a new object (doesn't affect the caller),
  - arrays and Strings passed into methods.
analogy: |
  Imagine your friend wants to visit your house. You write your **address on a new chit** and give it to them.

  - The friend has a **copy of the address**, not your house, and not your original chit.
  - If the friend **goes to that address and paints the door blue**, your door really is blue. (Changing an object through a copied reference **is visible** to the caller.)
  - If the friend **scribbles a different address on their chit**, your chit and your house don't change at all. (Reassigning the parameter **is not visible** to the caller.)

  That's pass-by-value with references: the **chit is copied**, the **house is shared**.
