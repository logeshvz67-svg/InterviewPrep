keyTakeaways:
  - "Widening (small to big) is automatic; narrowing (big to small) needs an explicit cast."
  - "Casting a decimal to int cuts the fraction toward zero; it never rounds."
  - "Narrowing integers keeps only the low bits, so values wrap around."
  - "byte, short and char become int in arithmetic; compound assignment casts back automatically."
  - "Cast before dividing to get a decimal average."
  - "boolean never converts; Strings use parseInt / valueOf, not casts."
