  explanation: |
    100 is in the cache, so `x == y` is true. 1000 is not, so `p == q` compares two different objects: false. `p == r` has a primitive on one side, so `p` is unboxed and values are compared: true. `p.equals(q)` compares values: true. `big.equals(100)` boxes 100 into an **Integer**, and a Long is never equal to an Integer: false.
commonMistakes:
  - "Comparing two Integer objects with ==. It works by luck for -128 to 127 and fails above; use equals()."
  - "Unboxing a possibly-null wrapper (int c = map.get(key)). It throws NullPointerException; use getOrDefault or a null check."
  - "Expecting Long.equals(Integer) to be true for the same number. Different wrapper types are never equal."
  - "Using Long or Integer for a loop counter or sum in heavy loops, creating millions of objects."
  - "Writing Int or Char instead of Integer and Character."
  - "Confusing parseInt (returns int) with valueOf (returns Integer)."
interviewBox:
  why: "Why interviewers ask this: the Integer cache output question checks whether you understand references vs values, and unboxing NPEs are a very common real bug."
  questions:
    - q: "What are wrapper classes and why do we need them?"
      a: "Wrapper classes like Integer, Double and Character wrap a primitive value inside an object. We need them because collections and generics work only with objects, because a wrapper can be null, and because they offer utility methods like Integer.parseInt."
    - q: "What is autoboxing and unboxing?"
      a: "Autoboxing is the automatic conversion from a primitive to its wrapper, like int to Integer, using Integer.valueOf. Unboxing is the reverse, using methods like intValue(). The compiler inserts these calls for us."
    - q: "Why does Integer a = 127, b = 127; a == b print true, but with 128 it prints false?"
      a: "Autoboxing uses Integer.valueOf, which caches Integer objects from -128 to 127. So for 127 both variables point to the same cached object and == is true. For 128 two separate objects are created, and == compares references, so it's false. We should use equals() to compare values."
    - q: "When can autoboxing cause a NullPointerException?"
      a: "When a wrapper that is null gets unboxed. For example, int count = map.get(\"x\") when the key is missing: get returns null, and Java calls null.intValue(), which throws NullPointerException."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              Integer a = 127, b = 127;
              Integer c = 129, d = 129;
              System.out.println((a == b) + " " + (c == d));
          }
      }
    options: ["true true", "true false", "false false", "false true"]
    answer: 1
    explanation: "127 is inside the Integer cache (-128 to 127), so a and b share one object: true. 129 is outside, so c and d are separate objects and == compares references: false. 'true true' is the trap if you think == compares values for wrappers."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "This compiles. What happens at run time?"
    code: |
      import java.util.*;
      public class Main {
          public static void main(String[] args) {
              Map<Character, Integer> freq = new HashMap<>();
              freq.put('a', 2);
              int countB = freq.get('b');
              System.out.println(countB);
          }
      }
    options:
      - "Prints 0"
      - "Prints null"
      - "Throws NullPointerException while unboxing null"
      - "Throws ClassCastException"
    answer: 2
    explanation: "get('b') returns null because 'b' is not a key. Assigning it to an int forces unboxing (null.intValue()), which throws NullPointerException. An int can never hold null, so 'Prints null' is impossible; 'Prints 0' would need getOrDefault('b', 0)."
  - id: q3
    type: MCQ
    prompt: "Which is the correct way to compare the VALUES of two Integer objects x and y?"
    options: ["x == y", "x.equals(y)", "x = y", "x.compareTo(y) == 1"]
    answer: 1
    explanation: "equals() compares values for any range. x == y compares references and only seems to work for -128 to 127. x = y is assignment, and compareTo returns 0 (not 1) for equal values."
  - id: q4
    type: TRUE_FALSE
    prompt: "Double values are cached like Integer values from -128 to 127."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Float and Double have no valueOf cache, so two boxed doubles are always different objects. Integer, Long, Short and Byte cache -128 to 127, Character caches 0 to 127."
