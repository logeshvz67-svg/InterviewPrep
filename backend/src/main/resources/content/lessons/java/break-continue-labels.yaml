  - front: "Which loop does a plain break leave?"
    back: "Only the innermost loop (or switch) containing it."
  - front: "How to leave nested loops at once?"
    back: "Label the outer loop (outer:) and use break outer; or return from a method."
  - front: "continue in a while loop jumps to?"
