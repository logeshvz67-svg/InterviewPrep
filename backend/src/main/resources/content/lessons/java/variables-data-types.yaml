patternCode: null
companies: [ALL]
infosysRelevance: "Common in MCQs and output questions; choosing long over int correctly avoids wrong answers on large test cases in SP coding problems."
otherCompanies: "Sizes, ranges and default values are standard MCQ material at TCS, Wipro, Cognizant, Accenture and Capgemini. Product companies care about overflow in coding rounds."
why: |
  Every program stores values: a count, a price, a name, a yes/no answer. A **variable** is a named box that holds one value, and the **data type** decides what kind of value fits in the box and how big the box is.

  Why this matters in interviews and tests:
  - MCQs love questions like *"What is the size of `char` in Java?"* or *"What is the default value of a `boolean` field?"*
  - In coding rounds, using `int` where the answer can exceed about **2.1 billion** gives a **wrong answer** on the big hidden test cases, even if your logic is perfect. Picking `long` is often the only fix needed.
  - Knowing that `0.1 + 0.2` is not exactly `0.3` saves you from strange bugs with decimals.
analogy: |
  Think of a **kitchen with steel containers of different sizes**.

  - A tiny container (a `byte`) holds a pinch of salt. A big drum (a `long`) holds a whole sack of rice.
  - Each container has a **label** (the variable name) so you can find it later.
  - You cannot pour a sack of rice into the salt container; it overflows. In Java, putting too big a number into a small type also "overflows" and gives a wrong value.
  - A `String` is different: it is not the rice itself, it is a **slip with the address** of a big storeroom where the text is kept. That is what a **reference** is.
