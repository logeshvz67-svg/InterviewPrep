companies: [ALL, INFOSYS_SP, INFOSYS_DSE]
infosysRelevance: "Primary vs foreign vs unique vs candidate key is core DBMS theory for DSE and SP technical interviews."
otherCompanies: "One of the most common DBMS practice questions at TCS, Wipro, Cognizant, Accenture and Capgemini (super/candidate/primary/alternate key definitions)."
why: |
  A database is only useful if its data can be **trusted**. What stops someone from adding two customers with the same id, an order for a customer who doesn't exist, or a negative amount? **Constraints**.

  Constraints are rules the database itself enforces, on every insert and update, no matter which app or person writes the data.

  In interviews you will hear:
  - "Difference between primary key and unique key?"
  - "What are candidate, super and alternate keys?"
  - "What happens to orders when you delete their customer?" (ON DELETE CASCADE)

  This lesson answers all of them with our customers and orders tables.
analogy: |
  Think of your **college ID system**.

  - **Primary key**: your **roll number**. Every student has exactly one, no two students share it, and it can never be blank.
  - **Unique key**: your **email or phone number**. No two students may share it, but a student might not have given one yet (blank is allowed).
  - **Candidate keys**: anything that *could* identify you uniquely: roll number, Aadhaar number, college email. The office **picks one** as the primary key; the others are **alternate keys**.
  - **Foreign key**: the **roll number written on a library card**. The library only accepts roll numbers that really exist in the student list.
  - **ON DELETE CASCADE**: when a student leaves college and is removed, all their library cards are automatically torn up too.
