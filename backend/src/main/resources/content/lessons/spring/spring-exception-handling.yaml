order: 6
title: "Global exception handling"
version: 1
estimatedMinutes: 35
rebuild: false
patternCode: null
companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
infosysRelevance: "A favourite SP and DSE practice question: 'How do you handle exceptions in a Spring Boot REST API?' The expected answer is @RestControllerAdvice + @ExceptionHandler with proper status codes."
otherCompanies: "Asked regularly at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies also look for a consistent error format (ProblemDetail), no leaking of internals, and correct 4xx vs 5xx choices."
why: |
  Things go wrong all the time: a topic does not exist, an email is already registered, a field is blank, someone sends DELETE to a GET-only URL, or there is a real bug. What the client sees in those moments matters a lot:
  - a **clear status code** (404, 409, 400...) so the frontend knows what happened,
  - a **consistent JSON shape** so the frontend can show the message,
  - **no stack traces or secrets** leaked to the outside world.

  Writing try/catch in every controller method is repetitive and easy to forget. Spring lets you handle errors in **one place**. Your project does exactly this in `GlobalExceptionHandler`, which you will fully understand by the end of this lesson.
analogy: |
  Think of a **hospital's casualty (emergency) desk**.

  - Doctors in every ward (controllers and services) do not each handle every emergency themselves. When something goes wrong, they **send the patient to casualty** (throw an exception).
  - The casualty desk (**@RestControllerAdvice**) has a **specialist for each type of case** (**@ExceptionHandler** methods): fracture, burn, fever. The **most specific** specialist takes the case.
  - Unknown cases go to the **general duty doctor** (the `Exception.class` catch-all), who treats it and **writes a calm report for the family** (a polite 500 message) while the detailed notes go into the hospital records (the server log), not to the family.
  - Every report uses the **same printed form** (ProblemDetail), so families always know where to look.
