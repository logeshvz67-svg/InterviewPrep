why: |
  **"What is a class and what is an object?"** is usually the first OOP question in a Java interview. It sounds easy, but many people answer with a definition they memorised and then get stuck on the follow-up: *"What happens in memory when you write `new`?"*

  Everything in OOP (Object-Oriented Programming: building programs from objects that hold data and behaviour together) starts here:
  - Constructors, `this`, `static` and inheritance all need this picture.
  - Output questions often test what happens when two variables point to the same object.
  - Every coding problem with a `Node`, `Student` or `Pair` class uses it.
analogy: |
  Think of a **cookie cutter** and **cookies**.

  - The **cookie cutter** is the **class**. It decides the shape. You can't eat it. It exists once.
  - Each **cookie** is an **object**. You can make as many cookies as you like with the same cutter.
  - Each cookie can have its own **topping** (chocolate, jam). That's the object's **state** (its field values).
  - Things you can do with a cookie (eat it, break it) are its **behaviour** (methods).

  Another everyday example: the **Aadhaar card format** is the class (fields: name, number, address). Your Aadhaar card and your friend's are two objects with different values.
