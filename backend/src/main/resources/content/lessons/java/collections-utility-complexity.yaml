  - front: "ArrayList vs LinkedList costs"
    back: "ArrayList: get O(1), add end O(1) amortized, middle O(n). LinkedList: ends O(1), get(i) O(n)."
  - front: "HashMap vs TreeMap get"
    back: "HashMap O(1) average (O(log n) worst in Java 8+). TreeMap O(log n)."
  - front: "Collections.sort complexity and stability"
    back: "O(n log n), stable (TimSort)."
  - front: "unmodifiableList vs List.of"
    back: "unmodifiableList: read-only view, shows changes to the original. List.of: truly immutable, no nulls."
  - front: "binarySearch requirement and cost"
    back: "List must be sorted; O(log n); returns a negative number if not found."
keyTakeaways:
  - "Collection is an interface; Collections is a utility class of static helpers."
  - "Collections.sort is O(n log n) and stable; binarySearch needs a sorted list."
  - "unmodifiableList is a view; List.of / List.copyOf are truly immutable; Arrays.asList is fixed-size."
  - "Hash structures are O(1) average, tree structures O(log n), list scans O(n)."
  - "Optimise by swapping structures: List contains -> HashSet, front removals -> ArrayDeque, full sort -> heap of size k."
