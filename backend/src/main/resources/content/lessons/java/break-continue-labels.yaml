  modelAnswer: |
    Imagine checking answer sheets. If a page is blank, I skip it and go to the next page: that is continue. If the whole sheet is copied, I stop checking that sheet completely: that is break. In nested loops, a normal break or continue only affects the innermost loop. If I want to leave the outer loop too, like when a fire alarm rings and I stop everything, I put a label like outer before the outer loop and write break outer. One trap: in a while loop, if I write continue before increasing my counter, the counter never changes and the loop runs forever.
flashcards:
