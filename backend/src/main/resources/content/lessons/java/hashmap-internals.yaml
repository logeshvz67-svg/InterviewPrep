  modelAnswer: |
    A HashMap is basically an array of buckets. When I put a key, Java calls its hashCode, mixes the bits, and uses (n minus 1) AND hash to get a bucket number, so it jumps straight to that slot. That's why it's O(1) on average. If two different keys land in the same bucket, that's a collision: they are kept in a small linked list, and equals is used to find the exact key. If one bucket grows beyond 8 entries and the table has at least 64 buckets, the list becomes a red-black tree. When the map is 75% full, it doubles its size and moves the entries. Keys should be immutable, otherwise their hash changes and they get lost.
flashcards:
  - front: "HashMap bucket index formula"
    back: "hash = h ^ (h >>> 16); index = (n - 1) & hash, where n is the table length (a power of 2)."
  - front: "Default capacity, load factor and first resize point"
    back: "Capacity 16, load factor 0.75, so it resizes when size goes above 12. The table doubles."
  - front: "When does a bucket become a red-black tree?"
    back: "When it grows past 8 nodes AND the table length is at least 64. It turns back into a list at 6 or fewer."
  - front: "Where does the null key go?"
    back: "Bucket 0 (hash of null = 0). Only one null key is allowed; many null values are fine."
  - front: "Worst-case get() in Java 8+ HashMap"
    back: "O(log n), because long buckets are red-black trees. Before Java 8 it was O(n)."
  - front: "Why must keys be immutable?"
    back: "The bucket is fixed at put time. If the key's hashCode changes later, get() searches the wrong bucket and returns null."
keyTakeaways:
  - "HashMap = array of buckets; the spread hash code and (n - 1) & hash pick the bucket."
  - "Collisions are chained in a list; a list longer than 8 becomes a red-black tree (if the table is >= 64)."
  - "Load factor 0.75: the table doubles when size > capacity x 0.75, and entries are rehashed."
  - "Always override equals() and hashCode() together, and use immutable keys."
  - "Average O(1), worst O(log n) in Java 8+; one null key allowed; not thread-safe; no order guarantee."
