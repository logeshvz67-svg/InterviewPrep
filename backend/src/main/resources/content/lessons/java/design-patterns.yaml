companies: [ALL]
infosysRelevance: "Common design question: writing a thread-safe Singleton and explaining Factory/Builder/Observer with examples is good prep for SP and DSE technical rounds."
otherCompanies: "\"Write a Singleton class\" is a common practice question almost everywhere; product companies go deeper into thread safety and when to use each pattern."
why: |
  A **design pattern** is a proven, reusable solution to a problem that keeps coming up in software design. It is not ready-made code; it is a **shape** of code that experienced developers recognise.

  Why learn them now?
  - **"Write a Singleton"** is one of the most common coding questions in interviews, and the follow-up is always "is it thread-safe?".
  - Spring Boot is full of these patterns: beans are **singletons** by default, `ApplicationContext` is a **factory**, `ResponseEntity.ok().body(...)` and Lombok's `@Builder` are **builders**, and application events are **observers**.
  - Naming a pattern in an interview ("I would use a Factory here") makes you sound like a developer who has seen real code.
analogy: |
  Four patterns, four everyday pictures:

  - **Singleton = the college principal.** There is exactly **one** principal. Everyone who needs the principal goes to the same office; nobody "creates" a new principal.
  - **Factory = the dosa counter.** You say "masala" or "rava", and the counter gives you the right dosa. You don't go into the kitchen and decide how each one is made.
  - **Builder = ordering a custom pizza.** Size, crust, cheese, toppings: you add only what you want, step by step, and then say "make it". No need for a constructor with ten confusing arguments.
  - **Observer = YouTube subscribe + bell icon.** When the channel uploads a video, **all subscribers** get notified automatically. The channel doesn't need to know who each subscriber is, only that they want updates.
