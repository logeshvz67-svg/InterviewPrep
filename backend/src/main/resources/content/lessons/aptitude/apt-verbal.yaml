infosysRelevance: "Infosys-style basics practice: grammar, vocabulary, reading comprehension and sentence ordering are common verbal-ability areas, and the same skills help you read problem statements and write clear emails at work."
otherCompanies: "Verbal ability (error spotting, fill in the blanks, reading comprehension, para jumbles) is a common practice area for TCS, Wipro, Cognizant, Accenture and Capgemini style tests."
why: |
  If your spoken English is still growing, the verbal section may feel like the scariest part. Good news: **written** English questions follow **rules**, and rules can be learned like Java syntax.

  - Most error-spotting questions test a **small set of grammar rules** (subject-verb agreement, articles, prepositions, tenses).
  - Reading comprehension rewards a **method**, not fancy vocabulary.
  - Para jumbles are **logic puzzles** with sentences.

  And this is not only for tests. At work you will read requirements, write emails and comment code in English every day. Every rule you learn here makes you a clearer developer.
analogy: |
  Think of grammar rules as **traffic rules**.

  - You do not need to be a car mechanic to drive safely. You need to know: stop at red, keep left, give way at the roundabout.
  - Similarly, you do not need to be a poet to do well in verbal ability. You need about **15-20 common rules** and the habit of checking them.
  - An error-spotting question is like a traffic police check: look for the **usual violations** first (no helmet, no seatbelt), and you will catch most of them.
visual:
