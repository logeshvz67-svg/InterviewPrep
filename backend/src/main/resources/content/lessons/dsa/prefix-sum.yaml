companies: [INFOSYS_SP, INFOSYS_DSE, TCS, PRODUCT]
infosysRelevance: "Core for SP coding rounds: range-sum queries and 'count subarrays with sum k' are classic building blocks, and prefix sums often hide inside harder problems."
otherCompanies: "Common in TCS coding questions (equilibrium index, range sums) and very common in product-company interviews (subarray sum equals k)."
why: |
  Suppose someone asks you **many** questions like "what is the sum from index 2 to index 6?" on the same array. Adding the numbers every time costs O(n) per question. With 10^5 questions on 10^5 numbers, that is 10^10 steps: too slow.

  A **prefix sum** array is a running total. You build it once in O(n), and then **any range sum is one subtraction: O(1)**.

  Combined with a **HashMap**, it also solves "count subarrays whose sum is exactly k", **even with negative numbers**, which sliding window cannot handle. This lesson covers both, plus the 2D version for grids.
analogy: |
  Think of the **odometer** in a bus (the meter showing total kilometres travelled since the start).

  At each town, the conductor writes down the odometer reading:
  Start 0, Salem 160, Erode 225, Tiruppur 275, Coimbatore 325.

  How far is it from Erode to Coimbatore? You don't add up every small road. You just subtract two readings: **325 - 225 = 100 km**.

  The prefix sum array is that list of odometer readings, and every range sum is "reading at the end minus reading at the start".
