infosysRelevance: "Core for SP and DSE preparation: reverse a list, find the middle, detect a cycle and merge two sorted lists are classic pointer-manipulation questions in coding and technical rounds."
otherCompanies: "A standard topic for TCS technical interviews (reverse a linked list is a very common basic question) and for product-company interviews (cycle detection, remove nth from end, merge k lists)."
why: |
  A **linked list** is a chain of small boxes called **nodes**. Each node holds a value and an **arrow** (a reference) to the next node. Unlike an array, the nodes are not side by side in memory, so you cannot jump to "index 5". You must walk from the start.

  Interviewers love linked lists because they test one skill very directly: **can you change references without losing anything?** One wrong line and half the list is gone, or the program loops forever.

  The good news: almost every linked list question uses only **four tricks**:
  - the **prev / cur / next** walk (reverse),
  - **slow and fast pointers** (middle, cycle, nth from end),
  - a **dummy node** (so the head is not a special case),
  - a **tail pointer** (to build a new list, like in merge).

  Learn these four and the whole topic becomes calm and predictable.
analogy: |
  Think of a **treasure hunt** at a college fest. Each clue card has a prize (the value) and tells you where the **next** card is hidden (the reference). The organiser only gives you the **first** card (the head).

  - To reach the 5th card, you must follow cards 1, 2, 3, 4. No shortcuts. That is why access by position is **O(n)**.
  - To **reverse** the hunt, you rewrite each card to point to the **previous** location. But before you rub out the old "next" location, you must **write it down somewhere**, or you will never find the rest of the cards. That "write it down" step is the `next` variable in the code.
  - If someone hides a card that points back to an earlier card, the hunt goes in circles forever. That is a **cycle**.
