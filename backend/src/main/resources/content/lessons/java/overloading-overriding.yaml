    public class Main {
        public static void main(String[] args) {
            Parent obj = new Child();
            obj.greet();
            obj.hello();
        }
    }

    class Parent {
        void greet() { System.out.println("Parent greet"); }
        static void hello() { System.out.println("Parent hello"); }
    }

    class Child extends Parent {
        @Override
        void greet() { System.out.println("Child greet"); }
        static void hello() { System.out.println("Child hello"); }
