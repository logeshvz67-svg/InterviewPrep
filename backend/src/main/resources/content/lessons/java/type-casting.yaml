  modelAnswer: |
    Casting means changing a value's type. Widening is going from a small type to a bigger one, like int to double. It is like pouring a small glass into a big jug, nothing spills, so Java does it automatically. Narrowing is the opposite, like double to int. Something can be lost, so I must write the cast myself, and the decimals are cut off, not rounded. For an average, if the sum and count are both ints, sum divided by count gives a whole number. So I write (double) sum / count, casting before the division, to get the correct decimal answer. Also, byte, short and char become int inside expressions.
flashcards:
