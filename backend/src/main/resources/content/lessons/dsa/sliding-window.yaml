commonMistakes:
  - "Recomputing the whole window sum on every step (O(n*k)) instead of add-new, subtract-old."
  - "Off-by-one in window length: it is right - left + 1, not right - left."
  - "In longest-unique-substring, writing left = lastSeen.get(c) + 1 without Math.max, so left jumps backwards (fails on \"abba\")."
  - "Using a variable window for sums when the array has negative numbers; shrinking no longer guarantees a smaller sum. Use prefix sums + HashMap."
  - "Using sliding window for subsequence problems. Windows are only for continuous subarrays/substrings."
interviewBox:
  why: "Why interviewers ask this: sliding window shows you can turn nested loops over subarrays into one pass, a key optimisation skill."
  questions:
    - q: "What is the sliding window technique?"
      a: "It's a way to process continuous subarrays or substrings efficiently. I keep a window between two indexes, left and right. When it slides, I add the element entering and remove the element leaving, instead of recomputing the whole window. That turns O(n times k) or O(n squared) into O(n)."
    - q: "How do you find the longest substring without repeating characters?"
      a: "I use a variable window with a HashMap storing the last index of each character. I move right one step at a time. If the character was already seen inside the window, I move left to one past its last position, using max so left never goes backwards. After each step, the window length right minus left plus one is a candidate for the answer. It's O(n)."
    - q: "There is a while loop inside a for loop. Why is the variable window still O(n)?"
      a: "Because left only moves forward and never more than n times in total. Each element is added once when right reaches it and removed at most once when left passes it, so the total work is at most 2n steps, which is O(n)."
    - q: "When can't you use sliding window?"
      a: "When the elements aren't continuous, like subsequences, or when shrinking the window doesn't move the condition in one direction, for example sum problems with negative numbers. For subarray sum equals k with negatives, I use prefix sums with a HashMap instead."
