commonMistakes:
  - "Using opposite-end two pointers on an UNSORTED array. The skip logic only works when the array is sorted."
  - "Writing while (left <= right) for pair problems; when left == right you'd pair an element with itself."
  - "Forgetting to move a pointer inside the loop, causing an infinite loop."
  - "In remove duplicates, returning slow instead of slow + 1 (slow is an index, the count is one more)."
  - "Reversing with for (i = 0; i < n; i++) swap(i, n-1-i): it swaps everything twice and the array ends up unchanged. Stop at the middle."
interviewBox:
  why: "Why interviewers ask this: two pointers turns many O(n^2) brute-force solutions into O(n) with O(1) space; it shows you can optimise, not just solve."
  questions:
    - q: "How do you find a pair with a given sum in a sorted array?"
      a: "I use two pointers, one at the start and one at the end. If the sum is equal to the target, I return the pair. If it's smaller, I move the left pointer right to get a bigger number; if it's bigger, I move the right pointer left. Because the array is sorted, each move safely discards one element, so it's O(n) time and O(1) space."
    - q: "Why does the two pointer approach need a sorted array for pair sum?"
      a: "The decision to move left or right depends on order. If the sum is too small, I know every pair using the current left element with anything up to the right pointer is also too small, only because the array is sorted. Without sorting, I can't discard elements safely, so I'd use a HashMap instead."
    - q: "How do you remove duplicates from a sorted array in place?"
      a: "I use a slow and a fast pointer. The slow one marks the last unique value I kept, and the fast one scans the array. Whenever fast finds a value different from the value at slow, I move slow forward and copy that value there. At the end, slow plus one is the number of unique elements. It's O(n) time, O(1) space."
    - q: "What are the two types of two pointer technique?"
      a: "Opposite ends, where pointers start at both ends and move towards each other, used for pair sums, reversing and palindromes. And same direction, or slow and fast, where both move forward at different speeds, used for removing duplicates, moving zeros and merging sorted arrays."
