    STEP                         1st new      2nd new
    ---------------------------  -----------  -----------
    1. Parent static block       P-S          (skipped)
    2. Child static block        C-S          (skipped)
    3. Parent instance block     P-I          P-I
    4. Parent constructor body   P-C          P-C
    5. Child instance block      C-I          C-I
    6. Child constructor body    C-C          C-C

    Statics: parent -> child, ONCE per class.
    Per object: (parent block + ctor) -> (child block + ctor).
  caption: "Static blocks run once per class, parent before child. Every new object then runs parent instance block + constructor, then child instance block + constructor."
