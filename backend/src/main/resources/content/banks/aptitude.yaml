- id: apt-064
  section: VERBAL
  topic: Sentence Correction
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: Choose the correct sentence.
  options: [He not know the answer., He doesn't know the answer., He doesn't knows the answer., He don't know the answer.]
  answer: 1
  explanation: 'With he, she or it we use ''does not'' (doesn''t). After doesn''t, the verb stays in base form: ''know'',
    not ''knows''. So ''He doesn''t know the answer.'' is correct.'
- id: apt-065
  section: VERBAL
  topic: Sentence Correction
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: Choose the grammatically correct sentence.
  options: [Each of the students have submitted the assignment., Each of the students were submitted the assignment., Each
      of the students has submitted the assignment., Each of the student has submitted the assignment.]
  answer: 2
  explanation: '''Each'' is singular, so it takes the singular verb ''has''. After ''each of the'', the noun is plural: ''students''.
    So ''Each of the students has submitted the assignment.'' is correct.'
- id: apt-066
  section: VERBAL
  topic: Sentence Correction
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: Choose the correct sentence.
  options: [I work here since 2020., I was working here since 2020., I am working here since 2020., I have been working here
      since 2020.]
  answer: 3
  explanation: 'When an action started in the past and is still going on, with ''since'' or ''for'', we use the present perfect
    continuous: ''have been working''. ''I am working here since 2020'' is a common mistake.'
- id: apt-067
  section: VERBAL
  topic: Error Spotting
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO]
  question: 'Find the part of the sentence that has an error: (A) Neither the manager / (B) nor the team members / (C) was
    present / (D) at the meeting.'
  options: [A, B, C, D]
  answer: 2
  explanation: With 'neither ... nor', the verb agrees with the subject closest to it. The closest subject is 'team members',
    which is plural. So it should be 'were present', not 'was present'. The error is in part C.
