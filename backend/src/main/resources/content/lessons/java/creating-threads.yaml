companies: [ALL]
infosysRelevance: "Common comparison question in SP and DSE technical rounds; also needed to read any multithreaded code snippet."
otherCompanies: "A very common basic question at TCS, Wipro, Cognizant, Accenture, Capgemini, and a warm-up in product-company interviews."
why: |
  Knowing *what* a thread is (previous lesson) is not enough. You must know **how to create one** in code.

  Java gives you three common ways:
  1. **Extend the `Thread` class**
  2. **Implement the `Runnable` interface**
  3. **Implement the `Callable` interface** (when you need a result back)

  Interviewers ask **"Which way is better and why?"** and the famous trick: **"What is the difference between calling `start()` and `run()`?"** Both answers show whether you really understand what creates a new thread.
analogy: |
  Think of **ordering food at home**.

  - **Runnable** is a *task slip*: "Deliver this parcel." The delivery boy goes, does it, and does not bring anything back.
  - **Callable** is a task slip with a *return*: "Go to the shop and bring back the change." You get something back later.
  - **Future** is the *token number* the shop gives you. You can come back with the token and ask, "Is my order ready? Give it to me" (`get()`).
  - **Extending Thread** is like *becoming* a delivery boy yourself just to deliver one parcel. It works, but you lose the chance to be anything else (Java allows only one parent class).
  - Calling **`run()` directly** is doing the delivery *yourself* instead of sending the boy. Nothing happens in parallel.
