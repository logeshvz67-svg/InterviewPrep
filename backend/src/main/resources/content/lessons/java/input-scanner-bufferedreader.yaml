infosysRelevance: "Essential for timed coding tests: SP-level problems often have large inputs, and slow or buggy input reading can cause time-limit or wrong-answer verdicts even with correct logic."
otherCompanies: "Every online coding round (TCS, Wipro, Cognizant, Accenture, Capgemini) reads from standard input. The Scanner nextInt/nextLine trap is a very common reason for failing sample test cases."
why: |
  In an online coding test, your program does not get values from variables you type. It reads them from **standard input** (stdin): the text the platform feeds into your program, just as if someone typed it on the keyboard.

  Two things can go wrong even when your logic is perfect:
  1. **Wrong reading:** the famous `nextInt()` then `nextLine()` trap gives you an empty string, so names or sentences come out blank.
  2. **Slow reading:** `Scanner` is easy but slow. With 10^5 or 10^6 numbers, it can push you past the **time limit** (TLE, "Time Limit Exceeded"). `BufferedReader` with `StringTokenizer` is several times faster.

  This lesson gives you a safe, fast **input template** you can type from memory in under a minute.
analogy: |
  Think of **getting water from a well**.

  - **Scanner** is like pulling up **one small cup at a time** and checking each cup carefully (is it a number? is it a word?). Easy and safe, but slow if you need a thousand cups.
  - **BufferedReader** is like pulling up a **whole bucket** (a full line, from a big buffer in memory) in one go. Then **StringTokenizer** or `split` pours it into separate cups yourself. Much faster.
  - The **nextLine trap**: after Scanner takes the number `21` from a line, the **newline** (the "Enter" key) is still sitting in the bucket. The next `nextLine()` happily grabs just that leftover newline and returns an empty string.
visual:
  diagram: |
    INPUT TEXT:   "21\nRavi Kumar\n"

    Scanner sc = new Scanner(System.in);
    sc.nextInt()    reads 21          ->  2 1 [\n] R a v i ...
                                               ^ cursor stops here
    sc.nextLine()   reads up to \n    ->  ""   (empty! the trap)
    sc.nextLine()   reads next line   ->  "Ravi Kumar"

    BufferedReader + StringTokenizer (fast):
    +------------+   readLine()   +-------------+  nextToken()  +-----+
    | stdin      | -------------> | "5 8 2 9 1" | ------------> | "5" |
    | (buffered) |  whole line    +-------------+  one by one   +-----+
    +------------+                                     |
                                     Integer.parseInt("5") -> 5
  caption: "Scanner reads token by token and leaves the newline behind after nextInt. BufferedReader reads whole lines that you split yourself, which is much faster."
