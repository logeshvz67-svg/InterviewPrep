infosysRelevance: "Tricky output questions on finally are good practice for SP and DSE MCQ-style and technical rounds; tracing them builds the habit of reading code line by line."
otherCompanies: "Product companies like these as depth questions; service companies use simpler versions as 'predict the output' MCQs."
why: |
  You already know "finally always runs". Interviewers know you know it, so they ask the **edge cases**:
  - What if both `try` and `finally` have a `return`?
  - If `finally` changes a variable after `return x`, does the returned value change?
  - Does `finally` run after `System.exit(0)`?
  - What happens to an exception when `finally` returns or throws?
  - Which catch orders don't even compile?

  These questions look scary, but each has **one clear rule**. Learn the five rules here and you can trace any of them calmly, step by step. They also teach real-world lessons: **never return from finally** and **never swallow exceptions**.
analogy: |
  Think of a **school exam hall**.

  - The student writes an answer and walks to the desk to **submit** (that's `return` in try). The answer sheet is now **photocopied** and kept.
  - Before leaving, the **invigilator always checks the hall ticket** (that's `finally`). It always happens.
  - If the invigilator **scribbles on the student's rough notes** (changes a local variable), the photocopied answer doesn't change.
  - But if the invigilator says **"Ignore that sheet, submit THIS one instead"** (return in finally), the original answer is thrown away.
  - And if the **building's power goes off and everyone goes home** (`System.exit`), the hall-ticket check never happens at all.
