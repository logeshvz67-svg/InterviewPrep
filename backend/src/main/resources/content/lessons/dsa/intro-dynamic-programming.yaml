  explanation: |
    This is climbing stairs: `dp[i]` = number of ways to reach step i using 1-step or 2-step moves. Each cell is the sum of the two before it: 1+1=2, 1+2=3, 2+3=5, 3+5=8, 5+8=13. So there are 13 ways to climb 6 stairs. The array has n + 1 = 7 cells because index 0 is "standing at the bottom".
commonMistakes:
  - "Starting to code before writing the state in one plain sentence; most DP bugs are a fuzzy state."
  - "Wrong or missing base cases (e.g. dp[0] = 0 instead of 1 for counting ways)."
  - "Filling the table in an order where dp[i] needs a value not computed yet."
  - "For LIS, returning dp[n-1] instead of the maximum of all dp[i]."
  - "In 1D 0/1 knapsack, looping capacity from low to high, which lets the same item be used many times."
  - "Using int for fast-growing counts (Fibonacci, number of ways) and overflowing; use long or the modulo the problem gives."
interviewBox:
  why: "Why interviewers ask this: DP shows whether you can break a problem into subproblems, define a clear state and turn exponential brute force into polynomial time."
  questions:
    - q: "What is dynamic programming?"
      a: "Dynamic programming is a way to solve problems that have overlapping subproblems and optimal substructure. Instead of solving the same small problem again and again like plain recursion, I solve each subproblem once and store the answer, either in a memo with recursion, which is top-down, or in a table with loops, which is bottom-up. For example, Fibonacci goes from O(2 to the n) to O(n)."
    - q: "What is the difference between memoization and tabulation?"
      a: "Memoization is top-down: I write the recursive solution and cache each result the first time I compute it. It only computes the states it needs, but deep recursion can overflow the stack. Tabulation is bottom-up: I fill a table from the base cases upward with loops. It has no recursion overhead and often lets me reduce space to a few variables."
    - q: "How do you solve the house robber problem?"
      a: "Let dp of i be the most money from the first i houses. At each house I have two choices: skip it, which gives dp of i minus 1, or rob it, which gives dp of i minus 2 plus its money, because I can't rob the neighbour. I take the maximum. Since I only need the last two values, it's O(n) time and O(1) space."
    - q: "How do you decide the DP state for a new problem?"
      a: "I ask what smaller answers would let me finish the problem with one more decision. Usually it's something like the answer for the first i items, or the answer ending at index i, or with capacity j. I write the meaning in one sentence, then write the recurrence based on the last choice, then the base cases, and I check it on a tiny example by hand."
