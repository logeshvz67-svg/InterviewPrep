infosysRelevance: "Comparable vs Comparator is a top comparison question for SP and DSE; custom sorting also appears constantly in coding rounds."
otherCompanies: "A very common basic question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies expect fluent Comparator.comparing chains."
why: |
  Two everyday coding needs:
  1. **Remove items while looping** over a list ("remove all failed students"). Done wrongly, it crashes with `ConcurrentModificationException`.
  2. **Sort objects your own way** ("sort employees by salary, highest first, then by name"). Numbers and Strings sort themselves, but Java has no idea how to sort your `Student` class.

  The tools for these are **`Iterator`**, **`Comparable`** and **`Comparator`**. "Comparable vs Comparator" is one of the most asked Java comparison questions, and modern `Comparator.comparing(...)` chains make your coding answers short and clean.
analogy: |
  **Iterator** is like a **bus conductor** walking down the aisle checking tickets one by one. If a passenger must get off, the conductor himself says "you, out" (`iterator.remove()`), and keeps track of his position. If someone else pushes a passenger out behind his back (`list.remove()`), the conductor loses count and stops in confusion (the exception).

  **Comparable vs Comparator** is like ranking **cricket players**:
  - **Comparable** is the player's **own default ranking** printed on the team sheet, say by jersey number. One natural order, built into the player.
  - **Comparator** is a **selector's custom ranking**: today by runs, tomorrow by strike rate, next week by age. Many orders, written outside the player.
