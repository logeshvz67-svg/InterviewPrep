infosysRelevance: "Infosys-style practice: SP and DSE hiring usually ends in face-to-face rounds where clear thinking and clear speaking matter as much as code. This lesson sets up your practice system for them."
otherCompanies: "Every service and product company interviews in rounds (online test, technical, HR, sometimes managerial). The same practice loop works for TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  An interview is a **skill**, like riding a bike. You do not get good at it by reading about it. You get good by **doing it many times in a safe place** and fixing one small thing each time.

  You already know a lot of Java. But many people with good knowledge fail interviews because:
  - they freeze when a real person asks the question,
  - they speak in long, confusing sentences,
  - they never practised saying the answer **out loud**.

  A **mock interview** (a practice interview that does not count) fixes this. It lets you make mistakes where mistakes are free.

  You are switching from a non-technical job to development. That is a **strength**, not a weakness: you have real work experience, deadlines and teamwork stories. This world teaches you how to show that clearly, even if your spoken English is still growing.
analogy: |
  Think of a **cricket net session**.

  - A batter does not wait for the real match to face fast bowling. They go to the **nets** and face hundreds of balls.
  - In the nets, getting out costs nothing. The coach says "your head moved", the batter fixes **one** thing, and faces the next ball.
  - On match day, the body already knows what to do.

  In Code Quest:
  - The **Mock interview boss fight** is your net session for speaking.
  - The **Mock tests** tab is your practice match for the written / online test.
  - The **Interview diary** is the coach's notebook: what went wrong and what to fix.
