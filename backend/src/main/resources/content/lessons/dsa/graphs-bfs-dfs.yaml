infosysRelevance: "Important for SP preparation: grid and graph problems (number of islands, shortest path in an unweighted grid, dependency ordering) are a common source of medium and hard coding questions."
otherCompanies: "Product-company interviews use BFS/DFS constantly (islands, rotting oranges, word ladder, course schedule, clone graph). Service-company rounds mostly ask basic BFS/DFS traversal and representation questions."
why: |
  A **graph** is a set of things (called **vertices** or **nodes**) connected by links (called **edges**). Graphs are everywhere:
  - cities and roads (Google Maps),
  - people and friendships (Instagram followers),
  - courses and prerequisites ("take DSA before Algorithms"),
  - a grid of land and water cells in a puzzle.

  Trees and linked lists are actually special graphs. So once you learn **BFS** (Breadth-First Search) and **DFS** (Depth-First Search), you have two master keys that open a huge family of problems: connectivity, shortest path in unweighted graphs, counting islands, detecting cycles, and ordering tasks with dependencies.

  The code templates are short. The real skill is **modelling**: seeing that "a grid of '1's and '0's" or "a list of course prerequisites" is a graph, and then choosing BFS or DFS.
analogy: |
  Imagine news spreading in your **college WhatsApp groups**.

  - **BFS** is like a rumour spreading in **waves**: first everyone directly in your group hears it (distance 1), then their contacts (distance 2), and so on. That's why BFS naturally finds the **minimum number of hops** to reach someone.
  - **DFS** is like exploring a **maze in a temple fair**: keep walking down one path as deep as possible; when you hit a dead end, come back to the last junction and try the next path. Good for "explore everything connected to me" and for detecting loops.

  In both cases you must remember **who already heard the news** (a `visited` set), or the same message bounces around forever.
