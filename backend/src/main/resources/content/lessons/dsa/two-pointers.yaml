companies: [INFOSYS_SP, INFOSYS_DSE, TCS, PRODUCT, ALL]
infosysRelevance: "Core for SP and DSE coding rounds: many array and string problems (pair sums, duplicates, palindromes, reversing) become O(n) with two pointers."
otherCompanies: "A must-know pattern for TCS coding questions and for product-company interviews (pair sum, remove duplicates, container with most water, 3-sum)."
why: |
  Many array and string problems have an obvious **brute-force** solution: try every pair with two nested loops. That is **O(n^2)**, and it times out for big inputs.

  The **two pointers** pattern uses two index variables that move through the array **intelligently**, so each element is visited about once: **O(n)** time and **O(1)** extra space.

  It is one of the most common patterns in coding rounds: pair with a given sum, remove duplicates, reverse, palindrome check, merging two sorted arrays, moving zeros, 3-sum. Learn the two templates here and you can solve all of them.
analogy: |
  Think of **two people searching for a pair of shoes** in a long rack sorted by price, cheapest on the left, costliest on the right. They want two pairs that cost exactly Rs. 1500 together.

  - One person stands at the **cheap end**, the other at the **expensive end**.
  - If the two prices add up to **more** than 1500, the expensive-end person steps **left** (to something cheaper).
  - If they add up to **less**, the cheap-end person steps **right** (to something costlier).
  - They walk towards each other and **never need to go back**. That is why it's fast.

  The second variant is like a **slow reader and a fast reader** walking the same direction: the fast one scouts ahead, and the slow one writes down only what's worth keeping.
