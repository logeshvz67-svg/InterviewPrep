infosysRelevance: "Needed for most string coding problems in SP and DSE coding rounds; substring/indexOf/split/compareTo are also frequent in output MCQs."
otherCompanies: "Used in string coding questions everywhere: TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  Almost every string coding problem uses the same 10-15 methods: `charAt`, `length`, `substring`, `indexOf`, `split`, `toCharArray` and friends. If you know them well, you can write solutions quickly without searching.

  Output questions also love the small details:
  - Does `substring(1, 4)` include index 4? (No.)
  - What does `compareTo` really return? (A number, not just -1/0/1.)
  - Why does `"a.b".split(".")` give an empty array?

  This lesson is your **toolbox**. Learn the rules once, and they work everywhere.
analogy: |
  Think of a String as a **row of numbered seats in a cinema**, starting from seat **0**.

  - `charAt(3)` = "who is sitting in seat 3?"
  - `length()` = "how many seats in this row?"
  - `substring(2, 5)` = "give me seats 2, 3 and 4" (the end seat number is where you **stop**, you don't take it).
  - `indexOf('k')` = "which seat is the first person named k sitting in?" (-1 if nobody).
  - `split(",")` = "break the row into groups wherever there is an empty seat marked ','".
