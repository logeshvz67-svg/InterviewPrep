  - id: q4
    type: TRUE_FALSE
    prompt: "Collections.sort(list) is a static method of the Collection interface."
    options: ["True", "False"]
    answer: 1
    explanation: "False. sort is a static method of the Collections utility class (with an s). Collection without s is the root interface."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Fill in the Set class that removes duplicates but keeps insertion order."
    code: |
      Set<String> visited = new ____<>();
      visited.add("Delhi"); visited.add("Pune"); visited.add("Delhi");
      System.out.println(visited);   // [Delhi, Pune]
    acceptedAnswers: ["LinkedHashSet", "java.util.LinkedHashSet"]
    explanation: "LinkedHashSet keeps insertion order. HashSet gives no order guarantee, and TreeSet would sort (here also Delhi, Pune, but by alphabet, not by insertion)."
  - id: q6
    type: SPOT_THE_BUG
    prompt: "Why does this code not compile?"
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              List<String> names = new List<>();
              names.add("Asha");
              System.out.println(names);
          }
      }
    options:
      - "List needs a size in the constructor"
      - "List is an interface; you must create a class like new ArrayList<>()"
      - "add is not a List method"
      - "names must be declared as ArrayList"
    answer: 1
    explanation: "Interfaces can't be instantiated. Declare by the interface but create a real class: List<String> names = new ArrayList<>(). Declaring the variable as List is good practice, so the last option is wrong."
  - id: q7
    type: MCQ
    prompt: "Which statement about List and Set is correct?"
    code: null
    options:
      - "Both allow duplicates"
      - "List allows duplicates and has indexes; Set does not allow duplicates"
      - "Set keeps elements sorted always"
      - "List does not keep insertion order"
    answer: 1
    explanation: "List is ordered, indexed and allows duplicates. Set rejects duplicates. Only TreeSet sorts; HashSet has no order and LinkedHashSet keeps insertion order."
explainBack:
  prompt: "Explain the Java Collections hierarchy to a friend and how to choose between List, Set, Queue and Map."
  rubric:
    - "I said Iterable -> Collection -> List, Set, Queue"
    - "I said Map is separate (key-value pairs) and explained why"
    - "I named at least one class for each type"
    - "I explained how to choose (duplicates? order? lookup by key? FIFO?)"
    - "I mentioned Collection vs Collections"
  modelAnswer: |
    Java's collections are a family tree. At the top is Iterable, so we can loop over things, then Collection. Under it are List, which is ordered with indexes and allows duplicates, like ArrayList; Set, which allows no duplicates, like HashSet, LinkedHashSet or TreeSet; and Queue, a waiting line, like ArrayDeque or PriorityQueue. Map is separate because it stores pairs, a key and a value, like a PNR number and its booking; HashMap is the common one. To choose, I ask: do I need duplicates and positions? List. Uniqueness? Set. Lookup by key? Map. First come first served? Queue. And Collections with an s is just a helper class with sort and reverse.
flashcards:
  - front: "Top of the Collections hierarchy"
    back: "Iterable -> Collection -> List / Set / Queue (Deque under Queue). Map is separate."
  - front: "List vs Set vs Map"
    back: "List: ordered, indexed, duplicates OK. Set: unique. Map: unique keys -> values."
  - front: "HashSet vs LinkedHashSet vs TreeSet order"
    back: "No guaranteed order / insertion order / sorted order."
  - front: "Collection vs Collections"
    back: "Collection = root interface. Collections = utility class with static methods (sort, reverse, max...)."
  - front: "Why declare 'List<String> x = new ArrayList<>()'?"
    back: "Programming to an interface: you can switch implementation later without changing other code."
keyTakeaways:
  - "Iterable -> Collection -> List, Set, Queue; Deque extends Queue."
  - "Map is a separate hierarchy of key-value pairs, not a Collection."
  - "List = order + index + duplicates; Set = unique; Queue = waiting line; Map = lookup by key."
  - "Hash* = no order, LinkedHash* = insertion order, Tree* = sorted."
  - "Collection is an interface; Collections is a utility class."
  - "Declare by interface, create by class: List<String> x = new ArrayList<>()."
