explanation: |
  ### Two words you need first
  - A method's **signature** is its **name + parameter list** (number, types and order of parameters). The return type is **not** part of the signature.
  - **Compile time** is when `javac` checks your code. **Run time** is when the JVM actually runs it.

  ### Overloading
  **Overloading** = the **same method name** with **different parameter lists**, usually in the same class.
  ```java
  class Calc {
      int add(int a, int b)            { return a + b; }
      int add(int a, int b, int c)     { return a + b + c; }
      double add(double a, double b)   { return a + b; }
  }
  ```
  The **compiler** chooses which one to call by looking at the arguments. That's why overloading is called **compile-time polymorphism** (or static binding).

  Ways to overload: change the **number** of parameters, their **types**, or their **order** (`f(int, String)` vs `f(String, int)`).

  Changing **only the return type is not overloading**; it's a compile error, because a call like `add(2, 3)` wouldn't tell the compiler which one you mean.

  ### Overriding
  **Overriding** = a **child class** gives its own body for a method that it inherited, with the **same signature**.
  ```java
  class Animal { void sound() { System.out.println("..."); } }
  class Dog extends Animal {
      @Override
      void sound() { System.out.println("Woof"); }
  }
  ```
  `@Override` is an **annotation** (a label for the compiler). It's optional, but if you misspell the method or change a parameter, the compiler shouts. Always use it.

  Which version runs is decided at **run time** by the **actual object**, not the variable type. That's **runtime polymorphism** (dynamic binding).

  ### The full rules table
  | Rule | Overloading | Overriding |
  |---|---|---|
  | Where | Same class (or parent + child) | Parent and child only |
  | Method name | Same | Same |
  | Parameter list | **Must differ** | **Must be identical** |
  | Return type | Anything (but can't be the *only* difference) | Same, or a **subtype** for objects (**covariant return**). For primitives: exactly the same |
  | Access modifier | Anything | Same or **wider** (never weaker). `protected` -> `public` OK; `public` -> `protected` error |
  | Checked exceptions | Anything | Same, a **subclass**, fewer, or none. **Never new or broader** checked exceptions |
  | Unchecked exceptions | Anything | Anything |
  | `static` methods | Can be overloaded | **Not overridden; they are hidden** |
  | `private` methods | Can be overloaded | Not overridden (child can't see them) |
  | `final` methods | Can be overloaded | **Cannot** be overridden |
  | Constructors | Can be overloaded | Cannot be overridden (not inherited) |
  | Decided at | Compile time | Run time |
  | Also called | Static / compile-time polymorphism | Dynamic / runtime polymorphism |

  Access order from narrow to wide: `private` < default < `protected` < `public`.

  A **checked exception** is one the compiler forces you to handle (like `IOException`). An **unchecked exception** is a `RuntimeException` (like `NullPointerException`) that the compiler doesn't force you to handle.

  Why "same or wider" and "no broader exceptions"? Because code written for the parent must still work with a child object. If the parent promised "I'm public and I only throw `IOException`", the child can't break that promise.

  ### Static methods: hiding, not overriding
  ```java
  class P { static void hi() { System.out.println("P hi"); } }
  class C extends P { static void hi() { System.out.println("C hi"); } }

  P obj = new C();
  obj.hi();      // prints "P hi"
  ```
  Static methods belong to the **class**, not the object. The compiler picks the version from the **variable's type** (`P`), not the real object. This is called **method hiding**. Also:
  - A child **instance** method can't have the same signature as a parent **static** method (compile error), and vice versa.

  ### Overloading tricks
  - **Can `main` be overloaded?** Yes. But the JVM only starts from `public static void main(String[] args)`.
  - **Can `main` be overridden?** No, it's static, so it can only be hidden.
  - **Which overload wins?** The compiler tries, in order: exact match -> **widening** (`int` to `long`) -> **boxing** (`int` to `Integer`) -> **varargs** (`int...`).
  ```java
  static void f(long x)     { System.out.println("long"); }
  static void f(Integer x)  { System.out.println("Integer"); }
  static void f(int... x)   { System.out.println("varargs"); }
  f(5);   // "long": widening beats boxing and varargs
  ```
tinyCode:
  code: |
    public class Main {
        public static void main(String[] args) {
            Printer p = new Printer();
            p.print(10);
            p.print("Hi");
            p.print(3, 4);

            Animal a = new Dog();
            a.sound();
        }
    }

    class Printer {
        void print(int x)        { System.out.println("int: " + x); }
        void print(String s)     { System.out.println("String: " + s); }
        void print(int x, int y) { System.out.println("two ints: " + (x + y)); }
    }

    class Animal {
        void sound() { System.out.println("Some sound"); }
    }

    class Dog extends Animal {
        @Override
        void sound() { System.out.println("Woof"); }
    }
  walkthrough: |
    - `Printer` has three methods all named `print`. That's **overloading**.
    - `p.print(10)` has one `int` argument, so the compiler picks `print(int)`. `p.print("Hi")` picks `print(String)`. `p.print(3, 4)` picks the two-parameter version and prints 7.
    - `Dog` re-writes `sound()` with the same signature: **overriding**. `@Override` asks the compiler to double-check that.
    - `Animal a = new Dog();` The variable type is Animal, but the real object is a Dog. At run time the JVM calls Dog's `sound()`, printing **Woof**.

    Output:
    ```
    int: 10
    String: Hi
    two ints: 7
    Woof
    ```
tryIt:
  instructions: "Type this to see overriding vs static hiding side by side. Predict both lines first. Then remove the word static from both hello() methods and run again: what changes and why?"
