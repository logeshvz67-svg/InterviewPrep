commonMistakes:
  - "Starting with technology names instead of the problem. Begin with why the project exists."
  - "Saying 'we did everything'. Use 'I' and name 2-3 things you personally built."
  - "Claiming parts you cannot explain. Any file you mention, be ready to explain."
  - "Having no challenge story. Prepare two real STAR stories in advance."
  - "Saying the project is perfect. Honest improvements show maturity."
  - "Talking for 10 minutes. Keep the first answer around 2 minutes, then let them ask."
interviewBox:
  why: "Why interviewers ask this: a project shows whether you can build something real and whether you understand it. For a career switcher, it is often the strongest evidence you have."
  questions:
    - q: "Explain your project. (practice question)"
      a: "I built Code Quest, a web app to prepare for Java interviews, because I kept forgetting what I studied. The frontend is React with TypeScript; the backend is Spring Boot with controller, service and repository layers; data is stored in PostgreSQL. I built the lesson and quiz APIs and the server-side XP logic. One challenge was that XP could be faked when it was calculated in the browser, so I moved it to the server. Next, I would add more automated tests."
    - q: "Why did you use JWT for login? (practice question)"
      a: "JWT is a signed token. After login, the server gives the browser a token, and the browser sends it with every request. The server checks the signature, so it doesn't need to store sessions. That keeps the backend simple and works well for a REST API with a separate frontend."
    - q: "What would you improve in your project? (practice question)"
      a: "I would add more automated tests, especially for the frontend, because now I test some screens manually. I would also add caching for lesson content so pages load faster."
    - q: "How do you make sure one user cannot see another user's data? (practice question)"
      a: "On the server, every database query is filtered by the logged-in user's id, which comes from the verified JWT, not from the request body. So even if someone changes an id in the URL, they only get their own data."
quiz:
  - id: q1
    type: MCQ
    prompt: "What should the FIRST part of a project explanation be?"
    code: null
    options: ["The list of technologies", "The problem it solves and for whom", "The hardest bug", "The number of lines of code"]
    answer: 1
    explanation: "Start with the problem so the listener understands why the project exists. Technology names first sound like a list without meaning; the bug story comes later."
  - id: q2
    type: MATCH
    prompt: "Match each Spring Boot layer to its job"
    pairs:
      - left: "Controller"
        right: "Receives HTTP requests and returns responses"
      - left: "Service"
        right: "Holds business logic, like calculating XP"
      - left: "Repository"
        right: "Reads and writes the database using JPA"
      - left: "Flyway migration"
        right: "Versioned SQL script that creates or changes tables"
    explanation: "Controller = entry door, service = brain, repository = database helper. Flyway keeps the database schema the same in every environment."
  - id: q3
    type: TRUE_FALSE
    prompt: "In the 'My role' part you should say 'we' so you sound like a team player."
    options: ["True", "False"]
    answer: 1
    explanation: "False. The interviewer wants to know what YOU did. Say 'I built...' for your work. You can mention the team elsewhere, but your role must be clear."
  - id: q4
    type: MCQ
    prompt: "In Code Quest, why was XP calculation moved from the browser to the server?"
    code: null
    options: ["To make the page look nicer", "Because anything in the browser can be changed by the user, so XP could be faked", "Because Java is faster than JavaScript", "Because the database requires it"]
    answer: 1
    explanation: "The browser is under the user's control: requests can be edited. Calculating XP only on the server makes it trustworthy. Speed and looks were not the reason."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Complete the STAR order used for the challenge story."
    code: |
      Situation -> Task -> ____ -> Result
    acceptedAnswers: ["Action"]
    explanation: "STAR = Situation, Task, Action, Result. Action is what YOU did; it is the most important part of the story."
  - id: q6
    type: TRUE_FALSE
    prompt: "Saying what you would improve in your project makes you look weak."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Honest improvements show you can judge your own work, a key skill for developers. Claiming a perfect project sounds unrealistic."
  - id: q7
    type: MCQ
    prompt: "How long should your first 'Explain your project' answer be?"
    code: null
    options: ["About 20 seconds", "About 2 minutes, then let them ask", "About 10 minutes", "Until they interrupt"]
    answer: 1
    explanation: "About 2 minutes covers all five parts. Too short hides your work; too long tires the interviewer and leaves no time for the follow-ups where you can shine."
explainBack:
  prompt: "Explain your project (Code Quest or your own) to a friend in about 2 minutes, using the 5 parts."
  rubric:
    - "I started with the problem"
    - "I explained the architecture: frontend, backend layers, database"
    - "I said clearly what I built myself using 'I'"
    - "I told one challenge with a result"
    - "I ended with one improvement"
  modelAnswer: |
    I built Code Quest, a web app to prepare for Java interviews, because I studied a lot but kept forgetting. It has lessons, quizzes, flashcards and mock interviews. The frontend is React with TypeScript. The backend is Spring Boot with three layers: controllers get the requests, services hold the logic, and repositories save data in PostgreSQL. Login uses JWT tokens. I built the lesson and quiz APIs and the XP logic. One challenge: XP was first calculated in the browser, so someone could fake it. I moved it to the server, and now it is safe. Next, I would add more automated tests.
flashcards:
  - front: "5 parts of a project answer"
    back: "Problem -> Architecture -> My role -> Challenge (STAR) -> Improvements. About 2 minutes."
  - front: "Spring Boot layers in one line each"
    back: "Controller: HTTP in/out. Service: business logic. Repository: database via JPA."
  - front: "Code Quest challenge story (XP)"
    back: "XP was computed in the browser and could be faked; I moved all XP logic to the server, so scores are trustworthy."
  - front: "How does JWT login work (short)?"
    back: "Server checks password hash, returns a signed token; browser sends it in the Authorization header; server verifies the signature each request."
keyTakeaways:
  - "Your project is your strongest proof as a career switcher."
  - "Use Problem, Architecture, My role, Challenge, Improvements, in about 2 minutes."
  - "Draw three boxes: frontend, backend (controller-service-repository), database."
  - "Say 'I' for your work, and only claim what you can explain."
  - "Prepare two STAR challenge stories and honest improvements."
