title: "System design: how to approach it"
version: 1
estimatedMinutes: 35
rebuild: true
patternCode: null
companies: [INFOSYS_SP, PRODUCT, ALL]
infosysRelevance: "Useful for SP technical interviews where design-basics questions can come up; the step-by-step structure keeps a fresher calm and organised."
otherCompanies: "Product companies often have a design round even for juniors; a clear approach matters more than knowing every tool name."
why: |
  A system design question sounds scary: **"Design IRCTC"**, **"Design Swiggy"**, **"Design a URL shortener"**. There is no single correct answer, and that is exactly the point.

  The interviewer is not checking whether you can build the real IRCTC in 45 minutes. They are checking:
  - **Do you ask questions** before jumping in? (Real engineers clarify first.)
  - **Can you break a big problem into small boxes** (client, server, database, cache)?
  - **Can you reason with numbers** ("about 2,000 requests per second")?
  - **Do you know trade-offs** ("a cache makes reads fast but data can be slightly old")?

  Freshers usually fail not because they lack knowledge, but because they **start drawing randomly and go silent**. A fixed, step-by-step template fixes that. Once you know the 7 steps in this lesson, every later lesson in this tower (caching, load balancing, queues...) simply plugs into one of the steps.

  If you finished the short "System design basics" lesson in the CS world, this tower goes deeper. If not, don't worry: we start from zero.
analogy: |
  Think of a **wedding caterer** visiting your family to plan a function.

  A good caterer does not walk in and start cooking. They ask, in order:
  1. **What do you need?** Lunch or dinner? Veg only? Sweets? *(functional requirements)*
  2. **How well must it work?** Food must be hot, no one should wait more than 10 minutes, it must not run out. *(non-functional requirements)*
  3. **How many guests?** 500 guests, 2 plates each, peak at 1 pm. *(back-of-the-envelope estimate)*
  4. **How will guests be served?** Buffet counters, token system. *(API: how users interact)*
  5. **What goes into stock?** Rice, dal, paneer, quantities. *(data model)*
  6. **Layout of the hall:** kitchen -> counters -> tables. *(high-level diagram)*
  7. **Special worries:** what if the gas runs out? Keep a backup cylinder. *(deep dives and trade-offs)*

  A system design interview is exactly this conversation, but about software. Follow the same order every time.
