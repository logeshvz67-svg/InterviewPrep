    Iterators while another change happens:
    fail-fast (ArrayList, HashMap)    fail-safe (CopyOnWriteArrayList)
    modCount 3 -> list.add -> 4       iterator reads a snapshot copy
    next(): expected 3, found 4       list.add makes a NEW array
    => ConcurrentModificationException loop continues, no exception
  caption: "Hashtable locks the whole map; ConcurrentHashMap locks only one bucket. Fail-fast iterators throw when the collection changes; fail-safe ones work on a copy or a weakly consistent view."
