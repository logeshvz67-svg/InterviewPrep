title: "Scalability, latency and availability"
version: 1
estimatedMinutes: 35
rebuild: true
patternCode: null
companies: [INFOSYS_SP, PRODUCT, ALL]
infosysRelevance: "Core vocabulary for any SP design-basics discussion: vertical vs horizontal scaling and 'what is a single point of failure' are classic warm-up questions."
otherCompanies: "Every product-company design round uses these words; service companies often ask the definitions in technical interviews."
why: |
  Every design discussion uses three words again and again: **scalability**, **latency** and **availability**. If you can explain them with numbers and examples, you sound like an engineer instead of a student reciting definitions.

  - When IRCTC slows down at 10 am tatkal, that is a **scalability** and **latency** problem.
  - When a UPI app shows "server unavailable, try later", that is an **availability** problem.
  - When one crashed database takes the whole app down, that is a **single point of failure**.

  This lesson gives you the words, the numbers (the famous "nines") and the one big trick that makes horizontal scaling possible: **stateless servers**.
analogy: |
  Think of a **railway ticket counter** at a busy station.

  - **Vertical scaling** = making the one clerk faster: a better computer, a faster printer. It helps, but one human has a limit, and if he goes for lunch, the counter is closed.
  - **Horizontal scaling** = opening **more counters** with more clerks. Ten counters serve ten queues at once, and if one clerk leaves, the others keep working.
  - **Latency** = how long *one* passenger waits at the counter (say 2 minutes).
  - **Throughput** = how many passengers *all counters together* serve per hour (say 300).
  - **Stateless** = any clerk can serve any passenger because all bookings are in the central computer, not in one clerk's notebook. If a clerk kept your booking in his personal notebook (stateful), you would have to come back to *that exact* counter.
