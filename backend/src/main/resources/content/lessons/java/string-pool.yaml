predict:
  code: |
    public class Predict {
        public static void main(String[] args) {
            String x = "java";
            String y = new String("java");
            String z = y;
            System.out.println(x == y);
            System.out.println(y == z);
            System.out.println(x.equals(z));
            System.out.println(x == z.intern());
        }
    }
  expectedOutput: |
    false
    true
    true
    true
  explanation: |
    - `x` points to the pool object; `y` points to a new heap object, so `x == y` is `false`.
    - `z = y` copies the arrow, so `y` and `z` are the same object: `true`.
    - `x.equals(z)` compares text, both are "java": `true`.
    - `z.intern()` returns the pool copy of "java", which is exactly what `x` points to: `true`.
commonMistakes:
  - "Comparing Strings with == (e.g. if (input == \"yes\")). It compares addresses, not text. Use equals()."
  - "Thinking new String(\"a\") reuses the pool object. new ALWAYS creates a fresh heap object."
  - "Forgetting compile-time folding: \"a\" + \"b\" == \"ab\" is true, but a variable + \"b\" is not."
  - "Saying the String pool is on the stack or in PermGen. Since Java 7 it is part of the heap."
  - "Calling input.equals(\"yes\") when input may be null. Write \"yes\".equals(input) to avoid NullPointerException."
interviewBox:
  why: "Why interviewers ask this: it checks if you understand references vs content, and it shows up in nearly every set of Java output questions."
  questions:
    - q: "What is the difference between == and equals() for Strings?"
      a: "== checks if two references point to the very same object in memory. equals() checks if the characters are the same. Two different String objects with the same text give false for == but true for equals. So we always use equals to compare Strings."
    - q: "What is the String pool?"
      a: "It's a special area inside the heap where Java keeps one shared copy of each String literal. When I write the same literal twice, both variables point to the same pooled object. This saves memory, and it's safe because Strings are immutable."
    - q: "How many objects are created by new String(\"hello\")?"
      a: "One or two. The literal \"hello\" goes into the pool if it isn't there already, and new always creates one more object on the heap. So it's two if the literal is new, otherwise one."
    - q: "What does intern() do?"
      a: "intern() returns the pool copy of a String's text. If the pool doesn't have that text yet, it adds it. So after s = s.intern(), s points to the shared pool object and == with the same literal becomes true."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      String a = "hi";
      String b = "hi";
      String c = new String("hi");
      System.out.println((a == b) + " " + (a == c) + " " + a.equals(c));
    options: ["true true true", "true false true", "false false true", "true false false"]
    answer: 1
    explanation: "a and b are the same pooled literal (true). c is a new heap object, so a == c is false even though the text is equal. equals compares text, so it's true. \"true true true\" is the tempting wrong answer from thinking new reuses the pool."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      String s = "ab";
      String p = "a";
      String q = p + "b";
      String r = "a" + "b";
      System.out.println((s == q) + " " + (s == r));
    options: ["true true", "false false", "false true", "true false"]
    answer: 2
    explanation: "r = \"a\" + \"b\" is folded by the compiler into the literal \"ab\", so it's the pool object (true). q uses the variable p, so the join happens at runtime and creates a new heap object (false)."
  - id: q3
    type: MCQ
    prompt: "Since Java 7, where does the String pool live?"
    options: ["On the stack", "In the heap", "In PermGen", "In the CPU cache"]
    answer: 1
    explanation: "From Java 7 the pool was moved into the main heap. Before that it lived in PermGen, which is why older notes say PermGen; that's outdated. Stack memory holds only local variables and references."
  - id: q4
    type: SPOT_THE_BUG
    prompt: "This login check prints \"Denied\" even though the user typed admin. What is the bug?"
    code: |
      Scanner sc = new Scanner("admin");
      String user = sc.next();
      if (user == "admin") {
          System.out.println("Welcome");
      } else {
          System.out.println("Denied");
      }
    options:
      - "Scanner cannot read words, only numbers"
      - "== compares references; the typed text is a new object, so use user.equals(\"admin\")"
      - "\"admin\" must be written with new String(\"admin\")"
      - "The if needs a semicolon after the condition"
    answer: 1
    explanation: "Text read at runtime by Scanner is a new String object, not the pooled literal, so == is false and it prints Denied. \"admin\".equals(user) compares the characters and works. Adding new String would make it even worse, and a semicolon after if would be a different bug."
  - id: q5
    type: TRUE_FALSE
    prompt: "new String(\"code\") can create two objects."
    options: ["True", "False"]
    answer: 0
    explanation: "True. If \"code\" is not yet in the pool, the literal is added to the pool (one object) and new creates another on the heap (second object). If the literal is already pooled, only one new object is made."
  - id: q6
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      final String f = "co";
      String g = f + "de";
      String h = new String("code").intern();
      System.out.println((g == "code") + " " + (h == "code"));
    options: ["false false", "true false", "false true", "true true"]
    answer: 3
    explanation: "f is final and set to a literal, so f + \"de\" is a compile-time constant folded into the pooled \"code\" (true). intern() returns the pool copy (true). Without final, the first one would be false."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Fill the method that returns the String pool's copy of s."
    code: |
      String s = new String("quest");
      String pooled = s.____();
      System.out.println(pooled == "quest"); // true
    acceptedAnswers: ["intern"]
    explanation: "intern() looks up (or adds) the text in the pool and returns that shared object, so == with the literal becomes true."
  - id: q8
    type: MATCH
    prompt: "Match each expression to where its String object comes from"
    pairs:
      - left: "\"java\""
        right: "The pool (literal)"
      - left: "new String(\"java\")"
        right: "A fresh object on the normal heap"
      - left: "\"ja\" + \"va\""
        right: "The pool, because the compiler folds it"
      - left: "v + \"va\" (v is a normal variable)"
        right: "A new heap object made at runtime"
    explanation: "Literals and compile-time constants go to the pool; new and runtime joins with variables create new heap objects."
explainBack:
  prompt: "Explain to a friend the difference between String s = \"hi\" and new String(\"hi\"), and why we use equals() instead of ==."
  rubric:
    - "I explained the String pool shares one copy of each literal"
    - "I said new always makes a separate object"
    - "I said == compares references, equals compares text"
    - "I mentioned intern() or compile-time folding"
    - "I used an analogy or a drawing in words"
  modelAnswer: |
    Java keeps a String pool, like a library's reference section with one copy of each book. When I write "hi" as a literal, I get the shared pool copy, so two literals with the same text point to the same object. new String("hi") is like photocopying the book: same words, different physical copy on the heap. The == operator asks "is it the same physical copy?", while equals asks "are the words the same?". That's why we compare Strings with equals. If I want the pool copy of any String, I call intern(). And if I join two literals like "h" + "i", the compiler already makes "hi", so it's in the pool too.
