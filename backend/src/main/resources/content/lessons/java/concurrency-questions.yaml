why: |
  You've learned the pieces: threads, lifecycle, synchronization, deadlock, pools, atomics and locks. In an interview, though, nobody asks you to "explain chapter 3". They ask **short, sharp questions** and expect a **clear 30-second answer**, often followed by "can you code it?"

  This lesson is your **practice room**:
  - A simple **3-step formula** for answering any concept question in easy English.
  - The **most common concurrency questions** with model answers you can say out loud.
  - The topics we haven't covered yet: **daemon threads, interrupt, ConcurrentHashMap, BlockingQueue, ThreadLocal, the volatile singleton**.
  - Two classic coding tasks: **producer-consumer** and **print odd/even with two threads**.

  Don't memorise word for word. Understand the idea, then say it in your own words.
analogy: |
  Think of this lesson as **net practice before a cricket match**.

  In the match (the interview) the bowler can bowl anything: a quick bouncer ("synchronized vs volatile?"), a slow spinner ("explain deadlock"), or a yorker ("write producer-consumer"). In the nets you face **each kind of ball again and again** until your response is automatic and calm.

  The **3-step formula** is your batting stance: **Define → Example → Trade-off**. Stand right, and every ball becomes easier to play.
