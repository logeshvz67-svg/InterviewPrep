  modelAnswer: |
    A variable is like a labelled container, and the data type says what can go inside and how big the container is. Java has eight primitive types: byte, short, int and long for whole numbers, float and double for decimals, char for one character, and boolean for true or false. Other things, like Strings, are reference types, where the variable holds an address of an object. The int type only goes up to about 2.1 billion. If the answer is bigger, it silently wraps to a negative number, so the output is wrong. That is why I use long for big sums and products. Also, local variables must be given a value before use.
