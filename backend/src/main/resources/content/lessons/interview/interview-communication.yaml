    The answer previews ("There are two main differences") and orders the points ("First... Second..."), but never closes. Adding "**So, in short**, use an interface for a capability many classes share, and an abstract class for a common base with shared code" gives a clear ending and tells the interviewer you are done.
commonMistakes:
  - "Speaking faster when nervous. Slow down; aim for about 110-160 words per minute."
  - "Trying to stop fillers by force. Replace each filler with a short pause instead."
  - "Starting to answer before the interviewer finishes the question."
  - "Guessing what an unclear question means instead of asking to clarify."
  - "Looking at the screen or notes instead of the camera while speaking on video."
  - "Not stopping: adding 'and also, basically...' after the answer is complete."
interviewBox:
  why: "Why this matters: interviewers judge communication in every answer, not in a separate test. Clear habits make your technical knowledge visible."
  questions:
    - q: "Your English is not very fluent. How will you communicate with clients? (practice question)"
      a: "You are right that I am still improving my spoken English. I practise every day by recording my answers and doing mock interviews. I speak slowly and use simple, clear sentences, and when something is unclear I ask questions to confirm. I believe clear and simple communication works well with clients, and I will keep improving."
    - q: "How do you make sure you understood a requirement correctly? (practice question)"
      a: "I listen fully first. Then I repeat it back in my own words, like: 'Just to confirm, you want the report to show only active users?' If anything is unclear, I ask before I start. This saves time later."
    - q: "Explain the difference between == and equals() in Java. (practice question; use signposts)"
      a: "There are two main points. First, == compares references, that means whether two variables point to the same object. Second, equals() compares the content, if the class overrides it, like String does. So, in short, use equals() to compare the values of objects."
quiz:
  - id: q1
    type: MCQ
    prompt: "What is the best way to reduce filler words like 'umm' and 'basically'?"
    code: null
    options: ["Speak faster so there is no time for fillers", "Replace each filler with a short silent pause", "Memorise every answer word by word", "Use more difficult English words"]
    answer: 1
    explanation: "A short pause does the same job as a filler (thinking time) without the noise. Speaking faster usually adds fillers; memorising breaks under pressure; difficult words make you less clear."
  - id: q2
    type: MATCH
    prompt: "Match each signpost to its purpose"
    pairs:
      - left: "There are two main differences."
        right: "Preview what is coming"
      - left: "First... Second..."
        right: "Show the order of points"
      - left: "For example..."
        right: "Make a point concrete"
      - left: "So, in short..."
        right: "Summarise and close the answer"
    explanation: "Signposts are a map for the listener: preview, order, example, summary. They also keep you on track when nervous."
  - id: q3
    type: TRUE_FALSE
    prompt: "A 2-second pause before answering makes you look unprepared."
    options: ["True", "False"]
    answer: 1
    explanation: "False. A short pause looks thoughtful and calm. It feels long to you but normal to the listener. Rushing in with 'umm' looks less prepared."
  - id: q4
    type: MCQ
    prompt: "On a video interview, where should you look while YOU are speaking?"
    code: null
    options: ["At your notes", "At the camera", "At your own video tile", "Out of the window to think"]
    answer: 1
    explanation: "Looking at the camera feels like eye contact to the interviewer. Notes and your own tile look like you are distracted."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Complete the clarifying phrase."
    code: |
      "Just to ____, are you asking about HashMap or Hashtable?"
    acceptedAnswers: ["confirm", "clarify", "check"]
    explanation: "Confirming the question shows careful listening and prevents answering the wrong question. It also gives you a moment to think."
  - id: q6
    type: MCQ
    prompt: "Which pace range is a comfortable target for interview answers?"
    code: null
    options: ["50-70 words per minute", "About 110-160 words per minute", "200-250 words per minute", "Pace does not matter"]
    answer: 1
    explanation: "About 110-160 WPM is easy to follow. 50-70 sounds too slow and hesitant; 200+ is too fast for most listeners, especially on a call."
  - id: q7
    type: TRUE_FALSE
    prompt: "You need a perfect accent to do well in interviews."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Interviewers need to understand you, not hear a particular accent. Pace, pauses, short sentences and structure matter far more."
explainBack:
  prompt: "Explain to a friend with weak spoken English how they can sound clear in an interview."
  rubric:
    - "I mentioned slowing down (pace)"
    - "I explained replacing fillers with pauses"
    - "I explained signposts like 'First... Second... So, in short'"
    - "I mentioned listening fully and clarifying"
    - "I gave at least one video-call tip"
  modelAnswer: |
    You don't need perfect English; you need clear English. First, slow down. When we are nervous we speak fast, so speak like you are on a bad phone line. Second, when you want to say "umm" or "basically", stay silent for a second instead. Third, use signposts: "There are two points. First... Second... So, in short..." That gives your answer a map. Also, listen to the full question, and if it is unclear, say "Just to confirm..." On video, look at the camera, sit in good light, and keep your phone away. Practise one answer every day.
flashcards:
