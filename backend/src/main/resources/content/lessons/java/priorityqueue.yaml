explanation: |
  ### What is a PriorityQueue?
  A normal **queue** is FIFO: first in, first out. A **priority queue** is different: the element that comes out first is the one with the **highest priority**. In Java's `PriorityQueue`, by default, that is the **smallest** element. So the default is a **min-heap**.

  ```java
  PriorityQueue<Integer> pq = new PriorityQueue<>();
  pq.offer(30); pq.offer(10); pq.offer(20);
  pq.poll();   // 10
  pq.poll();   // 20
  ```

  ### How it works inside: the binary heap
  A **binary heap** is a complete binary tree (every level is full except maybe the last, which fills from the left) with one rule: **every parent is <= its children** (for a min-heap).

  The tree is stored in a plain **array**, no node objects:
  - children of index `i` are at `2i + 1` and `2i + 2`,
  - the parent of index `i` is at `(i - 1) / 2`.

  **offer / add (sift up):** put the new item at the end of the array, then keep swapping it with its parent while it is smaller. At most log n swaps.

  **poll (sift down):** take the root (index 0). Move the last item to the root, then keep swapping it with its smaller child while it is bigger. At most log n swaps.

  **peek:** just read index 0. O(1).

  ### Main methods
  | Method | What it does | Time |
  |---|---|---|
  | `offer(e)` / `add(e)` | insert | O(log n) |
  | `poll()` | remove and return the head (null if empty) | O(log n) |
  | `remove()` | like poll but throws if empty | O(log n) |
  | `peek()` | look at the head, don't remove (null if empty) | O(1) |
  | `element()` | like peek but throws if empty | O(1) |
  | `size()`, `isEmpty()` | count | O(1) |
  | `contains(o)`, `remove(o)` | search for any element | O(n) |

  ### The printing trap
  `System.out.println(pq)` and the for-each loop walk the **internal array**, which is only "heap ordered", not sorted. To get sorted output you must `poll()` repeatedly:
  ```java
  while (!pq.isEmpty()) System.out.print(pq.poll() + " ");
  ```

  ### Max-heap and custom order
  Pass a **Comparator** (an object that decides which of two items comes first):
  ```java
  PriorityQueue<Integer> max = new PriorityQueue<>(Collections.reverseOrder());
  PriorityQueue<int[]> byDist = new PriorityQueue<>((a, b) -> Integer.compare(a[1], b[1]));
  PriorityQueue<String> byLen = new PriorityQueue<>(Comparator.comparing(String::length));
  ```
  > Avoid `(a, b) -> b - a` for big numbers: the subtraction can overflow and give a wrong sign. `Integer.compare(b, a)` or `Collections.reverseOrder()` is always safe.

  ### The top-K pattern
  **"Find the k largest elements"**: keep a **min-heap of size k**.
  1. Add each number.
  2. If the size goes above k, `poll()` the smallest.
  3. At the end the heap holds the k largest, and `peek()` is the **k-th largest**.

  Cost: O(n log k), and only O(k) memory. Much better than sorting when k is small. (Flip it for k smallest: use a max-heap of size k.)

  ### Other facts
  - `null` elements are **not allowed** (NullPointerException).
  - Elements must be comparable (or you give a Comparator), otherwise `ClassCastException`.
  - Equal-priority elements come out in **no fixed order** (not stable).
  - **Not thread-safe**. Use `PriorityBlockingQueue` with threads.
  - You can build it from a collection: `new PriorityQueue<>(list)` builds the heap in O(n).
tinyCode:
  code: |
    import java.util.*;

    public class TopK {
        public static void main(String[] args) {
            int[] nums = {7, 2, 9, 4, 11, 5};
            int k = 3;
            PriorityQueue<Integer> minHeap = new PriorityQueue<>();
            for (int n : nums) {
                minHeap.offer(n);
                if (minHeap.size() > k) {
                    minHeap.poll();          // throw away the smallest
                }
            }
            System.out.println("3rd largest: " + minHeap.peek());

            PriorityQueue<Integer> maxHeap = new PriorityQueue<>(Collections.reverseOrder());
            for (int n : nums) maxHeap.offer(n);
            System.out.print("Descending:");
            while (!maxHeap.isEmpty()) System.out.print(" " + maxHeap.poll());
            System.out.println();
        }
    }
  walkthrough: |
    - `minHeap` keeps at most `k = 3` numbers. Whenever it grows to 4, `poll()` removes the smallest, so only the 3 biggest seen so far survive.
    - Trace: 7 -> {7}; 2 -> {2,7}; 9 -> {2,7,9}; 4 -> {2,4,7,9} then poll 2 -> {4,7,9}; 11 -> poll 4 -> {7,9,11}; 5 -> poll 5 -> {7,9,11}.
    - `peek()` is the smallest of the top 3, which is the **3rd largest**: `7`.
    - `Collections.reverseOrder()` turns the queue into a **max-heap**. Polling until empty gives the numbers biggest first.

    Output:
    ```
    3rd largest: 7
    Descending: 11 9 7 5 4 2
    ```
tryIt:
  instructions: "Type this 'cheapest ticket first' program. Each ticket is an int array {id, price}. Change the comparator to sort by id instead and see the order change."
  code: |
    import java.util.*;

    public class Tickets {
        public static void main(String[] args) {
            PriorityQueue<int[]> pq = new PriorityQueue<>(
                (a, b) -> Integer.compare(a[1], b[1]));
            pq.offer(new int[]{101, 450});
            pq.offer(new int[]{102, 120});
            pq.offer(new int[]{103, 300});
            while (!pq.isEmpty()) {
                int[] t = pq.poll();
                System.out.println("ticket " + t[0] + " costs " + t[1]);
            }
        }
    }
