  modelAnswer: |
    Every class extends Object, which gives equals, hashCode, toString and clone. == checks if two variables point to the same object, while equals checks content, but only if the class overrides it. The contract says equal objects must have the same hash code. That matters because a HashMap first uses hashCode to pick a bucket, like a hostel block, and only then uses equals inside it. If I override only equals, equal keys go to different buckets, so get returns null and a HashSet keeps duplicates. toString gives readable output. clone by default is a shallow copy, so inner lists are shared; a deep copy copies those too.
flashcards:
  - front: "== vs equals() on objects"
    back: "== compares references (same object?). equals() compares content if overridden; Object's default is ==."
  - front: "The hashCode contract (main rule)"
    back: "If a.equals(b) then a.hashCode() == b.hashCode(). Not the other way round."
  - front: "Override equals but not hashCode: effect on HashMap/HashSet?"
    back: "Equal keys land in different buckets: get() returns null, HashSet stores duplicates."
  - front: "Default toString() format"
    back: "ClassName@hexHashCode, e.g. Student@1b6d3586."
  - front: "Shallow vs deep copy"
    back: "Shallow: references copied, inner objects shared (Object.clone()). Deep: inner objects copied too."
  - front: "What is Cloneable?"
    back: "A marker interface (no methods). Without it, super.clone() throws CloneNotSupportedException."
keyTakeaways:
  - "Every class extends Object; its key methods are equals, hashCode, toString and clone."
  - "== compares references; equals compares content (only when overridden)."
  - "Equal objects must have equal hash codes: always override equals and hashCode together, with the same fields."
  - "HashMap/HashSet use hashCode to find the bucket, then equals inside it."
  - "equals must take Object as its parameter; use @Override."
  - "Object.clone() is shallow; deep copies must copy mutable inner objects too."
