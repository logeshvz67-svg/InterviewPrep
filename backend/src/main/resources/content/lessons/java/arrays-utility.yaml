title: "The Arrays utility class"
version: 1
estimatedMinutes: 30
rebuild: true
patternCode: null
companies: [ALL]
infosysRelevance: "Saves time in timed coding tests: sorting, searching, filling and copying in one line lets you spend your minutes on the actual SP/DSE problem logic."
otherCompanies: "Arrays.sort, Arrays.asList traps and binarySearch return values show up in MCQs and coding rounds at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  `java.util.Arrays` is a **utility class**: a class full of ready-made `static` methods that work on arrays. You never create an `Arrays` object; you just call `Arrays.sort(arr)`, `Arrays.fill(arr, -1)` and so on.

  Why learn it well:
  - In a timed test, writing your own sort or copy loop wastes minutes and invites bugs. `Arrays.sort` is one line and runs in **O(n log n)**.
  - Many solutions start with "sort the array", then use two pointers or binary search.
  - Interviewers like the traps: `Arrays.asList` on an `int[]`, adding to a list from `asList`, `binarySearch` on an unsorted array, and sorting in descending order.
analogy: |
  Think of `Arrays` as a **Swiss army knife** (or the multi-tool kit your electrician carries).

  - You do not build a new screwdriver every time you need one; you open the kit and use the right tool.
  - `sort` is the comb that arranges everything in order. `binarySearch` is the index of a dictionary: fast, but only if the pages are already in order.
  - `fill` is the paint roller: one stroke covers everything. `copyOf` is the photocopier: a fresh copy you can change freely.
  - `toString` is the display window: it shows what is inside the array in a readable way.
