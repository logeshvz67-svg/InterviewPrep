explanation: |
  ### ArrayList: a resizable array
  Inside, an `ArrayList` keeps a normal **array** (`Object[] elementData`) and a `size` counter.
  - **Capacity** = length of the inside array. **Size** = how many elements you actually stored.
  - `new ArrayList<>()` starts with an empty array; the first `add` creates capacity **10**.
  - When the array is full, it creates a new array about **1.5 times bigger** (`old + old/2`) and copies everything. Copying is O(n), but it happens rarely, so adding at the end is **O(1) amortized** (on average over many adds).
  - Tip: if you know the size, use `new ArrayList<>(1000)` to avoid repeated growing.

  ### LinkedList: a doubly linked list
  A `LinkedList` stores each element in a separate **node** object with three fields: `prev`, `item`, `next`. It remembers `first` and `last`.
  - Adding/removing at the **ends** is O(1): just relink pointers.
  - `get(i)` must **walk** from the nearer end (Java starts from the end closer to `i`), so it is O(n).
  - It implements both `List` and `Deque`, so it has `addFirst`, `pollLast`, etc.

  ### Big-O comparison
  | Operation | ArrayList | LinkedList |
  |---|---|---|
  | `get(i)` / `set(i, x)` | **O(1)** | O(n) |
  | `add(x)` at end | O(1) amortized | O(1) |
  | `add(0, x)` at start | O(n) (shift all) | **O(1)** |
  | `add(i, x)` / `remove(i)` in middle | O(n) (shift) | O(n) (walk) + O(1) (relink) |
  | `remove` last | O(1) | O(1) |
  | `contains(x)` / `indexOf(x)` | O(n) | O(n) |
  | Extra memory per element | ~1 reference | a whole node (2 extra references + object header) |

  ### Why ArrayList usually wins
  1. **Most code reads by index or loops**, where ArrayList is O(1) per access.
  2. **"LinkedList inserts are O(1)" is misleading**: inserting at position `i` still needs O(n) to *find* position `i`. Only inserts at the ends, or through an iterator you already hold, are truly O(1).
  3. **CPU cache**: ArrayList's elements sit side by side in memory, so the CPU reads them in fast chunks. LinkedList nodes are scattered, so each step may be a slow memory fetch. Even ArrayList's "slow" shifting uses a very fast `System.arraycopy`.
  4. **Memory**: each LinkedList node costs much more memory than one array slot, which also means more garbage collection.

  **Rule of thumb:** use `ArrayList` by default. If you need fast add/remove at **both ends** (a queue or stack), use **`ArrayDeque`**, not LinkedList. LinkedList is rarely the best choice in modern Java.

  ### Vector: the old synchronized ArrayList
  `Vector` (Java 1.0) is also a resizable array, but:
  - every method is **synchronized** (only one thread at a time can use it), which makes it slower even in single-threaded code;
  - it **doubles** its capacity when full (ArrayList grows by 1.5x).
  For thread safety today, use `Collections.synchronizedList(new ArrayList<>())` or `CopyOnWriteArrayList`.

  ### Stack: LIFO on top of Vector
  `Stack` extends `Vector` and adds `push`, `pop`, `peek`, `empty`, `search`. **LIFO** means Last In, First Out.
  Problems: it is synchronized (slow), and because it **extends Vector** it also exposes `get(i)` and `add(i, x)`, which break the "only touch the top" idea. Java's own docs recommend `Deque<Integer> stack = new ArrayDeque<>();` instead (next lesson).

  ### Summary table
  | | ArrayList | LinkedList | Vector | Stack |
  |---|---|---|---|---|
  | Inside | Array | Doubly linked nodes | Array | Array (extends Vector) |
  | Index access | O(1) | O(n) | O(1) | O(1) |
  | Synchronized | No | No | Yes | Yes |
  | Growth | 1.5x | per node | 2x | 2x |
  | Status | Default choice | Rarely best | Legacy | Legacy: use ArrayDeque |

  ### Trap: remove(int) vs remove(Object)
  On a `List<Integer>`, `list.remove(1)` removes **index 1**, not the value 1, because `remove(int index)` matches an `int` exactly. To remove the value, write `list.remove(Integer.valueOf(1))`.
tinyCode:
  code: |
    import java.util.*;

    public class Seats {
        public static void main(String[] args) {
            List<String> row = new ArrayList<>(List.of("A", "B", "C", "D"));
            row.add(1, "X");              // shift B, C, D to the right
            System.out.println(row + " get(2)=" + row.get(2));

            LinkedList<String> chain = new LinkedList<>(List.of("A", "B", "C"));
            chain.addFirst("start");     // O(1): relink at the head
            chain.addLast("end");        // O(1): relink at the tail
            System.out.println(chain + " first=" + chain.getFirst());

            Stack<Integer> plates = new Stack<>();
            plates.push(1); plates.push(2); plates.push(3);
            System.out.println("pop=" + plates.pop() + " peek=" + plates.peek());
            System.out.println("Stack is a Vector? " + (plates instanceof Vector));
        }
    }
  walkthrough: |
    - `row.add(1, "X")` inserts at index 1; B, C and D each shift one place right. `get(2)` jumps straight to index 2, which is now "B".
    - `LinkedList` has `addFirst` and `addLast`; both just relink pointers at the ends.
    - `Stack` is LIFO: after pushing 1, 2, 3, `pop()` removes 3, and `peek()` looks at the new top, 2, without removing it.
    - `instanceof Vector` is `true`, because `Stack extends Vector`. That's why it is synchronized and why it also allows unsafe index operations.

    Output:
    ```
    [A, X, B, C, D] get(2)=B
    [start, A, B, C, end] first=start
    pop=3 peek=2
    Stack is a Vector? true
    ```
tryIt:
  instructions: "Type this timing experiment. It reads every element by index from an ArrayList and a LinkedList of the same size. Run it and compare the times (exact numbers depend on your computer)."
  code: |
    import java.util.*;

    public class Race {
        static long timeGets(List<Integer> list) {
            long start = System.nanoTime();
            long sum = 0;
            for (int i = 0; i < list.size(); i++) {
                sum += list.get(i);
            }
            long ms = (System.nanoTime() - start) / 1_000_000;
            System.out.println(list.getClass().getSimpleName() + " sum=" + sum + " time=" + ms + " ms");
            return ms;
        }
        public static void main(String[] args) {
            List<Integer> array = new ArrayList<>();
            List<Integer> linked = new LinkedList<>();
            for (int i = 0; i < 50_000; i++) {
                array.add(i);
                linked.add(i);
            }
            timeGets(array);
            timeGets(linked);
        }
    }
