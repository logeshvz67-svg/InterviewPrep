why: |
  **"String vs StringBuilder vs StringBuffer"** is one of the top Java comparison questions. You should be able to answer it in 30 seconds with a clear table.

  It also matters in coding tests:
  - Reversing a string, building output, joining characters in a loop: `StringBuilder` does it fast.
  - Using `+` inside a big loop can make your solution slow enough to fail time limits.
  - Printing many lines? Collect them in one `StringBuilder` and print once.
analogy: |
  Think about writing a shopping list.

  - **String** is like writing on a **printed card**. To add "milk", you must print a whole new card. Do that 1,000 times and your table is full of old cards.
  - **StringBuilder** is a **whiteboard**. You just keep writing, erasing and inserting on the same board. Fast. But if two people write at the same moment, the words can get mixed up.
  - **StringBuffer** is a whiteboard with a **token**: only the person holding the token may write. Safe for many people, but everyone waits for the token, so it is slower.
