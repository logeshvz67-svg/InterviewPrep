  expectedOutput: |
    8
    14
    6
    -13
    48
    3
  explanation: |
    `1100 & 1010 = 1000` = 8 (only bit 3 is common). `1100 | 1010 = 1110` = 14. `1100 ^ 1010 = 0110` = 6 (the bits that differ). `~12` flips all 32 bits, and in two's complement `~x = -x - 1`, so -13 (not -12, a common wrong guess). `12 << 2` = 12 x 4 = 48. `12 >> 2` = 12 / 4 = 3.
commonMistakes:
  - "Writing n & 1 == 0 without brackets; == runs first, so it doesn't compile in Java. Use (n & 1) == 0."
  - "Thinking ~x equals -x; it is -x - 1."
  - "Mixing up >> (keeps the sign) and >>> (fills with zeros); they differ only for negative numbers."
  - "Forgetting n > 0 in the power-of-two check; 0 & (0 - 1) is 0, so 0 would wrongly pass."
  - "Shifting 1 << 31 and expecting a big positive number; it sets the sign bit and gives Integer.MIN_VALUE. Use 1L << k for bits above 30."
  - "Using n % 2 == 1 to test odd numbers; for negative odd numbers n % 2 is -1. (n & 1) == 1 works for all."
interviewBox:
  why: "Why interviewers ask this: bit tricks test low-level understanding of how numbers are stored and give elegant O(1)-space solutions; operator output questions catch careless reading."
  questions:
    - q: "How do you check whether a number is a power of two?"
      a: "A power of two has exactly one bit set. n minus 1 flips that bit to 0 and all lower bits to 1, so n AND n minus 1 is zero only for powers of two. I also check n is greater than zero, because zero would pass otherwise. It's O(1)."
    - q: "Every element appears twice except one. How do you find the single one?"
      a: "I XOR all the numbers together. XOR of a number with itself is zero and XOR with zero gives the number back, and order doesn't matter. So every pair cancels out and only the single number remains. It's O(n) time and O(1) extra space, better than a HashMap which needs O(n) space."
    - q: "What is the difference between >> and >>> in Java?"
      a: "Both shift bits to the right. The signed shift, >>, copies the sign bit into the empty places, so negative numbers stay negative; minus 8 shifted right by 1 is minus 4. The unsigned shift, >>>, always fills with zeros, so a negative number becomes a large positive number. For positive numbers they give the same result."
    - q: "How do you count the number of 1 bits in an integer?"
      a: "I use Brian Kernighan's trick: while n is not zero, I do n equals n AND n minus 1, which removes the lowest set bit, and I count how many times the loop runs. It runs once per set bit instead of 32 times. In Java I can also use Integer.bitCount."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      System.out.println((-8 >> 1) + " " + (-8 >>> 28));
    options: ["-4 15", "-4 -1", "4 15", "-4 0"]
    answer: 0
    explanation: "-8 >> 1 keeps the sign: -8 / 2 = -4. -8 is 1111...1000 (32 bits); >>> 28 shifts in zeros and keeps only the top 4 bits, 1111 = 15. \"-4 -1\" is what -8 >> 28 (signed) would give for the second part."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "XOR of all elements. What is printed?"
    code: |
      int[] nums = {7, 3, 5, 3, 7};
      int r = 0;
      for (int v : nums) r ^= v;
      System.out.println(r);
    options: ["5", "0", "25", "7"]
    answer: 0
    explanation: "7 ^ 7 = 0 and 3 ^ 3 = 0 regardless of order, leaving 0 ^ 5 = 5. 25 is the plain sum, which is a different operation."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "This even-number check does not compile. Why?"
    code: |
      int n = 6;
      if (n & 1 == 0) {
          System.out.println("even");
      }
    options:
      - "& cannot be used on int values"
      - "== has higher precedence than &, so it becomes n & (1 == 0), which mixes int and boolean; write (n & 1) == 0"
      - "It should be n && 1"
      - "1 must be written as 0b1"
    answer: 1
    explanation: "Java evaluates 1 == 0 first (false), then tries int & boolean: 'bad operand types for binary operator &'. Brackets fix it. && only works on booleans, and the literal format makes no difference."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "n = 40 (binary 101000). What is printed?"
    code: |
      int n = 40;
      System.out.println((n & (n - 1)) + " " + (n & -n));
    options: ["32 8", "8 32", "39 8", "32 40"]
    answer: 0
    explanation: "n & (n - 1) removes the lowest set bit: 101000 -> 100000 = 32. n & -n keeps only the lowest set bit: 001000 = 8. They are opposite tricks, so \"8 32\" swaps them."
  - id: q5
    type: MCQ
    prompt: "Which expression clears bit i (sets it to 0) of n and leaves all other bits unchanged?"
    code: null
    options: ["n | (1 << i)", "n ^ (1 << i)", "n & ~(1 << i)", "n & (1 << i)"]
    answer: 2
    explanation: "~(1 << i) has every bit 1 except bit i, so AND keeps all other bits and forces bit i to 0. | sets the bit, ^ toggles it (it would turn a 0 into 1), and n & (1 << i) keeps ONLY bit i."
  - id: q6
    type: TRUE_FALSE
    prompt: "For any int x in Java, ~x == -x - 1."
    options: ["True", "False"]
    answer: 0
    explanation: "True. In two's complement, -x = ~x + 1, so ~x = -x - 1. Example: ~12 = -13, ~0 = -1, ~(-1) = 0. It even holds for Integer.MIN_VALUE because int arithmetic wraps around."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Brian Kernighan's set-bit counter: fill the line that removes the lowest set bit."
    code: |
      int count = 0;
      while (n != 0) {
          ____;
          count++;
      }
    acceptedAnswers: ["n &= (n - 1)", "n &= n - 1", "n = n & (n - 1)", "n&=(n-1)", "n&=n-1", "n=n&(n-1)"]
    explanation: "n - 1 flips the lowest 1-bit and everything below it, so ANDing with n wipes out exactly that bit. The loop runs once per 1-bit. n >>= 1 would also terminate for positive numbers but needs a separate check of the last bit and runs once per bit position."
  - id: q8
    type: MATCH
    prompt: "Match each operator to what it does"
    pairs:
      - left: "a & b"
        right: "1 only where both bits are 1"
      - left: "a ^ b"
        right: "1 where the bits differ"
      - left: "a << 1"
        right: "Doubles the value (bits move left)"
      - left: "a >>> 1"
        right: "Shifts right, filling with 0 even for negatives"
    explanation: "AND keeps common bits, XOR marks differences, left shift multiplies by 2, and unsigned right shift ignores the sign."
explainBack:
  prompt: "Explain to a friend how XOR finds the single number and how n & (n - 1) checks for a power of two, using the light switches idea."
  rubric:
    - "I explained that an int is a row of 32 bits, each a power of two"
    - "I said a ^ a = 0 and a ^ 0 = a, so pairs cancel"
    - "I explained that n & (n - 1) removes the lowest set bit"
    - "I said a power of two has exactly one bit set and n must be > 0"
    - "I mentioned the bracket/precedence trap or the >> vs >>> difference"
  modelAnswer: |
    A number in the computer is a row of 32 light switches, each switch worth a power of two. XOR compares two rows and turns a switch on only where they differ, so a number XOR itself is all off, zero. If every number appears twice except one, I XOR them all, the pairs cancel, and only the single number is left, with O(1) extra space. For powers of two: a power of two has exactly one switch on. Subtracting one turns that switch off and all the lower ones on, so n AND n minus 1 becomes zero only for powers of two. I also check n is positive. And I always use brackets, like (n & 1) == 0, because == runs before &.
