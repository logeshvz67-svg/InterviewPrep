explanation: |
  ### The 5-part project answer
  | Part | Question it answers | Time |
  |---|---|---|
  | **1. Problem** | What problem does it solve, and for whom? | 15 sec |
  | **2. Architecture** | What are the main parts and how do they talk? | 30-40 sec |
  | **3. My role** | What did **I** build? Which features? | 20 sec |
  | **4. Challenge** | One hard problem and how I solved it | 30 sec |
  | **5. Improvements** | What would I do better or add next? | 15 sec |

  About **2 minutes** in total. Then stop and let them ask.

  ### 1. Problem
  > "I built Code Quest, a web app that helps me prepare for Java developer interviews. The problem I had was that I studied a lot but forgot things and lost motivation. So the app turns learning into a game with lessons, quizzes, spaced revision and mock interviews."

  The problem should be **real** and **simple**. "I had this problem myself" is a strong, honest start.

  ### 2. Architecture
  **Architecture** means the big parts of the system and how they connect. Use the three-box picture:
  - **Frontend**: React with TypeScript, built with Vite. It runs in the browser and shows the pages.
  - **Backend**: Spring Boot 3 with Java 21. It has the usual layers: **controller** (receives HTTP requests), **service** (business logic, like calculating XP), **repository** (talks to the database using Spring Data JPA).
  - **Database**: PostgreSQL. Tables are created with **Flyway migrations** (versioned SQL scripts, so every environment has the same schema).
  - **Security**: login with **JWT** (a signed token the browser sends with each request) and passwords stored with **BCrypt** hashing.
  - **Hosting**: free tiers (Render for the app, Supabase for the database).

  Know **why** for each choice. Example: "I chose PostgreSQL because my data is relational: users have lessons, quiz attempts and flashcards, all linked by ids."

  ### 3. My role
  Use **"I"**, not "we", for what you did. Be precise and **honest**.
  > "I designed the database tables, built the REST APIs for lessons and quizzes, and wrote the XP logic on the server."

  If you used tutorials or AI tools to help, that is normal today. But you must be able to **explain every part you claim**. If they point at any file, you should know what it does and why.

  ### 4. One challenge (use STAR)
  **STAR** = Situation, Task, Action, Result. Prepare **two** challenge stories. Code Quest examples:
  - **Cheating on XP**: Situation: XP (game points) was first calculated in the browser. Task: make scores trustworthy. Action: I moved all XP calculation to the server and removed any "add XP" endpoint. Result: users cannot fake XP by editing browser requests.
  - **Sleeping server**: Situation: the free backend host sleeps after inactivity, so the first request took 30-60 seconds and looked broken. Action: I added a "Waking the server" screen with automatic retries, and a health-check endpoint that an uptime monitor can ping. Result: users understand the wait instead of thinking the app crashed.

  ### 5. Improvements
  Interviewers love honest self-review. It shows maturity.
  > "If I continue, I would add more automated tests for the frontend, add caching for lesson content, and improve accessibility for screen readers."

  ### Prepare for these follow-ups
  | Follow-up | What to prepare |
  |---|---|
  | "Why Spring Boot?" | Auto-configuration, embedded server, easy REST and JPA, very common in industry |
  | "How does login work?" | User sends email + password, server checks the BCrypt hash, returns a JWT; the browser sends it in the `Authorization` header |
  | "How do you stop users seeing others' data?" | Every query filters by the logged-in user's id on the server |
  | "Show me one table" | Draw `users` and `quiz_attempts` with columns and the foreign key |
  | "How did you test it?" | Backend tests with JUnit; manual checklist for the UI |
tinyCode:
  code: |
    MY PROJECT IN 2 MINUTES

    1. PROBLEM:      I built ________ to solve ________
                     for ________.
    2. ARCHITECTURE: The frontend is ________.
                     The backend is ________ with
                     controller, service and repository layers.
                     Data is stored in ________.
    3. MY ROLE:      I built ________ and ________.
    4. CHALLENGE:    The hardest problem was ________.
                     I solved it by ________. Result: ________.
    5. IMPROVE:      Next, I would add ________.
  walkthrough: |
    - The five numbered parts follow the table in the lesson. Fill each blank with **true, specific** words.
    - In **ARCHITECTURE**, name the layers. Saying "controller, service, repository" shows you understand how a Spring app is organised.
    - In **MY ROLE**, list 2-3 concrete features ("the quiz API", "the XP logic"), not "everything".
    - **CHALLENGE** is a mini STAR story. Always end with a result.
    - **IMPROVE** shows you can judge your own work honestly.
    - Practise saying it while drawing the three boxes on paper.
