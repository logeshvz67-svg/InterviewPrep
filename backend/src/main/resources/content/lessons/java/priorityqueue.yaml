  explanation: |
    Printing shows the **internal heap array**, not sorted order. Trace the sift-ups: add 5 -> [5]; add 1 -> swaps up -> [1, 5]; add 4 -> [1, 5, 4]; add 2 -> goes below 5, swaps up -> [1, 2, 4, 5]; add 3 -> its parent is 2, no swap -> [1, 2, 4, 5, 3]. Then `poll()` returns the smallest, 1, and the new head is 2.
commonMistakes:
  - "Printing or for-each looping over a PriorityQueue and expecting sorted order. Only the head is guaranteed; poll() repeatedly to get sorted output."
  - "Forgetting the default is a MIN-heap. For the largest first, pass Collections.reverseOrder()."
  - "Writing the comparator as (a, b) -> b - a. It can overflow for large or negative values; use Integer.compare(b, a)."
  - "Using a max-heap of all n elements for k largest. A min-heap of size k is O(n log k) and uses less memory."
  - "Calling contains() or remove(obj) in a loop, thinking they are O(log n). They are O(n)."
  - "Adding null: PriorityQueue throws NullPointerException."
interviewBox:
  why: "Why interviewers ask this: heaps are the standard tool for top-K and scheduling problems, and the internals test if you understand trees stored in arrays."
  questions:
    - q: "How is PriorityQueue implemented in Java?"
      a: "It is a binary heap stored in an array. By default it's a min-heap, so every parent is smaller than or equal to its children and the smallest element is at index zero. The children of index i are at 2i plus 1 and 2i plus 2. offer and poll are O(log n) because they move one element up or down the tree, and peek is O(1)."
    - q: "How do you find the k-th largest element using a PriorityQueue?"
      a: "I keep a min-heap of size k. I add each number, and if the size becomes more than k, I poll the smallest. At the end, the heap has the k largest numbers and peek gives the k-th largest. It's O(n log k) time and O(k) space."
    - q: "How do you make a max-heap in Java?"
      a: "Pass a comparator that reverses the order, like new PriorityQueue with Collections.reverseOrder, or a lambda using Integer.compare of b and a."
    - q: "Why doesn't printing a PriorityQueue show sorted order?"
      a: "Because toString and the iterator just walk the internal array, and a heap only guarantees that parents are smaller than children, not that the whole array is sorted. To get sorted order you poll until it's empty."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      PriorityQueue<Integer> pq = new PriorityQueue<>(List.of(8, 3, 6));
      pq.offer(1);
      System.out.print(pq.poll() + " ");
      System.out.print(pq.poll() + " ");
      System.out.println(pq.size());
    options: ["8 3 2", "1 3 2", "1 8 2", "3 1 2"]
    answer: 1
    explanation: "Default PriorityQueue is a min-heap: poll gives 1, then 3. Two elements (6 and 8) remain, so size is 2. '8 3 2' is the insertion-order guess, but a priority queue is not FIFO."
  - id: q2
