    prompt: "7 friends sit around a round table. Fill in the number of different arrangements."
    code: |
      (7 - 1)! = ____
    acceptedAnswers: ["720"]
    explanation: "Fix one person; arrange the other 6 in 6! = 720 ways. Using 7! = 5040 counts rotations of the same seating as different."
  - id: q6
    type: MCQ
    prompt: "Two coins are tossed. What is the probability of getting at least one head?"
    code: null
    options: ["1/2", "1/4", "3/4", "2/3"]
    answer: 2
    explanation: "Outcomes: HH, HT, TH, TT. Only TT has no head, so 1 - 1/4 = 3/4. 2/3 comes from wrongly treating {0, 1, 2 heads} as equally likely."
  - id: q7
    type: MATCH
    prompt: "Match each situation to the right counting tool"
    pairs:
      - left: "Choosing 3 people for a team"
        right: "Combination (nCr)"
      - left: "Giving gold, silver and bronze medals"
        right: "Permutation (nPr)"
      - left: "Seating people around a round table"
        right: "(n - 1)!"
      - left: "Arranging the letters of BANANA"
        right: "n! divided by factorials of repeats"
    explanation: "A team has no order (combination); medals have order (permutation); rotations are identical at a round table; identical letters must be divided out."
  - id: q8
    type: MCQ
    prompt: "A bag has 5 red and 3 green balls. Two balls are drawn without replacement. What is the probability that both are green?"
    code: null
    options: ["9/64", "3/28", "3/8", "1/8"]
    answer: 1
    explanation: "3C2 / 8C2 = 3/28. (Or 3/8 x 2/7 = 6/56 = 3/28.) 9/64 assumes the first ball is put back, which the question does not allow."
explainBack:
  prompt: "Explain to a friend the difference between permutation and combination, and how to find the probability of at least one head in 3 coin tosses."
  rubric:
    - "I said permutation = order matters, combination = order does not"
    - "I explained why nCr = nPr / r!"
    - "I used the complement 1 - P(none) for 'at least one'"
    - "I gave a real-life example (team vs batting order)"
  modelAnswer: |
    A permutation counts arrangements, where order matters, like a batting order. A combination counts selections, where order doesn't matter, like picking the team. Every group of r people can be arranged in r factorial ways, so the number of combinations is the permutations divided by r factorial. For probability, I divide good outcomes by all outcomes. Three coins have 8 outcomes. For "at least one head", it's easier to find the opposite: no heads happens only once, tail-tail-tail. So the answer is 1 minus 1/8, which is 7/8.
flashcards:
  - front: "nPr and nCr formulas"
    back: "nPr = n!/(n-r)! (order matters). nCr = n!/(r!(n-r)!) (order doesn't)."
  - front: "Why nCr = nPr / r!"
    back: "Each group of r appears r! times as an ordered arrangement."
  - front: "Round table with n people"
    back: "(n - 1)! arrangements; rotations are the same."
  - front: "At least one ..."
    back: "1 - P(none)."
  - front: "P(A or B) with overlap"
    back: "P(A) + P(B) - P(A and B)."
keyTakeaways:
  - "Ask first: does order matter? Permutation if yes, combination if no."
  - "AND multiplies, OR adds."
  - "Divide by factorials of repeats; use (n-1)! for circles; glue 'together' items into a block."
  - "Probability = favourable / total; use 1 - P(none) for 'at least one'."
  - "Brute-force loops in Java are a great way to check a counting formula."
