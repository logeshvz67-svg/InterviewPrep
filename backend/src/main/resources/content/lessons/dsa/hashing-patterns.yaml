keyTakeaways:
  - "Hashing remembers what you've seen: O(1) average lookups turn O(n^2) into O(n)."
  - "Four patterns: frequency count, seen-set, complement lookup, group by key."
  - "Two-sum: check the complement first, then store the current number."
  - "HashMap has no order; walk the original input when order matters."
  - "Prefer sorting when you need order or must save memory."
