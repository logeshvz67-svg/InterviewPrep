  diagram: |
    int[] a = {5, 2, 8, 1, 9};

    Arrays.toString(a)       -> "[5, 2, 8, 1, 9]"
    Arrays.sort(a)           -> a is now [1, 2, 5, 8, 9]   (in place)
    Arrays.binarySearch(a,8) -> 3        (index, array must be sorted)
    Arrays.binarySearch(a,6) -> -4       (= -(insertion point 3) - 1)
    Arrays.copyOf(a, 3)      -> [1, 2, 5]           (new array)
    Arrays.copyOf(a, 7)      -> [1, 2, 5, 8, 9, 0, 0] (padded)
    Arrays.copyOfRange(a,1,4)-> [2, 5, 8]           (from 1, to 4 excl.)
    Arrays.fill(b, -1)       -> [-1, -1, -1, ...]
    Arrays.equals(a, c)      -> compares CONTENTS (a == c compares refs)

    Arrays.asList(1, 2, 3)  ---view--->  backed by the array
       set() OK  |  add()/remove() -> UnsupportedOperationException
  caption: "One line per job: print, sort, search, copy, fill, compare. asList gives a fixed-size list view, not a normal ArrayList."
