  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      Set<Integer> s = new TreeSet<>(List.of(40, 10, 30, 10, 20));
      System.out.println(s);
      System.out.println(((TreeSet<Integer>) s).ceiling(25));
    options: ["[40, 10, 30, 20]\n30", "[10, 20, 30, 40]\n30", "[10, 20, 30, 40]\n20", "[10, 10, 20, 30, 40]\n30"]
    answer: 1
    explanation: "TreeSet sorts and removes the duplicate 10, giving [10, 20, 30, 40]. ceiling(25) is the smallest element >= 25, which is 30. 20 would be floor(25), the tempting mix-up."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "Why does this crash at runtime?"
    code: |
      Map<String, Integer> m = new TreeMap<>();
      m.put("x", 1);
      m.put(null, 2);
      System.out.println(m);
    options:
      - "TreeMap cannot store Integer values"
      - "TreeMap with natural ordering cannot compare a null key, so put(null, ...) throws NullPointerException"
      - "You must call sort() before printing a TreeMap"
      - "TreeMap allows only one entry"
    answer: 1
    explanation: "TreeMap places keys by comparing them, and \"x\".compareTo(null) is impossible, so it throws NullPointerException. HashMap and LinkedHashMap would accept one null key, which is why this surprises people."
