keyTakeaways:
  - "Stack = LIFO, queue = FIFO; use ArrayDeque for both."
  - "Brackets: push openers, pop and match on closers, and check empty at the end."
  - "Monotonic stack of indexes solves next greater/smaller problems in O(n)."
  - "Min stack: a second stack stores the minimum at every height."
  - "Queues give BFS its level-by-level order."
