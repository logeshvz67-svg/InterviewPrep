infosysRelevance: "These classic query patterns (Nth highest salary, duplicates, employee vs manager, per-group max) are the most useful SQL practice for SP and DSE coding and technical rounds."
otherCompanies: "Nth highest salary and duplicate-row questions are very common practice questions at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  SQL interviews reuse a small set of **classic problems**. Once you have solved each one yourself, you'll recognise them instantly, even when the table names change.

  This lesson collects them all on our sample tables, with **verified results**:
  1. Nth highest salary (3 ways)
  2. Find duplicate rows
  3. Delete duplicates, keeping one
  4. Employees earning more than their manager
  5. Department-wise highest salary (with names)
  6. Second highest salary in each department
  7. Customers with no orders
  8. Running total

  Each one is just a combination of what you learned earlier: joins, GROUP BY, subqueries and window functions. The skill is **choosing the right tool**.
analogy: |
  Think of these like **standard cricket shots**. A batter doesn't invent a new shot for every ball. They recognise the ball (short, full, wide) and play the shot they have practised hundreds of times.

  "Nth highest" = DENSE_RANK shot. "Rows with no match" = LEFT JOIN + IS NULL (or NOT EXISTS) shot. "Compare a row with a related row in the same table" = self join shot. Practise the shots here until they are automatic.
