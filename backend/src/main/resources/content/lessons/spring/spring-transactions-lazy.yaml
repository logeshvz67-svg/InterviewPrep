title: "Transactions, lazy loading and N+1"
version: 1
estimatedMinutes: 45
rebuild: false
patternCode: null
companies: [INFOSYS_SP, PRODUCT, ALL]
infosysRelevance: "Advanced SP practice area: @Transactional behaviour, LazyInitializationException and the N+1 problem separate 'used Spring' from 'understands Spring' in deeper technical rounds."
otherCompanies: "Product companies ask these often (self-invocation, propagation, N+1 fixes, open-in-view). Service companies (TCS, Wipro, Cognizant, Accenture, Capgemini) usually ask what @Transactional does and lazy vs eager."
why: |
  These three topics cause the most **real production bugs** in Spring apps, and interviewers know it:
  - **Transactions**: "XP was added but the problem was not saved". Half-finished work in the database.
  - **Lazy loading**: the famous **LazyInitializationException** that every Spring developer meets.
  - **N+1 queries**: a page that runs 1 query on your laptop runs **101 queries** in production and becomes slow.

  This lesson explains each with code you can run, and your own `backend` project has a real example of every fix: `XpService` (transactions and dirty checking), `JavaTopic` + `JavaTopicRepository` (lazy loading and `@EntityGraph`) and `spring.jpa.open-in-view: false` in `application.yml`.
analogy: |
  **Transaction**: an **ATM withdrawal**. The machine must (1) reduce your balance and (2) give cash. If the cash gets stuck, the balance change is **reversed** (rollback). Either both happen or neither: that is a transaction.

  **Lazy loading**: a **library catalogue card** that says "see shelf B4 for the 10 chapters". You get the card quickly, and walk to the shelf only if you need the chapters. But if the **library has closed** (the transaction ended) and you then try to walk to the shelf, the door is locked: **LazyInitializationException**.

  **N+1**: going to the **kirana shop** for a list of 10 items, but making **one trip per item**: 1 trip to read the list + 10 trips = 11 trips. The fix is to **collect everything in one trip** (a join fetch).
visual:
  diagram: |
    N+1 problem: 5 authors, each with a LAZY list of books
    --------------------------------------------------------
    select * from author                         <- 1 query
    for each author: author.books.size()
       select * from book where author_id = 1    <- +1
       select * from book where author_id = 2    <- +1
       ...                                        (5 more)
    TOTAL = 1 + N = 6 queries   (N = 100 -> 101 queries!)

    Fix: @EntityGraph(attributePaths = "books") or JOIN FETCH
    select a.*, b.* from author a
           left join book b on b.author_id = a.id  <- 1 query

    Transaction proxy
    caller --> [Spring proxy: BEGIN] --> service.method()
                                    <-- returns: COMMIT
                                    <-- RuntimeException: ROLLBACK
  caption: "A lazy collection touched in a loop fires one extra query per row; a fetch join loads everything at once. @Transactional works through a proxy that begins, commits or rolls back around your method."
