commonMistakes:
  - "Waiting days to write the entry. Write it the same day, while you remember."
  - "Writing a 'nicer' version of what you said in 'My answer'. Record the honest version."
  - "Writing a better answer that is too long to speak. Keep it 30-90 seconds of simple English."
  - "Writing entries but never reviewing them. Use day 1, 3, 7, 14 spaced review on weak ones."
  - "Treating the diary as a list of 'exact company questions' to memorise or share. Use it to build understanding."
interviewBox:
  why: "Why this matters: interviewers often ask similar core questions in different words. A diary with reviewed better answers means you improve with every interview instead of repeating mistakes."
  questions:
    - q: "Have you attended interviews before? What did you learn? (practice question)"
      a: "Yes, I have attended a few, and I do practice interviews regularly. After each one, I write down the questions and how I answered. For example, I noticed my answers were too long, so now I use a clear structure and keep them short. Each interview has made me better."
    - q: "How do you learn from your mistakes? (practice question)"
      a: "I write them down honestly and then fix them on purpose. For interviews, I keep a diary: the question, what I said, and a better answer. Then I practise the better answer a few times over the next two weeks until it becomes natural."
quiz:
  - id: q1
    type: MCQ
    prompt: "When should you write your diary entry after an interview?"
    code: null
    options: ["The same day", "After a week, when you are calm", "Only if you got the job", "Only if the interview went badly"]
    answer: 0
    explanation: "Memory fades within hours. Same-day entries capture the real questions and your real answers. Waiting a week loses details; good and bad interviews both teach you something."
  - id: q2
    type: TRUE_FALSE
    prompt: "In the 'My answer' field, you should write a polished version of what you said."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Write what you really said. The improved version goes in 'Better answer'. Comparing the two is how you see your habits."
  - id: q3
    type: MATCH
    prompt: "Match the question type to the structure for the better answer"
    pairs:
      - left: "Tell me about yourself"
        right: "Present-Past-Future"
      - left: "What is a HashMap?"
        right: "Concept-Example-Use case"
      - left: "Tell me about a time you faced a problem"
        right: "STAR"
      - left: "Explain your project"
        right: "Problem, Architecture, My role, Challenge, Improvements"
    explanation: "Each question type has a structure from this world. Picking the structure first makes the better answer quick to write and easy to say."
  - id: q4
    type: MCQ
    prompt: "Which review schedule is an example of spaced review?"
    code: null
    options: ["10 times on day 1, then never", "Day 1, day 3, day 7, day 14", "Every day forever", "Only the night before the next interview"]
    answer: 1
    explanation: "Spaced review uses growing gaps, revising just before you would forget. Cramming many times on one day fades fast; every day forever wastes time; the night before is too late."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Complete the tag that marks an answer needing spaced review."
    code: |
      Tags: collections, ____
    acceptedAnswers: ["weak"]
    explanation: "The 'weak' tag lets you filter the diary for entries to review. Change it to 'solid' after three good recalls in a row."
  - id: q6
    type: TRUE_FALSE
    prompt: "It is a good idea to post your real interview questions online as 'the exact questions of company X'."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Questions vary and companies ask candidates to keep processes confidential. Use your diary privately to build understanding, not to create question lists."
  - id: q7
    type: MCQ
    prompt: "After 20 entries, you see 'weak' on 7 collections questions. What should you do?"
    code: null
    options: ["Ignore it; it is random", "Go back to the collections lessons and practise those concepts", "Stop doing interviews", "Delete those entries"]
    answer: 1
    explanation: "A pattern of weak tags points to a topic gap. Re-learning that topic fixes many future answers at once. Deleting or ignoring the pattern hides the problem."
explainBack:
  prompt: "Explain to a friend how an interview diary works and why it helps."
  rubric:
    - "I named the fields: question, my answer, better answer, tags"
    - "I said to write it the same day, honestly"
    - "I explained spaced review with growing gaps"
    - "I mentioned looking for patterns with tags"
  modelAnswer: |
    After every interview, real or practice, I write a diary entry the same day. For each question, I write what I really said, and then a better answer using a structure, like Concept-Example-Use case for technical questions. I tag weak answers. Then I review them with growing gaps: day one, day three, day seven, day fourteen. I cover the answer and say it aloud. When it's good three times, I mark it solid. After many entries, I look at the tags to find my weak topics and study them again. That way, no interview is wasted.
flashcards:
  - front: "Diary entry fields"
    back: "Company, round, date, question, my answer (honest), better answer, tags."
  - front: "Spaced review schedule for weak answers"
    back: "Day 1, 3, 7, 14: cover the answer, say it aloud, compare. 3 good in a row -> 'solid'."
  - front: "Why record your real answer?"
    back: "To compare with the better answer and see your habits; you cannot fix what you hide."
  - front: "What do tags help you find?"
    back: "Patterns: topics where many answers are weak, so you can re-learn them."
keyTakeaways:
  - "Write every interview (real or mock) in the diary the same day."
  - "Record your honest answer, then a better one using PPF, STAR, CEU or the 5-part project structure."
  - "Review weak answers aloud with growing gaps: day 1, 3, 7, 14."
  - "Use tags to find weak topics and re-learn them."
  - "Keep the diary private; use it to understand, not to collect 'exact' questions."
