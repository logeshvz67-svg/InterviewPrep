infosysRelevance: "Infosys-style practice: for SP and DSE profiles, a project you can explain end to end (problem, architecture, your role, challenges) is one of the strongest proofs of real skill, especially for a career switcher."
otherCompanies: "'Explain your project' is a very common interview question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies. Product companies often go deeper into design decisions."
why: |
  You do not have IT job experience yet. So what proves you can build software? **Your project.**

  "Explain your project" is where a career switcher can shine. A fresher with a degree may have a copied college project they cannot explain. You can have a project you **really understand**: this Code Quest app, or your Spring Boot projects.

  But a project only helps if you can explain it **clearly in 2 minutes** and survive questions like:
  - "Why did you choose PostgreSQL?"
  - "What was the hardest bug?"
  - "What would you improve?"

  This lesson gives you a 5-part structure and walks through Code Quest as your example.
analogy: |
  Explaining a project is like **showing a guest around the house you built**.

  - First, **why** you built it: "We needed space for the whole family" (the **problem**).
  - Then the **floor plan**: kitchen here, rooms upstairs, water tank on top (the **architecture**).
  - Then **what you did yourself**: "I designed the kitchen and did the wiring" (your **role**).
  - Then a **story**: "The roof leaked in the first monsoon; we found the crack and sealed it" (a **challenge**).
  - Finally, **plans**: "Next year we will add solar panels" (**improvements**).

  Nobody starts a house tour with the brand of cement. Start with the big picture.
