infosysRelevance: "Popular tricky output question; tracing static blocks, instance blocks and constructors across parent and child is good practice for SP and DSE output MCQs."
otherCompanies: "A favourite predict-the-output topic for TCS and product-company technical rounds."
why: |
  Imagine an output question with a parent class and a child class, each with a **static block**, an **instance block** and a **constructor**, all printing something. Which line comes first?

  This is one of the most popular "tricky output" questions in Java. It looks scary, but it follows **one fixed set of rules**. Once you learn the order, you can trace any version of it calmly, line by line.

  It also teaches you what really happens inside `new`, which helps with constructors, inheritance and debugging "why is this field still 0?" bugs.
analogy: |
  Think of a **new branch of a bank chain opening**, and then **customers opening accounts**.

  **Once per branch type (static, class level):**
  1. The **head office** rules are set up first (parent static block).
  2. Then the **branch's own** rules are set up (child static block).
  This happens **once**, the first time anyone needs that branch.

  **For every new customer account (instance level):**
  3. The **head office part** of the account is prepared first: its standard forms are filled (parent instance block), then the head office signs off (parent constructor).
  4. Then the **branch part**: branch forms (child instance block), then the branch manager signs off (child constructor).

  Second customer? Steps 3 and 4 again. Steps 1 and 2 never repeat.
