  options: [8 km East, 3 km East, 5 km North, 3 km West]
  answer: 1
  explanation: Start facing north, walk 5 km. Turning right from north means facing east; walk 3 km. Turning right from east
    means facing south; walk 5 km back down. He is now 3 km east of the start.
- id: apt-047
  section: LOGICAL
  topic: Direction Sense
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: A person walks 6 km east and then 8 km north. What is the shortest distance from the starting point?
  options: [12 km, 14 km, 10 km, 7 km]
  answer: 2
  explanation: The path makes a right-angled triangle. Shortest distance = square root of (6^2 + 8^2) = square root of (36
    + 64) = square root of 100 = 10 km.
- id: apt-048
  section: LOGICAL
  topic: Direction Sense
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: Meena is facing north. She turns 90 degrees clockwise and then 180 degrees anticlockwise. Which direction is she
    facing now?
  options: [North, South, East, West]
  answer: 3
  explanation: From north, 90 degrees clockwise is east. From east, 180 degrees anticlockwise (half turn) is west. So she
    faces west.
