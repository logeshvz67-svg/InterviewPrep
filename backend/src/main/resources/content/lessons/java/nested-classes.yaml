infosysRelevance: "A depth topic for SP: tests whether your OOP goes beyond the basics; inner-class syntax often appears in output and compile-error MCQs."
otherCompanies: "Asked more in product companies and higher-level Java rounds; service companies ask it less often, usually as 'static nested vs inner class'."
why: |
  You can declare a class **inside another class**. Java has four flavours, and each behaves differently:
  - **static nested class**
  - **inner class** (non-static)
  - **local class** (inside a method)
  - **anonymous class** (no name at all)

  Why it matters:
  - Real Java code uses them everywhere: `Map.Entry` is a static nested interface, `HashMap` uses an inner `Node` class, the **Builder pattern** uses a static nested class, and before lambdas every button click handler was an anonymous class.
  - Interview questions love the odd syntax: `outer.new Inner()`, `Outer.this.x`, and "why must the local variable be effectively final?"

  This lesson makes the four types clear with one picture.
analogy: |
  Think of a **big house** (the outer class).

  - A **static nested class** is like a **tenant's flat** built in the same compound. It shares the address (it lives inside the outer class's name), but it's independent: it doesn't need the owner family to exist.
  - An **inner class** is like a **family member's room** inside the house. A room can't exist without the house, and whoever is in the room can freely use the house's kitchen (the outer object's fields, even private ones).
  - A **local class** is like a **temporary pandal** set up in the courtyard for one function (one method). Outside that function, it doesn't exist.
  - An **anonymous class** is a **hired cook for one wedding**: no name card, hired on the spot for one job.
