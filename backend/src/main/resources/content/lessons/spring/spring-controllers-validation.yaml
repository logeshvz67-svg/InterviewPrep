patternCode: null
companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
infosysRelevance: "Hands-on core for SP and DSE: writing a REST endpoint with @PathVariable, @RequestParam, @RequestBody and @Valid is a typical practical Spring task and a common source of 'what is the difference' questions."
otherCompanies: "@PathVariable vs @RequestParam, @Controller vs @RestController and Bean Validation are standard questions at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies expect clean DTOs and correct 400 handling."
why: |
  The controller is the **front door** of your backend. Every request from the browser or mobile app enters here. If the door is careless, bad data walks straight into your database: empty names, negative prices, emails like "abc".

  In this lesson you rebuild, properly, the annotations you have probably copied before:
  - `@RestController`, `@GetMapping`, `@PostMapping`...
  - where values come from: **`@PathVariable`**, **`@RequestParam`**, **`@RequestBody`**,
  - **Bean Validation** with `@Valid`, `@NotBlank`, `@Email`, `@Size`, `@Min`,
  - **records as DTOs**.

  These are some of the most practical Spring interview questions, and your `backend` project uses every one of them.
analogy: |
  Think of a **railway reservation counter**.

  - The **counter clerk** is the controller. Different windows handle different jobs: "Booking" (POST), "Enquiry" (GET), "Cancellation" (DELETE). That is request mapping.
  - Your **PNR number** written on the ticket (`/tickets/4521`) identifies *which* ticket: a **path variable**.
  - Extra choices like "berth preference = lower" are **request parameters** (`?berth=lower`): optional extras.
  - The filled **reservation form** you hand over is the **request body**.
  - Before accepting the form, the clerk checks it: name not empty, age a valid number, phone has 10 digits. That is **validation**. A wrong form is handed back immediately (**400 Bad Request**) and never reaches the booking system (service).
