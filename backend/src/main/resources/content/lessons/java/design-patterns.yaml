  - front: "Why volatile in double-checked locking?"
    back: "Prevents reordering so no thread sees a half-built object."
  - front: "Factory pattern in one line"
    back: "A method that creates and returns the right implementation of an interface based on input, hiding the concrete class."
  - front: "Builder pattern in one line"
    back: "Chained methods set optional fields, then build() returns the (usually immutable) object."
  - front: "Observer pattern in one line"
    back: "Subject keeps a list of listeners and calls update() on all of them when something happens."
keyTakeaways:
  - "Design patterns are proven shapes of code for repeated problems."
  - "Singleton: private constructor + static instance; enum or holder idiom is the clean thread-safe way."
  - "Factory hides which class is created; callers depend on an interface."
  - "Builder replaces long constructors with readable chained calls."
  - "Observer notifies many listeners when one subject changes."
  - "Spring uses all four: singleton beans, bean factory, builders, event listeners."
