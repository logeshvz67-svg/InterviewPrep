why: |
  Time-and-work and time-speed-distance questions look long and scary: trains, pipes, boats, men working different hours. But they all use **one idea**: a **rate** (how much per unit of time).

  - Work: "A finishes in 12 days" means A does **1/12 of the work per day**.
  - Speed: "60 km/h" means **60 km per hour**.

  Once you think in rates, you add rates when people work together, subtract them when a pipe is emptying, and add or subtract speeds for trains and boats.

  This lesson gives the **LCM method** (no fractions), the **relative speed** idea, and the **average speed trap**, with many worked examples and Java checks.
analogy: |
  Think of **filling a water tank on your building's terrace**.

  - The motor pump fills it in 20 minutes: each minute it adds 1/20 of the tank.
  - Someone opened a tap below that empties it in 30 minutes: each minute it removes 1/30.
  - The tank's real filling speed is "pump minus tap".

  Work questions are the same: people are "pumps" adding work, and anything that undoes work is a "leak". Trains and boats are the same idea with distance instead of water.
