explanation: |
  ### Primitives and their wrapper classes
  A **primitive** is a plain value (`int`, `double`...). A **wrapper class** is a class whose object holds one primitive value. All wrappers live in `java.lang`.

  | Primitive | Wrapper |
  |---|---|
  | `byte` | `Byte` |
  | `short` | `Short` |
  | `int` | **`Integer`** |
  | `long` | `Long` |
  | `float` | `Float` |
  | `double` | `Double` |
  | `char` | **`Character`** |
  | `boolean` | `Boolean` |

  Watch the two odd names: `Integer` (not Int) and `Character` (not Char).

  Why wrappers?
  - **Collections and generics** only work with objects: `List<Integer>`, not `List<int>`.
  - A wrapper can be **`null`** ("no value yet"), a primitive can't.
  - Useful **utility methods**: `Integer.parseInt("42")`, `Integer.MAX_VALUE`, `Character.isDigit('7')`, `Integer.toBinaryString(5)`.

  Wrapper objects are **immutable**: an `Integer` object's value never changes. `count++` on an `Integer` creates/fetches a different object.

  ### Autoboxing and unboxing
  - **Autoboxing**: primitive -> wrapper, done automatically. `Integer x = 5;` becomes `Integer x = Integer.valueOf(5);`
  - **Unboxing**: wrapper -> primitive, done automatically. `int y = x;` becomes `int y = x.intValue();`

  ```java
  List<Integer> list = new ArrayList<>();
  list.add(10);            // autoboxing
  int first = list.get(0); // unboxing
  ```
  It happens in assignments, method calls, arithmetic (`x + 1` unboxes `x`), and comparisons like `<`, `>`.

  ### Trap 1: the Integer cache and `==`
  `Integer.valueOf(int)` keeps a **cache** of `Integer` objects for values **-128 to 127**. Autoboxing uses `valueOf`, so:
  ```java
  Integer a = 127, b = 127;
  System.out.println(a == b);       // true  (same cached object)

  Integer c = 128, d = 128;
  System.out.println(c == d);       // false (two different objects)
  System.out.println(c.equals(d));  // true  (same value)
  ```
  - `==` between two wrapper **objects** compares **references**, not values.
  - Inside the cache range, both variables point to the same object, so it *looks* like `==` works. Outside it, it fails. That's why this bug often hides until real data arrives.
  - Caches also exist for `Byte`, `Short`, `Long` (-128 to 127), `Character` (0 to 127) and `Boolean` (TRUE/FALSE). **`Float` and `Double` have no cache**.
  - `new Integer(5)` always makes a new object (it's deprecated; use `valueOf`).
  - The upper limit of the Integer cache can be raised with a JVM option, but the default is 127. Never rely on it.

  **Rule: compare wrapper values with `equals()`, or unbox first (`a.intValue() == b.intValue()`).**

  If **one side is a primitive**, `==` unboxes the wrapper and compares values:
  ```java
  Integer c = 128;
  int p = 128;
  System.out.println(c == p);   // true: c is unboxed to 128
  ```

  ### Trap 2: unboxing `null` gives NullPointerException
  ```java
  Integer marks = null;
  int m = marks;        // compiles, but runs marks.intValue() -> NullPointerException
  ```
  Common real places this hides:
  - `Map<String, Integer> map ...; int c = map.get("missing");` because `get` returns `null` for a missing key.
  - `if (count > 0)` where `count` is a null `Integer`.
  - A method returning `Integer` that returns `null`, assigned to an `int`.

  Fix: check for null, or use `map.getOrDefault(key, 0)`.

  ### Trap 3: `equals()` across types
  ```java
  Long big = 10L;
  Integer small = 10;
  System.out.println(big.equals(small));   // false: different classes
  System.out.println(big.equals(10L));     // true
  ```
  Wrapper `equals()` is true only if the other object is the **same wrapper type** with the same value.

  ### parseXxx vs valueOf
  | Method | Returns | Example |
  |---|---|---|
  | `Integer.parseInt("42")` | primitive `int` | 42 |
  | `Integer.valueOf("42")` | `Integer` object (uses cache) | 42 |
  | `Integer.parseInt("4x")` | throws `NumberFormatException` | |

  ### Performance note
  Boxing creates objects. In a tight loop, `Long sum = 0L; sum += i;` boxes on every step and is much slower than `long sum = 0;`. Use primitives for heavy number crunching; use wrappers when you need collections or null.
tinyCode:
  code: |
    import java.util.*;

    public class Main {
        public static void main(String[] args) {
            Integer a = 127, b = 127;
            Integer c = 128, d = 128;
            System.out.println(a == b);
            System.out.println(c == d);
            System.out.println(c.equals(d));

            List<Integer> marks = new ArrayList<>();
            marks.add(90);
            int first = marks.get(0);
            System.out.println(first + 5);

            Map<String, Integer> stock = new HashMap<>();
            int rice = stock.getOrDefault("rice", 0);
            System.out.println("rice = " + rice);
            System.out.println(Integer.parseInt("42") + 1);
        }
    }
  walkthrough: |
    - `a` and `b` are both 127, inside the cache, so they point to the **same** object: `true`.
    - `c` and `d` are 128, outside the cache, so two different objects: `==` is `false`, but `equals()` compares values: `true`.
    - `marks.add(90)` **autoboxes** 90 into an Integer. `int first = marks.get(0)` **unboxes** it.
    - `getOrDefault("rice", 0)` returns 0 instead of `null` for a missing key, so unboxing is safe. Plain `int rice = stock.get("rice");` would throw a NullPointerException.
    - `Integer.parseInt("42")` turns text into an `int`.

    Output:
    ```
    true
    false
    true
    95
    rice = 0
    43
    ```
