infosysRelevance: "Core for SP and DSE: JPA vs Hibernate, JpaRepository, derived query methods, @Query and one-to-many mapping with mappedBy are standard Spring Data practice topics."
otherCompanies: "A very common area at TCS, Wipro, Cognizant, Accenture and Capgemini ('JPA vs Hibernate', 'CrudRepository vs JpaRepository'); product companies dig into the owning side, cascade and orphanRemoval."
why: |
  Almost every backend stores data in a relational database. Writing raw SQL plus JDBC code for every insert and select is long and repetitive. **JPA** lets you work with **Java objects**, and **Spring Data JPA** even writes the repository code for you from a method name like `findByEmail`.

  In interviews, this is one of the busiest Spring areas:
  - "What is the difference between JPA, Hibernate and Spring Data JPA?"
  - "How does `findByEmailAndCity` work without any code?"
  - "Explain `@OneToMany(mappedBy = ...)`. What is the owning side? What do cascade and orphanRemoval do?"

  Your `backend` project has real examples of all of these, so you can explain them with confidence.
analogy: |
  Think of a **school register**.

  - Each **page format** (columns: roll number, name, class) is like an **entity class**; each **filled row** is one entity object = one table row. The **roll number** is the `@Id`.
  - The **class teacher** who reads and updates the register for you is the **repository**. You just say "give me the student with roll number 12" or "all students from Pune"; the teacher knows how to search. That is `findById` and `findByCity`.
  - A **class** has **many students**, and each student belongs to **one class**. The student's row has a "class" column: the student row **owns** the link (it holds the foreign key). The class page only *refers back* to its students (`mappedBy`).
  - **Cascade** is like: "when the class is enrolled, enrol its students too". **orphanRemoval** is: "if a student is removed from the class list, strike them off the register completely".
