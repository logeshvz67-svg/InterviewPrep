    options: ["10", "6", "7", "12"]
    answer: 0
    explanation: "Steps: 5 -> best 5; 1 -> max(5, 0+1) = 5; 1 -> max(5, 5+1) = 6; 5 -> max(6, 5+5) = 10. Rob the first and last houses. 6 is the 'alternate houses' guess (5 + 1); 12 robs neighbours, which is not allowed."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "O(n^2) LIS where dp[i] = length of the longest increasing subsequence ending at i. What is printed?"
    code: |
      int[] a = {10, 9, 2, 5, 3, 7, 101, 18};
      int[] dp = new int[a.length];
      int best = 0;
      for (int i = 0; i < a.length; i++) {
          dp[i] = 1;
          for (int j = 0; j < i; j++) {
              if (a[j] < a[i]) dp[i] = Math.max(dp[i], dp[j] + 1);
          }
          best = Math.max(best, dp[i]);
      }
      System.out.println(best + " " + Arrays.toString(dp));
    options: ["4 [1, 1, 1, 2, 2, 3, 4, 4]", "4 [1, 2, 3, 4, 5, 6, 7, 8]", "3 [1, 1, 1, 2, 2, 3, 4, 4]", "5 [1, 1, 1, 2, 2, 3, 4, 5]"]
    answer: 0
    explanation: "10, 9, 2 each start fresh (1). 5 extends 2 (2). 3 extends 2 (2). 7 extends 5 or 3 (3). 101 extends 7 (4). 18 also extends 7 (4), not 101. The best is 4, e.g. 2, 5, 7, 101. 18 can't be 5 because 18 < 101."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "1D 0/1 knapsack with one item (weight 2, value 3) and capacity 6. It prints 9, but the item can be taken only once (answer 3). What is wrong?"
    code: |
      int[] k = new int[W + 1];
      for (int i = 0; i < wt.length; i++)
          for (int w = wt[i]; w <= W; w++)
              k[w] = Math.max(k[w], k[w - wt[i]] + val[i]);
      System.out.println(k[W]);
    options:
      - "k should be size W instead of W + 1"
      - "The capacity loop runs low to high, so k[w - wt[i]] may already include this same item; loop w from W down to wt[i]"
      - "Math.max should be Math.min"
      - "The outer and inner loops must be swapped"
    answer: 1
    explanation: "Going upward, k[2] = 3, then k[4] = k[2] + 3 = 6 reuses the item, and k[6] = 9 uses it three times. That's the unbounded knapsack. Looping w downward reads only values from before this item was considered, so each item is used at most once and k[6] = 3."
  - id: q4
    type: MCQ
    prompt: "What is the time complexity of the plain recursive fib(n) (no memo), and with memoization?"
    code: null
    options: ["O(n) and O(n)", "O(2^n) and O(n)", "O(n^2) and O(n)", "O(2^n) and O(log n)"]
    answer: 1
    explanation: "Without memo, each call spawns two more, so calls grow roughly like 2^n (fib(5) already makes 15 calls). With memo each n from 0 to n is computed once: O(n). O(log n) is possible only with matrix exponentiation, not plain memoization."
  - id: q5
    type: TRUE_FALSE
    prompt: "Memoization (top-down) and tabulation (bottom-up) usually have the same time complexity for a problem."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Both solve each state once, so time = number of states x work per state. They differ in practical details: recursion overhead and stack depth for memo, and the ability to compress space for tabulation."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Climbing stairs (1 or 2 steps at a time): fill the recurrence."
    code: |
      dp[0] = 1; dp[1] = 1;
      for (int i = 2; i <= n; i++) {
          dp[i] = ____;
      }
    acceptedAnswers: ["dp[i - 1] + dp[i - 2]", "dp[i-1]+dp[i-2]", "dp[i - 2] + dp[i - 1]", "dp[i-2]+dp[i-1]"]
    explanation: "The last move into step i was either 1 step (from i-1) or 2 steps (from i-2). The ways add up because those are different paths. Using max instead of + would answer a different question."
