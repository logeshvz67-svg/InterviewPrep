  - front: "Unit vs integration test"
    back: "Unit: one class, mocked dependencies, no Spring, fast. Integration: real context (+ DB), layers together, slower."
  - front: "Mockito core trio"
    back: "@Mock (create), when(...).thenReturn(...) (program), verify(...)/never() (check calls)."
  - front: "Default return values of an unstubbed mock"
    back: "null for objects, 0/false for primitives, empty Optional/List/collections."
  - front: "Flyway rules"
    back: "V<n>__desc.sql runs once, in order, tracked in flyway_schema_history with checksums. Never edit applied files; add a new version."
  - front: "Docker image vs container"
    back: "Image: read-only package (built from a Dockerfile). Container: a running instance of an image."
  - front: "Microservices building blocks"
    back: "API gateway, service discovery, config server, DB per service, REST/messaging, circuit breaker, tracing, saga."
keyTakeaways:
  - "Unit tests (JUnit 5 + Mockito) check one class fast; integration tests (@SpringBootTest + MockMvc) check the layers together."
  - "Constructor injection makes unit testing easy: just new the class with mocks."
  - "Flyway runs numbered migrations once and in order; never edit an applied migration."
  - "A multi-stage Dockerfile builds with Maven and ships a small, non-root JRE image."
  - "Start with a well-layered monolith; microservices trade simplicity for independent scaling and deployment."
