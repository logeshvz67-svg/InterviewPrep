explanation: |
  ### Key words first
  - **IO** = Input/Output. *Input* means reading data into your program; *output* means writing data out.
  - **Stream** = a one-way flow of data, piece by piece.
  - **Checked exception** = an exception the compiler forces you to handle. File methods throw `IOException`, which is checked, so you must use `try/catch` or add `throws IOException`.

  ### Two families of streams (java.io)
  | | Works with | Read class | Write class | Use for |
  |---|---|---|---|---|
  | **Byte streams** | raw bytes (0-255) | `InputStream`, `FileInputStream` | `OutputStream`, `FileOutputStream` | images, PDFs, any binary file |
  | **Character streams** | characters (text) | `Reader`, `FileReader` | `Writer`, `FileWriter` | `.txt`, `.csv`, `.json` |

  Simple rule: **text = Reader/Writer, everything else = InputStream/OutputStream.** Character streams handle the *encoding* (how letters become bytes, for example UTF-8) for you.

  ### Buffering: the speed trick
  Reading one character at a time from disk is slow. **Buffered** classes read a big block into memory and hand it out piece by piece.
  ```java
  BufferedReader br = new BufferedReader(new FileReader("notes.txt"));
  String line = br.readLine(); // one full line, or null at end of file
  ```
  Wrapping one stream inside another like this is called the **decorator** idea: each layer adds a feature.

  ### Always close: try-with-resources
  An open file holds an operating-system **file handle**. If you never close it, you leak handles, and a `BufferedWriter` may never **flush** (push its bucket to disk), so your file stays empty.

  **Try-with-resources** (Java 7+) closes things automatically, even if an exception happens:
  ```java
  try (BufferedWriter bw = new BufferedWriter(new FileWriter("out.txt"))) {
      bw.write("Hello");
      bw.newLine();
  } // bw.close() is called here automatically
  ```
  Any class that implements `AutoCloseable` can go in those brackets.

  ### Overwrite vs append
  `new FileWriter("log.txt")` **overwrites** (empties the file first). To add to the end, use `new FileWriter("log.txt", true)`. The `true` means *append*.

  ### The modern way: java.nio.file
  Java 7 added **NIO** (New IO). For small and medium files it is much shorter:
  ```java
  Path p = Path.of("notes.txt");            // a path to a file
  Files.writeString(p, "line1\nline2\n");   // write (overwrites)
  List<String> lines = Files.readAllLines(p); // read all lines
  String all = Files.readString(p);          // read whole file
  boolean there = Files.exists(p);
  ```
  - `Files.lines(p)` gives a `Stream<String>` for big files (read lazily, close it with try-with-resources).
  - Add `StandardOpenOption.APPEND` to append instead of overwrite.

  ### The File class
  `java.io.File` represents a **path**, not the content. Use it for checks like `exists()`, `isDirectory()`, `length()`, `delete()`, `listFiles()`. Newer code prefers `Path` + `Files`.

  ### Which one should I use?
  | Situation | Good choice |
  |---|---|
  | Small text file, read all at once | `Files.readAllLines` / `Files.readString` |
  | Huge text file, line by line | `BufferedReader` or `Files.lines` |
  | Image / binary file | `FileInputStream` / `Files.readAllBytes` |
  | Read user input from keyboard | `Scanner(System.in)` or `BufferedReader(new InputStreamReader(System.in))` |

  ### Fast input in coding rounds
  In online coding tests, `BufferedReader` with `InputStreamReader(System.in)` is faster than `Scanner` for very large inputs. This is the same buffering idea applied to the keyboard.
tinyCode:
  code: |
    import java.io.*;
    import java.nio.file.*;
    import java.util.List;

    public class FileDemo {
        public static void main(String[] args) throws IOException {
            Path path = Path.of("fruits.txt");

            // 1. Write three lines (creates or overwrites the file)
            try (BufferedWriter bw = Files.newBufferedWriter(path)) {
                bw.write("mango");
                bw.newLine();
                bw.write("banana");
                bw.newLine();
                bw.write("guava");
            }

            // 2. Read line by line with BufferedReader
            try (BufferedReader br = new BufferedReader(new FileReader("fruits.txt"))) {
                String line;
                int n = 1;
                while ((line = br.readLine()) != null) {
                    System.out.println(n + ": " + line);
                    n++;
                }
            }

            // 3. The short NIO way
            List<String> all = Files.readAllLines(path);
            System.out.println("Total lines = " + all.size());
        }
    }
  walkthrough: |
    - `Path.of("fruits.txt")` makes a path to a file in the current folder.
    - `Files.newBufferedWriter(path)` opens a buffered writer. It **creates** the file, or **overwrites** it if it exists.
    - `try ( ... )` is **try-with-resources**: when the block ends, `bw.close()` runs automatically, which also **flushes** the buffer to disk.
    - `newLine()` writes a line break.
    - `new BufferedReader(new FileReader(...))`: a reader pipe wrapped in a bucket.
    - `while ((line = br.readLine()) != null)` is the classic loop: read a line, store it in `line`, and stop when `readLine()` returns `null` (end of file).
    - `Files.readAllLines(path)` reads everything into a `List<String>` in one call.

    Output:
    ```
    1: mango
    2: banana
    3: guava
    Total lines = 3
    ```
tryIt:
  instructions: "Type this program. It writes a small marks file and then reads it back to compute the total. Change a mark, run again, and see the total change."
  code: |
    import java.nio.file.*;
    import java.util.List;

    public class Marks {
        public static void main(String[] args) throws Exception {
            Path p = Path.of("marks.txt");
            Files.writeString(p, "Asha,78\nRavi,91\nMeena,85\n");

            List<String> lines = Files.readAllLines(p);
            int total = 0;
            for (String line : lines) {
                String[] parts = line.split(",");
                int mark = Integer.parseInt(parts[1]);
                System.out.println(parts[0] + " scored " + mark);
                total += mark;
            }
            System.out.println("Total = " + total);
        }
    }
