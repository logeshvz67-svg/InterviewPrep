keyTakeaways:
  - "Sliding window = continuous subarray/substring + add new, remove old."
  - "Fixed size k: one pass with sum += arr[i] - arr[i - k]."
  - "Variable size: grow with right, shrink with left while the window is invalid."
  - "O(n) because each element enters and leaves at most once."
  - "Negatives break sum-based windows; use prefix sums + HashMap instead."
