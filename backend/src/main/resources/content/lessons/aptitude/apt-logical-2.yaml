infosysRelevance: "Infosys-style basics practice: seating arrangements, syllogisms and grid puzzles train careful, rule-by-rule reasoning, which is also how you handle constraints in coding problems."
otherCompanies: "Arrangements, syllogisms and puzzles are common practice topics in reasoning sections for TCS, Wipro, Cognizant, Accenture and Capgemini style tests."
why: |
  These questions give you many small clues and ask you to build the full picture. People lose time because they **read clues in the given order** and try to keep everything in their head.

  The winning method is the same for all three types:
  1. **Draw** (a row, a circle, a Venn diagram, or a grid).
  2. **Place the fixed clues first** ("R sits in the middle"), then the relative ones ("T is to the left of R"), then the negative ones ("S is not next to R").
  3. **Check every clue** at the end.

  This is also how a computer solves puzzles: try possibilities and reject those that break a rule. You will write a small Java **brute-force** solver, which is great practice for backtracking in DSA.
analogy: |
  Think of **arranging guests at a wedding dinner table**.

  - Some instructions are fixed: "Grandmother sits at the head of the table." Place her first.
  - Some are relative: "Her son sits on her right."
  - Some are negative: "The two uncles who fought last Diwali must not sit together." Use these last, to choose between the remaining options.

  If you start with "the uncles must not sit together", you have too many possibilities. Start with the fixed seat, and the rest falls into place.
