infosysRelevance: "Depth topic for SP: the three built-in class loaders, the delegation model and when static blocks run are good follow-ups to 'How does the JVM work?'."
otherCompanies: "Asked in product-company JVM discussions; static-block order questions also appear in output-prediction practice everywhere."
why: |
  In the very first lesson you saw that the JVM has a **class loader** that "loads `.class` files into memory". This lesson opens that box.

  Why it matters:
  - Interviewers ask **"What are the types of class loaders?"** and **"What is the delegation model?"**
  - It explains **when a static block runs** (a common predict-the-output question).
  - It explains two famous errors: **`ClassNotFoundException`** and **`NoClassDefFoundError`**, which you'll definitely meet in real projects when a JAR is missing.
  - It's also why nobody can sneak in a fake `java.lang.String` class.
analogy: |
  Think of a **company with a three-level approval chain** for borrowing equipment.

  - You ask your **team lead** (Application class loader) for a laptop.
  - The team lead **first asks the department head** (Platform class loader), who **first asks the head office store** (Bootstrap class loader).
  - If head office has it (like `String`), head office gives it. Only if head office says "not mine" does the department head check, and only if *they* say no does the team lead look in the team's own cupboard (your classpath).

  This "ask your boss first" rule is the **parent delegation model**. It keeps things safe: the official `java.lang.String` always comes from head office, never from someone's cupboard.

  And equipment is fetched **only when someone actually needs it** (lazy loading), not on the first day for everyone.
