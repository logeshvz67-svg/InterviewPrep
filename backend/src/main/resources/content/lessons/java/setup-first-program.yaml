title: "Setup and your first program"
version: 1
estimatedMinutes: 25
rebuild: true
patternCode: null
companies: [ALL]
infosysRelevance: "Foundation for every coding round: you must be able to write main(), print output exactly, and compile and run without an IDE."
otherCompanies: "Every company's coding round expects a correct class with main and exact output formatting. Theory rounds often ask why main is public static void."
why: |
  In a coding test you do not get marks for an idea. You get marks when your program **compiles, runs and prints exactly the right output**.

  Many beginners lose easy marks because of tiny setup problems:
  - the class name does not match what the platform expects,
  - an extra space or missing newline in the output,
  - a missing semicolon or bracket that they cannot find quickly without an IDE.

  This lesson makes you comfortable with the full cycle: **install the JDK, write `main`, compile, run, read the error, fix it**. It also prepares you for the classic question: *"Explain `public static void main(String[] args)` word by word."*
analogy: |
  Think of starting your program like **starting a cricket match**.

  - The **stadium** is the JDK installed on your computer. Without it, there is no match.
  - The **team sheet** is your `.java` file: who plays and what they do.
  - The **umpire** checking the team sheet before the match is the compiler (`javac`). If a name is misspelt, the match does not start.
  - The **first ball** is always bowled from one fixed place: the `main` method. The JVM always starts there, no matter how many other methods you write.
  - The **scoreboard** is `System.out.println`: the only thing the audience (the test platform) actually sees.
