infosysRelevance: "Infosys-style practice: SP and DSE candidates are expected to explain Java, OOP, DSA and SQL clearly and write simple code by hand or on a shared screen. How you answer matters as much as what you know."
otherCompanies: "Technical rounds at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies all reward structured explanations, thinking aloud and honest 'I don't know' answers."
why: |
  You have spent many hours learning Java. The technical round is where that work turns into an offer, **if you can show it**.

  Many beginners know the answer but lose marks because:
  - they give a one-word answer ("HashMap stores key-value") and stop,
  - they go silent for 30 seconds while thinking,
  - they bluff when they do not know, and the interviewer catches it with one follow-up.

  This lesson gives you three habits that fix all of this: **Concept-Example-Use case**, **thinking aloud**, and **honest "I don't know"**. Plus how to write code on paper and survive follow-up questions.
analogy: |
  Think of a **good doctor explaining a report** to a patient.

  - A bad doctor says "Hb low" and writes a prescription. The patient is confused.
  - A good doctor says: "**Hemoglobin** carries oxygen in your blood (concept). Yours is 9; normal is about 12 or more (example). That is why you feel tired on the stairs (use case). We will fix it with iron tablets."
  - If the good doctor is unsure, they say "Let me check with a specialist", not a made-up answer.

  The interviewer is your patient. Explain like the good doctor.
