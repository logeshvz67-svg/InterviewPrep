          best = Math.max(best, right - left + 1);
      }
      System.out.println(best);
    options: ["2", "3", "4", "1"]
    answer: 1
    explanation: "right=0 'd': window \"d\" (1). right=1 'v': \"dv\" (2). right=2 'd' repeats at 0, so left = 1: \"vd\" (2). right=3 'f': \"vdf\" (3). Answer 3. A common wrong idea is to restart the window completely at a repeat, which would give 2."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "This longest-unique-substring code returns 3 for \"abba\", but the right answer is 2. What is the bug?"
    code: |
      String s = "abba";
      Map<Character, Integer> last = new HashMap<>();
      int left = 0, best = 0;
      for (int right = 0; right < s.length(); right++) {
          char c = s.charAt(right);
          if (last.containsKey(c)) left = last.get(c) + 1;
          last.put(c, right);
          best = Math.max(best, right - left + 1);
      }
      System.out.println(best);
    options:
      - "The window length should be right - left"
      - "left can move backwards: when the last 'a' arrives, left is set to 1 even though it was already 2; use Math.max(left, last.get(c) + 1)"
      - "HashMap cannot store char keys"
      - "best should start at 1"
    answer: 1
    explanation: "At right=2 ('b'), left becomes 2. At right=3 ('a'), the old 'a' is at index 0, outside the window, but the code sets left = 1, moving it backwards. The window \"bba\" (length 3) contains a repeat. Math.max keeps left at 2 and the answer becomes 2. right - left + 1 is the correct length formula, and chars autobox to Character keys."
  - id: q4
    type: TRUE_FALSE
    prompt: "The shrinking variable-window technique for 'smallest subarray with sum >= S' works correctly even when the array contains negative numbers."
    options: ["True", "False"]
    answer: 1
    explanation: "False. The technique assumes removing an element from the left makes the sum smaller. A negative number breaks that: removing it makes the sum bigger. With negatives, use prefix sums (and a structure like a HashMap or deque, depending on the problem)."
