explanation: |
  ### Where the diary lives
  In Code Quest, open **Interview Colosseum -> Interview diary**. Each entry has:
  | Field | What to write |
  |---|---|
  | **Company** | The company, or "Mock" for a boss fight or practice with a friend |
  | **Round** | HR, Technical, Project, Managerial... |
  | **Date** | The interview date |
  | **Question** | The question in the interviewer's words, as close as you remember |
  | **My answer** | What you **actually** said, honestly, even if it was bad |
  | **Better answer** | A calm, improved answer written afterwards |
  | **Tags** | Comma-separated labels, e.g. `oop, project, weak` |

  You can search by company, round, question or tag with the filter box.

  ### Rule 1: Write it the same day
  Memory fades fast. Within a few hours of an interview (real or mock), spend 15 minutes:
  1. List **every question** you remember. Even "small" ones like "Where are you from?"
  2. Write **your real answer** for each. Honesty here is for you only; nobody else sees it.
  3. Tag the weak ones with `weak`.

  ### Rule 2: Write the better answer properly
  A better answer is not just "I should have said more". Rebuild it with the structures from this world:
  - HR question -> **Present-Past-Future** or **STAR**.
  - Technical question -> **Concept-Example-Use case**.
  - Project question -> **Problem, Architecture, My role, Challenge, Improvements**.

  Keep it in **simple English**, short sentences, something you can actually say in 30-90 seconds. If you did not know the facts, **look them up** in the lessons first, then write.

  > **Question**: What is the difference between HashMap and Hashtable?
  > **My answer**: "Both store keys and values... umm... Hashtable is old."
  > **Better answer**: "There are two main differences. First, Hashtable is synchronized, so it is thread-safe but slower; HashMap is not synchronized. Second, HashMap allows one null key and null values; Hashtable allows no nulls. So, in short, I use HashMap normally, and ConcurrentHashMap when many threads share the map."

  ### Rule 3: Spaced review of weak answers
  **Spaced review** means revising something again just before you forget it, with the gap growing each time: for example **day 1, day 3, day 7, day 14**. Each successful recall makes the memory stronger and longer-lasting. It is the same idea as the app's flashcards (1/3/7/14/30 days).

  How to do it:
  - Filter the diary by the tag `weak`.
  - Read the **question only**. Cover the better answer.
  - **Say your answer aloud** (or record it in the Communication Gym).
  - Compare with the better answer. Good enough three times in a row? Remove the `weak` tag and add `solid`.
  - For the most important ones, add a card in **Recall -> flashcards** (front: the question, back: the key points). The app then schedules the review for you automatically.

  ### Rule 4: Look for patterns
  Once you have 15-20 entries, read them together. You might notice:
  - "I always struggle with **collections** questions" -> go back to those Java lessons.
  - "My HR answers are always **too long**" -> practise the 90-second limit.
  - "I panic on **coding on paper**" -> do more dry-runs.
  Tags make this easy: count how many `weak` entries each topic tag has.

  ### Honesty note
  The diary is for **your own** learning. Never share or post real interview questions as "the exact questions of company X"; questions vary, and companies ask candidates to keep processes confidential. Use what you learn to **improve your understanding**, not to memorise a question list.
tinyCode:
  code: |
    DIARY ENTRY TEMPLATE

    Company:  ____________     Round: ____________
    Date:     ____________
    Question: ____________________________________

    My answer (what I really said):
      ____________________________________________

    Better answer (structure: PPF / STAR / CEU / 5-part):
      ____________________________________________

    Tags: ____________, weak
  walkthrough: |
    - **Company / Round / Date** let you filter later ("show me all my Technical rounds").
    - **Question** in the interviewer's words helps you remember the situation.
    - **My answer** must be the honest version. You cannot fix a mistake you hide from yourself.
    - **Better answer** names the structure you will use. Choosing the structure first makes writing easy.
    - **Tags**: one topic tag (like `collections`) plus `weak` if it needs review. The topic tag finds patterns; `weak` drives spaced review.
tryIt:
  instructions: "Type this spaced-review checklist. Put a copy near your study place and follow it for every 'weak' diary entry."
  code: |
    SPACED REVIEW CHECKLIST (for every "weak" entry)

    [ ] Day 1:  read question, cover answer, SAY it aloud
    [ ] Day 3:  say it aloud again, compare
    [ ] Day 7:  record it in the Communication Gym
    [ ] Day 14: say it without looking, under 90 seconds

    Good 3 times in a row?  -> change tag "weak" to "solid"
    Very important?         -> add it as a flashcard in Recall
