infosysRelevance: "Subqueries power the classic practice problems (above-average salary, highest per department, rows with no match); important for SP and DSE SQL rounds."
otherCompanies: "Common in TCS, Wipro, Cognizant, Accenture and Capgemini technical interviews; product companies like the NOT IN with NULL trap and EXISTS vs IN."
why: |
  Some questions need **two steps**: "Who earns more than the **average** salary?" First you find the average, then you compare each employee with it. A **subquery** lets you do both steps in one statement.

  Interviewers use subqueries to check:
  - whether you can break a problem into steps,
  - whether you know **IN vs EXISTS**,
  - whether you know the dangerous **NOT IN with NULL** trap,
  - whether you understand a **correlated** subquery (one that runs once per row).
analogy: |
  Think of asking a friend at a canteen: **"Get me whatever costs less than the masala dosa."**

  First your friend must check the price of a masala dosa (the **inner question**, the subquery). Then they scan the menu and pick items cheaper than that price (the **outer question**).

  A **correlated subquery** is like asking: "For **each** student, tell me if they scored above **their own class** average." Your friend must calculate a *different* average for every student, depending on which class that student is in. The inner question changes with each outer row.
visual:
  diagram: |
    Non-correlated (runs ONCE)
      SELECT name FROM employees
      WHERE salary > ( SELECT AVG(salary) FROM employees )
                       '-------------- 65714.28 --------'
      -> compare every row with the same number

    Correlated (runs once PER OUTER ROW)
      outer row e        inner query uses e.dept_id      result
      Asha  (10) 90000 -> AVG of dept 10 = 81666.67  ->  keep
      Ravi  (10) 75000 -> AVG of dept 10 = 81666.67  ->  drop
      Priya (20) 60000 -> AVG of dept 20 = 60000     ->  drop
      Meena (30) 50000 -> AVG of dept 30 = 50000     ->  drop
      Arjun (NULL)     -> AVG of NULL dept = NULL    ->  drop
  caption: "A normal subquery is calculated once. A correlated subquery refers to the outer row (e.dept_id), so it is re-calculated for each employee."
