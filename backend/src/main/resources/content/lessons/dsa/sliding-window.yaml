explanation: |
  ### Key words
  - **Subarray / substring**: a **continuous** part. In `[2, 1, 5]`, `[1, 5]` is a subarray but `[2, 5]` is not.
  - **Window**: the current subarray, from index `left` to index `right`.

  ### Type 1: fixed-size window
  The window size **k** is given. Build the first window, then slide one step at a time.

  **Maximum sum of any k consecutive elements**
  ```java
  int windowSum = 0;
  for (int i = 0; i < k; i++) windowSum += arr[i];   // first window
  int best = windowSum;
  for (int i = k; i < arr.length; i++) {
      windowSum += arr[i] - arr[i - k];   // add new, remove old
      best = Math.max(best, windowSum);
  }
  ```
  - Brute force sums k elements for each of n windows: **O(n * k)**.
  - Sliding: each step is one add and one subtract: **O(n)**.
  - `arr[i - k]` is the element that just **left** the window.

  ### Type 2: variable-size window
  The size is not given; you want the **longest** or **shortest** window that satisfies a rule.

  **Template**
  ```java
  int left = 0;
  for (int right = 0; right < n; right++) {
      // 1. add arr[right] to the window state
      while (window is invalid) {
          // 2. remove arr[left] from the state
          left++;
      }
      // 3. window [left..right] is valid: update the answer
  }
  ```
  For "shortest window that satisfies X", you update the answer **inside** the while loop (while it is still valid) and then shrink.

  **Longest substring without repeating characters**
  ```java
  Map<Character, Integer> lastSeen = new HashMap<>();
  int left = 0, best = 0;
  for (int right = 0; right < s.length(); right++) {
      char c = s.charAt(right);
      if (lastSeen.containsKey(c)) {
          left = Math.max(left, lastSeen.get(c) + 1);  // jump past the old copy
      }
      lastSeen.put(c, right);
      best = Math.max(best, right - left + 1);
  }
  ```
  - The window length is `right - left + 1`.
  - `Math.max(left, ...)` matters: the old copy of `c` may already be **outside** the window (to the left of `left`). Without `max`, `left` could jump **backwards**. Try `"abba"`: the answer must be 2.

  **Smallest subarray with sum >= S** (all numbers positive)
  ```java
  int left = 0, sum = 0, best = Integer.MAX_VALUE;
  for (int right = 0; right < n; right++) {
      sum += arr[right];
      while (sum >= S) {
          best = Math.min(best, right - left + 1);
          sum -= arr[left++];
      }
  }
  ```

  ### Why is the variable window O(n)?
  It looks like a loop inside a loop, but `left` only moves **forward** and never more than n times in total. Each element is **added once** (by `right`) and **removed at most once** (by `left`): at most 2n steps = **O(n)**.

  ### When does sliding window NOT work?
  The shrink step assumes that making the window smaller makes it "more valid" (for example, smaller sum). With **negative numbers**, removing an element can *increase* the sum, so the logic breaks. For "subarray sum equals k" with negatives, use **prefix sums + HashMap** (next lesson).

  ### How to recognise it
  | Clue | Window type |
  |---|---|
  | "subarray/substring of size k" | fixed |
  | "longest/shortest subarray/substring such that..." | variable |
  | "at most K distinct / at most K zeros / no repeats" | variable |
  | all values positive + sum condition | variable |

  ### Complexity
  | Problem | Brute force | Sliding window |
  |---|---|---|
  | Max sum of k | O(n * k) | O(n) time, O(1) space |
  | Longest unique substring | O(n^2) or O(n^3) | O(n) time, O(alphabet) space |
tinyCode:
  code: |
    import java.util.HashMap;
    import java.util.Map;

    public class SlidingWindow {
        // fixed window
        static int maxSumOfK(int[] arr, int k) {
            int windowSum = 0;
            for (int i = 0; i < k; i++) windowSum += arr[i];
            int best = windowSum;
            for (int i = k; i < arr.length; i++) {
                windowSum += arr[i] - arr[i - k];
                best = Math.max(best, windowSum);
            }
            return best;
        }

        // variable window
        static int longestUnique(String s) {
            Map<Character, Integer> lastSeen = new HashMap<>();
            int left = 0, best = 0;
            for (int right = 0; right < s.length(); right++) {
                char c = s.charAt(right);
                if (lastSeen.containsKey(c)) {
                    left = Math.max(left, lastSeen.get(c) + 1);
                }
                lastSeen.put(c, right);
                best = Math.max(best, right - left + 1);
            }
            return best;
        }

        public static void main(String[] args) {
            System.out.println(maxSumOfK(new int[]{2, 1, 5, 1, 3, 2}, 3));
            System.out.println(longestUnique("abcabcbb"));
            System.out.println(longestUnique("pwwkew"));
            System.out.println(longestUnique("abba"));
        }
    }
  walkthrough: |
    **maxSumOfK** (fixed):
    - First window `2 + 1 + 5 = 8`.
    - Slide: `+1 -2 = 7`, `+3 -1 = 9`, `+2 -5 = 6`. The best is **9**.

    **longestUnique** (variable):
    - `lastSeen` remembers the last index where each character appeared.
    - If `c` was seen inside the current window, `left` jumps to just after that old position, so the window has no repeats again.
    - `right - left + 1` is the current window length.
    - `"abcabcbb"` gives 3 ("abc"), `"pwwkew"` gives 3 ("wke"), `"abba"` gives 2 ("ab" or "ba"). The `Math.max` protects `"abba"`: when the last `a` comes, its old index 0 is already outside the window.

    Output:
    ```
    9
    3
    3
    2
    ```
tryIt:
  instructions: "Type this fixed-window program: the maximum number of vowels in any substring of length k. Run it, then try k = 2 and k = 5."
  code: |
    public class MaxVowels {
        static boolean isVowel(char c) {
            return "aeiou".indexOf(c) >= 0;
        }

        public static void main(String[] args) {
            String s = "abciiidef";
            int k = 3;
            int count = 0;
            for (int i = 0; i < k; i++) {
                if (isVowel(s.charAt(i))) count++;
            }
            int best = count;
            for (int i = k; i < s.length(); i++) {
                if (isVowel(s.charAt(i))) count++;       // entering
                if (isVowel(s.charAt(i - k))) count--;   // leaving
                best = Math.max(best, count);
            }
            System.out.println("Max vowels in a window of " + k + " = " + best);
        }
    }
