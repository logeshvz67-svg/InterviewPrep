title: "OS: memory, paging and virtual memory"
version: 1
estimatedMinutes: 40
rebuild: true
patternCode: null
companies: [ALL]
infosysRelevance: "Paging, page faults and page replacement numericals (FIFO, LRU, Optimal) are important OS practice for SP and DSE technical rounds."
otherCompanies: "Virtual memory and thrashing are common basic questions for TCS, Wipro, Cognizant, Accenture and Capgemini; product companies also ask about TLB and LRU (which links to the LRU cache DSA problem)."
why: |
  Every program believes it has a huge, private, continuous memory. In reality RAM is small, shared and chopped into pieces. **Virtual memory and paging** are the magic tricks that make this work.

  Interviewers ask about it because:
  - "What is paging / virtual memory / a page fault?" are classic definitions,
  - **page replacement numericals** (count the page faults for FIFO, LRU, Optimal) are very common practice problems,
  - **Belady's anomaly** and **thrashing** are favourite "do you really understand?" questions,
  - LRU appears again in DSA as the **LRU cache** design problem.
analogy: |
  Think of a **student's study table and a big bookshelf**.

  - The **bookshelf** is the hard disk: huge but far away.
  - The **table** is RAM: small, fast, holds only a few books (frames).
  - Each **book** is a page of your program.
  - When you need a book that's not on the table, you must walk to the shelf: that is a **page fault** (slow!).
  - If the table is full, you must put one book back: **which one?** The one that came first (FIFO), the one you haven't touched for the longest time (LRU), or the one you won't need for the longest time in future (Optimal, only possible if you can see the future).
  - If your table is so small that you keep swapping books and never actually study, that is **thrashing**.
