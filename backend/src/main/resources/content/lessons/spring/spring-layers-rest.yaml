infosysRelevance: "Core for SP and DSE project discussions: you will be asked to explain your project's layers, and REST basics (verbs, status codes, PUT vs PATCH, idempotency) are common practice questions."
otherCompanies: "REST verbs and status codes are standard questions at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies also look at URL design, pagination and why entities should not be returned directly."
why: |
  Every Spring Boot project in interviews is described the same way: **"controller, service, repository"**. If you can explain *why* code is split like this, and design clean REST URLs with the right **HTTP methods** and **status codes**, you instantly sound like someone who has built a real backend.

  This lesson gives you:
  - the job of each layer and what must **not** go in it,
  - **DTOs vs entities** (and why returning entities is risky),
  - REST rules: resources, verbs, **idempotency**, status codes, **pagination**.

  Your `backend` project follows these rules, so in interviews you can say "in my project..." and point to real files.
analogy: |
  Think of a **restaurant**.

  - The **waiter** (Controller) takes your order, checks it is readable, and brings back the plate. The waiter does not cook.
  - The **chef** (Service) decides *how* to make the dish: the business rules ("no extra cheese on Mondays", "free dessert above Rs 500").
  - The **storeroom keeper** (Repository) only fetches and stores ingredients (data). No cooking decisions.
  - The **menu card** (DTO) shows what customers may order and what they get, not the storeroom's inventory sheet (Entity) with costs and supplier notes.
  - The **menu items** are like REST **resources** (`/dishes/12`), and "order", "change order", "cancel order" are the **HTTP verbs**.
