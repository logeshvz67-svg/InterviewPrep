      - "Scanner with nextInt() in a loop"
      - "BufferedReader.readLine() plus StringTokenizer and Integer.parseInt"
      - "Reading one character at a time with System.in.read() and printing each"
      - "Scanner with nextLine() and charAt"
    answer: 1
    explanation: "BufferedReader reads big buffered chunks and StringTokenizer splits cheaply, which is several times faster than Scanner. Scanner.nextInt is easy but its regex parsing is slow for a million numbers."
  - id: q4
    type: TRUE_FALSE
    prompt: "BufferedReader.readLine() returns null when there is no more input."
    options: ["True", "False"]
    answer: 0
    explanation: "True. That is how you read until the end of input: while ((line = br.readLine()) != null). It does not throw an exception at the end."
  - id: q5
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      String line = "  4 7  2";
      System.out.println(line.split(" ").length);
      System.out.println(line.trim().split("\\s+").length);
    options: ["3\n3", "6\n3", "5\n3", "6\n4"]
    answer: 1
    explanation: "Splitting on a single space keeps empty strings between neighbouring spaces: [\"\", \"\", \"4\", \"7\", \"\", \"2\"], which is 6 parts. Trimming removes the outer spaces and \\s+ treats any run of spaces as one separator, giving exactly 3 numbers."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Fill in the method that converts the token into an int."
    code: |
      StringTokenizer st = new StringTokenizer(br.readLine());
      int x = Integer.____(st.nextToken());
    acceptedAnswers: ["parseInt"]
    explanation: "Integer.parseInt turns a String like \"42\" into the int 42. BufferedReader and StringTokenizer only give you Strings, so this step is always needed."
  - id: q7
    type: MATCH
    prompt: "Match each method to what it reads"
    pairs:
      - left: "sc.next()"
        right: "One word, stopping at a space or newline"
      - left: "sc.nextLine()"
        right: "The rest of the current line"
      - left: "br.readLine()"
        right: "A whole line, or null at end of input"
      - left: "st.nextToken()"
        right: "The next piece of an already-read line"
    explanation: "next() is token based, nextLine() and readLine() are line based, and StringTokenizer hands out pieces of a line you already read."
