    type: MCQ
    prompt: "Your app records when each order was placed. Users are in India, the UK and the US. Which type should you store in the database?"
    code: null
    options: ["LocalDateTime", "LocalDate", "Instant (UTC)", "String like \"15-01-2026 3:30 PM\""]
    answer: 2
    explanation: "An Instant is one exact moment in UTC, the same for everyone, and can be converted to any user's zone for display. LocalDateTime is tempting because it has date and time, but without a zone you can't tell which moment it was."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      Instant i = Instant.parse("2026-03-01T20:00:00Z");
      ZonedDateTime z = i.atZone(ZoneId.of("Asia/Kolkata"));
      System.out.println(z.toLocalDate() + " " + z.toLocalTime());
    options: ["2026-03-01 20:00", "2026-03-02 01:30", "2026-03-01 14:30", "2026-03-02 20:00"]
    answer: 1
    explanation: "India is UTC+05:30. 20:00 UTC + 5:30 = 01:30 the NEXT day, so the local date is 2026-03-02. '2026-03-01 14:30' subtracts instead of adding. This is exactly the 'order placed tomorrow' confusion that converting properly avoids."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "The programmer expects 2026-05-11, but it prints 2026-05-10. What's wrong?"
    code: |
      LocalDate due = LocalDate.of(2026, 5, 10);
      due.plusDays(1);
      System.out.println(due);
    options:
      - "LocalDate.of uses 0-based months"
      - "LocalDate is immutable; plusDays returns a new date that is ignored. Write due = due.plusDays(1)"
      - "plusDays only works with Instant"
      - "println cannot print a LocalDate"
    answer: 1
    explanation: "Every java.time 'change' method returns a new object. The month is fine: java.time months start at 1, unlike the old Calendar, which is the tempting wrong option."
  - id: q4
    type: TRUE_FALSE
    prompt: "A LocalDateTime represents one exact moment on the global timeline."
    options: ["True", "False"]
    answer: 1
    explanation: "False. LocalDateTime has no time zone, so '2026-01-15T10:00' could be 10 AM in Delhi or in New York, which are different moments. Instant and ZonedDateTime are exact moments."
  - id: q5
