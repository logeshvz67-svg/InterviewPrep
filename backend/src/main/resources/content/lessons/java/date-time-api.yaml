infosysRelevance: "Practical knowledge for SP and DSE: project discussions often touch on storing timestamps, time zones and date calculations."
otherCompanies: "Product companies care a lot about correct time handling (UTC storage, user time zones); service companies may ask 'why was java.time introduced?' as a Java 8 question."
why: |
  Almost every real app works with time: order placed at, OTP expires in 5 minutes, subscription ends on, employee's age, report for last month. Getting time wrong causes real bugs: a user in Mumbai sees an order "placed tomorrow", or a 5-minute OTP expires immediately.

  Java's old classes (`java.util.Date`, `Calendar`, `SimpleDateFormat`) were confusing and buggy. Java 8 introduced **`java.time`**, a clean, safe API.

  The most important professional rule you'll learn here: **store time in UTC (as an `Instant`), and convert to the user's local time only when showing it.** Interviewers like to hear that you know the difference between `Instant`, `LocalDateTime` and `ZonedDateTime`.
analogy: |
  Think of a **live cricket match** watched around the world.

  - The ball is bowled at **one exact moment** for everyone on Earth. That moment is an **`Instant`**: a point on the universal timeline (counted in UTC).
  - A fan in **Chennai** says "it happened at 7:30 PM", a fan in **London** says "2:00 PM". Same moment, different wall clocks. That's a **`ZonedDateTime`**: the instant shown in a particular time zone.
  - Your **birthday** is "15 August" no matter where you are. You don't care about the exact moment or the zone. That's a **`LocalDate`**: a date on a calendar, with no zone.

  The scorecard (database) records the universal moment. Each TV channel converts it to local time for its viewers.
