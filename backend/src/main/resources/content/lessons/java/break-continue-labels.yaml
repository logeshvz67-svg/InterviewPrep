title: "break, continue and labeled loops"
version: 1
estimatedMinutes: 25
rebuild: true
patternCode: null
companies: [ALL]
infosysRelevance: "Appears in output-tracing questions; using break to stop early (for example, once an answer is found) keeps SP solutions within time limits."
otherCompanies: "break/continue inside nested loops is a common output MCQ at TCS, Wipro, Cognizant, Accenture and Capgemini. Labeled break is a nice-to-know detail in product-company interviews."
why: |
  Normal loops run from start to end. But often you want to **stop early** ("I found the number, no need to search further") or **skip one round** ("ignore negative values").

  Java gives you three tools:
  - **`break`**: leave the loop right now.
  - **`continue`**: skip the rest of this round and go to the next one.
  - **labeled `break` / `continue`**: do the same for an **outer** loop when you are inside nested loops.

  These appear constantly in output-tracing questions, and the question is almost always: *"Which loop does this break actually leave?"* Stopping early with `break` is also a simple way to make search code faster.
analogy: |
  Think of **checking answer sheets in an exam hall**.

  - **continue** is like seeing a **blank page**: you skip it and move to the next page of the same answer sheet.
  - **break** is like finding that the whole answer sheet is **copied**: you stop checking this sheet completely and put it aside, then move on to the next student.
  - **Labeled break** is like the invigilator announcing **"Fire alarm! Everyone out!"**: you stop checking pages *and* students *and* leave the hall entirely. You jump out of every loop up to the labeled one.
