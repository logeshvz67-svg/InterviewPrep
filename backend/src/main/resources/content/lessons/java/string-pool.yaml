keyTakeaways:
  - "String literals are stored once in the String pool and shared."
  - "new String(...) always creates a new heap object; == with a literal is false."
  - "== compares references, equals() compares content. Use equals for Strings."
  - "intern() gives you the pool copy."
  - "Literal + literal (or final constant) is folded at compile time into the pool; variable + literal is built at runtime."
