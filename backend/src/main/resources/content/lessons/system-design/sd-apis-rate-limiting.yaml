title: "APIs, rate limiting and security basics"
version: 1
estimatedMinutes: 45
rebuild: false
patternCode: null
companies: [INFOSYS_SP, PRODUCT, ALL]
infosysRelevance: "Useful for SP: REST API design, pagination and a token-bucket rate limiter are good practice for design-basics and coding-plus-design questions."
otherCompanies: "Rate limiter design is a very common product-company question; REST, idempotency keys and JWT basics come up in most backend interviews."
why: |
  Every box in your design diagram talks to others through **APIs**. A clean API makes the system easy to use; a sloppy one causes bugs like **double payments** and **apps that load 1 lakh rows at once**.

  This lesson covers the API-level topics interviewers ask juniors about:
  - **REST vs gRPC**: which to use where.
  - **Pagination**: never return everything.
  - **Idempotency keys**: tapping "Pay" twice must charge only once (very relevant for UPI apps).
  - **Rate limiting**: stop one user or bot from flooding the system (think tatkal bots). You'll build a **token bucket** in Java, a very popular interview program.
  - **Security basics**: HTTPS, authentication with JWT, and the difference between authentication and authorization.
analogy: |
  **Rate limiting = the token system at a temple darshan queue.**
  The temple gives out tokens. The token counter holds at most **3 tokens** at a time, and the priest adds **1 new token every second**. Each devotee needs one token to enter. A group of 3 arriving together all get in (a **burst**). The 4th must wait (**HTTP 429 Too Many Requests**). If nobody comes for a while, tokens pile up again, but never more than 3.

  **Idempotency key = the bill number at a restaurant.** If the waiter brings the same bill number twice, the cashier says "already paid" instead of charging you again.

  **JWT = a stamped visitor pass at an office gate.** Security checks your ID once (login) and gives you a pass with your name, role and expiry, stamped with a seal nobody can forge. Every floor just checks the seal on your pass instead of calling security again.
