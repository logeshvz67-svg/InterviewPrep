explainBack:
  prompt: "Explain to a friend the difference between HashSet, LinkedHashSet and TreeSet, and when you would use each."
  rubric:
    - "I said all three remove duplicates"
    - "I explained how each one is built (hash map, hash map + linked list, red-black tree)"
    - "I described the order each gives (none, insertion, sorted)"
    - "I mentioned the speed difference (O(1) vs O(log n))"
    - "I gave one real use for each"
  modelAnswer: |
    All three are sets, so they never keep duplicates. HashSet is really a HashMap inside, so it's the fastest, O(1) on average, but the order is random. LinkedHashSet is the same thing plus a linked list that remembers arrival order, so I use it when I want to remove duplicates but keep the original order. TreeSet is a red-black tree, so it keeps elements sorted and has handy methods like floor and ceiling, but each operation is O(log n). So: fast lookup, use HashSet; keep order, use LinkedHashSet; need sorting, use TreeSet.
flashcards:
