    code: |
      ZonedDateTime ist = instant.____(ZoneId.of("Asia/Kolkata"));
    acceptedAnswers: ["atZone"]
    explanation: "Instant.atZone(zoneId) gives a ZonedDateTime for the same moment, shown on that zone's clocks."
  - id: q7
    type: MCQ
