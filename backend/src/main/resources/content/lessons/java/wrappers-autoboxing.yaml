infosysRelevance: "A popular tricky-output topic for SP and DSE practice: the Integer cache and == trap, and NullPointerException from unboxing."
otherCompanies: "Integer == Integer output questions and wrapper basics are common at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  Collections like `ArrayList` and `HashMap` can't store `int` or `double`, only **objects**. So Java gives every primitive a **wrapper class** (`Integer`, `Double`, ...) and converts between them automatically.

  That automatic conversion hides two famous traps that appear in output questions again and again:
  - `Integer a = 127, b = 127;` gives `a == b` **true**, but with `128` it's **false**. Why?
  - `Integer x = null; int y = x;` crashes with a **NullPointerException**. Where did the null come from?

  You'll use wrappers in almost every coding round (`List<Integer>`, `Map<Character, Integer>`), so understanding them saves you from real bugs too.
analogy: |
  Think of a **gift box**.

  - A **primitive** (`int 5`) is a bare chocolate.
  - A **wrapper object** (`Integer 5`) is the same chocolate **packed in a box**. Some places (collections) only accept boxed gifts.
  - **Autoboxing** is the shop automatically packing it for you. **Unboxing** is opening the box to take the chocolate out.
  - If someone hands you an **empty box reference** (`null`) and you try to take the chocolate out, there's nothing there: **NullPointerException**.
  - The **Integer cache** is the shop keeping **ready-made boxes for the popular small numbers -128 to 127**. Ask for 100 twice and you get **the same box** both times. Ask for 1000 twice and they pack **two different boxes**. `==` checks "same box?", not "same chocolate?".
