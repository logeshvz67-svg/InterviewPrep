explanation: |
  ### 1. The race condition
  A **race condition** happens when the result depends on the *timing* of threads. The classic example:
  ```java
  static int count = 0;
  // two threads each run this 100000 times:
  count++;
  ```
  You expect 200000, but you often get less (e.g. 173851), and a different number each run.

  **Why?** `count++` looks like one step, but it is three: **read** the value, **add 1**, **write** it back. If two threads read the same old value, both write the same new value, and one increment is lost (see the diagram). An operation that happens fully or not at all, with no one able to see it half-done, is called **atomic**. `count++` is **not atomic**.

  The piece of code that touches shared data is called the **critical section**. We must let only one thread into it at a time.

  ### 2. synchronized
  Every Java object has a hidden **lock** (also called a **monitor**). `synchronized` means "take this lock before running, release it after".
  ```java
  public synchronized void increment() {  // lock = this object
      count++;
  }
  ```
  Or lock only the part that needs it with a **synchronized block**:
  ```java
  private final Object lock = new Object();
  void add() {
      synchronized (lock) {   // lock = the 'lock' object
          count++;
      }
  }
  ```
  | Form | Which lock is used |
  |---|---|
  | `synchronized` instance method | `this` (the current object) |
  | `synchronized` **static** method | The class object, e.g. `Counter.class` |
  | `synchronized (obj) { ... }` | `obj` |

  What `synchronized` gives you:
  - **Mutual exclusion**: only one thread holds a given lock at a time. Others go to the **BLOCKED** state.
  - **Visibility**: when a thread releases the lock, its changes become visible to the next thread that takes the same lock.
  - It is **reentrant**: a thread already holding a lock can enter another `synchronized` method on the same lock without blocking itself.

  Two threads only block each other if they use the **same lock object**. Synchronizing on two different objects protects nothing shared.

  ### 3. volatile: visibility, not atomicity
  For speed, each CPU core may keep a **cached copy** of a variable. One thread may keep reading its old copy and never see another thread's update. Marking a field `volatile` tells Java: always read and write it from **main memory**, so every thread sees the latest value.
  ```java
  private volatile boolean running = true;

  // worker thread
  while (running) { /* work */ }

  // another thread
  running = false;   // worker WILL see this and stop
  ```
  Without `volatile`, the worker might loop forever.

  **But:** `volatile` does **not** make `count++` safe. Each read and each write is visible, but two threads can still read the same value and overwrite each other.

  | | synchronized | volatile |
  |---|---|---|
  | Applies to | Methods and blocks | Fields (variables) only |
  | Mutual exclusion (one at a time) | Yes | No |
  | Visibility of latest value | Yes | Yes |
  | Makes `count++` safe | Yes | **No** |
  | Can block a thread | Yes | Never |
  | Good for | Compound actions (read-modify-write) | Simple flags like `running`, `ready` |

  ### 4. wait(), notify(), notifyAll()
  Sometimes a thread must **wait until a condition is true** (e.g. "a message has arrived"). These methods are defined in `Object`:
  - `wait()`: release the lock and sleep (state WAITING) until notified.
  - `notify()`: wake up **one** waiting thread (you can't choose which).
  - `notifyAll()`: wake up **all** waiting threads. Safer in most cases.

  **Rule 1: call them only while holding the lock** of that object (inside `synchronized`). Otherwise Java throws `IllegalMonitorStateException`.

  **Rule 2: always wait inside a `while` loop, never an `if`.**
  ```java
  synchronized String take() throws InterruptedException {
      while (!ready) {   // NOT if
          wait();
      }
      return message;
  }
  ```
  Why a loop?
  - **Spurious wakeup**: a thread may wake up even though nobody called notify. Java allows this.
  - **Someone else got there first**: with `notifyAll()`, several waiting threads wake up; the first one may consume the item, and when your thread finally gets the lock, the condition is false again.
  A `while` loop re-checks the condition after every wakeup. An `if` checks only once and then carries on with wrong data.

  ### 5. sleep() vs wait()
  | | `Thread.sleep(ms)` | `obj.wait()` |
  |---|---|---|
  | Defined in | `Thread` (static) | `Object` |
  | Releases the lock? | **No** | **Yes** |
  | Needs `synchronized`? | No | Yes |
  | Wakes up when | Time is over | `notify`/`notifyAll` (or timeout) |

  > Modern code often uses ready-made tools like `AtomicInteger`, `ReentrantLock` and `BlockingQueue` (lessons 5 and 6). But interviews still expect you to understand these basics.
tinyCode:
  code: |
    public class SafeCounter {
        private int count = 0;

        public synchronized void increment() {
            count++;
        }

        public static void main(String[] args) throws InterruptedException {
            SafeCounter c = new SafeCounter();
            Runnable task = () -> {
                for (int i = 0; i < 10000; i++) {
                    c.increment();
                }
            };
            Thread t1 = new Thread(task);
            Thread t2 = new Thread(task);
            t1.start();
            t2.start();
            t1.join();
            t2.join();
            System.out.println("Count = " + c.count);
        }
    }
  walkthrough: |
    - `count` lives in the heap inside one `SafeCounter` object, so **both threads share it**.
    - `synchronized void increment()` means a thread must hold the lock of `c` (the object) to run it. Only one thread can be inside at a time, so the read-add-write steps never mix.
    - Both threads run the same `task`: 10000 increments each.
    - `t1.join(); t2.join();` make main wait until both finish, so we print the final value.
    - The output is **always** `Count = 20000`. Remove the word `synchronized` and run it a few times: you may see smaller numbers.
