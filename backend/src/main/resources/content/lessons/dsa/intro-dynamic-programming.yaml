  - front: "Two signs a problem needs DP"
    back: "Overlapping subproblems + optimal substructure (often 'number of ways' or 'min/max' with choices)."
  - front: "DP recipe"
    back: "1) State in one sentence 2) Recurrence from the last choice 3) Base cases 4) Fill order + answer."
  - front: "House robber recurrence"
    back: "dp[i] = max(dp[i-1], dp[i-2] + money[i])"
  - front: "Coin change (min coins) recurrence"
    back: "dp[a] = min over coins c <= a of dp[a - c] + 1; dp[0] = 0."
  - front: "0/1 knapsack 1D loop direction"
    back: "Capacity from HIGH to LOW, so each item is used at most once."
  - front: "LIS O(n^2) answer"
    back: "max of dp[i], where dp[i] = LIS ending at i."
keyTakeaways:
  - "DP = solve each subproblem once and store it; it turns exponential recursion into polynomial time."
  - "Memoization is top-down recursion with a cache; tabulation is bottom-up loops."
  - "Always write the state in one sentence, then the recurrence from the last choice, then base cases."
  - "Classics: stairs (sum of two before), robber (skip or rob), coin change (min over coins), knapsack (skip or take), LIS (ending at i)."
  - "Time = number of states x work per state."
