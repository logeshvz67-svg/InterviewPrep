infosysRelevance: "Foundation for clean coding solutions: SP and DSE problems are easier to debug when split into small helper methods like isPrime or gcd, and many platforms ask you to complete a given method signature."
otherCompanies: "Method signatures, return types, overloading and varargs rules are common MCQs at TCS, Wipro, Cognizant, Accenture and Capgemini. Product companies expect clean helper methods in coding rounds."
why: |
  A **method** is a named block of code that does one job. You write it once and **call** (use) it as many times as you like.

  Why this matters:
  - In coding tests, many platforms give you a method to complete, like `public static int solve(int[] arr)`. You must understand parameters and return values to fill it correctly.
  - Splitting a problem into small methods (`isPrime`, `gcd`, `reverse`) makes your code easier to test and debug under time pressure.
  - Interview MCQs ask about **method signatures**, **overloading** (same name, different parameters), **varargs** (`int... nums`), and what happens to a variable after you pass it to a method.
analogy: |
  Think of a **mixer grinder** in an Indian kitchen.

  - The grinder is the **method**. It has a name ("grinder") and a job (grinding).
  - What you put in (rice, dal) are the **arguments**. The type of jar it accepts is the **parameter list**.
  - What comes out (batter) is the **return value**. Some machines, like a fan, return nothing: that is `void`.
  - **Overloading** is having different jars for the same grinder: a small chutney jar and a big batter jar. Same name, different inputs.
  - **Varargs** is a jar that accepts **any number of items**: one tomato or ten tomatoes, the same jar handles it.
