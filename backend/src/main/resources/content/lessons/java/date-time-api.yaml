    code: null
    options: ["Month", "Minutes", "Milliseconds", "Month name"]
    answer: 1
    explanation: "Lowercase mm is minutes; uppercase MM is the month number. Mixing them up is a classic bug that prints dates like 15-30-2026."
explainBack:
  prompt: "Explain to a friend the difference between Instant, LocalDate and ZonedDateTime, and why apps store time in UTC but show it in local time."
  rubric:
    - "I said Instant is one exact moment in UTC"
    - "I said LocalDate/LocalDateTime have no zone, so they are calendar or wall-clock values"
    - "I said ZonedDateTime is a moment shown in a specific zone, including daylight saving rules"
    - "I explained 'store UTC, show local' with a reason"
    - "I mentioned java.time objects are immutable"
  modelAnswer: |
    An Instant is one exact moment for the whole world, counted in UTC, like the moment a ball is bowled in a match. A LocalDate is just a calendar date like a birthday, with no time zone at all. A ZonedDateTime is a moment shown on a particular zone's clock, so the same Instant is 3:30 PM in India and 5 AM in New York. Apps store the Instant in UTC because servers and users can be anywhere, and UTC never gets confused. When showing it, they convert to the user's zone. Also, all these classes are immutable, so plusDays returns a new object.
