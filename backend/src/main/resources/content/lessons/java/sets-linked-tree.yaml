explanation: |
  ### First, what is a Set?
  A **Set** is a collection with **no duplicates**. If you add "apple" twice, it is stored once. `add()` returns `true` if the element was new and `false` if it was already there.

  ### HashSet: a HashMap in disguise
  Inside, `HashSet` holds a `HashMap`. Your element becomes the **key**, and every value is the same dummy object (called `PRESENT`).
  ```java
  // roughly what HashSet.add does
  public boolean add(E e) {
      return map.put(e, PRESENT) == null;
  }
  ```
  So everything from HashMap applies: O(1) average add/contains/remove, uses `hashCode()` + `equals()`, allows one `null`, and **no order guarantee**.

  ### LinkedHashMap and LinkedHashSet: remember the order
  `LinkedHashMap` **extends** `HashMap`. Each entry also has `before` and `after` pointers, forming a **doubly linked list** (a chain you can walk both ways) through all entries.
  - Lookups still use the buckets: O(1).
  - Iteration follows the linked list: **insertion order**.
  - Putting an existing key again does **not** change its position.
  - `LinkedHashSet` is built on a `LinkedHashMap`, just like HashSet is built on HashMap.

  Cost: a little more memory for the two extra pointers per entry.

  #### Access order and LRU cache
  `LinkedHashMap` has a special constructor: `new LinkedHashMap<>(16, 0.75f, true)`. The `true` means **access order**: every `get` or `put` moves that entry to the end. The least recently used entry is then at the front. Override `removeEldestEntry` and you have an **LRU (Least Recently Used) cache** in a few lines. This is a popular practice question.

  ### TreeMap and TreeSet: always sorted
  `TreeMap` stores entries in a **red-black tree**, which is a binary search tree that keeps itself balanced, so its height stays about log n.
  - Keys are kept **sorted**: by their natural order (`Comparable`, e.g. numbers ascending, Strings A-Z) or by a `Comparator` you pass in.
  - `put`, `get`, `remove`, `containsKey` are **O(log n)**.
  - It does **not** use `hashCode()` or `equals()`. It uses `compareTo()` / `compare()`. If compare returns 0, the keys are treated as the same.
  - A `null` key throws `NullPointerException` with natural ordering, because it can't compare null.
  - `TreeSet` is built on a `TreeMap`.

  #### Navigation methods (the hidden superpower)
  | Method | Meaning |
  |---|---|
  | `firstKey()` / `lastKey()` | smallest / largest key |
  | `floorKey(x)` | largest key **<= x** |
  | `ceilingKey(x)` | smallest key **>= x** |
  | `lowerKey(x)` / `higherKey(x)` | strictly < x / strictly > x |
  | `headMap(x)` / `tailMap(x)` | keys < x / keys >= x |

  For TreeSet the names are `first()`, `last()`, `floor()`, `ceiling()`, `headSet()`, `tailSet()`. These help in problems like "find the closest smaller value".

  ### The comparison table
  | | HashMap / HashSet | LinkedHashMap / LinkedHashSet | TreeMap / TreeSet |
  |---|---|---|---|
  | Built on | array of buckets | buckets + doubly linked list | red-black tree |
  | Order | none promised | insertion (or access) order | sorted |
  | get / add / contains | O(1) average | O(1) average | O(log n) |
  | null key / element | one allowed | one allowed | not allowed (natural order) |
  | Uses | hashCode + equals | hashCode + equals | compareTo / Comparator |
  | Extras | fastest | LRU cache | floor, ceiling, first, last, ranges |

  ### How to choose
  - Just need fast lookup or de-duplication? **HashMap / HashSet**.
  - Need to keep the order things arrived? **LinkedHashMap / LinkedHashSet**.
  - Need sorted output or "nearest key" queries? **TreeMap / TreeSet**.
tinyCode:
  code: |
    import java.util.*;

    public class ThreeSets {
        public static void main(String[] args) {
            List<String> fruits = List.of("mango", "apple", "kiwi", "apple");

            Set<String> linked = new LinkedHashSet<>(fruits);
            Set<String> tree = new TreeSet<>(fruits);
            System.out.println(linked);
            System.out.println(tree);

            TreeMap<Integer, String> grade = new TreeMap<>();
            grade.put(90, "A");
            grade.put(75, "B");
            grade.put(50, "C");
            System.out.println(grade.floorKey(82) + " -> " + grade.floorEntry(82).getValue());
            System.out.println(grade.firstKey() + " " + grade.lastKey());
        }
    }
  walkthrough: |
    - `fruits` has "apple" twice. Both sets drop the duplicate.
    - `LinkedHashSet` keeps **arrival order**: `[mango, apple, kiwi]`.
    - `TreeSet` keeps **sorted order**: `[apple, kiwi, mango]`.
    - The `TreeMap` stores cut-off marks sorted: 50, 75, 90.
    - `floorKey(82)` means "largest key that is <= 82", which is `75`. Its value is `"B"`. So it prints `75 -> B`. A neat way to convert marks to grades.
    - `firstKey()` is the smallest (50) and `lastKey()` the largest (90).

    Output:
    ```
    [mango, apple, kiwi]
    [apple, kiwi, mango]
    75 -> B
    50 90
    ```
tryIt:
  instructions: "Type this tiny LRU cache. It holds only 2 items. Before running, guess which key gets removed. (Hint: get(1) makes key 1 'recently used'.)"
  code: |
    import java.util.*;

    public class Lru {
        public static void main(String[] args) {
            Map<Integer, String> cache = new LinkedHashMap<>(16, 0.75f, true) {
                @Override
                protected boolean removeEldestEntry(Map.Entry<Integer, String> eldest) {
                    return size() > 2;
                }
            };
            cache.put(1, "one");
            cache.put(2, "two");
            cache.get(1);
            cache.put(3, "three");
            System.out.println(cache);
        }
    }
