explanation: |
  ### Where Strings live
  - The **stack** is memory for local variables of a running method. A String variable there holds only a **reference** (an arrow / address).
  - The **heap** is memory for objects. All String objects live here.
  - The **String pool** (also called the *String constant pool*) is a special area **inside the heap** (since Java 7; earlier it was in a place called PermGen). It stores **one shared copy** of each String literal.

  ### Literal vs `new`
  ```java
  String s1 = "hello";              // literal: look in the pool
  String s2 = "hello";              // found in pool -> reuse same object
  String s3 = new String("hello");  // new: ALWAYS a fresh object on the heap
  ```
  - When Java sees a literal, it checks the pool. If `"hello"` is already there, it reuses that object. If not, it adds it once.
  - `new` always creates a **brand-new** object, even if the same text exists in the pool.

  ### `==` vs `equals()`
  | | `==` | `equals()` |
  |---|---|---|
  | Compares | References (are both arrows pointing to the same object?) | Content (are the characters the same?) |
  | `s1` vs `s2` (both literals) | `true` | `true` |
  | `s1` vs `s3` (literal vs new) | `false` | `true` |
  | Use it for Strings? | Almost never | **Yes, always** |

  > Golden rule: **compare Strings with `equals()`** (or `equalsIgnoreCase()` to ignore upper/lower case). `==` only tells you whether it's the same object.

  A safe trick when one side might be `null`: put the literal first, `"yes".equals(input)`. If `input` is `null` this returns `false` instead of crashing with a `NullPointerException`.

  ### How many objects does `new String("hello")` create?
  **Up to two.**
  1. The literal `"hello"` inside the brackets goes into the pool, *if it is not already there* (this happens when the class is loaded).
  2. `new` creates one more object on the normal heap.

  So: 2 objects if `"hello"` was not in the pool yet, 1 new object if it already was. Interview answer: *"one or two; two if the literal is not already in the pool."*

  ### `intern()`
  `s.intern()` returns the **pool copy** of the same text. If the pool doesn't have it yet, it adds it and returns that.
  ```java
  String s3 = new String("hello");
  String s4 = s3.intern();
  System.out.println(s4 == "hello"); // true: s4 is the pool object
  System.out.println(s3 == s4);      // false: s3 is still the heap copy
  ```

  ### Compile-time constant folding
  **Constant folding** means: if the compiler can work out a value *while compiling*, it puts the final answer straight into the `.class` file.
  ```java
  String a = "hel" + "lo";      // compiler writes "hello" -> pool
  System.out.println(a == "hello");   // true

  String part = "hel";
  String b = part + "lo";       // part is a variable: joined at RUNTIME
  System.out.println(b == "hello");   // false: new heap object

  final String fpart = "hel";   // final + literal = compile-time constant
  String c = fpart + "lo";      // compiler can fold it -> "hello"
  System.out.println(c == "hello");   // true
  ```
  The rule: if **every** part of the `+` is a literal or a `final` variable initialised with a literal, the result is computed at compile time and goes into the pool. If any part is a normal variable or a method call, the join happens at runtime and creates a **new** heap object.

  ### Quick memory checklist for output questions
  1. Draw the pool box and the heap boxes.
  2. Literal or compile-time constant? Arrow into the pool.
  3. `new`, or runtime `+` with a variable? Arrow to a fresh heap box.
  4. `intern()`? Arrow into the pool.
  5. `==` true only if both arrows end at the same box.
tinyCode:
  code: |
    public class PoolDemo {
        public static void main(String[] args) {
            String s1 = "hello";
            String s2 = "hello";
            String s3 = new String("hello");
            String s4 = s3.intern();

            System.out.println(s1 == s2);
            System.out.println(s1 == s3);
            System.out.println(s1.equals(s3));
            System.out.println(s1 == s4);
        }
    }
  walkthrough: |
    - `s1 = "hello"`: the literal goes into the pool, `s1` points to it.
    - `s2 = "hello"`: already in the pool, so `s2` points to the **same** object.
    - `s3 = new String("hello")`: a separate object on the heap.
    - `s4 = s3.intern()`: asks for the pool copy of `"hello"`, which is the object `s1` points to.
    - `s1 == s2` is `true` (same object).
    - `s1 == s3` is `false` (different objects).
    - `s1.equals(s3)` is `true` (same characters).
    - `s1 == s4` is `true` (both are the pool object).

    Output:
    ```
    true
    false
    true
    true
    ```
