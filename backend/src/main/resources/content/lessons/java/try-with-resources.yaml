commonMistakes:
  - "Thinking resources close in the same order they were opened. They close in REVERSE order."
  - "Trying to use the resource inside catch or finally. It is already closed and out of scope there."
  - "Putting a class that doesn't implement AutoCloseable in the try brackets. Compile error."
  - "Thinking the close() exception replaces the main exception. With try-with-resources the body's exception wins and the close one is suppressed."
  - "Reassigning the resource variable inside the block. It's implicitly final."
interviewBox:
  why: "Why interviewers ask this: it shows you write leak-free code for files and database connections, and know modern Java beyond textbook try/finally."
  questions:
    - q: "What is try-with-resources?"
      a: "It is a try statement, from Java 7, where we declare resources in brackets after try. Any object that implements AutoCloseable is closed automatically when the block ends, even if an exception happens. It replaces the long finally blocks we used to write for closing files and connections."
    - q: "In what order are multiple resources closed?"
      a: "In reverse order of declaration. If I open a Connection, then a Statement, then a ResultSet, they're closed ResultSet first, then Statement, then Connection. That makes sense because later resources depend on earlier ones."
    - q: "What is a suppressed exception?"
      a: "If the try body throws an exception and then close() also throws, try-with-resources keeps the body's exception as the main one and attaches the close exception to it as suppressed. We can read them with getSuppressed(). With a plain finally, the close exception would hide the real one."
    - q: "Can we write try-with-resources without catch or finally?"
      a: "Yes. try (Resource r = ...) { } alone is valid. If the resource or body throws a checked exception, the method must still declare it."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          static class R implements AutoCloseable {
              String n;
              R(String n) { this.n = n; System.out.print("open" + n + " "); }
              public void close() { System.out.print("close" + n + " "); }
          }
          public static void main(String[] args) {
              try (R x = new R("X"); R y = new R("Y")) {
                  System.out.print("body ");
              }
          }
      }
    options:
      - "openX openY body closeX closeY "
      - "openX openY body closeY closeX "
      - "openY openX body closeY closeX "
      - "body openX openY closeY closeX "
    answer: 1
    explanation: "Resources open in declaration order (X, then Y) before the body. They close in reverse order (Y, then X). Closing in the same order (the first option) is the common wrong guess."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          static class R implements AutoCloseable {
              public void close() throws Exception {
                  throw new Exception("C");
              }
          }
          public static void main(String[] args) {
              try (R r = new R()) {
                  throw new Exception("B");
              } catch (Exception e) {
                  System.out.println(e.getMessage() + " " + e.getSuppressed().length);
              }
          }
      }
    options: ["C 1", "B 1", "B 0", "C 0"]
    answer: 1
    explanation: "The body throws B first, then close() throws C. try-with-resources keeps B as the main exception and adds C to its suppressed list, so the message is B and there is 1 suppressed exception. 'C 1' would be the old finally behaviour, where the close exception hides the real one."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "Why won't this compile?"
    code: |
      public class Main {
          static class Box {
              void close() { System.out.println("closed"); }
          }
          public static void main(String[] args) {
              try (Box b = new Box()) {
                  System.out.println("using box");
              }
          }
      }
    options:
      - "Box.close() must be static"
      - "Box doesn't implement AutoCloseable, so it can't be used in try-with-resources"
      - "try-with-resources needs a catch block"
      - "The variable b must be declared before try"
    answer: 1
    explanation: "Having a method named close() is not enough; the class must implement AutoCloseable (or Closeable). A catch block is optional, and declaring the variable inside the brackets is the normal style."
  - id: q4
    type: TRUE_FALSE
    prompt: "In try-with-resources, the resources are closed before the catch block runs."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Resources are closed as soon as the try block ends; then catch (if an exception matched) runs, then finally."
  - id: q5
    type: MCQ
    prompt: "Which interface must a class implement to be used in try-with-resources?"
    code: null
    options: ["Serializable", "AutoCloseable", "Runnable", "Iterable"]
    answer: 1
    explanation: "AutoCloseable has the close() method that Java calls automatically. Closeable also works because it extends AutoCloseable. Serializable, Runnable and Iterable have nothing to do with closing."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Fill in the method that returns the exceptions thrown by close() while another exception was already in flight."
    code: |
      catch (Exception e) {
          for (Throwable t : e.____()) {
              System.out.println(t.getMessage());
          }
      }
    acceptedAnswers: ["getSuppressed"]
    explanation: "getSuppressed() returns a Throwable[] of exceptions attached to the main one. getCause() is different: it returns the exception that caused this one (chaining), not suppressed ones."
