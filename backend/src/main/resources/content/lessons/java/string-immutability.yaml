why: |
  **"Why is String immutable in Java?"** is one of the most common Java theory questions. Interviewers love it because a good answer touches memory, security, threads and hashing all at once.

  It also matters when you write code:
  - It explains why `s.toUpperCase();` on its own line seems to "do nothing".
  - It explains why adding strings inside a loop is slow (next lessons: the String pool and `StringBuilder`).
  - It is the base for "how do I make my own immutable class?" (Section C).

  Once you see the picture of a variable *pointing* to a String object, these questions become easy.
analogy: |
  Think of a **printed train ticket**.

  - Once it is printed, nobody can change the name or seat on it. That is an **immutable** object.
  - If you want a different seat, the counter prints a **new ticket**. The old ticket still exists exactly as it was.
  - Your **pocket** is like a variable. You can throw the old ticket away and put the new ticket in your pocket. The pocket changed what it holds; the ticket itself never changed.

  In Java, `String` objects are printed tickets, and `String` variables are pockets.
