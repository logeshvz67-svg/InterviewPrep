infosysRelevance: "Infosys-style basics practice: number properties (divisibility, HCF/LCM, remainders, unit digits) are the foundation for most quantitative aptitude questions and many coding problems."
otherCompanies: "Number system and simplification are common practice topics for the online tests of TCS, Wipro, Cognizant, Accenture and Capgemini."
why: |
  Almost every aptitude topic stands on numbers: percentages, ratios, time and work, all need fast and correct calculation.

  The number system also gives you **shortcuts** that save minutes in a timed test:
  - check if 7425 is divisible by 9 in two seconds,
  - find the last digit of 7^95 without calculating a huge number,
  - count trailing zeros of 100! without multiplying.

  And these ideas appear in **coding rounds** too: `%` (remainder), GCD with Euclid's algorithm, and digit sums are classic programming questions. In this lesson you learn each shortcut **and why it works**, and you write tiny Java programs that check the answers.
analogy: |
  Think of **numbers as people with ID cards**.

  - Divisibility rules are like **checking the PIN code** on an address: you look at one small part (the last digits, or the digit sum) and you already know a lot about the whole address.
  - HCF is the **biggest common group size**: if 36 boys and 84 girls must stand in equal rows with only boys or only girls in each row, the biggest row size is the HCF.
  - LCM is **when everyone meets again**: three buses leave every 6, 8 and 12 minutes; the LCM tells you when all three leave together again.
