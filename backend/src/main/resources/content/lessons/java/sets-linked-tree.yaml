infosysRelevance: "A common comparison question in SP and DSE rounds; choosing the right map or set also makes coding answers cleaner."
otherCompanies: "Common 'difference between' question at TCS, Wipro, Cognizant, Accenture, Capgemini; product companies also ask you to build an LRU cache with LinkedHashMap."
why: |
  In the last lesson you learned how `HashMap` works. But HashMap has one weakness: **no order**. When you print it, keys come out in a strange order.

  Real problems often need order:
  - "Print the first non-repeating character" needs **insertion order** -> `LinkedHashMap`.
  - "Print marks in sorted order of names" needs **sorted order** -> `TreeMap`.
  - "Remove duplicates" needs a **set** -> `HashSet`, `LinkedHashSet` or `TreeSet`.

  Interviewers love the question **"HashMap vs LinkedHashMap vs TreeMap"** and its twin **"HashSet vs LinkedHashSet vs TreeSet"**. If you know how each one is built, you never need to memorise the table: you can work it out.
analogy: |
  Think of three ways to keep guest names at a **wedding**.

  - **HashSet / HashMap** is a **bag of name cards**. Super fast to check "is Priya here?", but if you pour the cards out, they come in random order.
  - **LinkedHashSet / LinkedHashMap** is the **guest register at the entrance**. Each new guest signs on the next line, so you can read names back **in arrival order**. It still has the fast bag next to it for checking.
  - **TreeSet / TreeMap** is the **alphabetical seating chart**. Every new name is placed in its sorted position. Finding or adding takes a few more steps (log n), but you always read names **A to Z**, and you can ask "who sits just before Meena?".
