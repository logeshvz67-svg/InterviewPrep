    back: "Concept (one simple line) -> Example (tiny, concrete) -> Use case (where used + because)."
  - front: "3 steps to say 'I don't know'"
    back: "Admit ('I'm not fully sure') -> Reason from what I know -> Say I will learn it."
  - front: "5 steps for coding on paper"
    back: "Clarify -> Explain idea -> Write neat code -> Dry-run small example -> State complexity."
  - front: "Follow-up 'Can you do better?' usually means?"
    back: "Discuss a time vs space trade-off, e.g. use a HashSet/HashMap to reduce time."
keyTakeaways:
  - "Answer 'What is X?' with Concept, Example, Use case, then stop and let them go deeper."
  - "Think aloud: silence hides your skill, talking shows it."
  - "Honest 'I'm not sure, but...' beats bluffing."
  - "On paper: clarify, explain, write, dry-run, state complexity."
  - "Follow-ups are a good sign; answer them with the same calm structure."
