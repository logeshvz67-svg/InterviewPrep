title: "GROUP BY and HAVING"
version: 1
estimatedMinutes: 30
rebuild: true
patternCode: null
companies: [ALL, INFOSYS_SP, INFOSYS_DSE]
infosysRelevance: "Department-wise counts, totals and 'groups with more than N rows' are standard SQL practice for DSE and SP rounds."
otherCompanies: "WHERE vs HAVING and COUNT(*) vs COUNT(column) are very common basic SQL questions at TCS, Wipro, Cognizant, Accenture and Capgemini."
why: |
  Managers rarely ask "show me every row". They ask **summary** questions:
  - How many employees are in each department?
  - What is the total order value per customer?
  - Which departments have more than 2 people?

  `GROUP BY` and the **aggregate functions** (COUNT, SUM, AVG, MIN, MAX) answer these. `HAVING` filters the groups.

  The classic interview question **"What is the difference between WHERE and HAVING?"** comes straight from this lesson, and so does the sneaky **COUNT(*) vs COUNT(column)** question.
analogy: |
  Imagine a teacher collecting **exam papers** from the whole school.

  - **WHERE**: before sorting, she throws away papers that are not from this term (filtering *single papers*).
  - **GROUP BY class**: she makes one pile per class (CSE pile, ECE pile, ...).
  - **Aggregates**: for each pile she writes one summary card: number of papers (COUNT), total marks (SUM), average (AVG), lowest (MIN), highest (MAX).
  - **HAVING**: she keeps only the summary cards she cares about, like "piles with more than 30 papers" (filtering *whole piles*).

  You cannot ask "how many papers are in this pile?" before the piles exist. That is exactly why you can't use COUNT in WHERE.
