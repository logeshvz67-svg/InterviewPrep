explanation: |
  ### Terminology (in plain words)
  | Term | Meaning |
  |---|---|
  | Node | one box holding a value and links to its children |
  | Root | the top node (no parent) |
  | Child / parent | a node directly below / directly above |
  | Leaf | a node with no children |
  | Subtree | a node plus everything below it |
  | Depth of a node | number of edges from the root to it |
  | Height of a tree | number of levels (nodes on the longest root-to-leaf path) |
  | Binary tree | every node has at most 2 children: left and right |
  | Balanced | left and right heights differ by at most 1 everywhere, so height is about log n |

  Note: some books count height in **edges** (a single node has height 0). In this lesson, height = number of **nodes** on the longest path, so an empty tree is 0 and a single node is 1. Say which one you use in an interview.

  ```java
  class Node {
      int val;
      Node left, right;
      Node(int val) { this.val = val; }
  }
  ```

  ### The recursive template
  ```java
  int solve(Node n) {
      if (n == null) return BASE;        // empty tree answer
      int l = solve(n.left);             // trust recursion for the left subtree
      int r = solve(n.right);            // ...and for the right subtree
      return combine(n.val, l, r);
  }
  ```
  **Height**: `if (n == null) return 0; return 1 + Math.max(height(n.left), height(n.right));`
  **Count nodes**: `return 1 + count(n.left) + count(n.right);`

  ### Depth-first traversals (DFS)
  "Traversal" means visiting every node once. The name tells you **when the node itself** is visited:
  | Traversal | Order | Typical use |
  |---|---|---|
  | Preorder | Node, Left, Right | copy a tree, print structure |
  | Inorder | Left, Node, Right | BST in **sorted order** |
  | Postorder | Left, Right, Node | delete a tree, compute height/size (children first) |
  ```java
  void inorder(Node n) {
      if (n == null) return;
      inorder(n.left);
      System.out.print(n.val + " ");
      inorder(n.right);
  }
  ```
  Move the print line up (preorder) or down (postorder) for the others.

  ### Breadth-first traversal (level order)
  Visit level by level using a **queue**. The trick `int size = q.size()` tells you how many nodes belong to the current level.
  ```java
  Queue<Node> q = new ArrayDeque<>();
  q.offer(root);
  while (!q.isEmpty()) {
      int size = q.size();
      for (int i = 0; i < size; i++) {
          Node cur = q.poll();
          // process cur
          if (cur.left != null) q.offer(cur.left);
          if (cur.right != null) q.offer(cur.right);
      }
      // one level finished
  }
  ```

  ### Binary Search Tree (BST)
  **Rule**: for every node, **all** values in its left subtree are smaller and **all** values in its right subtree are bigger.

  **Search**: compare and go one way only.
  ```java
  while (n != null) {
      if (target == n.val) return true;
      n = (target < n.val) ? n.left : n.right;
  }
  return false;
  ```
  **Insert**: walk like search, and attach the new node where you fall off.
  ```java
  Node insert(Node root, int val) {
      if (root == null) return new Node(val);
      if (val < root.val) root.left = insert(root.left, val);
      else root.right = insert(root.right, val);
      return root;
  }
  ```

  **Validate a BST**: checking only "left child < node < right child" is **wrong**. A node deep in the right subtree must still be bigger than the root. Pass down an allowed range `(min, max)`:
  ```java
  boolean isBST(Node n, long min, long max) {
      if (n == null) return true;
      if (n.val <= min || n.val >= max) return false;
      return isBST(n.left, min, n.val) && isBST(n.right, n.val, max);
  }
  // call: isBST(root, Long.MIN_VALUE, Long.MAX_VALUE)
  ```
  We use `long` bounds so a node holding `Integer.MIN_VALUE` or `Integer.MAX_VALUE` is still allowed. Another way: do an inorder traversal and check it is strictly increasing.

  ### Lowest Common Ancestor (LCA)
  The **LCA** of two nodes p and q is the deepest node that has both of them below it (a node counts as its own descendant).
  - **In a BST**: if both values are smaller than the current node, go left; if both are bigger, go right; otherwise the paths split here, so this node is the LCA. O(h).
  - **In a general binary tree**:
  ```java
  Node lca(Node n, Node p, Node q) {
      if (n == null || n == p || n == q) return n;
      Node l = lca(n.left, p, q), r = lca(n.right, p, q);
      if (l != null && r != null) return n;   // one found on each side
      return (l != null) ? l : r;
  }
  ```

  ### Complexity
  | Operation | Balanced BST | Skewed BST (worst) | Any binary tree |
  |---|---|---|---|
  | Search / insert | O(log n) | O(n) | O(n) |
  | Traversal (any) | O(n) | O(n) | O(n) |
  | Height, validate, LCA (general) | O(n) | O(n) | O(n) |
  | Recursion stack space | O(log n) | O(n) | O(h) |

  A **skewed** tree is one long chain (insert 1, 2, 3, 4, 5 in order: each goes to the right). Then BST search is no better than a linked list. **Self-balancing** trees (Red-Black, AVL) fix this; Java's `TreeMap` and `TreeSet` use a Red-Black tree, so they guarantee O(log n).
tinyCode:
  code: |
    import java.util.*;

    public class TreeBasics {
        static class Node {
            int val;
            Node left, right;
            Node(int val) { this.val = val; }
        }

        static Node insert(Node root, int val) {
            if (root == null) return new Node(val);
            if (val < root.val) root.left = insert(root.left, val);
            else root.right = insert(root.right, val);
            return root;
        }

        static void preorder(Node n, List<Integer> out) {
            if (n == null) return;
            out.add(n.val); preorder(n.left, out); preorder(n.right, out);
        }

        static void inorder(Node n, List<Integer> out) {
            if (n == null) return;
            inorder(n.left, out); out.add(n.val); inorder(n.right, out);
        }

        static void postorder(Node n, List<Integer> out) {
            if (n == null) return;
            postorder(n.left, out); postorder(n.right, out); out.add(n.val);
        }

        static List<List<Integer>> levelOrder(Node root) {
            List<List<Integer>> levels = new ArrayList<>();
            Queue<Node> q = new ArrayDeque<>();
            if (root != null) q.offer(root);
            while (!q.isEmpty()) {
                int size = q.size();                 // nodes on this level
                List<Integer> level = new ArrayList<>();
                for (int i = 0; i < size; i++) {
                    Node cur = q.poll();
                    level.add(cur.val);
                    if (cur.left != null) q.offer(cur.left);
                    if (cur.right != null) q.offer(cur.right);
                }
                levels.add(level);
            }
            return levels;
        }

        static int height(Node n) {
            if (n == null) return 0;
            return 1 + Math.max(height(n.left), height(n.right));
        }

        static boolean search(Node n, int target) {
            while (n != null) {
                if (target == n.val) return true;
                n = (target < n.val) ? n.left : n.right;
            }
            return false;
        }

        public static void main(String[] args) {
            Node root = null;
            for (int v : new int[]{8, 3, 10, 1, 6, 14, 4}) root = insert(root, v);

            List<Integer> pre = new ArrayList<>(), in = new ArrayList<>(), post = new ArrayList<>();
            preorder(root, pre); inorder(root, in); postorder(root, post);
            System.out.println("pre   " + pre);
            System.out.println("in    " + in);
            System.out.println("post  " + post);
            System.out.println("level " + levelOrder(root));
            System.out.println("height " + height(root) + ", has 6? " + search(root, 6) + ", has 7? " + search(root, 7));
        }
    }
  walkthrough: |
    - **insert** builds the BST from the diagram: 8 is the root; 3 goes left; 10 goes right; 1 goes left of 3; 6 right of 3; 14 right of 10; 4 left of 6.
    - The three DFS methods are identical except **where** `out.add(n.val)` sits: before the children (pre), between them (in), after them (post).
    - **Inorder** gives `[1, 3, 4, 6, 8, 10, 14]`: sorted, because of the BST rule.
    - **levelOrder** uses a queue and `size` to group nodes level by level.
    - **height** is 4 because the longest path 8 -> 3 -> 6 -> 4 has 4 nodes.
    - **search** walks one path only: 6 is found in 3 steps; 7 falls off after 8 -> 3 -> 6 (7 > 6, right child is null).

    Output:
    ```
    pre   [8, 3, 1, 6, 4, 10, 14]
    in    [1, 3, 4, 6, 8, 10, 14]
    post  [1, 4, 6, 3, 14, 10, 8]
    level [[8], [3, 10], [1, 6, 14], [4]]
    height 4, has 6? true, has 7? false
    ```
