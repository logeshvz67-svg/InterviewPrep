  question: 'If A : B = 2 : 3 and B : C = 4 : 5, what is A : B : C?'
  options: ['6 : 9 : 10', '8 : 12 : 15', '4 : 6 : 5', '2 : 3 : 5']
  answer: 1
  explanation: 'Make B the same in both ratios. B is 3 in the first and 4 in the second; LCM of 3 and 4 is 12. A : B = 2 :
