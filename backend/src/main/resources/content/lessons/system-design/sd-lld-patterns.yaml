infosysRelevance: "Core for SP and DSE: Singleton, Factory, Builder, Observer and Strategy are among the most discussed OOP topics, and using them in one small design shows real understanding."
otherCompanies: "Design patterns come up everywhere, from service-company theory questions to product-company LLD and machine-coding rounds."
why: |
  Interviewers often ask "What design patterns do you know?" Most freshers recite definitions. The ones who stand out say **where** they'd use a pattern and **why**, inside a real design.

  A **design pattern** is a proven, reusable solution to a common design problem: a shared vocabulary among developers. When you say "the pricing is a Strategy", every experienced developer instantly understands the structure.

  In this final lesson of the tower we take the five patterns that come up most often in LLD interviews and use them **together in one food-delivery app**:
  - **Singleton:** one shared app configuration.
  - **Builder:** creating an `Order` with many optional fields, readably.
  - **Factory:** creating the right payment processor (UPI, card, cash) from a type.
  - **Strategy:** swappable delivery-fee rules (free above Rs.199, distance-based, rain surge).
  - **Observer:** notifying the customer app, restaurant and rider when the order status changes.

  If you did the "Design basics" lesson in the Java world (Section I), this is the applied, interview-style version.
analogy: |
  Think of **how a Swiggy/Zomato order actually flows**:

  - **Singleton:** there is **one** rule book for the whole app ("free delivery above Rs.199"). Every screen reads the same copy.
  - **Builder:** placing an order is step by step: add dosa, add coffee, choose address, add instructions ("less spicy"), then **Place order**. You don't fill one giant form with 15 boxes at once.
  - **Factory:** at checkout you just choose "UPI" and the app hands you the right payment flow. You don't need to know how the UPI flow is created.
  - **Strategy:** the delivery fee rule changes with the situation: normal, free above Rs.199, or **rain surge**. Same checkout, different rule plugged in.
  - **Observer:** when the order becomes "Out for delivery", **everyone who subscribed** (your app, the restaurant screen, the rider's app) is told automatically, like a WhatsApp group announcement.
