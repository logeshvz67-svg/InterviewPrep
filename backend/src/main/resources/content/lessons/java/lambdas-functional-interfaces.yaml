infosysRelevance: "Frequently asked 'Java 8 features' question in SP and DSE rounds; lambdas are also the base for streams, which appear in coding answers."
otherCompanies: "'What are the Java 8 features?' is a common question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies expect you to write lambdas fluently."
why: |
  Before Java 8, passing a small piece of **behaviour** (like "how to compare two students" or "what to do on a button click") needed a whole **anonymous class**: 5-6 lines of ceremony for one line of logic.

  **Lambdas** (Java 8) let you write that behaviour in one short line and pass it around like data. They power:
  - the **Stream API** (`filter`, `map`, `reduce`),
  - `Comparator.comparing(...)`, `list.forEach(...)`, `list.removeIf(...)`, `map.computeIfAbsent(...)`,
  - Spring Boot code you will see at work.

  "What are the Java 8 features?" and "What is a functional interface?" are very common interview questions. This lesson gives you both answers with real understanding.
analogy: |
  Think of giving instructions to a **cook at a wedding**.

  - Old Java (anonymous class) was like writing a **formal letter**: "Dear Cook, I, the host, hereby request that, for every guest, you shall..." Lots of words around one instruction.
  - A **lambda** is a **sticky note**: "guest -> serve(guest)". Same instruction, no ceremony.

  A **functional interface** is the **shape of the sticky note**: a form with exactly one blank to fill. `Predicate` is a form that says "given X, answer yes/no". `Function` says "given X, give back Y". The lambda is what you write in that one blank.
