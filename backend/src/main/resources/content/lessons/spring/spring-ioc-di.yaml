      |                                                           |
      |  1. scan: finds @Component / @Service / @Repository ...   |
      |  2. create:  SmsNotifier  --------+                       |
      |                                   | inject (constructor)  |
      |  3. create:  OrderService(notifier) <---+                 |
      |  4. keep:    one copy of each (singleton) in a map        |
      |       "smsNotifier"  -> SmsNotifier@1a2b                  |
