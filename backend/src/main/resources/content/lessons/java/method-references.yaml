    back: "Static (Integer::parseInt), bound instance (System.out::println), unbound instance (String::length), constructor (ArrayList::new)."
  - front: "String::toUpperCase as a lambda"
    back: "s -> s.toUpperCase() (the parameter becomes the object)."
  - front: "Math::max as a BinaryOperator<Integer>"
    back: "(a, b) -> Math.max(a, b)"
  - front: "When can't you use a method reference?"
    back: "When the lambda adds logic, adds a fixed argument, or swaps the argument order."
keyTakeaways:
  - "A method reference (::) replaces a lambda that only calls one existing method."
  - "Four kinds: static, particular object, arbitrary object of a type, constructor."
  - "For unbound references, the first parameter becomes the object the method is called on."
  - "No brackets after the method name; a functional interface target is still required."
  - "Use them when they read more clearly; lambdas are fine otherwise."
