keyTakeaways:
  - "A linked list is nodes joined by next references; access by position is O(n), insert/delete at a known node is O(1)."
  - "Reverse with prev/cur/next: always save next before flipping an arrow, and return prev."
  - "Slow (1 step) and fast (2 steps) pointers find the middle and detect cycles in O(1) space."
  - "A dummy node removes special cases for the head; return dummy.next."
  - "Always test empty, one-node and two-node lists."
