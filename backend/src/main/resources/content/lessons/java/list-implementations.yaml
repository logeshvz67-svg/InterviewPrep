    import java.util.*;

    public class RemoveTrap {
        public static void main(String[] args) {
            List<Integer> nums = new ArrayList<>(List.of(10, 1, 20, 1, 30));
            nums.remove(1);
            System.out.println(nums);
            nums.remove(Integer.valueOf(1));
