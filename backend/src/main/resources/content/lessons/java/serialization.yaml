explanation: |
  ### Key words
  - **Serialization**: converting an object's state (its field values) into bytes.
  - **Deserialization**: rebuilding the object from those bytes.
  - **Marker interface**: an interface with **no methods**. It only "marks" a class with a permission. `Serializable` is one.

  ### How to make a class serializable
  ```java
  class Student implements Serializable {
      private static final long serialVersionUID = 1L;
      String name;
      int marks;
  }
  ```
  `implements Serializable` is the permission slip. Without it, `writeObject` throws `NotSerializableException` (a runtime exception, not a compile error).

  ### Writing and reading
  ```java
  try (ObjectOutputStream out = new ObjectOutputStream(new FileOutputStream("s.ser"))) {
      out.writeObject(student);                  // serialize
  }
  try (ObjectInputStream in = new ObjectInputStream(new FileInputStream("s.ser"))) {
      Student s = (Student) in.readObject();     // deserialize (needs a cast)
  }
  ```
  `readObject()` returns `Object`, so you cast. It can throw `ClassNotFoundException` if the class is not available.

  ### transient: "do not pack this"
  Mark a field `transient` to skip it. Use it for passwords, OTPs, cached values, or fields whose type is not serializable. After deserialization a transient field gets its **default value**: `null` for objects, `0` for numbers, `false` for boolean.

  ### static fields are not saved either
  Serialization saves the **object's** state. A `static` field belongs to the **class**, not the object, so it is not written. After reading, you see whatever value the class currently has in that JVM.

  | Field type | Saved? | After reading |
  |---|---|---|
  | normal instance field | Yes | original value |
  | `transient` field | No | default (null / 0 / false) |
  | `static` field | No | current class value |

  ### serialVersionUID: the version label
  It is a `long` number that identifies the **version** of the class. When reading, Java compares the number in the bytes with the number in the current class. If they differ, you get `InvalidClassException`.
  - If you don't declare it, Java **calculates one** from the class details. Adding even one field changes it, and old saved files stop loading.
  - So always declare it yourself: `private static final long serialVersionUID = 1L;`

  ### Rules that surprise people
  1. **All fields must be serializable** too (or transient). A `Student` with an `Address` field needs `Address implements Serializable`.
  2. **The constructor is not called** during deserialization. Java creates the object and fills the fields directly. (Exception: if a *parent* class is not serializable, that parent's no-argument constructor runs.)
  3. If a parent class is `Serializable`, all child classes are too.
  4. `String`, wrapper classes (`Integer`...), `ArrayList` and `HashMap` are already serializable.

  ### Externalizable (for completeness)
  `Externalizable` extends `Serializable` and makes you write `writeExternal` and `readExternal` yourself, giving full control. It also needs a public no-argument constructor. It is rarely used today.

  ### In real projects
  Java's built-in serialization has **security risks** (deserializing untrusted bytes can run harmful code). Modern apps usually serialize to **JSON** (with Jackson in Spring Boot). But the interview concepts (transient, versioning, what gets saved) are the same.
tinyCode:
  code: |
    import java.io.*;

    public class SaveStudent {
        static class Student implements Serializable {
            private static final long serialVersionUID = 1L;
            String name;
            int marks;
            transient String otp;   // not saved

            Student(String name, int marks, String otp) {
                this.name = name;
                this.marks = marks;
                this.otp = otp;
            }
        }

        public static void main(String[] args) throws Exception {
            Student s = new Student("Asha", 91, "4321");

            try (ObjectOutputStream out = new ObjectOutputStream(new FileOutputStream("student.ser"))) {
                out.writeObject(s);
            }
            System.out.println("Saved " + s.name);

            try (ObjectInputStream in = new ObjectInputStream(new FileInputStream("student.ser"))) {
                Student back = (Student) in.readObject();
                System.out.println(back.name + " " + back.marks + " otp=" + back.otp);
            }
        }
    }
  walkthrough: |
    - `implements Serializable` gives permission to convert `Student` objects to bytes.
    - `serialVersionUID = 1L` is the version label for this class.
    - `transient String otp` tells Java to skip this field.
    - `ObjectOutputStream` wraps a `FileOutputStream`; `writeObject(s)` packs the object into `student.ser`.
    - `ObjectInputStream` + `readObject()` unpacks it. We cast the result to `Student`.
    - `otp` comes back as `null` because it was never saved.

    Output:
    ```
    Saved Asha
    Asha 91 otp=null
    ```
tryIt:
  instructions: "Type this. It serializes a list into memory (a byte array) instead of a file. Then add `transient` before `int score` and run again: what changes?"
  code: |
    import java.io.*;

    public class Pack {
        static class Player implements Serializable {
            private static final long serialVersionUID = 1L;
            String name = "Ravi";
            int score = 50;
        }

        public static void main(String[] args) throws Exception {
            ByteArrayOutputStream bytes = new ByteArrayOutputStream();
            try (ObjectOutputStream out = new ObjectOutputStream(bytes)) {
                out.writeObject(new Player());
            }
            System.out.println("Bytes written: " + (bytes.size() > 0));

            ObjectInputStream in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()));
            Player p = (Player) in.readObject();
            System.out.println(p.name + " " + p.score);
        }
    }
