companies: [INFOSYS_SP, INFOSYS_DSE, TCS, PRODUCT, ALL]
infosysRelevance: "Core for SP and DSE coding rounds: subarray and substring problems (max sum of k, longest substring without repeats) are a very common pattern."
otherCompanies: "Frequently used in TCS coding questions and a favourite in product-company interviews (longest substring, minimum window, max consecutive ones)."
why: |
  Whenever a question says **"subarray"** or **"substring"** (a continuous part of an array or string) and asks for the **max, min, longest or shortest** one, the brute force checks every start and every end: O(n^2) or worse.

  The **sliding window** pattern keeps a "window" (a continuous range `[left..right]`) and **slides** it across the input. Instead of recomputing everything for each new window, it **adds** the element entering on the right and **removes** the element leaving on the left. Result: **O(n)**.

  It is one of the highest-value patterns for coding rounds: maximum sum of k elements, longest substring without repeating characters, smallest subarray with sum at least S, max consecutive ones, and more.
analogy: |
  Think of looking at a **long train** through a **window of a moving bus** that shows exactly 3 coaches at a time.

  When the bus moves forward by one coach, you don't recount all 3 coaches. **One new coach appears** on the right and **one old coach disappears** on the left. You just update your count: plus the new, minus the old.

  For a **variable window**, imagine the window is **stretchy**: you widen it on the right to take in more coaches, and when something breaks the rule (say, two coaches of the same colour), you shrink it from the left until the rule is OK again.
