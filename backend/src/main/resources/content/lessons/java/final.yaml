keyTakeaways:
  - "final variable = assign once; final method = no overriding; final class = no subclassing."
  - "final locks the reference, not the object; a final list can still be modified."
  - "Blank finals must be assigned exactly once in every constructor."
  - "final and abstract can't be combined."
  - "finally = clean-up block that almost always runs; finalize = deprecated GC hook, don't use it."
