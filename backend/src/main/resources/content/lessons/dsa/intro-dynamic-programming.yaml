explanation: |
  ### When is a problem DP?
  Two signs (you'll see these words in textbooks):
  1. **Overlapping subproblems**: the same smaller question is asked many times (fib(3) above).
  2. **Optimal substructure**: the best answer for the big problem is built from best answers of smaller problems.

  Question words that hint at DP: **"number of ways"**, **"minimum / maximum"**, **"can you reach / make"**, **"longest / shortest subsequence"**, together with **choices** at each step (take or skip, 1 step or 2 steps, which coin).

  ### The 4-step recipe
  1. **State**: what does `dp[i]` (or `dp[i][j]`) mean, in one plain sentence? *"dp[i] = number of ways to reach step i."* This is the most important step.
  2. **Recurrence (transition)**: how is `dp[i]` built from smaller states? Think about the **last choice**. *"The last move was 1 step (from i-1) or 2 steps (from i-2): dp[i] = dp[i-1] + dp[i-2]."*
  3. **Base cases**: the smallest states you know directly. *"dp[0] = 1 (one way: do nothing), dp[1] = 1."*
  4. **Order and answer**: fill in an order where needed states are ready; the answer is usually `dp[n]`.

  ### Memoization vs tabulation
  | | Memoization (top-down) | Tabulation (bottom-up) |
  |---|---|---|
  | Style | recursion + cache (array/HashMap) | loops filling a table |
  | Computes | only states actually needed | every state in the table |
  | Risk | deep recursion: StackOverflowError for big n | none from recursion |
  | Ease | very close to the recurrence | needs a correct fill order |
  | Space trick | hard | often reduce to a few variables |

  ```java
  // memoization
  long fibMemo(int n) {
      if (n <= 1) return n;
      if (memo[n] != 0) return memo[n];
      return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);
  }
  // tabulation
  long[] dp = new long[n + 1];
  dp[1] = 1;
  for (int i = 2; i <= n; i++) dp[i] = dp[i - 1] + dp[i - 2];
  ```
  Plain recursion fib is **O(2^n)**; both DP versions are **O(n)**.

  ### Problem 1: climbing stairs
  You can climb 1 or 2 steps at a time. How many ways to reach step n?
  - State: `dp[i]` = ways to reach step i.
  - Recurrence: `dp[i] = dp[i-1] + dp[i-2]`. Base: `dp[0] = dp[1] = 1`.
  - It's Fibonacci in disguise. O(n) time; O(1) space if you keep only two variables.

  ### Problem 2: house robber
  Houses in a row hold money; you can't rob two **adjacent** houses. Maximum money?
  - State: `dp[i]` = best money from the first i houses.
  - Choice at house i: **skip** it (`dp[i-1]`) or **rob** it (`dp[i-2] + money[i]`).
  - Recurrence: `dp[i] = max(dp[i-1], dp[i-2] + money[i])`.
  ```java
  int prev2 = 0, prev1 = 0;
  for (int m : money) {
      int cur = Math.max(prev1, prev2 + m);
      prev2 = prev1;
      prev1 = cur;
  }
  return prev1;
  ```
  Greedy ("rob the richest house first") fails here; DP tries both choices at every house.

  ### Problem 3: coin change (fewest coins, any coin set)
  - State: `dp[a]` = fewest coins to make amount a.
  - Recurrence: for each coin c <= a, `dp[a] = min(dp[a], dp[a - c] + 1)` (the last coin was c).
  - Base: `dp[0] = 0`; unreachable amounts stay "infinity".
  - For coins {4, 3, 1} and amount 6, DP correctly gives **2** (3 + 3), where greedy gave 3. Time O(amount x coins).

  ### Problem 4: 0/1 knapsack (intro)
  n items, each with a weight and a value; a bag with capacity W. Each item is taken **whole or not at all**. Maximise value.
  - State: `dp[i][w]` = best value using the **first i items** with capacity **w**.
  - Choice for item i: skip it (`dp[i-1][w]`) or take it if it fits (`dp[i-1][w - weight] + value`).
  - Time and space O(n x W). The table can be squeezed to one row of size W+1 if you loop **w from high to low** (so each item is used at most once).

  ### Problem 5: Longest Increasing Subsequence (intro)
  A **subsequence** keeps the original order but may skip elements. For `[10, 9, 2, 5, 3, 7, 101, 18]` one LIS is `2, 3, 7, 18` (length 4).
  - State: `dp[i]` = length of the longest increasing subsequence **ending at index i**.
  - Recurrence: `dp[i] = 1 + max(dp[j])` over all `j < i` with `a[j] < a[i]` (or 1 if none).
  - Answer: the **maximum** of all `dp[i]` (not `dp[n-1]`!). Time O(n^2). (An O(n log n) version uses binary search; learn it later.)

  ### How to define the state (practical tips)
  - Ask: "If someone gave me the answers for all smaller inputs, what one extra decision would finish the job?" That decision becomes the recurrence.
  - Typical shapes: `dp[i]` = answer for the first i items / ending at i; `dp[i][j]` = answer for a sub-array i..j, or two strings' prefixes, or items with capacity j.
  - If the recurrence needs extra information (like "was the previous house robbed?"), add it to the state.
  - Check the state meaning against a tiny example by hand before coding.

  ### Complexity summary
  | Problem | Time | Space (simple / optimised) |
  |---|---|---|
  | Fibonacci / climbing stairs | O(n) | O(n) / O(1) |
  | House robber | O(n) | O(n) / O(1) |
  | Coin change (min coins) | O(amount x k) | O(amount) |
  | 0/1 knapsack | O(n x W) | O(n x W) / O(W) |
  | LIS (simple DP) | O(n^2) | O(n) |
  Rule of thumb: **time = number of states x work per state**.
tinyCode:
  code: |
    import java.util.Arrays;

    public class DpBasics {
        static long[] memo = new long[91];

        // top-down: recursion + memo
        static long fibMemo(int n) {
            if (n <= 1) return n;
            if (memo[n] != 0) return memo[n];          // already solved
            return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);
        }

        // bottom-up: fill a table from small to big
        static long fibTab(int n) {
            if (n <= 1) return n;
            long[] dp = new long[n + 1];
            dp[1] = 1;
            for (int i = 2; i <= n; i++) dp[i] = dp[i - 1] + dp[i - 2];
            return dp[n];
        }

        // house robber: no two adjacent houses
        static int rob(int[] money) {
            int prev2 = 0, prev1 = 0;                  // best up to i-2, i-1
            for (int m : money) {
                int cur = Math.max(prev1, prev2 + m);  // skip this house, or rob it
                prev2 = prev1;
                prev1 = cur;
            }
            return prev1;
        }

        // fewest coins for amount (works for ANY coins)
        static int coinChange(int[] coins, int amount) {
            int[] dp = new int[amount + 1];
            Arrays.fill(dp, Integer.MAX_VALUE);
            dp[0] = 0;
            for (int a = 1; a <= amount; a++) {
                for (int c : coins) {
                    if (c <= a && dp[a - c] != Integer.MAX_VALUE) {
                        dp[a] = Math.min(dp[a], dp[a - c] + 1);
                    }
                }
            }
            return dp[amount] == Integer.MAX_VALUE ? -1 : dp[amount];
        }

        public static void main(String[] args) {
            System.out.println(fibMemo(50) + " " + fibTab(50));
            System.out.println(rob(new int[]{2, 7, 9, 3, 1}));
            System.out.println(coinChange(new int[]{4, 3, 1}, 6) + " " + coinChange(new int[]{2}, 3));
        }
    }
  walkthrough: |
    - **fibMemo**: before recursing, it checks the notebook `memo[n]`. Each value from 2 to 50 is computed once, so fib(50) is instant. Plain recursion would make billions of calls. We use `long` because fib(50) = 12,586,269,025 does not fit in an `int`.
    - **fibTab** fills `dp` from left to right; same answer, no recursion.
    - **rob** on `[2, 7, 9, 3, 1]`: the best plan robs houses with 2, 9 and 1 = **12**. `prev1` is "best so far", `prev2` is "best up to the house before"; each step chooses skip (`prev1`) or rob (`prev2 + m`).
    - **coinChange**: for coins {4, 3, 1} and 6, `dp[6] = dp[3] + 1 = 2` (3 + 3), beating greedy's 3 coins. For coins {2} and amount 3, no combination works, so it returns -1. The `!= Integer.MAX_VALUE` check stops `MAX_VALUE + 1` from overflowing to a negative number.

    Output:
    ```
    12586269025 12586269025
    12
    2 -1
    ```
tryIt:
  instructions: "Type this 0/1 knapsack table. Before running, guess which items give the best value for capacity 7. Then print dp[n] (the last row) with Arrays.toString to see the best value for every capacity."
  code: |
    public class Knapsack {
        public static void main(String[] args) {
            int[] weight = {1, 3, 4, 5};
            int[] value  = {1, 4, 5, 7};
            int W = 7, n = weight.length;

            // dp[i][w] = best value using first i items with capacity w
            int[][] dp = new int[n + 1][W + 1];
            for (int i = 1; i <= n; i++) {
                for (int w = 0; w <= W; w++) {
                    dp[i][w] = dp[i - 1][w];                         // skip item i
                    if (weight[i - 1] <= w) {                        // or take it
                        dp[i][w] = Math.max(dp[i][w],
                                dp[i - 1][w - weight[i - 1]] + value[i - 1]);
                    }
                }
            }
            System.out.println("best value = " + dp[n][W]);
        }
    }
