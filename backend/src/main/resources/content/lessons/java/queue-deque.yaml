    - "I mentioned a real use: BFS or bracket matching"
  modelAnswer: |
    A queue is like a ticket counter line: first in, first out. I add with offer and take from the front with poll. A stack is like a pile of chapatis: last in, first out, using push, pop and peek. A deque is a double-ended queue, open at both ends, so the same object can act as a queue or a stack. In Java I use ArrayDeque for both. It's a circular array, so both ends are O(1) with no shifting. The old Stack class extends Vector, so it's synchronized and slower, and it even lets you insert in the middle, which breaks the stack idea. I use queues for BFS and stacks for bracket matching.
flashcards:
  - front: "Queue: methods that throw vs return special value"
    back: "add/offer, remove/poll, element/peek. The second of each pair returns false/null instead of throwing."
  - front: "Where do push, pop and peek work in a Deque?"
    back: "At the head (front). push = addFirst, pop = removeFirst, peek = peekFirst."
  - front: "Why ArrayDeque over Stack?"
    back: "Stack extends Vector: synchronized (slow) and exposes index methods that break LIFO. ArrayDeque is fast and docs recommend it."
  - front: "How is ArrayDeque built?"
    back: "A resizable circular array with head/tail indexes; O(1) amortized at both ends; no nulls; not thread-safe."
  - front: "Recommended stack declaration"
    back: "Deque<T> stack = new ArrayDeque<>();"
keyTakeaways:
  - "Queue = FIFO (offer, poll, peek); Stack = LIFO (push, pop, peek)."
  - "Deque allows both ends, so it can be a queue or a stack."
  - "ArrayDeque is a circular array: O(1) at both ends, no nulls, not synchronized."
  - "Prefer ArrayDeque over Stack (legacy, synchronized, breaks LIFO) and over LinkedList (more memory)."
  - "poll/peek return null on empty; remove/element/pop throw NoSuchElementException."
