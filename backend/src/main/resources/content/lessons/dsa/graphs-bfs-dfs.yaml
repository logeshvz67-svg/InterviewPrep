  modelAnswer: |
    A graph is things connected by links, like students connected in WhatsApp groups. BFS is like a rumour: first everyone directly connected hears it, then their contacts, level by level. I use a queue for that, and because closer people are reached first, BFS gives the shortest path when all links cost the same. DFS is like exploring a maze: go down one path as far as possible, then come back and try the next. I use recursion or a stack, and it's great for counting components like islands or detecting cycles. In both I keep a visited set, otherwise I go around in circles. With an adjacency list both are O(V plus E).
flashcards:
  - front: "BFS vs DFS data structure"
    back: "BFS: queue (level by level). DFS: recursion / stack (deep first)."
  - front: "Shortest path in an unweighted graph"
    back: "BFS; dist[v] = dist[u] + 1 when v is first discovered."
  - front: "BFS/DFS complexity (adjacency list)"
    back: "O(V + E) time, O(V) space."
  - front: "Number of islands idea"
    back: "Scan cells; on unvisited land, count++ and flood-fill (DFS/BFS) to mark the whole island."
  - front: "Kahn's algorithm detects a cycle when..."
    back: "The output order has fewer than V nodes."
  - front: "Directed cycle via DFS"
    back: "States 0/1/2; reaching a node in state 1 (on current path) = cycle."
keyTakeaways:
  - "Graphs = nodes + edges; use an adjacency list (O(V + E) space) for most problems."
  - "BFS uses a queue and finds shortest paths in unweighted graphs; mark visited when enqueuing."
  - "DFS uses recursion/stack; great for components, islands, cycles and topological sort."
  - "Always track visited nodes, or cycles cause infinite loops."
  - "Grids are graphs: neighbours are up, down, left and right cells."
  - "Topological sort (Kahn's) orders a DAG; leftover nodes mean a cycle."
