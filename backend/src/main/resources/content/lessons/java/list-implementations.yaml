keyTakeaways:
  - "ArrayList = resizable array: O(1) get, O(1) amortized add at end, O(n) middle insert."
  - "LinkedList = doubly linked nodes: O(1) at ends, O(n) get and O(n) to reach a middle position."
  - "ArrayList usually wins thanks to cache-friendly memory and lower overhead."
  - "Vector and Stack are legacy synchronized classes; Stack wrongly exposes index methods."
  - "Use ArrayDeque for stacks and queues."
  - "remove(int) removes by index; remove(Object) removes by value."
