companies: [INFOSYS_SP, PRODUCT]
infosysRelevance: "Depth topic for SP: knowing why thread pools exist and how CompletableFuture chains work shows real-world Java skill."
otherCompanies: "Frequently discussed in product-company and backend (Spring Boot) interviews; a strong bonus topic for service-company technical rounds."
why: |
  Creating a `new Thread()` for every small job is like hiring a new employee for every single parcel and firing them after delivery. It's slow, and if 10,000 requests arrive, you'd create 10,000 threads and the machine would choke.

  Real applications (web servers, Spring Boot apps, Android apps) use **thread pools**: a fixed team of threads that **reuse** themselves for many tasks. In Java, you use them through **`ExecutorService`**.

  On top of that, **`CompletableFuture`** lets you write **async pipelines**: "fetch the price, then add tax, then show it, and if anything fails, show an error", without blocking.

  Interview favourites: **"What is a thread pool and why use it?"**, **"submit() vs execute()?"**, **"shutdown() vs shutdownNow()?"** and **"Future vs CompletableFuture?"**
analogy: |
  Think of a **Swiggy/Zomato kitchen** with a few fixed cooks.

  - **Thread pool**: the restaurant keeps **3 cooks** on staff. It doesn't hire a new cook for every order.
  - **Task queue**: orders pile up on the **order rail**. A free cook picks the next order.
  - **`submit()`** puts an order on the rail and gives you a **token** (`Future`).
  - **`shutdown()`**: "No new orders, but finish the ones on the rail, then go home."
  - **`shutdownNow()`**: "Stop everything right now and leave."
  - **CompletableFuture** is the **order-tracking pipeline** in the app: *placed → cooking → packed → out for delivery → delivered*, each step starting automatically when the previous finishes, with a "sorry, order failed" message if something goes wrong.
