  explanation: |
    Sorted by end: [1,2], [3,4], [0,6], [5,7], [5,9], [8,9] (sorting objects is stable, so [5,9] stays before [8,9]). This version uses a strict `>`, so a meeting must start AFTER the last one ends. Picks: [1,2]; [3,4] (3 > 2); [0,6] skipped; [5,7] (5 > 4); [5,9] skipped (5 is not > 7); [8,9] (8 > 7). Total 4.
commonMistakes:
  - "Sorting meetings by start time or by duration for activity selection; the correct key is END time."
  - "Assuming greedy coin change works for any coins; it fails for sets like {4, 3, 1}. Use DP for general coins."
  - "Coding a greedy idea without testing a small counterexample by hand first."
  - "Using greedy for 0/1 knapsack; only the fractional version is greedy."
  - "Mixing up >= and > for touching intervals; read whether [1,3] and [3,5] clash in the problem."
  - "Writing the comparator as (a, b) -> a[1] - b[1], which can overflow for very large or negative values; Integer.compare is safe."
interviewBox:
  why: "Why interviewers ask this: greedy problems test whether you can find a simple rule AND justify it; a confident but wrong greedy answer is a common failure."
  questions:
    - q: "What is a greedy algorithm?"
      a: "A greedy algorithm builds the solution step by step and at every step takes the choice that looks best right now, without going back. It works when a locally best choice is always part of some globally best answer, like picking the meeting that ends first. It's usually fast, O(n) or O(n log n), but for some problems it gives a wrong answer, so I check small counterexamples."
    - q: "How do you find the maximum number of non-overlapping meetings?"
      a: "I sort the meetings by end time. Then I go through them and pick a meeting if it starts after the last picked meeting ends. Picking the earliest-ending meeting leaves the most time for the remaining ones, so it's never worse than any other choice. It's O(n log n) because of the sort."
    - q: "Does greedy work for the coin change problem?"
      a: "Only for special coin systems like Indian or US currency. For coins 4, 3 and 1 with amount 6, greedy takes 4, 1 and 1, which is three coins, but 3 plus 3 is only two. For general coins I use dynamic programming, where for every amount I try each coin as the last coin and take the minimum."
    - q: "How do you solve the jump game?"
      a: "I keep the farthest index I can reach so far. Going left to right, if the current index is beyond the farthest reach, I'm stuck and return false. Otherwise I update farthest with i plus nums[i]. If I finish the loop, the end is reachable. It's O(n) time and O(1) space."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "Jump game trace. What is printed?"
    code: |
      int[] nums = {2, 0, 2, 0, 1};
      int far = 0; boolean ok = true;
      for (int i = 0; i < nums.length; i++) {
          if (i > far) { ok = false; break; }
          far = Math.max(far, i + nums[i]);
      }
      System.out.println(ok + " " + far);
    options: ["true 5", "false 2", "true 4", "false 4"]
    answer: 0
    explanation: "i=0: far = 2. i=1: far stays 2. i=2: far = 4. i=3: far stays 4. i=4: far = max(4, 5) = 5. No index was beyond far, so ok is true and far is 5. \"false 2\" assumes the 0 at index 1 blocks us, but index 0 jumps straight over it to index 2."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "For meetings {0,10}, {1,2}, {3,4}, {5,6} this returns 1, but 3 meetings fit. What is the bug?"
    code: |
      Arrays.sort(m, (a, b) -> Integer.compare(a[0], b[0]));
      int count = 0, lastEnd = Integer.MIN_VALUE;
      for (int[] meet : m) {
          if (meet[0] >= lastEnd) {
              count++;
              lastEnd = meet[1];
          }
      }
      return count;
    options:
      - "lastEnd should start at 0"
      - "It sorts by START time; the long meeting {0,10} is picked first and blocks the rest. Sort by END time (a[1]) instead"
      - "The condition should be meet[0] > lastEnd"
      - "count should start at 1"
    answer: 1
    explanation: "Sorted by start, {0,10} comes first and sets lastEnd = 10, so nothing else fits. Sorted by end, we pick {1,2}, {3,4}, {5,6} = 3. The >= vs > choice only matters for touching meetings, and lastEnd's start value is fine."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "Greedy coin change with coins {6, 5, 1} for amount 10. What does it print?"
    code: |
      int[] c = {6, 5, 1};
      int amt = 10, cnt = 0;
      for (int coin : c) {
          while (amt >= coin) { amt -= coin; cnt++; }
      }
      System.out.println(cnt);
    options: ["5", "2", "3", "10"]
    answer: 0
    explanation: "Greedy takes 6 (4 left), can't take 5, then takes 1 four times: 1 + 4 = 5 coins. The optimal answer is 2 (5 + 5), which is exactly why greedy is not safe for arbitrary coin sets. 2 is the DP answer, not what this code prints."
  - id: q4
    type: MCQ
    prompt: "Which problem is NOT correctly solved by a simple greedy rule?"
    code: null
    options: ["Fractional knapsack", "Maximum non-overlapping intervals", "0/1 knapsack", "Minimum platforms at a railway station"]
    answer: 2
    explanation: "In 0/1 knapsack you must take an item fully or not at all, so taking the best value/weight ratio first can leave wasted capacity; it needs DP. Fractional knapsack can take part of an item, so the ratio rule is optimal. The other two are standard greedy problems."
  - id: q5
    type: TRUE_FALSE
    prompt: "If a greedy algorithm gives the right answer on a few test cases, it is proven correct."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Greedy coin change works for amount 8 with {4, 3, 1} (4 + 4) but fails for 6. Correctness needs an argument (like an exchange argument), and testing small counterexamples is how you catch wrong greedy ideas."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Activity selection: fill in the comparator so meetings are sorted by end time."
    code: |
      Arrays.sort(m, (a, b) -> ____);
    acceptedAnswers: ["Integer.compare(a[1], b[1])", "Integer.compare(a[1],b[1])", "a[1] - b[1]", "a[1]-b[1]"]
    explanation: "a[1] is the end time. Integer.compare(a[1], b[1]) puts earlier ends first and never overflows; a[1] - b[1] also works for normal time values. Using a[0] would sort by start time, which gives wrong answers."
  - id: q7
    type: MATCH
    prompt: "Match each problem to its greedy rule"
    pairs:
      - left: "Max meetings in one room"
        right: "Sort by end time, pick if it starts after the last end"
      - left: "Jump game"
        right: "Track the farthest reachable index"
      - left: "Fractional knapsack"
        right: "Take the highest value per kg first"
      - left: "Minimum meeting rooms"
        right: "Sort starts and ends, count overlaps"
    explanation: "Each greedy problem has one key rule. Remembering the rule and the reason behind it is the whole skill."
  - id: q8
    type: MCQ
    prompt: "What is the time complexity of activity selection on n meetings?"
    code: null
    options: ["O(n)", "O(n log n)", "O(n^2)", "O(2^n)"]
    answer: 1
    explanation: "Sorting costs O(n log n); the selection loop is only O(n). O(2^n) would be trying every subset, which greedy avoids."
