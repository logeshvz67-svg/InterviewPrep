infosysRelevance: "Infosys-style basics practice: pattern-finding (series, codes, relationships) is a core reasoning skill and is closely related to how you spot patterns in coding problems."
otherCompanies: "Series, coding-decoding and blood relations are common practice topics in reasoning sections for TCS, Wipro, Cognizant, Accenture and Capgemini style tests."
why: |
  Logical reasoning questions check one skill: **can you find the hidden rule?** That is exactly what programmers do every day: see examples, find the pattern, write the rule as code.

  This lesson covers three classic question types:
  - **Series**: find the next number or letter.
  - **Coding-decoding**: a word is written in a secret code; find the rule and apply it.
  - **Blood relations**: find how two people are related from a chain of statements.

  For each type you get a **checklist of rules to try in order**, so you never stare at a question without a plan. And since these are patterns, we write tiny Java programs that apply them, which is good coding practice too.
analogy: |
  Think of being a **detective in a CID episode**.

  - You see clues: 2, 5, 10, 17, 26...
  - You test suspects one by one: "Is it adding the same number? No. Is it the gaps? +3, +5, +7, +9... Yes! The gaps are odd numbers."
  - A good detective has a **fixed list of suspects** to check, instead of guessing randomly.

  For blood relations, the detective draws a **family tree on the board** instead of keeping it all in the head.
