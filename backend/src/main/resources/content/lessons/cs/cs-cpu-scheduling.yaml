infosysRelevance: "Scheduling numericals (Gantt chart, waiting time, turnaround time) are a classic OS practice topic for SP and DSE technical and written rounds."
otherCompanies: "Common OS question for TCS, Wipro, Cognizant, Accenture and Capgemini; product companies expect you to explain trade-offs like starvation and response time."
why: |
  The CPU can run only one process per core at a time, but your computer has hundreds of processes ready. **CPU scheduling** is how the OS decides **who runs next and for how long**.

  Interviewers love this topic because:
  - it has **numericals**: draw a Gantt chart, compute waiting time and turnaround time,
  - it tests trade-offs: fairness vs speed, **starvation**, **convoy effect**,
  - it is pure logic, so a calm, step-by-step answer impresses.

  Learn the five algorithms on ONE example below, and the formulas will stick for life.
analogy: |
  Think of a **single billing counter at a supermarket**.

  - **FCFS**: whoever comes first is billed first. Fair, but if the first person has a full trolley, everyone with one item waits (convoy effect).
  - **SJF**: the cashier bills the person with the **fewest items** first. Average waiting drops, but a full-trolley person may wait forever if small baskets keep coming (starvation).
  - **SRTF**: same as SJF, but if someone with fewer items arrives, the cashier **pauses** the current customer and bills the new one.
  - **Round Robin**: each customer gets **3 items billed**, then goes to the back of the line. Everyone gets a turn quickly.
  - **Priority**: senior citizens and pregnant women go first.
