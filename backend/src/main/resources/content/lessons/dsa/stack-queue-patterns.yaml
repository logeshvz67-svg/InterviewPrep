explanation: |
  ### Key words
  - **Stack**: add and remove at the **same end** (the top). Operations: `push` (add), `pop` (remove top), `peek` (look at top). All O(1).
  - **Queue**: add at the **back**, remove from the **front**. Operations: `offer` (add), `poll` (remove front), `peek`. All O(1).
  - **Deque** ("deck", double-ended queue): can add/remove at **both** ends. In Java, `ArrayDeque` works as both a stack and a queue.

  ### Which Java class?
  | Need | Use | Methods |
  |---|---|---|
  | Stack | `Deque<Integer> st = new ArrayDeque<>();` | `push`, `pop`, `peek`, `isEmpty` |
  | Queue | `Queue<Integer> q = new ArrayDeque<>();` | `offer`, `poll`, `peek`, `isEmpty` |
  | Avoid | `Stack<Integer>` (old, synchronized, slower) | still works, but prefer `ArrayDeque` |

  Note: `ArrayDeque` does **not** allow `null` elements, and printing a stack made with `push` shows the **top first**.

  ### Pattern 1: matching brackets (valid parentheses)
  Rule: every closing bracket must match the **most recent unmatched** opening bracket. "Most recent" = top of a stack.
  ```java
  for (char c : s.toCharArray()) {
      if (c == '(' || c == '[' || c == '{') stack.push(c);
      else {
          if (stack.isEmpty()) return false;        // closer with no opener
          char open = stack.pop();
          if (!matches(open, c)) return false;      // wrong type: "(]"
      }
  }
  return stack.isEmpty();                           // leftover openers: "(("
  ```
  Three ways to fail: a closer with an empty stack, a wrong pair, and openers left at the end. O(n) time, O(n) space.

  ### Pattern 2: monotonic stack (next greater element)
  A **monotonic stack** keeps its items in one sorted direction (here: decreasing from bottom to top). For each element, we ask "who is the first bigger element to my right?"

  Brute force checks everything to the right of each element: O(n^2). The stack version:
  ```java
  int[] ans = new int[n];
  Arrays.fill(ans, -1);                         // default: no greater element
  Deque<Integer> stack = new ArrayDeque<>();    // indexes still waiting
  for (int i = 0; i < n; i++) {
      while (!stack.isEmpty() && a[i] > a[stack.peek()]) {
          ans[stack.pop()] = a[i];              // a[i] answers them
      }
      stack.push(i);
  }
  ```
  **Why O(n)?** Each index is pushed once and popped at most once, so the inner `while` runs at most n times **in total**, not n times per element. We store **indexes**, so we know where to write the answer.

  Same idea solves: stock span, daily temperatures, next smaller element (flip `>` to `<`), largest rectangle in a histogram.

  ### Pattern 3: min stack (getMin in O(1))
  Keep a second stack where each entry is "the minimum so far at this height".
  ```java
  void push(int x) {
      values.push(x);
      mins.push(mins.isEmpty() ? x : Math.min(x, mins.peek()));
  }
  void pop() { values.pop(); mins.pop(); }
  int getMin() { return mins.peek(); }
  ```
  Both stacks grow and shrink together, so after any pop the min is still correct. All operations O(1).

  ### Pattern 4: queue using two stacks
  Use an `in` stack for adding and an `out` stack for removing. When `out` is empty, pour **all** of `in` into `out`: this reverses the order, so the oldest item ends up on top.
  ```java
  void offer(int x) { in.push(x); }
  int poll() {
      if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop());
      return out.pop();
  }
  ```
  One poll may cost O(n), but each item moves from `in` to `out` only once, so the **amortized** cost (average over many operations) is **O(1)**.

  ### Pattern 5 (preview): queue for BFS
  **BFS** (Breadth-First Search) explores level by level: first all neighbours at distance 1, then distance 2, and so on. A queue gives exactly this order because the oldest discovered item is processed first.
  ```java
  Queue<Integer> q = new ArrayDeque<>();
  q.offer(start);
  while (!q.isEmpty()) {
      int cur = q.poll();
      for (int next : neighbours(cur)) {
          if (!visited[next]) { visited[next] = true; q.offer(next); }
      }
  }
  ```
  You will use this in the trees (level order) and graphs lessons.

  ### How to recognise the pattern
  | Clue in the problem | Pattern |
  |---|---|
  | brackets, tags, "undo", nested structure | stack |
  | "next greater / smaller", "previous greater", span | monotonic stack |
  | "get minimum in O(1)" | min stack (second stack) |
  | "level by level", "shortest steps", "in order of arrival" | queue / BFS |

  ### Complexity summary
  | Problem | Time | Space |
  |---|---|---|
  | Valid parentheses | O(n) | O(n) |
  | Next greater element (monotonic) | O(n) | O(n) |
  | Min stack operations | O(1) each | O(n) |
  | Queue via two stacks | O(1) amortized | O(n) |
  | BFS | O(V + E) | O(V) |
tinyCode:
  code: |
    import java.util.*;

    public class StackQueue {
        static boolean isValid(String s) {
            Deque<Character> stack = new ArrayDeque<>();
            for (char c : s.toCharArray()) {
                if (c == '(' || c == '[' || c == '{') {
                    stack.push(c);
                } else {
                    if (stack.isEmpty()) return false;
                    char open = stack.pop();
                    if ((c == ')' && open != '(') || (c == ']' && open != '[')
                            || (c == '}' && open != '{')) return false;
                }
            }
            return stack.isEmpty();
        }

        static int[] nextGreater(int[] a) {
            int[] ans = new int[a.length];
            Arrays.fill(ans, -1);
            Deque<Integer> stack = new ArrayDeque<>();   // holds indexes
            for (int i = 0; i < a.length; i++) {
                while (!stack.isEmpty() && a[i] > a[stack.peek()]) {
                    ans[stack.pop()] = a[i];
                }
                stack.push(i);
            }
            return ans;
        }

        public static void main(String[] args) {
            System.out.println(isValid("{[()]}") + " " + isValid("([)]") + " " + isValid("(("));
            System.out.println(Arrays.toString(nextGreater(new int[]{4, 5, 2, 25, 7})));

            Queue<String> queue = new ArrayDeque<>();
            queue.offer("A"); queue.offer("B"); queue.offer("C");
            System.out.println(queue.poll() + " " + queue.peek() + " " + queue);
        }
    }
  walkthrough: |
    - **isValid**: openers are pushed. For a closer, an empty stack means "no opener", so false. Otherwise pop and check the pair. At the end, the stack must be empty.
      - `{[()]}`: every closer matches the latest opener: `true`.
      - `([)]`: at `)`, the top is `[`: wrong pair, `false`.
      - `((`: no mismatch, but two openers are left over: `false`.
    - **nextGreater**: the stack holds indexes still waiting for a bigger number. 5 answers 4; 25 answers 2 and then 5; 25 and 7 never get an answer, so they keep `-1`.
    - **Queue**: `offer` adds at the back. `poll` removes `A` (the oldest), `peek` shows `B` without removing it, and the queue now holds `[B, C]`.

    Output:
    ```
    true false false
    [5, 25, 25, -1, -1]
    A B [B, C]
    ```
tryIt:
  instructions: "Type this MinStack that returns the minimum in O(1) using a second stack. Run it, then push 1 at the end and print getMin() again."
  code: |
    import java.util.ArrayDeque;
    import java.util.Deque;

    public class MinStack {
        private final Deque<Integer> values = new ArrayDeque<>();
        private final Deque<Integer> mins = new ArrayDeque<>();

        void push(int x) {
            values.push(x);
            mins.push(mins.isEmpty() ? x : Math.min(x, mins.peek()));
        }

        void pop() { values.pop(); mins.pop(); }
        int top() { return values.peek(); }
        int getMin() { return mins.peek(); }

        public static void main(String[] args) {
            MinStack st = new MinStack();
            st.push(5); st.push(3); st.push(7); st.push(2);
            System.out.println("min = " + st.getMin());
            st.pop();
            System.out.println("min = " + st.getMin());
            st.pop(); st.pop();
            System.out.println("min = " + st.getMin() + ", top = " + st.top());
        }
    }
