explanation: |
  ### Key words
  - **Vertex / node**: a thing (city, person, cell). Usually numbered 0 to V-1.
  - **Edge**: a connection between two nodes. **Undirected** = two-way (friendship). **Directed** = one-way (Instagram follow, prerequisite).
  - **Weighted**: edges have a cost (road length). This lesson focuses on **unweighted** graphs.
  - **Neighbour**: a node directly connected by an edge.
  - **Connected component**: a group of nodes that can all reach each other.
  - **Cycle**: a path that comes back to where it started.
  - **V** = number of vertices, **E** = number of edges.

  ### Representations
  | | Adjacency list | Adjacency matrix |
  |---|---|---|
  | Idea | for each node, a list of neighbours | V x V table, `m[u][v] = 1` if edge |
  | Space | O(V + E) | O(V^2) |
  | "Is u connected to v?" | O(degree of u) | O(1) |
  | Loop over neighbours | fast, only real neighbours | O(V) every time |
  | Use when | almost always (sparse graphs) | small or very dense graphs |

  ```java
  List<List<Integer>> adj = new ArrayList<>();
  for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
  for (int[] e : edges) {
      adj.get(e[0]).add(e[1]);
      adj.get(e[1]).add(e[0]);   // skip this line for a DIRECTED graph
  }
  ```
  A **grid** is also a graph: each cell is a node and its up/down/left/right cells are neighbours. You don't build a list; you compute neighbours on the fly.

  ### BFS: shortest path in an unweighted graph
  ```java
  int[] dist = new int[n];
  Arrays.fill(dist, -1);              // -1 means "not visited"
  Queue<Integer> q = new ArrayDeque<>();
  dist[start] = 0;
  q.offer(start);
  while (!q.isEmpty()) {
      int u = q.poll();
      for (int v : adj.get(u)) {
          if (dist[v] == -1) {        // mark when ADDING to the queue
              dist[v] = dist[u] + 1;
              q.offer(v);
          }
      }
  }
  ```
  **Why does BFS give the shortest path?** The queue processes all nodes at distance d before any node at distance d+1. So the first time we reach a node, it is by the fewest edges. (For weighted edges you need Dijkstra's algorithm instead.)

  **Mark visited when you enqueue, not when you dequeue.** Otherwise the same node can be added to the queue many times.

  ### DFS: explore deeply
  ```java
  void dfs(int u, boolean[] visited) {
      visited[u] = true;
      // process u
      for (int v : adj.get(u)) {
          if (!visited[v]) dfs(v, visited);
      }
  }
  ```
  DFS uses the **call stack** (or your own `Deque` as a stack). Very deep graphs (like a 1000 x 1000 grid of land) can cause `StackOverflowError` with recursion; then use an explicit stack or BFS.

  ### Number of islands (connected components in a grid)
  Scan every cell. When you find unvisited land `'1'`, that is a **new island**: count it, then DFS (or BFS) to mark the whole island as visited, so it isn't counted again.
  ```java
  void sink(char[][] g, int r, int c) {
      if (r < 0 || c < 0 || r >= g.length || c >= g[0].length || g[r][c] != '1') return;
      g[r][c] = '0';                  // mark visited
      sink(g, r + 1, c); sink(g, r - 1, c);
      sink(g, r, c + 1); sink(g, r, c - 1);
  }
  ```
  The same "count how many times you start a new DFS" idea counts connected components in any graph. Time O(rows x cols).

  ### Cycle detection
  - **Undirected graph**: during DFS, if you see a visited neighbour that is **not your parent** (the node you came from), there is a cycle.
  - **Directed graph**: use three states. Seeing a node that is still **on the current path** means a back edge, which means a cycle.
  ```java
  // state: 0 = unvisited, 1 = on current path, 2 = done
  boolean hasCycle(int u) {
      state[u] = 1;
      for (int v : adj.get(u)) {
          if (state[v] == 1) return true;              // back edge
          if (state[v] == 0 && hasCycle(v)) return true;
      }
      state[u] = 2;
      return false;
  }
  ```

  ### Topological sort (intro)
  For a **directed acyclic graph** (DAG: directed, no cycles), a **topological order** lists nodes so that every edge u -> v has u **before** v. Example: an order to take courses respecting prerequisites.

  **Kahn's algorithm** (BFS-based):
  1. Count **in-degree** (number of incoming edges) of every node.
  2. Put all nodes with in-degree 0 (no prerequisites) in a queue.
  3. Poll a node, add it to the order, and reduce the in-degree of its neighbours; any neighbour that reaches 0 joins the queue.
  4. If the order has fewer than V nodes, the graph has a **cycle** (impossible schedule).

  ### Choosing BFS or DFS
  | Need | Use |
  |---|---|
  | Fewest steps / shortest path (unweighted) | BFS |
  | Level by level, "minimum time to spread" | BFS |
  | Explore a whole component, count components | either (DFS is shorter to write) |
  | Cycle detection in directed graphs, path existence | DFS |
  | Topological sort | Kahn's (BFS) or DFS |

  ### Complexity
  | Algorithm | Time | Space |
  |---|---|---|
  | BFS / DFS (adjacency list) | O(V + E) | O(V) |
  | BFS / DFS (matrix) | O(V^2) | O(V) |
  | Number of islands (R x C grid) | O(R x C) | O(R x C) worst-case recursion |
  | Kahn's topological sort | O(V + E) | O(V) |
tinyCode:
  code: |
    import java.util.*;

    public class GraphBasics {
        static List<List<Integer>> adj = new ArrayList<>();

        static void addEdge(int u, int v) {      // undirected: add both ways
            adj.get(u).add(v);
            adj.get(v).add(u);
        }

        static int[] bfs(int start, int n) {
            int[] dist = new int[n];
            Arrays.fill(dist, -1);                // -1 = not visited yet
            Queue<Integer> q = new ArrayDeque<>();
            dist[start] = 0;
            q.offer(start);
            while (!q.isEmpty()) {
                int u = q.poll();
                for (int v : adj.get(u)) {
                    if (dist[v] == -1) {          // first time we reach v
                        dist[v] = dist[u] + 1;
                        q.offer(v);
                    }
                }
            }
            return dist;
        }

        static void dfs(int u, boolean[] visited, List<Integer> order) {
            visited[u] = true;
            order.add(u);
            for (int v : adj.get(u)) {
                if (!visited[v]) dfs(v, visited, order);
            }
        }

        public static void main(String[] args) {
            int n = 6;
            for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
            addEdge(0, 1); addEdge(0, 2); addEdge(1, 3);
            addEdge(2, 3); addEdge(3, 4);            // node 5 has no edges

            System.out.println("BFS dist from 0: " + Arrays.toString(bfs(0, n)));
            List<Integer> order = new ArrayList<>();
            dfs(0, new boolean[n], order);
            System.out.println("DFS order from 0: " + order);
        }
    }
  walkthrough: |
    - **adj** is an adjacency list: `adj.get(3)` is the list of 3's neighbours. `addEdge` adds both directions because the graph is undirected.
    - **bfs**: `dist` doubles as the visited array (-1 = not visited). From 0 we reach 1 and 2 (distance 1), then 3 (distance 2, found first through 1), then 4 (distance 3). Node 5 is never reached, so it stays -1.
    - **dfs**: visits 0, then its first neighbour 1, then 1's unvisited neighbour 3, then 3's unvisited neighbour 2 (0 is already visited), then back at 3 it continues to 4.
    - The orders depend on the order neighbours were added. Different adjacency orders give different (but still correct) traversals.

    Output:
    ```
    BFS dist from 0: [0, 1, 1, 2, 3, -1]
    DFS order from 0: [0, 1, 3, 2, 4]
    ```
tryIt:
  instructions: "Type this number-of-islands solution. Each time the scan finds land, it counts one island and 'sinks' the whole island with DFS. Then change the last row to \"10011\" and predict the new count before running."
  code: |
    public class Islands {
        static void sink(char[][] g, int r, int c) {
            if (r < 0 || c < 0 || r >= g.length || c >= g[0].length || g[r][c] != '1') return;
            g[r][c] = '0';                        // mark visited by sinking the land
            sink(g, r + 1, c); sink(g, r - 1, c);
            sink(g, r, c + 1); sink(g, r, c - 1);
        }

        static int countIslands(char[][] g) {
            int count = 0;
            for (int r = 0; r < g.length; r++) {
                for (int c = 0; c < g[0].length; c++) {
                    if (g[r][c] == '1') {
                        count++;                  // found a new island
                        sink(g, r, c);            // remove all of it
                    }
                }
            }
            return count;
        }

        public static void main(String[] args) {
            char[][] grid = {
                "11000".toCharArray(),
                "11000".toCharArray(),
                "00100".toCharArray(),
                "00011".toCharArray()
            };
            System.out.println(countIslands(grid));
        }
    }
predict:
  code: |
    import java.util.*;

    public class Predict {
        public static void main(String[] args) {
            Map<Character, List<Character>> g = new HashMap<>();
            g.put('A', List.of('B', 'C'));
            g.put('B', List.of('D'));
            g.put('C', List.of('D', 'E'));
            g.put('D', List.of());
            g.put('E', List.of());

            Queue<Character> q = new ArrayDeque<>();
            Set<Character> seen = new HashSet<>();
            q.offer('A');
            seen.add('A');
            StringBuilder out = new StringBuilder();
            while (!q.isEmpty()) {
                char u = q.poll();
                out.append(u);
                for (char v : g.get(u)) {
                    if (seen.add(v)) q.offer(v);
                }
            }
            System.out.println(out);
        }
    }
  expectedOutput: |
    ABCDE
  explanation: |
    This is BFS on a directed graph. A is processed first and adds B and C. B adds D. C's neighbour D is already seen (`seen.add` returns false), so only E is added. The queue order is A, B, C, D, E. D appears only once because we mark nodes as seen when we add them to the queue.
commonMistakes:
  - "Forgetting the visited check, so the traversal loops forever on a cycle (or overflows the stack in DFS)."
  - "Marking a node visited when it is polled instead of when it is enqueued in BFS; the same node gets added many times."
  - "Using DFS to find the shortest path in an unweighted graph; DFS finds A path, BFS finds the SHORTEST."
  - "Adding only one direction for an undirected edge (or both directions for a directed edge)."
  - "Forgetting the bounds check (r < 0, c >= cols ...) before reading a grid cell."
  - "Using BFS for weighted shortest paths; weights need Dijkstra's algorithm."
interviewBox:
  why: "Why interviewers ask this: graph problems check whether you can model a real situation as nodes and edges and pick the right traversal; BFS/DFS are the base of many harder algorithms."
  questions:
    - q: "What is the difference between BFS and DFS?"
      a: "BFS explores level by level using a queue: first all neighbours at distance one, then distance two, so it finds the shortest path in an unweighted graph. DFS goes as deep as possible along one path using recursion or a stack, then backtracks; it's good for exploring components, detecting cycles and topological sort. Both are O(V plus E) with an adjacency list."
    - q: "How do you count the number of islands in a grid?"
      a: "I treat each land cell as a node connected to its four neighbours. I scan every cell; when I find land that's not visited, I increase the count and run DFS or BFS from it to mark the whole island as visited, for example by changing it to water. The answer is how many times I started a new search. It's O(rows times columns)."
    - q: "Adjacency list or adjacency matrix?"
      a: "An adjacency list uses O(V plus E) space and lets me loop over only real neighbours, so it's better for most graphs, which are sparse. A matrix uses V squared space but answers 'is there an edge between u and v' in O(1), so it's useful for small or very dense graphs."
    - q: "What is topological sort and how do you detect if it's impossible?"
      a: "It's an ordering of a directed graph where every edge goes from an earlier node to a later one, like ordering courses by prerequisites. With Kahn's algorithm I count in-degrees, start with nodes that have zero in-degree, and keep removing them and reducing their neighbours' in-degrees. If I can't output all V nodes, there is a cycle, so no valid order exists."
