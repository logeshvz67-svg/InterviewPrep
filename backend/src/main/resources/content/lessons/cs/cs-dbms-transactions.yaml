infosysRelevance: "ACID, isolation levels and serializability are important DBMS theory for SP and DSE technical rounds and connect to Spring @Transactional questions."
otherCompanies: "ACID properties are one of the most common DBMS questions at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies go deeper into isolation levels, locking and anomalies."
why: |
  When you transfer Rs 500 on UPI, two things must happen: your balance goes **down** and your friend's goes **up**. If the server crashes in the middle, money must not vanish. When lakhs of people pay at once, nobody's update should overwrite another's.

  That is what **transactions** and **concurrency control** guarantee. Interviewers ask:
  - **"Explain ACID with an example"** (very common),
  - dirty read / non-repeatable read / phantom read and **isolation levels**,
  - serializability, locking and **two-phase locking (2PL)**.

  As a Java/Spring developer you will use `@Transactional` every day, so this is practical, not just theory.
analogy: |
  Think of **buying a train ticket at a counter**.

  - **Atomicity**: either you pay AND get the ticket, or neither happens. You never pay without getting a ticket.
  - **Consistency**: the number of seats sold plus seats left always equals total seats.
  - **Isolation**: two people booking at two counters at the same moment can't both get seat 23. Each booking feels like it happened alone.
  - **Durability**: once the ticket is printed, a power cut does not erase your booking.
