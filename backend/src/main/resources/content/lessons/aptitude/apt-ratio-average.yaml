why: |
  A **ratio** compares quantities; an **average** summarises many numbers with one; a **mixture** is just an average with weights. These three ideas are tightly connected, and once you see the link, many "different" questions become the same question.

  Shortcuts in this lesson:
  - combining ratios like A:B and B:C in one step,
  - the **deviation method** for averages (no big additions),
  - the **alligation** rule for mixtures (a two-line answer instead of algebra),
  - the **replacement** formula for "remove and refill" questions.

  As always, you will learn **why** each shortcut works, and check answers with small Java programs.
analogy: |
  Think of **mixing two types of rice at a ration shop**.

  - Cheap rice costs Rs 40/kg and premium rice costs Rs 60/kg.
  - The shopkeeper wants a mix that sells at Rs 52/kg.
  - Every kg of cheap rice is Rs 12 **below** the target; every kg of premium is Rs 8 **above**.
  - To balance, the "below" and "above" amounts must cancel, like children on a **see-saw**: the heavier side sits closer to the middle. So he needs more premium rice than cheap rice, in the ratio 2 : 3.

  That see-saw balance is the **alligation** rule.
