infosysRelevance: "Useful for SP and DSE preparation: XOR tricks, power-of-two checks, counting set bits and bitmask subsets appear in coding questions and in output-prediction MCQs on operators."
otherCompanies: "Operator output questions (&, |, ^, ~, shifts) are common in service-company MCQ rounds; product companies ask single number, counting bits, power of two and subsets with bitmasks."
why: |
  Inside the computer, every `int` is just **32 bits** (32 zeros and ones). **Bit manipulation** means working on those bits directly with operators like `&`, `|`, `^`, `~`, `<<`, `>>`.

  Why bother?
  - Some problems have a **magic one-line answer** with bits: find the number that appears once when all others appear twice (XOR), check if a number is a power of two (`n & (n - 1)`), count the 1-bits.
  - Bit operations are **very fast** and use **O(1) extra space**, which interviewers love as an optimisation.
  - **Output-prediction questions** on `~`, `>>` and `>>>` with negative numbers are a common MCQ trap.
  - Bitmasks let you represent a **set** of up to 32 (or 64) items in one number, which is used to list all subsets.

  You only need a handful of tricks, and each one is easy once you can see the bits.
analogy: |
  Think of a row of **light switches in your hostel room**, numbered from the right: switch 0, switch 1, switch 2, and so on. Each switch is ON (1) or OFF (0). The whole row read together is a number.

  - **Check** a switch: look at just that one (`&` with a mask).
  - **Turn ON** a switch: flick it up without touching others (`|`).
  - **Turn OFF** a switch: flick it down (`& ~mask`).
  - **Toggle** a switch: flip whatever it is (`^`).
  - **Shift left** (`<<`): every switch's state moves one place to the left, which doubles the number, like adding a 0 at the end of a decimal number multiplies it by 10.
