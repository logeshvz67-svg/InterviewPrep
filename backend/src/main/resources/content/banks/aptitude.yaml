  topic: Percentages
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: A number increased by 25% becomes 150. What is the number?
  options: ['130', '120', '112.5', '125']
  answer: 1
  explanation: 'Increase by 25% means the new value is 125% of the number. So 1.25 x N = 150. N = 150 / 1.25 = 120. Check:
    25% of 120 is 30, and 120 + 30 = 150.'
- id: apt-003
  section: QUANT
  topic: Percentages
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: The price of a phone is increased by 20% and then decreased by 20%. What is the net change in price?
  options: [4% increase, 2% decrease, 4% decrease, No change]
  answer: 2
  explanation: 'Take the price as 100. After a 20% increase it becomes 120. A 20% decrease on 120 is 24, so the price becomes
    96. From 100 to 96 is a 4% decrease. Shortcut: x + y + xy/100 = 20 - 20 - 400/100 = -4.'
- id: apt-004
  section: QUANT
  topic: Percentages
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: In an exam, a student must get 40% marks to pass. He got 180 marks and failed by 20 marks. What are the maximum
    marks?
  options: ['550', '400', '450', '500']
  answer: 3
  explanation: Pass marks = 180 + 20 = 200. 200 is 40% of the maximum. So maximum = 200 / 0.4 = 500.
- id: apt-005
  section: QUANT
  topic: Profit and Loss
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: An article is bought for Rs. 400 and sold for Rs. 500. What is the profit percentage?
  options: [25%, 30%, 20%, 100%]
  answer: 0
  explanation: Profit = 500 - 400 = 100. Profit% = profit / cost price x 100 = 100 / 400 x 100 = 25%. Always divide by cost
    price, not selling price.
- id: apt-006
  section: QUANT
  topic: Profit and Loss
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO]
  question: A watch is sold for Rs. 720 at a loss of 10%. What is its cost price?
  options: [Rs. 780, Rs. 800, Rs. 792, Rs. 648]
  answer: 1
  explanation: 'Loss of 10% means SP = 90% of CP. So 0.9 x CP = 720. CP = 720 / 0.9 = 800. Check: 10% of 800 = 80, and 800
    - 80 = 720.'
- id: apt-007
  section: QUANT
  topic: Profit and Loss
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: A shirt has a marked price of Rs. 1,000 and is sold at a 15% discount. If the cost price is Rs. 680, what is the
    profit percentage?
  options: [15%, 30%, 25%, 20%]
  answer: 2
  explanation: Discount = 15% of 1000 = 150, so selling price = 850. Profit = 850 - 680 = 170. Profit% = 170 / 680 x 100 =
    25%.
- id: apt-008
  section: QUANT
  topic: Profit and Loss
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: A shopkeeper buys 10 pens for Rs. 80 and sells 8 pens for Rs. 80. What is his profit percentage?
  options: [10%, 15%, 20%, 25%]
  answer: 3
  explanation: Cost of 1 pen = 80 / 10 = Rs. 8. Selling price of 1 pen = 80 / 8 = Rs. 10. Profit per pen = 2. Profit% = 2
    / 8 x 100 = 25%.
