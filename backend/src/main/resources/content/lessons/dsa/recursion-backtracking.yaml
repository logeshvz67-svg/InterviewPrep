infosysRelevance: "Core for SP coding rounds: generating subsets, permutations and combinations with backtracking is a standard tool for harder problems with small input sizes."
otherCompanies: "Product-company interviews use recursion and backtracking often (subsets, permutations, N-Queens, word search); service companies ask factorial, Fibonacci and recursion basics."
why: |
  Some problems ask you to **try all possibilities**: all subsets of a set, all orderings (permutations), all ways to place queens, all paths in a maze. Loops alone can't easily do this when the number of choices is not fixed.

  **Recursion** (a function that calls itself on a smaller version of the problem) handles this naturally. **Backtracking** is recursion with a simple rhythm: **choose -> explore -> un-choose**. It builds a solution step by step and **undoes** the last step to try the next option.

  It's also the foundation for trees, graphs (DFS), divide and conquer (merge sort) and dynamic programming. If the constraints say **n <= 20**, think backtracking.
analogy: |
  Think of trying outfits before a family function with **3 shirts and 2 pants**.

  - You **choose** a shirt and put it on.
  - You **explore**: try each pair of pants with it, and look in the mirror.
  - You **un-choose**: take the shirt off, so you're back to the starting point, and try the next shirt.

  If you forgot to take off the shirt (no un-choose), you'd end up wearing three shirts at once. That's the most common backtracking bug.

  Recursion itself is like **Russian dolls**: open a doll, and inside is a smaller doll of the same kind, until the smallest doll that doesn't open. That smallest doll is the **base case**.
