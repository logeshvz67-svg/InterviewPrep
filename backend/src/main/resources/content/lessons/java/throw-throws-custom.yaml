title: "throw vs throws, custom exceptions"
version: 1
estimatedMinutes: 30
rebuild: false
patternCode: null
companies: [ALL]
infosysRelevance: "A common comparison question for SP and DSE; writing a small custom exception is useful practice for coding and design discussions."
otherCompanies: "throw vs throws is a common basic question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies also ask when to create custom exceptions."
why: |
  So far Java threw exceptions *for* you (divide by zero, null). Real programs also need to raise their **own** errors: "balance too low", "age cannot be negative", "user not found".

  Two keywords look almost the same and confuse everyone:
  - **throw** (no s) – actually raises an exception, right now.
  - **throws** (with s) – a warning label on a method: "this method might throw these."

  **"Difference between throw and throws?"** is a very common interview question, and **"How do you create a custom exception?"** usually follows. After this lesson you can answer both and write one in two minutes.
analogy: |
  Think of a **cricket match**.

  - **throw** is the bowler **actually bowling the ball**. It is an action, done once, at one moment, with one real ball (one exception object).
  - **throws** is the **team sheet before the match** saying "This bowler may bowl bouncers and yorkers." It is only a declaration. It warns the batsman (the caller) what might come.
  - A **custom exception** is like a new named rule your local tournament adds, e.g. "BallLostInPondException". It is still a cricket rule (it extends Exception), but its name tells everyone exactly what happened.
