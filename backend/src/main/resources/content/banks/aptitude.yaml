    the whole trip?
  options: [45 km/h, 48 km/h, 50 km/h, 52 km/h]
  answer: 1
  explanation: For the same distance both ways, average speed = 2xy / (x + y) = 2 x 60 x 40 / (60 + 40) = 4800 / 100 = 48
