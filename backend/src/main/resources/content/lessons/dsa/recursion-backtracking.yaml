commonMistakes:
  - "Missing or wrong base case, causing infinite recursion and StackOverflowError."
  - "Adding the shared list itself (res.add(cur)) instead of a copy (new ArrayList<>(cur)); every saved answer ends up as the same final list."
  - "Forgetting to un-choose (remove the last element / reset used[i]), so choices leak into the next branch."
  - "Calling list.remove(x) with an Integer value when you meant the last index; use cur.remove(cur.size() - 1)."
  - "Using backtracking for large n. 2^n and n! explode; check constraints (n <= 20 for subsets, n <= 10 for permutations)."
interviewBox:
  why: "Why interviewers ask this: recursion tests whether you can break a problem into smaller copies of itself, and backtracking shows you can explore all options systematically and reason about exponential complexity."
  questions:
    - q: "What is recursion and what is a base case?"
      a: "Recursion is when a function calls itself on a smaller version of the same problem. The base case is the smallest input that is answered directly without another call, like factorial of 1 is 1. Without a base case, the calls never stop and Java throws a StackOverflowError."
    - q: "What is backtracking?"
      a: "Backtracking is recursion that builds a solution step by step and undoes the last step to try other options. The rhythm is choose, explore, un-choose: add an option, recurse, then remove it. It's used for subsets, permutations, combinations, N-Queens and maze paths."
    - q: "How do you generate all subsets of an array? What is the complexity?"
      a: "For each element I have two choices, take it or skip it. I recurse with an index: add the element and recurse, remove it and recurse again. When the index reaches the end, I save a copy of the current list. There are 2 to the power n subsets and copying each takes up to n, so it's O(n times 2 to the n) time and O(n) recursion depth."
    - q: "Why do we add new ArrayList<>(current) instead of current to the result?"
      a: "Because current is one shared list that keeps changing during backtracking. If I add the list itself, all saved entries point to the same object, and after all the un-choose steps it ends up empty. Adding a copy freezes the subset at that moment."
    - q: "Why is naive recursive Fibonacci slow?"
      a: "Each call makes two more calls, and the same values are computed again and again; fib(n-2) is computed inside fib(n-1) and again separately. That gives about 2 to the n calls. Storing results in an array or map, called memoization, makes it O(n)."
quiz:
  - id: q1
    type: MCQ
    prompt: "How many subsets does a set of 5 distinct elements have, and what is the backtracking time complexity in general?"
    code: null
    options: ["10 subsets; O(n^2)", "32 subsets; O(n * 2^n)", "120 subsets; O(n!)", "25 subsets; O(n log n)"]
    answer: 1
    explanation: "Each element is either in or out: 2^5 = 32 subsets. Generating and copying them takes O(n * 2^n). 120 = 5! is the number of permutations, not subsets."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "How many times is fib called in total for fib(4)? What does this print?"
    code: |
      public class FibCalls {
          static int calls = 0;
          static int fib(int n) {
              calls++;
              if (n <= 1) return n;
              return fib(n - 1) + fib(n - 2);
          }

          public static void main(String[] args) {
              int value = fib(4);
              System.out.println(value + " " + calls);
          }
      }
    options: ["3 4", "3 9", "5 9", "3 5"]
    answer: 1
    explanation: "fib(4) = 3 (0, 1, 1, 2, 3). Calls: fib(4) calls fib(3) and fib(2); fib(3) calls fib(2) and fib(1); each fib(2) calls fib(1) and fib(0). Counting all nodes in the tree gives 9. The repeated fib(2) is exactly why naive Fibonacci is exponential. \"3 4\" counts only one call per value."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "This should print the 8 subsets of [1, 2, 3], but it prints 8 empty lists. What is the bug?"
    code: |
      import java.util.*;

      public class SubsetBug {
          static void subsets(int[] nums, int i, List<Integer> cur, List<List<Integer>> res) {
              if (i == nums.length) {
                  res.add(cur);
                  return;
              }
              cur.add(nums[i]);
              subsets(nums, i + 1, cur, res);
              cur.remove(cur.size() - 1);
              subsets(nums, i + 1, cur, res);
          }

          public static void main(String[] args) {
              List<List<Integer>> res = new ArrayList<>();
              subsets(new int[]{1, 2, 3}, 0, new ArrayList<>(), res);
              System.out.println(res);
          }
      }
    options:
      - "The base case should be i == nums.length - 1"
      - "res.add(cur) stores the same shared list 8 times; after all un-choose steps it is empty. Use res.add(new ArrayList<>(cur))"
      - "cur.remove should be cur.clear()"
      - "The two recursive calls are in the wrong order"
    answer: 1
    explanation: "All 8 entries point to one list object. Backtracking removes everything by the end, so it prints [[], [], [], [], [], [], [], []]. Saving a copy freezes each subset. Changing the base case would skip the last element, clear() would destroy earlier choices, and call order only changes the output order."
  - id: q4
    type: TRUE_FALSE
    prompt: "A recursive method with no reachable base case will eventually throw StackOverflowError in Java."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Each call adds a frame to the call stack. Without a base case the calls never return, the stack fills up, and the JVM throws StackOverflowError."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Fill the un-choose step: remove the LAST element added to cur."
    code: |
      cur.add(nums[i]);                 // choose
      backtrack(nums, i + 1, cur, res); // explore
      cur.remove(____);                 // un-choose
    acceptedAnswers: ["cur.size()-1", "cur.size() - 1"]
    explanation: "cur.size() - 1 is the index of the last element. Using remove(nums[i]) on a List<Integer> would call remove(int index) and remove the wrong element (or throw)."
  - id: q6
    type: MATCH
    prompt: "Match each backtracking step to its code"
    pairs:
      - left: "Base case / goal"
        right: "if (cur.size() == n) { res.add(new ArrayList<>(cur)); return; }"
      - left: "Choose"
        right: "used[i] = true; cur.add(nums[i]);"
      - left: "Explore"
        right: "permute(nums, used, cur, res);"
      - left: "Un-choose"
        right: "cur.remove(cur.size() - 1); used[i] = false;"
    explanation: "Every backtracking function has these four parts: stop and save at the goal, make a choice, recurse, and undo the choice."
  - id: q7
    type: PREDICT_OUTPUT
    prompt: "What does this recursive sum print?"
    code: |
      public class DigitSum {
          static int sumDigits(int n) {
              if (n < 10) return n;
              return n % 10 + sumDigits(n / 10);
          }

          public static void main(String[] args) {
              System.out.println(sumDigits(4096) + " " + sumDigits(7));
          }
      }
    options: ["19 7", "4096 7", "6 7", "19 0"]
    answer: 0
    explanation: "4096 % 10 = 6, then 409 -> 9, 40 -> 0, and 4 is the base case: 6 + 9 + 0 + 4 = 19. For 7, n < 10 is already true, so the base case returns 7 directly."
