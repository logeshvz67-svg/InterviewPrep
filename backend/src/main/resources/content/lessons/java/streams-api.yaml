infosysRelevance: "Frequently asked in SP and DSE rounds, both as theory (intermediate vs terminal, laziness) and as 'write this with streams' coding questions."
otherCompanies: "Stream coding questions (group by, count frequency, second highest, filter and collect) are common at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  Interviewers love questions like:
  - "Find the frequency of each character using streams."
  - "Get the names of employees with salary > 50,000, sorted."
  - "Group employees by department."
  - "Find the second highest number."

  With loops, each one is 10-15 lines with temporary lists and maps. With the **Stream API** (Java 8), each is a short, readable **pipeline** of 2-4 steps. Streams are also everywhere in real Spring Boot code.

  You also need the theory: **intermediate vs terminal** operations and **lazy evaluation**. These are favourite follow-up questions, and they explain some surprising outputs you will see in this lesson.
analogy: |
  Think of a **juice shop assembly line**.

  - The **source** is the crate of fruits (your list).
  - **Intermediate operations** are the workers on the line: one throws away bad fruits (`filter`), one peels and cuts them (`map`), one sorts by size (`sorted`).
  - The **terminal operation** is the final step that produces something: pouring juice into a glass (`collect`), counting glasses (`count`), or mixing all into one jug (`reduce`).

  The key point: **the workers don't start until someone orders juice**. If nobody places an order (no terminal operation), nothing happens. And fruits go down the line **one at a time**: fruit 1 is filtered and cut before fruit 2 is even picked up. That is **lazy evaluation**.
