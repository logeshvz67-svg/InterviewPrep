infosysRelevance: "Basic logic used in every problem; dry-running loops and counting their iterations is the base for time-complexity reasoning in SP-level DSA."
otherCompanies: "Pattern printing, number problems (digits, primes, factorials) and loop-output MCQs are standard practice for TCS, Wipro, Cognizant, Accenture and Capgemini."
why: |
  A **loop** repeats a block of code. Without loops you would need to write the same line a thousand times. With loops, one block can process a whole array, print a pattern, or check every number up to n.

  Why this lesson matters:
  - Almost every coding question uses at least one loop: sums, searching, counting, patterns, digit problems, prime checks.
  - Off-by-one errors (`<` vs `<=`, starting at 0 vs 1) are the most common reason for wrong answers.
  - **Dry-running** a loop (tracing it by hand, step by step) is the skill output questions test, and it is also how you count operations for **time complexity** later.
analogy: |
  Think of **climbing stairs at a railway station**.

  - A **for loop** is like knowing there are exactly 20 steps: start at step 1, go up one at a time, stop after step 20. You know the count in advance.
  - A **while loop** is like walking **until** you see your platform. You do not know how many steps it will take; you keep checking the condition.
  - A **do-while loop** is like a vending machine: you **press the button at least once**, and only then check "do I want another?"
  - An **infinite loop** is like the escalator that never ends because you forgot to actually move (forgot `i++`).
