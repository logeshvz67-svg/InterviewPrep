infosysRelevance: "Basic system design (scaling, caching, load balancing, a simple URL shortener) is useful preparation for SP-level and product-style technical discussions."
otherCompanies: "Product companies often ask freshers a simple design question like a URL shortener; service companies (TCS, Wipro, Cognizant, Accenture, Capgemini) may ask what a load balancer or cache is."
why: |
  Writing code that works for **one user** is a coding problem. Making it work for **one crore users** is a **system design** problem.

  Freshers are not expected to design Netflix, but you are expected to know the **building blocks** and talk sensibly:
  - client-server, **load balancer**, **cache**, **database replication and sharding**,
  - **vertical vs horizontal scaling**,
  - **CAP theorem** in simple words,
  - a small end-to-end design like a **URL shortener**.

  The interviewer mainly checks your **thinking process**: ask questions, estimate, draw boxes, explain trade-offs.
analogy: |
  Think of a **popular dosa restaurant growing up**.

  - Day 1: one cook, one stove (**one server**). Customers order at the counter (**client-server**).
  - More customers: buy a bigger stove and a faster cook (**vertical scaling**). There's a limit to how big a stove can be.
  - Even more: hire 5 cooks with 5 stoves (**horizontal scaling**), and a **manager at the door** sends each customer to a free cook (**load balancer**).
  - The most popular item (masala dosa batter) is kept **ready on the counter** instead of fetching from the store room each time (**cache**).
  - The recipe book is **photocopied** for every cook to read (**replication**), and the store room is split: rice items in room A, wheat items in room B (**sharding**).
