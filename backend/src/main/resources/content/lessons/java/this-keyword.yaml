infosysRelevance: "Basic OOP question for SP and DSE rounds; the name = name shadowing bug is a frequent spot-the-bug and output question."
otherCompanies: "A basic OOP question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  You have already seen `this.name = name;` in constructors. Many beginners type it without knowing **why**, and then one day they write `name = name;` and the field silently stays `null`.

  Interviewers ask:
  - "What is the `this` keyword? Where can you use it?"
  - "Can you use `this` inside a static method?"
  - "What's the difference between `this` and `this()`?"

  Understanding `this` also makes method chaining (`sb.append("a").append("b")`) and the Builder pattern feel natural.
analogy: |
  Imagine a **WhatsApp family group** where three people are named **Ravi**: the grandfather, the father and the son.

  - If someone writes "Ravi, come here", nobody knows which Ravi.
  - If the son says **"I"** or **"me"**, it's clear: he means himself.

  `this` is Java's word for **"me, this very object"**. When a parameter and a field have the same name (two Ravis), `this.name` means "**my** name field", and plain `name` means the parameter that was just passed in.
visual:
  diagram: |
    Student s1 = new Student("Ravi");

    Student(String name) {        <- parameter "name" = "Ravi"
        this.name = name;
    }      |          |
           |          +-- the PARAMETER (nearest name wins)
           +------------- the FIELD of the current object

      s1 -----> +-------------------+
      this ---> | name = "Ravi"     |   inside the constructor,
                +-------------------+   this == s1 (same object)

    WRONG:  name = name;   parameter = parameter, field stays null
  caption: "Inside a constructor or instance method, this is a reference to the current object. this.name is the field; plain name is the closer parameter."
