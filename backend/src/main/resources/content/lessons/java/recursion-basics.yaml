    factorial(4)  =  4 * factorial(3)

    CALLS GO DOWN (stack grows)          RETURNS COME UP (stack shrinks)
    +---------------------------+
    | factorial(1) -> base case |  returns 1
    +---------------------------+            |
    | factorial(2) = 2 * f(1)   |  returns 2 * 1  = 2
    +---------------------------+            |
