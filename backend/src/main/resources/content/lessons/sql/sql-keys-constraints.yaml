explanation: |
  ### What is a constraint?
  A **constraint** is a rule on a column or table that the database checks on every INSERT and UPDATE. If a row breaks the rule, the statement fails with an error and nothing is changed.

  Our tables with constraints:
  ```sql
  CREATE TABLE customers (
    customer_id INT PRIMARY KEY,
    name        VARCHAR(30) NOT NULL,
    email       VARCHAR(50) UNIQUE,
    city        VARCHAR(30) DEFAULT 'Bengaluru'
  );

  CREATE TABLE orders (
    order_id    INT PRIMARY KEY,
    customer_id INT NOT NULL
                REFERENCES customers(customer_id) ON DELETE CASCADE,
    order_date  DATE NOT NULL,
    amount      INT CHECK (amount > 0)
  );
  ```

  ### The constraint types
  | Constraint | Rule | Error example (PostgreSQL) |
  |---|---|---|
  | `NOT NULL` | value must be present | null value in column "name" ... violates not-null constraint |
  | `UNIQUE` | no two rows share the value (NULLs allowed) | duplicate key value violates unique constraint "customers_email_key" |
  | `PRIMARY KEY` | UNIQUE + NOT NULL; the main identifier; one per table | duplicate key value violates unique constraint "customers_pkey" |
  | `FOREIGN KEY` (`REFERENCES`) | value must exist in the parent table (or be NULL) | violates foreign key constraint "orders_customer_id_fkey" |
  | `CHECK` | a condition must not be false | violates check constraint "orders_amount_check" |
  | `DEFAULT` | not a rule, but fills a value when none is given | `city` becomes 'Bengaluru' |

  > MySQL difference: CHECK constraints are only **enforced from MySQL 8.0.16**. Older versions accepted the syntax and silently ignored it.

  ### Primary key vs unique key
  | Primary key | Unique key |
  |---|---|
  | Only **one** per table | Can have **many** |
  | Never NULL | NULL allowed (PostgreSQL and MySQL allow many NULLs; SQL Server allows one) |
  | The row's main identity; other tables point to it | An extra "no duplicates" rule, like email |
  | Automatically indexed | Automatically indexed |

  ### The family of keys (theory questions)
  - **Super key**: any set of columns that uniquely identifies a row. `{customer_id}`, `{customer_id, name}`, `{email}` (if email were required) are all super keys. Adding extra columns to a super key still gives a super key.
  - **Candidate key**: a **minimal** super key: remove any column and it stops being unique. `{customer_id}` and `{email}` are candidate keys; `{customer_id, name}` is not minimal.
  - **Primary key**: the candidate key **chosen** to be the main identifier.
  - **Alternate key**: a candidate key that was **not** chosen (email here). It's usually enforced with UNIQUE.
  - **Composite key**: a key made of **two or more columns**.
  - **Foreign key**: column(s) in a child table that refer to a key in a parent table.
  - **Surrogate key** vs **natural key**: a made-up id (like `customer_id` or an auto-increment) vs a real-world value (like Aadhaar number).

  ### Composite primary key
  A student can join many courses and a course has many students. The table that connects them uses **both** ids as its key:
  ```sql
  CREATE TABLE enrollments (
    student_id INT REFERENCES students(student_id),
    course_id  VARCHAR(10) REFERENCES courses(course_id),
    grade      CHAR(1) CHECK (grade IN ('A', 'B', 'C', 'D', 'F')),
    PRIMARY KEY (student_id, course_id)
  );
  ```
  Student 1 can be in DBMS and JAVA, but inserting (1, 'DBMS') a second time fails: `Key (student_id, course_id)=(1, DBMS) already exists.`

  ### Foreign keys and referential integrity
  **Referential integrity** means every foreign key value points to a real parent row. No orphans. The database checks it in both directions:
  - Inserting an order for customer 99 fails: `Key (customer_id)=(99) is not present in table "customers".`
  - Deleting a parent that still has children fails by default: `Key (customer_id)=(1) is still referenced from table "orders".`

  A foreign key can also point to the **same table**: `employees.manager_id REFERENCES employees(emp_id)` (a self-referencing key).

  ### ON DELETE options
  What should happen to children when the parent row is deleted?
  | Option | Effect on child rows |
  |---|---|
  | `NO ACTION` / `RESTRICT` (default behaviour) | the DELETE is refused |
  | `CASCADE` | children are deleted too |
  | `SET NULL` | child's foreign key becomes NULL |
  | `SET DEFAULT` | child's foreign key becomes its default value |
  `ON UPDATE CASCADE` similarly copies a changed parent key into the children.

  Use CASCADE when children make no sense without the parent (order lines without an order). Be careful: one DELETE can silently remove a lot of data.

  ### Adding constraints later
  ```sql
  ALTER TABLE employees ADD CONSTRAINT chk_salary_positive CHECK (salary > 0);
  ALTER TABLE customers ALTER COLUMN city SET NOT NULL;   -- PostgreSQL syntax
  ```
  Naming constraints (`chk_salary_positive`) makes error messages easier to read.
tinyCode:
  code: |
    CREATE TABLE customers (
      customer_id INT PRIMARY KEY,
      name        VARCHAR(30) NOT NULL,
      email       VARCHAR(50) UNIQUE,
      city        VARCHAR(30) DEFAULT 'Bengaluru'
    );

    CREATE TABLE orders (
      order_id    INT PRIMARY KEY,
      customer_id INT NOT NULL
                  REFERENCES customers(customer_id) ON DELETE CASCADE,
      order_date  DATE NOT NULL,
      amount      INT CHECK (amount > 0)
    );

    INSERT INTO customers (customer_id, name) VALUES (4, 'Fatima');
    -- city gets the default: 'Bengaluru', email is NULL

    INSERT INTO orders VALUES (107, 99, '2024-04-01', 500);
    -- ERROR:  insert or update on table "orders" violates
    --         foreign key constraint "orders_customer_id_fkey"
    -- DETAIL: Key (customer_id)=(99) is not present in table "customers".
  walkthrough: |
    - `customer_id INT PRIMARY KEY`: every customer must have a unique, non-NULL id.
    - `name ... NOT NULL`: a customer without a name is refused.
    - `email ... UNIQUE`: two customers can't share an email, but email may be NULL.
    - `DEFAULT 'Bengaluru'`: if the INSERT doesn't give a city, this value is used. Fatima gets 'Bengaluru'.
    - `REFERENCES customers(customer_id)` makes `orders.customer_id` a **foreign key**: it must match an existing customer.
    - `ON DELETE CASCADE`: deleting a customer also deletes their orders.
    - `CHECK (amount > 0)`: zero or negative amounts are refused.
    - The last INSERT fails because customer 99 does not exist. The database protects the data even if the app has a bug.
tryIt:
  instructions: "Create the two tables from the tiny code (drop the old customers/orders first if you have them). Then type these statements one by one; each of the last five should FAIL. Read every error message and say which constraint stopped it."
  code: |
    INSERT INTO customers VALUES
      (1, 'Anil', 'anil@mail.com', 'Bengaluru'),
      (2, 'Sneha', NULL, 'Mumbai');
    INSERT INTO orders VALUES
      (101, 1, '2024-01-05', 2500),
      (102, 2, '2024-01-07', 1200);

    -- Each of these should fail:
    INSERT INTO customers VALUES (1, 'Kavya', 'kavya@mail.com', 'Delhi');
    INSERT INTO customers VALUES (5, 'Kavya', 'anil@mail.com', 'Delhi');
    INSERT INTO customers VALUES (6, NULL, 'x@mail.com', 'Delhi');
    INSERT INTO orders VALUES (108, 2, '2024-04-02', -50);
    INSERT INTO orders VALUES (109, NULL, '2024-04-03', 300);
predict:
  code: |
    -- customers 1..4 and the 6 sample orders are loaded:
    -- 101 (cust 1), 102 (cust 2), 103 (cust 1),
    -- 104 (cust 3), 105 (cust 2), 106 (cust 1)
    -- orders.customer_id has ON DELETE CASCADE

    DELETE FROM customers WHERE customer_id = 1;

    SELECT order_id, customer_id, amount
    FROM orders
    ORDER BY order_id;
  expectedOutput: |2
     order_id | customer_id | amount
    ----------+-------------+--------
          102 |           2 |   1200
          104 |           3 |   3000
          105 |           2 |   1200
  explanation: |
    Customer 1 (Anil) had orders 101, 103 and 106. Because the foreign key says **ON DELETE CASCADE**, deleting Anil automatically deletes those three orders. Only orders of customers 2 and 3 remain.

    Without CASCADE (our original sample tables), the same DELETE would fail with: `update or delete on table "customers" violates foreign key constraint "orders_customer_id_fkey" on table "orders"`.
commonMistakes:
  - "Saying a unique key can never be NULL. UNIQUE allows NULLs (many in PostgreSQL/MySQL); only PRIMARY KEY forbids them."
  - "Saying a table can have many primary keys. It has one primary key, which may be composite (several columns)."
  - "Thinking a foreign key must point to a primary key only. It can point to any PRIMARY KEY or UNIQUE column."
  - "Using ON DELETE CASCADE everywhere and accidentally wiping related data with one DELETE."
  - "Relying on CHECK in old MySQL versions (before 8.0.16) where it was ignored."
  - "Confusing candidate key (minimal) with super key (any unique set, may have extra columns)."
interviewBox:
  why: "Why interviewers ask this: keys are the foundation of relational design. Clear definitions show solid DBMS basics."
  questions:
    - q: "What is the difference between a primary key and a unique key?"
      a: "Both stop duplicate values. A table has only one primary key and it can never be NULL; it's the main identity of the row. A table can have many unique keys, and they allow NULLs. For example, customer_id is the primary key and email is a unique key."
    - q: "What are super key, candidate key, primary key and alternate key?"
      a: "A super key is any set of columns that uniquely identifies a row. A candidate key is a minimal super key: remove any column and it's no longer unique. The primary key is the candidate key we choose, and the remaining candidate keys are alternate keys."
    - q: "What is a foreign key?"
      a: "A foreign key is a column in a child table that refers to a key in a parent table, like orders.customer_id referring to customers.customer_id. The database then makes sure every order belongs to a real customer. That rule is called referential integrity."
    - q: "What does ON DELETE CASCADE do?"
      a: "When a parent row is deleted, all child rows that refer to it are deleted automatically. For example, deleting a customer also deletes their orders. Other options are SET NULL, or the default, which refuses the delete."
    - q: "What is a composite key? Give an example."
      a: "A key made of two or more columns. In an enrollments table, (student_id, course_id) together is the primary key: a student can take many courses, but can't enroll in the same course twice."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "customers has email VARCHAR(50) UNIQUE, and Anil already has 'anil@mail.com'. What happens?"
    code: |
      INSERT INTO customers VALUES (5, 'Kavya', NULL, 'Delhi');
      INSERT INTO customers VALUES (6, 'Nikhil', NULL, 'Pune');
      INSERT INTO customers VALUES (7, 'Kavya', 'anil@mail.com', 'Delhi');
    options:
      - "All three succeed"
      - "The 2nd and 3rd fail"
      - "Only the 3rd fails (duplicate email); multiple NULL emails are allowed"
      - "All three fail"
    answer: 2
    explanation: "UNIQUE treats NULLs as not equal to each other in PostgreSQL and MySQL, so two NULL emails are fine. The third repeats anil@mail.com and fails with: duplicate key value violates unique constraint \"customers_email_key\"."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "Using our original sample tables (no CASCADE), this DELETE fails. Why?"
    code: |
      DELETE FROM customers WHERE customer_id = 1;
    options:
      - "customer_id is not a primary key"
      - "Orders still reference customer 1, and the foreign key has no ON DELETE CASCADE, so the delete is refused"
      - "DELETE needs the TABLE keyword"
      - "You can't delete the first row of a table"
    answer: 1
    explanation: "The real error is: update or delete on table \"customers\" violates foreign key constraint \"orders_customer_id_fkey\" on table \"orders\". Delete the orders first, or define the FK with ON DELETE CASCADE."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "Why is this enrollment rejected, given the table definition?"
    code: |
      -- PRIMARY KEY (student_id, course_id)
      -- grade CHAR(1) CHECK (grade IN ('A','B','C','D','F'))
      -- existing row: (1, 'DBMS', 'A')

      INSERT INTO enrollments VALUES (1, 'DBMS', 'C');
    options:
      - "Grade C is not allowed by the CHECK"
      - "The pair (1, 'DBMS') already exists, violating the composite primary key"
      - "student_id must be unique on its own"
      - "course_id must be a number"
    answer: 1
    explanation: "The composite key is the PAIR. Student 1 may appear many times (with different courses), but (1, DBMS) is a duplicate. 'C' is in the CHECK list, so that's not the problem."
  - id: q4
    type: MCQ
    prompt: "In customers(customer_id, email, name) where both customer_id and email are unique and required, which statement is correct?"
    code: null
    options:
      - "{customer_id, name} is a candidate key"
      - "{customer_id} and {email} are candidate keys; if customer_id is the primary key, email is an alternate key"
      - "There can be only one candidate key per table"
      - "name is a super key"
    answer: 1
    explanation: "Each of customer_id and email identifies a row on its own and is minimal, so both are candidate keys. {customer_id, name} is a super key but not minimal. name alone is not unique."
  - id: q5
    type: TRUE_FALSE
    prompt: "A table can have only one PRIMARY KEY, but that primary key may consist of several columns."
    options: ["True", "False"]
    answer: 0
    explanation: "True. One primary key per table; a multi-column one is called a composite key, like (student_id, course_id)."
  - id: q6
    type: MATCH
    prompt: "Match the ON DELETE option to what happens to child rows"
    pairs:
      - left: "CASCADE"
        right: "Child rows are deleted too"
      - left: "SET NULL"
        right: "Child foreign key becomes NULL"
      - left: "RESTRICT / NO ACTION"
        right: "The parent delete is refused"
    explanation: "The default is NO ACTION, which refuses the delete while children exist."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Complete the column so that orders.customer_id must match a customer."
    code: |
      customer_id INT NOT NULL ____ customers(customer_id)
    acceptedAnswers: ["REFERENCES", "references"]
    explanation: "REFERENCES parent_table(column) declares a foreign key inline. The table-level form is FOREIGN KEY (customer_id) REFERENCES customers(customer_id)."
explainBack:
  prompt: "Explain primary key, unique key and foreign key to a friend using the college ID example, and say what ON DELETE CASCADE does."
  rubric:
    - "I said a primary key is unique and never NULL, one per table"
    - "I said a unique key forbids duplicates but allows NULL, many per table"
    - "I explained a foreign key points to a row in another table"
    - "I explained ON DELETE CASCADE with an example"
    - "I mentioned candidate or composite keys"
  modelAnswer: |
    A primary key is like a roll number: every student has one, it's never blank and no two students share it, and a table has only one. A unique key is like an email ID: no two people can share it, but it can be empty, and a table can have several. Roll number, Aadhaar and email are all candidate keys; we pick one as primary. A foreign key is like the roll number on a library card: it must match a real student. ON DELETE CASCADE means when the student is deleted, their library cards are deleted automatically, so nothing is left pointing to nobody.
flashcards:
  - front: "Primary key vs unique key"
    back: "PK: one per table, never NULL, main identity. UNIQUE: many per table, NULLs allowed."
  - front: "Candidate key"
    back: "A minimal set of columns that uniquely identifies a row. One is chosen as PK; the rest are alternate keys."
  - front: "Super key"
    back: "Any set of columns that uniquely identifies a row (may include extra columns)."
  - front: "Foreign key / referential integrity"
    back: "Child column must match an existing parent key (or be NULL). No orphan rows."
  - front: "ON DELETE CASCADE"
    back: "Deleting a parent row deletes its child rows automatically."
  - front: "CHECK constraint"
    back: "A condition every row must satisfy, e.g. CHECK (amount > 0). Enforced in MySQL only from 8.0.16."
keyTakeaways:
  - "Constraints are rules the database enforces on every insert and update."
  - "PRIMARY KEY = UNIQUE + NOT NULL, one per table (can be composite)."
  - "UNIQUE allows NULLs; candidate keys not chosen as PK are alternate keys."
  - "Foreign keys keep referential integrity; ON DELETE decides what happens to children."
  - "NOT NULL, CHECK and DEFAULT keep individual values valid."
