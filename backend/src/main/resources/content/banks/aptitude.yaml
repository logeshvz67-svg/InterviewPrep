  question: A and B together can do a job in 12 days. A alone can do it in 20 days. How long will B alone take?
  options: [32 days, 36 days, 24 days, 30 days]
  answer: 3
  explanation: Together per day = 1/12. A per day = 1/20. B per day = 1/12 - 1/20 = 5/60 - 3/60 = 2/60 = 1/30. So B alone
    takes 30 days.
