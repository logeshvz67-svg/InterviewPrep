explanation: |
  ### The layers and their jobs
  | Layer | Annotation | Job | Must NOT do |
  |---|---|---|---|
  | **Controller** | `@RestController` | Map URLs, read input, validate, call a service, choose the status code | Business rules, SQL |
  | **Service** | `@Service` | Business logic, transactions, combining repositories | Know about HTTP (requests, status codes) |
  | **Repository** | `@Repository` / Spring Data interface | Read and write the database | Business decisions |
  | **DTO** | usually a `record` | The shape of JSON in and out | Hold database annotations |
  | **Entity** | `@Entity` | The shape of a database table row | Be sent directly to clients |

  Why split? **Separation of concerns** (each part has one reason to change), **testability** (test a service with mock repositories, no web server needed) and **reuse** (the same service can be called by a controller, a scheduled job or another service).

  In your project:
  - `backend/src/main/java/com/codequest/controller/AuthController.java` says it in its comment: *"Controllers are thin: read the request, call ONE service method, return a DTO."*
  - `backend/src/main/java/com/codequest/service/XpService.java` holds the XP rules (award once, daily caps).
  - `backend/src/main/java/com/codequest/repository/XpEventRepository.java` only queries data.
  - `backend/src/main/java/com/codequest/mapper/Mappers.java` converts entities to DTOs in one place.

  ### DTO vs Entity
  A **DTO (Data Transfer Object)** is a simple object whose only job is to carry data across a boundary (here: HTTP JSON). An **entity** maps to a database table.

  Never return entities from controllers:
  - **Security**: an entity may contain secrets. Your `User` entity has a `passwordHash`; `UserView` in `backend/src/main/java/com/codequest/dto/AuthDtos.java` does not.
  - **Lazy loading**: turning an entity into JSON can touch lazy fields after the transaction has ended and crash (lesson 8).
  - **Stability**: renaming a DB column should not break the mobile app using your API.

  Java **records** are perfect DTOs: short, immutable, and Jackson reads and writes them out of the box.

  ### REST basics
  **REST** (REpresentational State Transfer) is a style for HTTP APIs where URLs name **resources** (things) and HTTP **methods** say what to do with them.

  URL rules:
  - Use **nouns, plural**: `/api/books`, `/api/books/12`. Not `/api/getBooks` or `/api/deleteBook?id=12`.
  - Nest only for clear ownership: `/api/users/7/orders`.
  - Use **query parameters** for filtering, sorting and paging: `/api/mistakes?resolved=false&page=0&size=20`.

  | Method | Meaning | Example | Safe? | Idempotent? |
  |---|---|---|---|---|
  | GET | Read | `GET /api/books/12` | Yes | Yes |
  | POST | Create (server picks the id) | `POST /api/books` | No | No |
  | PUT | Replace the whole resource | `PUT /api/books/12` | No | Yes |
  | PATCH | Change some fields | `PATCH /api/mistakes/5/resolved` | No | Usually not guaranteed |
  | DELETE | Remove | `DELETE /api/books/12` | No | Yes |

  - **Safe** = does not change data. GET must never delete or update anything.
  - **Idempotent** = doing it once or ten times leaves the server in the same state. Deleting book 12 twice still means "book 12 is gone". Posting the same order twice creates **two** orders.

  ### Status codes you must know
  | Code | Name | When |
  |---|---|---|
  | 200 | OK | Successful GET / PUT / PATCH with a body |
  | 201 | Created | POST created something (`@ResponseStatus(HttpStatus.CREATED)`) |
  | 204 | No Content | Success with no body, typical for DELETE |
  | 400 | Bad Request | Invalid input: failed validation, wrong type (`/books/abc`) |
  | 401 | Unauthorized | Not logged in / bad token |
  | 403 | Forbidden | Logged in but not allowed |
  | 404 | Not Found | Resource or URL does not exist |
  | 405 | Method Not Allowed | URL exists but not for this method |
  | 409 | Conflict | Clashes with current state (email already registered) |
  | 415 | Unsupported Media Type | Wrong `Content-Type` (sent text, expected JSON) |
  | 500 | Internal Server Error | A bug on the server |

  Rule of thumb: **4xx = the client's mistake, 5xx = the server's mistake.**

  ### Pagination
  Never return 10,000 rows at once. Accept `page` and `size`, and return the items **plus** page info. Spring Data uses `PageRequest.of(page, size)` with **page numbers starting at 0**. The **offset** (rows skipped) is `page * size`.

  Your app returns its own stable shape, `PageResponse` (`backend/src/main/java/com/codequest/dto/PageResponse.java`): `items, page, size, totalItems, totalPages`. And `MistakeController` limits `size` with `@Min(1) @Max(100)` so nobody can ask for a million rows.

  ### ResponseEntity vs @ResponseStatus
  - `@ResponseStatus(HttpStatus.CREATED)` on a method: always that status.
  - `ResponseEntity<T>`: choose the status **at runtime**, e.g. `ResponseEntity.ok(body)` or `ResponseEntity.notFound().build()`. In larger apps, you usually throw an exception and let a global handler choose the status (lesson 6).
tinyCode:
  code: |
    package demo.rest;

    import org.springframework.http.HttpStatus;
    import org.springframework.http.MediaType;
    import org.springframework.http.ResponseEntity;
    import org.springframework.test.web.servlet.MockMvc;
    import org.springframework.test.web.servlet.request.MockHttpServletRequestBuilder;
    import org.springframework.test.web.servlet.setup.MockMvcBuilders;
    import org.springframework.web.bind.annotation.*;

    import java.util.*;
    import java.util.concurrent.atomic.AtomicLong;

    import static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.*;

    record BookRequest(String title, int price) {}
    record BookResponse(Long id, String title, int price) {}

    class BookService {
        private final Map<Long, BookResponse> store = new LinkedHashMap<>();
        private final AtomicLong ids = new AtomicLong();

        BookResponse create(BookRequest req) {
            long id = ids.incrementAndGet();
            BookResponse b = new BookResponse(id, req.title(), req.price());
            store.put(id, b);
            return b;
        }
        Optional<BookResponse> find(Long id) { return Optional.ofNullable(store.get(id)); }
        boolean delete(Long id) { return store.remove(id) != null; }
    }

    @RestController
    @RequestMapping("/api/books")
    class BookController {
        private final BookService service;
        BookController(BookService service) { this.service = service; }

        @PostMapping
        @ResponseStatus(HttpStatus.CREATED)
        BookResponse create(@RequestBody BookRequest req) { return service.create(req); }

        @GetMapping("/{id}")
        ResponseEntity<BookResponse> get(@PathVariable Long id) {
            return service.find(id).map(ResponseEntity::ok).orElse(ResponseEntity.notFound().build());
        }

        @DeleteMapping("/{id}")
        ResponseEntity<Void> delete(@PathVariable Long id) {
            return service.delete(id) ? ResponseEntity.noContent().build() : ResponseEntity.notFound().build();
        }
    }

    public class RestDemo {
        static MockMvc mvc = MockMvcBuilders.standaloneSetup(new BookController(new BookService())).build();

        static void show(String label, MockHttpServletRequestBuilder req) throws Exception {
            var res = mvc.perform(req).andReturn().getResponse();
            String body = res.getContentAsString();
            System.out.println(label + " -> " + res.getStatus() + (body.isEmpty() ? "" : " " + body));
        }

        public static void main(String[] args) throws Exception {
            show("POST   /api/books", post("/api/books").contentType(MediaType.APPLICATION_JSON).content("{\"title\":\"Java\",\"price\":450}"));
            show("GET    /api/books/1", get("/api/books/1"));
            show("DELETE /api/books/1", delete("/api/books/1"));
            show("GET    /api/books/1", get("/api/books/1"));
        }
    }
    // Output (plus a few log lines):
    // POST   /api/books -> 201 {"id":1,"title":"Java","price":450}
    // GET    /api/books/1 -> 200 {"id":1,"title":"Java","price":450}
    // DELETE /api/books/1 -> 204
    // GET    /api/books/1 -> 404
  walkthrough: |
    - `BookRequest` and `BookResponse` are **DTO records**: the JSON going in and coming out. The client never chooses the `id`; the server does.
    - `BookService` is the **service layer**. Here it stores books in a `Map` to keep the demo small; in a real app it would call a `BookRepository`.
    - `@RestController @RequestMapping("/api/books")`: every method's URL starts with `/api/books`. One plural noun = one resource.
    - `@PostMapping` + `@ResponseStatus(HttpStatus.CREATED)`: creating returns **201** and the new book.
    - `@GetMapping("/{id}")` returns `ResponseEntity`: **200** with the book if found, otherwise **404** with an empty body.
    - `@DeleteMapping("/{id}")`: **204 No Content** when deleted (nothing to send back), **404** if the id is unknown.
    - Notice the controller has **no business logic**: it only translates between HTTP and the service.
    - `MockMvc` is a fake HTTP client from Spring's test library: it sends requests to the controller without starting a real server. You will use it properly in the testing lesson. (It needs `spring-boot-starter-test`.)
    - Output: create (201), read (200), delete (204), read again (404 because it was deleted).
tryIt:
  instructions: "Type this pagination demo. Before running, work out on paper: with 45 items and size 20, what is the offset of page 2, how many items does it have, and how many pages exist?"
  code: |
    package demo.page;

    import org.springframework.data.domain.*;
    import java.util.*;
    import java.util.stream.*;

    public class PageDemo {
        public static void main(String[] args) {
            List<Integer> all = IntStream.rangeClosed(1, 45).boxed().toList();
            Pageable pageable = PageRequest.of(2, 20);
            List<Integer> slice = all.subList((int) pageable.getOffset(), Math.min(all.size(), (int) pageable.getOffset() + 20));
            Page<Integer> page = new PageImpl<>(slice, pageable, all.size());
            System.out.println("offset=" + pageable.getOffset() + " items=" + page.getNumberOfElements() + " totalPages=" + page.getTotalPages() + " first=" + slice.get(0) + " last=" + page.isLast());
        }
    }
