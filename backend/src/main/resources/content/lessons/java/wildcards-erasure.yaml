infosysRelevance: "A depth topic for SP technical rounds: explaining PECS and erasure clearly shows strong Java fundamentals beyond basic syntax."
otherCompanies: "Product companies use it to separate memorisers from people who understand generics; service companies rarely go this deep but may ask 'what is type erasure?'."
why: |
  In the last lesson you saw a surprising rule: **`List<Integer>` is not a `List<Number>`**. So how do you write one method that sums a `List<Integer>` *and* a `List<Double>`? The answer is **wildcards**: `?`, `? extends`, `? super`.

  You also saw you can't write `new T()`. The reason is **type erasure**: generics exist only for the compiler, and are removed before the program runs.

  These are favourite **depth questions**:
  - "What is the difference between `? extends T` and `? super T`?"
  - "What is PECS?"
  - "What is type erasure? What are its side effects?"

  One memory trick (PECS) and one idea (erasure) explain all of it.
analogy: |
  Think of **fruit baskets at a market**.

  - **`? extends Fruit`** = "a basket of *some* kind of fruit; you don't know which." Maybe it's a mango basket, maybe a banana basket. You can safely **take out** a fruit (whatever it is, it's a Fruit). But you can't **put in** a banana, because it might be the mango basket. **Read-only. It's a PRODUCER: it gives you fruit.**
  - **`? super Mango`** = "a basket that can hold mangoes": a mango basket, a fruit basket, or an any-thing basket. You can safely **put in** a mango. But when you take something out, you only know it's "some object". **Write-friendly. It's a CONSUMER: it accepts mangoes.**

  **Type erasure** is like the **label on the basket being removed at the warehouse**. The shop counter (compiler) checked the label carefully, but inside the warehouse (the JVM at run time), every basket just looks like "basket".
visual:
  diagram: |
    PECS = Producer Extends, Consumer Super

    List<? extends Number>  (PRODUCER: you READ from it)
       can point to: List<Number>, List<Integer>, List<Double>
       Number n = list.get(0);      OK  (anything inside is a Number)
       list.add(5);                 ERROR (might be a List<Double>)

    List<? super Integer>   (CONSUMER: you WRITE into it)
       can point to: List<Integer>, List<Number>, List<Object>
       list.add(5);                 OK  (all of them accept Integer)
       Integer x = list.get(0);     ERROR (might be a List<Object>)
       Object o = list.get(0);      OK

    TYPE ERASURE (compile time -> run time)
       List<String>   --compiler checks, then erases-->  List
       Box<T>         ------------------------------>  Box (T -> Object)
       <T extends Number>  ------------------------->  T -> Number
  caption: "Use ? extends when a collection only gives you values, ? super when it only receives values. At run time the type arguments are erased, so List<String> and List<Integer> are the same class."
