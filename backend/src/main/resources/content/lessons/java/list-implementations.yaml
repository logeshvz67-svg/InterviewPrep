    [5, 10, 20, 30] size=4
  explanation: |
    `nums.remove(1)` calls `remove(int index)`, so it removes the element at **index 1** (the first `1`), not "the value 1". `remove(Integer.valueOf(1))` calls `remove(Object)` and removes the first element **equal** to 1. `add(0, 5)` inserts at the front and shifts everything right.
commonMistakes:
  - "Saying LinkedList insertion is always O(1). Inserting at index i needs O(n) to walk there first."
  - "Choosing LinkedList for random access with get(i). It's O(n) per call, so a loop with get(i) becomes O(n²)."
  - "Confusing capacity with size. Capacity is the inside array length; size is the number of stored elements."
  - "Calling list.remove(1) on a List<Integer> expecting to remove the value 1. It removes index 1."
  - "Using Vector or Stack in new code. Use ArrayList, and ArrayDeque for stacks."
interviewBox:
  why: "Why interviewers ask this: it checks whether you know data structure internals and can choose the right tool, instead of repeating a half-true rule."
  questions:
    - q: "What is the difference between ArrayList and LinkedList?"
      a: "ArrayList uses a resizable array, so get by index is O(1), adding at the end is amortized O(1), but inserting or removing in the middle shifts elements, O(n). LinkedList uses doubly linked nodes, so adding or removing at the ends is O(1), but get by index is O(n) because it walks the chain. In practice ArrayList is usually faster because of cache-friendly memory and lower memory use."
    - q: "How does ArrayList grow internally?"
      a: "It keeps an Object array. The default capacity becomes 10 on the first add. When it's full, it creates a new array about 1.5 times bigger and copies the elements over. Because this happens rarely, adding at the end is O(1) amortized."
    - q: "Difference between ArrayList and Vector?"
      a: "Both are resizable arrays. Vector is a legacy class whose methods are synchronized, so it's thread-safe but slower, and it doubles in size when full. ArrayList is not synchronized and grows by 1.5 times. Today we use ArrayList, or a concurrent list if we need thread safety."
    - q: "Why is Stack not recommended?"
      a: "Stack extends Vector, so it's synchronized and slower, and it inherits index methods like get and add at position, which break the stack idea. The Java docs recommend using a Deque, like ArrayDeque, with push, pop and peek."
quiz:
  - id: q1
    type: MCQ
    prompt: "What is the time complexity of list.get(i) for an ArrayList and a LinkedList?"
    code: null
    options: ["O(1) and O(1)", "O(1) and O(n)", "O(n) and O(1)", "O(n) and O(n)"]
    answer: 1
    explanation: "ArrayList jumps straight to the array slot, O(1). LinkedList must walk node by node from one end, O(n)."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              List<Integer> list = new ArrayList<>(List.of(5, 6, 7, 8));
              list.remove(2);
              list.remove(Integer.valueOf(5));
              System.out.println(list);
          }
      }
    options: ["[6, 7, 8]", "[6, 8]", "[5, 6, 8]", "[7, 8]"]
    answer: 1
    explanation: "remove(2) removes index 2 (the value 7), giving [5, 6, 8]. remove(Integer.valueOf(5)) removes the value 5, giving [6, 8]. '[6, 7, 8]' is the trap: it treats remove(2) as removing the value 2, which isn't even in the list."
  - id: q3
    type: TRUE_FALSE
    prompt: "Inserting into the middle of a LinkedList by index is O(1) because only two pointers change."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Relinking is O(1), but first the list must walk to that index, which is O(n). So add(i, x) on a LinkedList is O(n) overall."
  - id: q4
