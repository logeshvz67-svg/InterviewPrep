  explanation: |
    `name` and `age` are normal fields, so they are saved and restored. `password` is `transient`, so it is skipped and comes back with the default value for a String, which is `null`.
commonMistakes:
  - "Forgetting that every field's type must also be Serializable; otherwise you get NotSerializableException at runtime."
  - "Not declaring serialVersionUID, then adding a field and getting InvalidClassException when reading old data."
  - "Thinking static fields are serialized. They belong to the class, not the object, so they are not saved."
  - "Expecting the constructor to run during deserialization. It does not (for a serializable class)."
  - "Saying transient fields become \"empty\". They get default values: null, 0 or false."
interviewBox:
  why: "Why interviewers ask this: it tests object state, marker interfaces and versioning in a few quick questions, and it connects to how data moves between systems."
  questions:
    - q: "What is serialization in Java?"
      a: "Serialization converts an object's state into a stream of bytes, so I can save it to a file or send it over a network. Deserialization is the reverse: it rebuilds the object from those bytes. A class must implement the Serializable interface to allow this."
    - q: "What is the use of the transient keyword?"
      a: "A transient field is skipped during serialization. I use it for sensitive or temporary data like passwords. After deserialization, the field gets its default value, like null or zero."
    - q: "Why should we declare serialVersionUID?"
      a: "It is a version number for the class. When reading, Java checks that the number in the saved bytes matches the class. If I don't declare it, Java generates one from the class structure, so a small change like adding a field breaks old data with InvalidClassException. Declaring it myself keeps control."
    - q: "Why is Serializable called a marker interface?"
      a: "Because it has no methods. It only marks the class to tell the JVM that its objects are allowed to be serialized."
    - q: "Are static variables serialized?"
      a: "No. Static variables belong to the class, not to any object, and serialization saves only the object's state."
quiz:
  - id: q1
    type: MCQ
    prompt: "A class does NOT implement Serializable and you call writeObject on its object. What happens?"
    code: null
    options: ["Compile-time error", "NotSerializableException at runtime", "It is saved without any fields", "It is saved normally"]
    answer: 1
    explanation: "writeObject accepts any Object, so the code compiles. At runtime Java checks for Serializable and throws NotSerializableException. Many people guess compile error, but the check happens while running."
  - id: q2
    type: TRUE_FALSE
    prompt: "A static field's value is written into the serialized bytes."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Serialization saves the object's state. Static fields belong to the class, so they are not written."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "What does this program print?"
    code: |
      import java.io.*;

      public class Ctor {
          static class Box implements Serializable {
              int v;
              Box() { System.out.println("ctor"); v = 5; }
          }

          public static void main(String[] args) throws Exception {
              ByteArrayOutputStream b = new ByteArrayOutputStream();
              try (ObjectOutputStream o = new ObjectOutputStream(b)) { o.writeObject(new Box()); }
              ObjectInputStream i = new ObjectInputStream(new ByteArrayInputStream(b.toByteArray()));
              Box copy = (Box) i.readObject();
              System.out.println("copy " + copy.v);
          }
      }
    options: ["ctor\nctor\ncopy 5", "ctor\ncopy 5", "ctor\ncopy 0", "copy 5"]
    answer: 1
    explanation: "\"ctor\" prints once, when new Box() runs. During deserialization the constructor of a serializable class is NOT called; the field v is restored directly from the bytes as 5. The tempting answer with two \"ctor\" lines assumes readObject calls the constructor."
  - id: q4
    type: SPOT_THE_BUG
    prompt: "Order implements Serializable, but saving it throws an exception. What is the bug?"
    code: |
      import java.io.*;

      public class Shop {
          static class Address { String city = "Pune"; }

          static class Order implements Serializable {
              private static final long serialVersionUID = 1L;
              int id = 7;
              Address address = new Address();
          }

          public static void main(String[] args) throws Exception {
              ObjectOutputStream out = new ObjectOutputStream(new ByteArrayOutputStream());
              out.writeObject(new Order());
              System.out.println("saved");
          }
      }
    options:
      - "serialVersionUID must be an int"
      - "Address is not Serializable, so writing Order throws NotSerializableException"
      - "ByteArrayOutputStream cannot be used with ObjectOutputStream"
      - "int fields cannot be serialized"
    answer: 1
    explanation: "Every field that is saved must itself be serializable. Address does not implement Serializable, so Java throws NotSerializableException: Shop$Address. Fix: make Address implement Serializable or mark the field transient. serialVersionUID is correctly a long, and ByteArrayOutputStream works fine."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Fill the keyword so that the password is NOT serialized."
    code: |
      class Account implements Serializable {
          String user;
          ____ String password;
      }
    acceptedAnswers: ["transient"]
    explanation: "transient tells serialization to skip the field. After reading, password will be null."
  - id: q6
    type: MATCH
    prompt: "Match each term to its meaning"
    pairs:
      - left: "Serializable"
        right: "Marker interface that allows saving objects as bytes"
      - left: "transient"
        right: "Field is skipped and gets a default value later"
      - left: "serialVersionUID"
        right: "Version number checked when reading"
      - left: "InvalidClassException"
        right: "Thrown when the saved and current class versions differ"
    explanation: "Serializable gives permission, transient skips a field, serialVersionUID labels the version, and a version mismatch throws InvalidClassException."
  - id: q7
    type: MCQ
    prompt: "You saved objects, then added a new field to the class. You never declared serialVersionUID. What most likely happens when you read the old file?"
    code: null
    options: ["The new field is null and everything works", "InvalidClassException because the generated version number changed", "Compile error", "The old file is automatically converted"]
    answer: 1
    explanation: "Without a declared serialVersionUID, Java computes one from the class structure. Adding a field changes it, so reading old bytes fails with InvalidClassException. If you had declared a fixed serialVersionUID, the old data would load and the new field would get its default value."
explainBack:
  prompt: "Explain serialization, transient and serialVersionUID to a friend using the house-shifting example."
  rubric:
    - "I said serialization turns an object into bytes and deserialization rebuilds it"
    - "I said the class must implement Serializable (a marker interface)"
    - "I explained transient fields are skipped and come back as default values"
    - "I explained serialVersionUID as a version label that must match"
    - "I mentioned static fields are not saved"
  modelAnswer: |
    Serialization is like packing furniture before shifting house. Java takes an object in memory and packs its field values into bytes, so I can save it to a file or send it over a network. Deserialization unpacks the bytes and rebuilds the object, without calling the constructor. The class must implement Serializable, which is a marker interface with no methods; it's just permission. If I mark a field transient, like a password, it's not packed and comes back as null or zero. Static fields aren't saved either, because they belong to the class. serialVersionUID is the label on the box: if the label doesn't match the current class, Java throws InvalidClassException.
flashcards:
  - front: "Serialization vs deserialization"
    back: "Object -> bytes (writeObject) vs bytes -> object (readObject)."
  - front: "What is a marker interface? Example?"
    back: "An interface with no methods that just tags a class. Serializable (also Cloneable)."
  - front: "transient field after deserialization?"
    back: "Default value: null, 0 or false."
  - front: "Why declare serialVersionUID?"
    back: "To control the class version; otherwise a generated value changes with the class and old data throws InvalidClassException."
  - front: "Is the constructor called on deserialization?"
    back: "No, not for the serializable class itself (only the no-arg constructor of the first non-serializable parent)."
keyTakeaways:
  - "Serialization = object to bytes; deserialization = bytes back to object."
  - "Serializable is a marker interface; all saved fields must be serializable too."
  - "transient and static fields are not saved."
  - "Always declare private static final long serialVersionUID."
  - "In real apps JSON is common, but the same ideas apply."
