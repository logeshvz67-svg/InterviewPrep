infosysRelevance: "Frequent in SP and DSE output questions and theory rounds: shared counters, static blocks running before main, and 'why is main static?'."
otherCompanies: "A frequent output and theory topic at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  You've typed `public static void main` many times. Now it's time to understand that `static`.

  `static` decides whether something belongs to **each object** or to the **class as a whole**. It appears in:
  - Theory questions: "Why is `main` static?", "Can a static method use instance variables?", "Can we override static methods?"
  - Output questions: shared counters, static blocks that print **before** `main`.
  - Everyday code: `Math.max`, `Integer.parseInt`, `Arrays.sort` are all static methods you call without creating objects.
analogy: |
  Think of a **classroom**.

  - Each student has their **own notebook**. Writing in Ravi's notebook doesn't change Priya's. Those are **instance variables** (one per object).
  - The classroom has **one whiteboard** on the wall. Everyone sees the same board; if anyone writes on it, everybody sees the change. That's a **static variable** (one per class).
  - The **class teacher** can take attendance without needing any particular student to be present. That's a **static method**: it works at class level, no object needed.
  - Every morning, before any lesson, the **room is unlocked and the fans switched on, once**. That's a **static block**: it runs once, when the class is first loaded.
