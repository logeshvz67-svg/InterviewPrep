title: "Stack vs heap"
version: 1
estimatedMinutes: 30
rebuild: false
patternCode: null
companies: [ALL]
infosysRelevance: "Common theory question for SP and DSE rounds, and the key to solving 'pass by value' and String == output questions."
otherCompanies: "A standard question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies; also the base for garbage collection questions."
why: |
  When you write `int age = 21;` or `new Student()`, where does that data actually go? Java uses two main memory areas: the **stack** and the **heap**.

  Understanding them explains a lot of "weird" behaviour that appears in output questions:
  - Why `==` on two Strings is sometimes `true` and sometimes `false`.
  - Why a method can change an object you pass in, but can't make your variable point to a new object (**Java is always pass-by-value**).
  - What `StackOverflowError` and `OutOfMemoryError` really mean.

  This is one of the most common JVM questions, and it's the foundation for garbage collection in lesson 3.
analogy: |
  Think of a **college hostel**.

  - The **stack** is your **study table's notepad**. Each time you start a task (call a method) you tear off a fresh page (a **stack frame**) and write small notes on it: numbers and **room numbers** (references). When the task is done, you throw that page away. Fast and tidy, but small.
  - The **heap** is the **hostel building** with many rooms. The actual **things** (objects) live in rooms. Your notepad only holds the **room number** where the object is.
  - The **String pool** is a **common room** in the hostel for popular strings. If ten people write `"Pune"`, they all get the same room number for the same `"Pune"`, instead of ten copies. But `new String("Pune")` insists on a **private room**.
  - Giving a friend your notepad entry is **copying the room number** (pass-by-value). They can go into the room and rearrange things, but if they scribble a different room number on *their* copy, *your* note doesn't change.
