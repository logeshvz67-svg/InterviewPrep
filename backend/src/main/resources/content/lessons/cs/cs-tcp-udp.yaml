otherCompanies: "A very common fresher question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies add flow control, congestion control and 'which would you use for X?' design questions."
why: |
  Both TCP and UDP carry your data across the internet, but they make **very different promises**. Choosing the right one decides whether a video call feels smooth or a bank payment is reliable.

  Interviewers like this topic because:
  - **"TCP vs UDP"** is a classic comparison question,
  - **"Explain the 3-way handshake"** checks if you understand connections,
  - **"Which protocol for a video call / file download / DNS?"** tests your judgement.
analogy: |
  **TCP is like a registered post with acknowledgement**, and **UDP is like shouting announcements at a railway station**.

  - TCP: before sending, you call your friend: "Are you there?" - "Yes, are you there?" - "Yes!" (handshake). Every parcel is numbered, your friend signs for each one, and if a parcel goes missing, you send it again. Slow but sure.
  - UDP: the announcer just speaks: "Train 12627 on platform 4". No check whether everyone heard. If someone missed it, the next announcement comes anyway. Fast and light, and for live information a little loss is fine.
