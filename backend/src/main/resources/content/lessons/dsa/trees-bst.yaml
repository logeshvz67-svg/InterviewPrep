explainBack:
  prompt: "Explain to a friend what a BST is, how searching works, and why a BST can become slow, using the library signboard idea."
  rubric:
    - "I defined root, leaf and left/right subtree in simple words"
    - "I stated the BST rule for the whole subtree, not just children"
    - "I explained search as going left or right at each node"
    - "I said O(log n) when balanced and O(n) when skewed"
    - "I mentioned inorder traversal gives sorted order"
  modelAnswer: |
    A tree is a hierarchy: the top node is the root, nodes with no children are leaves. In a binary search tree, every value in a node's left subtree is smaller and every value in its right subtree is bigger. It's like library signboards: at each sign, smaller numbers go left, bigger go right. To search, I compare at each node and go only one way, so in a balanced tree I check about log n nodes. But if I insert values in sorted order, every node goes to the right and the tree becomes a chain, so search becomes O(n). Self-balancing trees like the one inside TreeMap prevent that. Also, an inorder traversal of a BST gives values in sorted order.
flashcards:
  - front: "BST rule"
    back: "All values in the left subtree < node < all values in the right subtree, for EVERY node."
  - front: "Pre / in / post order"
    back: "Pre: Node L R. In: L Node R (sorted for BST). Post: L R Node."
  - front: "Level order traversal needs..."
    back: "A queue, plus size = q.size() to separate levels."
  - front: "Validate BST correctly"
    back: "Pass (min, max) bounds down: left gets (min, node), right gets (node, max). Or check inorder is strictly increasing."
  - front: "BST search complexity"
    back: "O(h): O(log n) balanced, O(n) skewed."
  - front: "LCA in a BST"
    back: "Both smaller: go left. Both bigger: go right. Otherwise current node is the LCA."
keyTakeaways:
  - "Tree problems follow one recursive shape: base case for null, solve left, solve right, combine."
  - "Pre/in/post order differ only in when the node is visited; level order uses a queue."
  - "BST: smaller left, bigger right, for whole subtrees; inorder gives sorted output."
  - "Validate a BST with (min, max) bounds, not just child checks."
  - "BST operations are O(h): O(log n) if balanced, O(n) if skewed; TreeMap uses a Red-Black tree to stay balanced."
