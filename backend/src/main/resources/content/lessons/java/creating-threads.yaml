  expectedOutput: |
    Inside: main
    Inside: worker
  explanation: |
    `t.run()` is a plain method call, so the lambda runs in the **current** thread, which is `main`. Only `t.start()` creates the new thread named `worker`. The order is fixed: `run()` finishes completely before `start()` is even called, and `join()` makes main wait for the worker's line.
commonMistakes:
  - "Calling run() instead of start() and believing a new thread was created."
  - "Extending Thread when the class also needs another parent class. Prefer implementing Runnable."
  - "Trying to return a value or throw a checked exception from Runnable.run(). Use Callable for that."
  - "Forgetting pool.shutdown(): the pool's threads keep the program alive."
  - "Assuming two started threads print in the order they were started."
interviewBox:
  why: "Why interviewers ask this: it shows whether you know how threads are really created and can choose the right tool, not just recite definitions."
  questions:
    - q: "What are the ways to create a thread in Java?"
      a: "We can extend the Thread class and override run, or implement Runnable and pass it to a Thread, or implement Callable and submit it to an ExecutorService. Runnable is usually preferred over extending Thread, and Callable is used when we need a return value."
    - q: "Runnable vs Callable?"
      a: "Runnable's run method returns nothing and cannot throw checked exceptions. Callable's call method returns a value and can throw checked exceptions. We submit a Callable to an executor and get a Future to read the result."
    - q: "What is the difference between start() and run()?"
      a: "start creates a new thread, and that new thread calls run. If we call run directly, it is just a normal method call in the current thread, so nothing runs in parallel. Also start can be called only once."
    - q: "Why is implementing Runnable better than extending Thread?"
      a: "Java supports only single inheritance, so extending Thread uses up the parent class. Runnable keeps the task separate from the worker, so the same task can run on any thread or thread pool."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What is printed? Think carefully about thread scheduling."
    code: |
      Thread t1 = new Thread(() -> System.out.print("A"));
      Thread t2 = new Thread(() -> System.out.print("B"));
      t1.start();
      t2.start();
    options: ["Always AB", "Always BA", "AB or BA: the order can vary", "Nothing, because there is no join()"]
    answer: 2
    explanation: "Both threads are started, and the scheduler decides which runs first, so either AB or BA is possible. 'Always AB' is tempting because t1 starts first, but starting first does not mean printing first. Missing join() does not stop the threads; the JVM waits for normal threads before exiting."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "Why does this code fail to compile?"
    code: |
      Runnable r = () -> {
          Thread.sleep(100);
          System.out.println("woke up");
      };
      new Thread(r).start();
    options:
      - "Lambdas cannot be used for Runnable"
      - "Runnable.run() cannot throw the checked InterruptedException from sleep, and it is not caught"
      - "Thread.sleep needs a long like 100L"
      - "start() must be called before creating the Runnable"
    answer: 1
    explanation: "Thread.sleep throws InterruptedException, a checked exception. Runnable.run() does not declare any, so you must catch it inside the lambda (or use Callable, whose call() throws Exception). Lambdas are fine for Runnable, and 100 is auto-widened to long."
  - id: q3
    type: TRUE_FALSE
    prompt: "Calling t.run() on a Thread object creates a new thread."
    options: ["True", "False"]
    answer: 1
    explanation: "False. run() is a normal method call executed by the current thread. Only start() asks the JVM to create a new thread."
  - id: q4
    type: MCQ
    prompt: "You need a background task that calculates a total and gives it back to you. What fits best?"
    code: null
    options: ["Runnable with a void run()", "Callable<Integer> submitted to an ExecutorService", "Extending Thread and calling run()", "A static variable and Thread.sleep"]
    answer: 1
    explanation: "Callable returns a value, and the Future from submit() lets you get it safely. Runnable returns void, so you'd need awkward shared variables. Calling run() doesn't even create a thread."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Fill in the Future method that waits for and returns the result."
    code: |
      Future<Integer> f = pool.submit(() -> 10 + 20);
      int result = f.____;
      System.out.println(result); // 30
    acceptedAnswers: ["get()", "get"]
    explanation: "Future.get() blocks (waits) until the Callable finishes and then returns its value. If the task threw an exception, get() throws an ExecutionException that wraps it."
  - id: q6
    type: MATCH
    prompt: "Match each term to its meaning"
    pairs:
      - left: "Runnable"
        right: "Task with void run(), no checked exceptions"
      - left: "Callable"
        right: "Task whose call() returns a value and may throw"
      - left: "Future"
        right: "Token to fetch a task's result later"
      - left: "start()"
        right: "Creates a new thread which then calls run()"
    explanation: "Runnable and Callable describe the work; Future is how you collect a Callable's answer; start() is what actually launches a new thread."
  - id: q7
    type: MCQ
    prompt: "Why do many developers prefer implementing Runnable over extending Thread?"
    code: null
    options:
      - "Runnable threads run faster"
      - "Java has single inheritance, and Runnable keeps the class free to extend another class"
      - "Thread cannot override run()"
      - "Runnable can return a value"
    answer: 1
    explanation: "Speed is the same. The real reasons are single inheritance and separating the task from the worker. Runnable cannot return a value; that's Callable."
explainBack:
  prompt: "Explain to a friend the three ways to create a thread, which one to prefer, and why calling run() is not the same as start()."
  rubric:
    - "I named extending Thread, implementing Runnable and implementing Callable"
    - "I said Callable returns a value (via Future) and can throw checked exceptions"
    - "I said Runnable is preferred over extending Thread because of single inheritance"
    - "I said run() runs in the current thread while start() creates a new one"
  modelAnswer: |
    There are three common ways. I can extend the Thread class and override run, but then my class can't extend anything else. I can write a Runnable, which is just the task, and give it to a Thread; this is usually better. Or, if I need an answer back, I write a Callable and submit it to a thread pool. The pool gives me a Future, like a token, and calling get on it gives me the result. One big trap: calling run directly is just a normal method call in the current thread. Only start actually creates a new thread.
flashcards:
  - front: "3 ways to create a thread"
    back: "Extend Thread; implement Runnable and pass to Thread; implement Callable and submit to an ExecutorService."
  - front: "Runnable vs Callable"
    back: "Runnable: void run(), no checked exceptions. Callable<V>: V call() throws Exception, returns a result via Future."
  - front: "start() vs run()"
    back: "start() creates a new thread that calls run(). run() alone is a normal call in the current thread."
  - front: "What does Future.get() do?"
    back: "Waits until the task finishes and returns its result (or throws ExecutionException if the task failed)."
keyTakeaways:
  - "Runnable = the work; Thread = the worker that runs it."
  - "Prefer Runnable over extending Thread (single inheritance, reuse with pools)."
  - "Use Callable when you need a return value or checked exceptions; collect it with Future.get()."
  - "Only start() creates a new thread; run() is a normal method call."
  - "The order in which started threads run is decided by the scheduler and can vary."
