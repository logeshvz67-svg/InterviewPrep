why: |
  In the last lesson, locks saved us from race conditions. But locks bring a new danger: **deadlock**, where threads wait for each other **forever** and the program simply freezes. No error, no exception, nothing.

  Deadlock is asked in both **Java** and **Operating Systems** interviews. The expected answer has three parts:
  1. **What** it is (with a small example).
  2. The **four Coffman conditions** that must all be true for it to happen.
  3. **How to prevent it**, especially **lock ordering**.

  Learn the story in this lesson once and you can answer all three confidently.
analogy: |
  Two friends, **Ravi and Priya**, are filling exam forms. There is **one pen** and **one sheet of paper**, and you need both to write.

  - Ravi grabs the **pen** and waits for the paper.
  - Priya grabs the **paper** and waits for the pen.
  - Neither will let go of what they have. Both wait. **Forever.**

  That's a deadlock. The fix is simple: a rule that **everyone must pick up the pen first, then the paper**. Now whoever gets the pen first will also get the paper, finish, and hand both over. Nobody can hold the paper while waiting for the pen. This rule is called **lock ordering**.
visual:
  diagram: |
    DEADLOCK: a cycle of waiting

       Ravi (Thread 1)                 Priya (Thread 2)
       holds  [ PEN ]                  holds  [ PAPER ]
       wants  [ PAPER ] ---waits--->   (held by Priya)
       (held by Ravi)   <---waits---   wants  [ PEN ]

          +---------+   waits for   +---------+
          | Thread1 | ------------> | Thread2 |
          +---------+ <------------ +---------+
                        waits for
                  cycle = deadlock, both stuck forever

    FIX (lock ordering): everyone locks PEN first, then PAPER
       T1: lock PEN -> lock PAPER -> work -> unlock both
       T2: lock PEN (waits until T1 is done) -> PAPER -> work
  caption: "Each thread holds one lock and waits for the other's lock, forming a cycle. If every thread takes locks in the same order, no cycle can form."
