companies: [INFOSYS_SP, INFOSYS_DSE, PRODUCT, ALL]
infosysRelevance: "Good SP and DSE project-round material: how you tested your project (JUnit 5, Mockito, MockMvc), how the database schema changes (Flyway), how it is deployed (Docker), and monolith vs microservices are common practice discussion topics."
otherCompanies: "Unit testing with Mockito and microservices basics are frequent at TCS, Wipro, Cognizant, Accenture and Capgemini. Product companies go deeper: test strategy, migrations in production, Docker image design and microservice trade-offs."
why: |
  Writing the code is only half of a real project. Interviewers also want to know:
  - **How do you know it works?** Unit tests with **JUnit 5 + Mockito**, and integration tests with **@SpringBootTest + MockMvc**.
  - **How does the database change safely over time?** **Flyway** versioned migrations.
  - **How is it shipped?** A **Docker** image.
  - **How would it grow?** **Monolith vs microservices**.

  Your `backend` has all four: `XpServiceTest`, `ApiFlowIntegrationTest`, eight Flyway migrations and a multi-stage `Dockerfile`. If you can explain these from your own repo, you will sound like someone who has shipped software, not just followed a tutorial.
analogy: |
  Think of a **car factory**.

  - **Unit tests** are like testing **one part on a bench**: the brake pad is tested with a fake wheel (a **mock**), no full car needed. Fast and precise.
  - **Integration tests** are the **test drive**: the whole car on a real track (the real Spring context, a real database). Slower, but proves the parts work together.
  - **Flyway migrations** are the **numbered modification log** of the factory floor: "Change 1: add paint booth. Change 2: add a second line." You never rewrite an old entry; you add a new numbered one.
  - **Docker** is a **shipping container**: the car plus everything it needs, packed the same way, so it runs the same at any port in the world.
  - **Monolith vs microservices**: one big factory under one roof, versus many small specialised factories (engine plant, paint plant) that send parts to each other by truck. More flexible, but now you need roads, schedules and tracking.
