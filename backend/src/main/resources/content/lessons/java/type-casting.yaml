companies: [ALL]
infosysRelevance: "Frequent in predict-the-output practice; casting rules also decide whether averages and big products come out right in SP coding problems."
otherCompanies: "Widening vs narrowing and byte overflow outputs are standard MCQ material at TCS, Wipro, Cognizant, Accenture and Capgemini."
why: |
  **Type casting** means converting a value from one data type to another, for example from `int` to `double`, or from `double` to `int`.

  You need this every day in coding:
  - Average of marks: `sum / count` with two ints gives a **whole number**, not `72.5`. A cast fixes it.
  - Character tricks: `(char) ('a' + 1)` gives `'b'`; `ch - '0'` turns the digit character `'7'` into the number `7`.
  - Big numbers: `(long) a * b` avoids overflow.

  And in MCQs, questions like *"What is `(byte) 130`?"* or *"Does `byte b = 10; b = b + 1;` compile?"* are very common. Once you know the two rules (widening is automatic, narrowing needs you), they become easy marks.
analogy: |
  Think of **pouring water between glasses**.

  - Pouring from a **small glass into a big jug** (int into long) is always safe. Nothing spills, so Java does it for you automatically. This is **widening**.
  - Pouring from a **big jug into a small glass** (double into int, int into byte) may spill. Java will not do it on its own; you must say "I know, pour anyway" by writing a cast like `(int)`. Whatever does not fit is lost. This is **narrowing**.
  - Pouring tea into a glass meant for milk (boolean into int) is not allowed at all. Some types simply do not convert.
