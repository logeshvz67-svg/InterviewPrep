companies: [INFOSYS_SP, INFOSYS_DSE, PRODUCT]
infosysRelevance: "Index basics (what they are, when they help, clustered vs non-clustered, composite left-prefix) are useful theory for SP and DSE technical interviews."
otherCompanies: "'What is an index and what are its disadvantages?' is a common DBMS practice question in service companies; product companies go deeper into composite indexes and EXPLAIN."
why: |
  A query that takes 2 milliseconds on 100 rows can take **seconds** on 10 million rows. The usual fix is an **index**.

  Interviewers ask about indexes to see if you think about **performance**, not just correctness:
  - What is an index and how does it make search faster?
  - Why not index every column?
  - Why does `WHERE salary = 45000` not use an index on `(dept_id, salary)`?
  - How do you check if a query uses an index? (**EXPLAIN**)

  You don't need to be a database administrator. You need the right mental picture, and this lesson gives you one.
analogy: |
  Think of a **thick textbook**.

  - To find "normalization" **without an index**, you turn every page from page 1. That's a **full table scan**.
  - The **index at the back of the book** lists topics alphabetically with page numbers. You jump to "N", find "normalization: page 212", and open page 212 directly.
  - The book index takes **extra pages**, and every time the author adds a new chapter, the index must be **updated** too. That's the cost of database indexes: more storage and slower inserts/updates.
  - A **phone contacts list sorted by surname, then first name** is a **composite index**. Finding all "Sharma"s is easy. Finding everyone named "Rahul" (first name only) is not: you'd have to read the whole list.
