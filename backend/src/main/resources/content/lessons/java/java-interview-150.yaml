infosysRelevance: "Interview practice (practice questions, not actual test questions): a structured way to answer Java theory questions clearly in SP and DSE technical rounds."
otherCompanies: "The same answering method works for TCS, Wipro, Cognizant, Accenture, Capgemini and product-company technical interviews."
why: |
  You may *know* Java and still lose marks because the answer comes out as a nervous jumble. Interviewers judge **clarity** as much as correctness.

  This lesson teaches a simple, repeatable way to answer **any** Java theory question:

  **Concept -> Example -> Use case** (we'll call it **C-E-U**).

  - It keeps answers short (30-60 seconds), which is perfect if spoken English is not your strongest skill: you follow a fixed track instead of searching for words.
  - It proves understanding, not memorising: the example and use case show you have actually used the idea.
  - It works for all the common topics: OOP, Strings, Collections, Exceptions, Multithreading, Java 8, JVM memory.

  At the end you'll have a map of the most common practice questions, grouped by topic, with the key point each answer must contain.
analogy: |
  Think of a **thali** at a South Indian mess.

  - The **rice** is the **Concept**: the base. One or two clear sentences: what it is.
  - The **sambar and poriyal** are the **Example**: they give taste. A tiny code line or a real-life comparison.
  - The **payasam** at the end is the **Use case**: where you would actually use it in a project. It leaves a good final impression.

  A plate with only rice (a dry definition) is boring. A plate with ten curries and no rice (rambling examples) is confusing. A good thali has all three, in the right order, in the right amount.
