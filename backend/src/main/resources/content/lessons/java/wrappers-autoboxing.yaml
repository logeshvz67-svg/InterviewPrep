  - front: "int c = map.get(\"missing\");"
    back: "NullPointerException: get returns null, and unboxing calls null.intValue()."
  - front: "Autoboxing / unboxing use which methods?"
    back: "Boxing: Integer.valueOf(x). Unboxing: x.intValue()."
  - front: "Long.valueOf(5).equals(5)?"
    back: "false: 5 is boxed as Integer, and Long.equals only matches Long."
keyTakeaways:
  - "Every primitive has a wrapper class; note Integer and Character."
  - "Autoboxing = Integer.valueOf; unboxing = intValue(); the compiler adds them."
  - "Integer.valueOf caches -128 to 127, so == between wrappers is unreliable: use equals()."
  - "== with one primitive side unboxes and compares values."
  - "Unboxing null throws NullPointerException: watch out for map.get on missing keys."
  - "Wrapper equals() is false across types (Long vs Integer)."
