  modelAnswer: |
    For small inputs Scanner is fine because it converts numbers for me, but it is slow. For big inputs I use BufferedReader on System.in. I read a full line with readLine, break it into pieces with StringTokenizer, and convert each piece with Integer.parseInt. Because readLine can throw IOException, I add throws IOException to main. For output I collect everything in a StringBuilder and print once. The big Scanner trap is calling nextLine right after nextInt. nextInt leaves the newline behind, so nextLine returns an empty string. I fix it by calling nextLine once to throw away that leftover newline.
