infosysRelevance: "DNS resolution and 'what happens when you type a URL' are good end-to-end networking practice for SP and DSE technical rounds."
otherCompanies: "'What happens when you type google.com' is a famous open-ended question for both service companies (TCS, Wipro, Cognizant, Accenture, Capgemini) and product companies, who expect depth at every step."
why: |
  **"What happens when you type a URL into the browser and press Enter?"** is one of the most famous interview questions in the world. It has no single right answer; it's a chance to **show how much you know**, layer by layer.

  It ties together everything in this world:
  - **DNS** (names to IP addresses),
  - **TCP** handshake and **TLS** (HTTPS),
  - **HTTP** request and response,
  - servers, load balancers, caching and browser rendering.

  A calm, ordered answer here makes a strong impression.
analogy: |
  DNS is like **finding a friend's house using a phone contact list**.

  - You know the **name** "Ravi" (the domain, `google.com`), but the auto driver needs an **address** (the IP address).
  - First you check **your own memory** (browser cache), then **your phone contacts** (OS cache and hosts file).
  - If not there, you ask your **building watchman** who knows a lot of addresses (the **recursive resolver**, usually your ISP or 8.8.8.8).
  - The watchman doesn't know Ravi, so he asks the **city office** (root server): "Ask the Chennai office for .com names." The **Chennai office** (TLD server) says: "Ask Ravi's apartment association." The **association** (authoritative server) gives the exact door number.
  - The watchman **remembers** it for a while (caching with TTL), so next time it's instant.
