commonMistakes:
  - "Saying \"Java passes objects by reference\". Java copies the reference value; it is always pass-by-value."
  - "Expecting a swap(a, b) method to swap the caller's variables. It only swaps the method's copies."
  - "Expecting p = new Something() inside a method to change the caller's variable."
  - "Forgetting that changing an object's fields or an array's elements through a parameter IS visible to the caller."
  - "Expecting text = text + \"!\" or count++ on a String/Integer parameter to affect the caller. They are immutable: a new object is created."
interviewBox:
  why: "Why interviewers ask this: the 'objects by reference' myth is very common, so this question quickly shows who understands references, stack and heap."
  questions:
    - q: "Is Java pass-by-value or pass-by-reference?"
      a: "Java is always pass-by-value. For primitives the value itself is copied. For objects, the value is the reference, so a copy of the reference is passed. The method can change the object through that copy, but it can't make the caller's variable point to a different object."
    - q: "If Java is pass-by-value, why does changing an object's field inside a method affect the caller?"
      a: "Because the copied reference still points to the same object on the heap. Two variables, one object. So changing the object's field through either variable is visible to both. What the method can't do is change which object the caller's variable points to."
    - q: "Can you write a swap method for two int variables in Java?"
      a: "Not for the caller's variables, because the method only gets copies. To swap, we put the values in an array or an object and swap the elements inside it, or we simply swap inline where the variables live."
    - q: "How would you prove Java is not pass-by-reference?"
      a: "Pass an object to a method that reassigns the parameter to a new object. After the method returns, the caller's variable still points to the old object. With real pass-by-reference, it would point to the new one."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              Box b = new Box();
              b.v = 1;
              set(b);
              System.out.println(b.v);
          }
          static void set(Box x) {
              x.v = 2;
              x = new Box();
              x.v = 3;
          }
      }
      class Box { int v; }
    options: ["1", "2", "3", "0"]
    answer: 1
    explanation: "x first points to the caller's Box, so x.v = 2 changes it. Then x is pointed at a new Box, and 3 goes into that new object, which the caller never sees. '3' is the pass-by-reference trap."
  - id: q2
    type: TRUE_FALSE
    prompt: "In Java, objects are passed by reference and primitives are passed by value."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Everything is passed by value. For objects, the value copied is the reference. That's why reassigning a parameter never affects the caller."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "The programmer wants this to print 'b a'. Why does it print 'a b'?"
    code: |
      public class Main {
          public static void main(String[] args) {
              String x = "a", y = "b";
              swap(x, y);
              System.out.println(x + " " + y);
          }
          static void swap(String p, String q) {
              String t = p;
              p = q;
              q = t;
          }
      }
    options:
      - "Strings can't be passed to methods"
      - "swap only exchanges its own copies of the references; x and y in main are untouched"
      - "The temp variable t must be static"
      - "println prints variables in alphabetical order"
    answer: 1
    explanation: "p and q are copies of x and y's references. Swapping p and q changes nothing in main. A swap method can't change the caller's variables in Java; you'd have to swap inside an array or object."
  - id: q4
    type: MCQ
    prompt: "A method receives int[] arr and does arr[0] = 50; What does the caller see?"
    options:
      - "Nothing changes, because Java is pass-by-value"
      - "Its array's first element is now 50"
      - "A compile error"
      - "A new array is created"
    answer: 1
    explanation: "The method got a copy of the reference to the same array on the heap, so changing an element changes the caller's array. 'Nothing changes' confuses changing the object with reassigning the parameter."
  - id: q5
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              int[] nums = {1, 2, 3};
              reset(nums);
              System.out.println(nums[0]);
              fill(nums);
              System.out.println(nums[0]);
          }
          static void reset(int[] a) { a = new int[]{0, 0, 0}; }
          static void fill(int[] a) { a[0] = 9; }
      }
    options: ["0\n9", "1\n9", "1\n1", "0\n0"]
    answer: 1
    explanation: "reset() only re-points its own copy at a new array, so nums still holds 1. fill() changes an element of the shared array, so nums[0] becomes 9."
  - id: q6
    type: MATCH
    prompt: "Match each action inside a method to whether the caller sees it"
    pairs:
      - left: "x = 10;  (x is an int parameter)"
        right: "Not visible: only the copy changes"
      - left: "p.name = \"Ravi\";  (p is an object parameter)"
        right: "Visible: same object on the heap"
      - left: "p = new Person();"
        right: "Not visible: only the copied reference moves"
      - left: "s = s + \"!\";  (s is a String parameter)"
        right: "Not visible: a new String object is created"
    explanation: "Only changes made to a shared object (fields, array elements, list contents) reach the caller. Reassigning a parameter, primitive or reference, never does."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Complete the one-line answer: Java is always pass-by-____."
    code: |
      // Interview answer:
      // Java is always pass-by-____ ; for objects, a copy of the reference is passed.
    acceptedAnswers: ["value"]
    explanation: "Java is always pass-by-value. Saying 'reference' is the classic wrong answer: what's passed is a copy of the reference, which is a value."
explainBack:
  prompt: "Explain to a friend why Java is pass-by-value even for objects, using the stack/heap picture or the address-chit analogy."
  rubric:
    - "I said Java is always pass-by-value"
    - "I explained objects live on the heap and variables hold references"
    - "I said a method can change an object's contents through the copied reference"
    - "I said reassigning the parameter doesn't affect the caller, which proves pass-by-value"
    - "I mentioned the swap example or immutable Strings"
  modelAnswer: |
    Java is always pass-by-value. Objects live on the heap, and a variable only holds a reference, like a house address on a chit. When I call a method, Java copies the chit, so the method has its own copy of the address. If the method goes to that address and paints the door, the change is real, so changing an object's fields is visible to the caller. But if the method writes a new address on its chit, by assigning the parameter to a new object, my chit doesn't change. That's why a swap method can't swap my variables, and why changing a String parameter doesn't affect me.
flashcards:
  - front: "Is Java pass-by-value or pass-by-reference?"
    back: "Always pass-by-value. For objects, the value passed is a copy of the reference."
  - front: "Method sets obj.field = x. Caller sees it?"
    back: "Yes: the copied reference points to the same heap object."
  - front: "Method does obj = new Thing(). Caller sees it?"
    back: "No: only the method's copy of the reference changes."
  - front: "Why can't you write swap(int a, int b) in Java?"
    back: "The method only gets copies; swap inside an array or object instead."
  - front: "Stack vs heap (one line)"
    back: "Stack: method frames with local variables/parameters. Heap: objects and arrays created with new."
keyTakeaways:
  - "Java is strictly pass-by-value; for objects the value is a copy of the reference."
  - "Changing an object's contents through a parameter is visible to the caller."
  - "Reassigning a parameter (primitive or reference) is never visible to the caller."
  - "A swap(a, b) method can't swap the caller's variables; swap inside an array or object."
  - "Immutable objects like String and Integer can't be changed by a method at all."
