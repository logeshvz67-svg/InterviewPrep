title: "Configuration, properties and profiles"
version: 1
estimatedMinutes: 35
rebuild: false
patternCode: null
companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
infosysRelevance: "Common SP and DSE practice topic: @Configuration vs @Component, @Value vs @ConfigurationProperties, and 'how do you keep dev and prod settings separate?' are typical follow-ups after IoC."
otherCompanies: "Asked as a practical Spring Boot question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies expect you to explain secrets in environment variables and property precedence."
why: |
  Real apps run in many places: your laptop, a test server, production. Each place has a different **database URL**, **password**, **port** and **feature switches**. If these values are written inside Java code, you must change code and rebuild for every place. That is slow and dangerous (passwords end up in Git).

  Spring Boot solves this with **external configuration**: values live in `application.yml`, environment variables or command-line arguments, and your code just reads them.

  In interviews you will hear: "What is the difference between `@Value` and `@ConfigurationProperties`?", "What are profiles?", "Where do you keep secrets?". Your own project in `backend/` answers all three, so you can speak from real experience.
analogy: |
  Think of a **mobile phone and its SIM card**.

  - The **phone** (your compiled app) is the same everywhere.
  - The **SIM card** (configuration) decides the network, number and plan. Swap the SIM, and the same phone works with Jio in Chennai or Airtel in Delhi. No need to rebuild the phone.
  - **Profiles** are like a **dual-SIM switch**: "use SIM 1 (dev) now" or "use SIM 2 (prod) now".
  - **Environment variables** are like the operator settings pushed by the network: they override whatever default the SIM came with.
  - `@ConfigurationProperties` is a neat **contacts list** with names and numbers in one place; `@Value` is like writing one number on your palm. Fine for one, messy for twenty.
visual:
  diagram: |
    Where a value comes from (higher row WINS)
    +---------------------------------------------+
    | 1. Command-line args   --app.jwt.secret=... |
    | 2. Java system props   -Dapp.jwt.secret=... |
    | 3. OS env variables    APP_JWT_SECRET=...   |
    | 4. application-dev.yml (active profile)     |
    | 5. application.yml     (defaults)           |
    +---------------------------------------------+
