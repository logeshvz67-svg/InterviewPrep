title: "DDL vs DML, DELETE vs TRUNCATE vs DROP"
version: 1
estimatedMinutes: 30
rebuild: false
patternCode: null
companies: [ALL, INFOSYS_DSE]
infosysRelevance: "DDL/DML categories and DELETE vs TRUNCATE vs DROP are standard quick-fire DBMS questions, useful for DSE and SP technical rounds."
otherCompanies: "'Difference between DELETE, TRUNCATE and DROP' is one of the most common SQL practice questions at TCS, Wipro, Cognizant, Accenture and Capgemini."
why: |
  SQL commands come in families. Knowing which family a command belongs to tells you how it behaves: can it be rolled back? Does it change the table's structure or only its data?

  The most famous question here is **"What is the difference between DELETE, TRUNCATE and DROP?"**. Most candidates give a memorised answer, and many get one detail wrong: whether TRUNCATE can be rolled back depends on the **database**. This lesson gives you the full, correct answer, tested on PostgreSQL, with the MySQL differences noted.
analogy: |
  Think of a **school notebook**.

  - **DELETE**: you erase **some lines** with an eraser (or all lines, one by one). Slow, but you choose exactly what to erase, and the page numbers keep counting from where they were.
  - **TRUNCATE**: you tear out **all the written pages** at once and keep the empty notebook with its cover and label. Fast, but no choosing.
  - **DROP**: you throw away the **whole notebook**, cover and label included. There's nothing left to write in.
  - **DDL** is about the notebook itself (buy, relabel, throw away). **DML** is about what you write inside it.
