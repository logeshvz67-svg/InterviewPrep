            walk(root);
            System.out.println();
        }
    }
  expectedOutput: |
    [4][5][2][3][1]
  explanation: |
    The tree is 1 at the root, 2 and 3 as its children, and 4 and 5 under 2. `walk` prints a node only AFTER both its subtrees: that is **postorder** (Left, Right, Node). So the leaves 4 and 5 come first, then their parent 2, then 3, and the root 1 is printed last.
commonMistakes:
  - "Validating a BST by checking only each node's direct children; a deeper node can still break the rule. Pass a (min, max) range."
  - "Forgetting the base case if (n == null) in recursive tree methods, causing NullPointerException."
  - "Assuming BST operations are always O(log n); a skewed tree (sorted inserts) makes them O(n)."
  - "Mixing up traversal names: the name says when the NODE is visited (pre = before children, in = between, post = after)."
  - "In level order, not storing q.size() before the inner loop, so nodes from the next level get mixed in."
  - "Using int bounds Integer.MIN_VALUE/MAX_VALUE in validation, which wrongly rejects nodes holding exactly those values."
interviewBox:
  why: "Why interviewers ask this: trees test whether you truly understand recursion (base case, trust the subproblem, combine) and whether you can reason about complexity in balanced vs skewed cases."
  questions:
    - q: "What are the different tree traversals?"
      a: "Depth-first ones are preorder, inorder and postorder. The name tells when the node itself is visited: preorder visits the node before its children, inorder between the left and right subtrees, and postorder after both. Breadth-first is level order, which uses a queue to visit level by level. All are O(n)."
    - q: "How do you check if a binary tree is a valid BST?"
      a: "I pass an allowed range down the tree. The root can be anything. When I go left, the maximum becomes the parent's value; when I go right, the minimum becomes the parent's value. If any node is outside its range, it's not a BST. Checking only direct children is not enough, because a node deep in the right subtree must still be bigger than the root. It's O(n)."
    - q: "What is the time complexity of searching in a BST?"
      a: "It's O(h), where h is the height. For a balanced tree the height is about log n, so search is O(log n). But if values are inserted in sorted order, the tree becomes a chain and search is O(n). Self-balancing trees like Red-Black trees, used by TreeMap, keep it O(log n)."
    - q: "How do you find the lowest common ancestor in a BST?"
      a: "I start at the root. If both values are smaller than the current node, I go left. If both are bigger, I go right. Otherwise one is on each side, or one equals the current node, so the current node is the LCA. It's O(h) time and O(1) space if done with a loop."
