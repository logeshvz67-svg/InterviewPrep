keyTakeaways:
  - "Scanner is simple but slow; BufferedReader + StringTokenizer is fast for large inputs."
  - "nextInt() leaves the newline behind; call nextLine() once before reading a real line."
  - "BufferedReader gives Strings only; convert with Integer.parseInt / Long.parseLong."
  - "readLine() needs throws IOException and returns null at end of input."
  - "Use trim().split(\"\\\\s+\") or StringTokenizer to split lines safely."
  - "Build output in a StringBuilder and print once in timed tests."
