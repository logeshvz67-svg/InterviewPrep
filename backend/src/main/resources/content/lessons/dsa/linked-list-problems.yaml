explanation: |
  ### Key words
  - **Node**: one box with `val` (the data) and `next` (a reference to the next node, or `null` at the end).
  - **Head**: the first node. If you lose the head, you lose the list.
  - **null**: "nothing here". The last node's `next` is `null`.
  - **Singly linked**: each node knows only the next one. **Doubly linked** nodes also know the previous one (Java's `LinkedList` class is doubly linked).

  ```java
  class Node {
      int val;
      Node next;
      Node(int val) { this.val = val; }
  }
  ```

  ### Array vs linked list
  | Operation | Array | Singly linked list |
  |---|---|---|
  | Access by index | O(1) | O(n) (walk from head) |
  | Insert/delete at front | O(n) (shift) | O(1) |
  | Insert/delete in middle (node known) | O(n) | O(1) |
  | Search a value | O(n) | O(n) |
  | Memory | compact | extra reference per node |

  ### Trick 1: reverse a list (prev / cur / next)
  ```java
  Node prev = null, cur = head;
  while (cur != null) {
      Node next = cur.next;   // 1. save the rest of the list
      cur.next = prev;        // 2. flip the arrow backwards
      prev = cur;             // 3. move prev one step
      cur = next;             // 4. move cur one step
  }
  return prev;                // prev is the new head
  ```
  **Why save `next` first?** Step 2 overwrites `cur.next`. Without the saved copy, the rest of the list is lost. Time O(n), space O(1).

  ### Trick 2: slow and fast pointers
  Both start at `head`. `slow` moves 1 step, `fast` moves 2 steps.

  **Middle of the list**
  ```java
  Node slow = head, fast = head;
  while (fast != null && fast.next != null) {
      slow = slow.next;
      fast = fast.next.next;
  }
  return slow;   // for an even length, this is the SECOND middle
  ```
  When fast reaches the end, slow has covered half the distance. For `1 2 3 4 5 6` it returns 4.

  **Cycle detection (Floyd's algorithm, "tortoise and hare")**
  ```java
  Node slow = head, fast = head;
  while (fast != null && fast.next != null) {
      slow = slow.next;
      fast = fast.next.next;
      if (slow == fast) return true;   // same NODE (==), not same value
  }
  return false;                        // fast fell off the end: no cycle
  ```
  If there is a loop, fast enters it and gains 1 step on slow each round, so it must eventually land on slow, like a faster runner lapping a slower one on a circular track. O(n) time, **O(1) space** (a HashSet of visited nodes also works but costs O(n) space).

  ### Trick 3: dummy node
  A **dummy** (or sentinel) node is a fake node placed **before** the head. It means "the node before the first node" always exists, so deleting the head or building a new list needs no special `if`. At the end you return `dummy.next`.

  **Remove the nth node from the end** (one pass, gap of n)
  ```java
  Node dummy = new Node(0);
  dummy.next = head;
  Node first = dummy, second = dummy;
  for (int i = 0; i <= n; i++) first = first.next;   // gap of n+1
  while (first != null) {
      first = first.next;
      second = second.next;
  }
  second.next = second.next.next;   // skip the target node
  return dummy.next;
  ```
  `second` stops **just before** the node to remove. If the target is the head, `second` is still the dummy, so it works without a special case.

  ### Trick 4: tail pointer (merge two sorted lists)
  ```java
  Node dummy = new Node(0), tail = dummy;
  while (a != null && b != null) {
      if (a.val <= b.val) { tail.next = a; a = a.next; }
      else                { tail.next = b; b = b.next; }
      tail = tail.next;
  }
  tail.next = (a != null) ? a : b;   // attach the leftover part
  return dummy.next;
  ```
  We re-use the existing nodes, so the extra space is O(1). Time O(n + m).

  ### Complexity summary
  | Problem | Technique | Time | Extra space |
  |---|---|---|---|
  | Reverse | prev/cur/next | O(n) | O(1) |
  | Middle | slow/fast | O(n) | O(1) |
  | Detect cycle | Floyd (slow/fast) | O(n) | O(1) |
  | Remove nth from end | dummy + gap of n | O(n) | O(1) |
  | Merge two sorted | dummy + tail | O(n + m) | O(1) |

  ### Safety checklist before you run
  1. Does the loop condition stop before `null.next`? (`fast != null && fast.next != null`)
  2. Did you save `next` before changing an arrow?
  3. Does it work for an **empty** list and a **one-node** list?
  4. Are you returning the right head (`prev` after reverse, `dummy.next` after dummy tricks)?
tinyCode:
  code: |
    public class LinkedListBasics {
        static class Node {
            int val;
            Node next;
            Node(int val) { this.val = val; }
        }

        static Node build(int... values) {
            Node dummy = new Node(0), tail = dummy;
            for (int v : values) { tail.next = new Node(v); tail = tail.next; }
            return dummy.next;
        }

        static void print(Node head) {
            StringBuilder sb = new StringBuilder();
            for (Node cur = head; cur != null; cur = cur.next) sb.append(cur.val).append(" -> ");
            System.out.println(sb.append("null"));
        }

        static Node reverse(Node head) {
            Node prev = null, cur = head;
            while (cur != null) {
                Node next = cur.next;   // 1. save the rest
                cur.next = prev;        // 2. flip the arrow
                prev = cur;             // 3. move prev forward
                cur = next;             // 4. move cur forward
            }
            return prev;
        }

        static Node middle(Node head) {
            Node slow = head, fast = head;
            while (fast != null && fast.next != null) {
                slow = slow.next;
                fast = fast.next.next;
            }
            return slow;
        }

        static boolean hasCycle(Node head) {
            Node slow = head, fast = head;
            while (fast != null && fast.next != null) {
                slow = slow.next;
                fast = fast.next.next;
                if (slow == fast) return true;
            }
            return false;
        }

        public static void main(String[] args) {
            Node head = build(1, 2, 3, 4, 5);
            print(head);
            System.out.println("middle = " + middle(head).val);
            head = reverse(head);
            print(head);
            System.out.println("cycle? " + hasCycle(head));
            head.next.next.next.next.next = head.next;   // last node points back to 2nd
            System.out.println("cycle? " + hasCycle(head));
        }
    }
  walkthrough: |
    - **Node** is a tiny class: a value and a reference to the next node.
    - **build** uses a dummy node and a `tail` pointer: each new node is attached at `tail.next`, then `tail` moves forward. We return `dummy.next`, the real head.
    - **print** walks from head until `null`, adding `val -> ` each time.
    - **reverse** uses the four-step dance: save next, flip the arrow, move prev, move cur. When `cur` becomes `null`, `prev` is the old last node, the new head.
    - **middle**: fast jumps 2, slow jumps 1. For 5 nodes, fast stops on node 5 and slow is on node 3.
    - **hasCycle**: compares nodes with `==` (same object). On the normal list, fast reaches `null`, so `false`.
    - The last line makes the last node (value 1 after reversing) point back to the second node (value 4), creating a loop. Now fast and slow meet inside the loop: `true`.

    Output:
    ```
    1 -> 2 -> 3 -> 4 -> 5 -> null
    middle = 3
    5 -> 4 -> 3 -> 2 -> 1 -> null
    cycle? false
    cycle? true
    ```
tryIt:
  instructions: "Type this merge of two sorted lists using a dummy node and a tail pointer. Run it, then change list b to 0 -> 8 and predict the output before running again."
  code: |
    public class MergeSorted {
        static class Node {
            int val; Node next;
            Node(int val, Node next) { this.val = val; this.next = next; }
        }

        static Node merge(Node a, Node b) {
            Node dummy = new Node(0, null);
            Node tail = dummy;
            while (a != null && b != null) {
                if (a.val <= b.val) { tail.next = a; a = a.next; }
                else { tail.next = b; b = b.next; }
                tail = tail.next;
            }
            tail.next = (a != null) ? a : b;
            return dummy.next;
        }

        public static void main(String[] args) {
            Node a = new Node(1, new Node(4, new Node(7, null)));
            Node b = new Node(2, new Node(3, new Node(9, null)));
            for (Node cur = merge(a, b); cur != null; cur = cur.next) {
                System.out.print(cur.val + " ");
            }
            System.out.println();
        }
    }
