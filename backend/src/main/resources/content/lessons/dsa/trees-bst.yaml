  - id: q2
    type: SPOT_THE_BUG
    prompt: "This BST validator returns true for the tree 5 -> (left 3, right 8 -> (left 4)). Why is that wrong?"
    code: |
      boolean isBST(Node n) {
          if (n == null) return true;
          if (n.left != null && n.left.val >= n.val) return false;
          if (n.right != null && n.right.val <= n.val) return false;
          return isBST(n.left) && isBST(n.right);
      }
    options:
      - "It should use > instead of >="
      - "It only compares each node with its direct children; 4 is in the right subtree of 5 but smaller than 5, which it never checks"
      - "The base case should return false for null"
      - "It must use an inorder traversal; recursion can't validate a BST"
    answer: 1
    explanation: "Locally, 4 < 8 looks fine, so the code says true. But every node in 5's right subtree must be greater than 5. Fix: pass (min, max) bounds down the recursion. Recursion works fine; it just needs the bounds."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "The BST is built from 6, 2, 8, 0, 4, 7, 9, 3, 5. What does this print?"
    code: |
      static Node lca(Node root, int p, int q) {
          Node cur = root;
          while (cur != null) {
              if (p < cur.val && q < cur.val) cur = cur.left;
              else if (p > cur.val && q > cur.val) cur = cur.right;
              else return cur;
          }
          return null;
      }
      // in main:
      System.out.println(lca(root, 3, 5).val + " " + lca(root, 2, 8).val + " " + lca(root, 0, 5).val);
    options: ["4 6 2", "2 6 2", "4 6 0", "4 2 2"]
    answer: 0
    explanation: "3 and 5: both < 6, go to 2; both > 2, go to 4; 3 < 4 < 5 split, so 4. 2 and 8 split at the root: 6. 0 and 5: both < 6, go to 2; 0 < 2 < 5 split: 2. \"2 6 2\" stops one level too early for (3, 5)."
