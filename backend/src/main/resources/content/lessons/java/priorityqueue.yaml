    back: "Min-heap: poll() returns the smallest element."
  - front: "PriorityQueue costs"
    back: "offer/poll O(log n), peek O(1), contains/remove(Object) O(n)."
  - front: "How to make a max-heap"
    back: "new PriorityQueue<>(Collections.reverseOrder()) or a comparator like (a, b) -> Integer.compare(b, a)."
  - front: "K-th largest with a heap"
    back: "Min-heap of size k: offer each, poll when size > k; peek() is the k-th largest. O(n log k)."
  - front: "Why does println(pq) look unsorted?"
    back: "It prints the internal heap array, which only guarantees parent <= children."
keyTakeaways:
  - "PriorityQueue = binary heap in an array; default is a min-heap."
  - "offer/poll are O(log n), peek is O(1); contains is O(n)."
  - "Only the head is guaranteed; poll repeatedly for sorted output."
  - "Use Collections.reverseOrder() or a Comparator for max-heap or custom priority."
  - "Top-K pattern: keep a heap of size k for O(n log k)."
