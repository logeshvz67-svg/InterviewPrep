patternCode: null
companies: [ALL, INFOSYS_SP, INFOSYS_DSE]
infosysRelevance: "Joins are core for DSE and SP SQL questions: expect to write an INNER/LEFT join and explain the difference with a small example."
otherCompanies: "A very common technical-interview topic at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies (especially the self join 'employee and manager' question)."
why: |
  Real databases split data into many tables so nothing is stored twice. Employee rows store only `dept_id`, not the department name. To show "Asha works in Engineering", you must **join** the two tables.

  Interviewers love joins because one small question checks a lot:
  - Do you know which rows **disappear** in an INNER join?
  - Do you know where **NULLs appear** in a LEFT join?
  - Can you join a table **to itself** (employee and their manager)?

  If you can draw the result of a join on paper, you can answer almost any join question.
analogy: |
  Think of a **wedding guest list** and a **table seating chart**.

  - **INNER JOIN**: only guests who have a seat number *and* whose seat exists on the chart. Guests without a seat, and empty tables, are not listed.
  - **LEFT JOIN** (guests on the left): every guest is listed. If a guest has no seat, write "seat: NULL" next to their name.
  - **RIGHT JOIN** (tables on the right): every table is listed, even an empty table with "guest: NULL".
  - **FULL OUTER JOIN**: everyone and every table. Nobody is left out.
  - **SELF JOIN**: the guest list matched with *itself*, for example to write each guest next to the relative who invited them.
