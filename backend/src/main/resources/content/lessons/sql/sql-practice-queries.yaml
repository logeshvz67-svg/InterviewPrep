    Divya  80000  mgr Ravi (75000) *      2   <- 2nd highest
    Ravi   75000  mgr Asha                3
    Priya  60000  mgr Asha                4
    Kiran  60000  mgr Priya               4   <- tie
    Meena  50000  mgr Asha                5
    Arjun  45000  mgr Priya               6
    * Divya earns more than her manager

    Pattern finder
    "Nth highest / top N"            -> DENSE_RANK() or LIMIT/OFFSET
    "duplicates"                     -> GROUP BY ... HAVING COUNT(*) > 1
    "compare with manager / parent"  -> self join
    "max per group, with names"      -> window function or (col, MAX) IN
    "has no matching row"            -> LEFT JOIN ... IS NULL / NOT EXISTS
    "running / cumulative"           -> SUM() OVER (ORDER BY ...)
  caption: "Our 7 employees ranked by salary, with their managers. The right-hand question patterns map to the SQL tool that solves them."
