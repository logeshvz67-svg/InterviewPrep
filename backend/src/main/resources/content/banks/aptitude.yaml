  question: How many zeros are there at the end of 50! (50 factorial)?
  options: ['15', '12', '11', '10']
  answer: 1
  explanation: Each trailing zero needs a 10 = 2 x 5. There are more 2s than 5s, so count the 5s. 50 / 5 = 10, and 50 / 25
