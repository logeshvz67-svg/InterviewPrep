  - front: "Career-switch answer in 4 moves"
    back: "Respect current job -> Spark (why curious) -> Proof (what I did) -> Close (my goal now)."
  - front: "Good weakness answer shape"
    back: "A real, not job-killing weakness + what I am actively doing to improve it."
  - front: "Unsure about a bond or shift policy?"
