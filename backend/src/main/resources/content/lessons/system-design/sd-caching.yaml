  modelAnswer: |
    A cache is like the small tray on a chai stall counter, while the database is the godown across the road. If the item is on the tray, that's a hit and it's instant. If not, it's a miss: he walks to the godown, brings it, and keeps some on the tray for next time; that's cache-aside. Items have an expiry, called TTL, and when the real data changes we remove it from the tray so nobody gets old data. When the tray is full, he removes what nobody asked for in the longest time; that's LRU. One danger: if a very popular item expires, everyone runs to the godown at once.
flashcards:
  - front: "Cache-aside in 3 steps"
    back: "1) Read cache. 2) On miss, read DB. 3) Put the value in the cache (with TTL). On write: update DB, delete cache key."
  - front: "Write-through vs write-back"
    back: "Write-through: write cache and DB together (fresh, slower). Write-back: write cache now, DB later (fast, can lose data)."
  - front: "LRU with LinkedHashMap"
    back: "new LinkedHashMap<>(16, 0.75f, true) + override removeEldestEntry to return size() > capacity."
  - front: "LRU without library"
    back: "HashMap<key, node> + doubly linked list; move to head on access, remove tail when full. O(1) get/put."
  - front: "Cache stampede fixes"
    back: "Single rebuild with a lock, early refresh of hot keys, random jitter on TTLs."
keyTakeaways:
  - "Caches keep hot data in memory so most reads skip the database."
  - "Cache-aside is the default: read cache, on miss read DB and fill; on write update DB and invalidate."
  - "Write-through is fresh but slower; write-back is fast but can lose data."
  - "Use TTLs, and pick an eviction policy (usually LRU)."
  - "LRU in Java: LinkedHashMap with accessOrder true plus removeEldestEntry; O(1) operations."
  - "Protect hot keys from stampedes, and serve static files from a CDN."
