  code: |
    import java.util.*;

    public class Main {
        public static void main(String[] args) {
            List<String> src = new ArrayList<>(List.of("a"));

            List<String> view = Collections.unmodifiableList(src);
            List<String> copy = List.copyOf(src);

            src.add("b");
            System.out.println(view);
            System.out.println(copy);

            String s = "java";
            s.concat("21");
            System.out.println(s);
        }
    }
  expectedOutput: |
    [a, b]
    [a]
    java
  explanation: |
    An unmodifiable **view** is just a read-only window onto `src`, so it shows "b" after `src` changes. `List.copyOf` made a **separate** copy before "b" was added. And `concat` returns a new String that we ignored, so `s` is still "java".
commonMistakes:
  - "Thinking final fields alone make a class immutable. final stops re-pointing the reference, not changes inside a List or array."
  - "Storing the caller's List or array directly in the constructor instead of copying it."
  - "Returning the internal List or array from a getter, letting callers modify it."
  - "Forgetting to make the class final, so a subclass can add mutable state or override getters."
  - "Using Collections.unmodifiableList on the caller's list in the constructor. It's only a view: the caller can still change the original."
  - "Calling s.concat(...) or s.toUpperCase() and expecting s to change. Immutable methods return a new object."
interviewBox:
  why: "Why interviewers ask this: one question tests final, encapsulation, pass-by-value and shallow vs deep copy together, and immutability matters for thread safety and HashMap keys."
  questions:
    - q: "How do you create an immutable class in Java?"
      a: "I make the class final, make all fields private and final, provide no setters, and set everything in the constructor. For mutable fields like lists or arrays, I make a defensive copy in the constructor and return a copy or an unmodifiable view from the getter. If a change is needed, I return a new object, like a withMarks method."
    - q: "Why isn't making fields final enough?"
      a: "final only stops the field from pointing to another object. If the field is a List or an array, its contents can still be changed by the caller who passed it in or by anyone who gets it from a getter. That's why we need defensive copies."
    - q: "What are the benefits of immutable objects?"
      a: "They are automatically thread-safe, they are safe to use as HashMap keys because their hash code never changes, they can be cached and shared, and they are easier to reason about because nobody can change them unexpectedly."
    - q: "Why is String immutable in Java?"
      a: "For the String pool, so many references can safely share one object; for security, since strings are used for file paths, URLs and class names; for thread safety; and so its hash code can be cached, which makes it a fast HashMap key."
    - q: "Are records immutable?"
      a: "Records are shallowly immutable: the class is final, the fields are private final and there are no setters. But if a component is a mutable List, its contents can still change, so I copy it in a compact constructor using List.copyOf."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "Tags stores the list directly. What does this print?"
    code: |
      import java.util.*;
      public class Main {
          public static void main(String[] args) {
              List<String> list = new ArrayList<>();
              list.add("new");
              Tags t = new Tags(list);
              list.add("sale");
              System.out.println(t.getTags().size());
          }
      }
      final class Tags {
          private final List<String> tags;
          Tags(List<String> tags) { this.tags = tags; }
          List<String> getTags() { return tags; }
      }
    options: ["1", "2", "0", "Compile error: tags is final"]
    answer: 1
    explanation: "The constructor stored the caller's reference, so both point to the same list. Adding 'sale' to list also changes the Tags object: size 2. final only prevents this.tags = otherList; it doesn't stop list.add()."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "This class is meant to be immutable. Which line breaks immutability?"
    code: |
      import java.util.*;
      public final class Route {
          private final String from;
          private final List<String> stops;

          public Route(String from, List<String> stops) {
              this.from = from;
              this.stops = new ArrayList<>(stops);
          }
          public String getFrom() { return from; }
          public List<String> getStops() { return stops; }

          public static void main(String[] args) {
              Route r = new Route("Pune", List.of("Lonavala"));
              r.getStops().add("Hacked");
              System.out.println(r.getStops());
          }
      }
    options:
      - "this.from = from; because Strings must be copied"
      - "getStops() returns the internal list, so callers can modify it"
      - "The class should not be final"
      - "new ArrayList<>(stops) should be stops"
    answer: 1
    explanation: "The constructor copies correctly, but the getter hands out the internal list, and r.getStops().add(\"Hacked\") changes the object (it prints [Lonavala, Hacked]). Return Collections.unmodifiableList(stops) or a copy. Strings are already immutable, so from needs no copy."
  - id: q3
    type: MCQ
    prompt: "Which is NOT one of the rules for an immutable class?"
    options:
      - "Declare the class final"
      - "Make fields private and final"
      - "Provide setters that validate input"
      - "Make defensive copies of mutable fields"
    answer: 2
    explanation: "Immutable classes have no setters at all, validated or not. Validation belongs in the constructor. The other three are core rules."
  - id: q4
    type: TRUE_FALSE
    prompt: "A field declared private final List<String> items can never have its contents changed."
    options: ["True", "False"]
    answer: 1
    explanation: "False. final means the reference can't be re-pointed to another list, but items.add(...) still changes the list's contents. That's why defensive copies or unmodifiable lists are needed."
  - id: q5
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              Money m1 = new Money(100);
              Money m2 = m1.add(50);
              System.out.println(m1.amount() + " " + m2.amount());
          }
      }
      record Money(int amount) {
          Money add(int extra) { return new Money(amount + extra); }
      }
    options: ["150 150", "100 150", "100 100", "Compile error: records can't have methods"]
    answer: 1
    explanation: "Records are immutable, and add() returns a NEW Money instead of changing m1. So m1 stays 100 and m2 is 150. Records can have instance methods; they just can't have extra instance fields."
  - id: q6
    type: MATCH
    prompt: "Match each rule to the problem it prevents"
    pairs:
      - left: "final class"
        right: "A subclass adding mutable state or overriding getters"
      - left: "private final fields"
        right: "Outside access and reassignment after construction"
      - left: "Copy in the constructor"
        right: "The caller changing the list it passed in"
      - left: "Copy or read-only view in the getter"
        right: "Callers changing internal data they received"
    explanation: "Each rule closes one door. Together they make sure no one can change the object after it's built."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Fill in the Java 10+ method that stores an unmodifiable copy of the incoming list."
    code: |
      import java.util.*;
      public class Main {
          private final List<String> names;
          Main(List<String> input) { this.names = List.____(input); }
          public static void main(String[] args) {
              List<String> in = new ArrayList<>(List.of("A"));
              Main m = new Main(in);
              in.add("B");
              System.out.println(m.names);
          }
      }
    acceptedAnswers: ["copyOf"]
    explanation: "List.copyOf(input) makes a separate unmodifiable copy, so adding 'B' to the original doesn't affect names: it prints [A]. Collections.unmodifiableList(input) would only be a view and would show [A, B]."
explainBack:
  prompt: "Explain how to design an immutable class and why final fields are not enough, using the laminated-certificate analogy."
  rubric:
    - "I listed: final class, private final fields, no setters"
    - "I explained defensive copies in the constructor and in getters"
    - "I explained why final alone fails for Lists/arrays (the reference is final, not the contents)"
    - "I said changes return a new object (withX methods)"
    - "I gave at least two benefits (thread safety, HashMap keys, caching)"
  modelAnswer: |
    An immutable object is like a laminated certificate: once made, it never changes. To build one, I make the class final, make every field private and final, give no setters, and set everything in the constructor. But final only locks the reference, not what's inside a List or array. So in the constructor I copy any mutable input, otherwise the caller could still change it, and from getters I return a copy or an unmodifiable view, otherwise others could change my data. If someone needs different values, a method like withMarks returns a new object. Immutable objects are thread-safe, safe as HashMap keys and easy to share, just like String.
flashcards:
  - front: "5 rules for an immutable class"
    back: "final class; private final fields; no setters; defensive copy of mutable inputs in constructor; return copies/unmodifiable views from getters."
  - front: "Why isn't final enough for a List field?"
    back: "final stops re-pointing the reference, but list.add()/clear() still change the contents."
  - front: "unmodifiableList(x) vs List.copyOf(x)"
    back: "unmodifiableList = read-only view (shows later changes to x). copyOf = separate unmodifiable copy."
  - front: "Benefits of immutability"
    back: "Thread-safe, safe HashMap keys, cacheable/shareable, fewer bugs."
  - front: "How does an immutable class 'change' a value?"
    back: "It returns a new object (e.g. withMarks(90)), leaving the original untouched."
keyTakeaways:
  - "Immutable = state never changes after construction; changes create new objects."
  - "Rules: final class, private final fields, no setters, defensive copies in and out."
  - "final protects the reference, not the contents of a mutable object."
  - "An unmodifiable view is not a copy; copy first (new ArrayList<>, List.copyOf, clone)."
  - "Immutable objects are thread-safe and safe as HashMap keys; String and records are examples."
