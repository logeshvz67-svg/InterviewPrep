title: "Networks: OSI and TCP/IP models"
version: 1
estimatedMinutes: 30
rebuild: true
patternCode: null
companies: [ALL]
infosysRelevance: "The OSI layers with protocols and devices are a very common networking basics question to prepare for SP and DSE technical rounds."
otherCompanies: "OSI vs TCP/IP is a standard fresher question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies expect you to place HTTP, TCP, IP and Ethernet in the right layer."
why: |
  When you open a website, your message passes through many steps: an app, a transport protocol, IP routing, Wi-Fi or cable, and finally electrical signals. The **OSI model** gives a name and a number to each step.

  Why it matters:
  - **"Explain the OSI model"** is one of the most common networking questions for freshers.
  - Follow-ups like "which layer does a router work at?" or "is HTTP layer 7?" are quick marks if you know the table.
  - It gives you a vocabulary for debugging: "is this a DNS problem (layer 7) or a cable problem (layer 1)?"
analogy: |
  Think of **sending a gift by courier from Chennai to Delhi**.

  - **Application**: you write a letter (the actual message).
  - **Presentation**: you translate it to Hindi and seal it in a locked box (format and encryption).
  - **Session**: you and your friend agree "I'll send 3 parcels this week" (manage the conversation).
  - **Transport**: the courier numbers the parcels 1/3, 2/3, 3/3 and promises delivery, resending lost ones (TCP).
  - **Network**: the courier decides the route Chennai -> Hyderabad -> Delhi using the address (IP routing).
  - **Data link**: each local van delivers from one hub to the next hub (frames between neighbours, MAC addresses).
  - **Physical**: the actual road and truck (cables, radio waves, bits).

  At each step, a new **label is stuck on top**. The receiver peels them off in reverse order.
