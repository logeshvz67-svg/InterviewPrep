infosysRelevance: "A top-asked topic for SP and DSE: choosing the right collection is the first step of almost every coding-round solution, and the hierarchy is classic theory."
otherCompanies: "One of the most common Java questions at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies ('List vs Set vs Map', 'Collection vs Collections')."
why: |
  In coding rounds you constantly need to store groups of things: a list of marks, unique visitors, a word-count map, a queue for BFS. Java gives you a ready-made toolbox for this: the **Collections Framework**.

  The toolbox is big, so it's organised as a **family tree of interfaces** (rules) and **classes** (real implementations). If you know the tree, you can:
  - pick the right structure in seconds ("I need uniqueness → Set"),
  - answer "**List vs Set vs Map**" and "**Collection vs Collections**" confidently,
  - write flexible code like `List<String> names = new ArrayList<>();`.

  This lesson is the map; the following lessons zoom into each part.
analogy: |
  Think of the **Indian Railways system**.

  - **Collection** is the general idea of "a group of passengers".
  - **List** is a **reserved train coach**: every seat has a **number** (index), order matters, and two people named "Ravi" can both travel (duplicates allowed).
  - **Set** is the **list of registered Aadhaar numbers**: **no duplicates** allowed.
  - **Queue** is the **ticket counter line**: first come, first served.
  - **Map** is the **PNR system**: each **PNR number (key)** gives you exactly one booking (value). It's so different that it isn't a "group of passengers" at all; it's a lookup table. That's why **Map does not extend Collection**.
