infosysRelevance: "Needed for the 'can you optimise this?' discussion in SP and DSE rounds: you must state the time complexity of the structure you chose."
otherCompanies: "Collections methods save time in every coding test (TCS, Wipro, Cognizant, Accenture, Capgemini); product companies always ask for the Big-O of your solution."
why: |
  After writing a solution, interviewers almost always ask: **"What is the time complexity? Can you do better?"** To answer, you must know the cost of each operation of the structure you used. A `list.contains()` inside a loop quietly turns O(n) into O(n²).

  Second, the `java.util.Collections` class (with an **s**) has ready-made helpers: `sort`, `reverse`, `max`, `frequency`, `unmodifiableList` and more. Using them saves time in coding rounds and shows you know the library.

  This lesson finishes Section E with one big **cheat sheet** you can revise the night before an interview.
analogy: |
  Think of `Collections` as a **Swiss army knife** for your lists: one tool to sort, one to reverse, one to shuffle, one to count. You don't build a knife every time you want to cut something.

  And Big-O is like knowing **travel time** before choosing transport. Going 2 km? Walk. Going Chennai to Delhi? Take a flight. A HashMap lookup is a flight (O(1)), scanning an ArrayList is walking past every house (O(n)). Good engineers check the travel time before they leave.
