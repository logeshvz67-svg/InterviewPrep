infosysRelevance: "Common OOP question in SP and DSE technical rounds; constructor chaining with this() and super() is a frequent output and compile-error question."
otherCompanies: "A common OOP basics question at TCS, Wipro, Cognizant, Accenture, Capgemini; product companies ask the chaining and default-constructor traps."
why: |
  In the last lesson we created a `Student` and then set every field by hand, line by line. That's boring and risky: forget one line and the object is half-ready. **Constructors** fix this: they set up an object correctly at the moment it is born.

  Interviewers ask:
  - "What is a default constructor? When does Java give you one?"
  - "What's the difference between a constructor and a method?"
  - "What is constructor chaining? What do `this()` and `super()` do?"

  And output questions love to test **which constructor runs first** in a parent/child class.
analogy: |
  Think of **getting a new SIM card** at a mobile shop.

  - You can't walk out with an "empty" SIM. The shop **sets it up when it's issued**: number, plan, activation. That set-up step is the **constructor**.
  - **Default constructor**: "just give me a standard prepaid SIM" (no choices, default plan).
  - **Parameterized constructor**: "I want this number and this plan" (you pass values).
  - **Chaining with `this()`**: the "quick SIM" counter doesn't repeat all the steps; it just says "do the full setup with the default plan", reusing the main counter's process.
  - **`super()`**: before your SIM is activated, the network company's own base set-up must run first. The parent is always built before the child.
