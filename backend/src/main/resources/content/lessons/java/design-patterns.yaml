    - "I explained Builder for many optional fields with chained calls"
    - "I explained Observer as one subject notifying many listeners"
  modelAnswer: |
    A Singleton makes sure only one object of a class exists, like one college principal. I make the constructor private and give a static getInstance method. To be thread-safe I can create it eagerly, use an enum, or use double-checked locking with a volatile field. A Factory hides creation: like a dosa counter, I ask for "masala" and get the right object without knowing the class. A Builder helps when an object has many optional parts, like a custom pizza: I chain size, topping and then build. An Observer lets one object notify many others, like YouTube telling all subscribers about a new video. Spring uses all of these internally.
