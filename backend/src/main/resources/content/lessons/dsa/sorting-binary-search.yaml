commonMistakes:
  - "Using binary search on an unsorted array; it silently gives wrong answers."
  - "Writing mid = (lo + hi) / 2, which can overflow for large indexes; use lo + (hi - lo) / 2."
  - "Mixing templates: while (lo < hi) with hi = mid - 1 skips the last candidate; while (lo <= hi) with hi = mid can loop forever."
  - "Saying quick sort is always O(n log n); its worst case is O(n^2)."
  - "Forgetting that Arrays.sort on objects is stable (TimSort) but on primitives uses Dual-Pivot Quicksort."
  - "In binary search on the answer, computing mid * mid in int and overflowing; cast to long."
interviewBox:
  why: "Why interviewers ask this: sorting tests your understanding of complexity and trade-offs; binary search tests precise boundary handling, where small off-by-one errors break the code."
  questions:
    - q: "What is the difference between merge sort and quick sort?"
      a: "Both are divide and conquer and O(n log n) on average. Merge sort splits in the middle and does the work while merging; it is always O(n log n) and stable, but needs O(n) extra space. Quick sort does the work while partitioning around a pivot; it is in-place and usually faster in practice, but its worst case is O(n squared) with bad pivots, and it is not stable."
    - q: "What is a stable sort and why does it matter?"
      a: "A stable sort keeps equal elements in their original order. It matters when you sort by one key after another, for example sort employees by name and then by department; with a stable sort, people inside each department stay in name order. Merge sort, insertion sort and Java's TimSort are stable."
    - q: "How do you find the first occurrence of a number in a sorted array with duplicates?"
      a: "I use lower bound binary search. lo is zero and hi is n. If a[mid] is less than the target, I move lo to mid plus one; otherwise I set hi to mid, because mid could be the answer. When lo equals hi, that's the first index with value at least the target. Then I check that the value there really equals the target. It's O(log n)."
    - q: "What is binary search on the answer?"
      a: "When the answers have a yes/no pattern, like 'if capacity 10 works then 11 also works', I binary search over the range of possible answers instead of over an array. For each mid I run a check function. If it works I record it and try a smaller value, otherwise I try bigger. The time is log of the range times the cost of the check."
