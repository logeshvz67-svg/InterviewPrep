    back: "(n & (1<<i)) != 0 ; n | (1<<i) ; n & ~(1<<i) ; n ^ (1<<i)"
  - front: "n & (n - 1)"
    back: "Removes the lowest set bit. Power of two: n > 0 && (n & (n-1)) == 0."
  - front: "XOR rules"
    back: "a ^ a = 0, a ^ 0 = a, order doesn't matter. Single number = XOR of all."
  - front: ">> vs >>>"
    back: ">> copies the sign bit (-8 >> 1 = -4); >>> fills with 0 (-8 >>> 28 = 15)."
  - front: "~x equals"
    back: "-x - 1 (so ~12 = -13)."
  - front: "Precedence trap"
    back: "== binds tighter than &: write (n & 1) == 0."
keyTakeaways:
  - "An int is 32 bits in two's complement; bit i is worth 2^i and bit 31 is the sign."
  - "&, |, ^, ~, <<, >>, >>>: know each rule and the >> vs >>> difference for negatives."
  - "Masks with 1 << i check, set, clear and toggle individual bits."
  - "n & (n - 1) removes the lowest set bit: power-of-two check and Kernighan's bit count."
  - "XOR cancels pairs: single number in O(n) time and O(1) space."
  - "Always bracket bit expressions in comparisons: (n & 1) == 0."
