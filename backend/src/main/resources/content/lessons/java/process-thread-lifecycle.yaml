infosysRelevance: "Common theory question for SP and DSE technical rounds; the starting point for every multithreading discussion."
otherCompanies: "A standard basic question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies: 'process vs thread' and 'thread states' come up often."
why: |
  Your laptop plays music, downloads a file and runs your IDE **at the same time**. Inside one Java program, a server answers many users **at the same time**. This is possible because of **processes** and **threads**.

  Interviewers love two warm-up questions here:
  - **"What is the difference between a process and a thread?"**
  - **"Explain the life cycle of a thread."**

  Everything else in this section (synchronization, deadlock, thread pools) builds on this lesson. If you know *what a thread is* and *which states it moves through*, the harder topics become easy to picture.
analogy: |
  Think of a **restaurant**.

  - The **restaurant** is a **process**: it has its own building, kitchen, money and stock. Another restaurant next door cannot use its kitchen.
  - The **cooks** inside are **threads**: they all share the same kitchen (shared memory), but each cook has their *own* order slip in hand (their own stack).
  - Hiring a new cook is cheap and fast. Opening a new restaurant is expensive and slow. That's why threads are called **lightweight**.

  And a cook's day has states: **hired but not started** (NEW), **ready or cooking** (RUNNABLE), **waiting for the only big pan** (BLOCKED), **waiting for the waiter to call** (WAITING), **taking a 5-minute break** (TIMED_WAITING), and **gone home** (TERMINATED).
