infosysRelevance: "Core theory for SP and DSE technical rounds; the family tree of Throwable is the base for every later exception question."
otherCompanies: "A common basic Java question at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies, often as 'Error vs Exception'."
why: |
  Programs go wrong: a file is missing, a user types "abc" where a number was expected, an array index is too big. Java reports these problems as **exceptions**.

  Interviewers love asking **"What is the difference between Error and Exception?"** and **"Draw the exception hierarchy."** They want to see that you know:
  - which problems your code *should* handle,
  - which problems you *cannot* fix (like the JVM running out of memory),
  - which exceptions the compiler forces you to handle (next lesson: checked vs unchecked).

  Every other exception topic (try/catch order, throws, custom exceptions) depends on this one family tree. Learn the tree once and the rest becomes logic, not memory.
analogy: |
  Think of problems in a **railway journey**.

  - **Throwable** is the word "trouble". Every kind of trouble is under it.
  - **Error** is like an **earthquake that breaks the track**. The passenger (your program) cannot fix it. Example: `OutOfMemoryError`. You don't plan for it in normal code.
  - **Exception** is like **a delayed train or a lost ticket**. Annoying, but you *can* plan for it: book another train, show your ID.
    - **Checked exceptions** are like problems the railway *makes* you plan for: "Carry a valid ID or you can't board." The compiler is the ticket checker.
    - **RuntimeException** (unchecked) is like **your own mistake**: you boarded the wrong coach. Nobody forced you to plan for it; you should simply be more careful (fix the bug).
