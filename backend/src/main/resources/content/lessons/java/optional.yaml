infosysRelevance: "Modern Java knowledge for SP and DSE rounds; the orElse vs orElseGet difference is a favourite tricky follow-up."
otherCompanies: "Part of the 'Java 8 features' discussion at TCS, Wipro, Cognizant, Accenture, Capgemini; product companies and Spring Boot code (findById returns Optional) use it daily."
why: |
  The most common exception in Java is the **`NullPointerException`** (NPE): calling a method on something that is `null`. The inventor of null references, Tony Hoare, even called it his "billion-dollar mistake".

  Java 8 added **`Optional<T>`**: a small box that **may or may not contain a value**. When a method returns `Optional`, it is telling you clearly: "the answer might be missing, please handle that".

  You'll meet it everywhere:
  - stream methods like `findFirst()`, `max()`, `reduce()` return `Optional`,
  - Spring Data's `repository.findById(id)` returns `Optional`.

  Interviewers ask what it is, how to use it **properly**, and the classic trap: **`orElse` vs `orElseGet`**.
analogy: |
  Think of ordering food online and getting a **delivery box**.

  - Usually the box has your biryani inside (`Optional.of(biryani)`).
  - Sometimes the restaurant is out of stock, and you get an **empty box** with a note (`Optional.empty()`), instead of the delivery person showing up with **nothing at all** (`null`) and you biting the air.

  With a box, you can say: "If there's food, eat it (`ifPresent`); if the box is empty, make Maggi instead (`orElse`)". You never have to guess whether the delivery person even came.
