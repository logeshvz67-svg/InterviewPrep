    import java.util.Scanner;

    public class Trap {
        public static void main(String[] args) {
            // Input:
            // 21
            // Ravi Kumar
            Scanner sc = new Scanner(System.in);
            int age = sc.nextInt();
            String name = sc.nextLine();
            System.out.println("Age=" + age);
            System.out.println("Name=[" + name + "]");
        }
    }
  expectedOutput: |
    Age=21
    Name=[]
  explanation: |
    `nextInt()` reads `21` but leaves the newline character after it. `nextLine()` then reads from the cursor to the end of that same line, which is nothing, so `name` is an empty string. The brackets make the empty value visible. "Ravi Kumar" is never read. Fix: call `sc.nextLine();` once after `nextInt()`.
commonMistakes:
  - "Calling nextLine() right after nextInt() and getting an empty string. Add an extra sc.nextLine() to consume the leftover newline."
  - "Forgetting throws IOException with BufferedReader, which gives a compile error 'unreported exception IOException'."
  - "Splitting with split(\" \") without trim(), which creates empty strings when there are extra spaces. Use trim().split(\"\\\\s+\")."
  - "Using Scanner for 10^5+ numbers in a timed test and getting Time Limit Exceeded."
  - "Using PrintWriter and forgetting out.flush(), so no output appears."
  - "Adding a package line or prompts like \"Enter n:\" in an online judge; extra printed text makes the output wrong."
interviewBox:
  why: "Why interviewers ask this: it shows practical coding-test experience. Knowing why Scanner is slow and how to avoid the nextLine trap signals that you have actually solved problems under time limits."
  questions:
    - q: "What is the difference between Scanner and BufferedReader?"
      a: "Scanner is easy: it reads tokens and converts them to int, double and so on, but it is slow because it uses regular expressions. BufferedReader reads whole lines from a large buffer, so it is much faster, but it only gives Strings, and we convert them with Integer.parseInt. BufferedReader also needs us to handle IOException."
    - q: "Why does nextLine() return an empty string after nextInt()?"
      a: "nextInt reads only the number and leaves the newline character in the input. nextLine reads until the end of the current line, which is just that newline, so it returns an empty string. The fix is to call nextLine once more to consume the leftover newline."
    - q: "How do you read input quickly in Java for large test cases?"
      a: "I use BufferedReader with InputStreamReader on System.in, read lines with readLine, split them using StringTokenizer, and convert with Integer.parseInt. For output, I build everything in a StringBuilder and print once."
    - q: "How do you read input until the end when the number of lines is not given?"
      a: "With BufferedReader I loop while readLine() is not null, because readLine returns null at the end of input. With Scanner I loop while hasNext() or hasNextInt() is true."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "The input is: 5 (Enter) hello world (Enter). What is printed?"
    code: |
      Scanner sc = new Scanner(System.in);
      int n = sc.nextInt();
      String s = sc.nextLine();
      System.out.println(n + "|" + s + "|");
    options: ["5|hello world|", "5||", "5|hello|", "InputMismatchException"]
    answer: 1
    explanation: "nextInt reads 5 and leaves the newline. nextLine returns the rest of that line, which is empty, so the output is 5||. 5|hello world| is what beginners expect, but it needs an extra nextLine() first."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "Why does this not compile?"
    code: |
      import java.io.*;

      public class Main {
          public static void main(String[] args) {
              BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
              String line = br.readLine();
              System.out.println(line);
          }
      }
    options:
      - "BufferedReader needs a size argument"
      - "readLine() throws IOException, a checked exception that is not handled or declared"
      - "System.in cannot be used with BufferedReader"
      - "line must be declared as char[]"
    answer: 1
    explanation: "IOException is checked, so the compiler forces you to catch it or declare it. Adding throws IOException to main fixes it. The constructor and System.in usage are correct as written."
  - id: q3
    type: MCQ
    prompt: "A problem gives 10^6 integers on one line with a 1-second limit. What is the safest way to read them?"
    code: null
