  question: A boat goes 15 km/h downstream and 9 km/h upstream. What is the speed of the stream?
  options: [4 km/h, 2 km/h, 3 km/h, 6 km/h]
  answer: 2
  explanation: Downstream = boat + stream, upstream = boat - stream. Speed of stream = (downstream - upstream) / 2 = (15 -
    9) / 2 = 3 km/h. (Boat speed = (15 + 9) / 2 = 12 km/h.)
