explainBack:
  prompt: "Explain try-with-resources to a friend: why it exists, the closing order, and what a suppressed exception is."
  rubric:
    - "I said it auto-closes AutoCloseable resources to prevent leaks"
    - "I said resources close in reverse order of opening"
    - "I said they close before catch and finally"
    - "I explained suppressed exceptions and getSuppressed()"
    - "I used an analogy like the library bag"
  modelAnswer: |
    Files, database connections and sockets must be closed, or the app leaks resources. try-with-resources lets me declare them in brackets after try, and Java closes them automatically when the block ends, even if there's an exception. The class just has to implement AutoCloseable. If I open several, they're closed in reverse order, last opened first closed, and that happens before catch and finally run. If my code throws an exception and then close also throws, Java keeps my original exception as the main one and attaches the close problem as a suppressed exception, which I can read with getSuppressed. So the real error is never hidden.
