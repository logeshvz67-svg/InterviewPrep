infosysRelevance: "Very relevant for SP: 'implement an LRU cache' is a classic coding-plus-design practice problem, and cache strategies are standard design-round talk."
otherCompanies: "LRU cache is one of the most common product-company coding questions; caching strategies and CDNs come up in nearly every HLD round."
why: |
  In Lesson 1, our food delivery app had about **500 reads for every write**. Hitting the database for every single read is slow and expensive. A **cache** keeps hot data in fast memory so most reads never reach the database.

  Caching is the **number one tool** for making read-heavy systems fast. But it brings its own hard questions, and interviewers love them:
  - Where do you put the cache?
  - What happens when the data changes (stale data)?
  - What do you throw away when the cache is full (eviction)?
  - What happens when a hot key expires and 10,000 requests hit the database at once (stampede)?

  And as a coding bonus: **"Implement an LRU cache"** is one of the most popular interview programs. You'll write it in about 10 lines using `LinkedHashMap`.
analogy: |
  Think of a **chai stall owner** near a railway station.

  - The big **godown** (warehouse) across the road has all the milk, sugar and tea. That is the **database**: complete but far away.
  - On his counter he keeps a small tray with the **most used items**. That tray is the **cache**: tiny but instant.
  - When a customer asks for something on the tray: **cache hit**, served in seconds. If not: **cache miss**, he walks to the godown, brings it, and also puts some on the tray for next time (**cache-aside**).
  - The tray is small, so when it's full he removes the item **nobody has asked for in the longest time** (**LRU eviction**).
  - Milk on the tray goes bad after a few hours, so he throws it out on schedule (**TTL, time to live**).
