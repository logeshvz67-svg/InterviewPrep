companies: [INFOSYS_SP, PRODUCT]
infosysRelevance: "Depth topic for SP: a natural follow-up after 'how do you fix count++?' Knowing AtomicInteger and ReentrantLock shows you go beyond synchronized."
otherCompanies: "Common in product-company concurrency discussions and senior backend interviews; occasionally a bonus question in service-company rounds."
why: |
  `synchronized` works, but it's a blunt tool. The `java.util.concurrent` package gives you sharper ones:
  - **Atomic classes** (`AtomicInteger`, `AtomicLong`, `AtomicBoolean`, `AtomicReference`): fix `count++` **without any lock**.
  - **`ReentrantLock`**: a lock with extra powers: try for a lock and give up, wait with a timeout, be interrupted, be fair.
  - **`ReadWriteLock`**: many readers at once, but only one writer.

  The classic interview chain goes: *"count++ isn't thread-safe. How do you fix it?"* → *"synchronized."* → *"Any other way?"* → **"AtomicInteger, using CAS."** → *"What is CAS?"* This lesson prepares you for every step.
analogy: |
  **AtomicInteger and CAS** are like **updating a shared Google Sheet cell** carefully: "I saw the value was **5**. Set it to **6**, but *only if it's still 5*." If someone changed it in the meantime, your update is rejected, so you read the new value and try again. No one had to lock the sheet.

  **ReentrantLock** is like the **bank locker room key** with a register: you can wait in line, or **wait only 2 minutes and leave** (`tryLock` with timeout), and the guard can serve people **in arrival order** (fair lock). And you **must return the key** yourself (`unlock()`), even if something goes wrong.

  **ReadWriteLock** is like a **library notice board**: any number of students can **read** it at the same time, but when the librarian is **writing** a new notice, everybody waits.
visual:
  diagram: |
    CAS (Compare-And-Swap) inside incrementAndGet()

      loop:
        current = read value          (say 5)
        next    = current + 1         (6)
        if value is STILL current -> set to next, done!
        else (someone changed it) -> try the loop again

    Thread A: read 5 ---- CAS(5 -> 6) OK      value = 6
    Thread B: read 5 ------------ CAS(5 -> 6) FAILS (now 6)
              read 6 ---- CAS(6 -> 7) OK      value = 7

    READWRITE LOCK
      readers:  R R R R  (together)   |  writer: W (alone)
      read + read = OK   read + write = wait   write + write = wait
  caption: "CAS never blocks: it updates only if the value hasn't changed, otherwise it retries. A ReadWriteLock lets many readers in together but a writer goes alone."
