infosysRelevance: "Core for SP and DSE preparation: balanced brackets, next greater element (monotonic stack) and queue-based BFS are building blocks of many medium-level coding problems."
otherCompanies: "Valid parentheses and stack/queue basics are common basic questions in TCS-style rounds; product companies extend them to monotonic stack problems (stock span, daily temperatures, largest rectangle)."
why: |
  A **stack** and a **queue** are the two simplest "waiting line" data structures, and they hide inside a huge number of problems:
  - Matching brackets in code or expressions: **stack**.
  - Undo / back button / recursion itself: **stack**.
  - "Next greater element", "stock span", "daily temperatures": **monotonic stack**.
  - Processing things in arrival order, printers, BFS on graphs and trees: **queue**.

  The trick is not the data structure itself (you know push and pop). The trick is **recognising** when a problem secretly asks "what is the most recent unmatched thing?" (stack) or "what came first?" (queue). Many O(n^2) brute-force solutions become **O(n)** once you see that.
analogy: |
  - A **stack** is the **pile of plates** at a wedding buffet. The caterer puts clean plates on **top**, and guests take from the **top**. The last plate placed is the first one taken: **LIFO** (Last In, First Out).
  - A **queue** is the **line at a railway ticket counter**. The person who came first is served first, new people join at the back: **FIFO** (First In, First Out).

  A **monotonic stack** is like a line of people waiting to see over a wall: when a taller person arrives, everyone shorter in front of them gets their answer ("the next taller person is this one") and leaves the line.
