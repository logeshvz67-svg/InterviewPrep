infosysRelevance: "Output-prediction questions on try/catch/finally flow are common practice material for SP and DSE; core for writing safe code in coding rounds."
otherCompanies: "Common output and theory questions at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  Knowing the exception family tree is theory. **try, catch and finally** are how you actually *use* it.

  Interviewers love **"What is the output?"** questions here, because the flow jumps around: some lines are skipped, some always run. If you can trace the jumps step by step, these questions become free marks.

  You will learn:
  - exactly which lines run when an exception happens (and when it doesn't),
  - how Java picks **which catch** block runs,
  - **multi-catch** (`catch (A | B e)`),
  - why **catch order** can cause a compile error,
  - what `finally` is for.
analogy: |
  Think of **cooking at home with a gas stove**.

  - **try** = "Try to cook the recipe step by step."
  - **catch** = "If the milk boils over, do *this*. If the gas runs out, do *that*." Each catch is a plan for one kind of trouble. Only the first matching plan is used.
  - **finally** = "**Whatever happens, turn off the gas.**" Whether the dish was perfect, burnt, or you stopped halfway, this step always happens.

  And order of plans matters: if your first plan is "for ANY problem, call Mummy", the specific plan "if milk boils over, lower the flame" can never be reached. Java calls that a compile error.
