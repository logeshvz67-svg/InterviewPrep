    public class PipesBoats {
        public static void main(String[] args) {
            int total = 60;
            int fill = total / 20, empty = total / 30;
            System.out.println("Tank full in " + total / (fill - empty) + " hours");

            int men1 = 12, days1 = 18, men2 = 8;
            System.out.println("8 men need " + men1 * days1 / men2 + " days");

            int down = 14, up = 8;
            System.out.println("Boat: " + (down + up) / 2 + " km/h");
            System.out.println("Stream: " + (down - up) / 2 + " km/h");
        }
    }
predict:
  code: |
    public class Predict {
        public static void main(String[] args) {
            int relKmph = 72 + 36;
            int relMps = relKmph * 5 / 18;
            int lengths = 120 + 180;
            System.out.println(relMps);
            System.out.println(lengths / relMps);
            System.out.println(lengths / ((72 - 36) * 5 / 18));
        }
    }
  expectedOutput: |
    30
    10
    30
  explanation: |
    - Opposite directions: relative speed 108 km/h = 108 x 5/18 = **30** m/s.
    - Distance to cross each other = 120 + 180 = 300 m, so 300 / 30 = **10** seconds.
    - Same direction: (72 - 36) = 36 km/h = 10 m/s, so 300 / 10 = **30** seconds.
commonMistakes:
  - "Adding days instead of rates. A 12 days + B 18 days is not 30 days together; add 1/12 + 1/18."
  - "Forgetting to convert km/h to m/s when lengths are in metres."
  - "Averaging speeds directly (40 and 60 -> 50). For equal distances use 2xy/(x+y)."
  - "Using only the train length when it crosses a platform. Add the platform length."
  - "Adding speeds for trains moving in the same direction. Same direction: subtract."
  - "In Java, writing total / 5 with ints (gives 7) instead of (double) total / 5 (gives 7.2)."
interviewBox:
  why: "Why this is practised: these questions test turning words into equations. Explaining a 'rate' idea clearly is also a good sign in technical discussions (throughput, requests per second)."
  questions:
    - q: "If one person finishes a task in 12 days and another in 18 days, how long together? Explain. (practice question)"
      a: "I think in rates. I take the total work as 36 units, the LCM of 12 and 18. The first person does 3 units a day, the second 2 units a day, so together 5 units a day. 36 divided by 5 is 7.2 days."
    - q: "Why is the average speed of a round trip not the simple average of the two speeds? (practice question)"
      a: "Because you spend more time at the slower speed. Average speed is total distance divided by total time. For 40 and 60 km/h over the same distance, it is 2 times 40 times 60 over 100, which is 48, not 50."
quiz:
  - id: q1
    type: MCQ
    prompt: "A can do a job in 10 days and B in 15 days. Working together, how many days do they take?"
    code: null
    options: ["12.5 days", "6 days", "25 days", "5 days"]
    answer: 1
    explanation: "LCM = 30 units. A 3/day, B 2/day, together 5/day -> 30/5 = 6 days. 12.5 is the average of 10 and 15, and 25 adds the days, both wrong ideas."
  - id: q2
    type: MCQ
    prompt: "A 200 m train running at 72 km/h crosses a 300 m platform. How long does it take?"
    code: null
    options: ["10 s", "15 s", "25 s", "20 s"]
    answer: 2
    explanation: "72 km/h = 20 m/s. Distance = 200 + 300 = 500 m. 500/20 = 25 s. 10 s uses only the train length; 15 s uses only the platform."
  - id: q3
    type: MCQ
    prompt: "A car goes to a town at 30 km/h and returns on the same road at 20 km/h. What is its average speed for the whole trip?"
    code: null
    options: ["25 km/h", "24 km/h", "26 km/h", "22 km/h"]
    answer: 1
    explanation: "2xy/(x + y) = 2 x 30 x 20 / 50 = 24 km/h. 25 is the simple average, which ignores that more time is spent at 20 km/h."
  - id: q4
    type: TRUE_FALSE
    prompt: "Two trains moving in the same direction pass each other using the sum of their speeds."
    options: ["True", "False"]
    answer: 1
    explanation: "False. In the same direction the gap closes at the difference of their speeds. The sum is used when they move towards each other."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Convert 54 km/h to metres per second."
    code: |
      54 x 5 / 18 = ____ m/s
    acceptedAnswers: ["15"]
    explanation: "1 km/h = 1000 m / 3600 s = 5/18 m/s, so 54 x 5/18 = 15 m/s."
  - id: q6
    type: MCQ
    prompt: "15 men can finish a job in 20 days. How many days will 25 men take, working at the same rate?"
    code: null
    options: ["33 days", "12 days", "10 days", "15 days"]
    answer: 1
    explanation: "Total = 15 x 20 = 300 man-days. 300 / 25 = 12 days. 33 days comes from wrongly assuming more men need more days."
  - id: q7
    type: MCQ
    prompt: "A boat goes 18 km/h downstream and 10 km/h upstream. What is the speed of the stream?"
    code: null
    options: ["14 km/h", "8 km/h", "4 km/h", "2 km/h"]
    answer: 2
    explanation: "Stream = (down - up)/2 = (18 - 10)/2 = 4 km/h. 14 km/h is the boat's speed in still water; 8 forgets to halve the difference."
  - id: q8
    type: MATCH
    prompt: "Match each situation to the right distance or speed"
    pairs:
      - left: "Train crossing a pole"
        right: "distance = train length"
      - left: "Train crossing a platform"
        right: "distance = train length + platform length"
      - left: "Two trains, opposite directions"
        right: "relative speed = sum of speeds"
      - left: "Boat going upstream"
        right: "speed = boat speed - stream speed"
    explanation: "A pole has no length, a platform adds its length, opposite motion closes the gap faster (sum), and the current slows a boat going upstream."
explainBack:
  prompt: "Explain to a friend how to solve 'A takes 12 days, B takes 18 days, how long together?' and why trains moving the same way use the difference of speeds."
  rubric:
    - "I explained thinking in rates (work per day)"
    - "I used the LCM method to avoid fractions"
    - "I explained relative speed with the gap idea"
    - "I warned about unit conversion (x 5/18)"
  modelAnswer: |
    I don't add the days; I add the speeds of work. I take the total work as the LCM of 12 and 18, which is 36 units. A does 3 units a day and B does 2, so together they do 5 a day, and 36 divided by 5 is 7.2 days. For trains, what matters is how fast the gap between them changes. If they move the same way, one is only gaining by the difference of their speeds. If they come towards each other, the gap closes by both speeds, so we add. And I convert kilometres per hour to metres per second by multiplying by 5 by 18.
flashcards:
  - front: "LCM method for work"
    back: "Total work = LCM of days; each rate = total / days; time = total / sum of rates."
  - front: "km/h to m/s"
    back: "Multiply by 5/18 (m/s to km/h: x 18/5)."
  - front: "Average speed, equal distances at x and y"
    back: "2xy/(x + y). Not (x + y)/2."
  - front: "Boat and stream speeds"
    back: "boat = (down + up)/2, stream = (down - up)/2."
  - front: "Man-days rule"
    back: "M1 D1 H1 / W1 = M2 D2 H2 / W2."
keyTakeaways:
  - "Think in rates: work per day, distance per hour."
  - "LCM method: total work in units, whole-number rates, no fractions."
  - "Emptying pipes and opposing currents subtract from the rate."
  - "Relative speed: add for opposite directions, subtract for the same direction."
  - "Average speed for equal distances is 2xy/(x+y)."
  - "Always convert units: km/h x 5/18 = m/s."
