why: |
  "What is the difference between **overloading** and **overriding**?" is one of the most common Java interview questions of all time.

  The simple answer is easy. The follow-up questions are where people lose marks:
  - Can I change the **return type**?
  - Can the child make the method **less public**?
  - Can the child throw **more exceptions**?
  - Can you override a **static** method? A **private** one? `main`?

  This lesson gives you one clear table of rules so you can answer every follow-up calmly.
analogy: |
  **Overloading** is like a tea stall owner named Raju who answers three different orders:
  - "One tea" -> makes tea.
  - "One tea, less sugar" -> makes tea a different way.
  - "Two teas and one biscuit" -> yet another way.
  Same name (Raju), but he decides *what to do by looking at what you gave him* (the parameters). All of this is one person, one shop.

  **Overriding** is when Raju's son takes over the stall and says "When someone orders tea, I'll make it **my** way (masala chai)." Same order, same words, but the **child replaces the parent's recipe**. Customers still say "tea", but who serves it decides the taste.
