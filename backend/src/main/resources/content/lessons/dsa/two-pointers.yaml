    answer: 0
    explanation: "Unique values 2, 5, 7, 9 are copied to the front, so the count is 4. The array is not shortened: positions 4 to 6 keep their old values 7, 7, 9. That's why the method returns k and you only read the first k elements. \"4 [2, 5, 7, 9]\" forgets that Java arrays can't shrink."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "This should reverse the array, but it prints [1, 2, 3, 4, 5]. What is wrong?"
    code: |
      int[] arr = {1, 2, 3, 4, 5};
      int n = arr.length;
      for (int i = 0; i < n; i++) {
          int tmp = arr[i];
          arr[i] = arr[n - 1 - i];
          arr[n - 1 - i] = tmp;
      }
      System.out.println(Arrays.toString(arr));
    options:
      - "The swap uses tmp in the wrong place"
      - "The loop goes all the way to n, so every pair is swapped twice and returns to the original; it should stop at i < n / 2"
      - "arr.length should be arr.length - 1"
      - "Arrays.toString prints in reverse order"
    answer: 1
    explanation: "In the first half, the pairs (0,4) and (1,3) get swapped; in the second half, the same pairs are swapped back. The fix is i < n / 2, or the two-pointer form while (l < r). The swap itself is correct."
  - id: q4
    type: TRUE_FALSE
    prompt: "The opposite-ends pair-sum technique works correctly on an unsorted array."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Moving left or right relies on the order of values. In an unsorted array, moving left++ might skip the element you needed. Sort first, or use a HashSet/HashMap."
  - id: q5
    type: FILL_THE_CODE
