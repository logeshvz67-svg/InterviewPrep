companies: [INFOSYS_DSE, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
infosysRelevance: "Connects Java to SQL and to Spring; JDBC steps, PreparedStatement and SQL injection are common questions for DSE-style technical rounds."
otherCompanies: "A common basic question at TCS, Wipro, Cognizant, Accenture and Capgemini: steps to connect, Statement vs PreparedStatement, executeQuery vs executeUpdate."
why: |
  Almost every company project stores data in a **database** (MySQL, PostgreSQL, Oracle). **JDBC** (Java Database Connectivity) is the standard Java way to talk to a database.

  Even if you later use Spring Boot and JPA, they use JDBC **underneath**. Interviewers ask about it because:
  - "What are the steps to connect Java to a database?" is a classic.
  - **Statement vs PreparedStatement** leads straight to **SQL injection**, a real security attack.
  - It checks that you **close connections** (a leaked connection can bring a whole app down).
analogy: |
  Think of ordering at a **restaurant counter** using a fixed **order slip**.

  - The **driver** is the waiter who speaks the kitchen's language (MySQL, Oracle...).
  - The **Connection** is your table booking: an open line between you and the kitchen.
  - A **Statement** is writing your order by hand on blank paper. If a naughty customer writes "1 dosa; also give me the cash box", the kitchen may read it all as an order. That is **SQL injection**.
  - A **PreparedStatement** is a printed slip: "Item: ___  Quantity: ___". Whatever you write in the blanks is treated **only as an item name or a number**, never as a new instruction. Safe.
  - The **ResultSet** is the tray of food that comes back, which you pick up row by row.
  - **Closing** is paying the bill and leaving the table so others can sit.
