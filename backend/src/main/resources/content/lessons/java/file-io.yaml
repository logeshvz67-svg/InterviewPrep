  explanation: |
    `Files.writeString` **overwrites** by default, so writing "second" wipes out "first". The third call uses `APPEND`, so "third" is added after "second". The file has 2 lines, so `readAllLines(p).size()` is 2.
commonMistakes:
  - "Forgetting to close (or flush) a BufferedWriter: the data stays in the buffer and the file ends up empty. Use try-with-resources."
  - "Using FileWriter without `true` and being surprised that old content disappeared. The default is overwrite."
  - "Using Reader/Writer for images or PDFs. Binary files need byte streams (InputStream/OutputStream)."
  - "Ignoring IOException with an empty catch block. At least print or log it, or declare `throws IOException`."
  - "Using Files.readAllLines on a huge file (gigabytes): it loads everything into memory. Read line by line instead."
interviewBox:
  why: "Why interviewers ask this: file handling shows if you understand checked exceptions, resource cleanup and choosing the right tool, which are everyday skills in a service-company project."
  questions:
    - q: "What is the difference between byte streams and character streams?"
      a: "Byte streams, like FileInputStream and FileOutputStream, read and write raw bytes, so they work for any file, like images. Character streams, like FileReader and FileWriter, work with characters and handle text encoding for us, so we use them for text files."
    - q: "Why do we use BufferedReader?"
      a: "Reading from disk one character at a time is slow. BufferedReader reads a big block into memory and gives it to us piece by piece. It also gives a handy readLine method that returns one full line, or null at the end of the file."
    - q: "What is try-with-resources?"
      a: "It is a try block with brackets where we open resources like files or database connections. Java closes them automatically at the end, even if an exception happens. It works for any class that implements AutoCloseable, and it removes the need for a finally block."
    - q: "How do you append to a file instead of overwriting it?"
      a: "With FileWriter I pass true as the second argument, like new FileWriter(name, true). With the NIO Files class I pass StandardOpenOption.APPEND."
quiz:
  - id: q1
    type: MCQ
    prompt: "You need to copy a .jpg photo file byte for byte. Which pair of classes fits best?"
    code: null
    options: ["FileReader / FileWriter", "FileInputStream / FileOutputStream", "Scanner / PrintWriter", "BufferedReader / BufferedWriter"]
    answer: 1
    explanation: "A photo is binary data, so you need byte streams: FileInputStream and FileOutputStream. FileReader/FileWriter and the Buffered text classes are character streams; they try to decode bytes as text and can corrupt a binary file."
  - id: q2
    type: TRUE_FALSE
    prompt: "new FileWriter(\"log.txt\") adds new text to the end of log.txt if the file already exists."
    options: ["True", "False"]
    answer: 1
    explanation: "False. By default FileWriter overwrites (empties the file first). You must pass true, as in new FileWriter(\"log.txt\", true), to append."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "StringReader lets a BufferedReader read from a String as if it were a file. What does this print?"
    code: |
      BufferedReader br = new BufferedReader(new StringReader("one\ntwo"));
      String line;
      int count = 0;
      while ((line = br.readLine()) != null) {
          count++;
          System.out.print(line.length());
      }
      System.out.println(" " + count);
    options: ["33 2", "3 1", "6 2", "33 3"]
    answer: 0
    explanation: "readLine returns \"one\" (length 3) and then \"two\" (length 3), printed next to each other as 33. Then readLine returns null and the loop stops, so count is 2. readLine never includes the newline character, which is why it is not 3 and 4."
  - id: q4
    type: SPOT_THE_BUG
    prompt: "This program writes \"hello\" and then reads the file. It prints 0. Why?"
    code: |
      BufferedWriter w = new BufferedWriter(new FileWriter("out.txt"));
      w.write("hello");
      System.out.println(Files.readString(Path.of("out.txt")).length());
    options:
      - "write() needs a newline to work"
      - "The writer was never flushed or closed, so \"hello\" is still in the buffer, not on disk"
      - "Files.readString cannot read files made by FileWriter"
      - "FileWriter must be given true to create a new file"
    answer: 1
    explanation: "BufferedWriter keeps data in memory until the buffer is full, flush() is called, or the writer is closed. Nothing reached the disk, so the file is empty and the length is 0. Wrapping the writer in try-with-resources fixes it. A newline is not required, and FileWriter creates the file without true."
  - id: q5
    type: FILL_THE_CODE
    prompt: "Fill the keyword so the reader is closed automatically."
    code: |
      ____ (BufferedReader br = new BufferedReader(new FileReader("a.txt"))) {
          System.out.println(br.readLine());
      }
    acceptedAnswers: ["try"]
    explanation: "try ( resource ) { ... } is try-with-resources. The reader is closed automatically when the block ends, even if an exception is thrown."
  - id: q6
    type: MATCH
    prompt: "Match each class or method to what it does"
    pairs:
      - left: "BufferedReader.readLine()"
        right: "Returns one line of text, or null at end of file"
      - left: "Files.readAllLines(path)"
        right: "Reads every line into a List<String>"
      - left: "FileOutputStream"
        right: "Writes raw bytes to a file"
      - left: "java.io.File"
        right: "Represents a path; checks exists(), length(), delete()"
    explanation: "readLine and readAllLines are for text; FileOutputStream is a byte stream; File describes a path but does not hold the content."
  - id: q7
    type: MCQ
    prompt: "Why must most file methods be inside try/catch or in a method that declares throws IOException?"
    code: null
    options: ["Because IOException is a checked exception", "Because files are always missing", "Because IOException is a RuntimeException", "Because the JVM cannot open files without catch"]
    answer: 0
    explanation: "IOException is checked, so the compiler forces you to handle or declare it. It is not a RuntimeException; those are unchecked and the compiler does not force handling."
explainBack:
  prompt: "Explain to a friend how a Java program writes a line to a file and reads it back, and why closing matters."
  rubric:
    - "I said a stream is a one-way flow of data (input or output)"
    - "I explained the difference between byte streams and character streams"
    - "I explained buffering and why a BufferedWriter must be flushed or closed"
    - "I mentioned try-with-resources"
    - "I used an analogy like a water tank, pipe and bucket"
  modelAnswer: |
    A file is like a water tank, and a stream is a one-way pipe. To write text I open a writer pipe, usually a BufferedWriter, which collects text in a bucket and pours it to the disk in big chunks. To read I open a reader, like BufferedReader, and call readLine until it returns null. For text I use Reader and Writer; for images I use byte streams. The important part is closing: if I don't close a buffered writer, the last bucket never reaches the disk and the file can stay empty. So I open files inside try-with-resources, and Java closes them for me automatically.
flashcards:
  - front: "Byte stream vs character stream"
    back: "Byte streams (InputStream/OutputStream) move raw bytes, for any file. Character streams (Reader/Writer) move text and handle encoding."
  - front: "What does BufferedReader.readLine() return at end of file?"
    back: "null"
  - front: "How to append with FileWriter?"
    back: "new FileWriter(name, true). The true means append; the default overwrites."
  - front: "Why use try-with-resources?"
    back: "It closes AutoCloseable resources automatically, even on exceptions, so files are flushed and handles are not leaked."
  - front: "Shortest way to read a small text file?"
    back: "Files.readAllLines(Path.of(name)) or Files.readString(path)."
keyTakeaways:
  - "Text uses Reader/Writer; binary uses InputStream/OutputStream."
  - "Buffered classes make IO fast; BufferedReader.readLine() returns null at the end."
  - "Always close resources; try-with-resources does it for you."
  - "FileWriter overwrites by default; pass true (or APPEND) to add to the end."
  - "java.nio.file.Files gives short one-line methods for everyday file work."
