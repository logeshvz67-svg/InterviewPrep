why: |
  Two small features that make your code look **professional**:
  - An **enum** is for a **fixed set of named constants**: days of the week, order status, traffic-light colours. No more magic strings like `"PENDNG"` with a typo.
  - A **record** (Java 16+) is a **compact data carrier**: one line gives you a class with private final fields, a constructor, getters, `equals`, `hashCode` and `toString`.

  Interviewers ask "Can an enum have a constructor?", "What does `ordinal()` return?", "Why are enums good for Singletons?" and "What is a record and how is it different from a normal class?". Using them in a coding round also shows you write modern, clean Java.
analogy: |
  An **enum** is like the **size options on a T-shirt rack**: S, M, L, XL. You can't buy a size "Medium-ish". The list is fixed and known in advance, and each size can carry extra info (chest in cm).

  A **record** is like an **Aadhaar card**: it just **carries data** (name, number, date of birth). Once printed, it doesn't change. Two cards with exactly the same details are considered the same data. Nobody writes a "behaviour manual" for it; it exists to hold values.
