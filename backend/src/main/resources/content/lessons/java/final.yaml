explanation: |
  ### 1. final variables: assign only once
  A **final variable** can be given a value **only once**. After that, any assignment is a **compile error**.
  ```java
  final int MAX = 100;
  MAX = 200;   // compile error: cannot assign a value to final variable MAX
  ```
  - **Constants** are usually `static final` with UPPER_CASE names: `static final double GST_RATE = 0.18;`
  - A **blank final** is a final field without a value at declaration. It **must** be assigned exactly once in **every constructor** (or an instance block). A `static final` blank must be assigned in a static block.
  ```java
  class Student {
      final int rollNo;               // blank final
      Student(int r) { rollNo = r; }  // assigned once here: OK
  }
  ```
  - **final parameters**: `void pay(final double amount)` means the method can't re-assign `amount`.
  - Final **local** variables must be assigned before use, just once.

  ### final reference vs immutable object
  This is the classic trap. For a reference variable, `final` locks the **arrow**, not the **object**:
  ```java
  final List<String> names = new ArrayList<>();
  names.add("Ravi");              // OK: the list object is changed
  names.add("Priya");             // OK
  names = new ArrayList<>();      // COMPILE ERROR: the arrow is final
  ```
  To make the **object** unchangeable you need an **immutable** class (like `String`) or an unmodifiable collection (`List.of(...)`). That's a separate idea from `final`.

  ### 2. final methods: cannot be overridden
  **Overriding** means a child class gives its own version of a parent method (lesson C8). A `final` method **can't be overridden**, so its behaviour is guaranteed for every subclass. It can still be **inherited** and **called**, and it can be **overloaded** (same name, different parameters).
  ```java
  class Payment {
      final void validate() { System.out.println("standard checks"); }
  }
  class UpiPayment extends Payment {
      // void validate() { }   // compile error: cannot override final method
  }
  ```

  ### 3. final classes: cannot be extended
  A **final class** can't have subclasses. `String`, `Integer` (and all wrapper classes), and `Math` are final. This protects them from being changed through inheritance; it's part of why `String` is immutable.
  ```java
  final class Rupee { }
  // class Paisa extends Rupee { }   // compile error: cannot inherit from final Rupee
  ```

  ### Illegal combinations
  - `final abstract` (class or method) is a compile error: **abstract** means "must be completed by a child", **final** means "no child may change it". They contradict each other.
  - Constructors can't be `final` (they are never inherited anyway).

  ### Effectively final (Java 8+)
  A local variable that is **never re-assigned** after its first value is called **effectively final**, even without the keyword. Lambdas and anonymous classes can only use local variables that are final or effectively final (Section F).

  ### final vs finally vs finalize
  | | `final` | `finally` | `finalize()` |
  |---|---|---|---|
  | What is it? | A **keyword** (modifier) | A **block** used with try/catch | A **method** in the `Object` class |
  | Purpose | Lock a variable, method or class | Clean-up code that runs whether or not an exception happened | Clean-up called by the garbage collector before removing an object |
  | When does it act? | Compile time (the compiler enforces it) | Every time the try block finishes | Maybe, at some unknown time, maybe never |
  | Still used? | Yes, all the time | Yes (or try-with-resources) | **No**: deprecated since Java 9, marked for removal since Java 18 |

  **finally** in short:
  ```java
  try {
      int r = 10 / 0;                 // throws ArithmeticException
  } catch (ArithmeticException e) {
      System.out.println("caught");
  } finally {
      System.out.println("always runs");   // closes files, connections...
  }
  ```
  The `finally` block runs whether the try finishes normally, an exception is caught, or even if the try has a `return`. It is skipped only in extreme cases like `System.exit()` or the JVM crashing. (Full details in Section D.)

  **finalize()** in short: the **garbage collector** (the JVM part that frees memory of unused objects) *might* call `finalize()` on an object before deleting it. But there's no guarantee when, or even whether, it runs, and it slows the GC. So it was **deprecated** (officially discouraged). Today we free resources with `try-with-resources` or `finally`.
tinyCode:
  code: |
    import java.util.ArrayList;
    import java.util.List;

    public class FinalDemo {
        static final double GST_RATE = 0.18;

        static class Order {
            final int orderId;
            final List<String> items = new ArrayList<>();

            Order(int orderId) {
                this.orderId = orderId;
            }

            final double total(double price) {
                return price + price * GST_RATE;
            }
        }

        public static void main(String[] args) {
            Order o = new Order(101);
            o.items.add("Dosa");
            o.items.add("Coffee");
            System.out.println(o.orderId + " " + o.items);
            System.out.println(o.total(100));

            try {
                System.out.println("in try");
            } finally {
                System.out.println("in finally");
            }
        }
    }
  walkthrough: |
    - `static final double GST_RATE` is a **constant**: one shared copy that can never change.
    - `final int orderId` is a **blank final**: it gets its value exactly once, in the constructor.
    - `final List<String> items` locks the reference, but we can still `add` to the list. Prints `101 [Dosa, Coffee]`.
    - `total` is a **final method**: subclasses could use it but not override it. 100 + 18 = `118.0`.
    - The `try` block prints, then the `finally` block runs as it always does.

    Output:
    ```
    101 [Dosa, Coffee]
    118.0
    in try
    in finally
    ```
