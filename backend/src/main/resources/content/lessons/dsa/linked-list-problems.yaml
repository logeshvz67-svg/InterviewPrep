    public class Predict {
        static class Node {
            int val; Node next;
            Node(int val, Node next) { this.val = val; this.next = next; }
        }

        public static void main(String[] args) {
            Node head = new Node(10, new Node(20, new Node(30, null)));
            Node prev = null, cur = head;
            while (cur != null) {
                Node next = cur.next;
                cur.next = prev;
                prev = cur;
                cur = next;
                System.out.print("[" + prev.val + "]");
            }
            System.out.println();
            System.out.println(prev.val + " " + prev.next.val + " " + head.next);
        }
    }
  expectedOutput: |
    [10][20][30]
    30 20 null
  explanation: |
    Each loop round flips one arrow and moves `prev` onto the node just processed, so the first line prints [10][20][30]. After the loop, `prev` is node 30, the new head, and its next is 20. The variable `head` still refers to node 10, which is now the LAST node, so `head.next` is `null`. This is why after reversing you must use the returned `prev`, not the old `head`.
commonMistakes:
  - "Changing cur.next before saving it in a next variable: the rest of the list is lost."
  - "Returning head instead of prev after reversing; the old head is now the tail."
  - "Loop condition fast.next != null alone: crashes with NullPointerException when fast itself becomes null. Use fast != null && fast.next != null."
  - "Comparing slow.val == fast.val for cycle detection; different nodes can hold the same value. Compare the nodes: slow == fast."
  - "Deleting the head in remove-nth without a dummy node, leading to special cases and bugs."
  - "Forgetting to attach the leftover part (tail.next = a or b) after the merge loop."
interviewBox:
  why: "Why interviewers ask this: linked lists test careful reference handling, edge cases (empty, one node, head removal) and the slow/fast pointer idea, all in a few lines of code."
  questions:
    - q: "How do you reverse a singly linked list?"
      a: "I keep three references: prev, cur and next. Starting with prev as null and cur as head, in each step I save cur.next in next, point cur.next back to prev, then move prev to cur and cur to next. When cur becomes null, prev is the new head. It's O(n) time and O(1) extra space."
    - q: "How do you detect a cycle in a linked list?"
      a: "I use Floyd's slow and fast pointers. Slow moves one step and fast moves two. If fast reaches null, there is no cycle. If there is a loop, fast keeps gaining one step on slow inside it, so they eventually point to the same node. It's O(n) time and O(1) space, better than storing visited nodes in a HashSet."
    - q: "How do you find the middle of a linked list in one pass?"
      a: "Slow and fast pointers again. Fast moves two steps and slow moves one. When fast reaches the end, slow is in the middle. For an even number of nodes, this version gives the second of the two middle nodes."
    - q: "Why do we use a dummy node?"
      a: "A dummy node sits before the real head, so every real node, even the head, has a node before it. That removes special cases when deleting the head or building a new list. At the end I return dummy.next."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "The list is 1 -> 2 -> 3 -> 4 -> 5 -> 6. What does this print?"
    code: |
      Node slow = head, fast = head;
      while (fast != null && fast.next != null) {
          slow = slow.next;
          fast = fast.next.next;
      }
      System.out.println(slow.val);
    options: ["3", "4", "5", "6"]
    answer: 1
    explanation: "Trace: (S,F) start at (1,1), then (2,3), (3,5), (4,null). fast is null, so the loop stops with slow on 4. For an even length, this loop gives the SECOND middle. 3 is the first middle; you would get it with the condition fast.next != null && fast.next.next != null."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "This 'reverse' on 1 -> 2 -> 3 returns a list with only the node 1. What is the bug?"
    code: |
      Node prev = null, cur = head;
      while (cur != null) {
          cur.next = prev;
          prev = cur;
          cur = cur.next;
      }
      return prev;
    options:
      - "prev should start as head, not null"
      - "cur.next is overwritten before it is saved, so cur = cur.next becomes null and the rest of the list is lost"
      - "The loop should be while (cur.next != null)"
      - "It should return head instead of prev"
    answer: 1
    explanation: "After cur.next = prev (null), the line cur = cur.next moves cur to null, so the loop ends after one round and nodes 2 and 3 are lost. Fix: save Node next = cur.next first, and finish with cur = next. Returning head would also be wrong: head is the tail after a correct reverse."
  - id: q3
    type: PREDICT_OUTPUT
    prompt: "Remove the nth node from the end with n = 2 on the list 1 -> 2 -> 3 -> 4 -> 5. What is printed (the values of the resulting list)?"
    code: |
      Node dummy = new Node(0);
      dummy.next = head;
      Node first = dummy, second = dummy;
      for (int i = 0; i <= n; i++) first = first.next;
      while (first != null) {
          first = first.next;
          second = second.next;
      }
      second.next = second.next.next;
      print(dummy.next);
    options: ["1 2 3 5", "1 2 4 5", "1 3 4 5", "1 2 3 4"]
    answer: 0
    explanation: "first moves 3 steps (to node 3), making a gap of 3. Both then move until first is null: second stops on node 3. second.next = node 5 skips node 4, which is 2nd from the end. \"1 2 4 5\" removes the 3rd from the end, a classic off-by-one."
  - id: q4
    type: MCQ
    prompt: "What is the time and extra space complexity of Floyd's cycle detection?"
    code: null
    options: ["O(n) time, O(n) space", "O(n) time, O(1) space", "O(n^2) time, O(1) space", "O(log n) time, O(1) space"]
    answer: 1
    explanation: "Fast meets slow within a number of steps proportional to n, and only two references are stored: O(1) space. O(n) space is the HashSet-of-visited-nodes approach, which also works but uses more memory."
  - id: q5
    type: TRUE_FALSE
    prompt: "Accessing the k-th element of a singly linked list takes O(1) time, just like an array."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Nodes are scattered in memory, so you must walk k steps from the head: O(k), which is O(n) in the worst case. Arrays are O(1) because elements sit side by side and the address can be calculated."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Cycle detection: fill the loop condition so the code never throws a NullPointerException."
    code: |
      Node slow = head, fast = head;
      while (____) {
          slow = slow.next;
          fast = fast.next.next;
          if (slow == fast) return true;
      }
      return false;
    acceptedAnswers: ["fast != null && fast.next != null", "fast!=null&&fast.next!=null", "fast != null && null != fast.next"]
    explanation: "fast.next.next needs both fast and fast.next to be non-null. Checking fast first matters: && stops early, so fast.next is never read when fast is null. Only fast.next != null crashes when fast is null."
  - id: q7
    type: MATCH
    prompt: "Match each linked list problem to its main trick"
    pairs:
      - left: "Reverse a list"
        right: "prev / cur / next references"
      - left: "Find the middle in one pass"
        right: "Slow moves 1, fast moves 2"
      - left: "Remove the head safely"
        right: "Dummy node before the head"
      - left: "Merge two sorted lists"
        right: "Dummy node plus a tail pointer"
    explanation: "Reversing flips arrows one at a time; middle and cycle use speed difference; a dummy node removes head special cases; merging builds a new chain behind a tail pointer."
  - id: q8
    type: MCQ
    prompt: "Merging two sorted linked lists of lengths n and m by re-linking existing nodes takes:"
    code: null
    options: ["O(n * m) time, O(1) extra space", "O(n + m) time, O(1) extra space", "O(n + m) time, O(n + m) extra space", "O((n + m) log(n + m)) time, O(1) extra space"]
    answer: 1
    explanation: "Each step attaches one node, so n + m steps. We only move references and create one dummy node, so O(1) extra space. O(n + m) space would be needed only if we copied every node into new nodes; the log factor would come from sorting everything again."
