  explanation: |
    A Mockito mock returns **default values** for every method you did not program: an **empty `Optional`** (not null), an **empty list**, **0** for an `int`, and **null** for other objects like `Wallet`. That is why, in a test, forgetting a `when(...)` for `findByUserId` usually leads to your "not found" branch rather than a NullPointerException.
commonMistakes:
  - "Starting the whole Spring context (@SpringBootTest) for every small logic test. Use plain JUnit + Mockito for unit tests; they run in milliseconds."
  - "Only testing the happy path. Test invalid input, missing data and limits too (like XpServiceTest's daily cap test)."
  - "Stubbing answers the test never uses. Mockito's strict stubs fail the test with UnnecessaryStubbingException."
  - "Editing a Flyway migration that already ran. The checksum changes and the app refuses to start; add a new V<n+1> file instead."
  - "Building the jar inside a JRE-only image, or copying all source before the pom in a Dockerfile, which re-downloads dependencies on every code change."
  - "Saying microservices are always better. They add network failures, distributed data and operational cost; a well-structured monolith is often the right start."
interviewBox:
  why: "Why interviewers ask this: it shows whether you can deliver and maintain software, not just write features. Your own project gives you concrete, honest answers."
  questions:
    - q: "How did you test your Spring Boot project?"
      a: "Two levels. Unit tests with JUnit 5 and Mockito for business rules: for example XpServiceTest creates XpService with mock repositories and checks that XP is given once and daily caps work, and verifies nothing is saved when it shouldn't be. Then integration tests with @SpringBootTest and MockMvc that go through the real security filter, controllers and an embedded PostgreSQL with the Flyway migrations: checking 401 without login, 400 for invalid input and that users can't see each other's data."
    - q: "What is the difference between @Mock and @MockitoBean (or @MockBean)?"
      a: "@Mock is plain Mockito: it creates a mock for a unit test without Spring. @MockitoBean, which replaced @MockBean in Spring Boot 3.4, puts a mock into the Spring application context, replacing the real bean, in tests like @WebMvcTest or @SpringBootTest."
    - q: "What is Flyway and why use it?"
      a: "Flyway runs versioned SQL migration files, like V1__init.sql and V2__add_table.sql, in order and only once per database, tracking them in flyway_schema_history. It also stores checksums, so changed old files are detected. This gives every environment the same schema with a reviewable history. Hibernate is set to validate, so it only checks the entities match."
    - q: "Explain your Dockerfile."
      a: "It is a multi-stage build. Stage one uses a Maven image with JDK 21: it copies pom.xml first and downloads dependencies, so that layer is cached, then copies the source and builds the jar. Stage two starts from a small JRE 21 Alpine image, copies only the jar, creates a non-root user, sets memory-friendly JVM options for a 512 MB server, and starts with java -jar. The final image has no Maven and no source code."
    - q: "Monolith or microservices? What would you choose?"
      a: "For a small team or a new product, a well-layered monolith: simpler to build, test, deploy and keep consistent, which is why my project is a monolith. Microservices make sense when different parts need to scale or deploy independently or many teams work in parallel. Then you need an API gateway, service discovery, a database per service, circuit breakers and tracing, so the operational cost is much higher."
quiz:
  - id: q1
    type: MCQ
    prompt: "Which test is a UNIT test?"
    code: null
    options:
      - "Start the app with @SpringBootTest and call POST /api/problems through MockMvc"
      - "Create XpService with Mockito mocks and check award() returns the right XP"
      - "Open the deployed website and click through the login page"
      - "Run the Flyway migrations on an embedded PostgreSQL"
    answer: 1
    explanation: "A unit test checks one class in isolation with mocked dependencies, like XpServiceTest. Option A is an integration test (whole context), C is an end-to-end test, and D is part of the integration setup."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "This test fails with UnnecessaryStubbingException even though the service is correct. Why?"
    code: |
      @ExtendWith(MockitoExtension.class)
      class RewardServiceTest {
          @Mock WalletRepository wallets;

          @Test
          void rejectsZeroCoins() {
              when(wallets.findByUserId(1L)).thenReturn(Optional.of(new Wallet(1L, 50)));
              RewardService service = new RewardService(wallets);
              assertThatThrownBy(() -> service.reward(1L, 0))
                      .isInstanceOf(IllegalArgumentException.class);
          }
      }
    options:
      - "assertThatThrownBy cannot be used with Mockito"
      - "reward(1L, 0) throws before calling findByUserId, so the stub is never used, and MockitoExtension's strict stubs fail the test"
      - "@Mock fields must be static"
      - "Optional.of cannot be returned from a mock"
    answer: 1
    explanation: "MockitoExtension uses strict stubs: a when(...) that the test never triggers is reported as UnnecessaryStubbingException. Remove the stub (and add verifyNoInteractions(wallets) to prove the repository is untouched)."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "V1__users.sql was applied to the production database last month. A developer adds a column directly inside V1__users.sql and redeploys. What happens?"
    code: |
      -- db/migration/V1__users.sql  (edited after it was applied)
      CREATE TABLE users (
          id    BIGSERIAL PRIMARY KEY,
          email VARCHAR(255),
          phone TEXT              -- newly added line
      );
    options:
      - "Flyway re-runs V1 and adds the phone column"
      - "Nothing; Flyway ignores old files"
      - "Startup fails: Flyway validation reports a checksum mismatch for version 1; the change must go in a new file like V9__add_phone.sql"
      - "Hibernate adds the column automatically"
    answer: 2
    explanation: "Flyway stores each applied file's checksum. An edited applied file fails validation ('Migration checksum mismatch for migration version 1') and the app does not start. Applied migrations are history: never edit, always add a new version. Hibernate with ddl-auto=validate never changes the schema."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "The database is at version 3 (V1, V2, V3 applied). A developer adds V2_1__logs.sql and starts the app with default Flyway settings. What happens?"
    code: |
      db/migration/
        V1__users.sql        (applied)
        V2__badges.sql       (applied)
        V2_1__logs.sql       (NEW)
        V3__user_city.sql    (applied)
    options:
      - "V2_1 runs and the database is at version 3"
      - "Validation fails: 'Detected resolved migration not applied to database: 2.1' (outOfOrder is false by default)"
      - "V2_1 is silently skipped forever"
      - "All four migrations run again"
    answer: 1
    explanation: "By default Flyway only applies versions higher than the current one, and validation complains about a lower, unapplied version. You can allow it with outOfOrder=true, but the usual fix is to rename it to the next version, V4__logs.sql."
  - id: q5
    type: TRUE_FALSE
    prompt: "In a microservices architecture, it is generally recommended that each service owns its own database instead of sharing one database with other services."
    options: ["True", "False"]
    answer: 0
    explanation: "True. 'Database per service' keeps services independently deployable; others access the data through the owning service's API or events. Sharing one database couples the services tightly again."
  - id: q6
    type: MATCH
    prompt: "Match each tool or annotation to its job"
    pairs:
      - left: "@ExtendWith(MockitoExtension.class) + @Mock"
        right: "Plain unit test with fake dependencies, no Spring context"
      - left: "@SpringBootTest + @AutoConfigureMockMvc"
        right: "Full app context, HTTP requests through the real filter chain"
      - left: "@MockitoBean"
        right: "Replace a bean in the Spring context with a mock"
      - left: "V9__add_badges.sql"
        right: "A new Flyway migration that runs once on next startup"
      - left: "Multi-stage Dockerfile"
        right: "Build with Maven, ship only a small JRE image with the jar"
    explanation: "These are the tools behind 'how did you test and deploy your project?'. @MockitoBean replaced @MockBean in Spring Boot 3.4+."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Enable Mockito's JUnit 5 extension so the @Mock fields are created automatically."
    code: |
      @ExtendWith(____.class)
      class XpServiceTest {
          @Mock XpEventRepository events;
          @Mock ProfileRepository profiles;
      }
    acceptedAnswers: ["MockitoExtension"]
    explanation: "MockitoExtension (from mockito-junit-jupiter) initialises @Mock fields before each test and enables strict stubbing. XpServiceTest uses exactly this."
  - id: q8
    type: MCQ
    prompt: "Why does backend/Dockerfile copy pom.xml and run dependency:go-offline BEFORE copying src?"
    code: null
    options:
      - "Maven requires the pom to be alone in the folder"
      - "So the dependency layer is cached: changing Java code does not re-download all libraries on the next build"
      - "To make the final image smaller"
      - "Docker cannot copy folders and files in one step"
    answer: 1
    explanation: "Docker caches each layer and rebuilds from the first changed instruction. The pom rarely changes, so the slow download layer is reused; only the source copy and package steps rerun. The final image size comes from the second stage, not from this order."
explainBack:
  prompt: "Explain to a friend how your project is tested, how its database schema changes, and how it is deployed."
  rubric:
    - "I explained unit tests with JUnit 5 + Mockito (mocks, when, verify)"
    - "I explained integration tests with @SpringBootTest + MockMvc and a real database"
    - "I explained Flyway versioned migrations and why old files are never edited"
    - "I explained the multi-stage Dockerfile"
    - "I compared monolith and microservices honestly"
  modelAnswer: |
    For business rules I write unit tests with JUnit 5 and Mockito. For example, XpServiceTest builds the service with mock repositories, programs answers with when, and checks with verify that XP is saved once and never twice. Then integration tests start the whole app with @SpringBootTest, use MockMvc to send requests through the real security and controllers, on an embedded PostgreSQL. The schema is managed by Flyway: numbered files like V1 to V8 run once, in order, and I never edit an applied file; I add a new one. For deployment, a multi-stage Dockerfile builds the jar with Maven and ships it on a small JRE image. The app is a layered monolith, which is right for one team; microservices would add a lot of complexity.
