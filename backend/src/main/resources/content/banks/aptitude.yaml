- id: apt-050
  section: LOGICAL
  topic: Seating Arrangement
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: P, Q, R and S sit around a round table facing the centre. P is opposite R. Q is to the immediate left of P. Who
    is to the immediate right of P?
  options: [Q, R, S, Cannot be determined]
  answer: 2
  explanation: With 4 people at a round table, each person has two neighbours and one person opposite. R is opposite P, so
    P's neighbours are Q and S. Q is on P's left, so S must be on P's right.
- id: apt-051
  section: LOGICAL
  topic: Ranking and Order
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: In a row of 40 students, Ravi is 12th from the left end. What is his position from the right end?
  options: [27th, 29th, 30th, 28th]
  answer: 1
  explanation: Position from right = total - position from left + 1 = 40 - 12 + 1 = 29. We add 1 because Ravi is counted in
    both directions.
- id: apt-052
  section: LOGICAL
  topic: Syllogism
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: 'Statements: All roses are flowers. All flowers are plants. Conclusions: I. All roses are plants. II. Some plants
    are roses.'
  options: [Only conclusion I follows, Only conclusion II follows, Both I and II follow, Neither I nor II follows]
  answer: 2
  explanation: 'Draw circles: roses inside flowers, flowers inside plants. So all roses are inside plants: conclusion I follows.
    Since all roses are plants, at least some plants are roses: conclusion II also follows.'
- id: apt-053
  section: LOGICAL
  topic: Syllogism
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: 'Statements: Some pens are books. No book is a bag. Conclusions: I. Some pens are not bags. II. Some bags are
    pens.'
  options: [Only conclusion I follows, Only conclusion II follows, Both I and II follow, Neither I nor II follows]
  answer: 0
  explanation: 'The pens that are books can never be bags (no book is a bag). So some pens are surely not bags: I follows.
    But we know nothing about other pens and bags, so we cannot say some bags are pens: II does not follow.'
- id: apt-054
  section: LOGICAL
  topic: Syllogism
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO]
  question: 'Statements: All doctors are graduates. Some graduates are singers. Conclusions: I. Some doctors are singers.
    II. Some singers are graduates.'
  options: [Only conclusion I follows, Only conclusion II follows, Both I and II follow, Neither I nor II follows]
  answer: 1
  explanation: The singers may be graduates who are not doctors, so I is not certain. 'Some graduates are singers' can be
    reversed to 'some singers are graduates', so II follows.
- id: apt-055
  section: LOGICAL
  topic: Data Sufficiency
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: 'What is the value of x? Statement I: 2x + 3 = 11. Statement II: x^2 = 16.'
  options: [Statement I alone is sufficient, Statement II alone is sufficient, Both statements together are needed, Either
      statement alone is sufficient]
  answer: 0
  explanation: 'From I: 2x = 8, so x = 4. One clear answer, so I is sufficient. From II: x can be 4 or -4, two answers, so
    II is not sufficient. Answer: I alone.'
- id: apt-056
  section: LOGICAL
  topic: Data Sufficiency
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: 'Is A the tallest among A, B and C? Statement I: A is taller than B. Statement II: C is shorter than B.'
  options: [Statement I alone is sufficient, Statement II alone is sufficient, Both statements together are needed, Either
      statement alone is sufficient]
  answer: 2
  explanation: 'I alone: A > B, but we know nothing about C. II alone: B > C, but we know nothing about A. Together: A > B
    > C, so A is the tallest. Both statements are needed.'
- id: apt-057
  section: LOGICAL
  topic: Odd One Out
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: 'Find the odd one out: 3, 5, 7, 9, 11'
  options: ['11', '3', '9', '5']
  answer: 2
  explanation: 3, 5, 7 and 11 are prime numbers (divisible only by 1 and themselves). 9 = 3 x 3 is not prime. So 9 is the
    odd one.
- id: apt-058
  section: LOGICAL
  topic: Clocks
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL]
  question: What is the angle between the hour hand and the minute hand at 3:30?
  options: [90 degrees, 60 degrees, 105 degrees, 75 degrees]
  answer: 3
  explanation: 'Formula: angle = |30H - 5.5M|. Here H = 3, M = 30. 30 x 3 = 90. 5.5 x 30 = 165. |90 - 165| = 75 degrees. The
    hour hand has moved halfway between 3 and 4, which is why it is not 90.'
- id: apt-059
  section: LOGICAL
  topic: Calendars
  difficulty: EASY
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO]
  question: If today is Monday, what day will it be after 61 days?
  options: [Saturday, Thursday, Friday, Sunday]
  answer: 0
  explanation: 'Days repeat every 7. 61 / 7 = 8 weeks with remainder 5. Count 5 days ahead from Monday: Tuesday, Wednesday,
    Thursday, Friday, Saturday.'
- id: apt-060
  section: LOGICAL
  topic: Puzzles
  difficulty: MEDIUM
  companies: [INFOSYS_SP, INFOSYS_DSE, ALL, TCS, WIPRO, COGNIZANT, ACCENTURE, CAPGEMINI]
  question: In a group of cows and hens, the number of legs is 14 more than twice the number of heads. How many cows are there?
  options: ['14', '7', '6', '5']
  answer: 1
  explanation: Let cows = c and hens = h. Legs = 4c + 2h. Heads = c + h. So 4c + 2h = 2(c + h) + 14. That gives 4c + 2h =
    2c + 2h + 14, so 2c = 14, c = 7. The number of hens does not matter.
