explanation: |
  ### The three blocks
  - **try**: code that *might* throw an exception.
  - **catch (Type e)**: runs only if an exception of that type (or a subclass) was thrown in the try. `e` is the exception object.
  - **finally**: runs **after** try (and catch), **whether or not** an exception happened. Used for cleanup: closing files, releasing locks, printing "done".

  Allowed shapes: `try-catch`, `try-finally`, `try-catch-finally`, and many catches. A `try` alone (no catch, no finally) is a compile error.

  ### Flow of control, step by step
  **Case 1: no exception.** All of try runs, every catch is skipped, finally runs, then code after the block.

  **Case 2: exception, and a catch matches.** Try stops at the line that threw. The remaining try lines are **skipped forever** (Java never goes back). The first matching catch runs, then finally, then code after the block.

  **Case 3: exception, and no catch matches.** Finally still runs, then the exception keeps travelling up to the calling method. Code after the block does **not** run in this method.

  **Case 4: exception inside a catch block.** Finally runs, then the new exception travels up.

  ### How Java picks a catch block
  Java checks the catch blocks **from top to bottom** and runs the **first one whose type matches** (same class or a parent class). Only **one** catch block runs per exception.

  ### Catch order: specific first, general last
  Because a parent type also matches its children, putting a parent **before** a child makes the child's catch unreachable. Java refuses to compile it:
  ```java
  try {
      int x = 5 / 0;
  } catch (Exception e) {
      System.out.println("general");
  } catch (ArithmeticException e) {   // compile error:
      System.out.println("maths");     // exception ArithmeticException
  }                                    // has already been caught
  ```
  Fix: put `ArithmeticException` first. Unrelated types (like `ArithmeticException` and `NullPointerException`) can be in any order.

  ### Multi-catch (Java 7+)
  If two exceptions need the **same** handling, join them with `|`:
  ```java
  try {
      int n = Integer.parseInt(text);
      System.out.println(arr[n]);
  } catch (NumberFormatException | ArrayIndexOutOfBoundsException e) {
      System.out.println("Bad input: " + e.getClass().getSimpleName());
  }
  ```
  Two rules:
  1. The types must **not** be parent and child. `catch (IOException | FileNotFoundException e)` is a compile error, because the parent already covers the child.
  2. `e` is implicitly **final**: you cannot assign `e = ...` inside the block.

  ### What exactly does finally guarantee?
  finally runs after a normal finish, after a caught exception, after an uncaught exception, and even after a `return`, `break` or `continue` inside try. The only common cases where it does **not** run are `System.exit()`, the JVM crashing, or the machine losing power. (The next lessons dig into these traps.)

  ### Nested try
  A try block can contain another try/catch. If the inner catch doesn't match, the exception goes to the outer catch. Each level's finally still runs, inner first.

  ### Quick summary table
  | Situation | Rest of try | catch | finally | Code after |
  |---|---|---|---|---|
  | No exception | runs | skipped | runs | runs |
  | Exception, caught | skipped | first match runs | runs | runs |
  | Exception, not caught | skipped | none | runs | skipped (exception goes up) |
tinyCode:
  code: |
    public class Kitchen {
        static void cook(String step) {
            try {
                System.out.println("Try: " + step);
                if (step.equals("milk")) {
                    throw new IllegalStateException("milk boiled over");
                }
                System.out.println("Done: " + step);
            } catch (IllegalStateException e) {
                System.out.println("Catch: " + e.getMessage());
            } finally {
                System.out.println("Finally: gas off");
            }
        }
        public static void main(String[] args) {
            cook("rice");
            cook("milk");
        }
    }
  walkthrough: |
    - `cook("rice")`: no exception. The try prints both lines, catch is skipped, finally prints "gas off".
    - `cook("milk")`: we **throw** an `IllegalStateException` (an unchecked exception meaning "the object is in a bad state").
      - "Done: milk" is **skipped**, because try stops at the throw.
      - The catch matches, so it prints the message.
      - finally still prints "gas off".

    Output:
    ```
    Try: rice
    Done: rice
    Finally: gas off
    Try: milk
    Catch: milk boiled over
    Finally: gas off
    ```
tryIt:
  instructions: "Type this program. It uses a multi-catch and ordered catch blocks. Run it, then try moving 'catch (Exception e)' to the top and read the compile error."
  code: |
    public class Picker {
        static void run(String input) {
            int[] marks = {70, 85, 90};
            try {
                int i = Integer.parseInt(input);
                System.out.println("Mark: " + (marks[i] / i));
            } catch (NumberFormatException | ArrayIndexOutOfBoundsException e) {
                System.out.println("Bad index input: " + input);
            } catch (Exception e) {
                System.out.println("Other: " + e.getClass().getSimpleName());
            } finally {
                System.out.println("-- checked " + input);
            }
        }
        public static void main(String[] args) {
            run("1");
            run("x");
            run("7");
            run("0");
        }
    }
