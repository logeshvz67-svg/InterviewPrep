explanation: |
  ### Key words
  - **Stable sort**: equal items keep their original relative order. (Sort students by marks; two students with 90 stay in their original roll-number order.)
  - **In-place**: uses only O(1) or O(log n) extra memory, no big extra array.
  - **Comparison sort**: decides order only by comparing pairs. No comparison sort can beat **O(n log n)** in the worst case.

  ### The three simple sorts (know the idea, not for big inputs)
  - **Bubble sort**: compare neighbours and swap if out of order. After pass 1 the largest item has "bubbled" to the end. Stop early if a pass makes no swap.
  - **Selection sort**: find the minimum of the unsorted part and swap it to the front. Always O(n^2), even on sorted input.
  - **Insertion sort**: take the next item and slide it left into its correct place, like arranging playing cards in your hand. Very fast on **nearly sorted** data (O(n)).

  ### Merge sort (divide and conquer)
  Split the array into two halves, sort each half recursively, then **merge** the two sorted halves with two pointers.
  ```java
  static void mergeSort(int[] a, int lo, int hi) {
      if (lo >= hi) return;                 // 0 or 1 item: already sorted
      int mid = lo + (hi - lo) / 2;
      mergeSort(a, lo, mid);
      mergeSort(a, mid + 1, hi);
      merge(a, lo, mid, hi);                // two-pointer merge into a temp array
  }
  ```
  There are log n levels of splitting and each level does O(n) merge work: **O(n log n) always**. It needs an O(n) temp array. Using `<=` while merging keeps it **stable**.

  ### Quick sort
  Pick a **pivot**, then **partition**: move smaller items to its left and bigger ones to its right. The pivot is now in its final place; sort both sides recursively.
  ```java
  static int partition(int[] a, int lo, int hi) {
      int pivot = a[hi], i = lo;            // Lomuto: last element is the pivot
      for (int j = lo; j < hi; j++) {
          if (a[j] < pivot) { int t = a[i]; a[i] = a[j]; a[j] = t; i++; }
      }
      int t = a[i]; a[i] = a[hi]; a[hi] = t;  // put pivot in its final place
      return i;
  }
  ```
  Average **O(n log n)**, in-place, usually the fastest in practice. But if the pivot is always the smallest or largest (for example, an already sorted array with "last element" pivot), it degrades to **O(n^2)**. Random pivots make that very unlikely. Not stable.

  ### Comparison table
  | Sort | Best | Average | Worst | Extra space | Stable? |
  |---|---|---|---|---|---|
  | Bubble | O(n) | O(n^2) | O(n^2) | O(1) | Yes |
  | Selection | O(n^2) | O(n^2) | O(n^2) | O(1) | No |
  | Insertion | O(n) | O(n^2) | O(n^2) | O(1) | Yes |
  | Merge | O(n log n) | O(n log n) | O(n log n) | O(n) | Yes |
  | Quick | O(n log n) | O(n log n) | O(n^2) | O(log n) stack | No |
  | Heap | O(n log n) | O(n log n) | O(n log n) | O(1) | No |

  ### What does Java use?
  - `Arrays.sort(int[])` and other **primitive** arrays: **Dual-Pivot Quicksort** (quick sort with two pivots). Stability does not matter for plain numbers.
  - `Arrays.sort(Object[])` and `Collections.sort(list)`: **TimSort**, a mix of merge sort and insertion sort. It is **stable** and very fast on partly sorted data. That's why sorting objects by one field keeps the earlier order for ties.

  ### The binary search template
  ```java
  int lo = 0, hi = a.length - 1;
  while (lo <= hi) {                        // <= : one item left is still checked
      int mid = lo + (hi - lo) / 2;         // avoids int overflow of (lo + hi)
      if (a[mid] == target) return mid;
      if (a[mid] < target) lo = mid + 1;    // target is on the right
      else hi = mid - 1;                    // target is on the left
  }
  return -1;
  ```
  **Why `lo + (hi - lo) / 2`?** If `lo` and `hi` are both near 2 billion, `lo + hi` overflows `int` and becomes negative.

  ### Lower bound (first index with value >= target)
  Useful for "first occurrence", "count of x", "insert position".
  ```java
  int lo = 0, hi = a.length;                // hi = n: answer can be "after the end"
  while (lo < hi) {
      int mid = lo + (hi - lo) / 2;
      if (a[mid] < target) lo = mid + 1;
      else hi = mid;                        // mid might be the answer: keep it
  }
  return lo;
  ```
  Change `<` to `<=` and you get the **upper bound** (first index with value > target). Count of x = upperBound - lowerBound.

  ### Search in a rotated sorted array
  `[4, 5, 6, 7, 0, 1, 2]` is a sorted array rotated at some point. At any `mid`, **at least one half is still sorted**. Check if the target lies inside that sorted half; if yes, go there, otherwise go to the other half.
  ```java
  if (a[lo] <= a[mid]) {                    // left half sorted
      if (a[lo] <= target && target < a[mid]) hi = mid - 1; else lo = mid + 1;
  } else {                                  // right half sorted
      if (a[mid] < target && target <= a[hi]) lo = mid + 1; else hi = mid - 1;
  }
  ```

  ### Binary search on the answer
  Sometimes there is no sorted array, but the **answers** are ordered: "if speed 5 works, every speed above 5 also works". Then binary search over the possible answers and test each `mid` with a helper `canDo(mid)`.
  - Examples: integer square root, minimum eating speed, minimum ship capacity in D days, allocate minimum pages.
  - Template: `lo` = smallest possible answer, `hi` = largest; if `canDo(mid)`, record it and search the better side.
  - Time: O(log(range) x cost of canDo).

  ### Complexity summary
  | Task | Time | Space |
  |---|---|---|
  | Linear search | O(n) | O(1) |
  | Binary search / lower bound / rotated | O(log n) | O(1) |
  | Sort then binary search q times | O(n log n + q log n) | depends on sort |
tinyCode:
  code: |
    import java.util.Arrays;

    public class SortSearch {
        static void mergeSort(int[] a, int lo, int hi) {
            if (lo >= hi) return;
            int mid = lo + (hi - lo) / 2;
            mergeSort(a, lo, mid);
            mergeSort(a, mid + 1, hi);
            int[] tmp = new int[hi - lo + 1];
            int i = lo, j = mid + 1, k = 0;
            while (i <= mid && j <= hi) tmp[k++] = (a[i] <= a[j]) ? a[i++] : a[j++];
            while (i <= mid) tmp[k++] = a[i++];
            while (j <= hi) tmp[k++] = a[j++];
            System.arraycopy(tmp, 0, a, lo, tmp.length);
        }

        static int binarySearch(int[] a, int target) {
            int lo = 0, hi = a.length - 1;
            while (lo <= hi) {
                int mid = lo + (hi - lo) / 2;
                if (a[mid] == target) return mid;
                if (a[mid] < target) lo = mid + 1;
                else hi = mid - 1;
            }
            return -1;
        }

        // first index with a[i] >= target (a.length if none)
        static int lowerBound(int[] a, int target) {
            int lo = 0, hi = a.length;
            while (lo < hi) {
                int mid = lo + (hi - lo) / 2;
                if (a[mid] < target) lo = mid + 1;
                else hi = mid;
            }
            return lo;
        }

        static int searchRotated(int[] a, int target) {
            int lo = 0, hi = a.length - 1;
            while (lo <= hi) {
                int mid = lo + (hi - lo) / 2;
                if (a[mid] == target) return mid;
                if (a[lo] <= a[mid]) {                       // left half sorted
                    if (a[lo] <= target && target < a[mid]) hi = mid - 1;
                    else lo = mid + 1;
                } else {                                     // right half sorted
                    if (a[mid] < target && target <= a[hi]) lo = mid + 1;
                    else hi = mid - 1;
                }
            }
            return -1;
        }

        public static void main(String[] args) {
            int[] a = {38, 27, 43, 3, 9, 82, 10};
            mergeSort(a, 0, a.length - 1);
            System.out.println(Arrays.toString(a));
            System.out.println(binarySearch(a, 43) + " " + binarySearch(a, 5));

            int[] d = {1, 2, 2, 2, 5, 8};
            System.out.println(lowerBound(d, 2) + " " + lowerBound(d, 3) + " " + lowerBound(d, 9));

            int[] r = {4, 5, 6, 7, 0, 1, 2};
            System.out.println(searchRotated(r, 0) + " " + searchRotated(r, 3));
        }
    }
  walkthrough: |
    - **mergeSort** splits until one element is left, then merges two sorted halves into `tmp` with two pointers `i` and `j`. `a[i] <= a[j]` takes from the left half on ties, which keeps it stable. `System.arraycopy` copies the merged part back.
    - **binarySearch**: 43 is at index 5 in the sorted array. 5 is not present, so `lo` passes `hi` and we return -1.
    - **lowerBound** on `[1, 2, 2, 2, 5, 8]`:
      - target 2: first index holding a value >= 2 is **1** (the first 2).
      - target 3: no 3, the first value >= 3 is 5 at index **4** (where 3 would be inserted).
      - target 9: nothing is >= 9, so the answer is the length, **6**.
    - **searchRotated**: in `[4, 5, 6, 7, 0, 1, 2]`, 0 is at index 4; 3 is missing, so -1.

    Output:
    ```
    [3, 9, 10, 27, 38, 43, 82]
    5 -1
    1 4 6
    4 -1
    ```
tryIt:
  instructions: "Type this 'binary search on the answer' program: it finds the integer square root without Math.sqrt. Notice the (long) cast that stops mid * mid from overflowing. Then try sqrtFloor(99)."
  code: |
    public class SqrtFloor {
        // largest x such that x * x <= n
        static int sqrtFloor(int n) {
            int lo = 0, hi = n, ans = 0;
            while (lo <= hi) {
                int mid = lo + (hi - lo) / 2;
                if ((long) mid * mid <= n) {
                    ans = mid;          // mid works, try bigger
                    lo = mid + 1;
                } else {
                    hi = mid - 1;       // too big, go smaller
                }
            }
            return ans;
        }

        public static void main(String[] args) {
            System.out.println(sqrtFloor(16));
            System.out.println(sqrtFloor(27));
            System.out.println(sqrtFloor(1));
            System.out.println(sqrtFloor(2147395600));
        }
    }
