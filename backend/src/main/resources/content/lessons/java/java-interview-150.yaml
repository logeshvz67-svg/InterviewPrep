keyTakeaways:
  - "Answer every theory question with Concept -> Example -> Use case."
  - "Keep it to 30-60 seconds, then stop and let them follow up."
  - "Memorise key points and sentence starters, not whole answers."
  - "Practise out loud and record yourself; speaking is a skill."
  - "When unsure, reason honestly instead of bluffing."
