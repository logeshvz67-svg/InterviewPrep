keyTakeaways:
  - "java.time replaced Date/Calendar: immutable, thread-safe, months start at 1."
  - "LocalDate/LocalTime/LocalDateTime have no zone; Instant is an exact UTC moment; ZonedDateTime adds zone rules."
  - "Store timestamps in UTC, convert to the user's zone for display."
  - "Duration is time-based, Period is date-based; ChronoUnit.X.between counts units."
  - "Format with DateTimeFormatter; remember MM = month, mm = minutes."
