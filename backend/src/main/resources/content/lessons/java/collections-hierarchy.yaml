explanation: |
  ### Interfaces vs classes
  - An **interface** (like `List`) is a **set of rules**: "a List must have `get(index)`, `add`, `remove`...". You can't create an object of it directly.
  - A **class** (like `ArrayList`) is a **real implementation** of those rules.

  Good practice: declare the variable by the **interface**, create the object from a **class**:
  ```java
  List<String> names = new ArrayList<>();
  ```
  Later you can switch to `new LinkedList<>()` without changing the rest of the code. This is "programming to an interface".

  ### The top: Iterable and Collection
  - **`Iterable`**: anything you can loop over with a for-each loop. It gives an `iterator()`.
  - **`Collection`**: the root interface for groups of elements. Common methods: `add`, `remove`, `contains`, `size`, `isEmpty`, `clear`, `iterator`, `stream`.

  ### List: ordered, indexed, duplicates allowed
  Elements keep their **insertion order**, each has an **index** starting at 0, and duplicates are fine.
  | Class | Inside | Note |
  |---|---|---|
  | `ArrayList` | Resizable array | Default choice; fast `get(i)` |
  | `LinkedList` | Doubly linked list | Also a Deque |
  | `Vector` | Synchronized array | Legacy (old) |
  | `Stack` | Extends Vector | Legacy; use ArrayDeque |

  ### Set: no duplicates
  Adding an element that is already there does nothing (`add` returns `false`). Uniqueness is decided by `equals()` and `hashCode()` (or by comparison, for TreeSet).
  | Class | Order | Inside |
  |---|---|---|
  | `HashSet` | No guaranteed order | Hash table (a HashMap) |
  | `LinkedHashSet` | Insertion order | Hash table + linked list |
  | `TreeSet` | Sorted order | Red-black tree (`SortedSet`/`NavigableSet`) |

  ### Queue and Deque: waiting lines
  - **`Queue`**: usually **FIFO** (first in, first out). Methods `offer`, `poll`, `peek`.
  - **`Deque`** ("deck", double-ended queue): add/remove at **both** ends; works as a queue **or** a stack.
  - Classes: `ArrayDeque` (best general choice), `LinkedList`, `PriorityQueue` (removes the **smallest** first, not FIFO).

  ### Map: key → value (not a Collection!)
  A **Map** stores **pairs**: a unique **key** and its **value**. Keys are unique; values may repeat. Map does **not** extend Collection because its basic unit is a pair, not a single element, and methods like `add(E)` don't make sense for it. You can still view it as collections: `keySet()`, `values()`, `entrySet()`.
  | Class | Key order | Note |
  |---|---|---|
  | `HashMap` | No guaranteed order | Most used; one null key allowed |
  | `LinkedHashMap` | Insertion order | Can be used for LRU cache |
  | `TreeMap` | Sorted by key | `SortedMap`/`NavigableMap` |
  | `Hashtable` | No order | Legacy, synchronized, no nulls |

  ### Which one should I pick?
  | I need... | Use |
  |---|---|
  | Ordered items, access by position | `ArrayList` |
  | Only unique items | `HashSet` (`LinkedHashSet` to keep order, `TreeSet` for sorted) |
  | Look up a value by a key (counts, frequencies) | `HashMap` |
  | FIFO queue (BFS) or stack | `ArrayDeque` |
  | Always take the smallest/largest next | `PriorityQueue` |

  ### Collection vs Collections (classic trick question)
  - **`Collection`** (no s) is the **root interface**.
  - **`Collections`** (with s) is a **utility class** full of static helper methods: `Collections.sort(list)`, `Collections.reverse(list)`, `Collections.max(list)`, `Collections.unmodifiableList(list)`.
  Similarly, `Arrays` is a utility class for arrays.

  ### Legacy classes
  `Vector`, `Stack`, `Hashtable` and `Enumeration` existed before the framework (Java 1.0). They are synchronized (thread-safe but slower). Modern code prefers `ArrayList`, `ArrayDeque`, `HashMap`, and `ConcurrentHashMap` when thread safety is needed.
tinyCode:
  code: |
    import java.util.*;

    public class Toolbox {
        public static void main(String[] args) {
            List<String> coach = new ArrayList<>();
            coach.add("Ravi"); coach.add("Asha"); coach.add("Ravi");
            System.out.println("List: " + coach + " size=" + coach.size());

            Set<String> unique = new LinkedHashSet<>(coach);
            System.out.println("Set: " + unique);

            Set<String> sorted = new TreeSet<>(coach);
            System.out.println("TreeSet: " + sorted);

            Queue<String> line = new ArrayDeque<>(coach);
            System.out.println("Queue poll: " + line.poll());

            Map<String, Integer> count = new TreeMap<>();
            for (String name : coach) {
                count.put(name, count.getOrDefault(name, 0) + 1);
            }
            System.out.println("Map: " + count);
        }
    }
  walkthrough: |
    - The **List** keeps insertion order and the duplicate "Ravi": size is 3.
    - `new LinkedHashSet<>(coach)` copies the list into a **Set**: the duplicate disappears, insertion order is kept.
    - `TreeSet` keeps elements **sorted**: "Asha" comes before "Ravi".
    - `ArrayDeque` used as a **Queue**: `poll()` removes the **first** element added, "Ravi".
    - The **Map** counts how many times each name appears. `getOrDefault(name, 0)` returns 0 the first time. `TreeMap` prints keys in sorted order.

    Output:
    ```
    List: [Ravi, Asha, Ravi] size=3
    Set: [Ravi, Asha]
    TreeSet: [Asha, Ravi]
    Queue poll: Ravi
    Map: {Asha=1, Ravi=2}
    ```
tryIt:
  instructions: "Type this program. It adds the same numbers to a List, a Set and a Map, so you can see how each one treats duplicates and order."
  code: |
    import java.util.*;

    public class SameData {
        public static void main(String[] args) {
            int[] data = {5, 3, 5, 1, 3};
            List<Integer> list = new ArrayList<>();
            Set<Integer> set = new TreeSet<>();
            Map<Integer, Integer> freq = new LinkedHashMap<>();
            for (int x : data) {
                list.add(x);
                boolean added = set.add(x);
                System.out.println("set.add(" + x + ") -> " + added);
                freq.put(x, freq.getOrDefault(x, 0) + 1);
            }
            System.out.println("List: " + list);
            System.out.println("Set:  " + set);
            System.out.println("Freq: " + freq);
        }
    }
