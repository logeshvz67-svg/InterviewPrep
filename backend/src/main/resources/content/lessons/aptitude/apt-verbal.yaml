    ERROR-SPOTTING CHECKLIST (check in this order)

    1. Subject <-> verb   "One of the boys IS ..."
    2. Tense              "Yesterday I GO" -> "went"
    3. Article            a / an by SOUND: an hour, a university
    4. Preposition        good AT, depend ON, interested IN
    5. Extra word         "discuss ABOUT" -> "discuss"
    6. Pronoun            "between you and I" -> "me"

    PARA JUMBLE: find the chain
    [Opener] -> [It/This...] -> [Also/Moreover...] -> [However/So...]
     names the     points back      adds              turns or
     topic         to the topic     more              concludes
  caption: "Check sentences against a fixed list of common rules. In para jumbles, the opener names the topic and pronouns and connectors link the rest."
