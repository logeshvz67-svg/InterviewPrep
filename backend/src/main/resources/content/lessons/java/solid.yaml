companies: [ALL]
infosysRelevance: "Common design question: naming and explaining the five SOLID principles with a small Java example is good prep for SP and DSE technical rounds."
otherCompanies: "A common question in service and product companies, often as \"What is SOLID?\" or \"Explain any two principles with code\"."
why: |
  Code is written once but **changed many times**. **SOLID** is a set of five rules that make code easy to change without breaking other parts.

  - It is a very common interview question: "What does SOLID stand for? Explain with an example."
  - It explains *why* Spring Boot code looks the way it does: small services, interfaces everywhere, objects passed in through constructors (dependency injection).
  - It gives you words to talk about your project design: "I kept this class single-responsibility", "I depended on an interface".

  You don't need to memorise definitions word by word. You need **one simple sentence and one example for each letter**.
analogy: |
  Think of a well-run **wedding function**.

  - **S**: the cook cooks, the decorator decorates, the photographer takes photos. If the cook also does photos, a change in the menu can spoil the album. One job each.
  - **O**: to add a new sweet counter you **add** a new stall; you don't break down the existing kitchen.
  - **L**: if you booked "a photographer", any photographer sent must actually take photos. One who only draws sketches breaks the promise.
  - **I**: the guest list for the caterer doesn't need the priest's ritual timings. Give each person only the information they need.
  - **D**: the hall has standard **plug points**. Any decorator's lights fit. The hall depends on the *standard*, not on one particular decorator's plug.
