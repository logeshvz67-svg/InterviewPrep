explanation: |
  ### 1. Pace: slow down
  **Pace** is how fast you speak, measured in **words per minute (WPM)**. When nervous, most people speed up, and the listener gets lost.
  - The Communication Gym shows "comfortable" at roughly **100-165 WPM**; aim for about **110-160**.
  - Trick: speak as if you are explaining to someone on a slightly bad phone line.
  - Slower speech also hides grammar mistakes, because you have time to choose words.

  ### 2. Fillers: replace them with silence
  **Fillers** are words that carry no meaning: *umm, uh, like, basically, actually, you know, I mean, so yeah*.
  - A few are normal. Many make you sound unsure.
  - The fix is **not** to "try harder". The fix is to **replace the filler with a short pause**.
  - Practise: record a 60-second answer in the Gym, look at the filler count, record again with pauses. Watch the number fall.

  ### 3. Pauses are powerful
  A **pause** of one or two seconds feels long to you but normal to the listener.
  - **Before** answering: "That's a good question." *(pause)* Then answer.
  - **Between** points: it shows the listener where one idea ends.
  - **After** the key sentence: it lets the important part land.

  ### 4. Signposts: give your answer a map
  **Signposts** are small phrases that tell the listener where you are in the answer.
  | Purpose | Signpost |
  |---|---|
  | Preview | "There are two main differences." |
  | Order | "First... Second... Finally..." |
  | Example | "For example..." |
  | Contrast | "On the other hand..." |
  | Summary | "So, in short..." |

  If you lose your way in the middle, a signpost saves you: "So, the second point is..."

  ### 5. Short sentences
  Long sentences with many "and... and... which... so..." are hard to follow and easy to break. Use **one idea per sentence**. Simple English such as "It is fast. It uses more memory." is perfectly professional.

  ### 6. Listening and clarifying
  Half of communication is listening.
  - Let the interviewer **finish** the question. Do not start answering in the middle.
  - If unclear, **clarify**: "Just to confirm, are you asking about the difference between HashMap and Hashtable?"
  - If you did not hear: "Sorry, could you please repeat that?" This is completely normal.
  - **Paraphrasing** (repeating the question in your own words) also buys you thinking time.

  ### 7. Body language on video calls
  | Do | Avoid |
  |---|---|
  | Camera at eye level, face well lit (light in front of you, not behind) | Laptop on your lap looking up at your nose |
  | Look at the **camera** when speaking, at the screen when listening | Looking at your notes or phone constantly |
  | Plain background, quiet room, phone on silent | Fan noise, TV, people walking behind |
  | Sit straight, small smile, nod while listening | Slouching, touching your face, typing while they talk |
  | Test mic, camera and internet 30 minutes before | Joining late because of an update or a dead mouse battery |

  ### 8. Practising with weak spoken English
  - Every day, speak **one answer aloud** in the Gym (5 minutes is enough).
  - Read good answers aloud, then say them **without reading**.
  - Learn **phrases**, not just words: "That's a good question", "Let me think for a moment", "In short...".
  - Your accent is fine. Clarity matters, not accent.
tinyCode:
  code: |
    SIGNPOST SCRIPT (for any "difference between X and Y")

    "That's a good question."              (pause)
    "There are two main differences."      (pause)
    "First, ________."                     (pause)
    "Second, ________."                    (pause)
    "For example, ________."               (pause)
    "So, in short, ________."              STOP.
  walkthrough: |
    - **"That's a good question."** plus a pause buys two seconds of thinking time politely.
    - **"There are two main differences."** previews the answer, so the listener knows what is coming.
    - **"First... Second..."** keeps you on track. If you lose your way, you know where to continue.
    - **"For example..."** makes it concrete.
    - **"So, in short..."** summarises in one line. Then you **stop**. Stopping is a skill: do not keep adding "and also, basically...".
    - The `(pause)` marks are part of the script. Practise them as seriously as the words.
tryIt:
  instructions: "Type this filler-to-pause practice sheet. Then record each 'better' line in the Communication Gym and check the filler count."
  code: |
    FILLER -> PAUSE PRACTICE

    WEAK:   "Umm, basically, like, a thread is, you know,
             a small, umm, part of a program."
    BETTER: "A thread is a small unit of a program.  (pause)
             It runs at the same time as other threads."

    WEAK:   "So, actually, I mean, I used Spring Boot, so yeah."
    BETTER: "I used Spring Boot.  (pause)
             It made building the REST API fast."

    MY RULE: When I want to say "umm", I stay silent instead.
