why: |
  Many objects hold a **resource**: something outside Java's memory that must be given back, like an open file, a database connection or a network socket. If you forget to **close** it, you get a **resource leak**: the operating system runs out of file handles, or the database runs out of connections, and the app slowly dies.

  Before Java 7, closing correctly needed a long, ugly `finally` block. **try-with-resources** (Java 7+) closes things **automatically** and correctly.

  Interviewers ask:
  - "What is try-with-resources and why is it better than finally?"
  - "In what **order** are resources closed?"
  - "What is a **suppressed exception**?"

  These are easy marks once you see the rules once.
analogy: |
  Think of **borrowing books from a library with a smart bag**.

  - You put books in the bag in the order you take them: Book A, then Book B.
  - When you leave (the try block ends), the smart bag **returns all books automatically**, even if you slipped and fell on the way out (an exception).
  - It returns them in **reverse order**, **B first, then A**, like unpacking a stack: the last one in is the first one out.
  - If you fell (main problem) **and** the return counter was also broken (a second problem while closing), the librarian writes down the fall as the **main complaint** and attaches the broken counter as a **side note**. That side note is a **suppressed exception**.
visual:
  diagram: |
    try (A a = new A();      // opened 1st
         B b = new B()) {    // opened 2nd
        work();              // may throw X
    } catch (Exception e) {
        handle(e);
    } finally {
        last();
    }

    Order of events:
      open A -> open B -> work() -> close B -> close A -> catch -> finally
                                    \____________________/
                                      reverse order, BEFORE catch

    If work() throws X and close() of B throws Y:
      e  = X                    (main exception is kept)
      e.getSuppressed() = [Y]   (close problem is attached, not lost)
  caption: "Resources open top to bottom and close bottom to top, automatically, before catch and finally run. A close failure during an exception is attached as a suppressed exception."
