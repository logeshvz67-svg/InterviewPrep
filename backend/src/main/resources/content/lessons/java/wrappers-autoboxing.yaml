    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              Integer big = 500;
              int prim = 500;
              Long l = 500L;
              System.out.println(big == prim);
              System.out.println(l.equals(500L));
              System.out.println(l.equals(big));
          }
      }
    options: ["true\ntrue\nfalse", "false\ntrue\nfalse", "true\ntrue\ntrue", "false\nfalse\nfalse"]
    answer: 0
    explanation: "big == prim has a primitive on one side, so big is unboxed and values are compared: true. l.equals(500L) boxes to a Long with the same value: true. l.equals(big) compares a Long with an Integer, different classes: false."
  - id: q7
