  prompt: "Explain message queues and idempotency to a friend using the restaurant order rail."
  rubric:
    - "I explained producer (waiter) and consumer (cook) with the queue as the rail"
    - "I gave at least two benefits: fast replies, spike absorption, decoupling, retries"
