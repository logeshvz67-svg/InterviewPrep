  modelAnswer: |
    In my project, controllers and services don't use try/catch to build error responses. They just throw, for example ApiException.notFound("Topic") or ApiException.conflict("Email already registered"). One class, GlobalExceptionHandler, is marked @RestControllerAdvice, and it has @ExceptionHandler methods for each exception type. Spring picks the most specific one. Each returns a ProblemDetail, the standard error JSON with status, title, detail and the request path, so the frontend always reads errors the same way. Validation errors give 400 with a message per field, missing things 404, duplicates 409. Anything unexpected is logged on the server and the client only gets a polite 500 message, so no secrets leak.
flashcards:
  - front: "@RestControllerAdvice ="
    back: "@ControllerAdvice + @ResponseBody: global @ExceptionHandler methods for all controllers, results written as JSON."
  - front: "Which @ExceptionHandler runs if several match?"
    back: "The one with the closest (most specific) exception type. Method order doesn't matter."
  - front: "ProblemDetail fields"
    back: "type, title, status, detail, instance (+ custom properties). Content-Type application/problem+json. RFC 7807/9457."
  - front: "Catch-all Exception handler trap"
    back: "It also catches Spring's 400/404/405 exceptions and turns them into 500 unless you add specific handlers."
  - front: "Why doesn't advice handle a missing JWT?"
    back: "Security filters run before controllers; use authenticationEntryPoint / accessDeniedHandler."
keyTakeaways:
  - "Throw exceptions in services; convert them to responses in one @RestControllerAdvice class."
  - "The most specific @ExceptionHandler wins; keep a catch-all only as the last resort."
  - "Return ProblemDetail for a standard, consistent error JSON (plus an errors map for validation)."
  - "Use 4xx for client mistakes (400, 404, 405, 409) and 500 only for real bugs, without leaking internals."
  - "Security filter errors happen before controllers; handle them in the security configuration."
