  question: A can finish a work in 10 days and B can finish it in 15 days. In how many days can they finish it working together?
  options: [5 days, 12.5 days, 6 days, 8 days]
  answer: 2
  explanation: In one day A does 1/10 and B does 1/15. Together = 1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6. So together they
    need 6 days.
