title: "Design a chat and notification system"
version: 1
estimatedMinutes: 50
rebuild: false
patternCode: null
companies: [INFOSYS_SP, PRODUCT]
infosysRelevance: "A strong second case study for SP-level design practice: real-time connections, message storage and fan-out combine many earlier lessons."
otherCompanies: "'Design WhatsApp' and 'Design a notification service' are very common product-company practice questions."
why: |
  "Design WhatsApp" or "Design a notification system" is the natural next case study after the URL shortener. It adds **real-time** communication, which brings new questions:
  - How does the server **push** a message to a phone instantly? (polling vs long polling vs **WebSockets**)
  - Where do messages live, and how do we deliver to someone who is **offline**?
  - How does one message reach **all 200 members** of a family group? (**fan-out**)
  - How do the **grey and blue ticks** work? (**delivery status**)
  - How do notifications (push, SMS, email) get sent reliably for things like "Your order is out for delivery" or "Wicket! Kohli out"?

  You'll use almost every earlier lesson here: load balancing, caching, databases (wide-column stores), queues and idempotency.
analogy: |
  Think of the **old post office vs a telephone call**.

  - **Polling** is like going to the post office every 5 minutes asking "Any letter for me?" Most trips are wasted.
  - **Long polling** is like waiting *at* the counter until a letter arrives (or the counter closes after a while), then going back to wait again.
  - **WebSocket** is like a **phone call that stays connected**. Either side can speak any time, instantly. That's what chat apps use.

  For offline users, think of the **postman leaving a "missed delivery" slip**: the message waits at the post office (the **message store**), a **push notification** (the slip) tells you something arrived, and when you come online, you collect everything (**sync**).

  **Fan-out** is like a wedding invitation: one invitation is designed, but a copy is delivered to every guest.
