infosysRelevance: "Core for SP and DSE preparation: sorting complexities and stability are common theory questions, and binary search (including 'binary search on the answer') unlocks many optimisation-style coding problems."
otherCompanies: "Bubble/insertion sort and plain binary search are common basic questions in TCS-style rounds; product companies expect lower bound, rotated array search and binary search on the answer."
why: |
  **Sorting** means arranging items in order (smallest to largest, A to Z). Many problems become easy once the data is sorted: duplicates sit next to each other, two pointers work, and you can binary search.

  **Binary search** finds an item in a **sorted** array by cutting the search area in half again and again. For 1 million items, a normal scan may need 1,000,000 checks; binary search needs about **20**. That is the difference between **O(n)** and **O(log n)**.

  Interviewers ask about this in two ways:
  - **Theory**: "Which sort is stable? What is quick sort's worst case? What does `Arrays.sort` use?"
  - **Coding**: binary search variations: first occurrence, search in a rotated array, and "binary search on the answer" (find the smallest speed, capacity or value that works).

  The binary search **template** in this lesson is something you will reuse for years.
analogy: |
  Think of finding the word "mango" in a **paper dictionary**.

  You don't read from page 1. You open somewhere in the **middle**, see "lion", and know "mango" comes **after** it, so the whole first half is thrown away. You open the middle of the remaining half, and so on. Each look **halves** the pages left. A 1000-page dictionary needs only about 10 looks.

  This only works because the dictionary is **sorted**. A shuffled pile of pages gives you no clue which half to throw away. That is why sorting and binary search are taught together.
