    back: "Outer o = new Outer(); Outer.Inner i = o.new Inner();"
  - front: "Create a static nested class"
    back: "Outer.Nested n = new Outer.Nested();  (no outer object needed)"
  - front: "Inner class: refer to the outer object's field x"
    back: "Outer.this.x"
  - front: "Effectively final"
    back: "A local variable never reassigned after initialisation; required for local/anonymous classes and lambdas to use it."
  - front: "Can an anonymous class have a constructor?"
    back: "No, it has no name. It extends one class or implements one interface."
keyTakeaways:
  - "Static nested: no outer object needed; uses only static outer members directly."
  - "Inner: tied to an outer object; uses all outer members; created with outer.new Inner()."
  - "Local classes live inside a method; anonymous classes have no name and are one-time use."
  - "Local and anonymous classes (and lambdas) can only capture effectively final local variables."
  - "Prefer static nested unless you really need the outer object; prefer lambdas for one-method interfaces."
