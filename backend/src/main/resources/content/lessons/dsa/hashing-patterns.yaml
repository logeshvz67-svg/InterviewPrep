infosysRelevance: "Core for SP and DSE coding rounds: frequency counting, duplicate detection and two-sum style lookups appear inside a huge number of problems."
otherCompanies: "Very common everywhere: character frequency and first non-repeating character in TCS-style questions; two-sum and group anagrams in product-company interviews."
why: |
  The single most useful trick in coding rounds is: **"Can I remember what I've already seen, so I don't search again?"** A `HashMap` or `HashSet` answers "have I seen X?" or "how many X?" in **O(1) on average**.

  That one idea turns many O(n^2) brute-force solutions (compare every pair) into **O(n)**:
  - count frequencies of characters or numbers,
  - find duplicates or the first repeating / non-repeating element,
  - two-sum (find two numbers that add to a target) in an unsorted array,
  - group words that are anagrams.

  You'll also learn **when hashing beats sorting** and when it doesn't, which is a common follow-up question.
analogy: |
  Think of the **pigeonhole mailboxes** in a hostel office, one per room number.

  - When a letter comes for room 214, the warden doesn't search through a pile. He **computes** where it goes (box 214) and drops it there: instant.
  - To check "is there a letter for room 214?", he looks in **one box**, not the whole pile.

  A hash table works the same way: a **hash function** turns a key (a word, a number) into a box number (a **bucket**), so storing and finding are both instant. Sometimes two keys land in the same box (a **collision**); then the warden checks the few letters inside that box.
