explanation: |
  ### What is encapsulation?
  **Encapsulation** means **wrapping data (fields) and the code that works on that data (methods) together in one class**, and **hiding the data** from direct outside access. Outsiders can only use the methods you choose to make public.

  The recipe:
  1. Make fields **`private`**.
  2. Provide **public getter** methods to read them (if needed).
  3. Provide **public setter** methods to change them, with **validation** (if needed).

  ```java
  class Account {
      private double balance;               // nobody outside can touch this

      public double getBalance() {          // getter: read access
          return balance;
      }

      public void deposit(double amount) {  // controlled change
          if (amount <= 0) {
              System.out.println("Invalid amount");
              return;
          }
          balance += amount;
      }
  }
  ```
  Now `acc.balance = -5000;` doesn't compile. Bad data can't sneak in.

  ### Why bother?
  - **Data safety**: rules (validation) are always applied.
  - **Control**: make something read-only (getter, no setter) or write-only.
  - **Flexibility**: you can change the inside (e.g. store balance in paise as a `long`) without breaking code that uses the class.
  - **Easier testing and debugging**: only a few methods can change the data.

  A class whose fields are all private with getters/setters is often called a **POJO** (Plain Old Java Object) or **JavaBean**.

  ### Encapsulation vs abstraction
  | Encapsulation | Abstraction |
  |---|---|
  | **Hides data** (the *how it's stored*) | **Hides complexity** (the *how it works*) |
  | Done with `private` + getters/setters | Done with abstract classes and interfaces |
  | Protects the object's state | Simplifies what the user sees |
  | Like a locked vault | Like a car dashboard |

  ### The four access modifiers
  An **access modifier** is a keyword that controls who can see a class, field, method or constructor.

  | Modifier | Same class | Same package | Subclass (other package) | Everywhere |
  |---|---|---|---|---|
  | `private` | Yes | No | No | No |
  | *(default)*, no keyword | Yes | Yes | No | No |
  | `protected` | Yes | Yes | Yes (through inheritance) | No |
  | `public` | Yes | Yes | Yes | Yes |

  Memory trick: **private < default < protected < public**, from most hidden to most open.

  Details people get wrong:
  - **default** is also called **package-private**. There is no keyword `default` for access (the `default` keyword in interfaces and switch means something else).
  - **protected** includes the whole package **plus** subclasses in other packages. In another package, the child can use the protected member through **its own object** (inheritance), not through a separately created parent object.
  - A **top-level class** can be only `public` or default. It can't be `private` or `protected` (nested classes can).
  - A `.java` file can have **at most one public top-level class**, and the file name must match it.
  - Making a **constructor private** stops others from using `new` (used in Singleton and utility classes like `Math`).

  ### Packages
  A **package** is a folder-like group of related classes, e.g. `java.util` or `com.codequest.bank`. It:
  - organises code (like folders),
  - avoids name clashes (`java.util.Date` vs `java.sql.Date`),
  - works with default and protected access to control visibility.

  ```java
  package com.codequest.bank;     // first line of the file
  import java.util.ArrayList;      // use a class from another package
  import java.util.*;              // all classes in java.util (not sub-packages)
  ```
  - `package` must be the **first statement** in the file. The folder path must match: `com/codequest/bank/Account.java`.
  - `java.lang` (String, Math, System) is **imported automatically**.
  - Package names are lowercase, usually your company domain reversed.
  - **static import** lets you use static members without the class name: `import static java.lang.Math.max;` then `max(3, 7)`.
tinyCode:
  code: |
    public class Main {
        public static void main(String[] args) {
            Account acc = new Account("Priya");
            acc.deposit(5000);
            acc.deposit(-200);
            acc.withdraw(8000);
            acc.withdraw(1500);
            System.out.println(acc.getOwner() + " has " + acc.getBalance());
        }
    }

    class Account {
        private final String owner;
        private double balance;

        Account(String owner) { this.owner = owner; }

        public String getOwner() { return owner; }
        public double getBalance() { return balance; }

        public void deposit(double amount) {
            if (amount <= 0) { System.out.println("Rejected deposit: " + amount); return; }
            balance += amount;
        }

        public void withdraw(double amount) {
            if (amount > balance) { System.out.println("Insufficient funds"); return; }
            balance -= amount;
        }
    }
  walkthrough: |
    - `owner` and `balance` are **private**: code in `Main` can't read or change them directly.
    - `owner` is also `final` with only a getter, so it's **read-only** after creation.
    - `deposit` and `withdraw` are the only ways to change the balance, and both **validate** first.
    - `deposit(-200)` is rejected, `withdraw(8000)` is refused because the balance is only 5000, `withdraw(1500)` works.
    - If you wrote `acc.balance = 1000000;` in `main`, the compiler would say: *balance has private access in Account*.

    Output:
    ```
    Rejected deposit: -200.0
    Insufficient funds
    Priya has 3500.0
    ```
