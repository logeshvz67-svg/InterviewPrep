explanation: |
  ### What is polymorphism?
  **Polymorphism** means "many forms": one name or one variable that behaves differently depending on the situation. Java has two kinds.

  | | Compile-time polymorphism | Runtime polymorphism |
  |---|---|---|
  | Achieved by | Method **overloading** | Method **overriding** |
  | Decided by | The compiler, using argument types | The JVM, using the real object |
  | Also called | Static binding / early binding | Dynamic binding / late binding / dynamic method dispatch |
  | Needs inheritance? | No | Yes |

  **Binding** just means "connecting a method call to the actual method body".

  ### Runtime polymorphism: the key rule
  ```java
  Animal a = new Dog();
  ```
  There are **two types** here:
  - The **reference type** (the variable's declared type): `Animal`.
  - The **object type** (what `new` really built): `Dog`.

  **The golden rule:**
  1. The **compiler** checks the reference type: "Does `Animal` have this method?" If not, compile error.
  2. The **JVM** looks at the object type at run time and runs the **overridden** version from `Dog`.

  ```java
  a.sound();   // Dog's sound(): runtime polymorphism
  a.fetch();   // COMPILE ERROR: Animal has no fetch()
  ```

  ### What is NOT polymorphic
  Only **overridden instance methods** are chosen by the object. These are chosen by the **reference type**:
  - **Fields** (variables): `a.name` uses Animal's field if both classes declare `name`.
  - **static methods** (they are hidden, not overridden).
  - **private** and **final** methods (they can't be overridden).

  ### Upcasting
  **Upcasting** = treating a child object as its parent type.
  ```java
  Dog d = new Dog();
  Animal a = d;          // upcast, automatic
  ```
  It's **always safe** (every Dog is an Animal), so Java does it automatically. This is why you can write one method `void feed(Animal a)` and pass a Dog, a Cat or a Cow.

  ### Downcasting
  **Downcasting** = converting a parent reference back to a child type, so you can use child-only methods.
  ```java
  Animal a = new Dog();
  Dog d = (Dog) a;       // downcast, needs explicit (Dog)
  d.fetch();             // now allowed
  ```
  It's **not always safe**, so Java makes you write the cast. If the object is not really a Dog, the JVM throws a **`ClassCastException`** at run time:
  ```java
  Animal a = new Cat();
  Dog d = (Dog) a;       // compiles, but ClassCastException at run time
  ```
  If the two types are not related at all (`String s = (String) new Dog();`), the compiler already rejects it: "incompatible types".

  ### Safe downcasting with `instanceof`
  `x instanceof Dog` returns `true` if the object `x` points to is a Dog (or a subclass of Dog). It returns `false` for `null`.

  **Old style (before Java 16):**
  ```java
  if (a instanceof Dog) {
      Dog d = (Dog) a;
      d.fetch();
  }
  ```

  **Pattern matching for instanceof (Java 16+):** test and cast in one step.
  ```java
  if (a instanceof Dog d) {   // if true, d is already a Dog
      d.fetch();
  }
  ```
  The new variable `d` (called a **pattern variable**) exists only where the test is known to be true.

  ### Why it matters
  Polymorphism lets you write code against a general type and add new types later without changing old code:
  ```java
  Animal[] zoo = { new Dog(), new Cat(), new Cow() };
  for (Animal x : zoo) x.sound();   // each animal makes its own sound
  ```
tinyCode:
  code: |
    public class Main {
        public static void main(String[] args) {
            Animal[] zoo = { new Dog(), new Cat() };
            for (Animal a : zoo) {
                a.sound();
                if (a instanceof Dog d) {
                    d.fetch();
                }
            }
        }
    }

    class Animal {
        void sound() { System.out.println("Some sound"); }
    }

    class Dog extends Animal {
        @Override
        void sound() { System.out.println("Woof"); }
        void fetch() { System.out.println("Dog fetches the ball"); }
    }

    class Cat extends Animal {
        @Override
        void sound() { System.out.println("Meow"); }
    }
  walkthrough: |
    - `Animal[] zoo = { new Dog(), new Cat() };` stores a Dog and a Cat in Animal slots. That's **upcasting**, done automatically.
    - In the loop, `a` is always declared as `Animal`, but `a.sound()` runs the **real object's** version: Woof, then Meow. That's **runtime polymorphism**.
    - `a.fetch()` would not compile, because `Animal` has no `fetch()`.
    - `a instanceof Dog d` checks "is this object really a Dog?" and, if yes, gives us `d` already cast to Dog. Then `d.fetch()` is allowed. For the Cat the test is false, so nothing happens.

    Output:
    ```
    Woof
    Dog fetches the ball
    Meow
    ```
