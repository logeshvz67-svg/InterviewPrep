  instructions: "Type this BST validator that passes an allowed (min, max) range down the tree. The 'bad' tree has 4 hidden in the right subtree of 5. Then change 4 to 6 and run again: it should print true twice."
  code: |
    public class ValidateBST {
        static class Node {
            int val; Node left, right;
            Node(int val, Node left, Node right) { this.val = val; this.left = left; this.right = right; }
        }

        static boolean isBST(Node n, long min, long max) {
            if (n == null) return true;
            if (n.val <= min || n.val >= max) return false;
            return isBST(n.left, min, n.val) && isBST(n.right, n.val, max);
        }

        public static void main(String[] args) {
            Node good = new Node(5, new Node(3, null, null), new Node(8, null, null));
            //      5
            //     / \
            //    3   8
            //       /
            //      4      <- 4 is smaller than 5 but sits in the right subtree
            Node bad = new Node(5, new Node(3, null, null), new Node(8, new Node(4, null, null), null));
            System.out.println(isBST(good, Long.MIN_VALUE, Long.MAX_VALUE));
            System.out.println(isBST(bad, Long.MIN_VALUE, Long.MAX_VALUE));
        }
    }
