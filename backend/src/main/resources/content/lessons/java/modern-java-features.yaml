infosysRelevance: "Shows you are up to date: a good answer to 'what's new after Java 8?' in SP rounds, and records/switch expressions make coding answers shorter."
otherCompanies: "Product companies often use Java 17 or 21 in production and expect you to read records, sealed types and pattern matching comfortably."
why: |
  Many students stop learning at Java 8. But companies now run **Java 17 and Java 21** (both **LTS**, Long-Term Support versions that get updates for years). Java 21 is what this app's own backend uses.

  Newer Java removes a lot of boring code:
  - a 40-line data class becomes a **1-line record**,
  - a `switch` full of `break`s becomes a clean **switch expression**,
  - messy `"..." + "\n" +` strings become readable **text blocks**,
  - `if (o instanceof String) { String s = (String) o; ... }` loses its cast.

  When an interviewer asks **"What features came after Java 8?"**, a confident answer with small examples stands out. It shows you keep learning, which is exactly what a Specialist Programmer role wants.
analogy: |
  Think of Java versions like **phone software updates**.

  Java 8 was a huge update (lambdas, streams), like getting a smartphone for the first time. The later updates are smaller **quality-of-life features**: dark mode, quick replies, auto-fill passwords. Each one saves you a few taps every day.

  - `var` is **auto-fill**: Java fills in the type it can already see.
  - **Records** are a **ready-made contact card**: name, number, done; no need to design the card yourself.
  - **Switch expressions** are **quick replies**: pick a case, get an answer, no extra steps.
  - **Sealed classes** are a **family WhatsApp group with admin-only adds**: only the members the admin approves can join.
  - **Text blocks** let you **paste a paragraph** exactly as it looks.
