    prompt: "Iterating over a PriorityQueue with a for-each loop visits the elements in sorted order."
    options: ["True", "False"]
    answer: 1
    explanation: "False. The iterator walks the internal heap array, which is only partly ordered. Only repeated poll() gives sorted order."
