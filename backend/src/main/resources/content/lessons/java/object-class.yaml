infosysRelevance: "Key for collections questions in SP and DSE rounds: the equals/hashCode contract explains how HashMap and HashSet really work."
otherCompanies: "equals vs ==, the hashCode contract and shallow vs deep copy are common at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  Every class in Java secretly extends **`java.lang.Object`**. So every object you ever create has methods like `equals()`, `hashCode()`, `toString()` and `clone()`.

  Interviewers love this topic because it connects OOP with collections:
  - "What's the difference between `==` and `equals()`?"
  - "What is the **equals and hashCode contract**? What breaks if you override only `equals()`?"
  - "Why does my object print as `Student@1b6d3586`?"
  - "What's the difference between a **shallow copy** and a **deep copy**?"

  If you understand this lesson, the `HashMap` lesson later becomes much easier.
analogy: |
  Think of a **college hostel**.

  - `==` asks: "Is this the **same person**?" (same room, same body).
  - `equals()` asks: "Do these two people have the **same details** that matter?" (same roll number). Two ID cards can be separate pieces of plastic but describe the same student.
  - `hashCode()` is the **hostel block number**. The warden first goes to the right block (fast), then checks names inside that block (equals). If two equal students were given **different block numbers**, the warden would search the wrong block and say "not found". That is exactly the HashMap bug when `hashCode()` isn't overridden.
  - `clone()` is a **photocopy**. A **shallow** photocopy of a file folder copies the cover page but the **pages inside are still shared** with the original. A **deep** copy photocopies every page too.
