  explanation: |
    The list keeps all 4 elements. The LinkedHashSet removes the duplicate "b" and keeps first-insertion order: b, a, c. The TreeSet sorts them: a, b, c. In the map, putting key "x" again **replaces** its value (1 becomes 3) but does **not** move it; LinkedHashMap keeps the original insertion position.
commonMistakes:
  - "Saying Map extends Collection. It doesn't; Map is a separate hierarchy of key-value pairs."
  - "Confusing Collection (root interface) with Collections (utility class with static methods)."
  - "Expecting HashSet or HashMap to keep insertion order. Use LinkedHashSet / LinkedHashMap for that."
  - "Writing ArrayList<String> list = new ArrayList<>() everywhere instead of declaring by the interface (List<String>)."
  - "Thinking PriorityQueue is FIFO. It always removes the smallest (highest-priority) element first."
  - "Using legacy Vector, Stack or Hashtable in new code without a reason."
interviewBox:
  why: "Why interviewers ask this: the hierarchy shows you can choose the right data structure, which is the core skill behind every coding problem."
  questions:
    - q: "Explain the Java Collections hierarchy."
      a: "At the top is Iterable, then Collection. Collection has three main child interfaces: List for ordered, indexed elements with duplicates; Set for unique elements; and Queue for waiting lines, with Deque for both ends. Main classes are ArrayList and LinkedList for List, HashSet, LinkedHashSet and TreeSet for Set, and ArrayDeque and PriorityQueue for queues. Map is a separate hierarchy for key-value pairs, with HashMap, LinkedHashMap and TreeMap."
    - q: "Why doesn't Map extend Collection?"
      a: "Because a Map stores key-value pairs, not single elements. Collection methods like add(element) don't fit. Instead, Map gives collection views: keySet(), values() and entrySet()."
    - q: "What is the difference between Collection and Collections?"
      a: "Collection is the root interface of the framework. Collections is a utility class with static methods like sort, reverse, max, shuffle and unmodifiableList."
    - q: "List vs Set vs Map in one line each?"
      a: "List: ordered, index-based, allows duplicates. Set: no duplicates. Map: unique keys mapped to values."
quiz:
  - id: q1
    type: MCQ
    prompt: "Which of these does NOT extend the Collection interface?"
    code: null
    options: ["List", "Set", "Queue", "Map"]
    answer: 3
    explanation: "Map is a separate hierarchy because it stores key-value pairs. List, Set and Queue all extend Collection."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      import java.util.*;

      public class Main {
          public static void main(String[] args) {
              Set<Integer> s = new TreeSet<>();
              System.out.print(s.add(30) + " ");
              System.out.print(s.add(10) + " ");
              System.out.print(s.add(30) + " ");
              System.out.println(s);
          }
      }
    options: ["true true true [30, 10, 30]", "true true false [10, 30]", "true true false [30, 10]", "true true true [10, 30]"]
    answer: 1
    explanation: "Adding 30 again returns false because a Set keeps no duplicates. TreeSet sorts, so it prints [10, 30]. [30, 10] would be insertion order, which is LinkedHashSet behaviour."
