why: |
  You may think: "My English is weak, so I will fail." That is **not true**.

  Interviewers do not expect perfect grammar or a fancy accent. They expect to **understand you**. Clear communication is mostly about **habits**, not vocabulary:
  - speaking at a comfortable **pace**,
  - using fewer **filler words** ("basically", "like", "umm"),
  - using short **pauses** instead of noise,
  - **signposting** your answer ("First... Second... Finally..."),
  - **listening** fully and **clarifying** when unsure,
  - looking calm and present on a **video call**.

  These habits can improve a lot in a few weeks of daily practice. The Communication Gym measures them for you.
analogy: |
  Think of a **good railway station announcement**.

  - It is **slow and clear**: "Train number one-two-six-two-seven... Karnataka Express..."
  - It has **pauses** between pieces of information.
  - It has **structure**: train number, name, platform, time. Always in the same order.
  - It does **not** say "basically, like, umm, the train is, you know, coming".

  The announcer may not use difficult words, but every passenger understands. That is your goal in an interview.
