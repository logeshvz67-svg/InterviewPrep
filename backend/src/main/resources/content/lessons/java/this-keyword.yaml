explanation: |
  ### What is `this`?
  `this` is a **reference** (an arrow) to the **current object**: the object whose constructor or method is running right now.
  - In `s1.show()`, inside `show()`, `this` points to `s1`'s object.
  - In `s2.show()`, `this` points to `s2`'s object.

  Same method code, different `this` each time. That's how one method can work for every object.

  ### Use 1: fixing name clashes (shadowing)
  **Shadowing** means a local variable or parameter has the **same name as a field**, so it "hides" the field. Inside the method, the plain name refers to the **nearest** one: the parameter.
  ```java
  class Student {
      String name;
      Student(String name) {
          name = name;        // BUG: parameter = parameter. Field stays null!
      }
  }
  ```
  ```java
  Student(String name) {
      this.name = name;       // field = parameter. Correct.
  }
  ```
  If the names are different (`Student(String n) { name = n; }`), `this` is optional, because there's no clash.

  ### Use 2: calling another constructor, `this(...)`
  As you saw in the constructors lesson, `this(...)` calls another constructor of the **same class**. It must be the first statement.
  ```java
  Student() { this("Unknown"); }
  ```
  Don't mix them up: **`this`** is a reference to the object; **`this()`** is a constructor call.

  ### Use 3: calling the current object's methods
  `this.show()` and `show()` are the same inside an instance method. Writing `this.` just makes it explicit.

  ### Use 4: passing the current object to another method
  ```java
  class Order {
      void place(Shop shop) {
          shop.accept(this);   // "here, take ME"
      }
  }
  ```

  ### Use 5: returning the current object (method chaining)
  If a method returns `this`, you can call the next method on the result in the same line. This is called **method chaining**, and it's how `StringBuilder.append` and the **Builder pattern** work.
  ```java
  class Pizza {
      String size; boolean cheese;
      Pizza size(String s)  { this.size = s;  return this; }
      Pizza cheese()        { this.cheese = true; return this; }
  }
  Pizza p = new Pizza().size("large").cheese();
  ```

  ### Where you CAN'T use `this`
  **Static** methods belong to the class, not to any object (next lesson). So inside a `static` method (like `main`), there is **no current object**, and `this` causes a compile error:
  ```java
  public static void main(String[] args) {
      System.out.println(this);   // compile error: non-static variable this
                                  // cannot be referenced from a static context
  }
  ```
  Also, you cannot assign to it: `this = other;` is a compile error. `this` always means the current object.

  ### Summary
  | Use | Example |
  |---|---|
  | Refer to a field hidden by a parameter | `this.name = name;` |
  | Call another constructor of the same class | `this("Unknown");` (first line) |
  | Call a method on the current object | `this.show();` |
  | Pass the current object | `shop.accept(this);` |
  | Return the current object (chaining) | `return this;` |
  | Not allowed | inside static methods; `this = ...` |
tinyCode:
  code: |
    public class ThisDemo {
        static class Student {
            String name;
            int marks;

            Student(String name, int marks) {
                this.name = name;
                this.marks = marks;
            }

            Student addBonus(int bonus) {
                this.marks = this.marks + bonus;
                return this;
            }

            boolean isSameAs(Student other) {
                return this == other;
            }

            void show() {
                System.out.println(name + " " + marks);
            }
        }

        public static void main(String[] args) {
            Student s1 = new Student("Ravi", 70);
            Student s2 = new Student("Priya", 80);

            s1.addBonus(5).addBonus(5).show();
            s2.show();

            System.out.println(s1.isSameAs(s1) + " " + s1.isSameAs(s2));
        }
    }
  walkthrough: |
    - The constructor uses `this.name = name` so the **field** gets the parameter's value.
    - `addBonus` changes the current object's marks and then `return this;`, giving back the same object, so we can chain: `s1.addBonus(5).addBonus(5).show()` adds 10 in total and prints `Ravi 80`.
    - `s2.show()` runs the same `show` code, but now the current object is `s2`: `Priya 80`.
    - `isSameAs(other)` compares `this` with `other` using `==`. `s1.isSameAs(s1)` is `true`; `s1.isSameAs(s2)` is `false`.

    Output:
    ```
    Ravi 80
    Priya 80
    true false
    ```
tryIt:
