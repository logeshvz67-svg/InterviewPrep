explanation: |
  ### Binary in one minute
  **Binary** is base 2: each position is a power of two, counted from the right starting at **bit 0**.
  `13 = 8 + 4 + 1 = 1101`. In Java: `Integer.toBinaryString(13)` gives `"1101"`, and `0b1101` is a binary literal equal to 13.

  Java `int` is **32 bits** and **signed**. Negative numbers use **two's complement**: to get `-x`, flip all bits of x and add 1. The leftmost bit (bit 31) is the **sign bit**: 1 means negative. That's why `-1` is 32 ones.

  ### The operators
  | Operator | Name | Rule per bit | Example (12 = 1100, 10 = 1010) |
  |---|---|---|---|
  | `&` | AND | 1 if both are 1 | `12 & 10 = 8` (1000) |
  | `\|` | OR | 1 if at least one is 1 | `12 \| 10 = 14` (1110) |
  | `^` | XOR | 1 if they are different | `12 ^ 10 = 6` (0110) |
  | `~` | NOT | flip every bit | `~12 = -13` |
  | `<<` | left shift | move bits left, fill 0s | `12 << 2 = 48` |
  | `>>` | signed right shift | move right, copy the sign bit | `-8 >> 1 = -4` |
  | `>>>` | unsigned right shift | move right, fill 0s | `-8 >>> 28 = 15` |

  Handy facts:
  - `~x == -x - 1` (so `~12 == -13`, `~0 == -1`).
  - `x << k` = x times 2^k (until it overflows); `x >> k` = x divided by 2^k, rounded **down** (towards minus infinity for negatives).
  - `>>>` is the only one that treats the number as unsigned; for negative numbers it gives big positive results.
  - **Precedence trap**: `==` binds tighter than `&`, so always write `(n & 1) == 0` with brackets.

  ### XOR superpowers
  - `a ^ a = 0` (a number cancels itself)
  - `a ^ 0 = a`
  - Order doesn't matter: `a ^ b ^ a = b`

  ### The bit toolkit (bit i, counted from 0 on the right)
  ```java
  boolean isSet = (n & (1 << i)) != 0;   // check bit i
  n = n | (1 << i);                      // set bit i to 1
  n = n & ~(1 << i);                     // clear bit i to 0
  n = n ^ (1 << i);                      // toggle bit i
  boolean odd = (n & 1) == 1;            // last bit = odd/even (works for negatives too)
  ```
  `1 << i` is a **mask**: a number with only bit i set.

  ### Trick: n & (n - 1)
  Subtracting 1 flips the **lowest set bit** to 0 and all bits to its right to 1. ANDing with n then **removes the lowest set bit**.
  - **Power of two**: a power of two has exactly one 1-bit, so `n > 0 && (n & (n - 1)) == 0`.
  - **Count set bits (Brian Kernighan's algorithm)**: keep doing `n &= n - 1` and count the steps. Runs once per 1-bit, not once per bit.
  ```java
  int count = 0;
  while (n != 0) { n &= (n - 1); count++; }
  ```
  Java also has `Integer.bitCount(n)`.

  Related: `n & -n` keeps **only** the lowest set bit (40 = 101000 gives 8).

  ### Single number (XOR)
  Every number appears twice except one. Find it in O(n) time and **O(1) space**.
  ```java
  int x = 0;
  for (int v : nums) x ^= v;   // pairs cancel to 0, the single one remains
  return x;
  ```
  A HashMap of counts also works but needs O(n) space.

  ### Counting bits for 0..n
  `bits[i] = bits[i >> 1] + (i & 1)`: i without its last bit has already been counted, then add the last bit. This is a small DP, O(n).

  ### Subsets with a bitmask (preview)
  For n items, every number from `0` to `(1 << n) - 1` is a subset: bit j = 1 means "item j is included".
  ```java
  for (int mask = 0; mask < (1 << n); mask++) {
      for (int j = 0; j < n; j++) {
          if ((mask & (1 << j)) != 0) { /* item j is in this subset */ }
      }
  }
  ```
  That's 2^n subsets, so only for small n (about 20 or less).

  ### Complexity summary
  | Task | Time | Space |
  |---|---|---|
  | Check / set / clear / toggle a bit | O(1) | O(1) |
  | Power of two | O(1) | O(1) |
  | Count set bits (Kernighan) | O(number of 1-bits) | O(1) |
  | Single number (XOR) | O(n) | O(1) |
  | Counting bits 0..n | O(n) | O(n) |
  | All subsets via bitmask | O(2^n x n) | O(1) extra |
tinyCode:
  code: |
    public class Bits {
        static boolean isSet(int n, int i)  { return (n & (1 << i)) != 0; }
        static int setBit(int n, int i)     { return n | (1 << i); }
        static int clearBit(int n, int i)   { return n & ~(1 << i); }
        static int toggleBit(int n, int i)  { return n ^ (1 << i); }

        static boolean isPowerOfTwo(int n)  { return n > 0 && (n & (n - 1)) == 0; }

        static int countBits(int n) {        // Brian Kernighan: one loop per set bit
            int count = 0;
            while (n != 0) {
                n &= (n - 1);                // removes the lowest set bit
                count++;
            }
            return count;
        }

        static int singleNumber(int[] nums) {
            int x = 0;
            for (int v : nums) x ^= v;       // pairs cancel: a ^ a = 0
            return x;
        }

        public static void main(String[] args) {
            int n = 13;                                    // 1101
            System.out.println(Integer.toBinaryString(n));
            System.out.println(isSet(n, 2) + " " + isSet(n, 1));
            System.out.println(setBit(n, 1) + " " + clearBit(n, 2) + " " + toggleBit(n, 0));
            System.out.println(isPowerOfTwo(16) + " " + isPowerOfTwo(18));
            System.out.println(countBits(13) + " " + Integer.bitCount(13));
            System.out.println(singleNumber(new int[]{4, 1, 2, 1, 2}));
        }
    }
  walkthrough: |
    - 13 is `1101`: bits 0, 2 and 3 are on.
    - `isSet(13, 2)`: mask `0100`, `1101 & 0100 = 0100`, not zero, so `true`. Bit 1 is off, so `false`.
    - `setBit(13, 1)`: `1101 | 0010 = 1111` = **15**. `clearBit(13, 2)`: `1101 & 1011 = 1001` = **9**. `toggleBit(13, 0)`: `1101 ^ 0001 = 1100` = **12**.
    - `isPowerOfTwo(16)`: `10000 & 01111 = 0`, so `true`. 18 is `10010`, which has two 1-bits, so `false`.
    - `countBits(13)`: 1101 -> 1100 -> 1000 -> 0, three steps, so **3**, same as `Integer.bitCount`.
    - `singleNumber`: 4 ^ 1 ^ 2 ^ 1 ^ 2. The 1s cancel and the 2s cancel, leaving **4**.

    Output:
    ```
    1101
    true false
    15 9 12
    true false
    3 3
    4
    ```
tryIt:
  instructions: "Type this 'counting bits' program, which reuses the answer for i >> 1 (a tiny DP). Compare each line with the binary string printed next to it. Then change n to 16 and check that every power of two has exactly one 1-bit."
  code: |
    import java.util.Arrays;

    public class CountingBits {
        public static void main(String[] args) {
            int n = 8;
            int[] bits = new int[n + 1];
            for (int i = 1; i <= n; i++) {
                // i >> 1 drops the last bit; (i & 1) adds it back if it was 1
                bits[i] = bits[i >> 1] + (i & 1);
            }
            System.out.println(Arrays.toString(bits));

            for (int i = 0; i <= n; i++) {
                String b = Integer.toBinaryString(i);
                System.out.println(i + " = " + b + " -> set bits: " + bits[i]);
            }
        }
    }
