  prompt: "Explain SOLID to a friend: one simple sentence and one tiny example for each letter."
  rubric:
    - "I gave a correct one-line meaning for all five letters"
    - "I gave an example for Open/Closed (new class instead of editing if-else)"
    - "I gave the Square/Rectangle or 'throws not supported' example for Liskov"
    - "I linked Dependency Inversion to interfaces and constructor injection in Spring"
    - "I said SOLID is guidance, not something to overuse in tiny programs"
  modelAnswer: |
    SOLID is five rules for code that's easy to change. S, single responsibility: one class, one job, like a cook who only cooks. O, open/closed: add new behaviour by adding classes, like a new Discount class, instead of editing a big if-else. L, Liskov: a child must work wherever the parent works; a Square that breaks Rectangle's area is the classic violation. I, interface segregation: small interfaces, so a Robot isn't forced to implement eat. D, dependency inversion: business code depends on interfaces, and the real objects are injected from outside, which is what Spring does with constructor injection. I use these when code grows, not to overcomplicate tiny programs.
flashcards:
  - front: "S in SOLID"
    back: "Single Responsibility: one class, one reason to change."
  - front: "O in SOLID"
    back: "Open/Closed: open for extension (new classes), closed for modification (don't edit working code)."
  - front: "L in SOLID"
    back: "Liskov Substitution: a subclass must be usable anywhere the parent is, without surprises (Square/Rectangle)."
  - front: "I in SOLID"
    back: "Interface Segregation: many small interfaces instead of one fat one."
  - front: "D in SOLID"
    back: "Dependency Inversion: depend on abstractions; inject concrete classes (Spring constructor injection)."
keyTakeaways:
  - "SOLID = five rules for code that is easy to change."
  - "S: one job per class. O: extend with new classes, don't edit old ones."
  - "L: children must keep the parent's promises. I: keep interfaces small."
  - "D: depend on interfaces and inject the details; Spring does this for you."
  - "Use SOLID when code grows; don't over-engineer tiny programs."
