  modelAnswer: |
    ArrayList keeps elements in a resizable array, like numbered cinema seats. Getting element i is instant, O(1), and adding at the end is usually O(1); when it's full it makes a 1.5 times bigger array and copies. Inserting in the middle shifts elements, O(n). LinkedList is a chain of nodes with previous and next pointers. Adding at either end is O(1), but getting element i means walking the chain, O(n), and even a middle insert must walk first. In real programs ArrayList usually wins because its memory is side by side, which the CPU loves, and it uses less memory. Vector and Stack are old synchronized classes; for a stack I'd use ArrayDeque.
