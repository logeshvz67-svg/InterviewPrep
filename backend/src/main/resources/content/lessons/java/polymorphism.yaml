why: |
  **Polymorphism** is one of the four OOP pillars, and interviewers rarely stop at the definition. They show code like `Animal a = new Dog();` and ask:
  - Which method runs?
  - Which field is printed?
  - Can I call a Dog-only method on `a`?
  - What happens if I cast it to `Cat`?

  Once you understand the **two types** of polymorphism and the **"variable type vs object type"** rule, every one of these questions becomes easy.

  It's also how real Java code is written: `List<String> list = new ArrayList<>();` is polymorphism.
analogy: |
  Think of a **TV remote** with a "Power" button.

  - The button (the **reference**, the variable) looks the same for every TV.
  - But pressing it on a Sony, a Samsung or an LG makes *that* TV do *its own* thing (the **object** decides).

  The remote only shows buttons that **every TV** has (the **reference type** decides what you're *allowed* to press). If your Samsung has a special "Smart Hub" button, a generic remote doesn't show it. To use it, you need the **Samsung remote** (a **downcast**). And if you point the Samsung remote at a Sony, it simply fails (a **ClassCastException**).
