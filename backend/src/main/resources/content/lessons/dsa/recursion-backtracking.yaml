  modelAnswer: |
    Recursion is a function solving a problem by calling itself on a smaller version, until it reaches a base case it can answer directly; without a base case it never stops and the stack overflows. Backtracking uses recursion to try all options, like trying outfits: choose a shirt, explore all pants with it, then take the shirt off before trying the next one. In code it's choose, explore, un-choose. For subsets, at each element I either take it or skip it, so three elements give 2 to the power 3, which is 8 subsets. When I reach the end, I save a copy of the current list, because the same list keeps changing. It's exponential, so I use it when n is small, around 20 or less.
