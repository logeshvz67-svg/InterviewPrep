keyTakeaways:
  - "Java has 8 primitive types; everything else is a reference type."
  - "Whole-number literals are int and decimal literals are double by default; use L and f suffixes."
  - "int overflows silently past about 2.1 billion; use long and cast before multiplying."
  - "Fields and array elements get default values; local variables do not."
  - "char is 2 bytes and behaves like a number in arithmetic."
  - "double is not exact for decimals like 0.1."
