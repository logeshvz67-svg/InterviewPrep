infosysRelevance: "Core for SP and DSE preparation: traversals, height, BST insert/search/validate and lowest common ancestor are standard recursion-on-trees questions in coding and technical rounds."
otherCompanies: "Tree traversals and BST properties are common basic questions in TCS-style technical rounds; product companies build on them with LCA, level order variants, diameter and serialisation."
why: |
  A **tree** stores data in a hierarchy: one item at the top, each item connected to items below it. You already use trees every day: folders on your laptop, the HTML of a web page, a company org chart, and Java's `TreeMap`.

  Trees are also the **best practice ground for recursion**. Almost every tree problem has the same shape: "solve it for the left subtree, solve it for the right subtree, combine the answers". Once that clicks, height, size, sum, mirror, path and LCA problems all look alike.

  A **Binary Search Tree (BST)** adds one rule (left side smaller, right side bigger), which lets you search, insert and delete in **O(log n)** when the tree is balanced, like binary search but on a structure that can grow.
analogy: |
  Think of a **family tree** drawn on a wedding invitation backdrop: grandparents at the top, their children below, grandchildren below them.

  - The grandparent at the very top is the **root**.
  - People with no children are **leaves**.
  - "Who is the closest common elder of these two cousins?" is exactly the **lowest common ancestor** question.

  A **BST** is like a well-organised **library shelf guide**: at each signboard, "books numbered less than 500: go left; 500 or more: go right". At every sign you skip half of the library, so you reach your book in a few turns.
