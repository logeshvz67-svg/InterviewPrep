    |  name   = "Asha"     |    (constructor NOT called)
    |  marks  = 91         |
    |  otp    = null       |  <- transient gets default value
    +----------------------+
  caption: "Serialization packs an object's fields into bytes; deserialization rebuilds it. Transient fields are skipped and come back as default values."
