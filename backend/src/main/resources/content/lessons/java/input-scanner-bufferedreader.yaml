explanation: |
  ### Scanner: the easy way
  `Scanner` (in `java.util`) reads and converts input for you.
  ```java
  import java.util.Scanner;

  Scanner sc = new Scanner(System.in);
  int n = sc.nextInt();        // next whole number
  long big = sc.nextLong();
  double d = sc.nextDouble();
  String word = sc.next();     // next word (stops at space or newline)
  String line = sc.nextLine(); // rest of the current line
  ```
  - A **token** is one piece of input separated by spaces or newlines. `next()`, `nextInt()` and friends read **one token** and skip any spaces before it.
  - `nextLine()` reads **everything up to the end of the current line** and removes the newline.
  - `sc.hasNextInt()` / `sc.hasNext()` tell you if more input exists. Useful for "read until end of input" problems.

  ### The nextInt + nextLine trap
  Input:
  ```
  21
  Ravi Kumar
  ```
  ```java
  int age = sc.nextInt();      // 21, but the '\n' after 21 is still waiting
  String name = sc.nextLine(); // reads that leftover '\n' -> ""  (WRONG)
  ```
  **Fix:** add an extra `sc.nextLine();` to throw away the rest of the line before reading the real line:
  ```java
  int age = sc.nextInt();
  sc.nextLine();               // eat the leftover newline
  String name = sc.nextLine(); // "Ravi Kumar"
  ```
  Another fix: read every line with `nextLine()` and convert yourself: `int age = Integer.parseInt(sc.nextLine().trim());`.

  ### BufferedReader: the fast way
  `BufferedReader` (in `java.io`) reads big chunks of input into memory (a **buffer**) and gives you whole lines with `readLine()`. It does **not** convert numbers; you do that with `Integer.parseInt`.
  ```java
  import java.io.*;
  import java.util.*;

  public class Main {
      public static void main(String[] args) throws IOException {
          BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
          int n = Integer.parseInt(br.readLine().trim());
          StringTokenizer st = new StringTokenizer(br.readLine());
          int[] a = new int[n];
          for (int i = 0; i < n; i++) {
              a[i] = Integer.parseInt(st.nextToken());
          }
      }
  }
  ```
  Important points:
  - `readLine()` can throw `IOException`, a **checked exception** (one the compiler forces you to handle). So write `throws IOException` on `main`, or the code will not compile.
  - `readLine()` returns `null` when the input has ended. Use that to read until the end: `while ((line = br.readLine()) != null)`.
  - **StringTokenizer** splits a line into tokens by spaces. `hasMoreTokens()` and `nextToken()` walk through them. It is a bit faster than `split`.
  - **split** works too: `String[] parts = br.readLine().trim().split("\\s+");`. The pattern `"\\s+"` means "one or more spaces/tabs". Always `trim()` first: `"  4 5".split(" ")` gives `["", "", "4", "5"]`, with empty strings at the start.

  ### Which one should I use?
  | | Scanner | BufferedReader + StringTokenizer |
  |---|---|---|
  | Speed | Slow (parses with regular expressions) | Fast (big buffer, simple splitting) |
  | Ease | Very easy, converts types for you | You parse with `Integer.parseInt` |
  | Exceptions | No checked exception | Must handle `IOException` |
  | nextLine trap | Yes, be careful | No: you always read full lines |
  | Good for | Small inputs, quick practice | Timed tests, 10^5+ numbers |

  Rule of thumb: for up to a few thousand numbers, Scanner is fine. For large inputs (10^5 or more), use BufferedReader.

  ### Fast output too
  Calling `System.out.println` 10^5 times is also slow. Collect output in a `StringBuilder` and print once:
  ```java
  StringBuilder sb = new StringBuilder();
  for (int x : a) sb.append(x).append('\n');
  System.out.print(sb);
  ```
  Or use `PrintWriter out = new PrintWriter(System.out);` and remember `out.flush()` at the end; without flush, nothing may appear.

  ### A reusable fast-reader template
  When numbers may be spread over many lines, this helper reads the next token wherever it is:
  ```java
  static BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
  static StringTokenizer st;

  static String next() throws IOException {
      while (st == null || !st.hasMoreTokens()) {
          st = new StringTokenizer(br.readLine());
      }
      return st.nextToken();
  }
  static int nextInt() throws IOException {
      return Integer.parseInt(next());
  }
  ```
  Now `nextInt()` behaves like Scanner's, but fast, and without the newline trap.

  ### Common input shapes
  - **First line n, second line n numbers:** read n, then tokenize one line.
  - **T test cases:** read T, then loop T times.
  - **Matrix r x c:** loop r rows, tokenize each line into c numbers.
  - **Unknown number of lines:** loop until `readLine()` returns `null` (or `sc.hasNext()` is false).
tinyCode:
  code: |
    import java.io.*;
    import java.util.*;

    public class FastSum {
        public static void main(String[] args) throws IOException {
            BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
            int n = Integer.parseInt(br.readLine().trim());
            StringTokenizer st = new StringTokenizer(br.readLine());
            long sum = 0;
            int max = Integer.MIN_VALUE;
            for (int i = 0; i < n; i++) {
                int x = Integer.parseInt(st.nextToken());
                sum += x;
                max = Math.max(max, x);
            }
            StringBuilder sb = new StringBuilder();
            sb.append("Sum: ").append(sum).append('\n');
            sb.append("Max: ").append(max);
            System.out.println(sb);
        }
    }
  walkthrough: |
    Input given to the program:
    ```
    5
    4 9 1 7 3
    ```
    - `throws IOException` is required because `readLine()` may throw it.
    - `br.readLine().trim()` reads `"5"`; `Integer.parseInt` turns it into the number 5.
    - `new StringTokenizer(br.readLine())` takes the second line and prepares to hand out `"4"`, `"9"`, `"1"`, ... one by one.
    - In the loop, each `nextToken()` is converted with `parseInt`, added to `sum` (a `long`, to be safe with big totals) and compared for the maximum.
    - All output is built in a `StringBuilder` and printed once.

    Output:
    ```
    Sum: 24
    Max: 9
    ```
tryIt:
  instructions: "Type this Scanner program. Run it and type: 3, press Enter, then your full name, press Enter. Then delete the line sc.nextLine(); and run again to see the trap: the name comes out empty."
  code: |
    import java.util.Scanner;

    public class Greet {
        public static void main(String[] args) {
            Scanner sc = new Scanner(System.in);
            System.out.println("How many greetings?");
            int times = sc.nextInt();
            sc.nextLine(); // throw away the leftover newline
            System.out.println("Your full name?");
            String name = sc.nextLine();
            for (int i = 1; i <= times; i++) {
                System.out.println(i + ". Hello, " + name + "!");
            }
            sc.close();
        }
    }
