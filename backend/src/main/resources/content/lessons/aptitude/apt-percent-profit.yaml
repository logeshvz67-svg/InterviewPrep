otherCompanies: "Percentages and profit/loss are standard practice topics for TCS, Wipro, Cognizant, Accenture and Capgemini style aptitude tests."
why: |
  Percentages are everywhere: salary hikes, discounts, exam cut-offs, GST, EMI. In aptitude tests they also hide inside other topics (profit and loss, interest, data tables).

  The slow way is to calculate everything from scratch. The fast way uses three ideas:
  1. **Fractions you know by heart** (1/8 = 12.5%).
  2. **Multiplying factors** (a 20% increase means x 1.2).
  3. **Successive change formula** (+20% then -10% is +8%, not +10%).

  Each idea is explained with **why it works**, plus many worked examples and Java programs that check the answers.
analogy: |
  Think of a **mobile phone sale in a shop on Diwali**.

  - The shopkeeper bought the phone for Rs 10,000 (**cost price**).
  - The price tag says Rs 12,500 (**marked price**).
  - He gives a 10% Diwali discount, so you pay Rs 11,250 (**selling price**).
  - He still makes Rs 1,250 (**profit**), which is 12.5% of what he paid.

  Every profit and loss question is just this story with different numbers. Always ask: **percentage of what?** Profit percent is of the **cost price**; discount percent is of the **marked price**.
