    A linked list is like a treasure hunt: each card has a prize and tells you where the next card is. To reverse it, I walk with three references: prev, cur and next. At each card I first note down where the next card is, then rewrite the current card to point back to the previous one, and then move both prev and cur one step forward. When cur becomes null, prev is the new first card. To find the middle, I send two people: slow takes one step, fast takes two. When fast reaches the end, slow is halfway. Both are O(n) time and O(1) extra space.
