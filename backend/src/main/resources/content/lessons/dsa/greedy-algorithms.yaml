  - front: "Jump game in O(n)"
    back: "Track farthest = max(farthest, i + nums[i]); if i > farthest, return false."
  - front: "Fractional vs 0/1 knapsack"
    back: "Fractional: greedy by value/weight. 0/1: needs DP."
keyTakeaways:
  - "Greedy makes the locally best choice and never revisits it; it is fast but not always correct."
  - "Activity selection: sort by end time. Meeting rooms: count maximum overlap."
  - "Jump game: track the farthest reachable index in one pass."
  - "Greedy coin change works for canonical coins (like Indian currency) but fails for sets like {4, 3, 1}."
  - "Always test small counterexamples; when greedy fails, use dynamic programming."
