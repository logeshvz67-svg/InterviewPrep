explanation: |
  ### Way 1: Extend the Thread class
  You create a subclass of `Thread` and **override** `run()` (put your work inside it). Then you call `start()`.
  ```java
  class MyThread extends Thread {
      @Override
      public void run() {
          System.out.println("Working in " + getName());
      }
  }
  new MyThread().start();
  ```
  - **Problem:** Java allows only **one parent class** (single inheritance). If your class extends `Thread`, it cannot extend anything else.
  - It also mixes two ideas: *the worker* (Thread) and *the work* (your code).

  ### Way 2: Implement Runnable (preferred)
  `Runnable` is an interface with one method: `void run()`. You write the job, then hand it to a `Thread`.
  ```java
  Runnable job = () -> System.out.println("Working");
  Thread t = new Thread(job);
  t.start();
  ```
  - Your class is free to extend another class.
  - The **same job** can be given to many threads or to a **thread pool** (lesson 5).
  - Since `Runnable` has exactly one abstract method, it is a **functional interface**, so you can write it as a **lambda** (`() -> ...`).
  - Limitation: `run()` returns `void` and **cannot throw checked exceptions** (exceptions the compiler forces you to handle, like `InterruptedException`).

  ### Way 3: Implement Callable (when you need a result)
  `Callable<V>` has one method: `V call() throws Exception`.
  - It **returns a value** of type `V`.
  - It **can throw checked exceptions**.
  - You usually submit it to an `ExecutorService` (a thread pool) and get back a **`Future<V>`**: a promise that the result will be available later.
  ```java
  ExecutorService pool = Executors.newSingleThreadExecutor();
  Future<Integer> f = pool.submit(() -> 6 * 7);
  System.out.println(f.get()); // 42; get() waits if not ready
  pool.shutdown();
  ```

  ### Comparison table
  | | Thread (extend) | Runnable | Callable |
  |---|---|---|---|
  | Method | `run()` | `run()` | `call()` |
  | Returns a value? | No | No | **Yes** (`V`) |
  | Throws checked exceptions? | No | No | **Yes** |
  | Uses up your one parent class? | **Yes** | No | No |
  | Usually run by | `start()` | `new Thread(r).start()` or a pool | A pool via `submit()` |

  ### start() vs run(): the classic trap
  - `t.start()` asks the JVM to **create a new thread**. That new thread then calls `run()`.
  - `t.run()` is just an **ordinary method call**. The code runs in the **current thread** (e.g. `main`). No new thread is created.
  - `start()` can be called only once; `run()` can be called any number of times (it's just a method).

  ### Output order with threads
  When you start two threads, the **thread scheduler** (the part of the OS/JVM that decides which thread gets the CPU) chooses who runs first. So:
  ```java
  new Thread(() -> System.out.print("A")).start();
  new Thread(() -> System.out.print("B")).start();
  ```
  may print `AB` or `BA`. Never assume an order unless your code forces it (for example with `join()`).

  ### Quick rule for interviews
  - Need just "do this in background"? **Runnable**.
  - Need a **result** or need to **throw checked exceptions**? **Callable** + `Future`.
  - Extending `Thread`: works, but prefer Runnable for flexibility.
tinyCode:
  code: |
    import java.util.concurrent.*;

    public class ThreeWays {
        static class MyThread extends Thread {
            @Override
            public void run() {
                System.out.println("1. extends Thread");
            }
        }

        public static void main(String[] args) throws Exception {
            Thread a = new MyThread();
            a.start();
            a.join();

            Runnable job = () -> System.out.println("2. implements Runnable");
            Thread b = new Thread(job);
            b.start();
            b.join();

            Callable<Integer> task = () -> 6 * 7;
            ExecutorService pool = Executors.newSingleThreadExecutor();
            Future<Integer> future = pool.submit(task);
            System.out.println("3. Callable returned " + future.get());
            pool.shutdown();
        }
    }
  walkthrough: |
    - `MyThread extends Thread` and overrides `run()`. `a.start()` creates a new thread that runs it. `a.join()` waits for it, so the order is fixed.
    - `Runnable job = () -> ...` is the work written as a lambda. `new Thread(job)` is the worker that carries it out.
    - `Callable<Integer> task = () -> 6 * 7` returns a value (42).
    - `Executors.newSingleThreadExecutor()` makes a small **thread pool** with one thread.
    - `pool.submit(task)` gives us a `Future<Integer>` (the token). `future.get()` waits until the answer is ready and returns `42`.
    - `pool.shutdown()` tells the pool to stop after finishing its work; without it, the program may not exit.
    - `throws Exception` covers `join()` (InterruptedException) and `get()` (ExecutionException).

    Output:
    ```
    1. extends Thread
    2. implements Runnable
    3. Callable returned 42
    ```
tryIt:
  instructions: "Type this Runnable class and run it several times. The lines from Ravi and Priya may mix in a different order on different runs (that's normal for threads!). But 'Both done' is always last, because main joins both threads first."
  code: |
    public class Counter implements Runnable {
        private final String label;

        Counter(String label) {
            this.label = label;
        }

        @Override
        public void run() {
            for (int i = 1; i <= 3; i++) {
                System.out.println(label + " says " + i);
            }
        }

        public static void main(String[] args) throws InterruptedException {
            Thread t1 = new Thread(new Counter("Ravi"));
            Thread t2 = new Thread(new Counter("Priya"));
            t1.start();
            t2.start();
            t1.join();
            t2.join();
            System.out.println("Both done");
        }
    }
