why: |
  **Inheritance** is one of the four pillars of OOP (with encapsulation, abstraction and polymorphism). Interviewers love starting with "What is inheritance? What types does Java support? Why no multiple inheritance of classes?"

  It also unlocks the next lessons:
  - **Overriding** only exists because of inheritance.
  - **Polymorphism** (a parent variable holding a child object) needs inheritance.
  - Many output questions test **constructor order** and the **`super`** keyword.

  Learn this properly once and the rest of Section C becomes much easier.
analogy: |
  Think of a **family business** in Chennai: the father runs "Kumar Textiles".

  - The son **inherits** the shop, the customers and the father's skills. He doesn't rebuild them from scratch. That is `extends`.
  - The son can **add** new things (an online store) and can **change** how he does something the father also did (a new billing style). That is adding methods and **overriding**.
  - When the son says "let me ask Appa how he did billing", he is using **`super`**: talking to the parent's version.
  - And before the son's shop can open, the father's shop must already exist. That is why the **parent constructor always runs first**.
