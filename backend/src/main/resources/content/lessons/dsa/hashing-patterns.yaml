  modelAnswer: |
    A hash map is like hostel mailboxes: the warden computes the box from the room number, so storing and finding a letter is instant instead of searching a pile. That makes "have I seen this?" and "how many times?" O(1) on average. I use it to count frequencies, to detect duplicates with a seen-set, and to group anagrams by a sorted-letters key. For two-sum, I walk the array once; for each number I check if target minus that number is already in the map. If yes, I have the pair; if not, I store the number with its index. I check before storing so an element doesn't pair with itself. Hashing is O(n) but uses extra memory and loses order; if I need order or have little memory, I sort instead.
