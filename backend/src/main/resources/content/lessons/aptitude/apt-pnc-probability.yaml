    code: null
    options: ["120", "60", "30", "20"]
    answer: 2
    explanation: "5 letters with L twice and E twice: 5!/(2! x 2!) = 120/4 = 30. 120 ignores the repeats; 60 removes only one repeated letter."
  - id: q2
    type: MCQ
    prompt: "A committee of 2 men and 2 women is chosen from 5 men and 4 women. How many ways?"
    code: null
    options: ["16", "60", "126", "240"]
    answer: 1
    explanation: "5C2 x 4C2 = 10 x 6 = 60 (AND -> multiply). 16 adds them; 126 is 9C4, which ignores the 2-men-2-women condition; 240 uses permutations (ordered picks) for both groups."
