    }
predict:
  code: |
    public class Main {
        public static void main(String[] args) {
            Counter c = new Counter();
            c.increment();
            c.increment();
            c.reset(5);
            c.increment();
            System.out.println(c.getCount());
        }
    }

    class Counter {
        private int count;

        public void increment() { count++; }

        public void reset(int value) {
            if (value < 0) return;
            count = 0;
        }

        public int getCount() { return count; }
    }
  expectedOutput: |
    1
  explanation: |
    Read `reset` carefully: it ignores `value` and always sets `count` to 0 (for non-negative input). So: 1, 2, then reset to 0, then increment to 1. Encapsulation means you trust the method's *code*, not its *name*: always read what it really does.
commonMistakes:
  - "Thinking default access means public. Default (no keyword) is package-private: other packages can't see it."
  - "Thinking protected is only for subclasses. protected also gives access to every class in the same package."
  - "Writing getters and setters with no validation and calling it full encapsulation. The point is control: validate, or leave out setters for read-only data."
  - "Declaring a top-level class private or protected. Top-level classes can only be public or default."
  - "Putting two public classes in one .java file, or naming the file differently from the public class."
  - "Mixing up encapsulation (hiding data) and abstraction (hiding implementation complexity)."
interviewBox:
  why: "Why interviewers ask this: it checks basic OOP vocabulary and whether you design classes that protect their own data."
  questions:
    - q: "What is encapsulation?"
      a: "Encapsulation means bundling data and the methods that work on it into one class and hiding the data from direct access. We make fields private and expose public getters and setters, so every change goes through methods that can check the rules."
    - q: "Explain the four access modifiers."
      a: "private is visible only inside the same class. Default, with no keyword, is visible inside the same package. protected is visible in the same package and also in subclasses in other packages through inheritance. public is visible everywhere."
    - q: "What is the difference between encapsulation and abstraction?"
      a: "Encapsulation hides the data and protects the object's state, using private fields and methods. Abstraction hides the implementation complexity and shows only what an object does, using abstract classes and interfaces."
    - q: "What is a package and why do we use it?"
      a: "A package is a namespace that groups related classes, like a folder. It organises code, avoids name clashes such as java.util.Date and java.sql.Date, and works with default and protected access to control visibility."
quiz:
  - id: q1
    type: MATCH
    prompt: "Match each access modifier to its widest visibility"
    pairs:
      - left: "private"
        right: "Only the same class"
      - left: "(default)"
        right: "Same package only"
      - left: "protected"
        right: "Same package + subclasses in other packages"
      - left: "public"
        right: "Everywhere"
    explanation: "Visibility widens in this order: private < default < protected < public. protected is wider than default because it adds subclasses in other packages."
  - id: q2
    type: SPOT_THE_BUG
    prompt: "Why does this fail to compile?"
    code: |
      public class Main {
          public static void main(String[] args) {
              Wallet w = new Wallet();
              w.cash = 500;
              System.out.println(w.getCash());
          }
      }
      class Wallet {
          private int cash;
          public int getCash() { return cash; }
      }
    options:
      - "getCash() must be static"
      - "cash is private, so Main can't assign it directly"
      - "Wallet needs a constructor"
      - "int fields can't be private"
    answer: 1
    explanation: "private fields can be used only inside Wallet. The compiler says 'cash has private access in Wallet'. Java gives a default constructor automatically, so a missing constructor isn't the problem. The fix is a setter method."
  - id: q3
    type: MCQ
    prompt: "Which modifier lets classes in the SAME package see a member, but NOT a subclass in a different package?"
    options: ["private", "default (no modifier)", "protected", "public"]
    answer: 1
    explanation: "Default (package-private) stops at the package boundary. protected looks similar but also allows subclasses in other packages, which is the trap."
  - id: q4
    type: TRUE_FALSE
    prompt: "A top-level class can be declared private."
    options: ["True", "False"]
    answer: 1
    explanation: "False. A top-level class can be only public or default. private and protected are allowed only for nested (inner) classes."
  - id: q5
    type: PREDICT_OUTPUT
    prompt: "What does this print?"
    code: |
      public class Main {
          public static void main(String[] args) {
              Temp t = new Temp();
              t.setCelsius(30);
              t.setCelsius(-500);
              System.out.println(t.getCelsius());
          }
      }
      class Temp {
          private double celsius;
          public void setCelsius(double c) {
              if (c < -273.15) return;
              celsius = c;
          }
          public double getCelsius() { return celsius; }
      }
    options: ["-500.0", "30.0", "0.0", "30"]
    answer: 1
    explanation: "-500 is below absolute zero, so the setter rejects it and celsius stays 30.0. It's a double, so it prints 30.0, not 30. This is exactly why encapsulation is useful: bad data never gets in."
  - id: q6
    type: FILL_THE_CODE
    prompt: "Fill in the keyword so the field can't be accessed from outside the class."
    code: |
      public class Main {
          public static void main(String[] args) {
              System.out.println(new Phone().getModel());
          }
      }
      class Phone {
          ____ String model = "Pixel";
          public String getModel() { return model; }
      }
    acceptedAnswers: ["private"]
    explanation: "private hides the field; other classes must go through getModel(). With no setter, model becomes read-only from outside."
  - id: q7
    type: MCQ
    prompt: "Which statement about packages is correct?"
    options:
      - "import java.util.*; also imports java.util.function classes"
      - "java.lang classes like String must be imported manually"
      - "The package statement must be the first statement in the file"
      - "A package name must start with a capital letter"
    answer: 2
    explanation: "package must come first (only comments may appear before it). A wildcard import does not include sub-packages, java.lang is imported automatically, and package names are lowercase by convention."
explainBack:
  prompt: "Explain encapsulation and the four access modifiers to a friend using a bank account example."
  rubric:
    - "I said fields are private and accessed through public methods"
    - "I explained why: validation, control, flexibility"
    - "I listed private, default, protected, public in order with who can see each"
    - "I mentioned packages as groups of classes that affect default/protected access"
    - "I contrasted it with abstraction in one line"
  modelAnswer: |
    Encapsulation is like a bank keeping your balance in a locked vault. In Java I make the balance field private, so nobody outside the class can change it, and I give public methods like deposit and withdraw that check the rules first. That keeps data safe and lets me change the inside later. Access modifiers decide who can see what: private is only the same class, default with no keyword is the same package, protected is the package plus child classes elsewhere, and public is everyone. A package is just a named group of related classes, like a folder. Encapsulation hides data; abstraction hides complexity.
flashcards:
  - front: "Access modifiers from narrowest to widest"
    back: "private < default (package-private) < protected < public."
  - front: "What does protected allow?"
    back: "Same class, same package, and subclasses in other packages (through inheritance)."
  - front: "Encapsulation recipe"
    back: "private fields + public getters/setters with validation."
  - front: "Encapsulation vs abstraction"
    back: "Encapsulation hides data (private fields). Abstraction hides implementation complexity (abstract classes/interfaces)."
  - front: "Allowed modifiers for a top-level class"
    back: "Only public or default."
keyTakeaways:
  - "Encapsulation = data + methods in one class, with data hidden behind private."
  - "Getters/setters give controlled access; setters should validate."
  - "private < default < protected < public; default is package-private."
  - "protected = same package + subclasses in other packages."
  - "Packages group classes, avoid name clashes and work with access modifiers; java.lang is auto-imported."
