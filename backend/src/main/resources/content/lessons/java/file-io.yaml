infosysRelevance: "Practical knowledge for DSE-style technical rounds: reading and writing files, streams and try-with-resources come up as common basic questions."
otherCompanies: "A common basic question at TCS, Wipro and Cognizant (difference between byte and character streams, BufferedReader, closing resources)."
why: |
  Almost every real program reads or writes something: a config file, a CSV report, a log. **File IO** (Input/Output) is how Java talks to files.

  Interviewers like this topic because it quickly shows:
  - whether you know the difference between **byte streams** and **character streams**,
  - whether you **close resources** properly (a very common real bug),
  - whether you know the modern, short way: `java.nio.file.Files`.

  It also connects to later topics: serialization writes objects to files, and JDBC uses the same "open, use, close" idea with try-with-resources.
analogy: |
  Think of a **water tank on the roof** and the **pipe** to your kitchen tap.

  - The **file** is the tank. It just stores data.
  - A **stream** is the pipe. Data flows through it one drop (byte) at a time, in **one direction**: an *input* pipe brings water to you, an *output* pipe sends water to the tank.
  - A **buffer** is a bucket. Instead of running to the tap for every drop, you fill a bucket and carry many drops at once. That is why `BufferedReader` is faster.
  - **Closing** the stream is turning off the tap. If you forget, water (memory, file handles) keeps leaking, and the last bucket may never be emptied into the tank (your data is lost).
