  - "Use size n+1 with prefix[0] = 0; range sum = prefix[r+1] - prefix[l]."
  - "Subarray sum = k: running sum + HashMap of counts, start with {0: 1}."
  - "Works with negative numbers, unlike sliding window."
  - "2D prefix sums use inclusion-exclusion for O(1) rectangle sums."
