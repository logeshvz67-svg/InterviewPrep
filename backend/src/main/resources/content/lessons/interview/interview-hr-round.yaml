infosysRelevance: "Infosys-style practice: an HR conversation is a normal part of SP and DSE hiring. A calm, honest, well-structured self-introduction and a clear career-switch story are worth preparing early."
otherCompanies: "HR questions (introduce yourself, strengths, relocation, shifts, service agreements) are common in interviews at TCS, Wipro, Cognizant, Accenture, Capgemini and most companies."
why: |
  Many candidates think the HR round is "easy" and do not prepare. Then they ramble for five minutes on "Tell me about yourself" or give an answer that sounds dishonest.

  The HR round checks:
  - **Can you communicate?** Not perfect English. Clear English.
  - **Are you honest and stable?** Will you stay, learn and work with the team?
  - **Are you flexible?** Relocation, shifts and training are common topics.
  - **Does your story make sense?** For you: why are you moving from a copy-paste job into development?

  The good news: HR questions are **predictable**. You can prepare strong, honest answers in advance and practise them in the HR boss fight.
analogy: |
  The HR round is like **meeting a family before a marriage proposal is accepted** (a very Indian example!).

  - They already saw your "biodata" (resume). Now they want to see **you**.
  - They ask simple questions: what do you do, what are your plans, can you adjust to a new city?
  - They are not testing knowledge. They are checking: **is this person honest, respectful, and a good fit for us?**
  - A rehearsed, fake answer is noticed quickly. A simple, honest, polite answer wins trust.
