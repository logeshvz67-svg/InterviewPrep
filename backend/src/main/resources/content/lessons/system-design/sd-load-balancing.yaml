infosysRelevance: "Good SP design-round material: load balancing algorithms and consistent hashing are common follow-ups, and the TreeMap ring is a neat Java coding exercise."
otherCompanies: "Consistent hashing is a favourite product-company question (distributed caches, sharding); load balancer basics come up in most backend interviews."
why: |
  The moment you have **more than one server** (Lesson 2), someone has to decide *which server handles which request*. That someone is the **load balancer**. It appears in almost every design diagram you will ever draw.

  Then comes a harder question: when data is spread over many cache or database servers, **how do you decide which server holds which key**, in a way that doesn't break when you add or remove a server? The naive answer `hash(key) % N` moves almost every key when N changes. **Consistent hashing** moves only a small fraction. It is used in distributed caches, Cassandra/DynamoDB-style databases and CDNs, and interviewers love it because it mixes design with a little algorithm.

  You will build it yourself in Java with a `TreeMap`.
analogy: |
  **Load balancer = the traffic policeman at a toll plaza.** Cars (requests) arrive; he waves each one to a free booth (server). If a booth's barrier is broken (health check failed), he stops sending cars there.

  **Consistent hashing = seats around a round dining table at a family function.** Imagine the table as a circle with seat numbers 0 to 359. Waiters (servers) stand at a few points on the circle. Each guest (key) sits at a seat, and is served by the **first waiter clockwise** from their seat.
  - If one waiter goes home, only *his* guests move to the next waiter clockwise. Everyone else keeps their waiter.
  - With `% N`, it is like renumbering every guest's waiter whenever staff changes: total chaos.
