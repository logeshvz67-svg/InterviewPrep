explanation: |
  ### The old way: finally (Java 6 style)
  ```java
  BufferedReader br = null;
  try {
      br = new BufferedReader(new FileReader("data.txt"));
      System.out.println(br.readLine());
  } catch (IOException e) {
      System.out.println("Error: " + e.getMessage());
  } finally {
      if (br != null) {
          try { br.close(); } catch (IOException e) { /* ignored */ }
      }
  }
  ```
  It works, but it is long, easy to get wrong (forget the null check, forget a nested try), and if both `readLine()` and `close()` fail, the exception from `close()` **replaces** the real error.

  ### The new way: try-with-resources
  ```java
  try (BufferedReader br = new BufferedReader(new FileReader("data.txt"))) {
      System.out.println(br.readLine());
  } catch (IOException e) {
      System.out.println("Error: " + e.getMessage());
  }
  ```
  The **resource** is declared in round brackets after `try`. When the try block ends for **any** reason (normal end, `return`, or exception), Java calls `br.close()` for you.

  ### What can go in the brackets? AutoCloseable
  Only objects whose class implements **`AutoCloseable`** (an interface with one method: `void close() throws Exception`). `Closeable` (from `java.io`) is a child interface used by streams and readers. `Scanner`, `BufferedReader`, `FileInputStream`, JDBC `Connection`, `Statement` and `ResultSet` all qualify. Your own class can too:
  ```java
  class Tap implements AutoCloseable {
      public void close() { System.out.println("Tap closed"); }
  }
  ```
  A class that doesn't implement AutoCloseable gives a compile error in the try brackets.

  ### Rule 1: closing order is REVERSE of opening order
  Separate several resources with `;`. They are opened top to bottom and closed **bottom to top**. This is logical: a later resource often depends on an earlier one (a `Statement` is made from a `Connection`), so it must be closed first.

  ### Rule 2: resources close BEFORE catch and finally run
  By the time your `catch` block runs, the resources are already closed. So you can't use them inside catch or finally (they are also out of scope there).

  ### Rule 3: suppressed exceptions
  Suppose the try body throws exception **X**, and then `close()` throws exception **Y**. Which one do you get?
  - try-with-resources **keeps X** (the real problem) as the main exception,
  - and **attaches Y** to it as a **suppressed** exception.
  - Read them with `e.getSuppressed()`, which returns an array (`Throwable[]`).

  If the body finishes normally and only `close()` throws, then that close exception is the main exception (nothing to suppress it).

  With the old finally style, Y would **replace** X and the real problem would be lost. This is the biggest technical advantage of try-with-resources.

  ### Rule 4: the resource variable is final
  The variable in the brackets is implicitly **final**; you can't reassign it inside the block. Since **Java 9**, you can also use an existing variable if it is **final or effectively final** (never reassigned):
  ```java
  Scanner sc = new Scanner(System.in);
  try (sc) {
      ...
  }
  ```

  ### Also good to know
  - try-with-resources may have **no catch and no finally** at all: `try (Tap t = new Tap()) { ... }` is valid.
  - If a resource's constructor fails, only the resources already opened are closed.
  - Resource initialised to `null`? Java simply skips closing it (no NullPointerException).

  ### Summary table
  | Question | Answer |
  |---|---|
  | Interface needed | `AutoCloseable` (or its child `Closeable`) |
  | Closing order | Reverse of declaration order |
  | When closed | When the try block ends, before catch and finally |
  | Body throws X, close throws Y | X is thrown, Y is in `X.getSuppressed()` |
  | Since | Java 7 (Java 9: effectively final variables allowed) |
tinyCode:
  code: |
    public class Library {
        static class Book implements AutoCloseable {
            private final String name;
            Book(String name) {
                this.name = name;
                System.out.println("Open " + name);
            }
            @Override
            public void close() {
                System.out.println("Close " + name);
            }
        }

        public static void main(String[] args) {
            try (Book a = new Book("A");
                 Book b = new Book("B")) {
                System.out.println("Reading");
                throw new IllegalStateException("coffee spilled");
            } catch (IllegalStateException e) {
                System.out.println("Catch: " + e.getMessage());
            } finally {
                System.out.println("Finally");
            }
        }
    }
  walkthrough: |
    - `Book` implements `AutoCloseable`, so it can be used in the try brackets. Its constructor prints "Open", its `close()` prints "Close".
    - Resources open **in order**: A, then B.
    - The body prints "Reading" and then throws.
    - Before the catch runs, Java closes the resources in **reverse order**: B, then A.
    - Then the catch runs, and finally runs last.

    Output:
    ```
    Open A
    Open B
    Reading
    Close B
    Close A
    Catch: coffee spilled
    Finally
    ```
tryIt:
  instructions: "Type this program. Both the body and close() throw an exception. Run it and see that the body's exception is the main one and the close() exception is attached as suppressed."
  code: |
    public class Suppressed {
        static class Pipe implements AutoCloseable {
            @Override
            public void close() {
                throw new IllegalStateException("close failed");
            }
        }
        public static void main(String[] args) {
            try (Pipe p = new Pipe()) {
                throw new RuntimeException("work failed");
            } catch (RuntimeException e) {
                System.out.println("Main: " + e.getMessage());
                for (Throwable s : e.getSuppressed()) {
                    System.out.println("Suppressed: " + s.getMessage());
                }
            }
        }
    }
