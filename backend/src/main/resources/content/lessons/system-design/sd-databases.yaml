infosysRelevance: "Strong SP material: SQL vs NoSQL, replication, sharding and CAP in simple words are standard design-basics questions, and they connect to the DBMS theory you already study."
otherCompanies: "Product companies expect you to choose a database and justify it; service companies often ask SQL vs NoSQL and indexing as theory questions."
why: |
  Almost every design ends with "...and the data goes into a database". But **one database server has limits**: it can only handle so many queries per second and hold so much data. When IRCTC, Paytm or Swiggy grow, the database is usually the **first thing that breaks**.

  This lesson answers the questions every design interviewer asks:
  - **SQL or NoSQL?** And *why* for this use case?
  - How do you handle **lots of reads**? (indexes, caching, **read replicas**)
  - How do you handle **lots of data and writes**? (**sharding**)
  - What does **CAP** mean, and what is **eventual consistency**, in plain words?

  You already know basic SQL; now you'll learn how databases behave when there are millions of users.
analogy: |
  Think of a **bank with one head office ledger**.

  - **Replication:** The head office (the **leader**) writes every transaction in the master ledger. Every evening, photocopies go to branch offices (**followers / read replicas**). Customers can *check* balances at any branch (reads), but *deposits* are only written at the head office (writes). For a few hours, a branch copy may be slightly old: that's **replication lag** and **eventual consistency**.
  - **Sharding:** The ledger becomes too thick for one office, so accounts starting with A-H are kept in the Delhi office, I-P in Mumbai, Q-Z in Chennai. Each office holds only **part** of the data. Now you must always know which office has which account (the **shard key**).
  - **CAP:** If the phone line between offices breaks (a **network partition**), each branch must choose: keep serving customers with possibly old data (**availability**), or close the counter until the line is fixed (**consistency**).
