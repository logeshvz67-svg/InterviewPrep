    back: "It must implement AutoCloseable (or Closeable)."
  - front: "Closing order of multiple resources?"
    back: "Reverse of declaration order (last opened, first closed)."
  - front: "When are resources closed relative to catch/finally?"
    back: "Before catch and finally run."
  - front: "Body throws X, close() throws Y. What do you catch?"
    back: "X. Y is attached as a suppressed exception: X.getSuppressed() contains Y."
  - front: "Java 9 improvement to try-with-resources"
    back: "You can use an existing final or effectively final variable: try (sc) { ... }."
