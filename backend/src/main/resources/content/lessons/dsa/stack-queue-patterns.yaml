  modelAnswer: |
    A stack is like a pile of plates: last in, first out. For brackets, I push every opening bracket. When a closing bracket comes, it must match the latest unmatched opener, which is the top of the stack. It fails if the stack is empty, if the pair doesn't match, or if openers remain at the end. For next greater element, I keep indexes of numbers still waiting. When a bigger number arrives, it pops every smaller waiting number and becomes their answer. Each index is pushed and popped once, so it's O(n). A queue is first in, first out, like a ticket line, and that's why BFS uses it.
