title: "Message queues and async processing"
version: 1
estimatedMinutes: 40
rebuild: false
patternCode: null
companies: [INFOSYS_SP, PRODUCT, ALL]
infosysRelevance: "Good SP material: queues, producer-consumer and idempotency link system design to Java concurrency (BlockingQueue), which SP interviews like to connect."
otherCompanies: "Kafka/RabbitMQ concepts, at-least-once delivery and idempotent consumers are standard in product-company backend interviews."
why: |
  When you place a Swiggy order, many things must happen: save the order, charge the payment, notify the restaurant, send an SMS, send an email, update analytics, assign a delivery partner. If the **order API** did all of that before replying, you would stare at a spinner for 10 seconds, and if the SMS service was down, your order would fail.

  **Message queues** fix this. The API does the essential work (save the order), drops a message into a queue, and replies immediately. Other services pick up the message and do their work **asynchronously** (later, in the background).

  Queues appear in almost every real design: notifications, order processing, video encoding, payment reconciliation, IRCTC waiting-list updates. And they bring interview favourites: **at-least-once delivery**, **duplicates** and **idempotency**. Java's `BlockingQueue` lets you see the whole idea in 20 lines.
analogy: |
  Think of a busy **restaurant kitchen with an order spike**.

  - The **waiter** (producer) takes your order, writes it on a slip, sticks it on the **order rail** (the queue), and goes back to the next table immediately. He does not stand in the kitchen waiting for your dosa.
  - The **cooks** (consumers) take slips from the rail one by one, in order, at their own speed. During the lunch rush the rail fills up, but nothing is lost; the cooks just work through it. Hire more cooks (consumers) to go faster.
  - If a cook drops a slip and a manager re-hangs it, the dish could be made **twice** (a duplicate message). A smart cook checks "has slip #42 already been cooked?" before starting. That check is **idempotency**.
