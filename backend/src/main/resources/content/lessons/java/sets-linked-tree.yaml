    In `LinkedHashMap`, putting `"b"` again only **updates the value**; it keeps its original first position, so `b` stays before `a`. Copying into a `TreeMap` sorts the keys, so `a` comes first.
commonMistakes:
  - "Expecting HashSet or HashMap to print in insertion order. No order is promised; use the Linked versions."
  - "Thinking re-putting a key in LinkedHashMap moves it to the end. In insertion-order mode it keeps its old position (only access-order mode moves it)."
  - "Putting a null key into a TreeMap or TreeSet with natural ordering: NullPointerException."
  - "Forgetting TreeSet uses compareTo, not equals. If your comparator says two different objects are 0 apart, TreeSet keeps only one of them."
  - "Using TreeMap when you don't need sorting. It is O(log n), slower than HashMap's O(1)."
interviewBox:
  why: "Why interviewers ask this: it checks if you can pick the right data structure and explain the trade-off between speed and order."
  questions:
    - q: "What is the difference between HashMap, LinkedHashMap and TreeMap?"
      a: "All three store key-value pairs. HashMap uses buckets, gives O(1) average and no order. LinkedHashMap is a HashMap plus a doubly linked list, so it keeps insertion order with almost the same speed. TreeMap uses a red-black tree, keeps keys sorted, gives O(log n), and doesn't allow a null key with natural ordering."
    - q: "How does HashSet work internally?"
      a: "HashSet uses a HashMap inside. The element is stored as the key and a dummy constant called PRESENT is the value. add returns true if put returned null, meaning the key was new. So it relies on hashCode and equals for uniqueness."
    - q: "How would you implement an LRU cache in Java?"
      a: "I'd extend LinkedHashMap with accessOrder set to true, so every get moves the entry to the end. Then I override removeEldestEntry to return true when size is more than the capacity. The eldest entry, which is the least recently used, gets removed automatically."
    - q: "How does TreeSet decide that two elements are duplicates?"
      a: "TreeSet uses compareTo or the Comparator, not equals. If compare returns zero, it treats them as the same element and doesn't add the second one."
