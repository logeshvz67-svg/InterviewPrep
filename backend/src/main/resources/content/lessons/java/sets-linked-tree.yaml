    back: "HashMap: none. LinkedHashMap: insertion (or access) order. TreeMap: sorted by key."
  - front: "How is HashSet built?"
    back: "On a HashMap: element = key, a dummy PRESENT object = value."
  - front: "TreeMap operations cost"
    back: "O(log n) for put, get, remove, containsKey (red-black tree)."
  - front: "LRU cache in Java in one line"
    back: "LinkedHashMap with accessOrder = true, overriding removeEldestEntry to return size() > capacity."
  - front: "floorKey vs ceilingKey"
    back: "floorKey(x): largest key <= x. ceilingKey(x): smallest key >= x."
keyTakeaways:
  - "HashSet/LinkedHashSet/TreeSet are built on HashMap/LinkedHashMap/TreeMap."
  - "Hash = fastest, no order. Linked = insertion order (or access order). Tree = sorted, O(log n)."
  - "TreeMap/TreeSet compare keys with compareTo/Comparator and reject null keys with natural order."
  - "LinkedHashMap with access order + removeEldestEntry gives an LRU cache."
  - "TreeMap's floor/ceiling/first/last methods solve 'nearest value' problems neatly."
