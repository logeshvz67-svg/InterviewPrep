keyTakeaways:
  - "HR checks honesty, stability, flexibility and clear communication, not fancy English."
  - "Use Present-Past-Future for 'Tell me about yourself' in 60-90 seconds."
  - "Explain the career switch with respect, spark, proof and a clear goal."
  - "Weakness: real + action. Strength: quality + proof."
  - "Answer relocation, shifts and bond questions honestly; ask for details instead of quoting policies."
