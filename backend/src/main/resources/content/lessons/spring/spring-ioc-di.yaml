infosysRelevance: "Core Spring theory for SP and DSE technical rounds: 'What is IoC / DI / a bean?' is the usual first Spring question, and it leads into scopes and injection types."
otherCompanies: "A standard opening Spring question at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies go deeper into why constructor injection is better and how scopes behave."
why: |
  You already know a few annotations like `@RestController` or `@Service`. But **why** do they work? Who creates these objects? The answer is the **Spring container**, and that idea is called **IoC (Inversion of Control)** and **DI (Dependency Injection)**.

  This lesson matters because:
  - **"What is IoC and DI?"** is the most common first Spring interview question.
  - Almost every Spring bug you will meet early ("No qualifying bean", a `null` field, "expected single matching bean but found 2") comes from not understanding how beans are created and connected.
  - Everything later (configuration, JPA repositories, security filters) is just "more beans in the container".

  Once you understand this lesson, Spring stops being magic annotations and becomes "a smart factory that builds and wires my objects".
analogy: |
  Think of a **wedding caterer** in India.

  - Without a caterer, *you* go to the market, buy vegetables, hire a cook, rent vessels, and connect everything yourself. That is normal Java: `new Cook(new Vessels(), new Vegetables())` everywhere.
  - With a caterer, you only say **what you need**: "I need a biryani counter". The caterer **creates** the cook, vessels and ingredients, **connects** them, and hands you a ready counter. You stopped controlling the creation: **control is inverted**. That is **IoC**.
  - The caterer bringing the cook *to* your counter (instead of the counter hunting for a cook) is **Dependency Injection**.
  - Every item the caterer manages (cook, counter, vessels) is a **bean**.
  - Usually there is **one** head cook for the whole wedding (**singleton** scope), but every guest gets a **new** plate (**prototype** scope).
