infosysRelevance: "Depth topic for SP: 'Can Java have memory leaks?' and 'strong vs weak vs soft vs phantom references' are good follow-ups after garbage collection."
otherCompanies: "Common in product-company and senior backend interviews, especially around caches, ThreadLocal and production OutOfMemoryError debugging."
why: |
  Many beginners believe **"Java has a garbage collector, so it can't leak memory."** That's wrong, and interviewers love to check it.

  The GC frees only **unreachable** objects. If your code **accidentally keeps a reference** to objects it no longer needs, the GC must keep them. Memory slowly fills up until the app crashes with **`OutOfMemoryError`**, usually at 2 a.m. in production.

  In this lesson you'll learn:
  - What a memory leak means **in Java**, and the most common causes.
  - The **four reference types**: strong, soft, weak, phantom. They let you tell the GC "keep this only if memory allows" or "don't keep this just because of me".
  - How to find leaks with a **heap dump**.
analogy: |
  Think of your **phone's photo gallery**.

  - A **strong reference** is a photo in your **"Favourites" album**. The phone will never delete it to free space, even when storage is full. (If you favourite everything, storage fills up: that's a memory leak.)
  - A **soft reference** is a **cached thumbnail**. The phone keeps it while there's space, but deletes it when storage is running low.
  - A **weak reference** is a **"recently viewed" link**. It doesn't keep the photo alive at all: as soon as you delete the actual photo, the link stops working at the next cleanup.
  - A **phantom reference** is a **"photo deleted" notification**. You can never open the photo through it; it only tells you "it's gone now, clean up anything related".

  A **memory leak** is like an app that copies every photo into a hidden folder "just in case" and never cleans it. Your phone isn't broken; the app is holding onto things it doesn't need.
