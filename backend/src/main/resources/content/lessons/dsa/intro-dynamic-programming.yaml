  modelAnswer: |
    Dynamic programming means: remember the answers to small questions so you never solve them twice. If you know 1+1+...+1 eight times is 8, then adding one more is just 9, no recounting. It works when the same subproblems repeat and the big answer is built from small answers. You can do it top-down, recursion with a notebook called memoization, or bottom-up, filling a table with loops. For climbing stairs with 1 or 2 steps, dp of i is the number of ways to reach step i. The last move came from i minus 1 or i minus 2, so dp of i equals dp of i minus 1 plus dp of i minus 2, with dp of 0 and dp of 1 equal to 1. That's O(n) instead of exponential.
