    - "I explained idempotency with a processed-ID check"
    - "I mentioned a dead letter queue or retries with backoff"
  modelAnswer: |
    A queue is like the order rail in a restaurant kitchen. The waiter, the producer, hangs the slip and goes back to customers immediately, so customers don't wait. Cooks, the consumers, take slips at their own speed, and during a rush the slips just pile up instead of chaos. If a cook crashes before marking a slip done, the slip goes back on the rail, so a dish might be made twice; that's at-least-once delivery. So a smart cook checks the slip number first and skips it if it's already done; that's idempotency. Slips that fail again and again go to a separate tray, the dead letter queue.
flashcards:
  - front: "3 reasons to use a message queue"
    back: "Decoupling services, fast API replies (async work), absorbing spikes (plus retries for reliability)."
  - front: "At-most-once vs at-least-once"
    back: "At-most-once: may lose messages. At-least-once: never loses, but may duplicate. Most systems use at-least-once."
  - front: "How to make a consumer idempotent"
    back: "Unique message ID + check a processed-IDs store (unique constraint) before acting; or make the write itself idempotent."
  - front: "put vs offer, take vs poll"
    back: "put/take wait (block). offer returns false when full; poll returns null when empty."
  - front: "Kafka ordering rule"
    back: "Order is guaranteed only within a partition; use the same key (e.g. orderId) to keep related events in order."
keyTakeaways:
  - "Queues decouple services, speed up responses and absorb traffic spikes."
  - "Point-to-point: one consumer per message. Pub/sub: every subscriber group gets it."
  - "Kafka is a retained, partitioned log for high-throughput events; RabbitMQ is a flexible task queue."
  - "At-least-once delivery plus idempotent consumers gives effectively-once processing."
  - "Use retries with backoff and a dead letter queue for failing messages."
  - "Java's BlockingQueue shows the producer-consumer idea: put/take block, offer/poll don't."
