  - id: q3
    type: SPOT_THE_BUG
    prompt: "This binary search returns -1 for a = {1, 3} and target = 3. What is the bug?"
    code: |
      int lo = 0, hi = a.length - 1;
      while (lo < hi) {
          int mid = lo + (hi - lo) / 2;
          if (a[mid] == target) return mid;
          if (a[mid] < target) lo = mid + 1;
          else hi = mid - 1;
      }
      return -1;
    options:
      - "mid should be (lo + hi) / 2"
      - "With hi = a.length - 1 and hi = mid - 1, the loop must be while (lo <= hi); otherwise the last remaining element is never checked"
      - "lo should start at 1"
      - "It should be lo = mid instead of lo = mid + 1"
    answer: 1
    explanation: "After the first step lo = hi = 1, but lo < hi is false, so index 1 (value 3) is never compared. With an inclusive hi, use lo <= hi. Changing to lo = mid would cause an infinite loop, and (lo + hi) / 2 only adds an overflow risk."
  - id: q4
    type: PREDICT_OUTPUT
    prompt: "Lower bound and upper bound on a = {1, 3, 3, 3, 3, 7, 9} for the value 3. What is printed?"
    code: |
      int lo = 0, hi = d.length;
      while (lo < hi) { int mid = lo + (hi - lo) / 2; if (d[mid] < 3) lo = mid + 1; else hi = mid; }
      int first = lo;
      lo = 0; hi = d.length;
      while (lo < hi) { int mid = lo + (hi - lo) / 2; if (d[mid] <= 3) lo = mid + 1; else hi = mid; }
      System.out.println(first + " " + lo + " " + (lo - first));
    options: ["1 5 4", "1 4 3", "0 5 5", "1 5 5"]
    answer: 0
    explanation: "Lower bound is the first index with value >= 3: index 1. Upper bound (with <=) is the first index with value > 3: index 5 (value 7). The count of 3s is 5 - 1 = 4. \"1 4 3\" confuses upper bound with the last index of 3."
  - id: q5
    type: MCQ
    prompt: "Which sort is guaranteed O(n log n) in the worst case AND stable?"
    code: null
    options: ["Quick sort", "Merge sort", "Selection sort", "Heap sort"]
    answer: 1
    explanation: "Merge sort is O(n log n) in every case and stable when merging with <=. Quick sort's worst case is O(n^2); heap sort is O(n log n) but not stable; selection sort is O(n^2) and not stable."
  - id: q6
    type: TRUE_FALSE
    prompt: "Arrays.sort on an array of objects (e.g. String[]) is stable in Java."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Object arrays and Collections.sort use TimSort, which is stable. Primitive arrays use Dual-Pivot Quicksort, which is not stable, but for plain numbers you cannot tell equal values apart anyway."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Fill the overflow-safe middle index calculation."
    code: |
      int lo = 0, hi = a.length - 1;
      while (lo <= hi) {
          int mid = ____;
          if (a[mid] == target) return mid;
          if (a[mid] < target) lo = mid + 1;
          else hi = mid - 1;
      }
    acceptedAnswers: ["lo + (hi - lo) / 2", "lo+(hi-lo)/2", "(lo + hi) >>> 1", "(lo+hi)>>>1"]
    explanation: "lo + (hi - lo) / 2 never exceeds hi, so it can't overflow. (lo + hi) / 2 overflows when both are near Integer.MAX_VALUE (e.g. 2,000,000,000 + 2,100,000,000 wraps to a negative number). (lo + hi) >>> 1 also works because the unsigned shift treats the overflowed bits correctly."
  - id: q8
    type: MATCH
    prompt: "Match each algorithm to its worst-case time"
    pairs:
      - left: "Binary search"
        right: "O(log n)"
      - left: "Merge sort"
        right: "O(n log n)"
      - left: "Quick sort (bad pivots)"
        right: "O(n^2)"
      - left: "Linear search"
        right: "O(n)"
    explanation: "Binary search halves the range each step. Merge sort always does log n levels of O(n) work. Quick sort degrades when partitions are always lopsided. Linear search may check every element."
