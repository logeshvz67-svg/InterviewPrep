explanation: |
  ### What is HTTP?
  **HTTP (HyperText Transfer Protocol)** is an **application-layer** protocol for clients and servers to exchange data (HTML, JSON, images). It runs on top of TCP (port **80**); HTTPS uses port **443**.
  - **Client-server**: the client always sends a request, the server sends a response.
  - **Stateless**: each request is independent; the server does not remember earlier requests by itself. We add memory using cookies, sessions or tokens.

  ### Structure of a request
  1. **Request line**: `METHOD path version`, e.g. `GET /products?id=5 HTTP/1.1`
  2. **Headers**: key-value metadata (`Host`, `Content-Type`, `Authorization`, `Cookie`)
  3. **Blank line**
  4. **Body** (optional): data, usually JSON, for POST/PUT/PATCH

  ### Structure of a response
  1. **Status line**: `HTTP/1.1 200 OK`
  2. **Headers**: `Content-Type`, `Set-Cookie`, `Cache-Control`
  3. **Blank line**
  4. **Body**: the HTML/JSON/image

  ### HTTP methods
  | Method | Purpose | Has body? | Safe? | Idempotent? |
  |---|---|---|---|---|
  | GET | Read a resource | No | Yes | Yes |
  | POST | Create / submit data | Yes | No | No |
  | PUT | Replace a resource fully | Yes | No | Yes |
  | PATCH | Update part of a resource | Yes | No | Not guaranteed |
  | DELETE | Delete a resource | Usually no | No | Yes |
  | HEAD | Like GET but headers only | No | Yes | Yes |
  | OPTIONS | Ask which methods are allowed (used in CORS) | No | Yes | Yes |

  - **Safe**: does not change data on the server.
  - **Idempotent**: doing it once or many times has the **same effect** on the server. Deleting order 42 twice still leaves order 42 deleted. Sending POST "create order" twice creates two orders, so POST is not idempotent.

  **GET vs POST**: GET sends data in the URL (query string), is cached and bookmarked, has URL length limits and should never be used for passwords. POST sends data in the body, is not cached by default, and is used to create or submit.

  **PUT vs PATCH**: PUT replaces the whole resource (missing fields may be cleared); PATCH changes only the given fields.

  ### Status codes
  | Range | Meaning | Common codes |
  |---|---|---|
  | 1xx | Informational | 100 Continue, 101 Switching Protocols |
  | 2xx | Success | **200 OK**, **201 Created**, **204 No Content** |
  | 3xx | Redirection | **301 Moved Permanently**, **302 Found**, **304 Not Modified** |
  | 4xx | Client error | **400 Bad Request**, **401 Unauthorized** (not logged in), **403 Forbidden** (logged in, no permission), **404 Not Found**, 405 Method Not Allowed, 409 Conflict, 429 Too Many Requests |
  | 5xx | Server error | **500 Internal Server Error**, 502 Bad Gateway, **503 Service Unavailable**, 504 Gateway Timeout |
  Trick: **4xx = you (client) did something wrong; 5xx = the server failed.**

  ### Useful headers
  - `Host`: which website (one server can host many sites).
  - `Content-Type`: format of the body (`application/json`, `text/html`).
  - `Accept`: formats the client wants back.
  - `Authorization`: credentials, e.g. `Bearer <token>`.
  - `Cookie` / `Set-Cookie`: send / store cookies.
  - `Cache-Control`: caching rules.
  - `User-Agent`: which browser or app.

  ### Cookies, sessions and tokens
  HTTP is stateless, so how does the server know you are logged in?
  - **Session + cookie**: after login, the server stores your session in memory/DB and sends `Set-Cookie: SESSIONID=abc`. The browser automatically sends that cookie with every request. State lives **on the server**.
  - **Token (e.g. JWT, JSON Web Token)**: after login, the server gives a **signed token** containing your user id and expiry. The client sends it in `Authorization: Bearer <token>`. The server only **verifies the signature**; no session storage needed, so it scales easily across many servers. Harder to revoke before expiry.
  | | Session cookie | JWT token |
  |---|---|---|
  | State stored | Server | Inside the token (client side) |
  | Sent how | Automatically by browser (Cookie header) | Usually by code (Authorization header) |
  | Scaling | Needs shared session store | Stateless, easy |
  | Logout / revoke | Easy (delete session) | Hard until expiry |
  | Main risk | CSRF (use SameSite, CSRF tokens) | Token theft (XSS); keep expiry short |

  ### HTTPS and the TLS handshake (simple version)
  **HTTPS = HTTP + TLS (Transport Layer Security)**. It gives:
  - **Encryption**: nobody in between (public Wi-Fi) can read the data.
  - **Integrity**: data cannot be changed silently.
  - **Authentication**: you are really talking to `bank.com`, proved by a **certificate** signed by a trusted **Certificate Authority (CA)**.

  Two kinds of encryption:
  - **Asymmetric** (public key + private key): slow, used only at the start to agree on a key safely.
  - **Symmetric** (one shared key): fast, used for all the actual data.

  Handshake, simplified:
  1. **Client Hello**: "Hi, I support these TLS versions and ciphers", plus a random value and key-share.
  2. **Server Hello + certificate**: server picks the cipher, sends its certificate (containing its public key) and its key-share.
  3. **Verify**: the browser checks the certificate: signed by a trusted CA? right domain? not expired?
  4. **Key exchange**: both sides compute the same **session key** (using Diffie-Hellman key exchange) without ever sending it directly.
  5. **Finished**: both confirm, and from now on all HTTP data is encrypted with the fast symmetric session key.

  ### HTTP versions (one line each)
  - **HTTP/1.1**: persistent (keep-alive) connections; one request at a time per connection.
  - **HTTP/2**: binary, **multiplexing** many requests on one connection, header compression.
  - **HTTP/3**: runs over **QUIC** (built on UDP) for faster connection setup and less blocking.

  ### Link to REST
  **REST** is a style for designing APIs over HTTP: URLs name **resources** (nouns like `/orders/42`), HTTP **methods** are the actions, responses use **status codes**, and each request is **stateless**. Example: `GET /orders/42` reads, `POST /orders` creates (201), `PUT /orders/42` replaces, `DELETE /orders/42` deletes (204). You'll build exactly this with Spring Boot `@RestController`.
tinyCode:
  code: |
    public class ParseRequest {
        public static void main(String[] args) {
            String raw = "POST /api/orders HTTP/1.1\r\n"
                       + "Host: food.in\r\n"
                       + "Content-Type: application/json\r\n"
                       + "Cookie: SESSIONID=abc123\r\n"
                       + "\r\n"
                       + "{\"item\":\"dosa\",\"qty\":1}";

            String[] parts = raw.split("\r\n\r\n", 2);       // headers | body
            String[] lines = parts[0].split("\r\n");
            String[] requestLine = lines[0].split(" ");

            System.out.println("Method:  " + requestLine[0]);
            System.out.println("Path:    " + requestLine[1]);
            System.out.println("Version: " + requestLine[2]);
            for (int i = 1; i < lines.length; i++) {
                String[] kv = lines[i].split(": ", 2);
                System.out.println("Header " + kv[0] + " = " + kv[1]);
            }
            System.out.println("Body:    " + parts[1]);
        }
    }
  walkthrough: |
    - `raw` is a real-looking HTTP request as plain text. HTTP/1.1 lines end with `\r\n` (carriage return + new line).
    - An empty line (`\r\n\r\n`) separates the **headers** from the **body**, so we split on it once.
    - The first line is the **request line**: method, path, version separated by spaces.
    - Each remaining line is a **header** in `Name: value` form.
    - Output:
    ```
    Method:  POST
    Path:    /api/orders
    Version: HTTP/1.1
    Header Host = food.in
    Header Content-Type = application/json
    Header Cookie = SESSIONID=abc123
    Body:    {"item":"dosa","qty":1}
    ```
    Web servers like Tomcat (inside Spring Boot) do this parsing for you, then hand your controller the method, path, headers and body.
