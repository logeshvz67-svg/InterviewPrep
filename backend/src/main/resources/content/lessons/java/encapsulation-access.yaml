why: |
  **Encapsulation** is the OOP pillar you use in every single class you write. Interviewers ask:
  - What is encapsulation? How is it different from abstraction?
  - What are the four access modifiers? Fill in the "who can see what" table.
  - Why make fields `private` and add getters and setters?
  - What is a package, and what does `protected` really allow?

  Getting the access table exactly right is easy marks in MCQs, and explaining *why* we hide data shows you think like a real developer.
analogy: |
  Think of your **bank account**.

  - Your **balance** is kept **private** inside the bank's system. You can't walk into the vault and change the number yourself.
  - To change it, you use **public counters**: deposit and withdraw. The cashier **checks the rules** (no negative deposit, no withdrawing more than you have).
  - That is encapsulation: **data locked inside, controlled doors (methods) outside**.

  **Access modifiers** are like the areas of the bank: the **vault** (private: only the bank's own staff), the **staff room** (default: only staff of the same branch, i.e. the same package), the **regional office** (protected: same branch plus trained staff from child branches) and the **public lobby** (public: anyone).
