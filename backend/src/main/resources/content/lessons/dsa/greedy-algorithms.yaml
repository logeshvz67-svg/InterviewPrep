infosysRelevance: "Useful for SP and DSE preparation: scheduling, interval and 'minimum number of steps' problems often have a short greedy solution, and knowing when greedy FAILS saves you from wrong answers."
otherCompanies: "Activity selection and coin change are common basic questions in TCS-style rounds; product companies ask jump game, meeting rooms, gas station and interval merging, and expect you to justify why greedy is correct."
why: |
  A **greedy algorithm** builds the answer step by step, and at each step it picks **what looks best right now**, without ever going back to change an earlier choice.

  When greedy works, it is wonderful: the code is short, usually just **sort + one loop**, and runs in **O(n log n)** or **O(n)**.

  The danger: greedy **looks** right far more often than it **is** right. A classic interview trap is coin change with unusual coins, where the greedy answer is wrong. So this lesson teaches two things:
  - the common greedy problems and their exact rule (sort by **end** time, track the **farthest** reach, and so on),
  - how to **check** whether greedy is safe, and what to use when it isn't (dynamic programming, next lesson).
analogy: |
  Think of a **Kabaddi or cricket team captain picking players** in the school playground. Each turn, the captain picks the **best player still available**. No planning, no going back.

  For some goals (strongest team overall) that works fine. But imagine the rule is "the team needs exactly one wicketkeeper". Picking the best batsman every turn may leave you with no keeper at the end. The local best choice didn't lead to the global best answer.

  Greedy algorithms are that captain. Your job is to know **when the captain's simple rule is guaranteed to work**.
