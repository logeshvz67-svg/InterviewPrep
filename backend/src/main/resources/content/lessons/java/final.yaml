                       ^
      arr[0] = 99;     | contents can change: [ 99 | 2 | 3 ]  OK
      arr = new int[5];                          COMPILE ERROR

    final on ...   | what is locked
    ---------------+---------------------------------------
    variable       | value / reference: assign only once
    method         | cannot be overridden in a child class
    class          | cannot be extended (no subclasses)

    final    -> keyword (lock)
    finally  -> block after try/catch, (almost) always runs
    finalize -> old Object method for GC clean-up, deprecated
  caption: "final locks the variable (the arrow), not the object it points to. final, finally and finalize are three unrelated things."
