infosysRelevance: "A common design question for SP and DSE: 'How do you make a class immutable?' tests final, encapsulation and defensive copies together."
otherCompanies: "Frequently asked at product companies and TCS (often right after 'Why is String immutable?')."
why: |
  "**How would you create an immutable class in Java?**" is a favourite design question. It looks easy ("make the fields final"), but the follow-up catches most people:

  > "Your class has a `List` field. I pass you a list, then change my list. Did your 'immutable' object just change?"

  This lesson brings together things you already know: `final`, `private`, encapsulation, pass-by-value and shallow vs deep copy. Immutable objects are everywhere: `String`, `Integer`, `LocalDate`, records. They are **thread-safe**, **safe as HashMap keys** and **easy to reason about**.
analogy: |
  An immutable object is like a **printed and laminated certificate**.

  - Once it's printed, **nobody can change the marks** on it. If your marks are revised, the college **prints a new certificate**; it doesn't edit the old one.
  - When you submit it for a job, you give a **photocopy**, not the original. Whatever the company scribbles on the photocopy, your original is safe. That's a **defensive copy**.
  - And when the college prints it, it copies your marks from the mark sheet **onto the certificate**. If someone later edits the mark sheet, the certificate doesn't change. That's copying **in the constructor**.
