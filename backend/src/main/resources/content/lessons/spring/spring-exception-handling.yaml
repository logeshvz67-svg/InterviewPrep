        }
    }

    @RestControllerAdvice
    class Handler {
        @ExceptionHandler(ApiException.class)
        ProblemDetail api(ApiException ex) {
            return ProblemDetail.forStatusAndDetail(ex.status, ex.getMessage());
        }

        @ExceptionHandler(Exception.class)
        ProblemDetail any(Exception ex) {
            return ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, "Something went wrong");
        }
    }

    public class AdvicePredict {
        public static void main(String[] args) throws Exception {
            MockMvc mvc = MockMvcBuilders.standaloneSetup(new TopicController())
                    .setControllerAdvice(new Handler()).build();
            System.out.println(mvc.perform(get("/api/topics/7")).andReturn().getResponse().getStatus());
            System.out.println(mvc.perform(get("/api/topics/99")).andReturn().getResponse().getStatus());
            System.out.println(mvc.perform(get("/api/topics/abc")).andReturn().getResponse().getStatus());
            System.out.println(mvc.perform(delete("/api/topics/7")).andReturn().getResponse().getStatus());
        }
    }
  expectedOutput: |
    200
    404
    500
    500
  explanation: |
    `/7` works: 200. `/99` throws ApiException, and the specific handler returns 404. The surprises are the last two. `/abc` cannot become a Long, so Spring throws `MethodArgumentTypeMismatchException`, and DELETE throws `HttpRequestMethodNotSupportedException`. Without any advice, Spring would answer 400 and 405. But the catch-all `@ExceptionHandler(Exception.class)` catches them first and turns them into **500**. That is exactly why your project's `GlobalExceptionHandler` has separate handlers for type mismatches (400), unsupported methods (405) and unknown URLs (404) next to its catch-all.
commonMistakes:
  - "Catching exceptions in the controller and returning 200 with an error message. The client thinks the call succeeded."
  - "Sending ex.getMessage() or stack traces of unexpected errors to the client. Log them; send a polite generic 500 message."
  - "Adding a catch-all Exception handler without handlers for framework exceptions, so bad input and wrong methods turn into 500 instead of 400/405."
  - "Using 500 for client mistakes (validation, not found, duplicate). 4xx means the client must change something; 5xx means the server failed."
  - "Expecting @RestControllerAdvice to catch errors thrown inside security filters. Filters run before controllers; handle 401/403 in the security configuration."
  - "Forgetting @RestControllerAdvice on the handler class. The @ExceptionHandler methods are then never used."
interviewBox:
  why: "Why interviewers ask this: error handling shows whether you build APIs that clients can rely on, and whether you think about security (no leaked internals)."
  questions:
    - q: "How do you handle exceptions globally in Spring Boot?"
      a: "I create one class with @RestControllerAdvice and add @ExceptionHandler methods for each exception type. Each method returns a ProblemDetail with the right status code. My services throw a custom ApiException with a status, like notFound or conflict, and the handler converts it. There is also a catch-all for unexpected errors that logs the stack trace and returns a generic 500 message."
    - q: "What is ProblemDetail?"
      a: "It's Spring's class for the RFC 7807 standard error format. It has type, title, status, detail and instance, and I can add extra properties like a map of field errors. Using it means every error from my API has the same JSON shape with content type application/problem+json."
    - q: "@ControllerAdvice vs @RestControllerAdvice?"
      a: "@RestControllerAdvice is @ControllerAdvice plus @ResponseBody, so the handler return values are written as JSON. For REST APIs I use @RestControllerAdvice."
    - q: "If two handlers can handle an exception, which one runs?"
      a: "The one whose exception type is closest to the thrown exception in the class hierarchy. So a handler for ApiException beats a handler for Exception, regardless of the order in the file."
    - q: "Which status code for validation errors, not found, duplicate email and unexpected errors?"
      a: "400 Bad Request for validation, 404 Not Found when the resource doesn't exist, 409 Conflict for a duplicate email, and 500 Internal Server Error for unexpected bugs, with no internal details in the response."
quiz:
  - id: q1
    type: MCQ
    prompt: "What does @RestControllerAdvice do?"
    code: null
    options:
      - "Gives advice to developers in the IDE"
      - "Holds @ExceptionHandler methods that apply to all controllers, writing their return values as JSON"
      - "Makes every controller method transactional"
      - "Validates request bodies automatically"
    answer: 1
    explanation: "It is a global place for exception handlers (and a few other cross-controller features), with @ResponseBody included. It has nothing to do with transactions or validation itself; it handles the exceptions those features throw."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "The advice has handlers for ApiException and for Exception. The service throws ApiException.notFound(\"Topic\") (status 404). What status does the client get?"
    code: |
      @RestControllerAdvice
      class Handler {
          @ExceptionHandler(Exception.class)
          ProblemDetail any(Exception ex) {
              return ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, "Oops");
          }

          @ExceptionHandler(ApiException.class)
          ProblemDetail api(ApiException ex) {
              return ProblemDetail.forStatusAndDetail(ex.getStatus(), ex.getMessage());
          }
      }
    options: ["404", "500", "200", "The app fails to start: two handlers match"]
    answer: 0
    explanation: "Spring chooses the closest matching exception type, not the first method in the file. ApiException is more specific than Exception, so api() runs and returns 404. Two handlers for DIFFERENT types is normal; only two for the SAME type would be ambiguous."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "What is wrong with this controller method?"
    code: |
      @PostMapping("/api/users")
      String register(@Valid @RequestBody RegisterRequest req) {
          try {
              service.register(req);
              return "ok";
          } catch (Exception e) {
              return "error: " + e.getMessage();
          }
      }
    options:
      - "Nothing; catching every exception is the safest choice"
      - "It returns 200 even on failure and can leak internal messages; let exceptions reach the global handler for proper status codes"
      - "@Valid cannot be used with try/catch"
      - "The method must be void"
    answer: 1
    explanation: "The client sees 200 for a duplicate email or even a database crash, and e.getMessage() may expose SQL or table names. Throw (or let through) exceptions and let @RestControllerAdvice return 409, 500 and so on in one consistent format."
  - id: q4
    type: SPOT_THE_BUG
    prompt: "Services throw ApiException.notFound(...), but clients get 500 with Spring's default error instead of 404. Why?"
    code: |
      public class GlobalExceptionHandler {

          @ExceptionHandler(ApiException.class)
          public ProblemDetail handleApi(ApiException ex) {
              return ProblemDetail.forStatusAndDetail(ex.getStatus(), ex.getMessage());
          }
      }
    options:
      - "ProblemDetail cannot be returned from a handler"
      - "The class is missing @RestControllerAdvice, so Spring never registers its handlers"
      - "ApiException must be a checked exception"
      - "The method must be static"
    answer: 1
    explanation: "Without @RestControllerAdvice (or @ControllerAdvice) the class is not a bean and Spring never looks at its @ExceptionHandler methods, so ApiException escapes as an unhandled RuntimeException: 500. ProblemDetail return values are fully supported."
  - id: q5
    type: TRUE_FALSE
    prompt: "A request with no JWT token is rejected by the security filter chain. Your @RestControllerAdvice handler for AuthenticationException will build that 401 response."
    options: ["True", "False"]
    answer: 1
    explanation: "False. Security filters run before the DispatcherServlet and controllers, so controller advice never sees that exception. That is why SecurityConfig sets an authenticationEntryPoint that writes the 401 ProblemDetail itself."
  - id: q6
    type: MATCH
    prompt: "Match each exception to the status your GlobalExceptionHandler returns"
    pairs:
      - left: "MethodArgumentNotValidException"
        right: "400 with an errors map per field"
      - left: "ApiException.conflict(...)"
        right: "409"
      - left: "HttpRequestMethodNotSupportedException"
        right: "405"
      - left: "NoResourceFoundException"
        right: "404"
      - left: "Any other Exception"
        right: "500 with a generic message"
    explanation: "Specific handlers keep the right 4xx codes; the catch-all is only for real bugs and never shows internal details."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Complete the handler so it runs for every ApiException thrown by any controller."
    code: |
      @RestControllerAdvice
      public class GlobalExceptionHandler {
          @____(ApiException.class)
          public ProblemDetail handleApi(ApiException ex) {
              return ProblemDetail.forStatusAndDetail(ex.getStatus(), ex.getMessage());
          }
      }
    acceptedAnswers: ["ExceptionHandler", "@ExceptionHandler"]
    explanation: "@ExceptionHandler(ApiException.class) maps that exception type (and its subclasses) to this method."
