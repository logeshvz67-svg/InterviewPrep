    answer: 0
    explanation: "peek just reads index 0, so O(1). poll removes the root and sinks the last element down the tree, at most log n swaps. 'Both O(1)' is tempting but forgets the re-heapify step."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "This is meant to print the 2 largest numbers. What is wrong?"
    code: |
      int[] nums = {4, 9, 1, 7};
      PriorityQueue<Integer> pq = new PriorityQueue<>();
      for (int n : nums) pq.offer(n);
      System.out.println(pq.poll() + " " + pq.poll());
    options:
      - "PriorityQueue cannot store int values"
      - "The default PriorityQueue is a min-heap, so it prints the 2 smallest (1 4); use Collections.reverseOrder()"
      - "poll() must be replaced by peek()"
      - "offer() must be replaced by push()"
    answer: 1
    explanation: "Java's PriorityQueue is a min-heap by default, so this prints 1 4. Pass Collections.reverseOrder() to get 9 7. Autoboxing handles int values fine, and PriorityQueue has no push() method."
  - id: q4
