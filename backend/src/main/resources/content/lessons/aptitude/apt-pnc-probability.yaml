explanation: |
  ### 1. Counting principle: AND multiply, OR add
  - 3 shirts **and** 4 trousers -> 3 x 4 = **12** outfits.
  - Travel by one of 3 buses **or** one of 2 trains -> 3 + 2 = **5** ways.

  ### 2. Factorial
  `n! = n x (n-1) x ... x 1`, and `0! = 1`. It counts ways to arrange n different things in a row: n choices for the 1st place, n-1 for the 2nd, and so on. 5! = **120**.

  ### 3. Permutations (order matters)
  `nPr = n! / (n-r)!` = ways to arrange r things chosen from n.
  **Worked**: President and secretary from 5 people: 5P2 = 5 x 4 = **20**.

  ### 4. Combinations (order does not matter)
  `nCr = n! / (r! (n-r)!)`.
  **Why divide by r!**: every group of r people appears r! times among the permutations (in every order). Dividing removes the repeats.
  **Worked**: Choose 2 people from 5 for a team: 5C2 = 20 / 2 = **10**.
  **Useful fact**: `nCr = nC(n-r)`. Choosing 2 to include is the same as choosing 3 to leave out: 5C2 = 5C3 = 10.

  **Worked (committee)**: 3 men and 2 women from 6 men and 5 women: 6C3 x 5C2 = 20 x 10 = **200** (AND -> multiply).

  ### 5. Arrangements with repeated letters
  Divide by the factorial of each repeat count. **Why**: swapping identical letters does not make a new word.
  - LEVEL: 5 letters, L twice, E twice -> 5! / (2! x 2!) = **30**.
  - BANANA: 6 letters, A three times, N twice -> 6! / (3! x 2!) = **60**.

  ### 6. Things that must stay together
  Glue them into **one block**, arrange the blocks, then arrange inside the block.
  **Worked**: ORANGE with vowels (O, A, E) together: block + R, N, G = 4 items -> 4! = 24; inside the block 3! = 6. Total **144**.

  ### 7. Circular arrangements
  n people around a round table: `(n - 1)!`. **Why**: rotating everyone one seat gives the same arrangement, so fix one person and arrange the rest. 6 people -> 5! = **120**.

  ### 8. Probability
  `P(event) = favourable outcomes / total outcomes`, always between 0 and 1.
  - **Complement**: P(not A) = 1 - P(A). Great for "at least one".
  - **Independent events** (one does not affect the other): P(A and B) = P(A) x P(B).
  - **OR with overlap**: P(A or B) = P(A) + P(B) - P(A and B).

  **Worked (dice)**: two dice, sum 7: 6 of 36 outcomes -> **1/6**. Sum 8: (2,6), (3,5), (4,4), (5,3), (6,2) -> **5/36**.
  **Worked (coins)**: 3 coins, at least one head: 1 - P(no heads) = 1 - 1/8 = **7/8**.
  **Worked (cards)**: one card from 52; king or heart: 4 + 13 - 1 (king of hearts counted twice) = 16 -> 16/52 = **4/13**.
  **Worked (bag)**: 4 red, 6 blue balls; draw 2 without putting back; both red: 4C2 / 10C2 = 6/45 = **2/15**.
tinyCode:
  code: |
    public class Counting {
        static long fact(int n) {
            long f = 1;
            for (int i = 2; i <= n; i++) f *= i;
            return f;
        }
        static long nPr(int n, int r) { return fact(n) / fact(n - r); }
        static long nCr(int n, int r) { return fact(n) / (fact(r) * fact(n - r)); }

        public static void main(String[] args) {
            System.out.println("5P2 = " + nPr(5, 2) + ", 5C2 = " + nCr(5, 2));
            System.out.println("Committee = " + nCr(6, 3) * nCr(5, 2));
            System.out.println("BANANA = " + fact(6) / (fact(3) * fact(2)));
            System.out.println("Round table of 6 = " + fact(5));

            int sevens = 0;
            for (int a = 1; a <= 6; a++)
                for (int b = 1; b <= 6; b++)
                    if (a + b == 7) sevens++;
            System.out.println("Sum 7: " + sevens + "/36");
        }
    }
  walkthrough: |
    - `fact` multiplies 2 x 3 x ... x n. We use `long` because factorials grow very fast (13! is already bigger than an `int` can hold).
    - `nPr` and `nCr` are the formulas exactly as in the lesson.
    - Committee: 6C3 x 5C2 = 20 x 10 = 200 (AND -> multiply).
    - BANANA: 720 / (6 x 2) = 60.
    - Round table: (6 - 1)! = 120.
    - The two nested loops try **every** dice pair (36 of them) and count the ones that add to 7. Brute force like this is a great way to confirm a formula.
    - Output:
    ```
    5P2 = 20, 5C2 = 10
    Committee = 200
    BANANA = 60
    Round table of 6 = 120
    Sum 7: 6/36
    ```
tryIt:
  instructions: "Type this program (no pasting). It checks 'at least one head in 3 coins' by listing all 8 outcomes, and counts LEVEL arrangements by formula. Run it and compare with the lesson."
  code: |
    public class CoinsAndWords {
        public static void main(String[] args) {
            int total = 0, atLeastOneHead = 0;
            for (int c1 = 0; c1 <= 1; c1++)
                for (int c2 = 0; c2 <= 1; c2++)
                    for (int c3 = 0; c3 <= 1; c3++) {
                        total++;
                        if (c1 + c2 + c3 >= 1) atLeastOneHead++;
                    }
            System.out.println("At least one head: " + atLeastOneHead + "/" + total);

            int fact5 = 5 * 4 * 3 * 2 * 1;
            System.out.println("LEVEL arrangements: " + fact5 / (2 * 2));
        }
    }
predict:
  code: |
    public class Predict {
        public static void main(String[] args) {
            int perm = 5 * 4;
            int comb = perm / (2 * 1);
            int eights = 0;
            for (int a = 1; a <= 6; a++)
                for (int b = 1; b <= 6; b++)
                    if (a + b == 8) eights++;
            System.out.println(comb + " " + perm);
            System.out.println(eights);
        }
    }
  expectedOutput: |
    10 20
    5
  explanation: |
    - 5P2 = 5 x 4 = **20**, and 5C2 = 20 / 2! = **10**. The program prints comb first, so the line is `10 20`.
    - Pairs with sum 8: (2,6), (3,5), (4,4), (5,3), (6,2) -> **5**. (1 cannot be used: 1 + 7 is impossible.)
commonMistakes:
  - "Using permutations when order does not matter (choosing a team) or combinations when it does (ranks, positions)."
  - "Adding when you should multiply. 'AND' (both choices together) multiplies; 'OR' adds."
  - "Forgetting to divide by repeats in words like BANANA or LEVEL."
  - "Using n! instead of (n-1)! for a round table."
  - "Counting the king of hearts twice in 'king or heart'. Subtract the overlap."
  - "Calculating 'at least one' case by case. Use 1 - P(none)."
interviewBox:
  why: "Why this is practised: counting and probability check careful, structured thinking, and the same ideas power backtracking and combinatorics in coding rounds."
  questions:
    - q: "What is the difference between a permutation and a combination? (practice question)"
      a: "A permutation counts arrangements, where order matters, like first, second and third place. A combination counts selections, where order does not matter, like choosing three people for a team. Since each group of r items can be arranged in r factorial ways, nCr equals nPr divided by r factorial."
    - q: "How many subsets does a set of n elements have? (practice question)"
      a: "2 to the power n. For each element there are two choices, include it or not, and the choices multiply. That is also why generating all subsets in code takes O(2^n) time."
    - q: "What is the probability of at least one head when tossing 3 coins? (practice question)"
      a: "7/8. It is easier to use the opposite: the only case with no heads is tail-tail-tail, which is 1 of 8 outcomes. So the answer is 1 minus 1/8."
