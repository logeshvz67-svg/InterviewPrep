explanation: |
  ### What makes a problem greedy-friendly?
  Two properties (you don't need formal proofs, but you should be able to say them):
  1. **Greedy choice property**: there is always a best answer that **includes** the greedy choice. ("Some optimal schedule contains the meeting that ends first.")
  2. **Optimal substructure**: after making that choice, the rest is a **smaller version** of the same problem.

  A quick way to argue it in an interview is an **exchange argument**: "Take any optimal answer. If it doesn't use my greedy choice, I can swap its first choice for mine without making it worse. So greedy is never worse."

  And the quick way to **break** greedy: try **small counterexamples** (3 to 4 items) by hand before you code.

  ### Pattern 1: activity selection (maximum non-overlapping meetings)
  **Rule: sort by END time, then pick every meeting that starts after the last picked one ends.**
  ```java
  Arrays.sort(m, (a, b) -> Integer.compare(a[1], b[1]));   // earliest end first
  int count = 0, lastEnd = Integer.MIN_VALUE;
  for (int[] meet : m) {
      if (meet[0] >= lastEnd) {     // use > if touching times count as a clash
          count++;
          lastEnd = meet[1];
      }
  }
  ```
  **Why end time?** Finishing earliest leaves the room free for the longest time. Sorting by **start** time fails: one long meeting starting at 0 can block many short ones. Sorting by **duration** also fails (a short meeting can overlap two others). Time **O(n log n)** for the sort.

  The same idea gives: "minimum number of intervals to remove so the rest don't overlap" = n - (max non-overlapping).

  ### Pattern 2: meeting rooms (minimum rooms needed)
  Sort all start times and all end times separately. Walk through starts; before each new start, free every room whose meeting has already ended.
  ```java
  Arrays.sort(start); Arrays.sort(end);
  int rooms = 0, maxRooms = 0, j = 0;
  for (int i = 0; i < n; i++) {
      while (j < n && end[j] <= start[i]) { rooms--; j++; }
      rooms++;
      maxRooms = Math.max(maxRooms, rooms);
  }
  ```
  The answer is the **maximum number of meetings running at the same time**. (A min-heap of end times also works.) O(n log n).

  ### Pattern 3: jump game (can you reach the end?)
  `nums[i]` = maximum jump length from index i. Track the **farthest index reachable so far**.
  ```java
  int farthest = 0;
  for (int i = 0; i < nums.length; i++) {
      if (i > farthest) return false;            // can't even reach i
      farthest = Math.max(farthest, i + nums[i]);
  }
  return true;
  ```
  One pass, **O(n)** time, O(1) space. Trying every jump with recursion would be exponential.

  ### Pattern 4: coin change, and when greedy fails
  "Pay an amount with the fewest coins": greedy takes the **largest coin that fits**, again and again.
  - With Indian currency (2000, 500, 200, 100, 50, 20, 10, 5, 2, 1), greedy **is optimal**. These are called **canonical** coin systems.
  - With coins **{4, 3, 1}** and amount 6, greedy gives 4 + 1 + 1 = **3 coins**, but 3 + 3 = **2 coins** is better. Greedy is **wrong**.
  - For arbitrary coins, use **dynamic programming** (next lesson), which tries every last-coin option.

  ### More greedy classics (recognise them)
  | Problem | Greedy rule |
  |---|---|
  | Fractional knapsack (you may take part of an item) | sort by value/weight, take the best ratio first |
  | Minimum platforms at a railway station | same as meeting rooms |
  | Assign cookies / match small to small | sort both, two pointers |
  | Gas station (circular route) | if the tank goes negative, restart from the next station |
  | Huffman coding | always merge the two smallest frequencies (min-heap) |

  Note: **0/1 knapsack** (take a whole item or nothing) is **not** greedy; it needs DP.

  ### Greedy vs DP at a glance
  | | Greedy | Dynamic programming |
  |---|---|---|
  | Decisions | one choice per step, never undone | tries all choices, keeps the best |
  | Speed | usually O(n) or O(n log n) | usually O(n x something) |
  | Correct when | greedy choice property holds | overlapping subproblems + optimal substructure |
  | Example | activity selection, jump game | coin change (any coins), 0/1 knapsack |

  ### Complexity summary
  | Problem | Time | Space |
  |---|---|---|
  | Activity selection | O(n log n) | O(1) extra (sort aside) |
  | Meeting rooms | O(n log n) | O(n) |
  | Jump game | O(n) | O(1) |
  | Greedy coin change (canonical coins) | O(number of coins + answer) | O(1) |
tinyCode:
  code: |
    import java.util.*;

    public class Greedy {
        // max number of non-overlapping meetings
        static int maxMeetings(int[][] m) {
            Arrays.sort(m, (a, b) -> Integer.compare(a[1], b[1]));   // earliest END first
            int count = 0, lastEnd = Integer.MIN_VALUE;
            for (int[] meet : m) {
                if (meet[0] >= lastEnd) {        // starts after the last chosen one ends
                    count++;
                    lastEnd = meet[1];
                }
            }
            return count;
        }

        // minimum rooms so that no meetings clash
        static int minRooms(int[][] m) {
            int n = m.length;
            int[] start = new int[n], end = new int[n];
            for (int i = 0; i < n; i++) { start[i] = m[i][0]; end[i] = m[i][1]; }
            Arrays.sort(start);
            Arrays.sort(end);
            int rooms = 0, maxRooms = 0, j = 0;
            for (int i = 0; i < n; i++) {
                while (j < n && end[j] <= start[i]) { rooms--; j++; }   // free finished rooms
                rooms++;
                maxRooms = Math.max(maxRooms, rooms);
            }
            return maxRooms;
        }

        // can we reach the last index? nums[i] = max jump from i
        static boolean canJump(int[] nums) {
            int farthest = 0;
            for (int i = 0; i < nums.length; i++) {
                if (i > farthest) return false;  // stuck: i is unreachable
                farthest = Math.max(farthest, i + nums[i]);
            }
            return true;
        }

        public static void main(String[] args) {
            int[][] meetings = {{1, 3}, {2, 5}, {4, 7}, {6, 9}, {8, 10}};
            System.out.println("max meetings = " + maxMeetings(meetings));
            System.out.println("rooms needed = " + minRooms(meetings));
            System.out.println(canJump(new int[]{2, 3, 1, 1, 4}) + " " + canJump(new int[]{3, 2, 1, 0, 4}));
        }
    }
  walkthrough: |
    - **maxMeetings** sorts by end time with a comparator on `a[1]`. It picks [1,3], skips [2,5] (starts at 2, before 3), picks [4,7], skips [6,9], picks [8,10]: **3** meetings.
    - **minRooms** sorts starts `[1, 2, 4, 6, 8]` and ends `[3, 5, 7, 9, 10]`. At start 1: 1 room. At 2: nothing has ended, 2 rooms. At 4: the meeting ending at 3 is over, so we free one and use it again; still 2. The count never goes above **2**.
    - **canJump**:
      - `[2, 3, 1, 1, 4]`: from index 1 we can reach index 4, so `true`.
      - `[3, 2, 1, 0, 4]`: every path lands on index 3, whose value is 0. `farthest` stays 3, so at i = 4 we have `4 > 3` and return `false`.

    Output:
    ```
    max meetings = 3
    rooms needed = 2
    true false
    ```
tryIt:
  instructions: "Type this greedy coin counter. It is correct for Indian notes but wrong for coins {4, 3, 1}. After running, try amount 10 with coins {6, 5, 1}: greedy gives 5 coins, but 5 + 5 needs only 2."
  code: |
    public class CoinGreedy {
        static int greedyCoins(int[] coins, int amount) {   // coins sorted big to small
            int count = 0;
            for (int c : coins) {
                while (amount >= c) {
                    amount -= c;
                    count++;
                }
            }
            return amount == 0 ? count : -1;
        }

        public static void main(String[] args) {
            int[] rupees = {2000, 500, 200, 100, 50, 20, 10, 5, 2, 1};
            System.out.println("Rs 2789 -> " + greedyCoins(rupees, 2789) + " notes/coins");

            int[] odd = {4, 3, 1};
            System.out.println("6 with {4,3,1} -> " + greedyCoins(odd, 6) + " coins (best is 2: 3+3)");
        }
    }
