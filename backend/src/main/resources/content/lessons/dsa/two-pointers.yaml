explanation: |
  ### What is a pointer here?
  A **pointer** here is just an **int index** into an array or String (not a memory pointer like in C). "Moving a pointer" means `left++` or `right--`.

  ### Variant 1: opposite ends
  Start one pointer at the **start** and one at the **end**, and move them **towards each other**. Stop when they meet.

  **Pair with target sum in a SORTED array**
  ```java
  int left = 0, right = arr.length - 1;
  while (left < right) {
      int sum = arr[left] + arr[right];
      if (sum == target) return new int[]{left, right};
      else if (sum < target) left++;    // need a bigger sum
      else right--;                     // need a smaller sum
  }
  return new int[]{-1, -1};             // no pair
  ```
  **Why is it safe to skip?** The array is sorted. If `sum < target`, then `arr[left]` paired with **any** element at or before `right` is also too small, so `arr[left]` can never be part of the answer. We drop it with `left++`. The same logic applies to `right--`. Every step removes one candidate, so at most n steps: **O(n)**.

  > The array **must be sorted** for this. Unsorted? Sort first (O(n log n)), or use a HashMap (lesson on hashing).

  **Reverse an array in place**
  ```java
  int l = 0, r = arr.length - 1;
  while (l < r) {
      int tmp = arr[l]; arr[l] = arr[r]; arr[r] = tmp;
      l++; r--;
  }
  ```
  **In place** means using the same array, with no new array: O(1) extra space.

  **Palindrome check**: compare `s.charAt(l)` and `s.charAt(r)` moving inwards; any mismatch means "not a palindrome".

  ### Variant 2: same direction (slow and fast)
  Both pointers start at the left. The **fast** pointer reads every element; the **slow** pointer marks where the next "kept" element should be written.

  **Remove duplicates from a SORTED array** (return the count of unique values; they are moved to the front)
  ```java
  int slow = 0;
  for (int fast = 1; fast < arr.length; fast++) {
      if (arr[fast] != arr[slow]) {
          slow++;
          arr[slow] = arr[fast];
      }
  }
  return slow + 1;   // number of unique elements (array must be non-empty)
  ```
  Other same-direction problems: move all zeros to the end, remove a given value, merge two sorted arrays (one pointer in each array).

  ### The general template
  ```java
  // opposite ends
  int l = 0, r = n - 1;
  while (l < r) {
      if (condition met) { record answer; /* move one or both */ }
      else if (need bigger) l++;
      else r--;
  }

  // same direction
  int slow = 0;
  for (int fast = 0; fast < n; fast++) {
      if (arr[fast] should be kept) arr[slow++] = arr[fast];
  }
  ```

  ### How to recognise a two-pointer problem
  | Clue in the question | Variant |
  |---|---|
  | "sorted array" + "pair / triplet with sum" | opposite ends |
  | "reverse", "palindrome", "in place from both sides" | opposite ends |
  | "remove duplicates / remove element / move zeros in place" | same direction |
  | "merge two sorted arrays/lists" | one pointer per array |
  | "O(1) extra space" required | very likely two pointers |

  ### Complexity
  | Approach | Time | Space |
  |---|---|---|
  | Brute force (all pairs) | O(n^2) | O(1) |
  | Two pointers | O(n) | O(1) |
  | Sort + two pointers (unsorted input) | O(n log n) | O(1) to O(n) depending on the sort |
tinyCode:
  code: |
    import java.util.Arrays;

    public class TwoPointers {
        // opposite ends: pair with target sum in a sorted array
        static int[] pairSum(int[] arr, int target) {
            int left = 0, right = arr.length - 1;
            while (left < right) {
                int sum = arr[left] + arr[right];
                if (sum == target) return new int[]{left, right};
                else if (sum < target) left++;
                else right--;
            }
            return new int[]{-1, -1};
        }

        // same direction: remove duplicates from a sorted array
        static int removeDuplicates(int[] arr) {
            int slow = 0;
            for (int fast = 1; fast < arr.length; fast++) {
                if (arr[fast] != arr[slow]) {
                    slow++;
                    arr[slow] = arr[fast];
                }
            }
            return slow + 1;
        }

        public static void main(String[] args) {
            int[] sorted = {1, 2, 4, 7, 11, 15};
            System.out.println(Arrays.toString(pairSum(sorted, 15)));

            int[] dup = {1, 1, 2, 2, 3};
            int k = removeDuplicates(dup);
            System.out.println(k + " " + Arrays.toString(Arrays.copyOf(dup, k)));
        }
    }
  walkthrough: |
    **pairSum** (opposite ends):
    - `left` starts at index 0, `right` at the last index.
    - If the sum is too small, only moving `left` right can increase it. If too big, only moving `right` left can decrease it.
    - For target 15: (1,15)=16 too big, (1,11)=12 too small, (2,11)=13 too small, (4,11)=15 found at indexes 2 and 4.

    **removeDuplicates** (same direction):
    - `slow` points to the last unique value written; `fast` scans everything.
    - When `fast` finds a value different from `arr[slow]`, we move `slow` forward and copy the new value there.
    - The first `k = slow + 1` positions now hold the unique values.

    Output:
    ```
    [2, 4]
    3 [1, 2, 3]
    ```
    Both run in **O(n)** time and **O(1)** extra space.
tryIt:
  instructions: "Type this palindrome checker that uses two pointers from both ends. Then try \"madam\", \"level\" and \"code\". Bonus: make it ignore uppercase/lowercase."
  code: |
    public class Palindrome {
        static boolean isPalindrome(String s) {
            int left = 0, right = s.length() - 1;
            while (left < right) {
                if (s.charAt(left) != s.charAt(right)) {
                    return false;
                }
                left++;
                right--;
            }
            return true;
        }

        public static void main(String[] args) {
            System.out.println(isPalindrome("racecar"));
            System.out.println(isPalindrome("java"));
            System.out.println(isPalindrome("abba"));
        }
    }
