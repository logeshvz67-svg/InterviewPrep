    back: "It is three steps: read, add 1, write. Two threads can interleave and lose an update."
  - front: "synchronized vs volatile"
    back: "synchronized = mutual exclusion + visibility. volatile = visibility only (no atomicity)."
  - front: "Why call wait() in a while loop?"
    back: "Spurious wakeups and other threads consuming first; the loop re-checks the condition after each wakeup."
  - front: "What happens if wait() is called without holding the lock?"
    back: "IllegalMonitorStateException."
  - front: "sleep() vs wait() and the lock"
    back: "sleep() keeps the lock; wait() releases it."
keyTakeaways:
  - "Shared mutable data + multiple threads = race conditions; count++ is not atomic."
  - "synchronized uses an object's lock: one thread at a time, and changes become visible."
  - "Instance methods lock on this, static methods on the Class object, blocks on the object you choose."
  - "volatile = visibility, not atomicity; good for flags."
  - "wait/notify must be called inside synchronized; always wait in a while loop."
