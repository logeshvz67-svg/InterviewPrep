    back: "of(null) throws NullPointerException; ofNullable(null) returns Optional.empty()."
  - front: "orElse vs orElseGet"
    back: "orElse(value): fallback always evaluated (eager). orElseGet(supplier): called only if empty (lazy)."
  - front: "get() on an empty Optional"
    back: "Throws NoSuchElementException. Prefer orElse, orElseGet, orElseThrow, ifPresent."
  - front: "Where to use Optional"
    back: "Method return types. Not fields, not parameters, not wrapping collections."
  - front: "Replace user.getAddress().getCity() null checks"
    back: "Optional.ofNullable(user).map(User::getAddress).map(Address::getCity).orElse(\"Unknown\")"
keyTakeaways:
  - "Optional is a box holding one non-null value or nothing; it makes 'no result' explicit."
  - "Create with of (non-null), ofNullable (maybe null) or empty."
  - "Chain map, filter, flatMap; finish with orElse, orElseGet, orElseThrow or ifPresent."
  - "orElse is eager, orElseGet is lazy: use orElseGet for expensive fallbacks."
  - "Use Optional for return values only; never call get() blindly."
