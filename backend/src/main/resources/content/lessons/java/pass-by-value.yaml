  code: |
    public class Main {
        public static void main(String[] args) {
            int a = 1, b = 2;
            swapWrong(a, b);
            System.out.println("a=" + a + " b=" + b);

            int[] arr = {1, 2};
            swapRight(arr, 0, 1);
            System.out.println("arr=" + arr[0] + "," + arr[1]);

            String s = "Hi";
            shout(s);
            System.out.println(s);
        }

        static void swapWrong(int x, int y) { int t = x; x = y; y = t; }

        static void swapRight(int[] v, int i, int j) { int t = v[i]; v[i] = v[j]; v[j] = t; }

        static void shout(String text) { text = text + "!!!"; }
    }
