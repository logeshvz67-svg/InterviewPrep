commonMistakes:
  - "Using LIMIT/OFFSET for Nth highest without DISTINCT, so tied salaries are counted twice."
  - "Using ROW_NUMBER or RANK for 'Nth highest distinct salary'; DENSE_RANK is the safe choice."
  - "Adding name to a GROUP BY dept_id query to get 'max salary with name'; use (dept_id, salary) IN (...) or a window function."
  - "Finding 'customers with no orders' with NOT IN when the subquery column can be NULL."
  - "Deleting duplicates without testing inside BEGIN ... ROLLBACK first."
  - "Forgetting edge cases: ties, NULL departments, and N larger than the number of distinct values."
interviewBox:
  why: "Why interviewers ask this: these are the standard 'write a query' tasks; they test whether you can combine joins, grouping, subqueries and window functions under pressure."
  questions:
    - q: "Write a query to find the second highest salary."
      a: "SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees). For a general Nth highest, I'd use DENSE_RANK() OVER (ORDER BY salary DESC) in a subquery and filter where the rank equals N, which handles ties correctly."
    - q: "How do you find and delete duplicate rows?"
      a: "To find them, GROUP BY all the columns that define a duplicate and use HAVING COUNT(*) > 1. To delete them while keeping one, I keep the minimum id in each group, for example DELETE WHERE id NOT IN (SELECT MIN(id) ... GROUP BY name, city), or I number rows with ROW_NUMBER partitioned by those columns and delete where the number is greater than 1."
    - q: "Find employees who earn more than their managers."
      a: "I self join employees: employees e joined with employees m on e.manager_id = m.emp_id, and then WHERE e.salary > m.salary. On our data that returns Divya, who earns 80000 while her manager Ravi earns 75000."
    - q: "Find the highest-paid employee in each department."
      a: "I use a window function: DENSE_RANK over PARTITION BY dept_id ORDER BY salary DESC in a subquery, and keep rank 1. That also keeps ties. Another way is WHERE (dept_id, salary) IN (SELECT dept_id, MAX(salary) FROM employees GROUP BY dept_id)."
    - q: "Find customers who have never placed an order."
      a: "LEFT JOIN customers to orders and keep rows where the order id is NULL, or use NOT EXISTS with a correlated subquery. I avoid NOT IN because a NULL in the subquery makes it return nothing."
quiz:
  - id: q1
    type: PREDICT_OUTPUT
    prompt: "Salaries: 90000, 80000, 75000, 60000, 60000, 50000, 45000. What does this return?"
    code: |
      SELECT salary
      FROM employees
      ORDER BY salary DESC
      LIMIT 1 OFFSET 4;
    options: ["50000", "60000", "45000", "75000"]
    answer: 1
    explanation: "Without DISTINCT, OFFSET 4 skips 90000, 80000, 75000 and the first 60000, landing on the second 60000. The real 5th highest distinct salary is 50000; adding DISTINCT (or using DENSE_RANK = 5) gives that."
  - id: q2
    type: PREDICT_OUTPUT
    prompt: "Which rows does this return on the sample employees table?"
    code: |
      SELECT dept_id, name, salary
      FROM (SELECT dept_id, name, salary,
                   DENSE_RANK() OVER (PARTITION BY dept_id
                                      ORDER BY salary DESC) AS dr
            FROM employees) t
      WHERE dr = 2;
    options:
      - "Divya (dept 10) and Kiran (dept 20)"
      - "Only Divya (dept 10, 80000)"
      - "Divya, Kiran and Meena"
      - "No rows"
    answer: 1
    explanation: "In dept 10 the ranks are Asha 1, Divya 2, Ravi 3. In dept 20 Kiran and Priya both earn 60000 and both get rank 1, so there is no rank 2. Dept 30 and the NULL dept have one person each."
  - id: q3
    type: SPOT_THE_BUG
    prompt: "This query should list each department's highest salary along with the employee's name, but PostgreSQL rejects it. Why?"
    code: |
      SELECT dept_id, name, MAX(salary)
      FROM employees
      GROUP BY dept_id;
    options:
      - "MAX cannot be used with GROUP BY"
      - "name is neither in GROUP BY nor inside an aggregate; use (dept_id, salary) IN (...) or a window function"
      - "dept_id must be inside MAX"
      - "You must add ORDER BY"
    answer: 1
    explanation: "The error is: column \"employees.name\" must appear in the GROUP BY clause or be used in an aggregate function. Adding name to GROUP BY would make one group per person, so the max would just be each person's own salary."
  - id: q4
    type: SPOT_THE_BUG
    prompt: "This 'customers with no orders' query returns nothing, even though Fatima has no orders. Assume orders.customer_id contains a NULL row. What's the bug?"
    code: |
      SELECT name
      FROM customers
      WHERE customer_id NOT IN (SELECT customer_id FROM orders);
    options:
      - "NOT IN can't be used with subqueries"
      - "A NULL in the subquery result makes NOT IN unknown for every customer; use NOT EXISTS or LEFT JOIN ... IS NULL"
      - "customer_id must be quoted"
      - "You need DISTINCT inside the subquery"
    answer: 1
    explanation: "x NOT IN (..., NULL) can never be true, so no rows return. NOT EXISTS and the LEFT JOIN anti-join are NULL-safe. DISTINCT doesn't remove the NULL."
  - id: q5
    type: MCQ
    prompt: "Which query finds duplicate (name, city) pairs in customer_signups?"
    code: null
    options:
      - "SELECT DISTINCT name, city FROM customer_signups"
      - "SELECT name, city, COUNT(*) FROM customer_signups GROUP BY name, city HAVING COUNT(*) > 1"
      - "SELECT name, city FROM customer_signups WHERE COUNT(*) > 1"
      - "SELECT name, city, COUNT(*) FROM customer_signups GROUP BY name HAVING COUNT(*) > 1"
    answer: 1
    explanation: "Group by every column that defines a duplicate, then HAVING COUNT(*) > 1 (Anil 3, Sneha 2). DISTINCT hides duplicates instead of finding them, COUNT in WHERE is an error, and grouping by name alone while selecting city fails the GROUP BY rule."
  - id: q6
    type: MATCH
    prompt: "Match each problem to the pattern that solves it"
    pairs:
      - left: "Nth highest distinct salary"
        right: "DENSE_RANK() and keep rank N"
      - left: "Employee earns more than manager"
        right: "Self join on manager_id"
      - left: "Customers with no orders"
        right: "LEFT JOIN ... WHERE right side IS NULL"
      - left: "Find duplicate rows"
        right: "GROUP BY ... HAVING COUNT(*) > 1"
      - left: "Running total"
        right: "SUM() OVER (ORDER BY ...)"
    explanation: "Recognising the pattern is most of the work; the SQL follows from it."
  - id: q7
    type: FILL_THE_CODE
    prompt: "Complete the classic second-highest-salary query."
    code: |
      SELECT MAX(salary)
      FROM employees
      WHERE salary < (SELECT ____(salary) FROM employees);
    acceptedAnswers: ["MAX", "max"]
    explanation: "The inner query finds the top salary (90000); the outer MAX finds the biggest salary below it, 80000."
  - id: q8
    type: TRUE_FALSE
    prompt: "In the employee-earns-more-than-manager query, an INNER self join is fine even though Asha has no manager."
    options: ["True", "False"]
    answer: 0
    explanation: "True. Asha can't earn more than a manager she doesn't have, so dropping her row doesn't change the answer. (For 'list everyone with their manager', you'd need a LEFT JOIN.)"
explainBack:
  prompt: "Explain to a friend three ways to find the Nth highest salary and why ties matter."
  rubric:
    - "I explained DENSE_RANK and why it handles ties"
    - "I explained DISTINCT + ORDER BY + LIMIT/OFFSET N-1"
    - "I explained the correlated subquery 'N-1 distinct salaries above it'"
    - "I gave the example where forgetting DISTINCT gives the wrong answer"
    - "I mentioned what happens when N is larger than the number of salaries"
  modelAnswer: |
    The cleanest way is DENSE_RANK: rank salaries from highest to lowest, where equal salaries share a rank and no numbers are skipped, then keep the row with rank N. The second way is to take distinct salaries, sort them descending, skip N minus one, and take one row with LIMIT and OFFSET. The third way is a correlated subquery: the Nth highest salary is the one with exactly N minus one distinct salaries above it. Ties matter because two people can earn 60,000; without DISTINCT, the fifth highest wrongly comes out as 60,000 instead of 50,000. If N is too big, these return no row.
flashcards:
  - front: "Nth highest salary (window way)"
    back: "SELECT DISTINCT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) dr FROM employees) t WHERE dr = N"
  - front: "Nth highest salary (LIMIT way)"
    back: "SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET N-1"
  - front: "Delete duplicates keeping lowest id"
    back: "DELETE FROM t WHERE id NOT IN (SELECT MIN(id) FROM t GROUP BY dup_columns)"
  - front: "Employees earning more than manager"
    back: "employees e JOIN employees m ON e.manager_id = m.emp_id WHERE e.salary > m.salary"
  - front: "Customers with no orders"
    back: "customers c LEFT JOIN orders o ON ... WHERE o.order_id IS NULL (or NOT EXISTS)"
  - front: "Max salary per department with names"
    back: "WHERE (dept_id, salary) IN (SELECT dept_id, MAX(salary) FROM employees GROUP BY dept_id)"
keyTakeaways:
  - "Nth highest: DENSE_RANK, DISTINCT + LIMIT/OFFSET, or a correlated COUNT(DISTINCT) subquery."
  - "Duplicates: GROUP BY the defining columns HAVING COUNT(*) > 1; delete all but MIN(id) or ROW_NUMBER() = 1."
  - "Compare a row with a related row in the same table using a self join."
  - "Per-group max with names: (col, MAX) IN subquery or a window function; ties are kept."
  - "No matching row: LEFT JOIN ... IS NULL or NOT EXISTS, never NOT IN with NULLs."
  - "Always check ties, NULLs and empty groups before saying 'done'."
