infosysRelevance: "Heavily used in coding rounds: most SP and DSE problems take an array or matrix as input, and patterns like prefix sums, two pointers and matrix traversal all build on this lesson."
otherCompanies: "Array and matrix problems (max/min, reverse, rotate, transpose, spiral) are the most common coding questions at TCS, Wipro, Cognizant, Accenture, Capgemini and product companies."
why: |
  An **array** stores many values of the same type under one name, in a fixed-size row of numbered boxes. Instead of `mark1, mark2, ... mark60`, you write `int[] marks = new int[60];`.

  Why this matters so much:
  - Most coding problems give you input as an array (1D) or a grid/matrix (2D).
  - Common interview tasks: find max/min, reverse, count frequencies, rotate, transpose a matrix, print it in spiral order.
  - MCQs ask about **default values**, `length` vs `length()`, `ArrayIndexOutOfBoundsException`, and what happens when you assign one array to another.

  Arrays are also the base for everything in DSA: two pointers, sliding window, prefix sums, sorting and binary search all work on arrays.
analogy: |
  Think of a **row of lockers at a railway station**.

  - The whole row has **one name** (the array), and each locker has a **number** starting from **0** (the index).
  - All lockers are the **same size** (one data type), and the number of lockers is **fixed** when the row is built.
  - To open locker 3, you go straight to it; you do not open lockers 0, 1 and 2 first. That is why reading `arr[3]` is instant: **O(1)**.
  - A **2D array** is like a **cinema hall**: row number and seat number (`seat[row][col]`). In Java, each row is actually its own separate row of lockers, so rows can even have different lengths.
