keyTakeaways:
  - "A class is a blueprint; an object is an instance with its own state."
  - "new allocates heap memory, sets defaults, runs the constructor and returns a reference."
  - "Variables hold references; assigning one to another shares the same object."
  - "Fields get default values; local variables must be initialised before use."
  - "Using a null reference throws NullPointerException; unreachable objects are garbage collected."
