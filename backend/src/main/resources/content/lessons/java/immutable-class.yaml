explanation: |
  ### What does immutable mean?
  An **immutable** object's state (its field values) **can never change after it's created**. To "change" it, you create a **new object** with the new values.

  You already know one: `String`.
  ```java
  String s = "hi";
  s.toUpperCase();         // returns a NEW String "HI"
  System.out.println(s);   // still "hi"
  ```

  ### Why make classes immutable?
  - **Thread-safe for free**: if nothing can change, many threads can share the object without locks.
  - **Safe as `HashMap` keys / in `HashSet`**: the hash code can never change after the object is stored.
  - **Easy to cache and share**: like the String pool and the Integer cache.
  - **Fewer bugs**: no one can change your object behind your back.
  - The cost: a new object for every change, which can mean more objects in memory.

  ### The 5 rules
  1. **Make the class `final`** so no subclass can add mutable behaviour or override methods. (Alternative: private constructor + static factory method.)
  2. **Make all fields `private` and `final`.** private = no outside access; final = assigned once.
  3. **No setters**, and no method that changes a field.
  4. **Defensive copy mutable inputs in the constructor.** Don't store the caller's `List`, array or `Date` directly; store **your own copy**.
  5. **Don't leak mutable fields from getters.** Return a copy or an unmodifiable view, never your internal object.

  Bonus: for "changes", add **`withX(...)`** methods that return a **new** object.

  ### Why `final` alone isn't enough
  ```java
  final class Student {
      private final List<String> subjects;
      Student(List<String> subjects) { this.subjects = subjects; }   // BAD
      List<String> getSubjects() { return subjects; }                // BAD
  }
  ```
  `final` only means the **reference** `subjects` can't point to another list. The **list itself** can still be changed:
  - The caller keeps its reference and does `myList.add("Hack")` -> our object changes (constructor leak).
  - Anyone calls `s.getSubjects().clear()` -> our object changes (getter leak).

  Remember pass-by-value: the constructor received a **copy of the reference**, so both point to the **same list**.

  ### The correct version
  ```java
  public final class Student {                 // rule 1
      private final String name;               // rule 2
      private final int marks;
      private final List<String> subjects;

      public Student(String name, int marks, List<String> subjects) {
          this.name = name;
          this.marks = marks;
          this.subjects = new ArrayList<>(subjects);    // rule 4: copy in
      }

      public String getName() { return name; }          // String is immutable: safe
      public int getMarks() { return marks; }           // primitive: safe
      public List<String> getSubjects() {
          return Collections.unmodifiableList(subjects); // rule 5: read-only view
      }

      public Student withMarks(int newMarks) {          // "change" = new object
          return new Student(name, newMarks, subjects);
      }
  }
  ```
  Notes:
  - Fields that are **primitives** or **immutable types** (`String`, `Integer`, `LocalDate`) need no copying.
  - Fields that are **mutable** (`List`, `Map`, arrays, `java.util.Date`, your own mutable classes) need copying.
  - `List.copyOf(list)` (Java 10+) gives an **unmodifiable copy** in one step and rejects `null` elements. If you store that, your getter can return it directly.
  - For arrays, copy with `arr.clone()` or `Arrays.copyOf(arr, arr.length)`, in **both** the constructor and the getter.
  - If the list holds **mutable objects**, a true deep immutability needs those objects to be immutable too (or copied deeply).

  ### Unmodifiable view vs copy
  | | `Collections.unmodifiableList(x)` | `new ArrayList<>(x)` / `List.copyOf(x)` |
  |---|---|---|
  | What it is | a read-only **window** onto `x` | a **separate** list |
  | Caller tries `add()` | `UnsupportedOperationException` | allowed on `new ArrayList` copy; `List.copyOf` throws |
  | If `x` changes later | the view shows the change | the copy doesn't |

  That's why the constructor must **copy**, and the getter can return a view of **our own private copy**.

  ### Records and immutability
  A `record` gives you rules 1 to 3 automatically (final class, private final fields, no setters). It is **shallowly** immutable: you still need a compact constructor with `List.copyOf(...)` for list components.
  ```java
  record Team(String name, List<String> members) {
      Team { members = List.copyOf(members); }
  }
  ```

  ### Why is String immutable? (common follow-up)
  Security (file paths, URLs, class names can't be altered after checks), the **String pool** (many variables can safely share one object), thread safety, and caching its hash code for fast `HashMap` lookups.
tinyCode:
  code: |
    import java.util.*;

    public class Main {
        public static void main(String[] args) {
            List<String> subs = new ArrayList<>(List.of("Maths", "Physics"));
            Student s1 = new Student("Asha", 80, subs);

            subs.add("Hack");
            System.out.println(s1.getSubjects());

            try {
                s1.getSubjects().add("Hack2");
            } catch (UnsupportedOperationException e) {
                System.out.println("Cannot modify subjects");
            }

            Student s2 = s1.withMarks(95);
            System.out.println(s1.getMarks() + " " + s2.getMarks());
        }
    }

    final class Student {
        private final String name;
        private final int marks;
        private final List<String> subjects;

        Student(String name, int marks, List<String> subjects) {
            this.name = name;
            this.marks = marks;
            this.subjects = new ArrayList<>(subjects);
        }

        String getName() { return name; }
        int getMarks() { return marks; }
        List<String> getSubjects() { return Collections.unmodifiableList(subjects); }

        Student withMarks(int newMarks) { return new Student(name, newMarks, subjects); }
    }
  walkthrough: |
    - The constructor stores **its own copy** of the list. So when `main` adds "Hack" to `subs`, `s1` is unaffected: it still prints `[Maths, Physics]`.
    - `getSubjects()` returns an **unmodifiable view**, so `add("Hack2")` throws `UnsupportedOperationException`, which we catch.
    - `withMarks(95)` doesn't change `s1`; it returns a **new** Student. `s1` stays 80.
    - The class is `final` and all fields are `private final`, with no setters.

    Output:
    ```
    [Maths, Physics]
    Cannot modify subjects
    80 95
    ```
