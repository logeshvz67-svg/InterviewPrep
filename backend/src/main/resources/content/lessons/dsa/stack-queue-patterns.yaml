        right: "Second stack of running minimums"
    explanation: "Brackets need the most recent opener (stack). 'Next warmer' is a next-greater problem (monotonic stack). Level by level means FIFO (queue). Constant-time min needs the minimum remembered at every height."
  - id: q8
    type: MCQ
    prompt: "Why does BFS use a queue instead of a stack?"
    code: null
    options:
      - "A queue uses less memory than a stack"
      - "A queue processes nodes in the order they were discovered, so all nodes at distance 1 are handled before distance 2"
      - "A stack cannot store graph nodes"
      - "A queue sorts the nodes automatically"
    answer: 1
    explanation: "FIFO order means closer nodes (discovered earlier) are processed first: level by level. With a stack you get depth-first behaviour instead. Memory use is similar, and neither structure sorts anything."
