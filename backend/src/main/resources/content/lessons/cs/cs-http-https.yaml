companies: [ALL]
infosysRelevance: "HTTP methods, status codes and HTTPS basics are essential for SP and DSE web/backend discussions, and they are the base for Spring REST APIs."
otherCompanies: "GET vs POST, status codes and HTTP vs HTTPS are common at TCS, Wipro, Cognizant, Accenture and Capgemini; product companies go into idempotency, cookies vs tokens and TLS."
why: |
  Every website, every mobile app, every Spring Boot REST API you will build talks using **HTTP**. If you know HTTP well, backend interviews suddenly feel familiar.

  Typical questions:
  - **GET vs POST**, **PUT vs PATCH**, what is **idempotent**?
  - What do **200, 201, 301, 401, 403, 404, 500** mean?
  - **HTTP vs HTTPS**, and how does the TLS handshake work (in simple words)?
  - **Cookies vs tokens (JWT)** for login.
analogy: |
  Think of **ordering food at a restaurant**.

  - You (the **client**) give the waiter an order slip: "GET one masala dosa, table 7". That slip is the **request**: a method (GET), a path (masala dosa), and extra notes like "less spicy" (**headers**).
  - The kitchen (the **server**) sends back the plate with a note: "200 OK, here is your dosa" or "404, dosa is not on the menu" or "500, the stove broke". That is the **response** with a **status code**.
  - The waiter doesn't remember you between orders (**stateless**). So the restaurant gives you a **token number** to show every time: that's a **cookie or token**.
  - **HTTPS** is the same conversation, but inside a **sealed envelope** that only you and the kitchen can open.
