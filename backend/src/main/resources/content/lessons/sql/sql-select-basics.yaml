infosysRelevance: "Foundation for every SQL question in DSE and SP technical rounds; you must write these queries quickly and without syntax slips."
otherCompanies: "Basic SELECT and WHERE questions are common in TCS, Wipro, Cognizant, Accenture and Capgemini technical interviews and online tests."
why: |
  Almost every company stores its data in a **database**, and **SQL (Structured Query Language)** is the language we use to ask that database questions.

  In interviews, SQL questions usually start small: *"show all employees in department 10 earning more than 50,000, highest salary first"*. If you can write that in one go, the interviewer relaxes and moves on to harder things.

  This lesson also teaches the **logical order** in which SQL runs a query. That one idea explains many confusing errors later, like *"why can't I use my column alias in WHERE?"*.

  Every lesson in SQL Caves uses the **same small tables** (employees, departments, customers, orders), so you can picture the data and check every answer by hand.
analogy: |
  Think of a **table** as a big register in a college office, like the attendance register.

  - **FROM** is choosing *which register* to open.
  - **WHERE** is your finger running down the rows, keeping only the rows you want ("only students from CSE").
  - **SELECT** is choosing *which columns* to copy onto your paper (name and phone, not everything).
  - **ORDER BY** is arranging your copied list (alphabetically, or by marks).
  - **LIMIT** is "give me only the first 3".

  You open the register first, then filter, then copy, then sort. SQL does the same.
